name: android-e2e

on:
    workflow_call:
        inputs:
            control-runner-labels:
                description: >-
                    JSON array of runner labels for the lightweight control jobs
                    (detect, status, collect, validate-manifest, cancel-queued-runs)
                    that only run Node and the GitHub API and need no self-hosted
                    hardware. Override when the org has no GitHub-hosted runners,
                    for example an ephemeral RunsOn label set.
                required: false
                type: string
                default: '["ubuntu-latest"]'
            runs-on-cache-bypass:
                description: >-
                    Run a SHA-pinned runs-on/action before any artifact traffic when
                    the job lands on a RunsOn runner started with extras=s3-cache,
                    whose cache proxy takes over the Actions results URL and makes
                    actions/upload-artifact and download-artifact fail. A no-op on
                    every other runner. Off by default.
                required: false
                type: boolean
                default: false
            e2e-result-cache:
                description: Reuse an exact successful native/bundle/test/device verdict. Opt in only for hermetic suites; errors run the suite.
                type: boolean
                required: false
                default: false
            e2e-cache-test-paths:
                description: Optional newline-separated dependency paths/globs replacing the e2e-dir tree.
                type: string
                required: false
                default: ''
            e2e-cache-state-command:
                description: Optional command whose stdout versions mutable test state, e.g. date -u +%F for date-relative fixtures. Failure disables reuse.
                type: string
                required: false
                default: ''
            e2e-cache-export-command:
                description: Optional bare-RN/custom exporter. Write bundle, config.json and assets to E2E_CACHE_EXPORT_DIR; empty uses production Expo export.
                type: string
                required: false
                default: ''
            e2e-cache-extra-paths:
                description: Newline-separated fixture and hook dependency paths outside e2e-dir (literal paths or globs; every pattern must match).
                type: string
                required: false
                default: ''
            build-runner-labels:
                description: >-
                    JSON array of self-hosted runner labels for the native build job. The
                    default is an x86_64 Linux pool (4 vCPU / 8 GiB). Google publishes no
                    linux-aarch64 NDK/cmake binaries, so a linux-aarch64 pool cannot compile
                    an app's native code.
                type: string
                required: false
                default: '["self-hosted","trf-linux-amd64-4x8"]'
            targets:
                description: >-
                    JSON array of build targets: {name, appDir, appId, prebuildCommand}.
                    prebuildCommand may be an empty string. Optional per target:
                    tolerateTestFailures and buildStrategy, defaulting to the
                    tolerate-test-failures and build-strategy input.
                type: string
                required: true
            artifact-retention-days:
                description: >-
                    Retention in days of the e2e report artifact.
                type: number
                required: false
                default: 7
            cmdline-tools-version:
                description: See build-android-app README — pin explicitly, do not trust upstream defaults.
                type: string
                required: false
                default: '12266719'
            gradle-task:
                description: See build-android-app README — gradlew task to build, e.g. :app:assembleRelease to scope to one module.
                type: string
                required: false
                default: assembleRelease
            gradle-args:
                description: See build-android-app README — extra whitespace-split arguments appended after gradle-task.
                type: string
                required: false
                default: ''
            turbo-version:
                description: >-
                    Exact turbo npm version for the detect job. Empty resolves the
                    repository's own turbo from its lockfile, else 2.10.8.
                type: string
                required: false
                default: ''
            target-packages:
                description: >-
                    Newline-separated package names gating this pipeline on pull_request
                    events. Empty derives them from the name in each targets[].appDir's
                    package.json.
                type: string
                required: false
                default: ''
            exempt-paths:
                description: >-
                    Newline- or comma-separated git pathspec globs, relative to the
                    repository root (e.g. docs/**, **/*.md). A pull request whose every
                    changed file matches one skips the run without turbo detection.
                type: string
                required: false
                default: ''
            trigger-paths:
                description: >-
                    Newline- or comma-separated git pathspec globs, relative to the
                    repository root (e.g. .github/workflows/e2e.yml). A pull request that
                    changes a matching file runs without turbo detection; ** runs every
                    pull request. Wins over exempt-paths.
                type: string
                required: false
                default: ''
            force-label:
                description: >-
                    Pull request label that runs the pipeline regardless of affected packages;
                    the status job then reports the run as forced. Add `labeled` to the caller's
                    pull_request trigger types so adding the label starts a run. Empty (default)
                    never forces.
                type: string
                required: false
                default: ''
            expo-fingerprint-version:
                type: string
                required: false
                default: '0.20.6'
            android-abis:
                description: >-
                    Comma-separated ABIs the native build compiles, passed to Gradle
                    as -PreactNativeArchitectures. 'auto' (default) is arm64-v8a,
                    the ABI of the farm's emulators; when gradle-args or build-env already
                    pins reactNativeArchitectures, auto leaves it to that pin.
                    Empty compiles the project's own reactNativeArchitectures
                    (every ABI in a stock project). Part of the native key, so
                    seed-native-cache.yml must resolve to the same ABIs.
                type: string
                required: false
                default: auto
            e2e-dir:
                description: >-
                    Directory, relative to the repository root, holding the e2e
                    project: its package.json, lockfile and e2e config.
                type: string
                required: true
            e2e-runner-labels:
                description: >-
                    JSON array of runner labels for the e2e job. It drives remote
                    devices, so any Linux runner with Node and network access to
                    simlock-url will do; give it the CPU the e2e-workers need (the
                    runner hosts one test worker per leased device). Empty (default)
                    falls back to repack-runner-labels.
                type: string
                required: false
                default: ''
            e2e-node-version:
                description: >-
                    Node.js version the e2e job runs the e2e project with, independent
                    of node-version, which builds the app: tester-army e2e needs
                    22.22.3+ on Node 22, or 24.8+.
                type: string
                required: false
                default: '^24.8.0'
            e2e-install-command:
                description: Command run in e2e-dir to install the e2e project's dependencies.
                type: string
                required: false
                default: npm ci --no-audit --no-fund
            e2e-command:
                description: >-
                    Command run in e2e-dir to run the suite. It gets E2E_PLATFORM, E2E_APP_PATH
                    (the .apk), E2E_APP_ID, E2E_TARGET, E2E_WORKERS, E2E_RETRIES,
                    E2E_SESSION (unique per platform, job attempt and target), SIMLOCK_URL and
                    SIMLOCK_TOKEN in its environment, and must write its report under
                    e2e-dir/.e2e, which the job uploads.
                type: string
                required: false
                default: npx e2e run --target android
            e2e-workers:
                description: >-
                    Devices leased and tests run at once per target (E2E_WORKERS).
                    Size it to the farm's Android capacity: each worker holds one
                    emulator for the whole run.
                type: string
                required: false
                default: '1'
            e2e-retries:
                description: Retries per failed test inside the run (E2E_RETRIES).
                type: string
                required: false
                default: '1'
            e2e-timeout-minutes:
                description: Timeout of the e2e job.
                type: number
                required: false
                default: 60
            simlock-url:
                description: >-
                    Base URL of the simlock gateway or worker the e2e suite leases
                    Android devices from (SIMLOCK_URL), e.g. https://simlock.vitaliiyehorov.dev.
                   
                type: string
                required: true
            node-version:
                type: string
                required: false
                default: 22.x
            install-command:
                type: string
                required: false
                default: yarn install --immutable
            enable-corepack:
                type: boolean
                required: false
                default: true
            package-manager:
                description: >-
                    JS package manager driving pnpm provisioning and, in the jobs
                    that configure one, actions/setup-node's dependency cache.
                    Leave empty to auto-detect at the repository root, in order: an
                    explicit value here, then package.json's
                    devEngines.packageManager / packageManager field (needs jq on
                    the runner), then exactly one root lockfile (yarn.lock,
                    pnpm-lock.yaml, package-lock.json / npm-shrinkwrap.json). No
                    match, an ambiguous
                    match, or an unsupported value fails the job. install-command
                    must match the resolved manager (e.g. pnpm install
                    --frozen-lockfile). Resolving to pnpm additionally requires a
                    pnpm version declared in package.json (packageManager or
                    devEngines.packageManager) because pnpm/action-setup reads it
                    from there; the corepack step is then skipped.
                type: string
                required: false
                default: ''
            build-command:
                description: Optional workspace JS build command run at repo root before the native build.
                type: string
                required: false
                default: ''
            build-env:
                description: >-
                    Newline-separated KEY=VALUE pairs appended to $GITHUB_ENV at the
                    start of the build job. Rejects (fails closed) any line without
                    '=' or whose name does not match ^[A-Za-z_][A-Za-z0-9_]*$.
                type: string
                required: false
                default: ''
            build-strategy:
                description: >-
                    How this pull request gets the APK its e2e suite installs.
                    `auto` (the default) computes the native key, looks up the base
                    binary published for it, and repacks that base with this
                    commit's JavaScript; only a key with no published base, or an
                    unusable base, runs Gradle — and when it does on the default
                    branch, the base it builds is published for the next run.
                    `repack` refuses to run Gradle at all: a missing base fails the
                    build. `native` is the escape hatch and a regression — every
                    pull request then rebuilds the APK, and that run publishes no
                    base. See docs/repack.md.
                type: string
                required: false
                default: auto
            repack-runner-labels:
                description: >-
                    JSON array of self-hosted runner labels for the repack job. The
                    default is the 2 vCPU / 4 GiB x86_64 Linux pool without /dev/kvm
                    (trf-linux-amd64-2x4), so these jobs never queue on the scarce KVM
                    emulator lane (#169). Keep it an x86_64 pool: Google publishes
                    Android build-tools for x86_64 Linux only. Move it to the 4x8 pool
                    if bundling the app's JavaScript needs more than about 3 GiB.
                type: string
                required: false
                default: '["self-hosted","trf-linux-amd64-2x4"]'
            native-build-label:
                description: >-
                    Pull-request label forcing build-strategy: native for that one
                    pull request. Set together with build-strategy: repack it fails
                    closed rather than silently picking a winner.
                type: string
                required: false
                default: 'mobile: force native build'
            base-backend:
                description: >-
                    Where base binaries live: `ghcr` (default, an immutable OCI
                    artifact needing packages:write to publish and packages:read to
                    fetch) or `artifact` (workflow artifacts, default-branch runs
                    only, needing actions:read). See expo-base-binary.
                type: string
                required: false
                default: ghcr
            base-flavor:
                description: Flavor segment of the base binary's address.
                type: string
                required: false
                default: e2e
            fingerprint-config:
                description: >-
                    Path, relative to a target's appDir, of the @expo/fingerprint
                    config whose ignore list is the correctness boundary of every
                    repack. Its hash is part of the native key. See docs/repack.md.
                type: string
                required: false
                default: fingerprint.config.js
            fingerprint-env:
                description: >-
                    Newline-separated KEY=VALUE pairs exported while the native key
                    is computed, for an app.config that branches on env. Must be
                    byte-identical to what the warm-up passes, or the two never
                    agree on a key and every pull request rebuilds the APK.
                type: string
                required: false
                default: ''
            repack-env:
                description: >-
                    Newline-separated KEY=VALUE pairs exported for the re-bundle, so
                    the consumer's app.config writes this build's API URL, version
                    and build number into the repacked APK.
                type: string
                required: false
                default: ''
            expect-config:
                description: >-
                    Newline-separated <dotted.path>=<value> assertions the repacked
                    APK's embedded app.config must satisfy exactly. Every value
                    repack-env is expected to have rewritten belongs here: a config
                    rewrite nobody checked is a repack nobody can trust.
                type: string
                required: false
                default: ''
            repack-app-version:
                description: Pinned @expo/repack-app npm version.
                type: string
                required: false
                default: '0.7.2'
            repack-timeout-minutes:
                type: number
                required: false
                default: 30
            android-build-tools-dir:
                description: >-
                    Path to the Android SDK build-tools directory holding zipalign
                    and apksigner, used by the repack job. Leave empty to use the
                    android-build-tools-version directory the repack job installs
                    under the SDK.
                type: string
                required: false
                default: ''
            android-build-tools-version:
                description: >-
                    Android build-tools version the repack job installs via
                    android-actions/setup-android, for the zipalign and apksigner a
                    repacked APK is aligned and signed with. The Gradle build
                    installs whatever its compileSdkVersion resolves to; the repack
                    job never runs Gradle, so it asks for build-tools explicitly.
                type: string
                required: false
                default: '35.0.0'
            android-keystore-path:
                description: >-
                    Keystore, relative to a target's appDir, the repacked APK is
                    signed with. The default is the React Native debug keystore an
                    `expo prebuild` app ships and Gradle signs its release build
                    with - sign the repack with anything else and the emulator
                    refuses to install it over the base. These are the published
                    debug-keystore constants, not secrets; a release key belongs in
                    native-publish.yml, never here. Empty leaves @expo/repack-app's
                    own default in place.
                type: string
                required: false
                default: android/app/debug.keystore
            android-keystore-password:
                description: Password of android-keystore-path. Ignored when that is empty.
                type: string
                required: false
                default: android
            android-keystore-key-alias:
                description: Key alias inside android-keystore-path. Ignored when that is empty.
                type: string
                required: false
                default: androiddebugkey
            android-keystore-key-password:
                description: Key password inside android-keystore-path. Ignored when that is empty.
                type: string
                required: false
                default: android
            build-timeout-minutes:
                type: number
                required: false
                default: 60
            tolerate-test-failures:
                description: >-
                    true keeps the e2e job green when the suite fails, for a
                    time-boxed quarantine of a known-broken suite. The failure is still
                    reported as a ::warning:: on the job. Defaults to false; a target's
                    own tolerateTestFailures wins over it.
                type: boolean
                required: false
                default: false
            call-scope:
                description: >-
                    Names this call's artifacts, plans and concurrency group, so a caller
                    can run this workflow several times in one run, e.g. once per package
                    in a matrix, without the calls overwriting or cancelling each other.
                    Calls that share a run must each set a distinct, non-empty value.
                    Letters, digits, '.', '_' and single '-' between them. Empty (default)
                    keeps today's names.
                type: string
                required: false
                default: ''

        secrets:
            build-secrets-env:
                description: >-
                    Masked newline-separated KEY=VALUE entries (KEY<<DELIMITER for a
                    multi-line value) exported, after build-env, in every job that
                    installs, bundles or compiles the app: the plan/repack leg and
                    the native build. For what a real build needs but a log must
                    never show - a remote turbo cache token, a Maps API key compiled
                    into the base. Only a SHA-256 digest of the entries enters the
                    native key, so rotating one moves the key, and the warm-up must
                    be passed the same secret or the two never agree on a key.
                required: false
            e2e-secrets-env:
                description: >-
                    Masked newline-separated KEY=VALUE entries (one line each, no
                    multi-line values) exported to the e2e job's environment. For
                    test-user passwords and the credentials a suite uses to prepare
                    the backend under test.
                required: false
            simlock-token:
                description: >-
                    simlock agent token the e2e suite leases Android devices with
                    (SIMLOCK_TOKEN). Give
                    each consuming repository its own token.
                required: true
        outputs:
            result:
                description: >-
                    The status job's verdict: passed, failed, or skipped when no
                    target package was affected (a skip is a green check, not a pass).
                value: ${{ jobs.status.outputs.result }}
            e2e-artifact-prefix:
                description: >-
                    The e2e report artifact's name up to its target: the report of
                    target foo is this plus foo. Pass it to download-artifact rather
                    than rebuilding the name.
                value: e2e-android${{ jobs.detect.outputs.artifact-scope }}-

concurrency:
    group: android-e2e-${{ github.workflow }}-${{ inputs.e2e-dir }}-${{ inputs.call-scope }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    detect:
        name: Detect affected packages
        runs-on: ${{ fromJSON(inputs.control-runner-labels) }}
        permissions:
            contents: read
            actions: read
        outputs:
            affected: ${{ steps.affected.outputs.affected }}
            forced: ${{ steps.affected.outputs.forced }}
            build-strategy: ${{ steps.build-strategy.outputs.strategy }}
            targets: ${{ steps.targets.outputs.targets }}
            artifact-scope: ${{ steps.targets.outputs.artifact-scope }}
            android-abis: ${{ steps.android-abis.outputs.abis }}
            android-abi-key: ${{ steps.android-abis.outputs.key-segment }}
        steps:
            - name: Apply RunsOn cache bypass
              uses: rnw-community/mobile-ci/actions/runs-on-cache-bypass@v5.0.0 # v5.0.0
              with:
                  enabled: ${{ inputs.runs-on-cache-bypass }}
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ inputs.node-version }}
            - uses: rnw-community/mobile-ci/actions/turbo-affected@v5.0.0 # v5.0.0
              id: affected
              with:
                  turbo-version: ${{ inputs.turbo-version }}
                  target-packages: ${{ inputs.target-packages }}
                  targets: ${{ inputs.targets }}
                  base-sha: ${{ github.event.pull_request.base.sha }}
                  always-affected: ${{ inputs.e2e-result-cache || github.event_name != 'pull_request' }}
                  exempt-paths: ${{ inputs.exempt-paths }}
                  trigger-paths: ${{ inputs.trigger-paths }}
                  force-label: ${{ inputs.force-label }}

            - name: Resolve the Android ABIs
              id: android-abis
              shell: bash
              env:
                  ANDROID_ABIS: ${{ inputs.android-abis }}
                  GRADLE_ARGS: ${{ inputs.gradle-args }}
                  BUILD_ENV: ${{ inputs.build-env }}
              run: |
                  set -euo pipefail
                  fail() {
                    echo "::error::$1"
                    exit 1
                  }

                  pinned=''
                  pinned_by=''
                  pin() {
                    if [ -n "$pinned" ] && [ "$pinned" != "$1" ]; then
                      fail "reactNativeArchitectures is pinned to '$pinned' by $pinned_by and to '$1' by $2. Gradle would build one set of ABIs while the native key describes another; pin it once."
                    fi
                    pinned="$1"
                    pinned_by="$2"
                  }

                  normalized_gradle_args="${GRADLE_ARGS//$'\n'/ }"
                  normalized_gradle_args="${normalized_gradle_args//$'\r'/ }"
                  read -r -a gradle_args <<< "$normalized_gradle_args"
                  for arg in ${gradle_args[@]+"${gradle_args[@]}"}; do
                    case "$arg" in
                      -PreactNativeArchitectures=*) pin "${arg#*=}" gradle-args ;;
                    esac
                  done
                  while IFS= read -r line; do
                    case "$line" in
                      ORG_GRADLE_PROJECT_reactNativeArchitectures=*) pin "${line#*=}" build-env ;;
                    esac
                  done <<< "$BUILD_ENV"

                  case "$ANDROID_ABIS" in
                    auto)
                      if [ -n "$pinned" ]; then
                        abis=''
                        echo "android-abis is auto and $pinned_by already pins reactNativeArchitectures to '$pinned'; it is left to $pinned_by."
                      else
                        abis=arm64-v8a
                      fi
                      ;;
                    '')
                      abis=''
                      ;;
                    *)
                      abis="$ANDROID_ABIS"
                      if [ -n "$pinned" ] && [ "$pinned" != "$abis" ]; then
                        fail "android-abis is '$abis' but $pinned_by pins reactNativeArchitectures to '$pinned'. Gradle would build one set of ABIs while the native key describes another; drop one of the two."
                      fi
                      ;;
                  esac

                  if [ -n "$abis" ]; then
                    IFS=, read -r -a abi_list <<< "$abis"
                    case "$abis" in
                      ,*|*,|*,,*) abi_list=('') ;;
                    esac
                    for abi in "${abi_list[@]}"; do
                      case "$abi" in
                        armeabi-v7a|arm64-v8a|x86|x86_64) ;;
                        *) fail "android-abis resolved to '$abis', which is not a comma-separated list of armeabi-v7a, arm64-v8a, x86 and x86_64 without spaces." ;;
                      esac
                    done
                  fi

                  built="${abis:-$pinned}"
                  key_segment=''
                  if [ -n "$built" ]; then
                    key_segment="-abi-$built"
                  fi
                  echo "Android ABIs: ${built:-every ABI the project declares}"
                  {
                    echo "abis=$abis"
                    echo "built=$built"
                    echo "key-segment=$key_segment"
                  } >> "$GITHUB_OUTPUT"

            - name: Validate the e2e call
              uses: rnw-community/mobile-ci/actions/e2e-suite@v5.0.0 # v5.0.0
              with:
                  mode: validate
                  platform: android
                  abis: ${{ steps.android-abis.outputs.built }}
                  e2e-dir: ${{ inputs.e2e-dir }}
                  workers: ${{ inputs.e2e-workers }}
                  retries: ${{ inputs.e2e-retries }}
                  simlock-url: ${{ inputs.simlock-url }}
                  simlock-token: ${{ secrets.simlock-token }}

            - name: Resolve the build strategy
              id: build-strategy
              shell: bash
              env:
                  REQUESTED_STRATEGY: ${{ inputs.build-strategy }}
                  NATIVE_BUILD_LABEL: ${{ inputs.native-build-label }}
                  PULL_REQUEST_LABELS: ${{ github.event_name == 'pull_request' && toJSON(github.event.pull_request.labels.*.name) || '[]' }}
              run: |
                  set -euo pipefail
                  case "$REQUESTED_STRATEGY" in
                    auto|repack|native) ;;
                    *)
                      echo "::error::build-strategy must be 'auto', 'repack' or 'native'; got '$REQUESTED_STRATEGY'."
                      exit 1
                      ;;
                  esac

                  strategy="$REQUESTED_STRATEGY"
                  labelled=false
                  if [ -n "$NATIVE_BUILD_LABEL" ]; then
                    labelled=$(jq -r --arg label "$NATIVE_BUILD_LABEL" 'map(select(. == $label)) | length > 0' <<< "$PULL_REQUEST_LABELS")
                  fi

                  if [ "$labelled" = 'true' ]; then
                    if [ "$REQUESTED_STRATEGY" = 'repack' ]; then
                      echo "::error::build-strategy is 'repack', which forbids compiling native code, but this pull request carries the '$NATIVE_BUILD_LABEL' label, which demands it. Remove one of the two rather than letting the workflow pick a winner."
                      exit 1
                    fi
                    strategy=native
                    echo "::notice::'$NATIVE_BUILD_LABEL' is set on this pull request, so native code is compiled instead of a published base being repacked. No base binary is published by this run."
                  fi

                  if [ "$strategy" = 'native' ]; then
                    echo "::warning::This run compiles native code for every target. That is the escape hatch, not the norm: it takes a full native build slot a repack would not have needed. See docs/repack.md."
                  fi

                  echo "strategy=$strategy" >> "$GITHUB_OUTPUT"
                  echo "Build strategy: $strategy (requested '$REQUESTED_STRATEGY')."

            - name: Resolve each target's quarantine and build strategy
              id: targets
              shell: bash
              env:
                  TARGETS: ${{ inputs.targets }}
                  TOLERATE_TEST_FAILURES: ${{ inputs.tolerate-test-failures }}
                  REQUESTED_STRATEGY: ${{ inputs.build-strategy }}
                  NATIVE_BUILD_LABEL: ${{ inputs.native-build-label }}
                  PULL_REQUEST_LABELS: ${{ github.event_name == 'pull_request' && toJSON(github.event.pull_request.labels.*.name) || '[]' }}
                  CALL_SCOPE: ${{ inputs.call-scope }}
              run: |
                  set -euo pipefail
                  if [ -n "$CALL_SCOPE" ] && ! [[ "$CALL_SCOPE" =~ ^[A-Za-z0-9._]+(-[A-Za-z0-9._]+)*$ ]]; then
                    echo "::error::call-scope '$CALL_SCOPE' must be letters, digits, '.' and '_', with single '-' only between them, so no two calls' artifact names can collide."
                    exit 1
                  fi
                  labelled=false
                  if [ -n "$NATIVE_BUILD_LABEL" ]; then
                    labelled=$(jq -r --arg label "$NATIVE_BUILD_LABEL" 'map(select(. == $label)) | length > 0' <<< "$PULL_REQUEST_LABELS")
                  fi
                  jq_error="$RUNNER_TEMP/resolve-targets.err"
                  if ! targets="$(jq -c --argjson tolerate "$TOLERATE_TEST_FAILURES" \
                    --arg strategy "$REQUESTED_STRATEGY" --argjson labelled "$labelled" --arg label "$NATIVE_BUILD_LABEL" '
                    if type != "array" or length == 0 then error("targets must be a non-empty JSON array of objects") else . end
                    | map(
                        if type != "object" then error("every targets entry must be an object; got \(tojson)") else . end
                        | (if has("tolerateTestFailures") then . else .tolerateTestFailures = $tolerate end)
                        | if (.tolerateTestFailures | type) != "boolean" then error("target \(.name | tojson) tolerateTestFailures must be true or false; got \(.tolerateTestFailures | tojson)") else . end
                        | (if has("buildStrategy") then . else .buildStrategy = $strategy end)
                        | if (.buildStrategy | IN("auto", "repack", "native") | not) then error("target \(.name | tojson) buildStrategy must be \"auto\", \"repack\" or \"native\"; got \(.buildStrategy | tojson)") else . end
                        | if $labelled and .buildStrategy == "repack" then error("target \(.name | tojson) has buildStrategy repack, which forbids compiling native code, but this pull request carries the \"\($label)\" label, which demands it. Remove one of the two rather than letting the workflow pick a winner.") else . end
                        | if $labelled then .buildStrategy = "native" else . end)' \
                    <<< "$TARGETS" 2> "$jq_error")"; then
                    echo "::error::$(sed -E 's/^jq: error \(at [^)]*\): //' "$jq_error")"
                    exit 1
                  fi
                  native="$(jq -r '[.[] | select(.buildStrategy == "native") | .name] | join(", ")' <<< "$targets")"
                  if [ -n "$native" ]; then
                    echo "::notice::Compiled natively, never repacked: ${native}."
                  fi
                  {
                    echo "targets=$targets"
                    echo "artifact-scope=${CALL_SCOPE:+-$CALL_SCOPE-}"
                  } >> "$GITHUB_OUTPUT"


    plan:
        name: Plan the build strategy
        needs: detect
        if: needs.detect.outputs.affected == 'true'
        permissions:
            contents: read
            packages: read
            actions: read
        uses: rnw-community/mobile-ci/.github/workflows/expo-base-plan.yml@v5.0.0 # v5.0.0
        with:
            control-runner-labels: ${{ inputs.control-runner-labels }}
            runs-on-cache-bypass: ${{ inputs.runs-on-cache-bypass }}
            e2e-cache: ${{ inputs.e2e-result-cache && needs.detect.outputs.forced != 'true' && github.event_name != 'workflow_dispatch' }}
            e2e-cache-inputs: ${{ toJSON(inputs) }}
            e2e-cache-test-paths: ${{ inputs.e2e-cache-test-paths }}
            e2e-cache-state-command: ${{ inputs.e2e-cache-state-command }}
            e2e-cache-export-command: ${{ inputs.e2e-cache-export-command }}
            # A pass vouches for the suite that ran, so its project is part of the key.
            e2e-cache-extra-paths: |
                ${{ inputs.e2e-cache-extra-paths }}
                ${{ inputs.e2e-dir }}
            platform: android
            targets: ${{ needs.detect.outputs.targets }}
            build-strategy: ${{ needs.detect.outputs.build-strategy }}
            runner-labels: ${{ inputs.repack-runner-labels }}
            timeout-minutes: ${{ inputs.repack-timeout-minutes }}
            app-artifact-prefix: android-e2e-app${{ needs.detect.outputs.artifact-scope }}
            plan-artifact-prefix: android-e2e-plan${{ needs.detect.outputs.artifact-scope }}
            toolchain: cmdline-${{ inputs.cmdline-tools-version }}-${{ inputs.gradle-task }}${{ inputs.gradle-args != '' && format('-{0}', inputs.gradle-args) || '' }}${{ needs.detect.outputs.android-abi-key }}
            base-backend: ${{ inputs.base-backend }}
            base-flavor: ${{ inputs.base-flavor }}
            fingerprint-config: ${{ inputs.fingerprint-config }}
            fingerprint-env: ${{ inputs.fingerprint-env }}
            expo-fingerprint-version: ${{ inputs.expo-fingerprint-version }}
            repack-env: ${{ inputs.repack-env }}
            expect-config: ${{ inputs.expect-config }}
            repack-app-version: ${{ inputs.repack-app-version }}
            cmdline-tools-version: ${{ inputs.cmdline-tools-version }}
            android-build-tools-dir: ${{ inputs.android-build-tools-dir }}
            android-build-tools-version: ${{ inputs.android-build-tools-version }}
            android-keystore-path: ${{ inputs.android-keystore-path }}
            android-keystore-password: ${{ inputs.android-keystore-password }}
            android-keystore-key-alias: ${{ inputs.android-keystore-key-alias }}
            android-keystore-key-password: ${{ inputs.android-keystore-key-password }}
            node-version: ${{ inputs.node-version }}
            install-command: ${{ inputs.install-command }}
            enable-corepack: ${{ inputs.enable-corepack }}
            package-manager: ${{ inputs.package-manager }}
            build-command: ${{ inputs.build-command }}
            build-env: ${{ inputs.build-env }}
        secrets:
            build-secrets-env: ${{ secrets.build-secrets-env }}
            e2e-secrets-env: ${{ secrets.e2e-secrets-env }}

    build:
        name: Build (${{ matrix.target.name }})
        needs: [detect, plan]
        if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.native-targets != '[]' }}
        runs-on: ${{ fromJSON(inputs.build-runner-labels) }}
        timeout-minutes: ${{ inputs.build-timeout-minutes }}
        permissions:
            contents: read
            packages: write
            actions: read
        concurrency:
            group: ${{ (github.ref_name == github.event.repository.default_branch && matrix.target.buildStrategy != 'native') && format('expo-base-publish-{0}-android-{1}-{2}', github.repository, inputs.base-flavor, matrix.target.nativeKey) || format('expo-base-build-{0}-{1}-android{2}-{3}', github.run_id, github.run_attempt, needs.detect.outputs.artifact-scope, matrix.target.name) }}
            cancel-in-progress: false
        strategy:
            fail-fast: false
            matrix:
                target: ${{ fromJSON(needs.plan.outputs.native-targets) }}
        env:
            APP_DIR: ${{ matrix.target.appDir }}

        steps:
            - name: Apply RunsOn cache bypass
              uses: rnw-community/mobile-ci/actions/runs-on-cache-bypass@v5.0.0 # v5.0.0
              with:
                  enabled: ${{ inputs.runs-on-cache-bypass }}
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - name: Apply build-env
              if: inputs.build-env != ''
              shell: bash
              env:
                  BUILD_ENV: ${{ inputs.build-env }}
              run: |
                  set -euo pipefail
                  while IFS= read -r line; do
                    [ -z "$line" ] && continue
                    case "$line" in
                      *=*) ;;
                      *)
                        echo "::error::build-env line '$line' is missing '='; expected KEY=VALUE."
                        exit 1
                        ;;
                    esac
                    name="${line%%=*}"
                    case "$name" in
                      ''|[!A-Za-z_]*)
                        echo "::error::build-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    case "$name" in
                      *[!A-Za-z0-9_]*)
                        echo "::error::build-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    echo "$line" >> "$GITHUB_ENV"
                  done <<< "$BUILD_ENV"

            - name: Apply build-secrets-env
              uses: rnw-community/mobile-ci/actions/apply-secret-env@v5.0.0 # v5.0.0
              with:
                  env: ${{ secrets.build-secrets-env }}
                  label: build-secrets-env

            - name: Resolve package manager
              id: package-manager
              shell: bash
              env:
                  PACKAGE_MANAGER: ${{ inputs.package-manager }}
                  LOCKFILE_REQUIRED: 'true'
              run: |
                  set -euo pipefail
                  pm=''
                  case "$PACKAGE_MANAGER" in
                    '') ;;
                    yarn|pnpm|npm) pm="$PACKAGE_MANAGER" ;;
                    *)
                      echo "::error::package-manager must be '' (auto-detect), yarn, pnpm or npm; got '$PACKAGE_MANAGER'."
                      exit 1
                      ;;
                  esac
                  declared=''
                  declared_version=''
                  if { [ -z "$pm" ] || [ "$pm" = pnpm ]; } && [ -f package.json ]; then
                    if command -v jq >/dev/null 2>&1; then
                      declared_spec="$(jq -r '
                        (try (.devEngines.packageManager) catch null) as $raw
                        | (if ($raw | type) == "array" then ($raw[0] // null) else $raw end) as $de
                        | (if ($de | type) == "object" then [($de.name // ""), ($de.version // "")] else ["", ""] end) as $dev
                        | (if ((.packageManager // "") | type) == "string" and (.packageManager // "") != ""
                           then (.packageManager | if test("@") then [split("@")[0], (split("@")[1] | split("+")[0])] else [., ""] end)
                           else ["", ""] end) as $spec
                        | (if $dev[0] != "" then $dev[0] else $spec[0] end) as $name
                        | [$name,
                           (if $dev[0] != "" and $dev[1] != "" then $dev[1]
                            elif $spec[0] == $name then $spec[1]
                            else "" end)]
                        | @tsv' package.json)"
                      declared="$(printf '%s\n' "$declared_spec" | cut -f1)"
                      declared_version="$(printf '%s\n' "$declared_spec" | cut -f2)"
                    else
                      echo "::warning::jq is not installed on this runner, so package.json's packageManager / devEngines.packageManager fields cannot be read; falling back to root lockfile detection. Install jq, or set the package-manager input explicitly."
                    fi
                  fi
                  if [ -z "$pm" ] && [ -n "$declared" ]; then
                    case "$declared" in
                      yarn|pnpm|npm) pm="$declared" ;;
                      *)
                        echo "::error::package.json declares package manager '$declared', which is not yarn, pnpm or npm; set the package-manager input explicitly."
                        exit 1
                        ;;
                    esac
                  fi
                  if [ -z "$pm" ]; then
                    lockfiles=''
                    lockfile_count=0
                    if [ -f yarn.lock ]; then pm=yarn; lockfiles="${lockfiles}yarn.lock "; lockfile_count=$((lockfile_count + 1)); fi
                    if [ -f pnpm-lock.yaml ]; then pm=pnpm; lockfiles="${lockfiles}pnpm-lock.yaml "; lockfile_count=$((lockfile_count + 1)); fi
                    if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
                      pm=npm
                      lockfile_count=$((lockfile_count + 1))
                      if [ -f package-lock.json ]; then lockfiles="${lockfiles}package-lock.json "; fi
                      if [ -f npm-shrinkwrap.json ]; then lockfiles="${lockfiles}npm-shrinkwrap.json "; fi
                    fi
                    if [ "$lockfile_count" -eq 0 ]; then
                      echo "::error::Cannot resolve the package manager: package.json declares none and there is no yarn.lock, pnpm-lock.yaml, package-lock.json or npm-shrinkwrap.json at the repository root. Set the package-manager input explicitly."
                      exit 1
                    fi
                    if [ "$lockfile_count" -gt 1 ]; then
                      echo "::error::Cannot resolve the package manager: multiple root lockfiles found (${lockfiles% }). Set the package-manager input explicitly."
                      exit 1
                    fi
                  fi
                  if [ "$pm" = pnpm ] && { [ "$declared" != pnpm ] || [ -z "$declared_version" ]; }; then
                    echo "::error::Resolved package manager is pnpm, but no pnpm version is readable from the repository-root package.json. pnpm/action-setup takes the version from 'packageManager: pnpm@<version>' or 'devEngines.packageManager: {name: pnpm, version: <range>}' - add one of those, and make sure jq is installed on this runner so the workflow can read it."
                    exit 1
                  fi
                  if [ -n "$LOCKFILE_REQUIRED" ]; then
                    case "$pm" in
                      yarn) wanted='yarn.lock' ;;
                      pnpm) wanted='pnpm-lock.yaml' ;;
                      *) wanted='package-lock.json npm-shrinkwrap.json' ;;
                    esac
                    found=''
                    for candidate in $wanted; do
                      if [ -f "$candidate" ]; then found="$candidate"; break; fi
                    done
                    if [ -z "$found" ]; then
                      echo "::error::Resolved package manager is $pm, but this job caches JS dependencies with actions/setup-node and the repository root has none of: $wanted. Commit the lockfile, or set the package-manager input to the manager whose lockfile this repository actually has."
                      exit 1
                    fi
                  fi
                  echo "Resolved package manager: $pm"
                  echo "pm=$pm" >> "$GITHUB_OUTPUT"

            - name: Setup pnpm
              if: steps.package-manager.outputs.pm == 'pnpm'
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ inputs.node-version }}

            - name: Enable corepack
              if: inputs.enable-corepack && steps.package-manager.outputs.pm != 'pnpm'
              shell: bash
              run: corepack enable

            - name: Restore package manager cache
              id: pm-cache
              uses: rnw-community/mobile-ci/actions/node-pm-cache@v5.0.0 # v5.0.0
              with:
                  package-manager: ${{ steps.package-manager.outputs.pm }}

            - name: Install dependencies
              shell: bash
              env:
                  INSTALL_COMMAND: ${{ inputs.install-command }}
              run: eval "$INSTALL_COMMAND"

            - name: Save package manager cache
              if: github.event_name != 'pull_request' && steps.pm-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              timeout-minutes: 10
              continue-on-error: true
              with:
                  path: ${{ steps.pm-cache.outputs.path }}
                  key: ${{ steps.pm-cache.outputs.cache-key }}

            - name: Build workspace JS dependencies
              if: inputs.build-command != ''
              shell: bash
              env:
                  BUILD_COMMAND: ${{ inputs.build-command }}
              run: eval "$BUILD_COMMAND"

            - name: Generate native project
              if: matrix.target.prebuildCommand != ''
              working-directory: ${{ matrix.target.appDir }}
              shell: bash
              env:
                  PREBUILD_COMMAND: ${{ matrix.target.prebuildCommand }}
              run: eval "$PREBUILD_COMMAND"

            - name: build-android-app
              id: build
              uses: rnw-community/mobile-ci/actions/build-android-app@v5.0.0 # v5.0.0
              with:
                  app-dir: ${{ matrix.target.appDir }}
                  cmdline-tools-version: ${{ inputs.cmdline-tools-version }}
                  gradle-task: ${{ inputs.gradle-task }}
                  gradle-args: ${{ inputs.gradle-args }}
                  android-abis: ${{ needs.detect.outputs.android-abis }}
                  android-sdk-cache-save: 'false'
                  output-dir: .ci-cache/android-native-app/${{ matrix.target.name }}
                  gradle-cache-key: gradle-${{ matrix.target.name }}-${{ runner.os }}-${{ hashFiles(format('{0}/android/gradle/wrapper/gradle-wrapper.properties', matrix.target.appDir), format('{0}/android/**/*.gradle*', matrix.target.appDir), format('{0}/android/gradle/*.versions.toml', matrix.target.appDir), 'yarn.lock', 'pnpm-lock.yaml', 'package-lock.json', 'npm-shrinkwrap.json') }}
                  gradle-cache-restore-keys: |
                      gradle-${{ matrix.target.name }}-${{ runner.os }}-

            - name: Upload the APK for the test jobs
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: android-e2e-app${{ needs.detect.outputs.artifact-scope }}-${{ matrix.target.name }}
                  path: .ci-cache/android-native-app/${{ matrix.target.name }}/app-release.apk
                  if-no-files-found: error
                  retention-days: 1

            - name: expo-base-binary (publish)
              if: github.ref_name == github.event.repository.default_branch && matrix.target.buildStrategy != 'native'
              uses: rnw-community/mobile-ci/actions/expo-base-binary@v5.0.0 # v5.0.0
              with:
                  mode: publish
                  platform: android
                  flavor: ${{ inputs.base-flavor }}
                  key: ${{ matrix.target.nativeKey }}
                  backend: ${{ inputs.base-backend }}
                  path: .ci-cache/android-native-app/${{ matrix.target.name }}/app-release.apk

            - name: Report that this key is now warm
              if: github.ref_name == github.event.repository.default_branch && matrix.target.buildStrategy != 'native'
              shell: bash
              env:
                  TARGET_NAME: ${{ matrix.target.name }}
                  NATIVE_KEY: ${{ matrix.target.nativeKey }}
              run: |
                  echo "### Android ${TARGET_NAME}: base binary published for native key ${NATIVE_KEY}" >> "$GITHUB_STEP_SUMMARY"
                  echo 'Pull requests on this native surface now repack instead of running Gradle.' >> "$GITHUB_STEP_SUMMARY"

            - name: Save the Android SDK
              if: github.event_name != 'pull_request' && steps.build.outcome == 'success' && steps.build.outputs.android-sdk-cache-hit != 'true'
              continue-on-error: true
              timeout-minutes: 10
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ steps.build.outputs.android-sdk-cache-paths }}
                  key: ${{ steps.build.outputs.android-sdk-cache-key }}

    e2e:
        name: E2E suite (${{ matrix.target.name }})
        needs: [detect, plan, build]
        if: ${{ !cancelled() && needs.detect.outputs.affected == 'true' && needs.plan.result == 'success' && needs.plan.outputs.test-targets != '[]' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
        runs-on: ${{ fromJSON(inputs.e2e-runner-labels != '' && inputs.e2e-runner-labels || inputs.repack-runner-labels) }}
        timeout-minutes: ${{ inputs.e2e-timeout-minutes }}
        strategy:
            fail-fast: false
            matrix:
                target: ${{ fromJSON(needs.plan.outputs.test-targets) }}
        steps:
            - name: Apply RunsOn cache bypass
              uses: rnw-community/mobile-ci/actions/runs-on-cache-bypass@v5.0.0 # v5.0.0
              with:
                  enabled: ${{ inputs.runs-on-cache-bypass }}
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ inputs.e2e-node-version }}
            - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
              with:
                  name: android-e2e-app${{ needs.detect.outputs.artifact-scope }}-${{ matrix.target.name }}
                  path: .ci-artifacts/android-e2e-app${{ needs.detect.outputs.artifact-scope }}-${{ matrix.target.name }}
            - name: Apply e2e-secrets-env
              uses: rnw-community/mobile-ci/actions/apply-secret-env@v5.0.0 # v5.0.0
              with:
                  env: ${{ secrets.e2e-secrets-env }}
                  label: e2e-secrets-env
                  allow-multiline: false
            - name: Run the e2e suite
              id: run
              uses: rnw-community/mobile-ci/actions/e2e-suite@v5.0.0 # v5.0.0
              with:
                  mode: run
                  platform: android
                  e2e-dir: ${{ inputs.e2e-dir }}
                  install-command: ${{ inputs.e2e-install-command }}
                  command: ${{ inputs.e2e-command }}
                  app-path: ${{ github.workspace }}/.ci-artifacts/android-e2e-app${{ needs.detect.outputs.artifact-scope }}-${{ matrix.target.name }}/app-release.apk
                  app-id: ${{ matrix.target.appId }}
                  target: ${{ matrix.target.name }}
                  targets: ${{ needs.plan.outputs.test-targets }}
                  workers: ${{ inputs.e2e-workers }}
                  retries: ${{ inputs.e2e-retries }}
                  session: e2e-android-${{ github.run_id }}-${{ github.run_attempt }}${{ needs.detect.outputs.artifact-scope }}-${{ matrix.target.name }}
                  tolerated: ${{ matrix.target.tolerateTestFailures }}
                  simlock-url: ${{ inputs.simlock-url }}
                  simlock-token: ${{ secrets.simlock-token }}
            - name: Release the devices the suite left leased
              if: ${{ always() && steps.run.outcome != 'skipped' }}
              uses: rnw-community/mobile-ci/actions/e2e-suite@v5.0.0 # v5.0.0
              with:
                  mode: release
                  platform: android
                  e2e-dir: ${{ inputs.e2e-dir }}
                  simlock-url: ${{ inputs.simlock-url }}
                  simlock-token: ${{ secrets.simlock-token }}
            - name: Upload the e2e report
              if: ${{ always() && steps.run.outcome != 'skipped' }}
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: e2e-android${{ needs.detect.outputs.artifact-scope }}-${{ matrix.target.name }}
                  path: ${{ inputs.e2e-dir }}/.e2e
                  retention-days: ${{ inputs.artifact-retention-days }}
                  include-hidden-files: true
                  if-no-files-found: warn

    cache-pass:
        name: Record E2E pass (${{ matrix.target.name }})
        needs: [detect, plan, build, e2e]
        if: ${{ !cancelled() && needs.plan.result == 'success' && needs.e2e.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') && needs.plan.outputs.cache-targets != '[]' }}
        runs-on: ${{ fromJSON(inputs.control-runner-labels) }}
        timeout-minutes: 5
        strategy:
            fail-fast: false
            matrix:
                target: ${{ fromJSON(needs.plan.outputs.cache-targets) }}
        steps:
            - name: Apply RunsOn cache bypass
              uses: rnw-community/mobile-ci/actions/runs-on-cache-bypass@v5.0.0 # v5.0.0
              with:
                  enabled: ${{ inputs.runs-on-cache-bypass }}
            - name: Save the successful test contract
              continue-on-error: true
              uses: rnw-community/mobile-ci/actions/e2e-result-cache@v5.0.0 # v5.0.0
              with:
                  mode: publish
                  platform: android
                  key: ${{ matrix.target.e2eCacheKey }}

    status:
        name: Android E2E result
        needs: [detect, plan, build, e2e, cache-pass]
        if: always()
        runs-on: ${{ fromJSON(inputs.control-runner-labels) }}
        outputs:
            result: ${{ steps.report.outputs.result }}
        steps:
            - name: Report
              id: report
              shell: bash
              env:
                  DETECT_RESULT: ${{ needs.detect.result }}
                  DETECT_AFFECTED: ${{ needs.detect.outputs.affected }}
                  DETECT_FORCED: ${{ needs.detect.outputs.forced }}
                  FORCE_LABEL: ${{ inputs.force-label }}
                  PLAN_RESULT: ${{ needs.plan.result }}
                  NATIVE_TARGETS: ${{ needs.plan.outputs.native-targets }}
                  BUILD_RESULT: ${{ needs.build.result }}
                  TEST_RESULT: ${{ needs.e2e.result }}
                  TEST_TARGETS: ${{ needs.plan.outputs.test-targets }}
                  CACHED_TARGETS: ${{ needs.plan.outputs.cached-targets }}
              run: |
                  result=failed
                  trap 'echo "result=$result" >> "$GITHUB_OUTPUT"' EXIT
                  SUITE='e2e suite'
                  summary() {
                    printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
                  }
                  cancelled_hint() {
                    if [ "$1" = 'cancelled' ]; then
                      echo "::notice::A cancelled job result often means the job hit its timeout-minutes - check the job's duration against build-timeout-minutes/e2e-timeout-minutes before assuming external cancellation."
                    fi
                  }
                  if [ "$DETECT_RESULT" != "success" ]; then
                    echo "::error::Required jobs did not succeed: detection job (result: $DETECT_RESULT)."
                    summary "### Android E2E: failed (detect job result: $DETECT_RESULT)"
                    cancelled_hint "$DETECT_RESULT"
                    exit 1
                  fi
                  if [ "$DETECT_AFFECTED" != "true" ]; then
                    result=skipped
                    echo "::notice::Android E2E skipped: target packages untouched, so every build/test leg was skipped and no e2e test ran. This is not a pass."
                    summary "### Android E2E: skipped — target packages untouched, no e2e test ran (not a pass)"
                    exit 0
                  fi
                  if [ "$PLAN_RESULT" != "success" ]; then
                    echo "::error::Required jobs did not succeed: plan job (result: $PLAN_RESULT)."
                    summary "### Android E2E: failed (plan job result: $PLAN_RESULT)"
                    cancelled_hint "$PLAN_RESULT"
                    exit 1
                  fi
                  if [ "${TEST_TARGETS:-}" = '[]' ] && [ "$NATIVE_TARGETS" = '[]' ] && [ "$BUILD_RESULT" = 'skipped' ] && [ "$TEST_RESULT" = 'skipped' ]; then
                    if ! jq -e 'length > 0 and all(.[]; .e2eCacheHit == true and (.e2eCacheKey | test("^[0-9a-f]{64}$")) and (.e2eCacheRunUrl | type == "string" and length > 0))' <<< "${CACHED_TARGETS:-[]}" > /dev/null; then
                      echo '::error::Empty test matrix without complete validated pass records.'
                      exit 1
                    fi
                    result=passed
                    summary "### Android E2E: passed (content-addressed cache)"
                    jq -r '.[] | "- \(.name): [successful producer run](\(.e2eCacheRunUrl))"' <<< "$CACHED_TARGETS" >> "$GITHUB_STEP_SUMMARY"
                    exit 0
                  fi
                  if [ "$BUILD_RESULT" = 'skipped' ] && [ "$NATIVE_TARGETS" != '[]' ]; then
                    echo "The native build was skipped while ${NATIVE_TARGETS} still needed one; a skipped build is not a build."
                    summary "### Android E2E: failed (native build skipped with targets still needing one)"
                    exit 1
                  fi
                  if [ "$BUILD_RESULT" != "success" ] && [ "$BUILD_RESULT" != 'skipped' ]; then
                    echo "::error::Required jobs did not succeed: build job (result: $BUILD_RESULT)."
                    summary "### Android E2E: failed (build job result: $BUILD_RESULT)"
