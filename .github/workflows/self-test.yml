name: self-test

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

env:
    ACTIONLINT_VERSION: '1.7.12'
    ZIZMOR_VERSION: '1.16.3'

jobs:
    actionlint:
        name: actionlint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - name: Install actionlint
              shell: bash
              run: |
                  set -euo pipefail
                  cd "$RUNNER_TEMP"
                  curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
                  curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
                  sha256sum --ignore-missing -c "actionlint_${ACTIONLINT_VERSION}_checksums.txt"
                  tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
                  install -m 0755 actionlint /usr/local/bin/actionlint

            - name: Install shellcheck
              shell: bash
              run: sudo apt-get update && sudo apt-get install -y shellcheck

            - name: Run actionlint
              shell: bash
              run: actionlint -color

    zizmor:
        name: zizmor
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - name: Install zizmor (pinned)
              shell: bash
              run: pip install --user "zizmor==${ZIZMOR_VERSION}"

            - name: Run zizmor
              shell: bash
              run: ~/.local/bin/zizmor --config .github/zizmor.yml .github/workflows actions

    pin-check:
        name: Third-party SHA pin check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - name: Enforce full-commit-SHA pinning on every third-party 'uses:'
              shell: bash
              run: |
                  set -euo pipefail
                  # AGENTS.md's "Hard conventions" require every third-party uses:
                  # (anything not rnw-community/mobile-ci/...) to be pinned to a full
                  # commit SHA. zizmor's unpinned-uses rule enforces that with a
                  # blanket hash-pin policy exempting only this repo's own
                  # rnw-community/mobile-ci/* self-references (see
                  # .github/zizmor.yml) - this job is the independent, tool-agnostic
                  # restatement of the same rule (#28), so a future zizmor config or
                  # rule-name change cannot silently stop enforcing it.
                  #
                  # "uses" is matched with an optional surrounding quote
                  # (["']?) so a quoted YAML key ("uses": ...) is not missed
                  # the way an unquoted-only pattern would miss it.
                  uses_pattern="^[[:space:]]*-?[[:space:]]*[\"']?uses[\"']?[[:space:]]*:[[:space:]]*[^[:space:]]"
                  violations=0
                  while IFS= read -r -d '' file; do
                    # Fail closed on a genuine grep error (unreadable file,
                    # bad pattern: exit >1), not just "no uses: line found"
                    # (exit 1) -- `|| true` alone would mask both the same way.
                    if grep_output="$(grep -nE "$uses_pattern" "$file")"; then
                      grep_status=0
                    else
                      grep_status=$?
                    fi
                    if [ "$grep_status" -gt 1 ]; then
                      echo "::error::Failed to scan '${file}' for 'uses:' references (grep exited ${grep_status})."
                      violations=$((violations + 1))
                      continue
                    fi
                    [ -n "$grep_output" ] || continue
                    while IFS=: read -r lineno content; do
                      ref="$(printf '%s' "$content" | sed -E "s/^[[:space:]]*-?[[:space:]]*[\"']?uses[\"']?[[:space:]]*:[[:space:]]*//; s/[[:space:]]*#.*\$//; s/[[:space:]]+\$//")"
                      ref="${ref%\"}"; ref="${ref#\"}"
                      ref="${ref%\'}"; ref="${ref#\'}"
                      [ -n "$ref" ] || continue
                      case "$ref" in
                        ./*|rnw-community/mobile-ci/*)
                          continue
                          ;;
                        *@*)
                          sha="${ref##*@}"
                          if ! printf '%s' "$sha" | grep -qE '^[0-9a-f]{40}$'; then
                            echo "::error file=${file},line=${lineno}::Unpinned third-party 'uses:' ref '${ref}' - third-party actions must be pinned to a full 40-character commit SHA (got '@${sha}')."
                            violations=$((violations + 1))
                          fi
                          ;;
                        *)
                          echo "::error file=${file},line=${lineno}::Third-party 'uses:' ref '${ref}' has no @ref at all; must be pinned to a full 40-character commit SHA."
                          violations=$((violations + 1))
                          ;;
                      esac
                    done <<< "$grep_output"
                  done < <(find .github/workflows actions -type f \( -name '*.yml' -o -name 'action.yml' \) -print0 | sort -z)

                  if [ "$violations" -gt 0 ]; then
                    echo "::error::${violations} third-party 'uses:' reference(s) are not pinned to a full commit SHA. See annotations above."
                    exit 1
                  fi
                  echo "All third-party 'uses:' references are pinned to a full commit SHA."

    dry-lint-local-refs:
        name: Dry lint (self-referenced composite action schemas)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - name: Install actionlint
              shell: bash
              run: |
                  set -euo pipefail
                  cd "$RUNNER_TEMP"
                  curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
                  curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
                  sha256sum --ignore-missing -c "actionlint_${ACTIONLINT_VERSION}_checksums.txt"
                  tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
                  install -m 0755 actionlint /usr/local/bin/actionlint

            - name: Rewrite self-references to local paths and lint
              shell: bash
              run: |
                  set -euo pipefail
                  self_ref_rewrite='s#uses: rnw-community/mobile-ci/actions/([a-z0-9-]+)@[A-Za-z0-9._-]+#uses: ./actions/\1#'
                  scratch="$RUNNER_TEMP/dry-lint"
                  rm -rf "$scratch"
                  mkdir -p "$scratch/.github/workflows"
                  cp -r actions "$scratch/actions"
                  for workflow in ios-maestro android-maestro seed-native-cache native-publish native-dev-release store-screenshots; do
                    sed -E "$self_ref_rewrite" \
                      ".github/workflows/${workflow}.yml" > "$scratch/.github/workflows/${workflow}.yml"
                  done
                  # Composite actions self-reference each other too (action ->
                  # action, e.g. run-maestro-android-redroid -> redroid-container),
                  # pinned to the release tag being cut, which does not exist yet on
                  # the release PR. Apply the identical rewrite to the scratch
                  # actions so no linted file carries a ref nothing can resolve.
                  # actionlint as of 1.7.12 resolves a local `uses:` only from a
                  # WORKFLOW step, never from a step inside an action.yml, so this
                  # rewrite buys no extra input-schema checking today - it is here so
                  # the scratch tree is uniformly self-reference-free and picks the
                  # coverage up for free if actionlint ever recurses.
                  find "$scratch/actions" -name action.yml -exec sed -E -i "$self_ref_rewrite" {} +
                  if grep -rn --include='*.yml' 'uses: rnw-community/mobile-ci/' "$scratch"; then
                    echo "::error::A self-reference survived the scratch-copy rewrite above; the rewrite pattern no longer matches every self-reference form in use."
                    exit 1
                  fi
                  cd "$scratch" && git init -q && actionlint -color

    fleet-self-test:
        name: Fleet self-test (manual only)
        if: github.event_name == 'workflow_dispatch'
        runs-on: [self-hosted, macOS, ARM64]
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - name: setup-xcode-pinned
              uses: ./actions/setup-xcode-pinned
              with:
                  version: ${{ vars.MOBILE_CI_SELFTEST_XCODE_VERSION || '26.4.1' }}
                  build: ${{ vars.MOBILE_CI_SELFTEST_XCODE_BUILD || '17E202' }}

            - name: Report toolchain resolved
              shell: bash
              run: echo 'setup-xcode-pinned resolved DEVELOPER_DIR successfully on the fleet.'
