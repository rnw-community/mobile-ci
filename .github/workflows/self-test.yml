name: self-test

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

env:
    ACTIONLINT_VERSION: '1.7.12'
    ZIZMOR_VERSION: '1.16.3'

jobs:
    actionlint:
        name: actionlint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - name: Install actionlint
              shell: bash
              run: |
                  set -euo pipefail
                  cd "$RUNNER_TEMP"
                  curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
                  curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
                  sha256sum --ignore-missing -c "actionlint_${ACTIONLINT_VERSION}_checksums.txt"
                  tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
                  install -m 0755 actionlint /usr/local/bin/actionlint

            - name: Install shellcheck
              shell: bash
              run: sudo apt-get update && sudo apt-get install -y shellcheck

            - name: Run actionlint
              shell: bash
              run: actionlint -color

    zizmor:
        name: zizmor
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - name: Install zizmor (pinned)
              shell: bash
              run: pip install --user "zizmor==${ZIZMOR_VERSION}"

            - name: Run zizmor
              shell: bash
              run: ~/.local/bin/zizmor --config .github/zizmor.yml .github/workflows actions

    pin-check:
        name: Third-party SHA pin check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - name: Enforce full-commit-SHA pinning on every third-party 'uses:'
              shell: bash
              run: |
                  set -euo pipefail
                  # AGENTS.md's "Hard conventions" require every third-party uses:
                  # (anything not rnw-community/mobile-ci/...) to be pinned to a full
                  # commit SHA. zizmor's unpinned-uses rule enforces that everywhere
                  # except the five self-reference-bearing workflow files it is
                  # file-scoped-ignored for (see .github/zizmor.yml) - this closes
                  # that gap for third-party refs living in those same five files
                  # (#28) without touching the zizmor ignore itself.
                  violations=0
                  while IFS= read -r -d '' file; do
                    while IFS=: read -r lineno content; do
                      ref="$(printf '%s' "$content" | sed -E 's/^[[:space:]]*-?[[:space:]]*uses[[:space:]]*:[[:space:]]*//; s/[[:space:]]*#.*$//; s/[[:space:]]+$//')"
                      ref="${ref%\"}"; ref="${ref#\"}"
                      ref="${ref%\'}"; ref="${ref#\'}"
                      [ -n "$ref" ] || continue
                      case "$ref" in
                        ./*|rnw-community/mobile-ci/*)
                          continue
                          ;;
                        *@*)
                          sha="${ref##*@}"
                          if ! printf '%s' "$sha" | grep -qE '^[0-9a-f]{40}$'; then
                            echo "::error file=${file},line=${lineno}::Unpinned third-party 'uses:' ref '${ref}' - third-party actions must be pinned to a full 40-character commit SHA (got '@${sha}')."
                            violations=$((violations + 1))
                          fi
                          ;;
                        *)
                          echo "::error file=${file},line=${lineno}::Third-party 'uses:' ref '${ref}' has no @ref at all; must be pinned to a full 40-character commit SHA."
                          violations=$((violations + 1))
                          ;;
                      esac
                    done < <(grep -nE '^[[:space:]]*-?[[:space:]]*uses[[:space:]]*:[[:space:]]*[^[:space:]]' "$file" || true)
                  done < <(find .github/workflows actions -type f \( -name '*.yml' -o -name 'action.yml' \) -print0 | sort -z)

                  if [ "$violations" -gt 0 ]; then
                    echo "::error::${violations} third-party 'uses:' reference(s) are not pinned to a full commit SHA. See annotations above."
                    exit 1
                  fi
                  echo "All third-party 'uses:' references are pinned to a full commit SHA."

    dry-lint-local-refs:
        name: Dry lint (reusable workflow -> composite action schemas)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - name: Install actionlint
              shell: bash
              run: |
                  set -euo pipefail
                  cd "$RUNNER_TEMP"
                  curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
                  curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
                  sha256sum --ignore-missing -c "actionlint_${ACTIONLINT_VERSION}_checksums.txt"
                  tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
                  install -m 0755 actionlint /usr/local/bin/actionlint

            - name: Rewrite self-references to local paths and lint
              shell: bash
              run: |
                  set -euo pipefail
                  scratch="$RUNNER_TEMP/dry-lint"
                  mkdir -p "$scratch/.github/workflows"
                  cp -r actions "$scratch/actions"
                  for workflow in ios-maestro android-maestro seed-native-cache native-publish native-dev-release; do
                    sed -E 's#uses: rnw-community/mobile-ci/actions/([a-z0-9-]+)@[A-Za-z0-9._-]+#uses: ./actions/\1#' \
                      ".github/workflows/${workflow}.yml" > "$scratch/.github/workflows/${workflow}.yml"
                  done
                  cd "$scratch" && git init -q && actionlint -color

    fleet-self-test:
        name: Fleet self-test (manual only)
        if: github.event_name == 'workflow_dispatch'
        runs-on: [self-hosted, macOS, ARM64]
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - name: setup-xcode-pinned
              uses: ./actions/setup-xcode-pinned
              with:
                  version: ${{ vars.MOBILE_CI_SELFTEST_XCODE_VERSION || '26.4.1' }}
                  build: ${{ vars.MOBILE_CI_SELFTEST_XCODE_BUILD || '17E202' }}

            - name: Report toolchain resolved
              shell: bash
              run: echo 'setup-xcode-pinned resolved DEVELOPER_DIR successfully on the fleet.'
