name: expo-ota-preview

on:
    workflow_call:
        inputs:
            app-dir:
                description: App directory containing app.json / app.config.js and the expo dependency.
                type: string
                required: true
            scheme:
                description: >-
                    App URL scheme registered by the development build (expo.scheme), used to build the
                    `scheme://expo-development-client/?url=...` deep links.
                type: string
                required: true
            ota-backend:
                description: >-
                    Where the update is hosted. github-release (default) exports the app, generates Expo
                    Updates v1 manifests and publishes them to a GitHub Release: EAS-free and tokenless, for
                    public repositories. eas publishes an EAS Update with eas-update instead: needs EXPO_TOKEN
                    and works for private repositories.
                type: string
                required: false
                default: github-release
            eas-channel:
                description: >-
                    ota-backend eas: channel the update is published for, `{number}` replaced with the pull
                    request number. A run with no pull request needs a template without `{number}`.
                type: string
                required: false
                default: 'pr-{number}'
            eas-profile:
                description: >-
                    eas.json build profile whose env (extends resolved) the runtime version is resolved under,
                    on both backends, and, with ota-backend eas, the update evaluated under (and whose
                    environment eas update loads). Use the profile the development build was built with.
                type: string
                required: false
                default: ''
            eas-environment:
                description: ota-backend eas - EAS environment for `eas update --environment`; empty uses eas-profile's.
                type: string
                required: false
                default: ''
            eas-cli-version:
                description: Pinned eas-cli npm version (ota-backend eas, dev-build-source eas).
                type: string
                required: false
                default: '20.5.1'
            eas-rollout-percentage:
                description: ota-backend eas - publish as a rollout to this percentage of the channel's users.
                type: string
                required: false
                default: ''
            eas-private-key-path:
                description: ota-backend eas - code-signing private key path, relative to app-dir, for a signed app.
                type: string
                required: false
                default: ''
            dev-build-source:
                description: >-
                    Where the development builds the comment links are distributed: github-release (default;
                    native-dev-release.yml releases, looked up when dev-release-tag-prefix is set) or eas (the
                    newest finished EAS build with the update's runtime version; needs EXPO_TOKEN).
                type: string
                required: false
                default: github-release
            dev-build-profile:
                description: dev-build-source eas - only consider EAS builds of this build profile. Empty considers any.
                type: string
                required: false
                default: ''
            platforms:
                description: Comma-separated platforms to export and manifest; ios, android, or both.
                type: string
                required: false
                default: ios,android
            runtime-version-ios:
                description: >-
                    iOS runtime version (fingerprint) the update targets. Leave empty to compute it
                    tokenlessly with @expo/fingerprint — the same hash a fingerprint-policy dev build baked in.
                type: string
                required: false
                default: ''
            runtime-version-android:
                description: Android runtime version (fingerprint) the update targets. Leave empty to compute it.
                type: string
                required: false
                default: ''
            public-base-url:
                description: >-
                    URL prefix the published dist is served from, no trailing slash. Leave empty to
                    derive the GitHub Releases download prefix for the generated tag.
                type: string
                required: false
                default: ''
            url-style:
                description: >-
                    How manifest asset URLs map to storage names. `release` (default) flattens `/` to `__`
                    for GitHub Releases; `path` keeps export-relative paths for a directory-preserving host.
                type: string
                required: false
                default: release
            release-tag-prefix:
                description: >-
                    Release tag prefix; the tag is `<prefix>-<app-scope>-<slug>` (e.g.
                    ota-packages-app-f5d9f195-pr-42), where app-scope is derived from app-dir.
                type: string
                required: false
                default: ota
            prune-keep:
                description: Number of released previews to keep, including the current one.
                type: string
                required: false
                default: '5'
            publish:
                description: Upload the exported dist to a GitHub Release (ota-backend github-release).
                type: boolean
                required: false
                default: true
            post-comment:
                description: >-
                    Write the deep links, an ASCII QR code and the runtime fingerprint into the pull
                    request's sticky preview comment (one comment, edited in place on every push).
                type: boolean
                required: false
                default: true
            dev-release-tag-prefix:
                description: >-
                    The tag-prefix the repository passes to native-dev-release.yml (its default is dev).
                    When set, each platform's comment section links the newest published development
                    build whose runtime fingerprint matches the update, or says a native build is
                    needed. Empty (default) skips the lookup.
                type: string
                required: false
                default: ''
            include-expo-config:
                description: Include extra.expoClient from `expo config --json`. Set false to omit app config.
                type: boolean
                required: false
                default: true
            project-id:
                description: Optional EAS project id exposed as extra.eas.projectId.
                type: string
                required: false
                default: ''
            runner-labels:
                description: JSON array of self-hosted runner labels for the preview job.
                type: string
                required: false
                default: '["self-hosted","linux","x64"]'
            node-version:
                type: string
                required: false
                default: '22'
            install-command:
                description: >-
                    Dependency install command. Leave empty to derive it from the resolved package
                    manager (pnpm install --frozen-lockfile, yarn install --frozen-lockfile, npm ci).
                type: string
                required: false
                default: ''
            enable-corepack:
                type: boolean
                required: false
                default: true
            package-manager:
                description: >-
                    JS package manager. Leave empty to auto-detect from package.json (devEngines.packageManager
                    or packageManager, needs jq) and then the single root lockfile. install-command must match
                    the resolved manager.
                type: string
                required: false
                default: ''
            build-command:
                description: Optional workspace JS build command run at the repository root before `expo export`.
                type: string
                required: false
                default: ''
            timeout-minutes:
                type: number
                required: false
                default: 30
        secrets:
            RELEASE_TOKEN:
                description: >-
                    Token with contents:write used to create the preview release and push assets; defaults
                    to the automatic github.token. Fork pull requests never run this job, so the token is
                    never exposed to fork code.
                required: false
            EXPO_TOKEN:
                description: Expo access token, required by ota-backend eas.
                required: false
            EAS_EXTRA_ENV:
                description: >-
                    ota-backend eas - newline-separated KEY=VALUE secret env, masked and exported before
                    eas update.
                required: false
        outputs:
            published:
                description: true when this run published the update; false when it skipped (see skipped-reason).
                value: ${{ jobs.preview.outputs.published }}
            skipped-reason:
                description: Empty when published; stale-head, already-published (ota-backend eas) or publish-disabled.
                value: ${{ jobs.preview.outputs.skipped-reason }}
            ios-update-id:
                description: iOS update id (the manifest id with ota-backend github-release).
                value: ${{ jobs.preview.outputs.ios-update-id }}
            android-update-id:
                description: Android update id.
                value: ${{ jobs.preview.outputs.android-update-id }}
            ios-runtime-version:
                description: iOS runtime version the update targets.
                value: ${{ jobs.preview.outputs.ios-runtime-version }}
            android-runtime-version:
                description: Android runtime version the update targets.
                value: ${{ jobs.preview.outputs.android-runtime-version }}
            ios-deep-link:
                description: expo-dev-client deep link opening the iOS update.
                value: ${{ jobs.preview.outputs.ios-deep-link }}
            android-deep-link:
                description: expo-dev-client deep link opening the Android update.
                value: ${{ jobs.preview.outputs.android-deep-link }}
            url-ios:
                description: URL of the iOS manifest (the update group's manifest URL with ota-backend eas).
                value: ${{ jobs.preview.outputs.url-ios }}
            url-android:
                description: URL of the Android manifest (the update group's manifest URL with ota-backend eas).
                value: ${{ jobs.preview.outputs.url-android }}
            release-tag:
                description: The GitHub Release tag the preview was published to; empty with ota-backend eas.
                value: ${{ jobs.preview.outputs.release-tag }}
            eas-channel:
                description: The EAS channel the update was published for; empty with ota-backend github-release.
                value: ${{ jobs.preview.outputs.eas-channel }}

concurrency:
    group: expo-ota-preview-${{ inputs.release-tag-prefix }}-${{ inputs.app-dir }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    preview:
        name: Build and publish
        if: >-
            github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ${{ fromJSON(inputs.runner-labels) }}
        timeout-minutes: ${{ inputs.timeout-minutes }}
        permissions:
            contents: write
            pull-requests: write
        outputs:
            published: ${{ steps.result.outputs.published }}
            skipped-reason: ${{ steps.result.outputs.skipped-reason }}
            ios-update-id: ${{ steps.result.outputs.ios-update-id }}
            android-update-id: ${{ steps.result.outputs.android-update-id }}
            ios-runtime-version: ${{ steps.result.outputs.ios-runtime-version }}
            android-runtime-version: ${{ steps.result.outputs.android-runtime-version }}
            ios-deep-link: ${{ steps.result.outputs.ios-deep-link }}
            android-deep-link: ${{ steps.result.outputs.android-deep-link }}
            url-ios: ${{ steps.result.outputs.ios-manifest-url }}
            url-android: ${{ steps.result.outputs.android-manifest-url }}
            release-tag: ${{ steps.paths.outputs.tag }}
            eas-channel: ${{ steps.eas.outputs.channel }}
        env:
            PR_NUMBER: ${{ github.event.pull_request.number }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - name: Resolve the OTA backend
              id: backend
              shell: bash
              env:
                  OTA_BACKEND: ${{ inputs.ota-backend }}
                  EAS_CHANNEL_TEMPLATE: ${{ inputs.eas-channel }}
                  PLATFORMS: ${{ inputs.platforms }}
                  DEV_BUILD_SOURCE: ${{ inputs.dev-build-source }}
                  GITHUB_RELEASE_ONLY: >-
                      ${{ inputs.runtime-version-ios != '' && 'runtime-version-ios ' || '' }}${{ inputs.runtime-version-android != '' && 'runtime-version-android ' || '' }}${{ inputs.public-base-url != '' && 'public-base-url ' || '' }}${{ inputs.url-style != 'release' && 'url-style ' || '' }}${{ inputs.release-tag-prefix != 'ota' && 'release-tag-prefix ' || '' }}${{ inputs.prune-keep != '5' && 'prune-keep ' || '' }}${{ !inputs.publish && 'publish ' || '' }}${{ !inputs.include-expo-config && 'include-expo-config ' || '' }}${{ inputs.project-id != '' && 'project-id ' || '' }}
                  EAS_ONLY: >-
                      ${{ inputs.eas-channel != 'pr-{number}' && 'eas-channel ' || '' }}${{ inputs.eas-environment != '' && 'eas-environment ' || '' }}${{ inputs.eas-rollout-percentage != '' && 'eas-rollout-percentage ' || '' }}${{ inputs.eas-private-key-path != '' && 'eas-private-key-path ' || '' }}${{ secrets.EAS_EXTRA_ENV != '' && 'EAS_EXTRA_ENV ' || '' }}
              run: |
                  set -euo pipefail
                  case "$DEV_BUILD_SOURCE" in
                    github-release|eas) ;;
                    *)
                      echo "::error::dev-build-source must be github-release or eas; got '$DEV_BUILD_SOURCE'."
                      exit 1
                      ;;
                  esac
                  normalized="$(printf '%s' "$PLATFORMS" | tr -d '[:space:]' | tr ',' '\n' | sed '/^$/d' | sort -u | paste -sd, -)"
                  case "$normalized" in
                    android,ios) platform=all ;;
                    ios|android) platform="$normalized" ;;
                    *)
                      echo "::error::platforms must name ios, android or both; got '$PLATFORMS'."
                      exit 1
                      ;;
                  esac
                  case "$OTA_BACKEND" in
                    github-release)
                      if [ -n "${EAS_ONLY// /}" ]; then
                        echo "::error::ota-backend github-release cannot honour ${EAS_ONLY% }: those are EAS Update capabilities. A static GitHub Release host has no channels, rollouts, code signing or server-side environments; set ota-backend eas, or drop them."
                        exit 1
                      fi
                      echo "platform=$platform" >> "$GITHUB_OUTPUT"
                      exit 0
                      ;;
                    eas) ;;
                    *)
                      echo "::error::ota-backend must be github-release or eas; got '$OTA_BACKEND'."
                      exit 1
                      ;;
                  esac
                  if [ -n "${GITHUB_RELEASE_ONLY// /}" ]; then
                    echo "::error::ota-backend eas ignores ${GITHUB_RELEASE_ONLY% }: those configure the GitHub Release host. EAS resolves the runtime version and hosts the update itself; drop them."
                    exit 1
                  fi
                  case "$EAS_CHANNEL_TEMPLATE" in
                    *'{number}'*)
                      if [ -z "${PR_NUMBER:-}" ]; then
                        echo "::error::eas-channel '$EAS_CHANNEL_TEMPLATE' names {number}, but this run has no pull request; pass a channel without it, e.g. development."
                        exit 1
                      fi
                      ;;
                  esac
                  channel="${EAS_CHANNEL_TEMPLATE//\{number\}/${PR_NUMBER:-}}"
                  {
                    echo "channel=$channel"
                    echo "platform=$platform"
                  } >> "$GITHUB_OUTPUT"

            - name: Resolve package manager
              id: package-manager
              shell: bash
              env:
                  PACKAGE_MANAGER: ${{ inputs.package-manager }}
                  LOCKFILE_REQUIRED: 'true'
              run: |
                  set -euo pipefail
                  pm=''
                  case "$PACKAGE_MANAGER" in
                    '') ;;
                    yarn|pnpm|npm) pm="$PACKAGE_MANAGER" ;;
                    *)
                      echo "::error::package-manager must be '' (auto-detect), yarn, pnpm or npm; got '$PACKAGE_MANAGER'."
                      exit 1
                      ;;
                  esac
                  declared=''
                  declared_version=''
                  if { [ -z "$pm" ] || [ "$pm" = pnpm ]; } && [ -f package.json ]; then
                    if command -v jq >/dev/null 2>&1; then
                      declared_spec="$(jq -r '
                        (try (.devEngines.packageManager) catch null) as $raw
                        | (if ($raw | type) == "array" then ($raw[0] // null) else $raw end) as $de
                        | (if ($de | type) == "object" then [($de.name // ""), ($de.version // "")] else ["", ""] end) as $dev
                        | (if ((.packageManager // "") | type) == "string" and (.packageManager // "") != ""
                           then (.packageManager | if test("@") then [split("@")[0], (split("@")[1] | split("+")[0])] else [., ""] end)
                           else ["", ""] end) as $spec
                        | (if $dev[0] != "" then $dev[0] else $spec[0] end) as $name
                        | [$name,
                           (if $dev[0] != "" and $dev[1] != "" then $dev[1]
                            elif $spec[0] == $name then $spec[1]
                            else "" end)]
                        | @tsv' package.json)"
                      declared="$(printf '%s\n' "$declared_spec" | cut -f1)"
                      declared_version="$(printf '%s\n' "$declared_spec" | cut -f2)"
                    else
                      echo "::warning::jq is not installed on this runner, so package.json's packageManager / devEngines.packageManager fields cannot be read; falling back to root lockfile detection. Install jq, or set the package-manager input explicitly."
                    fi
                  fi
                  if [ -z "$pm" ] && [ -n "$declared" ]; then
                    case "$declared" in
                      yarn|pnpm|npm) pm="$declared" ;;
                      *)
                        echo "::error::package.json declares package manager '$declared', which is not yarn, pnpm or npm; set the package-manager input explicitly."
                        exit 1
                        ;;
                    esac
                  fi
                  if [ -z "$pm" ]; then
                    lockfiles=''
                    lockfile_count=0
                    if [ -f yarn.lock ]; then pm=yarn; lockfiles="${lockfiles}yarn.lock "; lockfile_count=$((lockfile_count + 1)); fi
                    if [ -f pnpm-lock.yaml ]; then pm=pnpm; lockfiles="${lockfiles}pnpm-lock.yaml "; lockfile_count=$((lockfile_count + 1)); fi
                    if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
                      pm=npm
                      lockfile_count=$((lockfile_count + 1))
                      if [ -f package-lock.json ]; then lockfiles="${lockfiles}package-lock.json "; fi
                      if [ -f npm-shrinkwrap.json ]; then lockfiles="${lockfiles}npm-shrinkwrap.json "; fi
                    fi
                    if [ "$lockfile_count" -eq 0 ]; then
                      echo "::error::Cannot resolve the package manager: package.json declares none and there is no yarn.lock, pnpm-lock.yaml, package-lock.json or npm-shrinkwrap.json at the repository root. Set the package-manager input explicitly."
                      exit 1
                    fi
                    if [ "$lockfile_count" -gt 1 ]; then
                      echo "::error::Cannot resolve the package manager: multiple root lockfiles found (${lockfiles% }). Set the package-manager input explicitly."
                      exit 1
                    fi
                  fi
                  if [ "$pm" = pnpm ] && { [ "$declared" != pnpm ] || [ -z "$declared_version" ]; }; then
                    echo "::error::Resolved package manager is pnpm, but no pnpm version is readable from the repository-root package.json. pnpm/action-setup takes the version from 'packageManager: pnpm@<version>' or 'devEngines.packageManager: {name: pnpm, version: <range>}' - add one of those, and make sure jq is installed on this runner so the workflow can read it."
                    exit 1
                  fi
                  case "$pm" in
                    yarn) wanted='yarn.lock' ;;
                    pnpm) wanted='pnpm-lock.yaml' ;;
                    *) wanted='package-lock.json npm-shrinkwrap.json' ;;
                  esac
                  found=''
                  for candidate in $wanted; do
                    if [ -f "$candidate" ]; then found="$candidate"; break; fi
                  done
                  if [ -z "$found" ]; then
                    echo "::error::Resolved package manager is $pm, but this job caches JS dependencies with actions/setup-node and the repository root has none of: $wanted. Commit the lockfile, or set the package-manager input to the manager whose lockfile this repository actually has."
                    exit 1
                  fi
                  echo "Resolved package manager: $pm"
                  echo "pm=$pm" >> "$GITHUB_OUTPUT"

            - name: Setup pnpm
              if: steps.package-manager.outputs.pm == 'pnpm'
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ inputs.node-version }}

            - name: Enable corepack
              if: inputs.enable-corepack && steps.package-manager.outputs.pm != 'pnpm'
              shell: bash
              run: corepack enable

            - name: Restore package manager cache
              id: pm-cache
              uses: rnw-community/mobile-ci/actions/node-pm-cache@v4.6.0 # v4.6.0
              with:
                  package-manager: ${{ steps.package-manager.outputs.pm }}

            - name: Resolve install command
              id: install
              shell: bash
              env:
                  INSTALL_COMMAND_INPUT: ${{ inputs.install-command }}
                  PACKAGE_MANAGER: ${{ steps.package-manager.outputs.pm }}
              run: |
                  set -euo pipefail
                  if [ -n "$INSTALL_COMMAND_INPUT" ]; then
                    install_command="$INSTALL_COMMAND_INPUT"
                  else
                    case "$PACKAGE_MANAGER" in
                      pnpm) install_command='pnpm install --frozen-lockfile' ;;
                      yarn) install_command='yarn install --frozen-lockfile' ;;
                      npm) install_command='npm ci' ;;
                      *)
                        echo "::error::Cannot derive an install command for package manager '$PACKAGE_MANAGER'."
                        exit 1
                        ;;
                    esac
                  fi
                  printf 'command=%s\n' "$install_command" >> "$GITHUB_OUTPUT"

            - name: Install dependencies
              shell: bash
              env:
                  INSTALL_COMMAND: ${{ steps.install.outputs.command }}
              run: eval "$INSTALL_COMMAND"

            - name: Save package manager cache
              if: github.event_name != 'pull_request' && steps.pm-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              timeout-minutes: 10
              continue-on-error: true
              with:
                  path: ${{ steps.pm-cache.outputs.path }}
                  key: ${{ steps.pm-cache.outputs.cache-key }}

            - name: Build workspace JS dependencies
              if: inputs.build-command != ''
              shell: bash
              env:
                  BUILD_COMMAND: ${{ inputs.build-command }}
              run: eval "$BUILD_COMMAND"

            - name: Resolve the runtime versions
              if: inputs.ota-backend == 'eas' || inputs.runtime-version-ios == '' || inputs.runtime-version-android == ''
              id: runtime
              uses: rnw-community/mobile-ci/actions/ota-runtime-version@v4.6.0 # v4.6.0
              with:
                  app-dir: ${{ inputs.app-dir }}
                  platform: ${{ steps.backend.outputs.platform }}
                  eas-profile: ${{ inputs.eas-profile }}

            - name: Check the pull request head is current
              if: inputs.ota-backend != 'eas' && github.event_name == 'pull_request'
              id: head
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
              run: |
                  set -euo pipefail
                  if ! live_head="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')" || [ -z "$live_head" ]; then
                    echo "::error::Cannot read pull request #${PR_NUMBER}'s current head, so this run cannot prove it is not stale."
                    exit 1
                  fi
                  if [ "$live_head" != "$EVENT_HEAD" ]; then
                    echo "::warning::Pull request #${PR_NUMBER} moved on to ${live_head}; this run is for ${EVENT_HEAD}, so it publishes nothing and leaves the preview comment alone."
                    echo "stale=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "stale=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Export JS bundle
              if: inputs.ota-backend != 'eas'
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  PLATFORMS: ${{ inputs.platforms }}
                  EXPO_CONFIG_FILE: ${{ runner.temp }}/expoConfig.json
              run: |
                  set -euo pipefail
                  export_args=()
                  IFS=',' read -r -a platform_array <<< "$PLATFORMS"
                  for platform in "${platform_array[@]}"; do
                    platform="$(printf '%s' "$platform" | tr -d '[:space:]')"
                    [ -n "$platform" ] || continue
                    export_args+=(--platform "$platform")
                  done
                  if [ "${#export_args[@]}" -eq 0 ]; then
                    echo "::error::platforms resolved to an empty list."
                    exit 1
                  fi
                  npx expo config --json --type public > "$EXPO_CONFIG_FILE"
                  if jq -e '(.updates.codeSigningCertificate // "") != ""' "$EXPO_CONFIG_FILE" > /dev/null; then
                    echo "::error::The app config sets updates.codeSigningCertificate, so expo-updates only loads signed updates. A GitHub Release is a static host and cannot send the expo-signature header; use ota-backend eas with eas-private-key-path."
                    exit 1
                  fi
                  npx expo export --output-dir dist "${export_args[@]}"

            - name: Compute preview tag and base URL
              if: inputs.ota-backend != 'eas'
              id: paths
              shell: bash
              env:
                  PUBLIC_BASE_URL: ${{ inputs.public-base-url }}
                  RELEASE_TAG_PREFIX: ${{ inputs.release-tag-prefix }}
                  PUBLISH: ${{ inputs.publish }}
                  APP_DIR: ${{ inputs.app-dir }}
                  REPOSITORY: ${{ github.repository }}
                  HEAD_REF: ${{ github.head_ref }}
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  app_slug="$(printf '%s' "$APP_DIR" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-' | sed -e 's/--*/-/g' -e 's/^-//' -e 's/-$//')"
                  app_hash="$(printf '%s' "$APP_DIR" | node -e 'const fs=require("fs"),crypto=require("crypto");process.stdout.write(crypto.createHash("sha256").update(fs.readFileSync(0)).digest("hex").slice(0,8))')"
                  app_scope="${app_slug:-app}-${app_hash}"
                  full_sha="${GITHUB_SHA:-unknown}"
                  if [ -n "${PR_NUMBER:-}" ]; then
                    slug="pr-${PR_NUMBER}-${full_sha}"
                  else
                    raw="${HEAD_REF:-$REF_NAME}"
                    ref_hash="$(printf '%s' "${raw:-${GITHUB_REF:-unknown}}" | node -e 'const fs=require("fs"),crypto=require("crypto");process.stdout.write(crypto.createHash("sha256").update(fs.readFileSync(0)).digest("hex").slice(0,8))')"
                    slug="$(printf '%s' "$raw" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-' | sed -e 's/--*/-/g' -e 's/^-//' -e 's/-$//')"
                    slug="${slug:-ref}-${ref_hash}-${full_sha}"
                  fi
                  case "$RELEASE_TAG_PREFIX" in
                    ''|*[!A-Za-z0-9._-]*)
                      echo "::error::release-tag-prefix must be non-empty and only [A-Za-z0-9._-]; got '$RELEASE_TAG_PREFIX'."
                      exit 1
                      ;;
                  esac
                  tag="${RELEASE_TAG_PREFIX}-${app_scope}-${slug}"
                  base_url="${PUBLIC_BASE_URL%/}"
                  if [ -n "$base_url" ]; then
                    if ! node -e '
                      const raw = process.argv[1];
                      let parsed;
                      try {
                        parsed = new URL(raw);
                      } catch {
                        process.exit(1);
                      }
                      const isHttps = parsed.protocol === "https:";
                      const isLocal =
                        parsed.protocol === "http:" &&
                        (parsed.hostname === "localhost" || parsed.hostname === "127.0.0.1");
                      const isBare =
                        parsed.username === "" &&
                        parsed.password === "" &&
                        parsed.search === "" &&
                        parsed.hash === "";
                      process.exit((isHttps || isLocal) && isBare ? 0 : 1);
                    ' "$base_url"; then
                      echo "::error::public-base-url must be an https:// URL (http:// only for localhost or 127.0.0.1) with no credentials, query, or fragment."
                      exit 1
                    fi
                  fi
                  if [ -z "$base_url" ]; then
                    if [ "$PUBLISH" != 'true' ]; then
                      echo "::error::public-base-url is required when publish is false; the derived GitHub Releases URL would not be created."
                      exit 1
                    fi
                    base_url="https://github.com/${REPOSITORY}/releases/download/${tag}"
                  fi
                  {
                    printf 'slug=%s\n' "$slug"
                    printf 'tag=%s\n' "$tag"
                    printf 'app-scope=%s\n' "$app_scope"
                    printf 'base-url=%s\n' "$base_url"
                  } >> "$GITHUB_OUTPUT"

            - name: Generate Expo Updates manifests
              if: inputs.ota-backend != 'eas'
              id: manifest
              uses: rnw-community/mobile-ci/actions/expo-ota-manifest@v4.6.0 # v4.6.0
              with:
                  dist-dir: ${{ inputs.app-dir }}/dist
                  public-base-url: ${{ steps.paths.outputs.base-url }}
                  url-style: ${{ inputs.public-base-url == '' && 'release' || inputs.url-style }}
                  platforms: ${{ inputs.platforms }}
                  runtime-version-ios: ${{ inputs.runtime-version-ios != '' && inputs.runtime-version-ios || steps.runtime.outputs.ios-runtime-version }}
                  runtime-version-android: ${{ inputs.runtime-version-android != '' && inputs.runtime-version-android || steps.runtime.outputs.android-runtime-version }}
                  expo-config-path: ${{ runner.temp }}/expoConfig.json
                  include-expo-config: ${{ inputs.include-expo-config }}
                  project-id: ${{ inputs.project-id }}

            - name: Publish the EAS update
              if: inputs.ota-backend == 'eas'
              id: eas
              uses: rnw-community/mobile-ci/actions/eas-update@v4.6.0 # v4.6.0
              with:
                  app-dir: ${{ inputs.app-dir }}
                  channel: ${{ steps.backend.outputs.channel }}
                  platform: ${{ steps.backend.outputs.platform }}
                  eas-profile: ${{ inputs.eas-profile }}
                  environment: ${{ inputs.eas-environment }}
                  eas-cli-version: ${{ inputs.eas-cli-version }}
                  scheme: ${{ inputs.scheme }}
                  ios-runtime-version: ${{ steps.runtime.outputs.ios-runtime-version }}
                  android-runtime-version: ${{ steps.runtime.outputs.android-runtime-version }}
                  rollout-percentage: ${{ inputs.eas-rollout-percentage }}
                  private-key-path: ${{ inputs.eas-private-key-path }}
                  extra-env: ${{ secrets.EAS_EXTRA_ENV }}
                  expo-token: ${{ secrets.EXPO_TOKEN }}

            - name: Publish to GitHub Release
              if: inputs.publish && inputs.ota-backend != 'eas' && steps.head.outputs.stale != 'true'
              uses: rnw-community/mobile-ci/actions/github-release-publish@v4.6.0 # v4.6.0
              with:
                  source-dir: ${{ inputs.app-dir }}/dist
                  tag: ${{ steps.paths.outputs.tag }}
                  title: ${{ steps.paths.outputs.tag }}
                  prune-prefix: ${{ inputs.release-tag-prefix }}-${{ steps.paths.outputs.app-scope }}-
                  prune-keep: ${{ inputs.prune-keep }}
                  token: ${{ secrets.RELEASE_TOKEN != '' && secrets.RELEASE_TOKEN || github.token }}

            - name: Collect the published update
              id: result
              shell: bash
              env:
                  OTA_BACKEND: ${{ inputs.ota-backend }}
                  SCHEME: ${{ inputs.scheme }}
                  PUBLISH: ${{ inputs.publish }}
                  STALE: ${{ steps.head.outputs.stale }}
                  MANIFEST_IOS: ${{ steps.manifest.outputs.manifest-ios }}
                  MANIFEST_ANDROID: ${{ steps.manifest.outputs.manifest-android }}
                  RELEASE_URL_IOS: ${{ steps.manifest.outputs.url-ios }}
                  RELEASE_URL_ANDROID: ${{ steps.manifest.outputs.url-android }}
                  RELEASE_RUNTIME_IOS: ${{ inputs.runtime-version-ios != '' && inputs.runtime-version-ios || steps.runtime.outputs.ios-runtime-version }}
                  RELEASE_RUNTIME_ANDROID: ${{ inputs.runtime-version-android != '' && inputs.runtime-version-android || steps.runtime.outputs.android-runtime-version }}
                  EAS_PUBLISHED: ${{ steps.eas.outputs.published }}
                  EAS_SKIPPED_REASON: ${{ steps.eas.outputs.skipped-reason }}
                  EAS_ID_IOS: ${{ steps.eas.outputs.ios-update-id }}
                  EAS_ID_ANDROID: ${{ steps.eas.outputs.android-update-id }}
                  EAS_URL_IOS: ${{ steps.eas.outputs.ios-manifest-url }}
                  EAS_URL_ANDROID: ${{ steps.eas.outputs.android-manifest-url }}
                  EAS_RUNTIME_IOS: ${{ steps.eas.outputs.ios-runtime-version }}
                  EAS_RUNTIME_ANDROID: ${{ steps.eas.outputs.android-runtime-version }}
              run: |
                  set -euo pipefail
                  if [ "$OTA_BACKEND" = eas ]; then
                    published="$EAS_PUBLISHED"
                    reason="$EAS_SKIPPED_REASON"
                  elif [ "$STALE" = true ]; then
                    published=false
                    reason=stale-head
                  elif [ "$PUBLISH" != true ]; then
                    published=false
                    reason=publish-disabled
                  else
                    published=true
                    reason=''
                  fi
                  {
                    echo "published=$published"
                    echo "skipped-reason=$reason"
                  } >> "$GITHUB_OUTPUT"
                  [ "$reason" != stale-head ] || exit 0
                  for platform in ios android; do
                    upper="$(printf '%s' "$platform" | tr '[:lower:]' '[:upper:]')"
                    if [ "$OTA_BACKEND" = eas ]; then
                      id_var="EAS_ID_${upper}"; url_var="EAS_URL_${upper}"; runtime_var="EAS_RUNTIME_${upper}"
                      update_id="${!id_var}"
                    else
                      manifest_var="MANIFEST_${upper}"; url_var="RELEASE_URL_${upper}"; runtime_var="RELEASE_RUNTIME_${upper}"
                      update_id=''
                      [ -z "${!manifest_var}" ] || update_id="$(jq -r '.id // ""' "${!manifest_var}")"
                    fi
                    manifest_url="${!url_var}"
                    [ -n "$manifest_url" ] || continue
                    link="${SCHEME}://expo-development-client/?url=$(jq -rn --arg url "$manifest_url" '$url | @uri')"
                    {
                      echo "${platform}-update-id=${update_id}"
                      echo "${platform}-runtime-version=${!runtime_var}"
                      echo "${platform}-manifest-url=${manifest_url}"
                      echo "${platform}-deep-link=${link}"
                    } >> "$GITHUB_OUTPUT"
                  done

            - name: Find matching EAS development builds
              if: inputs.post-comment && github.event_name == 'pull_request' && inputs.dev-build-source == 'eas' && steps.result.outputs.skipped-reason != 'stale-head'
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
                  EAS_CLI_VERSION: ${{ inputs.eas-cli-version }}
                  DEV_BUILD_PROFILE: ${{ inputs.dev-build-profile }}
                  RUNTIME_IOS: ${{ steps.result.outputs.ios-runtime-version }}
                  RUNTIME_ANDROID: ${{ steps.result.outputs.android-runtime-version }}
                  DEV_BUILDS_DIR: ${{ runner.temp }}/eas-dev-builds
              run: |
                  set -euo pipefail
                  if [ -z "${EXPO_TOKEN:-}" ]; then
                    echo "::error::dev-build-source eas needs the EXPO_TOKEN secret to look the development builds up."
                    exit 1
                  fi
                  rm -rf "$DEV_BUILDS_DIR"
                  mkdir -p "$DEV_BUILDS_DIR"
                  for entry in "ios:$RUNTIME_IOS" "android:$RUNTIME_ANDROID"; do
                    platform="${entry%%:*}"
                    runtime="${entry#*:}"
                    : > "$DEV_BUILDS_DIR/${platform}.md"
                    [ -n "$runtime" ] || continue
                    args=(build:list --platform "$platform" --runtime-version "$runtime" --status finished --limit 1)
                    [ -z "$DEV_BUILD_PROFILE" ] || args+=(--build-profile "$DEV_BUILD_PROFILE")
                    if ! builds="$(npx --yes "eas-cli@${EAS_CLI_VERSION}" "${args[@]}" --json --non-interactive)" \
                      || ! jq -e 'type == "array"' <<< "$builds" > /dev/null 2>&1; then
                      echo "::error::Cannot list the EAS builds with runtime ${runtime}, so the comment cannot say whether a development build can load this update."
                      exit 1
                    fi
                    jq -r '.[0] // empty
                      | if ((.app.ownerAccount.name // "") != "" and (.app.slug // "") != "")
                        then "[\(.id | .[0:8])](https://expo.dev/accounts/\(.app.ownerAccount.name)/projects/\(.app.slug)/builds/\(.id))"
                        else "`\(.id)`" end' <<< "$builds" > "$DEV_BUILDS_DIR/${platform}.md"
                  done

            - name: Generate QR codes
              if: inputs.post-comment && github.event_name == 'pull_request' && steps.result.outputs.skipped-reason != 'stale-head'
              shell: bash
              env:
                  LINK_IOS: ${{ steps.result.outputs.ios-deep-link }}
                  LINK_ANDROID: ${{ steps.result.outputs.android-deep-link }}
              run: |
                  set -euo pipefail
                  qr_dir="$RUNNER_TEMP/ota-qr"
                  mkdir -p "$qr_dir"
                  if ! (cd "$qr_dir" && npm init -y >/dev/null 2>&1 && npm install --silent --ignore-scripts qrcode@1.5.4 >/dev/null 2>&1); then
                    echo "::warning::Could not install the qrcode renderer; QR codes will be omitted."
                    exit 0
                  fi
                  for entry in "ios:$LINK_IOS" "android:$LINK_ANDROID"; do
                    platform="${entry%%:*}"
                    link="${entry#*:}"
                    [ -n "$link" ] || continue
                    if ! (cd "$qr_dir" && { node -e 'const QR=require("qrcode");QR.toString(process.argv[1],{type:"terminal",small:true},(e,s)=>{if(e){process.exit(1);}process.stdout.write(s);});' "$link" 2>/dev/null | sed -e 's/\x1b\[[0-9;]*m//g'; }) > "$qr_dir/$platform.txt"; then
                      : > "$qr_dir/$platform.txt"
                    fi
                  done

            - name: Render preview comment sections
              if: inputs.post-comment && github.event_name == 'pull_request' && steps.result.outputs.skipped-reason != 'stale-head'
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  LINK_IOS: ${{ steps.result.outputs.ios-deep-link }}
                  LINK_ANDROID: ${{ steps.result.outputs.android-deep-link }}
                  RUNTIME_IOS: ${{ steps.result.outputs.ios-runtime-version }}
                  RUNTIME_ANDROID: ${{ steps.result.outputs.android-runtime-version }}
                  EAS_CHANNEL: ${{ steps.eas.outputs.channel }}
                  DEV_BUILD_SOURCE: ${{ inputs.dev-build-source }}
                  DEV_BUILDS_DIR: ${{ runner.temp }}/eas-dev-builds
                  DEV_RELEASE_TAG_PREFIX: ${{ inputs.dev-release-tag-prefix }}
                  QR_DIR: ${{ runner.temp }}/ota-qr
                  SECTIONS_DIR: ${{ runner.temp }}/preview-comment-sections
              run: |
                  set -euo pipefail
                  case "$DEV_RELEASE_TAG_PREFIX" in
                    *[!A-Za-z0-9._-]*)
                      echo "::error::dev-release-tag-prefix must be only [A-Za-z0-9._-]; got '${DEV_RELEASE_TAG_PREFIX}'."
                      exit 1
                      ;;
                  esac
                  rm -rf "$SECTIONS_DIR"
                  mkdir -p "$SECTIONS_DIR"
                  releases="$RUNNER_TEMP/dev-releases.json"
                  if [ -n "$DEV_RELEASE_TAG_PREFIX" ]; then
                    if ! gh api --paginate "repos/${REPOSITORY}/releases?per_page=100" > "$releases.pages"; then
                      echo "::error::Cannot list releases to find a development build matching the runtime version."
                      exit 1
                    fi
                    jq -s 'add // []' "$releases.pages" > "$releases"
                  fi
                  for entry in "ios:iOS:$LINK_IOS:$RUNTIME_IOS" "android:Android:$LINK_ANDROID:$RUNTIME_ANDROID"; do
                    platform="${entry%%:*}"
                    rest="${entry#*:}"
                    label="${rest%%:*}"
                    rest="${rest#*:}"
                    runtime="${rest##*:}"
                    link="${rest%:*}"
                    section="$SECTIONS_DIR/${platform}-ota.md"
                    : > "$section"
                    [ -n "$link" ] || continue
                    qr_code="$(cat "$QR_DIR/${platform}.txt" 2>/dev/null || true)"
                    {
                      echo "### ${label}: OTA update"
                      echo
                      echo "Commit \`${HEAD_SHA:0:7}\`, runtime version \`${runtime:-unknown}\`${EAS_CHANNEL:+, EAS Update channel \`${EAS_CHANNEL}\`}."
                      echo
                      if [ "${DEV_BUILD_SOURCE:-github-release}" = eas ]; then
                        match="$(cat "$DEV_BUILDS_DIR/${platform}.md" 2>/dev/null || true)"
                        if [ -n "$runtime" ] && [ -n "$match" ]; then
                          echo "EAS development build ${match} has this runtime version: install it, then open the link below."
                        else
                          echo "**Native build needed:** no finished EAS ${label} build has this runtime version, so this update will not load on one. Build a development build first."
                        fi
                        echo
                      elif [ -n "$DEV_RELEASE_TAG_PREFIX" ]; then
                        match="$(jq -r --arg prefix "${DEV_RELEASE_TAG_PREFIX}-${platform}-" --arg marker "<!-- mobile-ci:fingerprint:${runtime} -->" '
                          [.[]
                            | select(.draft == false)
                            | select(.tag_name | startswith($prefix))
                            | select((.body // "") | contains($marker))]
                          | sort_by(.created_at) | last // empty
                          | "[\(.tag_name)](\(.html_url))"
                        ' "$releases")"
                        if [ -n "$runtime" ] && [ -n "$match" ]; then
                          echo "Development build ${match} has this runtime version: install it, then open the link below."
                        else
                          echo "**Native build needed:** no published \`${DEV_RELEASE_TAG_PREFIX}-${platform}-*\` development build has this runtime version, so this update will not load on one. Build one with native-dev-release first."
                        fi
                        echo
                      fi
                      echo "Open on a device with the development build installed:"
                      echo
                      echo '`'"${link}"'`'
                      echo
                      echo "<details><summary>QR code</summary>"
                      echo
                      echo '```'
                      if [ -n "$qr_code" ]; then
                        printf '%s\n' "$qr_code"
                      else
                        echo "(QR generation unavailable; scan the link above)"
                      fi
                      echo '```'
                      echo
                      echo "</details>"
                    } > "$section"
                  done

            - name: Update the sticky preview comment
              if: inputs.post-comment && github.event_name == 'pull_request' && steps.result.outputs.skipped-reason != 'stale-head'
              uses: rnw-community/mobile-ci/actions/pr-preview-comment@v4.6.0 # v4.6.0
              with:
                  pr-number: ${{ github.event.pull_request.number }}
                  sections-dir: ${{ runner.temp }}/preview-comment-sections
