name: seed-native-cache

on:
    workflow_call:
        inputs:
            control-runner-labels:
                description: >-
                    JSON array of runner labels for the lightweight control jobs
                    (detect, status, collect, validate-manifest, cancel-queued-runs)
                    that only run Node and the GitHub API and need no self-hosted
                    hardware. Override when the org has no GitHub-hosted runners,
                    for example an ephemeral RunsOn label set.
                required: false
                type: string
                default: '["ubuntu-latest"]'
            runs-on-cache-bypass:
                description: >-
                    Run a SHA-pinned runs-on/action before any artifact traffic when
                    the job lands on a RunsOn runner started with extras=s3-cache,
                    whose cache proxy takes over the Actions results URL and makes
                    actions/upload-artifact and download-artifact fail. A no-op on
                    every other runner. Off by default.
                required: false
                type: boolean
                default: false
            ios-runner-labels:
                type: string
                required: false
                default: '["self-hosted","macOS","ARM64"]'
            android-runner-labels:
                description: >-
                    JSON array of self-hosted runner labels for seed-android. The
                    default is the x86_64 Linux pool (4 vCPU / 8 GiB): Gradle plus
                    D8 need the 8 GiB profile, and Google's Android NDK/cmake exist
                    for x86_64 Linux but not for linux-aarch64.
                type: string
                required: false
                default: '["self-hosted","trf-linux-amd64-4x8"]'
            ios-simulator-archs:
                description: >-
                    Architecture of the Simulator `.app` seed-ios builds and
                    publishes: `arm64` (default) or `x86_64`, nothing else. Must
                    match the e2e and screenshot workflows' ios-simulator-archs,
                    or the warm-up publishes under a key no pull request looks up.
                type: string
                required: false
                default: arm64
            ios-targets:
                description: >-
                    JSON array of iOS build targets: {name, appDir, workspace, scheme, prebuildCommand}.
                type: string
                required: false
                default: '[]'
            android-targets:
                description: >-
                    JSON array of Android build targets: {name, appDir, prebuildCommand}.
                type: string
                required: false
                default: '[]'
            xcode-version:
                type: string
                required: false
                default: '26.4.1'
            xcode-build:
                type: string
                required: false
                default: '17E202'
            cmdline-tools-version:
                type: string
                required: false
                default: '12266719'
            gradle-task:
                description: See build-android-app README — gradlew task to build, e.g. :app:assembleRelease to scope to one module.
                type: string
                required: false
                default: assembleRelease
            gradle-args:
                description: See build-android-app README — extra whitespace-split arguments appended after gradle-task.
                type: string
                required: false
                default: ''
            android-abis:
                description: >-
                    Comma-separated ABIs the Android base compiles, passed to Gradle
                    as -PreactNativeArchitectures. 'auto' (default) is x86_64, the
                    ABI of android-maestro.yml's default avd driver, unless
                    gradle-args or build-env already pins reactNativeArchitectures.
                    Part of the native key: it must resolve to the same ABIs as the
                    e2e workflow's android-abis, so a redroid e2e pipeline passes
                    arm64-v8a here. Empty compiles every ABI the project declares.
                type: string
                required: false
                default: auto
            ios-cache-profile:
                type: string
                required: false
                default: ios-native-v1
            android-cache-profile:
                type: string
                required: false
                default: android-native-v1
            expo-fingerprint-version:
                type: string
                required: false
                default: '0.20.6'
            node-version:
                type: string
                required: false
                default: 22.x
            install-command:
                type: string
                required: false
                default: yarn install --immutable
            enable-corepack:
                type: boolean
                required: false
                default: true
            package-manager:
                description: >-
                    JS package manager driving pnpm provisioning and, in the jobs
                    that configure one, actions/setup-node's dependency cache.
                    Leave empty to auto-detect at the repository root, in order: an
                    explicit value here, then package.json's
                    devEngines.packageManager / packageManager field (needs jq on
                    the runner), then exactly one root lockfile (yarn.lock,
                    pnpm-lock.yaml, package-lock.json / npm-shrinkwrap.json). No
                    match, an ambiguous
                    match, or an unsupported value fails the job. install-command
                    must match the resolved manager (e.g. pnpm install
                    --frozen-lockfile). Resolving to pnpm additionally requires a
                    pnpm version declared in package.json (packageManager or
                    devEngines.packageManager) because pnpm/action-setup reads it
                    from there; the corepack step is then skipped.
                type: string
                required: false
                default: ''
            build-command:
                type: string
                required: false
                default: ''
            build-env:
                description: >-
                    Newline-separated KEY=VALUE pairs appended to $GITHUB_ENV at the
                    start of each seed job. Rejects (fails closed) any line without
                    '=' or whose name does not match ^[A-Za-z_][A-Za-z0-9_]*$.
                type: string
                required: false
                default: ''
            rct-use-prebuilt-rncore:
                type: boolean
                required: false
                default: false
            rct-use-rn-dep:
                type: boolean
                required: false
                default: false
            expo-use-precompiled-modules:
                type: boolean
                required: false
                default: false
            ccache-max-size:
                type: string
                required: false
                default: 2G
            plan-runner-labels:
                description: >-
                    JSON array of self-hosted runner labels for the plan jobs, which
                    compute each target's native key and ask whether a base binary is
                    already published for it. The default is the 2 vCPU / 4 GiB x86_64
                    Linux pool without /dev/kvm (trf-linux-amd64-2x4), so these jobs
                    never queue on the scarce KVM emulator lane (#169). Keep it an
                    x86_64 pool: Google publishes Android build-tools for x86_64 Linux
                    only. Move it to the 4x8 pool if bundling the app's JavaScript needs
                    more than about 3 GiB.
                type: string
                required: false
                default: '["self-hosted","trf-linux-amd64-2x4"]'
            plan-timeout-minutes:
                type: number
                required: false
                default: 30
            publish-base:
                description: >-
                    Publish the native app this run builds as the base binary pull
                    requests repack (see docs/repack.md). On by default: warming a
                    host cache nobody else can reach is half the job. Publishing
                    needs packages: write on the calling job for the ghcr backend,
                    or actions: read for the artifact one.
                type: boolean
                required: false
                default: true
            force-base:
                description: >-
                    Rebuild and re-publish every target's base even when its native
                    key already has one. The escape hatch for the case a
                    fingerprint cannot see - an ignored package that changed native
                    code, or a rotated embedded secret. It overwrites a base other
                    builds are already repacking onto, so say why in the run.
                type: boolean
                required: false
                default: false
            base-backend:
                description: '`ghcr` (default) or `artifact`. See expo-base-binary.'
                type: string
                required: false
                default: ghcr
            base-flavor:
                description: Flavor segment of the base binary's address.
                type: string
                required: false
                default: e2e
            fingerprint-config:
                description: >-
                    Path, relative to a target's appDir, of the @expo/fingerprint
                    config whose ignore list is the correctness boundary of every
                    repack. Its hash is part of the native key. See docs/repack.md.
                type: string
                required: false
                default: fingerprint.config.js
            fingerprint-env:
                description: >-
                    Newline-separated KEY=VALUE pairs exported while the native key
                    is computed. Must be byte-identical to what the e2e workflows
                    pass, or the warm-up publishes under a key no pull request ever
                    looks up.
                type: string
                required: false
                default: ''
            repack-app-version:
                description: Pinned @expo/repack-app npm version used by the plan jobs.
                type: string
                required: false
                default: '0.7.2'
            android-build-tools-version:
                description: Android build-tools version the plan job installs.
                type: string
                required: false
                default: '35.0.0'
            ios-timeout-minutes:
                type: number
                required: false
                default: 90
            android-timeout-minutes:
                type: number
                required: false
                default: 60

        secrets:
            build-secrets-env:
                description: >-
                    Masked newline-separated KEY=VALUE entries (KEY<<DELIMITER for a
                    multi-line value) exported, after build-env, in every job that
                    installs, bundles or compiles the app: the plan/repack leg and
                    the native build. For what a real build needs but a log must
                    never show - a remote turbo cache token, a Maps API key compiled
                    into the base. Only a SHA-256 digest of the entries enters the
                    native key, so rotating one moves the key, and the warm-up must
                    be passed the same secret or the two never agree on a key.
                required: false

concurrency:
    group: seed-native-cache-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    ios-compile-caches:
        name: Find evicted iOS compile caches
        if: inputs.ios-targets != '[]'
        runs-on: ${{ fromJSON(inputs.control-runner-labels) }}
        timeout-minutes: 10
        permissions:
            actions: read
        outputs:
            targets: ${{ steps.caches.outputs.targets }}
        steps:
            - name: Apply RunsOn cache bypass
              uses: rnw-community/mobile-ci/actions/runs-on-cache-bypass@v4.1.0 # v4.1.0
              with:
                  enabled: ${{ inputs.runs-on-cache-bypass }}
            - name: Mark the targets whose iOS compile caches are missing
              id: caches
              shell: bash
              env:
                  TARGETS: ${{ inputs.ios-targets }}
                  XCODE_VERSION: ${{ inputs.xcode-version }}
                  GITHUB_TOKEN: ${{ github.token }}
                  API_URL: ${{ github.api_url }}
                  REPOSITORY: ${{ github.repository }}
                  REF: ${{ github.ref }}
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              run: |
                  set -euo pipefail
                  fail() {
                    echo "::error::$1"
                    exit 1
                  }
                  for tool in curl jq; do
                    command -v "$tool" >/dev/null 2>&1 || fail "$tool is required to look the iOS compile caches up, and is not on PATH."
                  done

                  refs=("$REF")
                  if [ -n "$DEFAULT_BRANCH" ] && [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
                    refs+=("refs/heads/$DEFAULT_BRANCH")
                  fi

                  response="$RUNNER_TEMP/ios-compile-caches.$$.json"
                  restorable() {
                    local prefix="$1" ref encoded_key encoded_ref status count
                    encoded_key="$(jq -rn --arg value "$prefix" '$value | @uri')"
                    for ref in "${refs[@]}"; do
                      encoded_ref="$(jq -rn --arg value "$ref" '$value | @uri')"
                      status=0
                      curl -fsS --retry 3 --max-time 60 \
                        -H "Authorization: Bearer $GITHUB_TOKEN" \
                        -H 'Accept: application/vnd.github+json' \
                        -H 'X-GitHub-Api-Version: 2022-11-28' \
                        -o "$response" \
                        "$API_URL/repos/$REPOSITORY/actions/caches?key=$encoded_key&ref=$encoded_ref&per_page=1" || status=$?
                      if [ "$status" -ne 0 ]; then
                        fail "The Actions cache API could not be queried for '$prefix' on $ref (curl exited $status). An unreadable cache index is not an evicted cache; the calling job needs permissions: actions: read."
                      fi
                      count="$(jq -er '.total_count | numbers' "$response")" \
                        || fail "The Actions cache API answered for '$prefix' on $ref without a numeric total_count."
                      if [ "$count" -gt 0 ]; then
                        return 0
                      fi
                    done
                    return 1
                  }

                  marked='[]'
                  refill=0
                  target_count="$(jq -er 'length' <<< "$TARGETS")" || fail "ios-targets is not a JSON array."
                  for index in $(seq 0 $((target_count - 1))); do
                    target="$(jq -c ".[$index]" <<< "$TARGETS")"
                    name="$(jq -er '.name | strings' <<< "$target")" || fail "ios-targets[$index] has no name."
                    missing=''
                    for prefix in "ccache-ios-${name}-macOS-xcode-${XCODE_VERSION}-" "pods-${name}-macOS-xcode-${XCODE_VERSION}-"; do
                      if ! restorable "$prefix"; then
                        missing="${missing:+$missing, }${prefix}*"
                      fi
                    done
                    if [ -n "$missing" ]; then
                      refill=$((refill + 1))
                      target="$(jq -c '. + {forceNative: true}' <<< "$target")"
                      echo "### iOS ${name}: compile caches missing" >> "$GITHUB_STEP_SUMMARY"
                      echo "Nothing restorable under ${missing}, so the next native build would run cold; this warm-up builds the target to refill them." >> "$GITHUB_STEP_SUMMARY"
                      echo "${name}: nothing restorable under ${missing}; planned for a native build."
                    else
                      echo "${name}: ccache and CocoaPods caches are restorable."
                    fi
                    marked="$(jq -c --argjson target "$target" '. + [$target]' <<< "$marked")"
                  done
                  rm -f "$response"
                  echo "Targets planned to refill their compile caches: $refill of $target_count."
                  echo "targets=$marked" >> "$GITHUB_OUTPUT"

    plan-ios:
        name: Plan iOS warm-up
        needs: ios-compile-caches
        if: inputs.ios-targets != '[]'
        permissions:
            contents: read
            packages: read
            actions: read
        uses: rnw-community/mobile-ci/.github/workflows/expo-base-plan.yml@v4.0.0 # v4.0.0
        with:
            control-runner-labels: ${{ inputs.control-runner-labels }}
            runs-on-cache-bypass: ${{ inputs.runs-on-cache-bypass }}
            platform: ios
            targets: ${{ needs.ios-compile-caches.outputs.targets }}
            build-strategy: ${{ inputs.force-base && 'native' || 'auto' }}
            repack: false
            runner-labels: ${{ inputs.plan-runner-labels }}
            timeout-minutes: ${{ inputs.plan-timeout-minutes }}
            app-artifact-prefix: ios-base-app
            plan-artifact-prefix: ios-base-plan
            toolchain: xcode-${{ inputs.xcode-version }}-${{ inputs.xcode-build }}${{ inputs.rct-use-prebuilt-rncore && '-rncore' || '' }}${{ inputs.rct-use-rn-dep && '-rndep' || '' }}${{ inputs.expo-use-precompiled-modules && '-precompiled' || '' }}
            ios-simulator-archs: ${{ inputs.ios-simulator-archs }}
            base-backend: ${{ inputs.base-backend }}
            base-flavor: ${{ inputs.base-flavor }}
            fingerprint-config: ${{ inputs.fingerprint-config }}
            fingerprint-env: ${{ inputs.fingerprint-env }}
            expo-fingerprint-version: ${{ inputs.expo-fingerprint-version }}
            repack-app-version: ${{ inputs.repack-app-version }}
            node-version: ${{ inputs.node-version }}
            install-command: ${{ inputs.install-command }}
            enable-corepack: ${{ inputs.enable-corepack }}
            package-manager: ${{ inputs.package-manager }}
            build-command: ${{ inputs.build-command }}
            build-env: ${{ inputs.build-env }}
        secrets:
            build-secrets-env: ${{ secrets.build-secrets-env }}

    android-abis:
        name: Resolve the Android ABIs
        if: inputs.android-targets != '[]'
        runs-on: ${{ fromJSON(inputs.control-runner-labels) }}
        timeout-minutes: 5
        outputs:
            abis: ${{ steps.android-abis.outputs.abis }}
            key-segment: ${{ steps.android-abis.outputs.key-segment }}
        steps:
            - name: Apply RunsOn cache bypass
              uses: rnw-community/mobile-ci/actions/runs-on-cache-bypass@v4.1.0 # v4.1.0
              with:
                  enabled: ${{ inputs.runs-on-cache-bypass }}
            - name: Resolve the Android ABIs
              id: android-abis
              shell: bash
              env:
                  ANDROID_ABIS: ${{ inputs.android-abis }}
                  ANDROID_DRIVER: avd
                  EMULATOR_ARCH: x86_64
                  GRADLE_ARGS: ${{ inputs.gradle-args }}
                  BUILD_ENV: ${{ inputs.build-env }}
              run: |
                  set -euo pipefail
                  fail() {
                    echo "::error::$1"
                    exit 1
                  }

                  pinned=''
                  pinned_by=''
                  pin() {
                    if [ -n "$pinned" ] && [ "$pinned" != "$1" ]; then
                      fail "reactNativeArchitectures is pinned to '$pinned' by $pinned_by and to '$1' by $2. Gradle would build one set of ABIs while the native key describes another; pin it once."
                    fi
                    pinned="$1"
                    pinned_by="$2"
                  }

                  normalized_gradle_args="${GRADLE_ARGS//$'\n'/ }"
                  normalized_gradle_args="${normalized_gradle_args//$'\r'/ }"
                  read -r -a gradle_args <<< "$normalized_gradle_args"
                  for arg in ${gradle_args[@]+"${gradle_args[@]}"}; do
                    case "$arg" in
                      -PreactNativeArchitectures=*) pin "${arg#*=}" gradle-args ;;
                    esac
                  done
                  while IFS= read -r line; do
                    case "$line" in
                      ORG_GRADLE_PROJECT_reactNativeArchitectures=*) pin "${line#*=}" build-env ;;
                    esac
                  done <<< "$BUILD_ENV"

                  case "$ANDROID_ABIS" in
                    auto)
                      if [ -n "$pinned" ]; then
                        abis=''
                        echo "android-abis is auto and $pinned_by already pins reactNativeArchitectures to '$pinned'; it is left to $pinned_by."
                      else
                        case "$ANDROID_DRIVER" in
                          avd) abis="$EMULATOR_ARCH" ;;
                          redroid) abis=arm64-v8a ;;
                          device-cloud) fail "android-abis is auto but android-driver is device-cloud, whose device architecture this workflow cannot see, so no ABI follows from it. Set android-abis explicitly to the ABIs Device Cloud's devices run (and pass seed-native-cache.yml the same value, or the warm-up publishes under another key)." ;;
                          *) fail "android-abis is auto but android-driver '$ANDROID_DRIVER' is neither 'avd' nor 'redroid', so no ABI follows from it. Set android-abis explicitly." ;;
                        esac
                      fi
                      ;;
                    '')
                      abis=''
                      ;;
                    *)
                      abis="$ANDROID_ABIS"
                      if [ -n "$pinned" ] && [ "$pinned" != "$abis" ]; then
                        fail "android-abis is '$abis' but $pinned_by pins reactNativeArchitectures to '$pinned'. Gradle would build one set of ABIs while the native key describes another; drop one of the two."
                      fi
                      ;;
                  esac

                  if [ -n "$abis" ]; then
                    IFS=, read -r -a abi_list <<< "$abis"
                    case "$abis" in
                      ,*|*,|*,,*) abi_list=('') ;;
                    esac
                    for abi in "${abi_list[@]}"; do
                      case "$abi" in
                        armeabi-v7a|arm64-v8a|x86|x86_64) ;;
                        *) fail "android-abis resolved to '$abis', which is not a comma-separated list of armeabi-v7a, arm64-v8a, x86 and x86_64 without spaces." ;;
                      esac
                    done
                  fi

                  built="${abis:-$pinned}"
                  key_segment=''
                  if [ -n "$built" ]; then
                    key_segment="-abi-$built"
                  fi
                  echo "Android ABIs: ${built:-every ABI the project declares}"
                  {
                    echo "abis=$abis"
                    echo "key-segment=$key_segment"
                  } >> "$GITHUB_OUTPUT"

    plan-android:
        name: Plan Android warm-up
        needs: android-abis
        if: inputs.android-targets != '[]'
        permissions:
            contents: read
            packages: read
            actions: read
        uses: rnw-community/mobile-ci/.github/workflows/expo-base-plan.yml@v4.0.0 # v4.0.0
        with:
            control-runner-labels: ${{ inputs.control-runner-labels }}
            runs-on-cache-bypass: ${{ inputs.runs-on-cache-bypass }}
            platform: android
            targets: ${{ inputs.android-targets }}
            build-strategy: ${{ inputs.force-base && 'native' || 'auto' }}
            repack: false
            runner-labels: ${{ inputs.plan-runner-labels }}
            timeout-minutes: ${{ inputs.plan-timeout-minutes }}
            app-artifact-prefix: android-base-app
            plan-artifact-prefix: android-base-plan
            toolchain: cmdline-${{ inputs.cmdline-tools-version }}-${{ inputs.gradle-task }}${{ inputs.gradle-args != '' && format('-{0}', inputs.gradle-args) || '' }}${{ needs.android-abis.outputs.key-segment }}
            base-backend: ${{ inputs.base-backend }}
            base-flavor: ${{ inputs.base-flavor }}
            fingerprint-config: ${{ inputs.fingerprint-config }}
            fingerprint-env: ${{ inputs.fingerprint-env }}
            expo-fingerprint-version: ${{ inputs.expo-fingerprint-version }}
            repack-app-version: ${{ inputs.repack-app-version }}
            cmdline-tools-version: ${{ inputs.cmdline-tools-version }}
            android-build-tools-version: ${{ inputs.android-build-tools-version }}
            node-version: ${{ inputs.node-version }}
            install-command: ${{ inputs.install-command }}
            enable-corepack: ${{ inputs.enable-corepack }}
            package-manager: ${{ inputs.package-manager }}
            build-command: ${{ inputs.build-command }}
            build-env: ${{ inputs.build-env }}
        secrets:
            build-secrets-env: ${{ secrets.build-secrets-env }}

    seed-ios:
        name: Seed iOS native app (${{ matrix.target.name }})
        needs: plan-ios
        if: ${{ !cancelled() && needs.plan-ios.result == 'success' && needs.plan-ios.outputs.native-targets != '[]' }}
        runs-on: ${{ fromJSON(inputs.ios-runner-labels) }}
        timeout-minutes: ${{ inputs.ios-timeout-minutes }}
        permissions:
            contents: read
            packages: write
            actions: read
        concurrency:
            group: ${{ (inputs.publish-base && github.ref_name == github.event.repository.default_branch) && format('expo-base-publish-{0}-ios-{1}-{2}', github.repository, inputs.base-flavor, matrix.target.nativeKey) || format('expo-base-build-{0}-{1}-ios-{2}', github.run_id, github.run_attempt, matrix.target.name) }}
            cancel-in-progress: false
        strategy:
            fail-fast: false
            matrix:
                target: ${{ fromJSON(needs.plan-ios.outputs.native-targets) }}
        env:
            IOS_DERIVED_DATA: ${{ github.workspace }}/.ci-cache/DerivedData/${{ matrix.target.name }}
            CCACHE_DIR: ${{ github.workspace }}/.ci-cache/ccache/ios-${{ matrix.target.name }}

        steps:
            - name: Apply RunsOn cache bypass
              uses: rnw-community/mobile-ci/actions/runs-on-cache-bypass@v4.1.0 # v4.1.0
              with:
                  enabled: ${{ inputs.runs-on-cache-bypass }}
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - name: Apply build-env
              if: inputs.build-env != ''
              shell: bash
              env:
                  BUILD_ENV: ${{ inputs.build-env }}
              run: |
                  set -euo pipefail
                  while IFS= read -r line; do
                    [ -z "$line" ] && continue
                    case "$line" in
                      *=*) ;;
                      *)
                        echo "::error::build-env line '$line' is missing '='; expected KEY=VALUE."
                        exit 1
                        ;;
                    esac
                    name="${line%%=*}"
                    case "$name" in
                      ''|[!A-Za-z_]*)
                        echo "::error::build-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    case "$name" in
                      *[!A-Za-z0-9_]*)
                        echo "::error::build-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    echo "$line" >> "$GITHUB_ENV"
                  done <<< "$BUILD_ENV"

            - name: Apply build-secrets-env
              uses: rnw-community/mobile-ci/actions/apply-secret-env@v4.1.0 # v4.1.0
              with:
                  env: ${{ secrets.build-secrets-env }}
                  label: build-secrets-env

            - name: Resolve package manager
              id: package-manager
              shell: bash
              env:
                  PACKAGE_MANAGER: ${{ inputs.package-manager }}
                  LOCKFILE_REQUIRED: ''
              run: |
                  set -euo pipefail
                  pm=''
                  case "$PACKAGE_MANAGER" in
                    '') ;;
                    yarn|pnpm|npm) pm="$PACKAGE_MANAGER" ;;
                    *)
                      echo "::error::package-manager must be '' (auto-detect), yarn, pnpm or npm; got '$PACKAGE_MANAGER'."
                      exit 1
                      ;;
                  esac
                  declared=''
                  declared_version=''
                  if { [ -z "$pm" ] || [ "$pm" = pnpm ]; } && [ -f package.json ]; then
                    if command -v jq >/dev/null 2>&1; then
                      declared_spec="$(jq -r '
                        (try (.devEngines.packageManager) catch null) as $raw
                        | (if ($raw | type) == "array" then ($raw[0] // null) else $raw end) as $de
                        | (if ($de | type) == "object" then [($de.name // ""), ($de.version // "")] else ["", ""] end) as $dev
                        | (if ((.packageManager // "") | type) == "string" and (.packageManager // "") != ""
                           then (.packageManager | if test("@") then [split("@")[0], (split("@")[1] | split("+")[0])] else [., ""] end)
                           else ["", ""] end) as $spec
                        | (if $dev[0] != "" then $dev[0] else $spec[0] end) as $name
                        | [$name,
                           (if $dev[0] != "" and $dev[1] != "" then $dev[1]
                            elif $spec[0] == $name then $spec[1]
                            else "" end)]
                        | @tsv' package.json)"
                      declared="$(printf '%s\n' "$declared_spec" | cut -f1)"
                      declared_version="$(printf '%s\n' "$declared_spec" | cut -f2)"
                    else
