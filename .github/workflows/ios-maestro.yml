name: ios-maestro

on:
    workflow_call:
        inputs:
            runner-labels:
                description: JSON array of self-hosted runner labels for the build/test jobs.
                type: string
                required: false
                default: '["self-hosted","macOS","ARM64"]'
            build-runner-labels:
                description: >-
                    JSON array of self-hosted runner labels for the build job only. Falls
                    back to runner-labels when empty; set this and test-runner-labels
                    together to split build/test across separate runner pools.
                type: string
                required: false
                default: ''
            test-runner-labels:
                description: >-
                    JSON array of self-hosted runner labels for the test job only. Falls
                    back to runner-labels when empty. Must resolve to an arm64 macOS
                    pool regardless of the build pool's architecture: the packaged
                    Simulator app build-ios-app produces is arm64-only (see
                    build-ios-app's archs input, which this workflow does not expose
                    an override for), so a test pool on any other architecture cannot
                    launch it.
                type: string
                required: false
                default: ''
            targets:
                description: >-
                    JSON array of build targets: {name, appDir, workspace, scheme, appId,
                    prebuildCommand}. prebuildCommand may be an empty string.
                type: string
                required: true
            flows-dir:
                description: >-
                    Directory (relative to repo root) whose top-level files are the
                    runnable Maestro flows by default. Subdirectories are not searched
                    unless flows-max-depth is raised; see flows-max-depth/flows-name-pattern.
                type: string
                required: true
            flows-max-depth:
                description: >-
                    find -maxdepth under flows-dir. 0 means unbounded recursion. Default
                    1 (top-level only) keeps subflows invoked via runFlow, conventionally
                    living in subdirectories, out of the shard.
                type: string
                required: false
                default: '1'
            flows-name-pattern:
                description: >-
                    Space-separated find -name globs (OR'd together) selecting runnable
                    flows directly inside flows-dir. Keeps reusable subflows and
                    capture-only flows in subdirectories out of the shard by default.
                type: string
                required: false
                default: '*.flow.yaml'
            flows-exclude-pattern:
                description: Optional find ! -name glob excluding matched flows by basename.
                type: string
                required: false
                default: ''
            shard-manifest-dir:
                description: >-
                    Optional directory (relative to repo root) of hand-curated
                    shard-<index>.txt files (one flows-dir-relative flow path per line)
                    overriding the computed index-modulo split so a consumer's balanced
                    shard assignment survives. Unset (default) falls back to the
                    index-modulo split entirely.
                type: string
                required: false
                default: ''
            pre-run-flow:
                description: >-
                    Path to a single priming flow run once before each shard's flows,
                    excluded from sharding. Its failure fails that shard immediately.
                type: string
                required: false
                default: ''
            flow-recovery-flow:
                description: >-
                    Path to a single best-effort recovery flow run after a failed flow
                    attempt: before the same flow's next retry attempt, and before the
                    next flow starts, so a failure cannot strand the app in a state that
                    cascades into the flows after it. Not run after a passing attempt,
                    and not after a shard's last flow. Its own failure only logs a
                    warning and never fails the shard. Like pre-run-flow it is removed
                    from the discovered flow list, so it never also runs as a scenario of
                    its own. Leave empty to skip recovery.
                type: string
                required: false
                default: ''
            pre-test-command:
                description: >-
                    Optional consumer-owned shell command run once after the app is
                    installed on the simulator and before any flow (including
                    pre-run-flow) executes, e.g. seeding a fixture into the app's data
                    container. Runs with SIMULATOR_UDID, APP_ID, and APP_PATH in its
                    environment. Its failure fails that shard immediately.
                type: string
                required: false
                default: ''
            maestro-env:
                description: >-
                    Newline-separated KEY=VALUE pairs, each passed as an additional
                    -e KEY=VALUE argument to every `maestro test` invocation (pre-run-flow
                    and shard flows alike). Rejects (fails closed) any line without '='
                    or whose name does not match ^[A-Za-z_][A-Za-z0-9_]*$.
                type: string
                required: false
                default: ''
            maestro-config:
                description: >-
                    Path to the consumer's Maestro workspace config (config.yaml),
                    passed as --config to every `maestro test` invocation. Maestro only
                    auto-discovers a workspace config.yaml when it is pointed at a
                    directory, and the actions below always pass individual flow files,
                    so without this input a workspace config is silently ignored.
                    Relative paths resolve against the job's working directory. Fails
                    closed when set to a path that is not a file.
                type: string
                required: false
                default: ''
            flow-retries:
                description: >-
                    Non-negative retry budget per flow; each flow gets up to
                    1 + flow-retries attempts.
                type: string
                required: false
                default: '0'
            app-warm-seconds:
                description: >-
                    Seconds the app is left running during a one-off warm-up
                    (launch, settle, terminate) performed after install and
                    before any flow runs, so first-launch cold-start cost is
                    not absorbed by the first flow's own timeout budget. Set
                    to '0' to disable warming.
                type: string
                required: false
                default: '20'
            shard-count:
                type: number
                required: false
                default: 2
            xcode-version:
                type: string
                required: false
                default: '26.4.1'
            xcode-build:
                type: string
                required: false
                default: '17E202'
            cache-profile:
                description: Cache-key prefix distinguishing this consumer/app.
                type: string
                required: false
                default: ios-native-v1
            turbo-version:
                type: string
                required: false
                default: '2.10.8'
            target-packages:
                description: Newline-separated package names gating this pipeline on pull_request events.
                type: string
                required: false
                default: ''
            expo-fingerprint-version:
                type: string
                required: false
                default: '0.20.6'
            maestro-version:
                type: string
                required: false
                default: '2.8.0'
            simulator-device:
                description: >-
                    Exact simulator device name to boot (e.g. 'iPhone 17 Pro'), matched
                    against `xcrun simctl list devices available` with no fuzzy matching
                    — fails closed, listing the available devices, when no exact match
                    exists. Leave empty (default) to keep the previous last-available
                    heuristic, which emits a `::notice::` naming its choice. Pinning
                    requires the device set to be provisioned identically across every
                    host in test-runner-labels/runner-labels' pool.
                type: string
                required: false
                default: ''
            node-version:
                type: string
                required: false
                default: 22.x
            install-command:
                type: string
                required: false
                default: yarn install --immutable
            enable-corepack:
                type: boolean
                required: false
                default: true
            build-command:
                description: Optional workspace JS build command run at repo root before the native build.
                type: string
                required: false
                default: ''
            rct-use-prebuilt-rncore:
                type: boolean
                required: false
                default: false
            rct-use-rn-dep:
                type: boolean
                required: false
                default: false
            expo-use-precompiled-modules:
                type: boolean
                required: false
                default: false
            ccache-max-size:
                type: string
                required: false
                default: 2G
            build-env:
                description: >-
                    Newline-separated KEY=VALUE pairs appended to $GITHUB_ENV at the
                    start of the build job. Rejects (fails closed) any line without
                    '=' or whose name does not match ^[A-Za-z_][A-Za-z0-9_]*$.
                type: string
                required: false
                default: ''
            repack-on-hit:
                description: >-
                    On a native-app-cache hit, run repack-app to inject a freshly
                    exported JS bundle into the cached shell instead of reusing it
                    unchanged. Falls back to a full native build if the repack fails.
                type: boolean
                required: false
                default: false
            repack-app-version:
                description: Pinned @expo/repack-app npm version, used only when repack-on-hit is true.
                type: string
                required: false
                default: '0.7.2'
            build-timeout-minutes:
                type: number
                required: false
                default: 60
            test-timeout-minutes:
                type: number
                required: false
                default: 75

concurrency:
    group: ios-maestro-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    detect:
        name: Detect affected packages
        runs-on: ubuntu-latest
        outputs:
            affected: ${{ steps.affected.outputs.affected }}
            shard-indices: ${{ steps.shard-indices.outputs.indices }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ inputs.node-version }}
            - uses: rnw-community/mobile-ci/actions/turbo-affected@v1.6.5 # v1.6.5
              id: affected
              with:
                  turbo-version: ${{ inputs.turbo-version }}
                  target-packages: ${{ inputs.target-packages }}
                  base-sha: ${{ github.event.pull_request.base.sha }}
                  always-affected: ${{ github.event_name != 'pull_request' || inputs.target-packages == '' }}

            # The test job's matrix.shard-index must exactly match
            # inputs.shard-count: fewer indices than shard-count silently
            # never runs the flows assigned to the missing indices (the
            # suite still reports success), and more indices than
            # shard-count fails run-maestro-ios's own [0, shard-count)
            # bounds check. A hard-coded matrix can only ever match one
            # specific shard-count, so derive it here instead.
            - name: Compute shard indices
              id: shard-indices
              shell: bash
              env:
                  SHARD_COUNT: ${{ inputs.shard-count }}
                  TARGETS: ${{ inputs.targets }}
              run: |
                  set -euo pipefail
                  if [ "$SHARD_COUNT" -lt 1 ]; then
                    echo "::error::shard-count must be >= 1, got $SHARD_COUNT."
                    exit 1
                  fi
                  target_count=$(jq 'length' <<< "$TARGETS")
                  total_jobs=$(( target_count * SHARD_COUNT ))
                  if [ "$total_jobs" -gt 256 ]; then
                    echo "::error::targets ($target_count) x shard-count ($SHARD_COUNT) = $total_jobs test jobs, exceeding GitHub Actions' 256-job matrix limit."
                    exit 1
                  fi
                  indices=$(seq 0 $((SHARD_COUNT - 1)) | jq -R 'tonumber' | jq -sc .)
                  echo "indices=$indices" >> "$GITHUB_OUTPUT"

    build:
        name: Build (${{ matrix.target.name }})
        needs: detect
        if: needs.detect.outputs.affected == 'true'
        runs-on: ${{ fromJSON(inputs.build-runner-labels != '' && inputs.build-runner-labels || inputs.runner-labels) }}
        timeout-minutes: ${{ inputs.build-timeout-minutes }}
        strategy:
            fail-fast: false
            matrix:
                target: ${{ fromJSON(inputs.targets) }}
        env:
            APP_DIR: ${{ matrix.target.appDir }}
            IOS_DERIVED_DATA: ${{ github.workspace }}/.ci-cache/DerivedData/${{ matrix.target.name }}
            CCACHE_DIR: ${{ github.workspace }}/.ci-cache/ccache/ios-${{ matrix.target.name }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - name: Apply build-env
              if: inputs.build-env != ''
              shell: bash
              env:
                  BUILD_ENV: ${{ inputs.build-env }}
              run: |
                  set -euo pipefail
                  while IFS= read -r line; do
                    [ -z "$line" ] && continue
                    case "$line" in
                      *=*) ;;
                      *)
                        echo "::error::build-env line '$line' is missing '='; expected KEY=VALUE."
                        exit 1
                        ;;
                    esac
                    name="${line%%=*}"
                    case "$name" in
                      ''|[!A-Za-z_]*)
                        echo "::error::build-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    case "$name" in
                      *[!A-Za-z0-9_]*)
                        echo "::error::build-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    echo "$line" >> "$GITHUB_ENV"
                  done <<< "$BUILD_ENV"

            - name: Setup Node
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ inputs.node-version }}
                  cache: yarn

            - name: Enable corepack
              if: inputs.enable-corepack
              shell: bash
              run: corepack enable

            - name: Install dependencies
              shell: bash
              env:
                  INSTALL_COMMAND: ${{ inputs.install-command }}
              run: eval "$INSTALL_COMMAND"

            - name: setup-xcode-pinned
              id: xcode
              uses: rnw-community/mobile-ci/actions/setup-xcode-pinned@v1.6.5 # v1.6.5
              with:
                  version: ${{ inputs.xcode-version }}
                  build: ${{ inputs.xcode-build }}

            - name: Build workspace JS dependencies
              if: inputs.build-command != ''
              shell: bash
              env:
                  BUILD_COMMAND: ${{ inputs.build-command }}
              run: eval "$BUILD_COMMAND"

            - name: Generate native project
              if: matrix.target.prebuildCommand != ''
              working-directory: ${{ matrix.target.appDir }}
              shell: bash
              env:
                  PREBUILD_COMMAND: ${{ matrix.target.prebuildCommand }}
                  RCT_USE_PREBUILT_RNCORE_ENABLED: ${{ inputs.rct-use-prebuilt-rncore }}
                  RCT_USE_RN_DEP_ENABLED: ${{ inputs.rct-use-rn-dep }}
                  EXPO_USE_PRECOMPILED_MODULES_ENABLED: ${{ inputs.expo-use-precompiled-modules }}
              run: |
                  if [ "$RCT_USE_PREBUILT_RNCORE_ENABLED" = 'true' ]; then
                    export RCT_USE_PREBUILT_RNCORE=1
                  fi
                  if [ "$RCT_USE_RN_DEP_ENABLED" = 'true' ]; then
                    export RCT_USE_RN_DEP=1
                  fi
                  if [ "$EXPO_USE_PRECOMPILED_MODULES_ENABLED" = 'true' ]; then
                    export EXPO_USE_PRECOMPILED_MODULES=1
                  fi
                  eval "$PREBUILD_COMMAND"

            - name: native-fingerprint
              id: fingerprint
              uses: rnw-community/mobile-ci/actions/native-fingerprint@v1.6.5 # v1.6.5
              with:
                  platform: ios
                  working-directory: ${{ matrix.target.appDir }}
                  fingerprint-version: ${{ inputs.expo-fingerprint-version }}

            - name: native-app-cache (restore)
              id: native-app-cache
              uses: rnw-community/mobile-ci/actions/native-app-cache@v1.6.5 # v1.6.5
              with:
                  mode: restore
                  path: .ci-cache/ios-native-app/${{ matrix.target.name }}
                  profile: ${{ inputs.cache-profile }}-${{ matrix.target.name }}
                  arch: arm64
                  toolchain: ${{ steps.xcode.outputs.toolchain-key }}
                  fingerprint: ${{ steps.fingerprint.outputs.hash }}

            - name: Repack fresh JS into cached native app
              id: repack
              if: inputs.repack-on-hit && steps.native-app-cache.outputs.cache-hit == 'true'
              continue-on-error: true
              uses: rnw-community/mobile-ci/actions/repack-app@v1.6.5 # v1.6.5
              with:
                  platform: ios
                  app-path: .ci-cache/ios-native-app/${{ matrix.target.name }}/Base.app
                  app-id: ${{ matrix.target.appId }}
                  app-dir: ${{ matrix.target.appDir }}
                  repack-version: ${{ inputs.repack-app-version }}

            - name: Determine whether a native build is needed
              id: build-decision
              shell: bash
              env:
                  CACHE_HIT: ${{ steps.native-app-cache.outputs.cache-hit }}
                  REPACK_ON_HIT: ${{ inputs.repack-on-hit }}
                  REPACK_OUTCOME: ${{ steps.repack.outcome }}
              run: |
                  set -euo pipefail
                  need_build=true
                  if [ "$CACHE_HIT" = "true" ] && { [ "$REPACK_ON_HIT" != "true" ] || [ "$REPACK_OUTCOME" = "success" ]; }; then
                    need_build=false
                  fi
                  echo "need-build=$need_build" >> "$GITHUB_OUTPUT"

            - name: Report cache hit
              if: steps.native-app-cache.outputs.cache-hit == 'true' && steps.build-decision.outputs.need-build != 'true'
              shell: bash
              env:
                  TARGET_NAME: ${{ matrix.target.name }}
                  REPACK_ON_HIT: ${{ inputs.repack-on-hit }}
              run: |
                  {
                    echo "### iOS build: ${TARGET_NAME} (warm — native build skipped)"
                    if [ "$REPACK_ON_HIT" = "true" ]; then
                      echo "Native fingerprint hit; repack-app injected a fresh JS bundle into the cached shell."
                    else
                      echo "Native fingerprint hit; embedded JS bundle dates from when this shell was cached."
                    fi
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Report repack fallback
              if: steps.native-app-cache.outputs.cache-hit == 'true' && steps.build-decision.outputs.need-build == 'true'
              shell: bash
              env:
                  TARGET_NAME: ${{ matrix.target.name }}
              run: |
                  echo "### iOS build: ${TARGET_NAME} (repack-on-hit failed — falling back to a full native build)" >> "$GITHUB_STEP_SUMMARY"

            - name: Clean stale app before native build
              if: steps.build-decision.outputs.need-build == 'true'
              shell: bash
              env:
                  APP_PATH: .ci-cache/ios-native-app/${{ matrix.target.name }}/Base.app
              run: rm -rf "$APP_PATH"

            - name: setup-ccache-ios (restore)
              if: steps.build-decision.outputs.need-build == 'true'
              uses: rnw-community/mobile-ci/actions/setup-ccache-ios@v1.6.5 # v1.6.5
              with:
                  mode: restore
                  ccache-dir: ${{ env.CCACHE_DIR }}
                  derived-data-dir: ${{ env.IOS_DERIVED_DATA }}
                  max-size: ${{ inputs.ccache-max-size }}
                  key: ccache-ios-${{ matrix.target.name }}-${{ runner.os }}-xcode-${{ inputs.xcode-version }}-${{ hashFiles('yarn.lock', format('{0}/ios/Podfile.lock', matrix.target.appDir)) }}
                  restore-keys: |
                      ccache-ios-${{ matrix.target.name }}-${{ runner.os }}-xcode-${{ inputs.xcode-version }}-
                      ccache-ios-${{ matrix.target.name }}-${{ runner.os }}-

            - name: build-ios-app
              if: steps.build-decision.outputs.need-build == 'true'
              id: build
              uses: rnw-community/mobile-ci/actions/build-ios-app@v1.6.5 # v1.6.5
              with:
                  app-dir: ${{ matrix.target.appDir }}
                  workspace: ${{ matrix.target.workspace }}
                  scheme: ${{ matrix.target.scheme }}
                  derived-data-dir: ${{ env.IOS_DERIVED_DATA }}
                  output-dir: .ci-cache/ios-native-app/${{ matrix.target.name }}
                  pods-cache-key: pods-${{ matrix.target.name }}-${{ runner.os }}-xcode-${{ inputs.xcode-version }}-${{ hashFiles('yarn.lock', format('{0}/ios/Podfile.lock', matrix.target.appDir)) }}
                  pods-cache-restore-keys: |
                      pods-${{ matrix.target.name }}-${{ runner.os }}-xcode-${{ inputs.xcode-version }}-
                      pods-${{ matrix.target.name }}-${{ runner.os }}-
                  rct-use-prebuilt-rncore: ${{ inputs.rct-use-prebuilt-rncore }}
                  rct-use-rn-dep: ${{ inputs.rct-use-rn-dep }}
                  expo-use-precompiled-modules: ${{ inputs.expo-use-precompiled-modules }}

            - name: setup-ccache-ios (save)
              if: steps.build-decision.outputs.need-build == 'true'
              uses: rnw-community/mobile-ci/actions/setup-ccache-ios@v1.6.5 # v1.6.5
              with:
                  mode: save
                  ccache-dir: ${{ env.CCACHE_DIR }}
                  key: ccache-ios-${{ matrix.target.name }}-${{ runner.os }}-xcode-${{ inputs.xcode-version }}-${{ hashFiles('yarn.lock', format('{0}/ios/Podfile.lock', matrix.target.appDir)) }}

            - name: native-app-cache (save)
              if: steps.native-app-cache.outputs.cache-hit != 'true'
              uses: rnw-community/mobile-ci/actions/native-app-cache@v1.6.5 # v1.6.5
              with:
                  mode: save
                  path: .ci-cache/ios-native-app/${{ matrix.target.name }}
                  profile: ${{ inputs.cache-profile }}-${{ matrix.target.name }}
                  arch: arm64
                  toolchain: ${{ steps.xcode.outputs.toolchain-key }}
                  fingerprint: ${{ steps.fingerprint.outputs.hash }}

            - name: Archive app for test jobs
              shell: bash
              env:
                  TARGET_NAME: ${{ matrix.target.name }}
              run: |
                  set -euo pipefail
                  test -d ".ci-cache/ios-native-app/${TARGET_NAME}/Base.app"
                  mkdir -p .ci-artifacts
                  tar -czf ".ci-artifacts/ios-e2e-app-${TARGET_NAME}.tar.gz" -C ".ci-cache/ios-native-app/${TARGET_NAME}" Base.app

            - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: ios-e2e-app-${{ matrix.target.name }}
                  path: .ci-artifacts/ios-e2e-app-${{ matrix.target.name }}.tar.gz
                  retention-days: 1

    test:
        name: Maestro shard ${{ matrix.shard-index }} (${{ matrix.target.name }})
        needs: [detect, build]
        if: needs.detect.outputs.affected == 'true'
        runs-on: ${{ fromJSON(inputs.test-runner-labels != '' && inputs.test-runner-labels || inputs.runner-labels) }}
        timeout-minutes: ${{ inputs.test-timeout-minutes }}
        strategy:
            fail-fast: false
            matrix:
                target: ${{ fromJSON(inputs.targets) }}
                shard-index: ${{ fromJSON(needs.detect.outputs.shard-indices) }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            # build-ios-app's default archs is arm64-only (excluded-archs
            # x86_64), and this workflow does not expose an override, so the
            # packaged Simulator app can only launch on an arm64 host. A
            # test-runner-labels pool on a different architecture than the
            # build pool would otherwise fail confusingly inside simctl
            # install; fail fast with an actionable message instead.
            - name: Assert test runner architecture matches the packaged app
              shell: bash
              run: |
                  set -euo pipefail
                  arch=$(uname -m)
                  if [ "$arch" != 'arm64' ]; then
                    echo "::error::Test runner architecture is '$arch', but the packaged Simulator app is arm64-only. Set test-runner-labels to an arm64 pool."
                    exit 1
                  fi

            - name: setup-xcode-pinned
              uses: rnw-community/mobile-ci/actions/setup-xcode-pinned@v1.6.5 # v1.6.5
              with:
                  version: ${{ inputs.xcode-version }}
                  build: ${{ inputs.xcode-build }}

            - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
              with:
                  name: ios-e2e-app-${{ matrix.target.name }}
                  path: .ci-artifacts/ios-e2e-app-${{ matrix.target.name }}

            - name: Unpack app
              shell: bash
              env:
                  TARGET_NAME: ${{ matrix.target.name }}
              run: tar -xzf ".ci-artifacts/ios-e2e-app-${TARGET_NAME}/ios-e2e-app-${TARGET_NAME}.tar.gz" -C ".ci-artifacts/ios-e2e-app-${TARGET_NAME}"

            - name: run-maestro-ios
              uses: rnw-community/mobile-ci/actions/run-maestro-ios@v1.6.5 # v1.6.5
              with:
                  app-path: .ci-artifacts/ios-e2e-app-${{ matrix.target.name }}/Base.app
                  app-id: ${{ matrix.target.appId }}
                  flows-dir: ${{ inputs.flows-dir }}
                  flows-max-depth: ${{ inputs.flows-max-depth }}
                  flows-name-pattern: ${{ inputs.flows-name-pattern }}
                  flows-exclude-pattern: ${{ inputs.flows-exclude-pattern }}
                  shard-manifest-dir: ${{ inputs.shard-manifest-dir }}
                  shard-index: ${{ matrix.shard-index }}
                  shard-count: ${{ inputs.shard-count }}
                  pre-run-flow: ${{ inputs.pre-run-flow }}
                  flow-recovery-flow: ${{ inputs.flow-recovery-flow }}
                  pre-test-command: ${{ inputs.pre-test-command }}
                  app-warm-seconds: ${{ inputs.app-warm-seconds }}
                  maestro-env: ${{ inputs.maestro-env }}
                  maestro-config: ${{ inputs.maestro-config }}
                  flow-retries: ${{ inputs.flow-retries }}
                  maestro-version: ${{ inputs.maestro-version }}
                  simulator-device: ${{ inputs.simulator-device }}
                  artifacts-dir: ${{ github.workspace }}/artifacts/maestro-ios-${{ matrix.target.name }}-${{ matrix.shard-index }}
                  artifact-name: maestro-ios-${{ matrix.target.name }}-shard-${{ matrix.shard-index }}

    status:
        name: iOS Maestro E2E result
        needs: [detect, build, test]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Report
              shell: bash
              env:
                  DETECT_RESULT: ${{ needs.detect.result }}
                  DETECT_AFFECTED: ${{ needs.detect.outputs.affected }}
                  BUILD_RESULT: ${{ needs.build.result }}
                  TEST_RESULT: ${{ needs.test.result }}
              run: |
                  summary() {
                    printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
                  }
                  cancelled_hint() {
                    if [ "$1" = 'cancelled' ]; then
                      echo "::notice::A cancelled job result often means the job hit its timeout-minutes - check the job's duration against build-timeout-minutes/test-timeout-minutes before assuming external cancellation."
                    fi
                  }
                  if [ "$DETECT_RESULT" != "success" ]; then
                    echo "Detection job did not succeed (result: $DETECT_RESULT)."
                    summary "### iOS Maestro E2E: failed (detect job result: $DETECT_RESULT)"
                    cancelled_hint "$DETECT_RESULT"
                    exit 1
                  fi
                  if [ "$DETECT_AFFECTED" != "true" ]; then
                    echo "::notice::iOS Maestro E2E skipped: target packages untouched, so every build/test leg was skipped and zero Maestro flows ran. This is not a pass."
                    summary "### iOS Maestro E2E: skipped — target packages untouched, zero Maestro flows ran (not a pass)"
                    exit 0
                  fi
                  if [ "$BUILD_RESULT" != "success" ]; then
                    echo "Build job did not succeed (result: $BUILD_RESULT)."
                    summary "### iOS Maestro E2E: failed (build job result: $BUILD_RESULT)"
                    cancelled_hint "$BUILD_RESULT"
                    exit 1
                  fi
                  if [ "$TEST_RESULT" != "success" ]; then
                    echo "Maestro suite did not succeed (result: $TEST_RESULT)."
                    summary "### iOS Maestro E2E: failed (test job result: $TEST_RESULT)"
                    cancelled_hint "$TEST_RESULT"
                    exit 1
                  fi
                  echo "Maestro suite passed."
                  summary "### iOS Maestro E2E: passed"
