name: ios-maestro

on:
    workflow_call:
        inputs:
            runner-labels:
                description: JSON array of self-hosted runner labels for the build/test jobs.
                type: string
                required: false
                default: '["self-hosted","macOS","ARM64"]'
            build-runner-labels:
                description: >-
                    JSON array of self-hosted runner labels for the build job only. Falls
                    back to runner-labels when empty; set this and test-runner-labels
                    together to split build/test across separate runner pools.
                type: string
                required: false
                default: ''
            test-runner-labels:
                description: >-
                    JSON array of self-hosted runner labels for the test job only. Falls
                    back to runner-labels when empty. Must resolve to an arm64 macOS
                    pool regardless of the build pool's architecture: the packaged
                    Simulator app build-ios-app produces is arm64-only (see
                    build-ios-app's archs input, which this workflow does not expose
                    an override for), so a test pool on any other architecture cannot
                    launch it.
                type: string
                required: false
                default: ''
            targets:
                description: >-
                    JSON array of build targets: {name, appDir, workspace, scheme, appId,
                    prebuildCommand}. prebuildCommand may be an empty string.
                type: string
                required: true
            flows-dir:
                description: >-
                    Directory (relative to repo root) whose top-level files are the
                    runnable Maestro flows by default. Subdirectories are not searched
                    unless flows-max-depth is raised; see flows-max-depth/flows-name-pattern.
                type: string
                required: true
            flows-max-depth:
                description: >-
                    find -maxdepth under flows-dir. 0 means unbounded recursion. Default
                    1 (top-level only) keeps subflows invoked via runFlow, conventionally
                    living in subdirectories, out of the shard.
                type: string
                required: false
                default: '1'
            flows-name-pattern:
                description: >-
                    Space-separated find -name globs (OR'd together) selecting runnable
                    flows directly inside flows-dir. Keeps reusable subflows and
                    capture-only flows in subdirectories out of the shard by default.
                type: string
                required: false
                default: '*.flow.yaml'
            flows-exclude-pattern:
                description: Optional find ! -name glob excluding matched flows by basename.
                type: string
                required: false
                default: ''
            shard-manifest-dir:
                description: >-
                    Optional directory (relative to repo root) of hand-curated
                    shard-<index>.txt files (one flows-dir-relative flow path per line)
                    overriding the computed index-modulo split so a consumer's balanced
                    shard assignment survives. Unset (default) falls back to the
                    index-modulo split entirely.
                type: string
                required: false
                default: ''
            pre-run-flow:
                description: >-
                    Path to a single priming flow run once before each shard's flows,
                    excluded from sharding. Its failure fails that shard immediately.
                type: string
                required: false
                default: ''
            flow-recovery-flow:
                description: >-
                    Path to a single best-effort recovery flow run after a failed flow
                    attempt: before the same flow's next retry attempt, and before the
                    next flow starts, so a failure cannot strand the app in a state that
                    cascades into the flows after it. Not run after a passing attempt,
                    and not after a shard's last flow. Its own failure only logs a
                    warning and never fails the shard. Like pre-run-flow it is removed
                    from the discovered flow list, so it never also runs as a scenario of
                    its own. Leave empty to skip recovery.
                type: string
                required: false
                default: ''
            pre-test-command:
                description: >-
                    Optional consumer-owned shell command run once after the app is
                    installed on the simulator and before any flow (including
                    pre-run-flow) executes, e.g. seeding a fixture into the app's data
                    container. Runs with SIMULATOR_UDID, APP_ID, and APP_PATH in its
                    environment. Its failure fails that shard immediately.
                type: string
                required: false
                default: ''
            pre-flow-command:
                description: >-
                    Optional consumer-owned shell command run before every flow attempt,
                    each retry included, after pre-run-flow and the warm-up. It is never
                    run before pre-run-flow or flow-recovery-flow themselves. Runs with
                    FLOW_PATH, FLOW_NAME, APP_ID, SIMULATOR_UDID and MAESTRO_FLOW_ENV_FILE
                    in its environment. Unlike the best-effort flow-recovery-flow this is
                    a precondition: a non-zero exit fails that attempt without running the
                    flow, consuming one of its 1 + flow-retries attempts and triggering the
                    recovery flow as any other failed attempt would. Every KEY=VALUE line
                    the command appends to the file at MAESTRO_FLOW_ENV_FILE becomes an
                    extra -e KEY=VALUE argument for that one flow's `maestro test`,
                    validated exactly like maestro-env.
                type: string
                required: false
                default: ''
            maestro-env:
                description: >-
                    Newline-separated KEY=VALUE pairs, each passed as an additional
                    -e KEY=VALUE argument to every `maestro test` invocation (pre-run-flow
                    and shard flows alike). Rejects (fails closed) any line without '='
                    or whose name does not match ^[A-Za-z_][A-Za-z0-9_]*$.
                type: string
                required: false
                default: ''
            maestro-config:
                description: >-
                    Path to the consumer's Maestro workspace config (config.yaml),
                    passed as --config to every `maestro test` invocation. Maestro only
                    auto-discovers a workspace config.yaml when it is pointed at a
                    directory, and the actions below always pass individual flow files,
                    so without this input a workspace config is silently ignored.
                    Relative paths resolve against the job's working directory. Fails
                    closed when set to a path that is not a file.
                type: string
                required: false
                default: ''
            flow-retries:
                description: >-
                    Non-negative retry budget per flow; each flow gets up to
                    1 + flow-retries attempts.
                type: string
                required: false
                default: '0'
            app-warm-seconds:
                description: >-
                    Seconds the app is left running during a one-off warm-up
                    (launch, settle, terminate) performed after install and
                    before any flow runs, so first-launch cold-start cost is
                    not absorbed by the first flow's own timeout budget. Set
                    to '0' to disable warming.
                type: string
                required: false
                default: '20'
            shard-count:
                type: number
                required: false
                default: 2
            xcode-version:
                type: string
                required: false
                default: '26.4.1'
            xcode-build:
                type: string
                required: false
                default: '17E202'
            cache-profile:
                description: Cache-key prefix distinguishing this consumer/app.
                type: string
                required: false
                default: ios-native-v1
            turbo-version:
                type: string
                required: false
                default: '2.10.8'
            target-packages:
                description: Newline-separated package names gating this pipeline on pull_request events.
                type: string
                required: false
                default: ''
            expo-fingerprint-version:
                type: string
                required: false
                default: '0.20.6'
            maestro-version:
                type: string
                required: false
                default: '2.8.0'
            simulator-device:
                description: >-
                    Exact simulator device name to boot (e.g. 'iPhone 17 Pro'), matched
                    against `xcrun simctl list devices available` with no fuzzy matching
                    — fails closed, listing the available devices, when no exact match
                    exists. Leave empty (default) to keep the previous last-available
                    heuristic, which emits a `::notice::` naming its choice. Pinning
                    requires the device set to be provisioned identically across every
                    host in test-runner-labels/runner-labels' pool.
                type: string
                required: false
                default: ''
            simslim-version:
                description: >-
                    Pinned simslim CLI version, consulted only when
                    simulator-slim-profile or simulator-requires is set. A matching
                    `simslim` already on PATH is reused; otherwise the macos-arm64
                    release asset is downloaded from MobAI-App/simslim and checked
                    against simslim-sha256 (preinstall on the host to avoid it).
                type: string
                required: false
                default: '0.10.0'
            simslim-sha256:
                description: >-
                    SHA-256 of the simslim-v<simslim-version>-macos-arm64.tar.gz release
                    asset (upstream publishes no checksum file). The cached tarball is
                    re-hashed against it on every job before the binary is extracted
                    into a job-private directory. Empty refuses to download; only a
                    preinstalled `simslim` of the exact version then satisfies the job.
                    Bump together with simslim-version.
                type: string
                required: false
                default: 'eec00b27f0694fa899fb3bbc71362309a9da11ec670f430633cfae855eaf4a1d'
            simulator-slim-profile:
                description: >-
                    `bundled` (the default) uses mobile-ci's own `profiles/ci.json` -
                    App Store, push and StoreKit plus Safari and universal-link
                    services stay on, every other category is disabled - so a consumer
                    commits no profile of its own; a repository-relative path uses that
                    profile instead. Every booted simulator is checked with `simslim
                    verify --profile` before the app is installed - an erased,
                    recreated, or new-runtime device comes up stock and quietly heavy.
                    Apply the profile on the host at provisioning time
                    (`simslim on <udid> --profile <path>`, see
                    docs/self-hosted-runners.md) so no shard pays for a repair reboot.
                    Empty opts out of slimming entirely.
                type: string
                required: false
                default: bundled
            simulator-slim-repair:
                description: >-
                    'true' (the default) re-applies the profile in-job with `simslim
                    on` (reboots the simulator) when simulator-slim-profile reports
                    drift, then verifies again. Set it to 'false' once the host image
                    ships slimmed devices, so drift surfaces as a provisioning defect
                    instead of being paid for on every shard.
                type: string
                required: false
                default: 'true'
            simulator-requires:
                description: >-
                    Comma-separated simslim feature IDs the flows depend on (e.g.
                    'push,universal-links'; `simslim doctor --list`). When set,
                    `simslim doctor --requires` runs against the booted simulator and
                    fails the shard if slimming disabled a daemon behind any of them.
                    Empty (default) skips the check.
                type: string
                required: false
                default: ''
            node-version:
                type: string
                required: false
                default: 22.x
            install-command:
                type: string
                required: false
                default: yarn install --immutable
            enable-corepack:
                type: boolean
                required: false
                default: true
            package-manager:
                description: >-
                    JS package manager driving pnpm provisioning and, in the jobs
                    that configure one, actions/setup-node's dependency cache.
                    Leave empty to auto-detect at the repository root, in order: an
                    explicit value here, then package.json's
                    devEngines.packageManager / packageManager field (needs jq on
                    the runner), then exactly one root lockfile (yarn.lock,
                    pnpm-lock.yaml, package-lock.json / npm-shrinkwrap.json). No
                    match, an ambiguous
                    match, or an unsupported value fails the job. install-command
                    must match the resolved manager (e.g. pnpm install
                    --frozen-lockfile). Resolving to pnpm additionally requires a
                    pnpm version declared in package.json (packageManager or
                    devEngines.packageManager) because pnpm/action-setup reads it
                    from there; the corepack step is then skipped.
                type: string
                required: false
                default: ''
            build-command:
                description: Optional workspace JS build command run at repo root before the native build.
                type: string
                required: false
                default: ''
            rct-use-prebuilt-rncore:
                type: boolean
                required: false
                default: false
            rct-use-rn-dep:
                type: boolean
                required: false
                default: false
            expo-use-precompiled-modules:
                type: boolean
                required: false
                default: false
            ccache-max-size:
                type: string
                required: false
                default: 2G
            build-env:
                description: >-
                    Newline-separated KEY=VALUE pairs appended to $GITHUB_ENV at the
                    start of the build job. Rejects (fails closed) any line without
                    '=' or whose name does not match ^[A-Za-z_][A-Za-z0-9_]*$.
                type: string
                required: false
                default: ''
            build-strategy:
                description: >-
                    How this pull request gets the binary its Maestro shards
                    install. `auto` (the default) computes the native key, looks
                    up the base binary published for it, and repacks that base
                    with this commit's JavaScript on the Linux pool; only a key
                    with no published base, or an unusable base, reaches the Mac
                    — and when it does on the default branch, the base it builds
                    is published for the next run. `repack` refuses to compile
                    native code at all: a missing base fails the build instead of
                    quietly taking a Mac slot. `native` is the escape hatch and a
                    regression — every pull request then compiles native code
                    again, and that run publishes no base. See docs/repack.md.
                type: string
                required: false
                default: auto
            repack-runner-labels:
                description: >-
                    JSON array of self-hosted runner labels for the repack job.
                    The default is the x86_64 Linux pool: a repack re-bundles
                    JavaScript and rewrites an archive, so it needs no Xcode, no
                    simulator and no Mac slot.
                type: string
                required: false
                default: '["self-hosted","trf-linux-amd64-4x8"]'
            native-build-label:
                description: >-
                    Pull-request label forcing build-strategy: native for that one
                    pull request. Set together with build-strategy: repack it
                    fails closed rather than silently picking a winner.
                type: string
                required: false
                default: 'mobile: force native build'
            base-backend:
                description: >-
                    Where base binaries live: `ghcr` (default, an immutable OCI
                    artifact needing packages:write to publish and packages:read
                    to fetch) or `artifact` (workflow artifacts, default-branch
                    runs only, needing actions:read). See expo-base-binary.
                type: string
                required: false
                default: ghcr
            base-flavor:
                description: Flavor segment of the base binary's address.
                type: string
                required: false
                default: e2e
            fingerprint-config:
                description: >-
                    Path, relative to a target's appDir, of the @expo/fingerprint
                    config whose ignore list is the correctness boundary of every
                    repack. Its hash is part of the native key. See docs/repack.md.
                type: string
                required: false
                default: fingerprint.config.js
            fingerprint-env:
                description: >-
                    Newline-separated KEY=VALUE pairs exported while the native key
                    is computed, for an app.config that branches on env. Must be
                    byte-identical to what the warm-up passes, or the two never
                    agree on a key and every pull request takes a Mac slot.
                type: string
                required: false
                default: ''
            repack-env:
                description: >-
                    Newline-separated KEY=VALUE pairs exported for the re-bundle,
                    so the consumer's app.config writes this build's API URL,
                    version and build number into the repacked binary.
                type: string
                required: false
                default: ''
            expect-config:
                description: >-
                    Newline-separated <dotted.path>=<value> assertions the
                    repacked binary's embedded app.config must satisfy exactly.
                    Every value repack-env is expected to have rewritten belongs
                    here: a config rewrite nobody checked is a repack nobody can
                    trust.
                type: string
                required: false
                default: ''
            repack-app-version:
                description: Pinned @expo/repack-app npm version.
                type: string
                required: false
                default: '0.7.2'
            repack-timeout-minutes:
                type: number
                required: false
                default: 30
            build-timeout-minutes:
                type: number
                required: false
                default: 60
            test-timeout-minutes:
                type: number
                required: false
                default: 75

concurrency:
    group: ios-maestro-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    detect:
        name: Detect affected packages
        runs-on: ubuntu-latest
        outputs:
            affected: ${{ steps.affected.outputs.affected }}
            shard-indices: ${{ steps.shard-indices.outputs.indices }}
            build-strategy: ${{ steps.build-strategy.outputs.strategy }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ inputs.node-version }}
            - uses: rnw-community/mobile-ci/actions/turbo-affected@v2.3.0 # v2.3.0
              id: affected
              with:
                  turbo-version: ${{ inputs.turbo-version }}
                  target-packages: ${{ inputs.target-packages }}
                  base-sha: ${{ github.event.pull_request.base.sha }}
                  always-affected: ${{ github.event_name != 'pull_request' || inputs.target-packages == '' }}

            # The test job's matrix.shard-index must exactly match
            # inputs.shard-count: fewer indices than shard-count silently
            # never runs the flows assigned to the missing indices (the
            # suite still reports success), and more indices than
            # shard-count fails run-maestro-ios's own [0, shard-count)
            # bounds check. A hard-coded matrix can only ever match one
            # specific shard-count, so derive it here instead.
            - name: Compute shard indices
              id: shard-indices
              shell: bash
              env:
                  SHARD_COUNT: ${{ inputs.shard-count }}
                  TARGETS: ${{ inputs.targets }}
              run: |
                  set -euo pipefail
                  if [ "$SHARD_COUNT" -lt 1 ]; then
                    echo "::error::shard-count must be >= 1, got $SHARD_COUNT."
                    exit 1
                  fi
                  target_count=$(jq 'length' <<< "$TARGETS")
                  total_jobs=$(( target_count * SHARD_COUNT ))
                  if [ "$total_jobs" -gt 256 ]; then
                    echo "::error::targets ($target_count) x shard-count ($SHARD_COUNT) = $total_jobs test jobs, exceeding GitHub Actions' 256-job matrix limit."
                    exit 1
                  fi
                  indices=$(seq 0 $((SHARD_COUNT - 1)) | jq -R 'tonumber' | jq -sc .)
                  echo "indices=$indices" >> "$GITHUB_OUTPUT"

            - name: Resolve the build strategy
              id: build-strategy
              shell: bash
              env:
                  REQUESTED_STRATEGY: ${{ inputs.build-strategy }}
                  NATIVE_BUILD_LABEL: ${{ inputs.native-build-label }}
                  PULL_REQUEST_LABELS: ${{ github.event_name == 'pull_request' && toJSON(github.event.pull_request.labels.*.name) || '[]' }}
              run: |
                  set -euo pipefail
                  case "$REQUESTED_STRATEGY" in
                    auto|repack|native) ;;
                    *)
                      echo "::error::build-strategy must be 'auto', 'repack' or 'native'; got '$REQUESTED_STRATEGY'."
                      exit 1
                      ;;
                  esac

                  strategy="$REQUESTED_STRATEGY"
                  labelled=false
                  if [ -n "$NATIVE_BUILD_LABEL" ]; then
                    labelled=$(jq -r --arg label "$NATIVE_BUILD_LABEL" 'map(select(. == $label)) | length > 0' <<< "$PULL_REQUEST_LABELS")
                  fi

                  if [ "$labelled" = 'true' ]; then
                    if [ "$REQUESTED_STRATEGY" = 'repack' ]; then
                      echo "::error::build-strategy is 'repack', which forbids compiling native code, but this pull request carries the '$NATIVE_BUILD_LABEL' label, which demands it. Remove one of the two rather than letting the workflow pick a winner."
                      exit 1
                    fi
                    strategy=native
                    echo "::notice::'$NATIVE_BUILD_LABEL' is set on this pull request, so native code is compiled instead of a published base being repacked. No base binary is published by this run."
                  fi

                  if [ "$strategy" = 'native' ]; then
                    echo "::warning::This run compiles native code for every target. That is the escape hatch, not the norm: it takes a full native build slot a repack would not have needed. See docs/repack.md."
                  fi

                  echo "strategy=$strategy" >> "$GITHUB_OUTPUT"
                  echo "Build strategy: $strategy (requested '$REQUESTED_STRATEGY')."

    plan:
        name: Plan (${{ matrix.target.name }})
        needs: detect
        if: needs.detect.outputs.affected == 'true'
        runs-on: ${{ fromJSON(inputs.repack-runner-labels) }}
        timeout-minutes: ${{ inputs.repack-timeout-minutes }}
        permissions:
            contents: read
            packages: read
            actions: read
        strategy:
            fail-fast: false
            matrix:
                target: ${{ fromJSON(inputs.targets) }}
        env:
            APP_DIR: ${{ matrix.target.appDir }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - name: Apply build-env
              if: inputs.build-env != ''
              shell: bash
              env:
                  BUILD_ENV: ${{ inputs.build-env }}
              run: |
                  set -euo pipefail
                  while IFS= read -r line; do
                    [ -z "$line" ] && continue
                    case "$line" in
                      *=*) ;;
                      *)
                        echo "::error::build-env line '$line' is missing '='; expected KEY=VALUE."
                        exit 1
                        ;;
                    esac
                    name="${line%%=*}"
                    case "$name" in
                      ''|[!A-Za-z_]*)
                        echo "::error::build-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    case "$name" in
                      *[!A-Za-z0-9_]*)
                        echo "::error::build-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    echo "$line" >> "$GITHUB_ENV"
                  done <<< "$BUILD_ENV"

            - name: Resolve package manager
              id: package-manager
              shell: bash
              env:
                  PACKAGE_MANAGER: ${{ inputs.package-manager }}
                  LOCKFILE_REQUIRED: 'true'
              run: |
                  set -euo pipefail
                  pm=''
                  case "$PACKAGE_MANAGER" in
                    '') ;;
                    yarn|pnpm|npm) pm="$PACKAGE_MANAGER" ;;
                    *)
                      echo "::error::package-manager must be '' (auto-detect), yarn, pnpm or npm; got '$PACKAGE_MANAGER'."
                      exit 1
                      ;;
                  esac
                  declared=''
                  declared_version=''
                  if { [ -z "$pm" ] || [ "$pm" = pnpm ]; } && [ -f package.json ]; then
                    if command -v jq >/dev/null 2>&1; then
                      declared_spec="$(jq -r '
                        (try (.devEngines.packageManager) catch null) as $raw
                        | (if ($raw | type) == "array" then ($raw[0] // null) else $raw end) as $de
                        | (if ($de | type) == "object" then [($de.name // ""), ($de.version // "")] else ["", ""] end) as $dev
                        | (if ((.packageManager // "") | type) == "string" and (.packageManager // "") != ""
                           then (.packageManager | if test("@") then [split("@")[0], (split("@")[1] | split("+")[0])] else [., ""] end)
                           else ["", ""] end) as $spec
                        | (if $dev[0] != "" then $dev[0] else $spec[0] end) as $name
                        | [$name,
                           (if $dev[0] != "" and $dev[1] != "" then $dev[1]
                            elif $spec[0] == $name then $spec[1]
                            else "" end)]
                        | @tsv' package.json)"
                      declared="$(printf '%s\n' "$declared_spec" | cut -f1)"
                      declared_version="$(printf '%s\n' "$declared_spec" | cut -f2)"
                    else
                      echo "::warning::jq is not installed on this runner, so package.json's packageManager / devEngines.packageManager fields cannot be read; falling back to root lockfile detection. Install jq, or set the package-manager input explicitly."
                    fi
                  fi
                  if [ -z "$pm" ] && [ -n "$declared" ]; then
                    case "$declared" in
                      yarn|pnpm|npm) pm="$declared" ;;
                      *)
                        echo "::error::package.json declares package manager '$declared', which is not yarn, pnpm or npm; set the package-manager input explicitly."
                        exit 1
                        ;;
                    esac
                  fi
                  if [ -z "$pm" ]; then
                    lockfiles=''
                    lockfile_count=0
                    if [ -f yarn.lock ]; then pm=yarn; lockfiles="${lockfiles}yarn.lock "; lockfile_count=$((lockfile_count + 1)); fi
                    if [ -f pnpm-lock.yaml ]; then pm=pnpm; lockfiles="${lockfiles}pnpm-lock.yaml "; lockfile_count=$((lockfile_count + 1)); fi
                    if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
                      pm=npm
                      lockfile_count=$((lockfile_count + 1))
                      if [ -f package-lock.json ]; then lockfiles="${lockfiles}package-lock.json "; fi
                      if [ -f npm-shrinkwrap.json ]; then lockfiles="${lockfiles}npm-shrinkwrap.json "; fi
                    fi
                    if [ "$lockfile_count" -eq 0 ]; then
                      echo "::error::Cannot resolve the package manager: package.json declares none and there is no yarn.lock, pnpm-lock.yaml, package-lock.json or npm-shrinkwrap.json at the repository root. Set the package-manager input explicitly."
                      exit 1
                    fi
                    if [ "$lockfile_count" -gt 1 ]; then
                      echo "::error::Cannot resolve the package manager: multiple root lockfiles found (${lockfiles% }). Set the package-manager input explicitly."
                      exit 1
                    fi
                  fi
                  if [ "$pm" = pnpm ] && { [ "$declared" != pnpm ] || [ -z "$declared_version" ]; }; then
                    echo "::error::Resolved package manager is pnpm, but no pnpm version is readable from the repository-root package.json. pnpm/action-setup takes the version from 'packageManager: pnpm@<version>' or 'devEngines.packageManager: {name: pnpm, version: <range>}' - add one of those, and make sure jq is installed on this runner so the workflow can read it."
                    exit 1
                  fi
                  if [ -n "$LOCKFILE_REQUIRED" ]; then
                    case "$pm" in
                      yarn) wanted='yarn.lock' ;;
                      pnpm) wanted='pnpm-lock.yaml' ;;
                      *) wanted='package-lock.json npm-shrinkwrap.json' ;;
                    esac
                    found=''
                    for candidate in $wanted; do
                      if [ -f "$candidate" ]; then found="$candidate"; break; fi
                    done
                    if [ -z "$found" ]; then
                      echo "::error::Resolved package manager is $pm, but this job caches JS dependencies with actions/setup-node and the repository root has none of: $wanted. Commit the lockfile, or set the package-manager input to the manager whose lockfile this repository actually has."
                      exit 1
                    fi
                  fi
                  echo "Resolved package manager: $pm"
                  echo "pm=$pm" >> "$GITHUB_OUTPUT"

            - name: Setup pnpm
              if: steps.package-manager.outputs.pm == 'pnpm'
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - name: Setup Node
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ inputs.node-version }}
                  cache: ${{ steps.package-manager.outputs.pm }}

            - name: Enable corepack
              if: inputs.enable-corepack && steps.package-manager.outputs.pm != 'pnpm'
              shell: bash
              run: corepack enable

            - name: Install dependencies
              shell: bash
              env:
                  INSTALL_COMMAND: ${{ inputs.install-command }}
              run: eval "$INSTALL_COMMAND"

            - name: Build workspace JS dependencies
              if: inputs.build-command != ''
              shell: bash
              env:
                  BUILD_COMMAND: ${{ inputs.build-command }}
              run: eval "$BUILD_COMMAND"

            - name: Generate native project
              if: matrix.target.prebuildCommand != ''
              working-directory: ${{ matrix.target.appDir }}
              shell: bash
              env:
                  PREBUILD_COMMAND: ${{ matrix.target.prebuildCommand }}
              run: eval "$PREBUILD_COMMAND"

            - name: expo-native-key
              id: native-key
              uses: rnw-community/mobile-ci/actions/expo-native-key@v3.0.0 # v3.0.0
              with:
                  platform: ios
                  working-directory: ${{ matrix.target.appDir }}
                  flavor: ${{ inputs.base-flavor }}
                  extra-env: ${{ inputs.fingerprint-env }}
                  toolchain: xcode-${{ inputs.xcode-version }}-${{ inputs.xcode-build }}
                  fingerprint-config: ${{ inputs.fingerprint-config }}
                  fingerprint-version: ${{ inputs.expo-fingerprint-version }}

            - name: expo-base-binary (fetch)
              id: base
              if: needs.detect.outputs.build-strategy != 'native'
              uses: rnw-community/mobile-ci/actions/expo-base-binary@v3.0.0 # v3.0.0
              with:
                  mode: fetch
                  platform: ios
                  flavor: ${{ inputs.base-flavor }}
                  key: ${{ steps.native-key.outputs.key }}
                  backend: ${{ inputs.base-backend }}
                  path: .ci-cache/e2e-base/${{ matrix.target.name }}

            - name: Refuse to compile native code under build-strategy repack
              if: needs.detect.outputs.build-strategy == 'repack' && steps.base.outputs.found != 'true'
              shell: bash
              env:
                  NATIVE_KEY: ${{ steps.native-key.outputs.key }}
                  REFERENCE: ${{ steps.base.outputs.reference }}
              run: |
                  set -euo pipefail
                  echo "::error::build-strategy is 'repack', but no base binary is published at $REFERENCE for native key $NATIVE_KEY. Warm this key up on the default branch (seed-native-cache.yml), or switch this call to build-strategy: auto so the Mac builds and publishes one."
                  exit 1

            - name: expo-repack
              if: steps.base.outputs.found == 'true'
              uses: rnw-community/mobile-ci/actions/expo-repack@v3.0.0 # v3.0.0
              with:
                  platform: ios
                  base-path: ${{ steps.base.outputs.path }}
                  output-path: .ci-artifacts/ios-e2e-app-${{ matrix.target.name }}.tar.gz
                  app-dir: ${{ matrix.target.appDir }}
                  app-id: ${{ matrix.target.appId }}
                  repack-env: ${{ inputs.repack-env }}
                  expect-config: ${{ inputs.expect-config }}
                  repack-version: ${{ inputs.repack-app-version }}

            - name: Upload the repacked app for the test jobs
              if: steps.base.outputs.found == 'true'
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: ios-e2e-app-${{ matrix.target.name }}
                  path: .ci-artifacts/ios-e2e-app-${{ matrix.target.name }}.tar.gz
                  if-no-files-found: error
                  retention-days: 1

            - name: Record this target's plan
              shell: bash
              env:
                  TARGET: ${{ toJSON(matrix.target) }}
                  NATIVE_KEY: ${{ steps.native-key.outputs.key }}
                  BASE_FOUND: ${{ steps.base.outputs.found }}
                  BASE_SOURCE: ${{ steps.base.outputs.source }}
                  BASE_REFERENCE: ${{ steps.base.outputs.reference }}
                  BUILD_STRATEGY: ${{ needs.detect.outputs.build-strategy }}
              run: |
                  set -euo pipefail
                  mkdir -p .ci-artifacts/plan
                  target_name=$(jq -r '.name' <<< "$TARGET")
                  needs_native=true
                  if [ "$BASE_FOUND" = 'true' ]; then
                    needs_native=false
                  fi
                  jq -n --argjson target "$TARGET" \
                        --arg key "$NATIVE_KEY" \
                        --argjson needsNative "$needs_native" \
                     '$target + {nativeKey: $key, needsNative: $needsNative}' \
                     > .ci-artifacts/plan/plan.json
                  {
                    if [ "$needs_native" = 'false' ]; then
                      echo "### iOS ${target_name}: repacked on Linux, no Mac slot taken"
                      echo "Base ${BASE_REFERENCE} (from ${BASE_SOURCE}) repacked with this commit's JavaScript."
                    else
                      echo "### iOS ${target_name}: native build needed"
                      echo "Native key ${NATIVE_KEY} has no published base (strategy: ${BUILD_STRATEGY})."
                    fi
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Upload this target's plan
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: ios-e2e-plan-${{ matrix.target.name }}
                  path: .ci-artifacts/plan/plan.json
                  if-no-files-found: error
                  retention-days: 1

    native-targets:
        name: Targets still needing a native build
        needs: [detect, plan]
        if: ${{ !cancelled() && needs.detect.outputs.affected == 'true' && needs.plan.result == 'success' }}
        runs-on: ubuntu-latest
        outputs:
            targets: ${{ steps.collect.outputs.targets }}
        steps:
            - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
              with:
                  pattern: ios-e2e-plan-*
                  path: .ci-artifacts/plans

            - name: Collect the targets whose native key has no base
              id: collect
              shell: bash
              env:
                  TARGETS: ${{ inputs.targets }}
              run: |
                  set -euo pipefail
                  expected=$(jq 'length' <<< "$TARGETS")
                  mapfile -d '' -t plans < <(find .ci-artifacts/plans -name plan.json -print0 | LC_ALL=C sort -z)
                  if [ "${#plans[@]}" -ne "$expected" ]; then
                    echo "::error::Expected one plan per target ($expected), found ${#plans[@]}. A missing plan is not an empty set of native builds; it is a target whose strategy nobody decided."
                    exit 1
                  fi
                  targets=$(jq -sc 'map(select(.needsNative)) | map(del(.needsNative))' "${plans[@]}")
                  echo "targets=$targets" >> "$GITHUB_OUTPUT"
                  echo "Targets needing a native build: $(jq -r 'map(.name) | join(", ") | if . == "" then "(none)" else . end' <<< "$targets")"

    build:
        name: Build (${{ matrix.target.name }})
        needs: [detect, native-targets]
        if: ${{ !cancelled() && needs.native-targets.result == 'success' && needs.native-targets.outputs.targets != '[]' }}
        runs-on: ${{ fromJSON(inputs.build-runner-labels != '' && inputs.build-runner-labels || inputs.runner-labels) }}
        timeout-minutes: ${{ inputs.build-timeout-minutes }}
        permissions:
            contents: read
            packages: write
            actions: read
        strategy:
            fail-fast: false
            matrix:
                target: ${{ fromJSON(needs.native-targets.outputs.targets) }}
        env:
            APP_DIR: ${{ matrix.target.appDir }}
            IOS_DERIVED_DATA: ${{ github.workspace }}/.ci-cache/DerivedData/${{ matrix.target.name }}
            CCACHE_DIR: ${{ github.workspace }}/.ci-cache/ccache/ios-${{ matrix.target.name }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - name: Apply build-env
              if: inputs.build-env != ''
              shell: bash
              env:
                  BUILD_ENV: ${{ inputs.build-env }}
              run: |
                  set -euo pipefail
                  while IFS= read -r line; do
                    [ -z "$line" ] && continue
                    case "$line" in
                      *=*) ;;
                      *)
                        echo "::error::build-env line '$line' is missing '='; expected KEY=VALUE."
                        exit 1
                        ;;
                    esac
                    name="${line%%=*}"
                    case "$name" in
                      ''|[!A-Za-z_]*)
                        echo "::error::build-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    case "$name" in
                      *[!A-Za-z0-9_]*)
                        echo "::error::build-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    echo "$line" >> "$GITHUB_ENV"
                  done <<< "$BUILD_ENV"

            - name: Resolve package manager
              id: package-manager
              shell: bash
              env:
                  PACKAGE_MANAGER: ${{ inputs.package-manager }}
                  LOCKFILE_REQUIRED: 'true'
              run: |
                  set -euo pipefail
                  pm=''
                  case "$PACKAGE_MANAGER" in
                    '') ;;
                    yarn|pnpm|npm) pm="$PACKAGE_MANAGER" ;;
                    *)
                      echo "::error::package-manager must be '' (auto-detect), yarn, pnpm or npm; got '$PACKAGE_MANAGER'."
                      exit 1
                      ;;
                  esac
                  declared=''
                  declared_version=''
                  if { [ -z "$pm" ] || [ "$pm" = pnpm ]; } && [ -f package.json ]; then
                    if command -v jq >/dev/null 2>&1; then
                      declared_spec="$(jq -r '
                        (try (.devEngines.packageManager) catch null) as $raw
                        | (if ($raw | type) == "array" then ($raw[0] // null) else $raw end) as $de
                        | (if ($de | type) == "object" then [($de.name // ""), ($de.version // "")] else ["", ""] end) as $dev
                        | (if ((.packageManager // "") | type) == "string" and (.packageManager // "") != ""
                           then (.packageManager | if test("@") then [split("@")[0], (split("@")[1] | split("+")[0])] else [., ""] end)
                           else ["", ""] end) as $spec
                        | (if $dev[0] != "" then $dev[0] else $spec[0] end) as $name
                        | [$name,
                           (if $dev[0] != "" and $dev[1] != "" then $dev[1]
                            elif $spec[0] == $name then $spec[1]
                            else "" end)]
                        | @tsv' package.json)"
                      declared="$(printf '%s\n' "$declared_spec" | cut -f1)"
                      declared_version="$(printf '%s\n' "$declared_spec" | cut -f2)"
                    else
                      echo "::warning::jq is not installed on this runner, so package.json's packageManager / devEngines.packageManager fields cannot be read; falling back to root lockfile detection. Install jq, or set the package-manager input explicitly."
                    fi
                  fi
                  if [ -z "$pm" ] && [ -n "$declared" ]; then
                    case "$declared" in
                      yarn|pnpm|npm) pm="$declared" ;;
                      *)
                        echo "::error::package.json declares package manager '$declared', which is not yarn, pnpm or npm; set the package-manager input explicitly."
                        exit 1
                        ;;
                    esac
                  fi
                  if [ -z "$pm" ]; then
                    lockfiles=''
                    lockfile_count=0
                    if [ -f yarn.lock ]; then pm=yarn; lockfiles="${lockfiles}yarn.lock "; lockfile_count=$((lockfile_count + 1)); fi
                    if [ -f pnpm-lock.yaml ]; then pm=pnpm; lockfiles="${lockfiles}pnpm-lock.yaml "; lockfile_count=$((lockfile_count + 1)); fi
                    if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
                      pm=npm
                      lockfile_count=$((lockfile_count + 1))
                      if [ -f package-lock.json ]; then lockfiles="${lockfiles}package-lock.json "; fi
                      if [ -f npm-shrinkwrap.json ]; then lockfiles="${lockfiles}npm-shrinkwrap.json "; fi
                    fi
                    if [ "$lockfile_count" -eq 0 ]; then
                      echo "::error::Cannot resolve the package manager: package.json declares none and there is no yarn.lock, pnpm-lock.yaml, package-lock.json or npm-shrinkwrap.json at the repository root. Set the package-manager input explicitly."
                      exit 1
                    fi
                    if [ "$lockfile_count" -gt 1 ]; then
                      echo "::error::Cannot resolve the package manager: multiple root lockfiles found (${lockfiles% }). Set the package-manager input explicitly."
                      exit 1
                    fi
                  fi
                  if [ "$pm" = pnpm ] && { [ "$declared" != pnpm ] || [ -z "$declared_version" ]; }; then
                    echo "::error::Resolved package manager is pnpm, but no pnpm version is readable from the repository-root package.json. pnpm/action-setup takes the version from 'packageManager: pnpm@<version>' or 'devEngines.packageManager: {name: pnpm, version: <range>}' - add one of those, and make sure jq is installed on this runner so the workflow can read it."
                    exit 1
                  fi
                  if [ -n "$LOCKFILE_REQUIRED" ]; then
                    case "$pm" in
                      yarn) wanted='yarn.lock' ;;
                      pnpm) wanted='pnpm-lock.yaml' ;;
                      *) wanted='package-lock.json npm-shrinkwrap.json' ;;
                    esac
                    found=''
                    for candidate in $wanted; do
                      if [ -f "$candidate" ]; then found="$candidate"; break; fi
                    done
                    if [ -z "$found" ]; then
                      echo "::error::Resolved package manager is $pm, but this job caches JS dependencies with actions/setup-node and the repository root has none of: $wanted. Commit the lockfile, or set the package-manager input to the manager whose lockfile this repository actually has."
                      exit 1
                    fi
                  fi
                  echo "Resolved package manager: $pm"
                  echo "pm=$pm" >> "$GITHUB_OUTPUT"

            - name: Setup pnpm
              if: steps.package-manager.outputs.pm == 'pnpm'
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - name: Setup Node
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ inputs.node-version }}
                  cache: ${{ steps.package-manager.outputs.pm }}

            - name: Enable corepack
              if: inputs.enable-corepack && steps.package-manager.outputs.pm != 'pnpm'
              shell: bash
              run: corepack enable

            - name: Install dependencies
              shell: bash
              env:
                  INSTALL_COMMAND: ${{ inputs.install-command }}
              run: eval "$INSTALL_COMMAND"

            - name: setup-xcode-pinned
              id: xcode
              uses: rnw-community/mobile-ci/actions/setup-xcode-pinned@v2.3.0 # v2.3.0
              with:
                  version: ${{ inputs.xcode-version }}
                  build: ${{ inputs.xcode-build }}

            - name: Build workspace JS dependencies
              if: inputs.build-command != ''
              shell: bash
              env:
                  BUILD_COMMAND: ${{ inputs.build-command }}
              run: eval "$BUILD_COMMAND"

            - name: Generate native project
              if: matrix.target.prebuildCommand != ''
              working-directory: ${{ matrix.target.appDir }}
              shell: bash
              env:
                  PREBUILD_COMMAND: ${{ matrix.target.prebuildCommand }}
                  RCT_USE_PREBUILT_RNCORE_ENABLED: ${{ inputs.rct-use-prebuilt-rncore }}
                  RCT_USE_RN_DEP_ENABLED: ${{ inputs.rct-use-rn-dep }}
                  EXPO_USE_PRECOMPILED_MODULES_ENABLED: ${{ inputs.expo-use-precompiled-modules }}
              run: |
                  if [ "$RCT_USE_PREBUILT_RNCORE_ENABLED" = 'true' ]; then
                    export RCT_USE_PREBUILT_RNCORE=1
                  fi
                  if [ "$RCT_USE_RN_DEP_ENABLED" = 'true' ]; then
                    export RCT_USE_RN_DEP=1
                  fi
                  if [ "$EXPO_USE_PRECOMPILED_MODULES_ENABLED" = 'true' ]; then
                    export EXPO_USE_PRECOMPILED_MODULES=1
                  fi
                  eval "$PREBUILD_COMMAND"

            - name: native-app-cache (restore)
              id: native-app-cache
              uses: rnw-community/mobile-ci/actions/native-app-cache@v3.0.0 # v3.0.0
              with:
                  mode: restore
                  path: .ci-cache/ios-native-app/${{ matrix.target.name }}
                  profile: ${{ inputs.cache-profile }}-${{ matrix.target.name }}
                  arch: arm64
                  toolchain: ${{ steps.xcode.outputs.toolchain-key }}
                  fingerprint: ${{ matrix.target.nativeKey }}

            - name: Report cache hit
              if: steps.native-app-cache.outputs.cache-hit == 'true'
              shell: bash
              env:
                  TARGET_NAME: ${{ matrix.target.name }}
                  NATIVE_KEY: ${{ matrix.target.nativeKey }}
              run: |
                  {
                    echo "### iOS build: ${TARGET_NAME} (warm — native build skipped)"
                    echo "This host already holds the native app for key ${NATIVE_KEY}; the published base is written from it."
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Clean stale app before native build
              if: steps.native-app-cache.outputs.cache-hit != 'true'
              shell: bash
              env:
                  APP_PATH: .ci-cache/ios-native-app/${{ matrix.target.name }}/Base.app
              run: rm -rf "$APP_PATH"

            - name: setup-ccache-ios (restore)
              if: steps.native-app-cache.outputs.cache-hit != 'true'
              uses: rnw-community/mobile-ci/actions/setup-ccache-ios@v2.3.0 # v2.3.0
              with:
                  mode: restore
                  ccache-dir: ${{ env.CCACHE_DIR }}
                  derived-data-dir: ${{ env.IOS_DERIVED_DATA }}
                  max-size: ${{ inputs.ccache-max-size }}
                  key: ccache-ios-${{ matrix.target.name }}-${{ runner.os }}-xcode-${{ inputs.xcode-version }}-${{ hashFiles('yarn.lock', 'pnpm-lock.yaml', 'package-lock.json', 'npm-shrinkwrap.json', format('{0}/ios/Podfile.lock', matrix.target.appDir)) }}
                  restore-keys: |
                      ccache-ios-${{ matrix.target.name }}-${{ runner.os }}-xcode-${{ inputs.xcode-version }}-
                      ccache-ios-${{ matrix.target.name }}-${{ runner.os }}-

            - name: build-ios-app
              if: steps.native-app-cache.outputs.cache-hit != 'true'
              id: build
              uses: rnw-community/mobile-ci/actions/build-ios-app@v2.3.0 # v2.3.0
              with:
                  app-dir: ${{ matrix.target.appDir }}
                  workspace: ${{ matrix.target.workspace }}
                  scheme: ${{ matrix.target.scheme }}
                  derived-data-dir: ${{ env.IOS_DERIVED_DATA }}
                  output-dir: .ci-cache/ios-native-app/${{ matrix.target.name }}
                  pods-cache-key: pods-${{ matrix.target.name }}-${{ runner.os }}-xcode-${{ inputs.xcode-version }}-${{ hashFiles('yarn.lock', 'pnpm-lock.yaml', 'package-lock.json', 'npm-shrinkwrap.json', format('{0}/ios/Podfile.lock', matrix.target.appDir)) }}
                  pods-cache-restore-keys: |
                      pods-${{ matrix.target.name }}-${{ runner.os }}-xcode-${{ inputs.xcode-version }}-
                      pods-${{ matrix.target.name }}-${{ runner.os }}-
                  rct-use-prebuilt-rncore: ${{ inputs.rct-use-prebuilt-rncore }}
                  rct-use-rn-dep: ${{ inputs.rct-use-rn-dep }}
                  expo-use-precompiled-modules: ${{ inputs.expo-use-precompiled-modules }}

            - name: setup-ccache-ios (save)
              if: steps.native-app-cache.outputs.cache-hit != 'true'
              uses: rnw-community/mobile-ci/actions/setup-ccache-ios@v2.3.0 # v2.3.0
              with:
                  mode: save
                  ccache-dir: ${{ env.CCACHE_DIR }}
                  key: ccache-ios-${{ matrix.target.name }}-${{ runner.os }}-xcode-${{ inputs.xcode-version }}-${{ hashFiles('yarn.lock', 'pnpm-lock.yaml', 'package-lock.json', 'npm-shrinkwrap.json', format('{0}/ios/Podfile.lock', matrix.target.appDir)) }}

            - name: native-app-cache (save)
              if: steps.native-app-cache.outputs.cache-hit != 'true'
              uses: rnw-community/mobile-ci/actions/native-app-cache@v3.0.0 # v3.0.0
              with:
                  mode: save
                  path: .ci-cache/ios-native-app/${{ matrix.target.name }}
                  profile: ${{ inputs.cache-profile }}-${{ matrix.target.name }}
                  arch: arm64
                  toolchain: ${{ steps.xcode.outputs.toolchain-key }}
                  fingerprint: ${{ matrix.target.nativeKey }}

            - name: Archive app for test jobs
              shell: bash
              env:
                  TARGET_NAME: ${{ matrix.target.name }}
              run: |
                  set -euo pipefail
                  test -d ".ci-cache/ios-native-app/${TARGET_NAME}/Base.app"
                  mkdir -p .ci-artifacts
                  tar -czf ".ci-artifacts/ios-e2e-app-${TARGET_NAME}.tar.gz" -C ".ci-cache/ios-native-app/${TARGET_NAME}" Base.app

            - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: ios-e2e-app-${{ matrix.target.name }}
                  path: .ci-artifacts/ios-e2e-app-${{ matrix.target.name }}.tar.gz
                  retention-days: 1

            - name: expo-base-binary (publish)
              if: github.ref_name == github.event.repository.default_branch && needs.detect.outputs.build-strategy != 'native'
              uses: rnw-community/mobile-ci/actions/expo-base-binary@v3.0.0 # v3.0.0
              with:
                  mode: publish
                  platform: ios
                  flavor: ${{ inputs.base-flavor }}
                  key: ${{ matrix.target.nativeKey }}
                  backend: ${{ inputs.base-backend }}
                  path: .ci-artifacts/ios-e2e-app-${{ matrix.target.name }}.tar.gz

            - name: Report that this key is now warm
              if: github.ref_name == github.event.repository.default_branch && needs.detect.outputs.build-strategy != 'native'
              shell: bash
              env:
                  TARGET_NAME: ${{ matrix.target.name }}
                  NATIVE_KEY: ${{ matrix.target.nativeKey }}
              run: |
                  echo "### iOS ${TARGET_NAME}: base binary published for native key ${NATIVE_KEY}" >> "$GITHUB_STEP_SUMMARY"
                  echo 'Pull requests on this native surface now repack instead of compiling.' >> "$GITHUB_STEP_SUMMARY"

    test:
        name: Maestro shard ${{ matrix.shard-index }} (${{ matrix.target.name }})
        needs: [detect, plan, native-targets, build]
        if: ${{ !cancelled() && needs.detect.outputs.affected == 'true' && needs.plan.result == 'success' && needs.native-targets.result == 'success' && needs.build.result != 'failure' }}
        runs-on: ${{ fromJSON(inputs.test-runner-labels != '' && inputs.test-runner-labels || inputs.runner-labels) }}
        timeout-minutes: ${{ inputs.test-timeout-minutes }}
        strategy:
            fail-fast: false
            matrix:
                target: ${{ fromJSON(inputs.targets) }}
                shard-index: ${{ fromJSON(needs.detect.outputs.shard-indices) }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            # build-ios-app's default archs is arm64-only (excluded-archs
            # x86_64), and this workflow does not expose an override, so the
            # packaged Simulator app can only launch on an arm64 host. A
            # test-runner-labels pool on a different architecture than the
            # build pool would otherwise fail confusingly inside simctl
            # install; fail fast with an actionable message instead.
            - name: Assert test runner architecture matches the packaged app
              shell: bash
              run: |
                  set -euo pipefail
                  arch=$(uname -m)
                  if [ "$arch" != 'arm64' ]; then
                    echo "::error::Test runner architecture is '$arch', but the packaged Simulator app is arm64-only. Set test-runner-labels to an arm64 pool."
                    exit 1
                  fi

            - name: setup-xcode-pinned
              uses: rnw-community/mobile-ci/actions/setup-xcode-pinned@v2.3.0 # v2.3.0
              with:
                  version: ${{ inputs.xcode-version }}
                  build: ${{ inputs.xcode-build }}

            - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
              with:
                  name: ios-e2e-app-${{ matrix.target.name }}
                  path: .ci-artifacts/ios-e2e-app-${{ matrix.target.name }}

            - name: Unpack app
              shell: bash
              env:
                  TARGET_NAME: ${{ matrix.target.name }}
              run: tar -xzf ".ci-artifacts/ios-e2e-app-${TARGET_NAME}/ios-e2e-app-${TARGET_NAME}.tar.gz" -C ".ci-artifacts/ios-e2e-app-${TARGET_NAME}"

            - name: run-maestro-ios
              uses: rnw-community/mobile-ci/actions/run-maestro-ios@v2.3.0 # v2.3.0
              with:
                  app-path: .ci-artifacts/ios-e2e-app-${{ matrix.target.name }}/Base.app
                  app-id: ${{ matrix.target.appId }}
                  flows-dir: ${{ inputs.flows-dir }}
                  flows-max-depth: ${{ inputs.flows-max-depth }}
                  flows-name-pattern: ${{ inputs.flows-name-pattern }}
                  flows-exclude-pattern: ${{ inputs.flows-exclude-pattern }}
                  shard-manifest-dir: ${{ inputs.shard-manifest-dir }}
                  shard-index: ${{ matrix.shard-index }}
                  shard-count: ${{ inputs.shard-count }}
                  pre-run-flow: ${{ inputs.pre-run-flow }}
                  flow-recovery-flow: ${{ inputs.flow-recovery-flow }}
                  pre-test-command: ${{ inputs.pre-test-command }}
                  pre-flow-command: ${{ inputs.pre-flow-command }}
                  app-warm-seconds: ${{ inputs.app-warm-seconds }}
                  maestro-env: ${{ inputs.maestro-env }}
                  maestro-config: ${{ inputs.maestro-config }}
                  flow-retries: ${{ inputs.flow-retries }}
                  maestro-version: ${{ inputs.maestro-version }}
                  simulator-device: ${{ inputs.simulator-device }}
                  simslim-version: ${{ inputs.simslim-version }}
                  simslim-sha256: ${{ inputs.simslim-sha256 }}
                  simulator-slim-profile: ${{ inputs.simulator-slim-profile }}
                  simulator-slim-repair: ${{ inputs.simulator-slim-repair }}
                  simulator-requires: ${{ inputs.simulator-requires }}
                  artifacts-dir: ${{ github.workspace }}/artifacts/maestro-ios-${{ matrix.target.name }}-${{ matrix.shard-index }}
                  artifact-name: maestro-ios-${{ matrix.target.name }}-shard-${{ matrix.shard-index }}

    status:
        name: iOS Maestro E2E result
        needs: [detect, plan, native-targets, build, test]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Report
              shell: bash
              env:
                  DETECT_RESULT: ${{ needs.detect.result }}
                  DETECT_AFFECTED: ${{ needs.detect.outputs.affected }}
                  PLAN_RESULT: ${{ needs.plan.result }}
                  NATIVE_TARGETS: ${{ needs.native-targets.outputs.targets }}
                  NATIVE_TARGETS_RESULT: ${{ needs.native-targets.result }}
                  BUILD_RESULT: ${{ needs.build.result }}
                  TEST_RESULT: ${{ needs.test.result }}
              run: |
                  summary() {
                    printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
                  }
                  cancelled_hint() {
                    if [ "$1" = 'cancelled' ]; then
                      echo "::notice::A cancelled job result often means the job hit its timeout-minutes - check the job's duration against build-timeout-minutes/test-timeout-minutes before assuming external cancellation."
                    fi
                  }
                  if [ "$DETECT_RESULT" != "success" ]; then
                    echo "Detection job did not succeed (result: $DETECT_RESULT)."
                    summary "### iOS Maestro E2E: failed (detect job result: $DETECT_RESULT)"
                    cancelled_hint "$DETECT_RESULT"
                    exit 1
                  fi
                  if [ "$DETECT_AFFECTED" != "true" ]; then
                    echo "::notice::iOS Maestro E2E skipped: target packages untouched, so every build/test leg was skipped and zero Maestro flows ran. This is not a pass."
                    summary "### iOS Maestro E2E: skipped — target packages untouched, zero Maestro flows ran (not a pass)"
                    exit 0
                  fi
                  if [ "$PLAN_RESULT" != "success" ]; then
                    echo "Plan job did not succeed (result: $PLAN_RESULT)."
                    summary "### iOS Maestro E2E: failed (plan job result: $PLAN_RESULT)"
                    cancelled_hint "$PLAN_RESULT"
                    exit 1
                  fi
                  if [ "$NATIVE_TARGETS_RESULT" != "success" ]; then
                    echo "Native-target collection did not succeed (result: $NATIVE_TARGETS_RESULT)."
                    summary "### iOS Maestro E2E: failed (native-targets job result: $NATIVE_TARGETS_RESULT)"
                    cancelled_hint "$NATIVE_TARGETS_RESULT"
                    exit 1
                  fi
                  if [ "$BUILD_RESULT" = 'skipped' ] && [ "$NATIVE_TARGETS" != '[]' ]; then
                    echo "The native build was skipped while ${NATIVE_TARGETS} still needed one; a skipped build is not a build."
                    summary "### iOS Maestro E2E: failed (native build skipped with targets still needing one)"
                    exit 1
                  fi
                  if [ "$BUILD_RESULT" != "success" ] && [ "$BUILD_RESULT" != 'skipped' ]; then
                    echo "Build job did not succeed (result: $BUILD_RESULT)."
                    summary "### iOS Maestro E2E: failed (build job result: $BUILD_RESULT)"
                    cancelled_hint "$BUILD_RESULT"
                    exit 1
                  fi
                  if [ "$TEST_RESULT" != "success" ]; then
                    echo "Maestro suite did not succeed (result: $TEST_RESULT)."
                    summary "### iOS Maestro E2E: failed (test job result: $TEST_RESULT)"
                    cancelled_hint "$TEST_RESULT"
                    exit 1
                  fi
                  echo "Maestro suite passed."
                  summary "### iOS Maestro E2E: passed"
