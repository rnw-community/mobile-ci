name: store-screenshots

on:
    workflow_call:
        inputs:
            config-path:
                description: >-
                    Optional repository-relative path to a JSON file in the calling
                    repository holding this workflow's app-shaped configuration, so a
                    caller does not have to pass JSON-in-YAML string blobs through
                    'with:'. The file is a single flat JSON object whose keys are
                    workflow input names, with the real JSON structure (object/array)
                    as the value for the inputs that are JSON blobs. Precedence is
                    explicit workflow input > config file value > built-in default.
                    Only the keys listed in docs/workflows/store-screenshots.md#config-file
                    are loadable - plan-time inputs (every *runner-labels and every
                    *timeout-minutes) are not, because a file read at runtime cannot
                    feed runs-on/timeout-minutes. A missing/unreadable file, invalid
                    JSON, a non-object top level, or an unknown key fails closed.
                type: string
                required: false
                default: ''
            runner-labels:
                description: JSON array of self-hosted runner labels for the iOS build/capture jobs.
                type: string
                required: false
                default: '["self-hosted","macOS","ARM64"]'
            build-runner-labels:
                description: >-
                    JSON array of self-hosted runner labels for the iOS build job (and
                    the Android build job, unless android-build-runner-labels is set).
                    Falls back to runner-labels when empty.
                type: string
                required: false
                default: ''
            capture-runner-labels:
                description: >-
                    JSON array of self-hosted runner labels for the iOS capture job
                    only (the Android capture job uses
                    android-capture-runner-labels instead - a deliberate asymmetry,
                    since the two pools can never overlap). Falls back to
                    runner-labels when empty. Must resolve to an arm64 macOS pool
                    regardless of the build pool's architecture, same constraint as
                    ios-maestro.yml's test-runner-labels.
                type: string
                required: false
                default: ''
            upload-runner-labels:
                description: >-
                    JSON array of runner labels for the gated upload job. Falls back to
                    runner-labels when empty.
                type: string
                required: false
                default: ''
            ios-target:
                description: >-
                    Single iOS build target JSON object: {name, appDir, workspace,
                    scheme, appId, prebuildCommand}. prebuildCommand may be an empty
                    string. Singular (unlike ios-maestro.yml's targets array) - store
                    screenshots are captured for one app configuration per run.
                    Required when capture-manifest has iOS entries (renamed from
                    'target' in v1.6.0).
                type: string
                required: false
                default: ''
            android-target:
                description: >-
                    Single Android build target JSON object: {name, appDir, appId,
                    prebuildCommand} - the same per-target shape as
                    android-maestro.yml's targets entries. Required when
                    capture-manifest has Android entries.
                type: string
                required: false
                default: ''
            capture-manifest:
                description: >-
                    JSON array of capture matrix entries, one capture job per entry.
                    Each entry has an optional "platform" ("ios" default, or
                    "android"), "locales", "appearances", and "device". iOS entries
                    take an exact simulator name as "device" plus an optional
                    "orientation"; Android entries take a free-form "device" label
                    (slug only) plus required integer "width"/"height"/"density" and
                    must be portrait. A "locales" item may be a plain string or an
                    object {"id": "<locale>", "env": {"KEY": "VALUE"}} whose env is
                    passed as extra Maestro -e pairs to that locale's cells only
                    (reserved names APP_ID/LOCALE/APPEARANCE fail closed). locales x
                    appearances x scenes are looped inside each job, reusing one
                    booted simulator/container per entry. See
                    docs/workflows/store-screenshots.md for the full schema and
                    validation rules. Required, but loadable from config-path
                    instead of being passed here.
                type: string
                required: false
                default: ''
            capture-mode:
                description: >-
                    'flows' (default; legacy Maestro flow discovery under
                    screenshots-dir, iOS-only) or 'direct' (scene-manifest-driven via
                    capture-scenes, required for Android entries). Any other value
                    fails closed. Empty resolves to the config-path value, else
                    'flows'.
                type: string
                required: false
                default: ''
            capture-scenes:
                description: >-
                    JSON array of scene objects shared across all capture-manifest
                    entries, each {"name", and exactly one of "deepLink" or "flow",
                    optional "settleSeconds", "platforms", "locales", "appearances"}.
                    Required when capture-mode is 'direct'; fails closed if set in
                    'flows' mode.
                type: string
                required: false
                default: ''
            seed-command:
                description: >-
                    Optional consumer-owned shell command run once per
                    locale x appearance x scene cell, from the repo root, with the
                    app installed and terminated/force-stopped, before the scene's
                    launch. Direct mode only; fails closed if set in 'flows' mode.
                    See docs/workflows/store-screenshots.md#seed-hook-contract for
                    the environment it runs with.
                type: string
                required: false
                default: ''
            settle-seconds:
                description: >-
                    Seconds (integer 0-120) between a deep-link launch and its
                    screenshot in direct mode; a scene's own settleSeconds overrides
                    it per scene. Empty resolves to the config-path value, else '3'.
                type: string
                required: false
                default: ''
            deeplink-confirm-title:
                description: >-
                    iOS only, direct mode only. Maestro text pattern (regex)
                    matching the title of the "Open in <app>?" confirmation sheet
                    SpringBoard presents for a `simctl openurl` deep link. Every
                    deep-link capture taps the sheet away when it is on screen and
                    then asserts, fail-closed, that it is gone - a capture taken
                    while it is up is a screenshot of SpringBoard, not of the app.
                    The default matches an English-language simulator (the
                    CoreSimulator default); a simulator whose own language is not
                    English must set both this and deeplink-confirm-button, or
                    the capture fails closed. The trailing '\?' keeps the default
                    anchored to the sheet's own title rather than to app content
                    that merely starts with 'Open in'. Empty resolves to the
                    config-path value, else 'Open in .*\?'.
                type: string
                required: false
                default: ''
            deeplink-confirm-button:
                description: >-
                    iOS only, direct mode only. Label of the confirm button on the
                    open-confirmation sheet matched by deeplink-confirm-title.
                    Empty resolves to the config-path value, else 'Open'.
                type: string
                required: false
                default: ''
            status-bar-override:
                description: >-
                    Force a store-clean status bar in both modes: 9:41, full
                    wifi/cellular, battery 100 (iOS `simctl status_bar` override;
                    Android SystemUI demo mode). Fails closed if the override cannot
                    be applied; set to false to capture the real status bar. Left at
                    its default, a config-path value wins.
                type: boolean
                required: false
                default: true
            apple-screenshot-slots:
                description: >-
                    Optional JSON object mapping pixel resolutions to App Store slot
                    labels, e.g. {"1320x2868": "IPHONE_69", "2064x2752":
                    "IPAD_PRO_3GEN_129"}. Non-empty enables a fail-closed resolution
                    check in the upload job: every downloaded iOS PNG must match one
                    of the keys (WxH or HxW), and a slot->count coverage table is
                    appended to the job summary.
                type: string
                required: false
                default: ''
            screenshots-dir:
                description: >-
                    Directory (relative to repo root) whose top-level files are the
                    runnable screenshot scenes in 'flows' mode (subdirectories -
                    subflows, fixtures - are never searched), and the directory
                    flow-backed capture-scenes entries resolve against in 'direct'
                    mode. Required in 'flows' mode, and in 'direct' mode when any
                    scene declares a flow.
                type: string
                required: false
                default: ''
            scenes-name-pattern:
                type: string
                required: false
                default: '*.flow.yaml'
            scenes-exclude-pattern:
                type: string
                required: false
                default: ''
            maestro-env:
                description: >-
                    Newline-separated KEY=VALUE pairs, each passed as an additional
                    -e KEY=VALUE argument to every `maestro test` invocation, on top
                    of the always-passed APP_ID/LOCALE/APPEARANCE. Rejects (fails
                    closed) any line without '=', any name not matching
                    ^[A-Za-z_][A-Za-z0-9_]*$, and any reserved APP_ID/LOCALE/
                    APPEARANCE override. Per-locale values belong in the manifest's
                    {"id","env"} locale objects instead.
                type: string
                required: false
                default: ''
            maestro-config:
                description: >-
                    Path to the consumer's Maestro workspace config (config.yaml),
                    passed as --config to every `maestro test` invocation. Maestro only
                    auto-discovers a workspace config.yaml when it is pointed at a
                    directory, and the actions below always pass individual flow files,
                    so without this input a workspace config is silently ignored.
                    Relative paths resolve against the job's working directory. Fails
                    closed when set to a path that is not a file.
                type: string
                required: false
                default: ''
            maestro-version:
                description: >-
                    Pinned Maestro CLI version, still used by flow-backed scenes in
                    either capture mode (and installed lazily in direct mode, only on
                    capture jobs whose scene set contains a flow).
                type: string
                required: false
                default: '2.8.0'
            post-capture-command:
                description: >-
                    Optional consumer-owned shell command run in each capture job
                    (iOS and Android alike) after capture completes, before the raw
                    screenshots are uploaded as an artifact - e.g. a
                    framing/device-bezel script. Runs with SCREENSHOTS_OUTPUT_DIR
                    (the capture action's output-dir) and DEVICE_SLUG in its
                    environment. Its failure fails the capture job.
                type: string
                required: false
                default: ''
            xcode-version:
                type: string
                required: false
                default: '26.4.1'
            xcode-build:
                type: string
                required: false
                default: '17E202'
            cache-profile:
                description: >-
                    Cache-key prefix distinguishing this consumer/app (iOS build job).
                    Empty resolves to the config-path value, else 'ios-native-v1'.
                type: string
                required: false
                default: ''
            expo-fingerprint-version:
                type: string
                required: false
                default: '0.20.6'
            node-version:
                type: string
                required: false
                default: 22.x
            install-command:
                description: >-
                    JS dependency install command. Empty resolves to the config-path
                    value, else 'yarn install --immutable'.
                type: string
                required: false
                default: ''
            enable-corepack:
                type: boolean
                required: false
                default: true
            package-manager:
                description: >-
                    JS package manager driving pnpm provisioning and, in the jobs
                    that configure one, actions/setup-node's dependency cache.
                    Leave empty to auto-detect at the repository root, in order: an
                    explicit value here, then package.json's
                    devEngines.packageManager / packageManager field (needs jq on
                    the runner), then exactly one root lockfile (yarn.lock,
                    pnpm-lock.yaml, package-lock.json / npm-shrinkwrap.json). No
                    match, an ambiguous
                    match, or an unsupported value fails the job. install-command
                    must match the resolved manager (e.g. pnpm install
                    --frozen-lockfile). Resolving to pnpm additionally requires a
                    pnpm version declared in package.json (packageManager or
                    devEngines.packageManager) because pnpm/action-setup reads it
                    from there; the corepack step is then skipped.
                type: string
                required: false
                default: ''
            build-command:
                description: Optional workspace JS build command run at repo root before the native build (both build jobs).
                type: string
                required: false
                default: ''
            rct-use-prebuilt-rncore:
                description: Exports RCT_USE_PREBUILT_RNCORE=1 for the iOS build. Left at its default, a config-path value wins.
                type: boolean
                required: false
                default: false
            rct-use-rn-dep:
                description: Exports RCT_USE_RN_DEP=1 for the iOS build. Left at its default, a config-path value wins.
                type: boolean
                required: false
                default: false
            expo-use-precompiled-modules:
                type: boolean
                required: false
                default: false
            ccache-max-size:
                type: string
                required: false
                default: 2G
            build-env:
                description: >-
                    Newline-separated KEY=VALUE pairs appended to $GITHUB_ENV at the
                    start of each build job (iOS and Android alike). Rejects (fails
                    closed) any line without '=' or whose name does not match
                    ^[A-Za-z_][A-Za-z0-9_]*$.
                type: string
                required: false
                default: ''
            repack-on-hit:
                description: >-
                    On a native-app-cache hit (either platform), run repack-app to
                    inject a freshly exported JS bundle into the cached shell instead
                    of reusing it unchanged. Falls back to a full native build if the
                    repack fails. Left at its default, a config-path value wins.
                type: boolean
                required: false
                default: false
            repack-app-version:
                description: Pinned @expo/repack-app npm version, used only when repack-on-hit is true.
                type: string
                required: false
                default: '0.7.2'
            build-timeout-minutes:
                description: iOS build job timeout.
                type: number
                required: false
                default: 60
            capture-timeout-minutes:
                description: >-
                    iOS capture job timeout. Default is generous because one job runs
                    the full locales x appearances x scenes loop for its device on a
                    single booted simulator (e.g. 13 locales x 2 appearances x 10
                    scenes).
                type: number
                required: false
                default: 90
            android-build-runner-labels:
                description: >-
                    JSON array of runner labels for the Android build job. Falls back
                    to build-runner-labels, then runner-labels - the macOS default is
                    deliberately correct, since Google publishes no linux-aarch64
                    NDK/cmake and the Redroid capture pool therefore cannot build.
                type: string
                required: false
                default: ''
            android-capture-runner-labels:
                description: >-
                    JSON array of runner labels for the Android capture job (the
                    Redroid pool). Deliberately does NOT fall back to runner-labels,
                    whose macOS default can never run a Redroid container.
                type: string
                required: false
                default: '["self-hosted","linux-tiered","linux-xl"]'
            android-cmdline-tools-version:
                description: See build-android-app README - pin explicitly, do not trust upstream defaults.
                type: string
                required: false
                default: '12266719'
            android-gradle-task:
                description: >-
                    gradlew task for the Android build. Empty resolves to the
                    config-path value, else 'assembleRelease'.
                type: string
                required: false
                default: ''
            android-gradle-args:
                type: string
                required: false
                default: ''
            android-cache-profile:
                description: >-
                    Cache-key prefix distinguishing this consumer/app (Android build
                    job). Empty resolves to the config-path value, else
                    'android-native-v1'.
                type: string
                required: false
                default: ''
            android-build-tools-version:
                description: >-
                    Android build-tools version installed via
                    android-actions/setup-android on a native-app-cache hit, used
                    only when repack-on-hit is true - same rationale as
                    android-maestro.yml's input of the same name.
                type: string
                required: false
                default: '35.0.0'
            android-build-tools-dir:
                description: >-
                    Path to the Android SDK build-tools directory for repack-app's
                    aapt2 validation, used only when repack-on-hit is true. Leave
                    empty to rely on an aapt2 already on PATH.
                type: string
                required: false
                default: ''
            android-build-timeout-minutes:
                type: number
                required: false
                default: 60
            android-capture-timeout-minutes:
                type: number
                required: false
                default: 90
            redroid-image:
                description: >-
                    Redroid image tag, used on a redroid-prewarm-manifest-path miss.
                    Must resolve to API 33+ (capture-screenshots-android fails closed
                    below that).
                type: string
                required: false
                default: redroid/redroid:15.0.0_64only-latest
            redroid-memory:
                type: string
                required: false
                default: 3g
            redroid-cpus:
                type: string
                required: false
                default: '2'
            redroid-prewarm-manifest-path:
                type: string
                required: false
                default: $HOME/.rnw-ci/android-emulator.json
            redroid-boot-timeout-seconds:
                type: string
                required: false
                default: '600'
            upload-screenshots:
                description: >-
                    Run the gated upload job, which downloads every capture job's raw
                    screenshots and runs upload-command (e.g. a fastlane deliver lane).
                    Left at its default, a config-path value wins.
                type: boolean
                required: false
                default: false
            upload-command:
                description: >-
                    Consumer-owned command run in the upload job, e.g.
                    'bundle exec fastlane ios ios_screenshots'. Required when
                    upload-screenshots is true; runs in the resolved app directory
                    (ios-target's appDir when set, android-target's otherwise) with
                    the downloaded screenshots under screenshots-download-dir, which
                    is also exposed to it as the SCREENSHOTS_DIR environment
                    variable.
                type: string
                required: false
                default: ''
            screenshots-download-dir:
                description: >-
                    Path, relative to the resolved app directory (ios-target's appDir
                    when set, android-target's otherwise), every capture job's
                    raw-screenshots-<platform>-<device-slug> artifact is merged into
                    before upload-command runs - iOS screenshots land under its ios/
                    subdirectory and Android under android/. Defaults to the
                    reference implementation's fastlane/screenshots/raw convention
                    so an unmodified fastlane Deliverfile pointed at that path works
                    unchanged. Empty resolves to the config-path value, else
                    'fastlane/screenshots/raw'.
                type: string
                required: false
                default: ''
            asc-key-path:
                description: >-
                    Optional path, relative to the resolved app directory, the App
                    Store Connect API key (.p8) is written to and removed from for
                    upload-command - set this only when your fastlane setup requires
                    the key at a specific app-dir-relative location; otherwise leave
                    empty so the key is written under $RUNNER_TEMP.
                type: string
                required: false
                default: ''
            publish-env:
                description: >-
                    Newline-separated KEY=VALUE pairs of non-secret env appended to
                    $GITHUB_ENV at the start of the upload job, before upload-command
                    runs. Rejects (fails closed) any line without '=' or whose name
                    does not match ^[A-Za-z_][A-Za-z0-9_]*$. For secret values use the
                    EAS_EXTRA_ENV secret instead - inputs are not masked in logs.
                type: string
                required: false
                default: ''
            asc-dedupe-screenshots:
                description: >-
                    After upload-command succeeds, verify (and repair) that the App
                    Store Connect version carries no duplicate screenshots via the
                    asc-dedupe-screenshots action - deliver's retry logic can
                    double-upload a screenshot so both copies survive on the listing.
                    Requires the ASC_API_KEY, ASC_KEY_ID, and ASC_ISSUER_ID secrets
                    and an ios-target (App Store Connect is iOS-only). Fails the
                    upload job when any duplicate had to be deleted unless
                    asc-fail-on-duplicates is false - duplicates mean the upload
                    lane is flaky even though this repaired the listing. Left at its
                    default, a config-path value wins.
                type: boolean
                required: false
                default: false
            asc-dedupe-version-state:
                description: >-
                    App Store Connect appStoreState whose localizations are deduped;
                    PREPARE_FOR_SUBMISSION (the editable version) targets the same
                    run's upload, READY_FOR_SALE audits the live listing. Empty
                    resolves to the config-path value, else PREPARE_FOR_SUBMISSION.
                type: string
                required: false
                default: ''
            asc-dedupe-app-id:
                description: >-
                    Bundle identifier of the App Store Connect app whose listing is
                    deduped. Defaults to ios-target's appId - set this when the
                    capture build uses a suffixed/e2e bundle id while the listing
                    lives under the store app's own id.
                type: string
                required: false
                default: ''
            asc-fail-on-duplicates:
                description: >-
                    Set to false to treat asc-dedupe-screenshots repairing
                    duplicates as success instead of failing the upload job. Left at
                    its default, a config-path value wins.
                type: boolean
                required: false
                default: true

        secrets:
            EXPO_TOKEN:
                description: Expo access token, forwarded to the upload job's environment if upload-command needs it.
                required: false
            ASC_API_KEY:
                description: >-
                    App Store Connect API key contents (.p8). When set, written to
                    asc-key-path (or $RUNNER_TEMP) before upload-command runs and
                    removed afterward, same contract as native-publish.yml. Also the
                    key asc-dedupe-screenshots signs with when
                    asc-dedupe-screenshots is true.
                required: false
            ASC_KEY_ID:
                description: App Store Connect API key ID; required (with ASC_ISSUER_ID) only when asc-dedupe-screenshots is true.
                required: false
            ASC_ISSUER_ID:
                description: App Store Connect API issuer ID (UUID); required (with ASC_KEY_ID) only when asc-dedupe-screenshots is true.
                required: false
            EAS_EXTRA_ENV:
                description: >-
                    Newline-separated KEY=VALUE pairs of secret env appended to
                    $GITHUB_ENV at the start of the upload job, with each value masked
                    in logs before being written. Same fail-closed parser and masking
                    as native-publish.yml's EAS_EXTRA_ENV.
                required: false

concurrency:
    group: store-screenshots-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    validate-manifest:
        name: Validate capture manifest and scenes
        runs-on: ubuntu-latest
        outputs:
            has-ios: ${{ steps.validate.outputs.has-ios }}
            has-android: ${{ steps.validate.outputs.has-android }}
            ios-entries: ${{ steps.validate.outputs.ios-entries }}
            android-entries: ${{ steps.validate.outputs.android-entries }}
            ios-target: ${{ steps.resolve.outputs.ios-target }}
            android-target: ${{ steps.resolve.outputs.android-target }}
            capture-scenes: ${{ steps.resolve.outputs.capture-scenes }}
            screenshots-dir: ${{ steps.resolve.outputs.screenshots-dir }}
            seed-command: ${{ steps.resolve.outputs.seed-command }}
            settle-seconds: ${{ steps.resolve.outputs.settle-seconds }}
            deeplink-confirm-title: ${{ steps.resolve.outputs.deeplink-confirm-title }}
            deeplink-confirm-button: ${{ steps.resolve.outputs.deeplink-confirm-button }}
            status-bar-override: ${{ steps.resolve.outputs.status-bar-override }}
            apple-screenshot-slots: ${{ steps.resolve.outputs.apple-screenshot-slots }}
            maestro-env: ${{ steps.resolve.outputs.maestro-env }}
            maestro-config: ${{ steps.resolve.outputs.maestro-config }}
            build-env: ${{ steps.resolve.outputs.build-env }}
            install-command: ${{ steps.resolve.outputs.install-command }}
            build-command: ${{ steps.resolve.outputs.build-command }}
            cache-profile: ${{ steps.resolve.outputs.cache-profile }}
            android-cache-profile: ${{ steps.resolve.outputs.android-cache-profile }}
            android-gradle-task: ${{ steps.resolve.outputs.android-gradle-task }}
            android-gradle-args: ${{ steps.resolve.outputs.android-gradle-args }}
            repack-on-hit: ${{ steps.resolve.outputs.repack-on-hit }}
            rct-use-prebuilt-rncore: ${{ steps.resolve.outputs.rct-use-prebuilt-rncore }}
            rct-use-rn-dep: ${{ steps.resolve.outputs.rct-use-rn-dep }}
            upload-screenshots: ${{ steps.resolve.outputs.upload-screenshots }}
            upload-command: ${{ steps.resolve.outputs.upload-command }}
            screenshots-download-dir: ${{ steps.resolve.outputs.screenshots-download-dir }}
            publish-env: ${{ steps.resolve.outputs.publish-env }}
            asc-dedupe-screenshots: ${{ steps.resolve.outputs.asc-dedupe-screenshots }}
            asc-dedupe-version-state: ${{ steps.resolve.outputs.asc-dedupe-version-state }}
            asc-dedupe-app-id: ${{ steps.resolve.outputs.asc-dedupe-app-id }}
            asc-fail-on-duplicates: ${{ steps.resolve.outputs.asc-fail-on-duplicates }}
        steps:
            - name: Check out the consumer config file
              if: inputs.config-path != ''
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
                  sparse-checkout: ${{ inputs.config-path }}
                  sparse-checkout-cone-mode: false

            - name: load-consumer-config
              id: load-config
              if: inputs.config-path != ''
              uses: rnw-community/mobile-ci/actions/load-consumer-config@v1.11.0 # v1.11.0
              with:
                  config-path: ${{ inputs.config-path }}
                  allowed-keys: >-
                      ["ios-target","android-target","capture-manifest","capture-mode","capture-scenes",
                      "screenshots-dir","seed-command","settle-seconds","deeplink-confirm-title",
                      "deeplink-confirm-button","status-bar-override",
                      "apple-screenshot-slots","maestro-env","maestro-config","build-env",
                      "install-command","build-command","cache-profile","android-cache-profile",
                      "android-gradle-task","android-gradle-args","repack-on-hit",
                      "rct-use-prebuilt-rncore","rct-use-rn-dep","upload-screenshots","upload-command",
                      "screenshots-download-dir","publish-env","asc-dedupe-screenshots",
                      "asc-dedupe-version-state","asc-dedupe-app-id","asc-fail-on-duplicates"]

            - name: Resolve inputs against the consumer config
              id: resolve
              shell: bash
              env:
                  CONFIG_JSON: ${{ steps.load-config.outputs.json || '{}' }}
                  IN_IOS_TARGET: ${{ inputs.ios-target }}
                  IN_ANDROID_TARGET: ${{ inputs.android-target }}
                  IN_CAPTURE_MANIFEST: ${{ inputs.capture-manifest }}
                  IN_CAPTURE_MODE: ${{ inputs.capture-mode }}
                  IN_CAPTURE_SCENES: ${{ inputs.capture-scenes }}
                  IN_SCREENSHOTS_DIR: ${{ inputs.screenshots-dir }}
                  IN_SEED_COMMAND: ${{ inputs.seed-command }}
                  IN_SETTLE_SECONDS: ${{ inputs.settle-seconds }}
                  IN_DEEPLINK_CONFIRM_TITLE: ${{ inputs.deeplink-confirm-title }}
                  IN_DEEPLINK_CONFIRM_BUTTON: ${{ inputs.deeplink-confirm-button }}
                  IN_STATUS_BAR_OVERRIDE: ${{ inputs.status-bar-override }}
                  IN_APPLE_SCREENSHOT_SLOTS: ${{ inputs.apple-screenshot-slots }}
                  IN_MAESTRO_ENV: ${{ inputs.maestro-env }}
                  IN_MAESTRO_CONFIG: ${{ inputs.maestro-config }}
                  IN_BUILD_ENV: ${{ inputs.build-env }}
                  IN_INSTALL_COMMAND: ${{ inputs.install-command }}
                  IN_BUILD_COMMAND: ${{ inputs.build-command }}
                  IN_CACHE_PROFILE: ${{ inputs.cache-profile }}
                  IN_ANDROID_CACHE_PROFILE: ${{ inputs.android-cache-profile }}
                  IN_ANDROID_GRADLE_TASK: ${{ inputs.android-gradle-task }}
                  IN_ANDROID_GRADLE_ARGS: ${{ inputs.android-gradle-args }}
                  IN_REPACK_ON_HIT: ${{ inputs.repack-on-hit }}
                  IN_RCT_USE_PREBUILT_RNCORE: ${{ inputs.rct-use-prebuilt-rncore }}
                  IN_RCT_USE_RN_DEP: ${{ inputs.rct-use-rn-dep }}
                  IN_UPLOAD_SCREENSHOTS: ${{ inputs.upload-screenshots }}
                  IN_UPLOAD_COMMAND: ${{ inputs.upload-command }}
                  IN_SCREENSHOTS_DOWNLOAD_DIR: ${{ inputs.screenshots-download-dir }}
                  IN_PUBLISH_ENV: ${{ inputs.publish-env }}
                  IN_ASC_DEDUPE_SCREENSHOTS: ${{ inputs.asc-dedupe-screenshots }}
                  IN_ASC_DEDUPE_VERSION_STATE: ${{ inputs.asc-dedupe-version-state }}
                  IN_ASC_DEDUPE_APP_ID: ${{ inputs.asc-dedupe-app-id }}
                  IN_ASC_FAIL_ON_DUPLICATES: ${{ inputs.asc-fail-on-duplicates }}
              run: |
                  set -euo pipefail
                  emit() {
                    emit_name="$1"
                    emit_value="$2"
                    emit_delim="RESOLVED_$(od -An -tx1 -N16 /dev/urandom | tr -d ' \n')"
                    case "$emit_value" in
                      *"$emit_delim"*)
                        echo "::error::Resolved value for '$emit_name' collides with its generated GITHUB_OUTPUT delimiter."
                        exit 1
                        ;;
                    esac
                    {
                      printf '%s<<%s\n' "$emit_name" "$emit_delim"
                      printf '%s\n' "$emit_value"
                      printf '%s\n' "$emit_delim"
                    } >> "$GITHUB_OUTPUT"
                  }
                  from_input=''
                  from_config=''
                  from_default=''
                  for spec in \
                    'ios-target|json|' \
                    'android-target|json|' \
                    'capture-manifest|json|' \
                    'capture-mode|string|flows' \
                    'capture-scenes|json|' \
                    'screenshots-dir|string|' \
                    'seed-command|string|' \
                    'settle-seconds|string|3' \
                    'deeplink-confirm-title|string|Open in .*\?' \
                    'deeplink-confirm-button|string|Open' \
                    'status-bar-override|bool|true' \
                    'apple-screenshot-slots|json|' \
                    'maestro-env|string|' \
                    'maestro-config|string|' \
                    'build-env|string|' \
                    'install-command|string|yarn install --immutable' \
                    'build-command|string|' \
                    'cache-profile|string|ios-native-v1' \
                    'android-cache-profile|string|android-native-v1' \
                    'android-gradle-task|string|assembleRelease' \
                    'android-gradle-args|string|' \
                    'repack-on-hit|bool|false' \
                    'rct-use-prebuilt-rncore|bool|false' \
                    'rct-use-rn-dep|bool|false' \
                    'upload-screenshots|bool|false' \
                    'upload-command|string|' \
                    'screenshots-download-dir|string|fastlane/screenshots/raw' \
                    'publish-env|string|' \
                    'asc-dedupe-screenshots|bool|false' \
                    'asc-dedupe-version-state|string|PREPARE_FOR_SUBMISSION' \
                    'asc-dedupe-app-id|string|' \
                    'asc-fail-on-duplicates|bool|true'
                  do
                    key="${spec%%|*}"
                    rest="${spec#*|}"
                    kind="${rest%%|*}"
                    fallback="${rest#*|}"
                    env_name="IN_$(printf '%s' "$key" | tr 'a-z-' 'A-Z_')"
                    if ! raw="$(printenv "$env_name")"; then
                      echo "::error::resolver has no '$env_name' env mapping for loadable key '$key'; every key in the resolution list needs one."
                      exit 1
                    fi
                    if [ "$kind" = 'bool' ]; then declared="$fallback"; else declared=''; fi
                    if [ "$raw" != "$declared" ]; then
                      emit "$key" "$raw"
                      from_input="$from_input $key"
                      continue
                    fi
                    if [ "$(jq -r --arg k "$key" 'has($k)' <<< "$CONFIG_JSON")" != 'true' ]; then
                      emit "$key" "$fallback"
                      from_default="$from_default $key"
                      continue
                    fi
                    value_type="$(jq -r --arg k "$key" '.[$k] | type' <<< "$CONFIG_JSON")"
                    case "$kind" in
                      json)
                        case "$value_type" in
                          object|array) value="$(jq -c --arg k "$key" '.[$k]' <<< "$CONFIG_JSON")" ;;
                          string) value="$(jq -r --arg k "$key" '.[$k]' <<< "$CONFIG_JSON")" ;;
                          *)
                            echo "::error::config key '$key' must be a JSON object or array (or a pre-serialized JSON string); got $value_type."
                            exit 1
                            ;;
                        esac
                        ;;
                      bool)
                        case "$value_type" in
                          boolean|string) value="$(jq -r --arg k "$key" '.[$k] | tostring' <<< "$CONFIG_JSON")" ;;
                          *)
                            echo "::error::config key '$key' must be a JSON boolean; got $value_type."
                            exit 1
                            ;;
                        esac
                        case "$value" in
                          true|false) ;;
                          *)
                            echo "::error::config key '$key' must be true or false; got '$value'."
                            exit 1
                            ;;
                        esac
                        ;;
                      *)
                        case "$value_type" in
                          string) value="$(jq -r --arg k "$key" '.[$k]' <<< "$CONFIG_JSON")" ;;
                          number|boolean) value="$(jq -r --arg k "$key" '.[$k] | tostring' <<< "$CONFIG_JSON")" ;;
                          *)
                            echo "::error::config key '$key' must be a JSON string, number, or boolean; got $value_type."
                            exit 1
                            ;;
                        esac
                        ;;
                    esac
                    emit "$key" "$value"
                    from_config="$from_config $key"
                  done
                  echo "Resolved from the workflow input:${from_input:- (none)}"
                  echo "Resolved from config-path:${from_config:- (none)}"
                  echo "Resolved from the built-in default:${from_default:- (none)}"

            - name: Validate structure, cross-checks, and matrix limits
              id: validate
              shell: bash
              env:
                  CAPTURE_MANIFEST: ${{ steps.resolve.outputs.capture-manifest }}
                  CAPTURE_MODE: ${{ steps.resolve.outputs.capture-mode }}
                  CAPTURE_SCENES: ${{ steps.resolve.outputs.capture-scenes }}
                  SEED_COMMAND: ${{ steps.resolve.outputs.seed-command }}
                  SETTLE_SECONDS: ${{ steps.resolve.outputs.settle-seconds }}
                  SCREENSHOTS_DIR: ${{ steps.resolve.outputs.screenshots-dir }}
                  IOS_TARGET: ${{ steps.resolve.outputs.ios-target }}
                  ANDROID_TARGET: ${{ steps.resolve.outputs.android-target }}
              run: |
                  set -euo pipefail
                  if [ -z "$CAPTURE_MANIFEST" ]; then
                    echo "::error::capture-manifest is required; pass it as a workflow input or set it in the config-path file."
                    exit 1
                  fi
                  case "$CAPTURE_MODE" in
                    flows|direct) ;;
                    *)
                      echo "::error::capture-mode '$CAPTURE_MODE' must be 'flows' or 'direct'."
                      exit 1
                      ;;
                  esac
                  if [ "$CAPTURE_MODE" = 'flows' ]; then
                    if [ -n "$CAPTURE_SCENES" ]; then
                      echo "::error::capture-scenes is set but capture-mode is 'flows'; the scene manifest is only consumed in capture-mode: direct, so it would be silently ignored."
                      exit 1
                    fi
                    if [ -n "$SEED_COMMAND" ]; then
                      echo "::error::seed-command is set but capture-mode is 'flows'; the seed hook only runs in capture-mode: direct, so it would be silently ignored."
                      exit 1
                    fi
                    if [ -z "$SCREENSHOTS_DIR" ]; then
                      echo "::error::screenshots-dir is required when capture-mode is 'flows' (it is the scene-discovery root)."
                      exit 1
                    fi
                  else
                    if [ -z "$CAPTURE_SCENES" ]; then
                      echo "::error::capture-scenes is required when capture-mode is 'direct'."
                      exit 1
                    fi
                  fi
                  case "$SETTLE_SECONDS" in
                    ''|*[!0-9]*)
                      echo "::error::settle-seconds '$SETTLE_SECONDS' must be a non-negative integer."
                      exit 1
                      ;;
                  esac
                  if [ "$SETTLE_SECONDS" -gt 120 ]; then
                    echo "::error::settle-seconds '$SETTLE_SECONDS' must be at most 120."
                    exit 1
                  fi
                  if ! jq empty <<< "$CAPTURE_MANIFEST" 2>/dev/null; then
                    echo "::error::capture-manifest is not valid JSON."
                    exit 1
                  fi
                  if [ "$(jq 'type' <<< "$CAPTURE_MANIFEST")" != '"array"' ]; then
                    echo "::error::capture-manifest must be a JSON array."
                    exit 1
                  fi
                  if [ "$(jq 'length' <<< "$CAPTURE_MANIFEST")" -lt 1 ]; then
                    echo "::error::capture-manifest must have at least one entry."
                    exit 1
                  fi
                  non_objects=$(jq -c '[.[] | select(type != "object")]' <<< "$CAPTURE_MANIFEST")
                  if [ "$non_objects" != '[]' ]; then
                    echo "::error::capture-manifest has non-object entries: $non_objects"
                    exit 1
                  fi
                  normalized=$(jq -c '[.[] | .platform = (.platform // "ios")]' <<< "$CAPTURE_MANIFEST")
                  invalid_platform=$(jq -c '[.[] | select(.platform != "ios" and .platform != "android")]' <<< "$normalized")
                  if [ "$invalid_platform" != '[]' ]; then
                    echo "::error::capture-manifest has entries whose 'platform' is neither 'ios' nor 'android' (default when omitted: 'ios'): $invalid_platform"
                    exit 1
                  fi
                  # A locale item may be a plain string or an {"id","env"}
                  # object carrying per-locale Maestro env. Validate the
                  # object shape and per-entry id uniqueness, then normalize
                  # every entry to string locales plus a localeEnv map before
                  # the platform split so the capture jobs can pass
                  # join(matrix.entry.locales, ",") through unchanged.
                  invalid_locale_objects=$(jq -c '
                      [.[]
                       | .device as $d
                       | .locales
                       | to_entries[]
                       | select(
                           (.value | type == "object") and
                           (
                             (((.value.id // "") | (type != "string") or (test("^[A-Za-z0-9_-]+$") | not))) or
                             (.value | has("env") and (
                               ((.env | type) != "object") or
                               ([.env | keys[] | select((test("^[A-Za-z_][A-Za-z0-9_]*$") | not) or . == "APP_ID" or . == "LOCALE" or . == "APPEARANCE")] | length > 0) or
                               ([.env[] | select(type != "string")] | length > 0)
                             ))
                           )
                         )
                       | {device: $d, localeIndex: .key}
                      ]' <<< "$normalized")
                  if [ "$invalid_locale_objects" != '[]' ]; then
                    echo "::error::capture-manifest has invalid locale objects (each needs an 'id' matching ^[A-Za-z0-9_-]+\$ and an optional 'env' object whose keys match ^[A-Za-z_][A-Za-z0-9_]*\$, are not the reserved APP_ID/LOCALE/APPEARANCE, and map to string values): $invalid_locale_objects"
                    exit 1
                  fi
                  duplicate_locales=$(jq -c '
                      [.[]
                       | .device as $d
                       | ([.locales[] | if type == "object" then .id else . end]
                          | group_by(.)
                          | map(select(length > 1)[0])) as $dups
                       | select(($dups | length) > 0)
                       | {device: $d, duplicates: $dups}
                      ]' <<< "$normalized")
                  if [ "$duplicate_locales" != '[]' ]; then
                    echo "::error::capture-manifest has entries listing the same locale more than once; give each locale one entry and put its env in the object form instead: $duplicate_locales"
                    exit 1
                  fi
                  normalized=$(jq -c '[.[] | .localeEnv = (([.locales[] | if type == "object" then {(.id): (.env // {})} else {} end]) | add // {}) | .locales = [.locales[] | if type == "object" then .id else . end]]' <<< "$normalized")
                  ios_entries=$(jq -c '[.[] | select(.platform == "ios")]' <<< "$normalized")
                  android_entries=$(jq -c '[.[] | select(.platform == "android")]' <<< "$normalized")
                  ios_count=$(jq 'length' <<< "$ios_entries")
                  android_count=$(jq 'length' <<< "$android_entries")
                  for platform_count in "iOS:$ios_count" "Android:$android_count"; do
                    if [ "${platform_count#*:}" -gt 256 ]; then
                      echo "::error::capture-manifest has ${platform_count#*:} ${platform_count%%:*} entries, exceeding GitHub Actions' 256-job matrix limit per capture job."
                      exit 1
                    fi
                  done
                  invalid_ios=$(jq -c '
                      [.[] | select(
                          (.device | type != "string" or length == 0) or
                          (.locales | type != "array" or length == 0 or any(.[]; type != "string" or length == 0)) or
                          (.appearances | type != "array" or length == 0 or any(.[]; . != "light" and . != "dark")) or
                          ((.orientation // "portrait") as $o | ($o != "portrait" and $o != "landscape"))
                      )]
                  ' <<< "$ios_entries")
                  if [ "$invalid_ios" != '[]' ]; then
                    echo "::error::capture-manifest has invalid iOS entries (each needs a non-empty 'device' string naming an exact simulator, a 'locales' array of non-empty strings, an 'appearances' array containing only 'light'/'dark', and orientation 'portrait'/'landscape' if set): $invalid_ios"
                    exit 1
                  fi
                  invalid_android=$(jq -c '
                      [.[] | select(
                          (.device | type != "string" or length == 0 or (test("^[A-Za-z0-9 ._-]+$") | not)) or
                          (.locales | type != "array" or length == 0 or any(.[]; type != "string" or length == 0)) or
                          (.appearances | type != "array" or length == 0 or any(.[]; . != "light" and . != "dark")) or
                          ((.orientation // "portrait") != "portrait") or
                          (.width | type != "number" or . != floor or . < 1) or
                          (.height | type != "number" or . != floor or . < 1) or
                          (.density | type != "number" or . != floor or . < 1)
                      )]
                  ' <<< "$android_entries")
                  if [ "$invalid_android" != '[]' ]; then
                    echo "::error::capture-manifest has invalid Android entries (each needs a 'device' label matching ^[A-Za-z0-9 ._-]+\$, a 'locales' array of non-empty strings, an 'appearances' array containing only 'light'/'dark', positive integer 'width'/'height'/'density', and no orientation other than 'portrait' - Android landscape is a documented v1.6.0 non-goal): $invalid_android"
                    exit 1
                  fi
                  if [ "$android_count" -gt 0 ] && [ "$CAPTURE_MODE" != 'direct' ]; then
                    echo "::error::capture-manifest has Android entries but capture-mode is 'flows'; Android capture requires capture-mode: direct."
                    exit 1
                  fi
                  # Two entries that slugify to the same device slug (not just
                  # two byte-identical device strings) collide on the same
                  # raw-screenshots-<platform>-<device-slug> artifact name,
                  # and upload-artifact requires unique names within a run.
                  # Slug here exactly as the capture actions do; uniqueness is
                  # per platform because the artifact name is
                  # platform-prefixed.
                  for pair in "ios:$ios_entries" "android:$android_entries"; do
                    platform="${pair%%:*}"
                    entries="${pair#*:}"
                    duplicate_slugs=$(jq -r '
                        [.[] | .device | ascii_downcase | gsub("[^a-z0-9]+"; "-") | gsub("^-+|-+$"; "")]
                        | group_by(.) | map(select(length > 1)[0]) | join(", ")
                    ' <<< "$entries")
                    if [ -n "$duplicate_slugs" ]; then
                      echo "::error::capture-manifest has $platform device entries that slugify to the same value ($duplicate_slugs); each device's slug must be unique per platform because the raw-screenshots-$platform-<device-slug> artifact name is derived from it."
                      exit 1
                    fi
                    empty_slugs=$(jq -r '[.[] | .device | ascii_downcase | gsub("[^a-z0-9]+"; "-") | gsub("^-+|-+$"; "") | select(. == "")] | length' <<< "$entries")
                    if [ "$empty_slugs" -gt 0 ]; then
                      echo "::error::capture-manifest has $platform device entries that slugify to an empty string."
                      exit 1
                    fi
                  done
                  if [ "$ios_count" -gt 0 ]; then
                    if [ -z "$IOS_TARGET" ]; then
                      echo "::error::capture-manifest has iOS entries but ios-target is empty."
                      exit 1
                    fi
                    ios_target_ok=$(jq -r '
                        (type == "object")
                        and ((.name // "") | type == "string" and . != "")
                        and ((.appDir // "") | type == "string" and . != "")
                        and ((.appId // "") | type == "string" and . != "")
                        and ((.workspace // "") | type == "string" and . != "")
                        and ((.scheme // "") | type == "string" and . != "")
                        and ((.prebuildCommand // "") | type == "string")
                    ' <<< "$IOS_TARGET" 2>/dev/null || echo false)
                    if [ "$ios_target_ok" != 'true' ]; then
                      echo "::error::ios-target must be a JSON object with non-empty string 'name', 'appDir', 'appId', 'workspace', 'scheme' (and an optional string 'prebuildCommand')."
                      exit 1
                    fi
                  fi
                  if [ "$android_count" -gt 0 ]; then
                    if [ -z "$ANDROID_TARGET" ]; then
                      echo "::error::capture-manifest has Android entries but android-target is empty."
                      exit 1
                    fi
                    android_target_ok=$(jq -r '
                        (type == "object")
                        and ((.name // "") | type == "string" and . != "")
                        and ((.appDir // "") | type == "string" and . != "")
                        and ((.appId // "") | type == "string" and . != "")
                        and ((.prebuildCommand // "") | type == "string")
                    ' <<< "$ANDROID_TARGET" 2>/dev/null || echo false)
                    if [ "$android_target_ok" != 'true' ]; then
                      echo "::error::android-target must be a JSON object with non-empty string 'name', 'appDir', 'appId' (and an optional string 'prebuildCommand')."
                      exit 1
                    fi
                  fi
                  if [ "$CAPTURE_MODE" = 'direct' ]; then
                    if ! jq empty <<< "$CAPTURE_SCENES" 2>/dev/null; then
                      echo "::error::capture-scenes is not valid JSON."
                      exit 1
                    fi
                    if [ "$(jq 'type' <<< "$CAPTURE_SCENES")" != '"array"' ]; then
                      echo "::error::capture-scenes must be a JSON array."
                      exit 1
                    fi
                    if [ "$(jq 'length' <<< "$CAPTURE_SCENES")" -lt 1 ]; then
                      echo "::error::capture-scenes must have at least one entry."
                      exit 1
                    fi
                    non_object_scenes=$(jq -c '[.[] | select(type != "object")]' <<< "$CAPTURE_SCENES")
                    if [ "$non_object_scenes" != '[]' ]; then
                      echo "::error::capture-scenes has non-object entries: $non_object_scenes"
                      exit 1
                    fi
                    invalid_scenes=$(jq -c '
                        [.[] | select(
                            ((.name // "") | (type != "string") or (test("^[A-Za-z0-9_-]+$") | not)) or
                            (([has("deepLink"), has("flow")] | map(select(.)) | length) != 1) or
                            (has("deepLink") and ((.deepLink | type) != "string" or .deepLink == "")) or
                            (has("flow") and ((.flow | type) != "string" or .flow == "" or (.flow | startswith("/")) or ((.flow | split("/")) | any(. == "..")))) or
                            (has("settleSeconds") and ((.settleSeconds | type) != "number" or (.settleSeconds | floor) != .settleSeconds or .settleSeconds < 0 or .settleSeconds > 120)) or
                            (has("platforms") and ((.platforms | type) != "array" or (.platforms | length) == 0 or any(.platforms[]; . != "ios" and . != "android"))) or
                            (has("locales") and ((.locales | type) != "array" or (.locales | length) == 0 or any(.locales[]; (type != "string") or (test("^[A-Za-z0-9_-]+$") | not)))) or
                            (has("appearances") and ((.appearances | type) != "array" or (.appearances | length) == 0 or any(.appearances[]; . != "light" and . != "dark")))
                        )]
                    ' <<< "$CAPTURE_SCENES")
                    if [ "$invalid_scenes" != '[]' ]; then
                      echo "::error::capture-scenes has invalid entries (each needs a unique 'name' matching ^[A-Za-z0-9_-]+\$, exactly one of a non-empty 'deepLink' or a screenshots-dir-relative 'flow' without '..' segments, optional integer 'settleSeconds' 0-120, optional non-empty 'platforms' subset of [\"ios\",\"android\"], optional non-empty 'locales' of ^[A-Za-z0-9_-]+\$ strings, optional non-empty 'appearances' subset of [\"light\",\"dark\"]): $invalid_scenes"
                      exit 1
                    fi
                    duplicate_scene_names=$(jq -r '[.[].name] | group_by(.) | map(select(length > 1)[0]) | join(", ")' <<< "$CAPTURE_SCENES")
                    if [ -n "$duplicate_scene_names" ]; then
                      echo "::error::capture-scenes has duplicate scene names ($duplicate_scene_names); each name is an output path segment and must be unique."
                      exit 1
                    fi
                    for pair in "ios:$ios_count" "android:$android_count"; do
                      platform="${pair%%:*}"
                      count="${pair#*:}"
                      if [ "$count" -gt 0 ]; then
                        covered=$(jq -r --arg p "$platform" 'any(.[]; (has("platforms") | not) or ((.platforms | index($p)) != null))' <<< "$CAPTURE_SCENES")
                        if [ "$covered" != 'true' ]; then
                          echo "::error::capture-manifest has $platform entries but no scene in capture-scenes applies to platform '$platform' - every scene's platforms filter excludes it."
                          exit 1
                        fi
                      fi
                    done
                    has_flow_scene=$(jq -r 'any(.[]; has("flow"))' <<< "$CAPTURE_SCENES")
                    if [ "$has_flow_scene" = 'true' ] && [ -z "$SCREENSHOTS_DIR" ]; then
                      echo "::error::screenshots-dir is required because at least one capture-scenes entry declares a flow."
                      exit 1
                    fi
                  fi
                  has_ios=false
                  if [ "$ios_count" -gt 0 ]; then
                    has_ios=true
                  fi
                  has_android=false
                  if [ "$android_count" -gt 0 ]; then
                    has_android=true
                  fi
                  {
                    echo "has-ios=$has_ios"
                    echo "has-android=$has_android"
                    echo "ios-entries=$ios_entries"
                    echo "android-entries=$android_entries"
                  } >> "$GITHUB_OUTPUT"
                  echo "capture-manifest OK: $ios_count iOS + $android_count Android entries, capture-mode=$CAPTURE_MODE."

    build-ios:
        name: Build iOS (${{ needs.validate-manifest.outputs.ios-target != '' && fromJSON(needs.validate-manifest.outputs.ios-target).name || 'skipped' }})
        needs: validate-manifest
        if: needs.validate-manifest.outputs.has-ios == 'true'
        runs-on: ${{ fromJSON(inputs.build-runner-labels != '' && inputs.build-runner-labels || inputs.runner-labels) }}
        timeout-minutes: ${{ inputs.build-timeout-minutes }}
        env:
            APP_DIR: ${{ fromJSON(needs.validate-manifest.outputs.ios-target).appDir }}
            IOS_DERIVED_DATA: ${{ github.workspace }}/.ci-cache/DerivedData/${{ fromJSON(needs.validate-manifest.outputs.ios-target).name }}
            CCACHE_DIR: ${{ github.workspace }}/.ci-cache/ccache/ios-${{ fromJSON(needs.validate-manifest.outputs.ios-target).name }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - name: Apply build-env
              if: needs.validate-manifest.outputs.build-env != ''
              shell: bash
              env:
                  BUILD_ENV: ${{ needs.validate-manifest.outputs.build-env }}
              run: |
                  set -euo pipefail
                  while IFS= read -r line; do
                    [ -z "$line" ] && continue
                    case "$line" in
                      *=*) ;;
                      *)
                        echo "::error::build-env line '$line' is missing '='; expected KEY=VALUE."
                        exit 1
                        ;;
                    esac
                    name="${line%%=*}"
                    case "$name" in
                      ''|[!A-Za-z_]*)
                        echo "::error::build-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    case "$name" in
                      *[!A-Za-z0-9_]*)
                        echo "::error::build-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    echo "$line" >> "$GITHUB_ENV"
                  done <<< "$BUILD_ENV"

            - name: Resolve package manager
              id: package-manager
              shell: bash
              env:
                  PACKAGE_MANAGER: ${{ inputs.package-manager }}
                  LOCKFILE_REQUIRED: 'true'
              run: |
                  set -euo pipefail
                  pm=''
                  case "$PACKAGE_MANAGER" in
                    '') ;;
                    yarn|pnpm|npm) pm="$PACKAGE_MANAGER" ;;
                    *)
                      echo "::error::package-manager must be '' (auto-detect), yarn, pnpm or npm; got '$PACKAGE_MANAGER'."
                      exit 1
                      ;;
                  esac
                  declared=''
                  declared_version=''
                  if { [ -z "$pm" ] || [ "$pm" = pnpm ]; } && [ -f package.json ]; then
                    if command -v jq >/dev/null 2>&1; then
                      declared_spec="$(jq -r '
                        (try (.devEngines.packageManager) catch null) as $raw
                        | (if ($raw | type) == "array" then ($raw[0] // null) else $raw end) as $de
                        | (if ($de | type) == "object" then [($de.name // ""), ($de.version // "")] else ["", ""] end) as $dev
                        | (if ((.packageManager // "") | type) == "string" and (.packageManager // "") != ""
                           then (.packageManager | if test("@") then [split("@")[0], (split("@")[1] | split("+")[0])] else [., ""] end)
                           else ["", ""] end) as $spec
                        | (if $dev[0] != "" then $dev[0] else $spec[0] end) as $name
                        | [$name,
                           (if $dev[0] != "" and $dev[1] != "" then $dev[1]
                            elif $spec[0] == $name then $spec[1]
                            else "" end)]
                        | @tsv' package.json)"
                      declared="$(printf '%s\n' "$declared_spec" | cut -f1)"
                      declared_version="$(printf '%s\n' "$declared_spec" | cut -f2)"
                    else
                      echo "::warning::jq is not installed on this runner, so package.json's packageManager / devEngines.packageManager fields cannot be read; falling back to root lockfile detection. Install jq, or set the package-manager input explicitly."
                    fi
                  fi
                  if [ -z "$pm" ] && [ -n "$declared" ]; then
                    case "$declared" in
                      yarn|pnpm|npm) pm="$declared" ;;
                      *)
                        echo "::error::package.json declares package manager '$declared', which is not yarn, pnpm or npm; set the package-manager input explicitly."
                        exit 1
                        ;;
                    esac
                  fi
                  if [ -z "$pm" ]; then
                    lockfiles=''
                    lockfile_count=0
                    if [ -f yarn.lock ]; then pm=yarn; lockfiles="${lockfiles}yarn.lock "; lockfile_count=$((lockfile_count + 1)); fi
                    if [ -f pnpm-lock.yaml ]; then pm=pnpm; lockfiles="${lockfiles}pnpm-lock.yaml "; lockfile_count=$((lockfile_count + 1)); fi
                    if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
                      pm=npm
                      lockfile_count=$((lockfile_count + 1))
                      if [ -f package-lock.json ]; then lockfiles="${lockfiles}package-lock.json "; fi
                      if [ -f npm-shrinkwrap.json ]; then lockfiles="${lockfiles}npm-shrinkwrap.json "; fi
                    fi
                    if [ "$lockfile_count" -eq 0 ]; then
                      echo "::error::Cannot resolve the package manager: package.json declares none and there is no yarn.lock, pnpm-lock.yaml, package-lock.json or npm-shrinkwrap.json at the repository root. Set the package-manager input explicitly."
                      exit 1
                    fi
                    if [ "$lockfile_count" -gt 1 ]; then
                      echo "::error::Cannot resolve the package manager: multiple root lockfiles found (${lockfiles% }). Set the package-manager input explicitly."
                      exit 1
                    fi
                  fi
                  if [ "$pm" = pnpm ] && { [ "$declared" != pnpm ] || [ -z "$declared_version" ]; }; then
                    echo "::error::Resolved package manager is pnpm, but no pnpm version is readable from the repository-root package.json. pnpm/action-setup takes the version from 'packageManager: pnpm@<version>' or 'devEngines.packageManager: {name: pnpm, version: <range>}' - add one of those, and make sure jq is installed on this runner so the workflow can read it."
                    exit 1
                  fi
                  if [ -n "$LOCKFILE_REQUIRED" ]; then
                    case "$pm" in
                      yarn) wanted='yarn.lock' ;;
                      pnpm) wanted='pnpm-lock.yaml' ;;
                      *) wanted='package-lock.json npm-shrinkwrap.json' ;;
                    esac
                    found=''
                    for candidate in $wanted; do
                      if [ -f "$candidate" ]; then found="$candidate"; break; fi
                    done
                    if [ -z "$found" ]; then
                      echo "::error::Resolved package manager is $pm, but this job caches JS dependencies with actions/setup-node and the repository root has none of: $wanted. Commit the lockfile, or set the package-manager input to the manager whose lockfile this repository actually has."
                      exit 1
                    fi
                  fi
                  echo "Resolved package manager: $pm"
                  echo "pm=$pm" >> "$GITHUB_OUTPUT"

            - name: Setup pnpm
              if: steps.package-manager.outputs.pm == 'pnpm'
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - name: Setup Node
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ inputs.node-version }}
                  cache: ${{ steps.package-manager.outputs.pm }}

            - name: Enable corepack
              if: inputs.enable-corepack && steps.package-manager.outputs.pm != 'pnpm'
              shell: bash
              run: corepack enable

            - name: Install dependencies
              shell: bash
              env:
                  INSTALL_COMMAND: ${{ needs.validate-manifest.outputs.install-command }}
              run: eval "$INSTALL_COMMAND"

            - name: setup-xcode-pinned
              id: xcode
              uses: rnw-community/mobile-ci/actions/setup-xcode-pinned@v1.11.0 # v1.11.0
              with:
                  version: ${{ inputs.xcode-version }}
                  build: ${{ inputs.xcode-build }}

            - name: Build workspace JS dependencies
              if: needs.validate-manifest.outputs.build-command != ''
              shell: bash
              env:
                  BUILD_COMMAND: ${{ needs.validate-manifest.outputs.build-command }}
              run: eval "$BUILD_COMMAND"

            - name: Generate native project
              if: fromJSON(needs.validate-manifest.outputs.ios-target).prebuildCommand != ''
              working-directory: ${{ fromJSON(needs.validate-manifest.outputs.ios-target).appDir }}
              shell: bash
              env:
                  PREBUILD_COMMAND: ${{ fromJSON(needs.validate-manifest.outputs.ios-target).prebuildCommand }}
                  RCT_USE_PREBUILT_RNCORE_ENABLED: ${{ needs.validate-manifest.outputs.rct-use-prebuilt-rncore }}
                  RCT_USE_RN_DEP_ENABLED: ${{ needs.validate-manifest.outputs.rct-use-rn-dep }}
                  EXPO_USE_PRECOMPILED_MODULES_ENABLED: ${{ inputs.expo-use-precompiled-modules }}
              run: |
                  if [ "$RCT_USE_PREBUILT_RNCORE_ENABLED" = 'true' ]; then
                    export RCT_USE_PREBUILT_RNCORE=1
                  fi
                  if [ "$RCT_USE_RN_DEP_ENABLED" = 'true' ]; then
                    export RCT_USE_RN_DEP=1
                  fi
                  if [ "$EXPO_USE_PRECOMPILED_MODULES_ENABLED" = 'true' ]; then
                    export EXPO_USE_PRECOMPILED_MODULES=1
                  fi
                  eval "$PREBUILD_COMMAND"

            - name: native-fingerprint
              id: fingerprint
              uses: rnw-community/mobile-ci/actions/native-fingerprint@v1.11.0 # v1.11.0
              with:
                  platform: ios
                  working-directory: ${{ fromJSON(needs.validate-manifest.outputs.ios-target).appDir }}
                  fingerprint-version: ${{ inputs.expo-fingerprint-version }}

            - name: native-app-cache (restore)
              id: native-app-cache
              uses: rnw-community/mobile-ci/actions/native-app-cache@v1.11.0 # v1.11.0
              with:
                  mode: restore
                  path: .ci-cache/ios-native-app/${{ fromJSON(needs.validate-manifest.outputs.ios-target).name }}
                  profile: ${{ needs.validate-manifest.outputs.cache-profile }}-${{ fromJSON(needs.validate-manifest.outputs.ios-target).name }}
                  arch: arm64
                  toolchain: ${{ steps.xcode.outputs.toolchain-key }}
                  fingerprint: ${{ steps.fingerprint.outputs.hash }}

            - name: Repack fresh JS into cached native app
              id: repack
              if: needs.validate-manifest.outputs.repack-on-hit == 'true' && steps.native-app-cache.outputs.cache-hit == 'true'
              continue-on-error: true
              uses: rnw-community/mobile-ci/actions/repack-app@v1.11.0 # v1.11.0
              with:
                  platform: ios
                  app-path: .ci-cache/ios-native-app/${{ fromJSON(needs.validate-manifest.outputs.ios-target).name }}/Base.app
                  app-id: ${{ fromJSON(needs.validate-manifest.outputs.ios-target).appId }}
                  app-dir: ${{ fromJSON(needs.validate-manifest.outputs.ios-target).appDir }}
                  repack-version: ${{ inputs.repack-app-version }}

            - name: Determine whether a native build is needed
              id: build-decision
              shell: bash
              env:
                  CACHE_HIT: ${{ steps.native-app-cache.outputs.cache-hit }}
                  REPACK_ON_HIT: ${{ needs.validate-manifest.outputs.repack-on-hit }}
                  REPACK_OUTCOME: ${{ steps.repack.outcome }}
              run: |
                  set -euo pipefail
                  need_build=true
                  if [ "$CACHE_HIT" = "true" ] && { [ "$REPACK_ON_HIT" != "true" ] || [ "$REPACK_OUTCOME" = "success" ]; }; then
                    need_build=false
                  fi
                  echo "need-build=$need_build" >> "$GITHUB_OUTPUT"

            - name: Report cache hit
              if: steps.native-app-cache.outputs.cache-hit == 'true' && steps.build-decision.outputs.need-build != 'true'
              shell: bash
              env:
                  TARGET_NAME: ${{ fromJSON(needs.validate-manifest.outputs.ios-target).name }}
                  REPACK_ON_HIT: ${{ needs.validate-manifest.outputs.repack-on-hit }}
              run: |
                  {
                    echo "### iOS build: ${TARGET_NAME} (warm — native build skipped)"
                    if [ "$REPACK_ON_HIT" = "true" ]; then
                      echo "Native fingerprint hit; repack-app injected a fresh JS bundle into the cached shell."
                    else
                      echo "Native fingerprint hit; embedded JS bundle dates from when this shell was cached."
                    fi
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Report repack fallback
              if: steps.native-app-cache.outputs.cache-hit == 'true' && steps.build-decision.outputs.need-build == 'true'
              shell: bash
              env:
                  TARGET_NAME: ${{ fromJSON(needs.validate-manifest.outputs.ios-target).name }}
              run: |
                  echo "### iOS build: ${TARGET_NAME} (repack-on-hit failed — falling back to a full native build)" >> "$GITHUB_STEP_SUMMARY"

            - name: Clean stale app before native build
              if: steps.build-decision.outputs.need-build == 'true'
              shell: bash
              env:
                  APP_PATH: .ci-cache/ios-native-app/${{ fromJSON(needs.validate-manifest.outputs.ios-target).name }}/Base.app
              run: rm -rf "$APP_PATH"

            - name: setup-ccache-ios (restore)
              if: steps.build-decision.outputs.need-build == 'true'
              uses: rnw-community/mobile-ci/actions/setup-ccache-ios@v1.11.0 # v1.11.0
              with:
                  mode: restore
                  ccache-dir: ${{ env.CCACHE_DIR }}
                  derived-data-dir: ${{ env.IOS_DERIVED_DATA }}
                  max-size: ${{ inputs.ccache-max-size }}
                  key: ccache-ios-${{ fromJSON(needs.validate-manifest.outputs.ios-target).name }}-${{ runner.os }}-xcode-${{ inputs.xcode-version }}-${{ hashFiles('yarn.lock', 'pnpm-lock.yaml', 'package-lock.json', 'npm-shrinkwrap.json', format('{0}/ios/Podfile.lock', fromJSON(needs.validate-manifest.outputs.ios-target).appDir)) }}
                  restore-keys: |
                      ccache-ios-${{ fromJSON(needs.validate-manifest.outputs.ios-target).name }}-${{ runner.os }}-xcode-${{ inputs.xcode-version }}-
                      ccache-ios-${{ fromJSON(needs.validate-manifest.outputs.ios-target).name }}-${{ runner.os }}-

            - name: build-ios-app
              if: steps.build-decision.outputs.need-build == 'true'
              uses: rnw-community/mobile-ci/actions/build-ios-app@v1.11.0 # v1.11.0
              with:
                  app-dir: ${{ fromJSON(needs.validate-manifest.outputs.ios-target).appDir }}
                  workspace: ${{ fromJSON(needs.validate-manifest.outputs.ios-target).workspace }}
                  scheme: ${{ fromJSON(needs.validate-manifest.outputs.ios-target).scheme }}
                  derived-data-dir: ${{ env.IOS_DERIVED_DATA }}
                  output-dir: .ci-cache/ios-native-app/${{ fromJSON(needs.validate-manifest.outputs.ios-target).name }}
                  pods-cache-key: pods-${{ fromJSON(needs.validate-manifest.outputs.ios-target).name }}-${{ runner.os }}-xcode-${{ inputs.xcode-version }}-${{ hashFiles('yarn.lock', 'pnpm-lock.yaml', 'package-lock.json', 'npm-shrinkwrap.json', format('{0}/ios/Podfile.lock', fromJSON(needs.validate-manifest.outputs.ios-target).appDir)) }}
                  pods-cache-restore-keys: |
                      pods-${{ fromJSON(needs.validate-manifest.outputs.ios-target).name }}-${{ runner.os }}-xcode-${{ inputs.xcode-version }}-
                      pods-${{ fromJSON(needs.validate-manifest.outputs.ios-target).name }}-${{ runner.os }}-
                  rct-use-prebuilt-rncore: ${{ needs.validate-manifest.outputs.rct-use-prebuilt-rncore }}
                  rct-use-rn-dep: ${{ needs.validate-manifest.outputs.rct-use-rn-dep }}
                  expo-use-precompiled-modules: ${{ inputs.expo-use-precompiled-modules }}

            - name: setup-ccache-ios (save)
              if: steps.build-decision.outputs.need-build == 'true'
              uses: rnw-community/mobile-ci/actions/setup-ccache-ios@v1.11.0 # v1.11.0
              with:
                  mode: save
                  ccache-dir: ${{ env.CCACHE_DIR }}
                  key: ccache-ios-${{ fromJSON(needs.validate-manifest.outputs.ios-target).name }}-${{ runner.os }}-xcode-${{ inputs.xcode-version }}-${{ hashFiles('yarn.lock', 'pnpm-lock.yaml', 'package-lock.json', 'npm-shrinkwrap.json', format('{0}/ios/Podfile.lock', fromJSON(needs.validate-manifest.outputs.ios-target).appDir)) }}

            - name: native-app-cache (save)
              if: steps.native-app-cache.outputs.cache-hit != 'true'
              uses: rnw-community/mobile-ci/actions/native-app-cache@v1.11.0 # v1.11.0
              with:
                  mode: save
                  path: .ci-cache/ios-native-app/${{ fromJSON(needs.validate-manifest.outputs.ios-target).name }}
                  profile: ${{ needs.validate-manifest.outputs.cache-profile }}-${{ fromJSON(needs.validate-manifest.outputs.ios-target).name }}
                  arch: arm64
                  toolchain: ${{ steps.xcode.outputs.toolchain-key }}
                  fingerprint: ${{ steps.fingerprint.outputs.hash }}

            - name: Archive app for the capture job
              shell: bash
              env:
                  TARGET_NAME: ${{ fromJSON(needs.validate-manifest.outputs.ios-target).name }}
              run: |
                  set -euo pipefail
                  test -d ".ci-cache/ios-native-app/${TARGET_NAME}/Base.app"
                  mkdir -p .ci-artifacts
                  tar -czf ".ci-artifacts/store-screenshots-app-${TARGET_NAME}.tar.gz" -C ".ci-cache/ios-native-app/${TARGET_NAME}" Base.app

            - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: store-screenshots-app-${{ fromJSON(needs.validate-manifest.outputs.ios-target).name }}
                  path: .ci-artifacts/store-screenshots-app-${{ fromJSON(needs.validate-manifest.outputs.ios-target).name }}.tar.gz
                  retention-days: 1

    build-android:
        name: Build Android (${{ needs.validate-manifest.outputs.android-target != '' && fromJSON(needs.validate-manifest.outputs.android-target).name || 'skipped' }})
        needs: validate-manifest
        if: needs.validate-manifest.outputs.has-android == 'true'
        runs-on: ${{ fromJSON(inputs.android-build-runner-labels != '' && inputs.android-build-runner-labels || (inputs.build-runner-labels != '' && inputs.build-runner-labels || inputs.runner-labels)) }}
        timeout-minutes: ${{ inputs.android-build-timeout-minutes }}
        env:
            APP_DIR: ${{ fromJSON(needs.validate-manifest.outputs.android-target).appDir }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - name: Apply build-env
              if: needs.validate-manifest.outputs.build-env != ''
              shell: bash
              env:
                  BUILD_ENV: ${{ needs.validate-manifest.outputs.build-env }}
              run: |
                  set -euo pipefail
                  while IFS= read -r line; do
                    [ -z "$line" ] && continue
                    case "$line" in
                      *=*) ;;
                      *)
                        echo "::error::build-env line '$line' is missing '='; expected KEY=VALUE."
                        exit 1
                        ;;
                    esac
                    name="${line%%=*}"
                    case "$name" in
                      ''|[!A-Za-z_]*)
                        echo "::error::build-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    case "$name" in
                      *[!A-Za-z0-9_]*)
                        echo "::error::build-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    echo "$line" >> "$GITHUB_ENV"
                  done <<< "$BUILD_ENV"

            - name: Resolve package manager
              id: package-manager
              shell: bash
              env:
                  PACKAGE_MANAGER: ${{ inputs.package-manager }}
                  LOCKFILE_REQUIRED: 'true'
              run: |
                  set -euo pipefail
                  pm=''
                  case "$PACKAGE_MANAGER" in
                    '') ;;
                    yarn|pnpm|npm) pm="$PACKAGE_MANAGER" ;;
                    *)
                      echo "::error::package-manager must be '' (auto-detect), yarn, pnpm or npm; got '$PACKAGE_MANAGER'."
                      exit 1
                      ;;
                  esac
                  declared=''
                  declared_version=''
                  if { [ -z "$pm" ] || [ "$pm" = pnpm ]; } && [ -f package.json ]; then
                    if command -v jq >/dev/null 2>&1; then
                      declared_spec="$(jq -r '
                        (try (.devEngines.packageManager) catch null) as $raw
                        | (if ($raw | type) == "array" then ($raw[0] // null) else $raw end) as $de
                        | (if ($de | type) == "object" then [($de.name // ""), ($de.version // "")] else ["", ""] end) as $dev
                        | (if ((.packageManager // "") | type) == "string" and (.packageManager // "") != ""
                           then (.packageManager | if test("@") then [split("@")[0], (split("@")[1] | split("+")[0])] else [., ""] end)
                           else ["", ""] end) as $spec
                        | (if $dev[0] != "" then $dev[0] else $spec[0] end) as $name
                        | [$name,
                           (if $dev[0] != "" and $dev[1] != "" then $dev[1]
                            elif $spec[0] == $name then $spec[1]
                            else "" end)]
                        | @tsv' package.json)"
                      declared="$(printf '%s\n' "$declared_spec" | cut -f1)"
                      declared_version="$(printf '%s\n' "$declared_spec" | cut -f2)"
                    else
                      echo "::warning::jq is not installed on this runner, so package.json's packageManager / devEngines.packageManager fields cannot be read; falling back to root lockfile detection. Install jq, or set the package-manager input explicitly."
                    fi
                  fi
                  if [ -z "$pm" ] && [ -n "$declared" ]; then
                    case "$declared" in
                      yarn|pnpm|npm) pm="$declared" ;;
                      *)
                        echo "::error::package.json declares package manager '$declared', which is not yarn, pnpm or npm; set the package-manager input explicitly."
                        exit 1
                        ;;
                    esac
                  fi
                  if [ -z "$pm" ]; then
                    lockfiles=''
                    lockfile_count=0
                    if [ -f yarn.lock ]; then pm=yarn; lockfiles="${lockfiles}yarn.lock "; lockfile_count=$((lockfile_count + 1)); fi
                    if [ -f pnpm-lock.yaml ]; then pm=pnpm; lockfiles="${lockfiles}pnpm-lock.yaml "; lockfile_count=$((lockfile_count + 1)); fi
                    if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
                      pm=npm
                      lockfile_count=$((lockfile_count + 1))
                      if [ -f package-lock.json ]; then lockfiles="${lockfiles}package-lock.json "; fi
                      if [ -f npm-shrinkwrap.json ]; then lockfiles="${lockfiles}npm-shrinkwrap.json "; fi
                    fi
                    if [ "$lockfile_count" -eq 0 ]; then
                      echo "::error::Cannot resolve the package manager: package.json declares none and there is no yarn.lock, pnpm-lock.yaml, package-lock.json or npm-shrinkwrap.json at the repository root. Set the package-manager input explicitly."
                      exit 1
                    fi
                    if [ "$lockfile_count" -gt 1 ]; then
                      echo "::error::Cannot resolve the package manager: multiple root lockfiles found (${lockfiles% }). Set the package-manager input explicitly."
                      exit 1
                    fi
                  fi
                  if [ "$pm" = pnpm ] && { [ "$declared" != pnpm ] || [ -z "$declared_version" ]; }; then
                    echo "::error::Resolved package manager is pnpm, but no pnpm version is readable from the repository-root package.json. pnpm/action-setup takes the version from 'packageManager: pnpm@<version>' or 'devEngines.packageManager: {name: pnpm, version: <range>}' - add one of those, and make sure jq is installed on this runner so the workflow can read it."
                    exit 1
                  fi
                  if [ -n "$LOCKFILE_REQUIRED" ]; then
                    case "$pm" in
                      yarn) wanted='yarn.lock' ;;
                      pnpm) wanted='pnpm-lock.yaml' ;;
                      *) wanted='package-lock.json npm-shrinkwrap.json' ;;
                    esac
                    found=''
                    for candidate in $wanted; do
                      if [ -f "$candidate" ]; then found="$candidate"; break; fi
                    done
                    if [ -z "$found" ]; then
                      echo "::error::Resolved package manager is $pm, but this job caches JS dependencies with actions/setup-node and the repository root has none of: $wanted. Commit the lockfile, or set the package-manager input to the manager whose lockfile this repository actually has."
                      exit 1
                    fi
                  fi
                  echo "Resolved package manager: $pm"
                  echo "pm=$pm" >> "$GITHUB_OUTPUT"

            - name: Setup pnpm
              if: steps.package-manager.outputs.pm == 'pnpm'
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - name: Setup Node
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ inputs.node-version }}
                  cache: ${{ steps.package-manager.outputs.pm }}

            - name: Enable corepack
              if: inputs.enable-corepack && steps.package-manager.outputs.pm != 'pnpm'
              shell: bash
              run: corepack enable

            - name: Install dependencies
              shell: bash
              env:
                  INSTALL_COMMAND: ${{ needs.validate-manifest.outputs.install-command }}
              run: eval "$INSTALL_COMMAND"

            - name: Build workspace JS dependencies
              if: needs.validate-manifest.outputs.build-command != ''
              shell: bash
              env:
                  BUILD_COMMAND: ${{ needs.validate-manifest.outputs.build-command }}
              run: eval "$BUILD_COMMAND"

            - name: Generate native project
              if: fromJSON(needs.validate-manifest.outputs.android-target).prebuildCommand != ''
              working-directory: ${{ fromJSON(needs.validate-manifest.outputs.android-target).appDir }}
              shell: bash
              env:
                  PREBUILD_COMMAND: ${{ fromJSON(needs.validate-manifest.outputs.android-target).prebuildCommand }}
              run: eval "$PREBUILD_COMMAND"

            - name: native-fingerprint
              id: fingerprint
              uses: rnw-community/mobile-ci/actions/native-fingerprint@v1.11.0 # v1.11.0
              with:
                  platform: android
                  working-directory: ${{ fromJSON(needs.validate-manifest.outputs.android-target).appDir }}
                  fingerprint-version: ${{ inputs.expo-fingerprint-version }}

            - name: native-app-cache (restore)
              id: native-app-cache
              uses: rnw-community/mobile-ci/actions/native-app-cache@v1.11.0 # v1.11.0
              with:
                  mode: restore
                  path: .ci-cache/android-native-app/${{ fromJSON(needs.validate-manifest.outputs.android-target).name }}
                  profile: ${{ needs.validate-manifest.outputs.android-cache-profile }}-${{ fromJSON(needs.validate-manifest.outputs.android-target).name }}-${{ needs.validate-manifest.outputs.android-gradle-task }}${{ needs.validate-manifest.outputs.android-gradle-args != '' && format('-{0}', needs.validate-manifest.outputs.android-gradle-args) || '' }}
                  arch: arm64
                  toolchain: cmdline-${{ inputs.android-cmdline-tools-version }}
                  fingerprint: ${{ steps.fingerprint.outputs.hash }}

            - name: Set up Android SDK (for repack-app validation)
              if: needs.validate-manifest.outputs.repack-on-hit == 'true' && steps.native-app-cache.outputs.cache-hit == 'true'
              continue-on-error: true
              uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
              with:
                  cmdline-tools-version: ${{ inputs.android-cmdline-tools-version }}
                  packages: platform-tools build-tools;${{ inputs.android-build-tools-version }}

            - name: Repack fresh JS into cached native app
              id: repack
              if: needs.validate-manifest.outputs.repack-on-hit == 'true' && steps.native-app-cache.outputs.cache-hit == 'true'
              continue-on-error: true
              uses: rnw-community/mobile-ci/actions/repack-app@v1.11.0 # v1.11.0
              with:
                  platform: android
                  app-path: .ci-cache/android-native-app/${{ fromJSON(needs.validate-manifest.outputs.android-target).name }}/app-release.apk
                  app-id: ${{ fromJSON(needs.validate-manifest.outputs.android-target).appId }}
                  app-dir: ${{ fromJSON(needs.validate-manifest.outputs.android-target).appDir }}
                  repack-version: ${{ inputs.repack-app-version }}
                  android-build-tools-dir: ${{ inputs.android-build-tools-dir }}

            - name: Determine whether a native build is needed
              id: build-decision
              shell: bash
              env:
                  CACHE_HIT: ${{ steps.native-app-cache.outputs.cache-hit }}
                  REPACK_ON_HIT: ${{ needs.validate-manifest.outputs.repack-on-hit }}
                  REPACK_OUTCOME: ${{ steps.repack.outcome }}
              run: |
                  set -euo pipefail
                  need_build=true
                  if [ "$CACHE_HIT" = "true" ] && { [ "$REPACK_ON_HIT" != "true" ] || [ "$REPACK_OUTCOME" = "success" ]; }; then
                    need_build=false
                  fi
                  echo "need-build=$need_build" >> "$GITHUB_OUTPUT"

            - name: Report cache hit
              if: steps.native-app-cache.outputs.cache-hit == 'true' && steps.build-decision.outputs.need-build != 'true'
              shell: bash
              env:
                  TARGET_NAME: ${{ fromJSON(needs.validate-manifest.outputs.android-target).name }}
                  REPACK_ON_HIT: ${{ needs.validate-manifest.outputs.repack-on-hit }}
              run: |
                  {
                    echo "### Android build: ${TARGET_NAME} (warm — native build skipped)"
                    if [ "$REPACK_ON_HIT" = "true" ]; then
                      echo "Native fingerprint hit; repack-app injected a fresh JS bundle into the cached shell."
                    else
                      echo "Native fingerprint hit; embedded JS bundle dates from when this shell was cached."
                    fi
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Report repack fallback
              if: steps.native-app-cache.outputs.cache-hit == 'true' && steps.build-decision.outputs.need-build == 'true'
              shell: bash
              env:
                  TARGET_NAME: ${{ fromJSON(needs.validate-manifest.outputs.android-target).name }}
              run: |
                  echo "### Android build: ${TARGET_NAME} (repack-on-hit failed — falling back to a full native build)" >> "$GITHUB_STEP_SUMMARY"

            - name: build-android-app
              if: steps.build-decision.outputs.need-build == 'true'
              uses: rnw-community/mobile-ci/actions/build-android-app@v1.11.0 # v1.11.0
              with:
                  app-dir: ${{ fromJSON(needs.validate-manifest.outputs.android-target).appDir }}
                  cmdline-tools-version: ${{ inputs.android-cmdline-tools-version }}
                  gradle-task: ${{ needs.validate-manifest.outputs.android-gradle-task }}
                  gradle-args: ${{ needs.validate-manifest.outputs.android-gradle-args }}
                  output-dir: .ci-cache/android-native-app/${{ fromJSON(needs.validate-manifest.outputs.android-target).name }}
                  gradle-cache-key: gradle-${{ fromJSON(needs.validate-manifest.outputs.android-target).name }}-${{ runner.os }}-${{ hashFiles(format('{0}/android/gradle/wrapper/gradle-wrapper.properties', fromJSON(needs.validate-manifest.outputs.android-target).appDir), format('{0}/android/**/*.gradle*', fromJSON(needs.validate-manifest.outputs.android-target).appDir), format('{0}/package.json', fromJSON(needs.validate-manifest.outputs.android-target).appDir), 'yarn.lock', 'pnpm-lock.yaml', 'package-lock.json', 'npm-shrinkwrap.json') }}
                  gradle-cache-restore-keys: |
                      gradle-${{ fromJSON(needs.validate-manifest.outputs.android-target).name }}-${{ runner.os }}-

            - name: native-app-cache (save)
              if: steps.native-app-cache.outputs.cache-hit != 'true'
              uses: rnw-community/mobile-ci/actions/native-app-cache@v1.11.0 # v1.11.0
              with:
                  mode: save
                  path: .ci-cache/android-native-app/${{ fromJSON(needs.validate-manifest.outputs.android-target).name }}
                  profile: ${{ needs.validate-manifest.outputs.android-cache-profile }}-${{ fromJSON(needs.validate-manifest.outputs.android-target).name }}-${{ needs.validate-manifest.outputs.android-gradle-task }}${{ needs.validate-manifest.outputs.android-gradle-args != '' && format('-{0}', needs.validate-manifest.outputs.android-gradle-args) || '' }}
                  arch: arm64
                  toolchain: cmdline-${{ inputs.android-cmdline-tools-version }}
                  fingerprint: ${{ steps.fingerprint.outputs.hash }}

            - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: store-screenshots-apk-${{ fromJSON(needs.validate-manifest.outputs.android-target).name }}
                  path: .ci-cache/android-native-app/${{ fromJSON(needs.validate-manifest.outputs.android-target).name }}/app-release.apk
                  retention-days: 1

    capture-ios:
        name: Capture iOS (${{ matrix.entry.device }})
        needs: [validate-manifest, build-ios]
        if: needs.validate-manifest.outputs.has-ios == 'true'
        runs-on: ${{ fromJSON(inputs.capture-runner-labels != '' && inputs.capture-runner-labels || inputs.runner-labels) }}
        timeout-minutes: ${{ inputs.capture-timeout-minutes }}
        strategy:
            fail-fast: false
            matrix:
                entry: ${{ fromJSON(needs.validate-manifest.outputs.ios-entries) }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - name: Assert capture runner architecture matches the packaged app
              shell: bash
              run: |
                  set -euo pipefail
                  arch=$(uname -m)
                  if [ "$arch" != 'arm64' ]; then
                    echo "::error::Capture runner architecture is '$arch', but the packaged Simulator app is arm64-only. Set capture-runner-labels to an arm64 pool."
                    exit 1
                  fi

            - name: setup-xcode-pinned
              uses: rnw-community/mobile-ci/actions/setup-xcode-pinned@v1.11.0 # v1.11.0
              with:
                  version: ${{ inputs.xcode-version }}
                  build: ${{ inputs.xcode-build }}

            - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
              with:
                  name: store-screenshots-app-${{ fromJSON(needs.validate-manifest.outputs.ios-target).name }}
                  path: .ci-artifacts/store-screenshots-app-${{ fromJSON(needs.validate-manifest.outputs.ios-target).name }}

            - name: Unpack app
              shell: bash
              env:
                  TARGET_NAME: ${{ fromJSON(needs.validate-manifest.outputs.ios-target).name }}
              run: tar -xzf ".ci-artifacts/store-screenshots-app-${TARGET_NAME}/store-screenshots-app-${TARGET_NAME}.tar.gz" -C ".ci-artifacts/store-screenshots-app-${TARGET_NAME}"

            - name: capture-screenshots-ios
              id: capture
              uses: rnw-community/mobile-ci/actions/capture-screenshots-ios@v1.11.0 # v1.11.0
              with:
                  app-path: .ci-artifacts/store-screenshots-app-${{ fromJSON(needs.validate-manifest.outputs.ios-target).name }}/Base.app
                  app-id: ${{ fromJSON(needs.validate-manifest.outputs.ios-target).appId }}
                  scenes: ${{ needs.validate-manifest.outputs.capture-scenes }}
                  seed-command: ${{ needs.validate-manifest.outputs.seed-command }}
                  settle-seconds: ${{ needs.validate-manifest.outputs.settle-seconds }}
                  deeplink-confirm-title: ${{ needs.validate-manifest.outputs.deeplink-confirm-title }}
                  deeplink-confirm-button: ${{ needs.validate-manifest.outputs.deeplink-confirm-button }}
                  status-bar-override: ${{ needs.validate-manifest.outputs.status-bar-override }}
                  screenshots-dir: ${{ needs.validate-manifest.outputs.screenshots-dir }}
                  scenes-name-pattern: ${{ inputs.scenes-name-pattern }}
                  scenes-exclude-pattern: ${{ inputs.scenes-exclude-pattern }}
                  simulator-device: ${{ matrix.entry.device }}
                  locales: ${{ join(matrix.entry.locales, ',') }}
                  appearances: ${{ join(matrix.entry.appearances, ',') }}
                  orientation: ${{ matrix.entry.orientation || 'portrait' }}
                  maestro-env: ${{ needs.validate-manifest.outputs.maestro-env }}
                  locale-env: ${{ toJSON(matrix.entry.localeEnv) }}
                  maestro-config: ${{ needs.validate-manifest.outputs.maestro-config }}
                  maestro-version: ${{ inputs.maestro-version }}
                  output-dir: ${{ github.workspace }}/screenshots-output

            - name: Run post-capture-command
              if: inputs.post-capture-command != ''
              shell: bash
              env:
                  SCREENSHOTS_OUTPUT_DIR: ${{ github.workspace }}/screenshots-output
                  DEVICE_SLUG: ${{ steps.capture.outputs.device-slug }}
                  POST_CAPTURE_COMMAND: ${{ inputs.post-capture-command }}
              run: eval "$POST_CAPTURE_COMMAND"

            - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: raw-screenshots-ios-${{ steps.capture.outputs.device-slug }}
                  path: screenshots-output/raw/**
                  if-no-files-found: error
                  retention-days: 14

    capture-android:
        name: Capture Android (${{ matrix.entry.device }})
        needs: [validate-manifest, build-android]
        if: needs.validate-manifest.outputs.has-android == 'true'
        runs-on: ${{ fromJSON(inputs.android-capture-runner-labels) }}
        timeout-minutes: ${{ inputs.android-capture-timeout-minutes }}
        strategy:
            fail-fast: false
            matrix:
                entry: ${{ fromJSON(needs.validate-manifest.outputs.android-entries) }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
              with:
                  name: store-screenshots-apk-${{ fromJSON(needs.validate-manifest.outputs.android-target).name }}
                  path: .ci-artifacts/store-screenshots-apk-${{ fromJSON(needs.validate-manifest.outputs.android-target).name }}

            - name: redroid-container (start)
              id: redroid
              uses: rnw-community/mobile-ci/actions/redroid-container@v1.11.0 # v1.11.0
              with:
                  mode: start
                  container-name: redroid-screenshots-${{ strategy.job-index }}
                  image: ${{ inputs.redroid-image }}
                  memory: ${{ inputs.redroid-memory }}
                  cpus: ${{ inputs.redroid-cpus }}
                  prewarm-manifest-path: ${{ inputs.redroid-prewarm-manifest-path }}
                  boot-timeout-seconds: ${{ inputs.redroid-boot-timeout-seconds }}

            - name: capture-screenshots-android
              id: capture
              uses: rnw-community/mobile-ci/actions/capture-screenshots-android@v1.11.0 # v1.11.0
              with:
                  android-serial: ${{ steps.redroid.outputs.android-serial }}
                  apk-path: .ci-artifacts/store-screenshots-apk-${{ fromJSON(needs.validate-manifest.outputs.android-target).name }}/app-release.apk
                  app-id: ${{ fromJSON(needs.validate-manifest.outputs.android-target).appId }}
                  scenes: ${{ needs.validate-manifest.outputs.capture-scenes }}
                  screenshots-dir: ${{ needs.validate-manifest.outputs.screenshots-dir }}
                  device-name: ${{ matrix.entry.device }}
                  width: ${{ matrix.entry.width }}
                  height: ${{ matrix.entry.height }}
                  density: ${{ matrix.entry.density }}
                  locales: ${{ join(matrix.entry.locales, ',') }}
                  appearances: ${{ join(matrix.entry.appearances, ',') }}
                  seed-command: ${{ needs.validate-manifest.outputs.seed-command }}
                  settle-seconds: ${{ needs.validate-manifest.outputs.settle-seconds }}
                  status-bar-override: ${{ needs.validate-manifest.outputs.status-bar-override }}
                  maestro-env: ${{ needs.validate-manifest.outputs.maestro-env }}
                  locale-env: ${{ toJSON(matrix.entry.localeEnv) }}
                  maestro-config: ${{ needs.validate-manifest.outputs.maestro-config }}
                  maestro-version: ${{ inputs.maestro-version }}
                  output-dir: ${{ github.workspace }}/screenshots-output

            - name: Run post-capture-command
              if: inputs.post-capture-command != ''
              shell: bash
              env:
                  SCREENSHOTS_OUTPUT_DIR: ${{ github.workspace }}/screenshots-output
                  DEVICE_SLUG: ${{ steps.capture.outputs.device-slug }}
                  POST_CAPTURE_COMMAND: ${{ inputs.post-capture-command }}
              run: eval "$POST_CAPTURE_COMMAND"

            - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: raw-screenshots-android-${{ steps.capture.outputs.device-slug }}
                  path: screenshots-output/raw/**
                  if-no-files-found: error
                  retention-days: 14

            - name: redroid-container (teardown)
              if: always()
              uses: rnw-community/mobile-ci/actions/redroid-container@v1.11.0 # v1.11.0
              with:
                  mode: teardown
                  container-name: redroid-screenshots-${{ strategy.job-index }}

    upload:
        name: Upload screenshots
        needs: [validate-manifest, capture-ios, capture-android]
        if: >-
            always() && needs.validate-manifest.outputs.upload-screenshots == 'true' &&
            needs.validate-manifest.result == 'success' &&
            (needs.capture-ios.result == 'success' || needs.validate-manifest.outputs.has-ios != 'true') &&
            (needs.capture-android.result == 'success' || needs.validate-manifest.outputs.has-android != 'true')
        runs-on: ${{ fromJSON(inputs.upload-runner-labels != '' && inputs.upload-runner-labels || inputs.runner-labels) }}
        env:
            EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
            HAS_EAS_EXTRA_ENV: ${{ secrets.EAS_EXTRA_ENV != '' }}
            HAS_ASC_API_KEY: ${{ secrets.ASC_API_KEY != '' }}
            HAS_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID != '' }}
            HAS_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID != '' }}

        steps:
            - name: Validate required inputs and capture results
              shell: bash
              env:
                  UPLOAD_COMMAND: ${{ needs.validate-manifest.outputs.upload-command }}
                  CAPTURE_IOS_RESULT: ${{ needs.capture-ios.result }}
                  CAPTURE_ANDROID_RESULT: ${{ needs.capture-android.result }}
                  ASC_DEDUPE: ${{ needs.validate-manifest.outputs.asc-dedupe-screenshots }}
                  IOS_TARGET: ${{ needs.validate-manifest.outputs.ios-target }}
              run: |
                  set -euo pipefail
                  if [ -z "$UPLOAD_COMMAND" ]; then
                    echo "::error::upload-command is required when upload-screenshots is true."
                    exit 1
                  fi
                  if [ "$CAPTURE_IOS_RESULT" != 'success' ] && [ "$CAPTURE_ANDROID_RESULT" != 'success' ]; then
                    echo "::error::upload-screenshots is true but no capture job succeeded (capture-ios: $CAPTURE_IOS_RESULT, capture-android: $CAPTURE_ANDROID_RESULT); refusing to run upload-command with nothing to upload."
                    exit 1
                  fi
                  if [ "$ASC_DEDUPE" = 'true' ]; then
                    if [ -z "$IOS_TARGET" ]; then
                      echo "::error::asc-dedupe-screenshots is true but ios-target is empty; App Store Connect dedupe is iOS-only and needs the iOS appId."
                      exit 1
                    fi
                    if [ "$HAS_ASC_API_KEY" != 'true' ] || [ "$HAS_ASC_KEY_ID" != 'true' ] || [ "$HAS_ASC_ISSUER_ID" != 'true' ]; then
                      echo "::error::asc-dedupe-screenshots is true but ASC_API_KEY, ASC_KEY_ID, or ASC_ISSUER_ID is unset; all three secrets are required."
                      exit 1
                    fi
                  fi

            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - name: Apply publish-env
              if: needs.validate-manifest.outputs.publish-env != ''
              shell: bash
              env:
                  PUBLISH_ENV: ${{ needs.validate-manifest.outputs.publish-env }}
              run: |
                  set -euo pipefail
                  while IFS= read -r line; do
                    [ -z "$line" ] && continue
                    case "$line" in
                      *=*) ;;
                      *)
                        echo "::error::publish-env line '$line' is missing '='; expected KEY=VALUE."
                        exit 1
                        ;;
                    esac
                    name="${line%%=*}"
                    case "$name" in
                      ''|[!A-Za-z_]*)
                        echo "::error::publish-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    case "$name" in
                      *[!A-Za-z0-9_]*)
                        echo "::error::publish-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    echo "$line" >> "$GITHUB_ENV"
                  done <<< "$PUBLISH_ENV"

            - name: Apply EAS_EXTRA_ENV
              if: env.HAS_EAS_EXTRA_ENV == 'true'
              shell: bash
              env:
                  EAS_EXTRA_ENV: ${{ secrets.EAS_EXTRA_ENV }}
              run: |
                  set -euo pipefail
                  while IFS= read -r line; do
                    [ -z "$line" ] && continue
                    case "$line" in
                      *=*) ;;
                      *)
                        echo "::error::EAS_EXTRA_ENV has a line missing '='; expected KEY=VALUE."
                        exit 1
                        ;;
                    esac
                    name="${line%%=*}"
                    value="${line#*=}"
                    case "$name" in
                      ''|[!A-Za-z_]*)
                        echo "::error::EAS_EXTRA_ENV has a variable name that must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    case "$name" in
                      *[!A-Za-z0-9_]*)
                        echo "::error::EAS_EXTRA_ENV has a variable name that must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    if [ -n "$value" ]; then
                      echo "::add-mask::$value"
                    fi
                    echo "$name=$value" >> "$GITHUB_ENV"
                  done <<< "$EAS_EXTRA_ENV"

            - name: Resolve package manager
              id: package-manager
              shell: bash
              env:
                  PACKAGE_MANAGER: ${{ inputs.package-manager }}
                  LOCKFILE_REQUIRED: ''
              run: |
                  set -euo pipefail
                  pm=''
                  case "$PACKAGE_MANAGER" in
                    '') ;;
                    yarn|pnpm|npm) pm="$PACKAGE_MANAGER" ;;
                    *)
                      echo "::error::package-manager must be '' (auto-detect), yarn, pnpm or npm; got '$PACKAGE_MANAGER'."
                      exit 1
                      ;;
                  esac
                  declared=''
                  declared_version=''
                  if { [ -z "$pm" ] || [ "$pm" = pnpm ]; } && [ -f package.json ]; then
                    if command -v jq >/dev/null 2>&1; then
                      declared_spec="$(jq -r '
                        (try (.devEngines.packageManager) catch null) as $raw
                        | (if ($raw | type) == "array" then ($raw[0] // null) else $raw end) as $de
                        | (if ($de | type) == "object" then [($de.name // ""), ($de.version // "")] else ["", ""] end) as $dev
                        | (if ((.packageManager // "") | type) == "string" and (.packageManager // "") != ""
                           then (.packageManager | if test("@") then [split("@")[0], (split("@")[1] | split("+")[0])] else [., ""] end)
                           else ["", ""] end) as $spec
                        | (if $dev[0] != "" then $dev[0] else $spec[0] end) as $name
                        | [$name,
                           (if $dev[0] != "" and $dev[1] != "" then $dev[1]
                            elif $spec[0] == $name then $spec[1]
                            else "" end)]
                        | @tsv' package.json)"
                      declared="$(printf '%s\n' "$declared_spec" | cut -f1)"
                      declared_version="$(printf '%s\n' "$declared_spec" | cut -f2)"
                    else
                      echo "::warning::jq is not installed on this runner, so package.json's packageManager / devEngines.packageManager fields cannot be read; falling back to root lockfile detection. Install jq, or set the package-manager input explicitly."
                    fi
                  fi
                  if [ -z "$pm" ] && [ -n "$declared" ]; then
                    case "$declared" in
                      yarn|pnpm|npm) pm="$declared" ;;
                      *)
                        echo "::error::package.json declares package manager '$declared', which is not yarn, pnpm or npm; set the package-manager input explicitly."
                        exit 1
                        ;;
                    esac
                  fi
                  if [ -z "$pm" ]; then
                    lockfiles=''
                    lockfile_count=0
                    if [ -f yarn.lock ]; then pm=yarn; lockfiles="${lockfiles}yarn.lock "; lockfile_count=$((lockfile_count + 1)); fi
                    if [ -f pnpm-lock.yaml ]; then pm=pnpm; lockfiles="${lockfiles}pnpm-lock.yaml "; lockfile_count=$((lockfile_count + 1)); fi
                    if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
                      pm=npm
                      lockfile_count=$((lockfile_count + 1))
                      if [ -f package-lock.json ]; then lockfiles="${lockfiles}package-lock.json "; fi
                      if [ -f npm-shrinkwrap.json ]; then lockfiles="${lockfiles}npm-shrinkwrap.json "; fi
                    fi
                    if [ "$lockfile_count" -eq 0 ]; then
                      echo "::error::Cannot resolve the package manager: package.json declares none and there is no yarn.lock, pnpm-lock.yaml, package-lock.json or npm-shrinkwrap.json at the repository root. Set the package-manager input explicitly."
                      exit 1
                    fi
                    if [ "$lockfile_count" -gt 1 ]; then
                      echo "::error::Cannot resolve the package manager: multiple root lockfiles found (${lockfiles% }). Set the package-manager input explicitly."
                      exit 1
                    fi
                  fi
                  if [ "$pm" = pnpm ] && { [ "$declared" != pnpm ] || [ -z "$declared_version" ]; }; then
                    echo "::error::Resolved package manager is pnpm, but no pnpm version is readable from the repository-root package.json. pnpm/action-setup takes the version from 'packageManager: pnpm@<version>' or 'devEngines.packageManager: {name: pnpm, version: <range>}' - add one of those, and make sure jq is installed on this runner so the workflow can read it."
                    exit 1
                  fi
                  if [ -n "$LOCKFILE_REQUIRED" ]; then
                    case "$pm" in
                      yarn) wanted='yarn.lock' ;;
                      pnpm) wanted='pnpm-lock.yaml' ;;
                      *) wanted='package-lock.json npm-shrinkwrap.json' ;;
                    esac
                    found=''
                    for candidate in $wanted; do
                      if [ -f "$candidate" ]; then found="$candidate"; break; fi
                    done
                    if [ -z "$found" ]; then
                      echo "::error::Resolved package manager is $pm, but this job caches JS dependencies with actions/setup-node and the repository root has none of: $wanted. Commit the lockfile, or set the package-manager input to the manager whose lockfile this repository actually has."
                      exit 1
                    fi
                  fi
                  echo "Resolved package manager: $pm"
                  echo "pm=$pm" >> "$GITHUB_OUTPUT"

            - name: Setup pnpm
              if: steps.package-manager.outputs.pm == 'pnpm'
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - name: Setup Node
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ inputs.node-version }}

            - name: Enable corepack
              if: inputs.enable-corepack && steps.package-manager.outputs.pm != 'pnpm'
              shell: bash
              run: corepack enable

            - name: Install dependencies
              shell: bash
              env:
                  INSTALL_COMMAND: ${{ needs.validate-manifest.outputs.install-command }}
              run: eval "$INSTALL_COMMAND"

            - name: Download raw screenshots
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
              with:
                  pattern: raw-screenshots-*
                  path: ${{ needs.validate-manifest.outputs.ios-target != '' && fromJSON(needs.validate-manifest.outputs.ios-target).appDir || fromJSON(needs.validate-manifest.outputs.android-target).appDir }}/${{ needs.validate-manifest.outputs.screenshots-download-dir }}
                  merge-multiple: true

            - name: Validate iOS screenshot resolutions against apple-screenshot-slots
              if: needs.validate-manifest.outputs.apple-screenshot-slots != ''
              shell: bash
              env:
                  APPLE_SCREENSHOT_SLOTS: ${{ needs.validate-manifest.outputs.apple-screenshot-slots }}
                  DOWNLOAD_ROOT: ${{ needs.validate-manifest.outputs.ios-target != '' && fromJSON(needs.validate-manifest.outputs.ios-target).appDir || fromJSON(needs.validate-manifest.outputs.android-target).appDir }}/${{ needs.validate-manifest.outputs.screenshots-download-dir }}
              run: |
                  set -euo pipefail
                  command -v python3 >/dev/null 2>&1 || { echo "::error::'python3' is required to read PNG headers for apple-screenshot-slots validation but is not on PATH."; exit 1; }
                  if ! jq empty <<< "$APPLE_SCREENSHOT_SLOTS" 2>/dev/null; then
                    echo "::error::apple-screenshot-slots is not valid JSON."
                    exit 1
                  fi
                  if [ "$(jq 'type' <<< "$APPLE_SCREENSHOT_SLOTS")" != '"object"' ]; then
                    echo "::error::apple-screenshot-slots must be a JSON object mapping '<W>x<H>' keys to slot labels."
                    exit 1
                  fi
                  invalid_slots=$(jq -r '[to_entries[] | select(((.key | test("^[0-9]+x[0-9]+$")) | not) or ((.value | type) != "string") or .value == "") | .key] | join(", ")' <<< "$APPLE_SCREENSHOT_SLOTS")
                  if [ -n "$invalid_slots" ]; then
                    echo "::error::apple-screenshot-slots has invalid entries (keys must match ^[0-9]+x[0-9]+\$ and values must be non-empty slot-label strings): $invalid_slots"
                    exit 1
                  fi
                  # PNG IHDR width/height live at fixed big-endian offsets 16/20
                  # right after the 8-byte signature - reading them needs no
                  # image library at all, so this stays dependency-free.
                  python3 - <<'PY'
                  import json
                  import os
                  import struct
                  import sys

                  slots = json.loads(os.environ['APPLE_SCREENSHOT_SLOTS'])
                  root = os.path.join(os.environ['DOWNLOAD_ROOT'], 'ios')
                  pngs = []
                  for dirpath, _dirnames, filenames in os.walk(root):
                      for filename in filenames:
                          if filename.lower().endswith('.png'):
                              pngs.append(os.path.join(dirpath, filename))
                  if not pngs:
                      print(f"::error::apple-screenshot-slots is set but no iOS PNGs were found under '{root}'.")
                      sys.exit(1)
                  counts = {label: 0 for label in slots.values()}
                  offenders = []
                  for path in sorted(pngs):
                      with open(path, 'rb') as f:
                          header = f.read(24)
                      if len(header) < 24 or header[:8] != b'\x89PNG\r\n\x1a\n':
                          offenders.append((path, 'not a valid PNG'))
                          continue
                      width, height = struct.unpack('>II', header[16:24])
                      label = slots.get(f'{width}x{height}') or slots.get(f'{height}x{width}')
                      if label is None:
                          offenders.append((path, f'{width}x{height}'))
                      else:
                          counts[label] += 1
                  if offenders:
                      for path, resolution in offenders:
                          print(f"::error::'{path}' ({resolution}) does not resolve to any apple-screenshot-slots entry (WxH and HxW both checked).")
                      sys.exit(1)
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                      f.write('### apple-screenshot-slots coverage\n')
                      f.write('| Slot | Screenshots |\n')
                      f.write('| --- | --- |\n')
                      for label in sorted(counts):
                          f.write(f'| {label} | {counts[label]} |\n')
                  PY

            - name: Write App Store Connect API key
              id: asc-key
              if: env.HAS_ASC_API_KEY == 'true'
              working-directory: ${{ needs.validate-manifest.outputs.ios-target != '' && fromJSON(needs.validate-manifest.outputs.ios-target).appDir || fromJSON(needs.validate-manifest.outputs.android-target).appDir }}
              shell: bash
              env:
                  ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
                  ASC_KEY_PATH_INPUT: ${{ inputs.asc-key-path }}
              run: |
                  set -euo pipefail
                  if [ -n "$ASC_KEY_PATH_INPUT" ]; then
                    key_path="$ASC_KEY_PATH_INPUT"
                  else
                    key_path="$RUNNER_TEMP/store-screenshots/asc-api-key.p8"
                  fi
                  mkdir -p "$(dirname "$key_path")"
                  printf '%s' "$ASC_API_KEY" > "$key_path"
                  chmod 600 "$key_path"
                  absolute_key_path="$(cd "$(dirname "$key_path")" && pwd)/$(basename "$key_path")"
                  echo "key-path=$absolute_key_path" >> "$GITHUB_OUTPUT"

            - name: Run upload-command
              working-directory: ${{ needs.validate-manifest.outputs.ios-target != '' && fromJSON(needs.validate-manifest.outputs.ios-target).appDir || fromJSON(needs.validate-manifest.outputs.android-target).appDir }}
              shell: bash
              env:
                  UPLOAD_COMMAND: ${{ needs.validate-manifest.outputs.upload-command }}
                  SCREENSHOTS_DIR: ${{ needs.validate-manifest.outputs.screenshots-download-dir }}
              run: eval "$UPLOAD_COMMAND"

            - name: Dedupe App Store Connect screenshots
              id: asc-dedupe
              # Job outputs are strings, so every resolved boolean is compared
              # against 'true' here - unlike a raw boolean input, whose
              # `== 'true'` comparison is always false and needs truthiness.
              if: needs.validate-manifest.outputs.asc-dedupe-screenshots == 'true' && env.HAS_ASC_API_KEY == 'true'
              uses: rnw-community/mobile-ci/actions/asc-dedupe-screenshots@v1.11.0 # v1.11.0
              with:
                  app-id: ${{ needs.validate-manifest.outputs.asc-dedupe-app-id != '' && needs.validate-manifest.outputs.asc-dedupe-app-id || fromJSON(needs.validate-manifest.outputs.ios-target).appId }}
                  asc-key-path: ${{ steps.asc-key.outputs.key-path }}
                  asc-key-id: ${{ secrets.ASC_KEY_ID }}
                  asc-issuer-id: ${{ secrets.ASC_ISSUER_ID }}
                  version-state: ${{ needs.validate-manifest.outputs.asc-dedupe-version-state }}
                  fail-on-duplicates: ${{ needs.validate-manifest.outputs.asc-fail-on-duplicates }}

            - name: Remove App Store Connect API key
              if: always() && steps.asc-key.outputs.key-path != ''
              shell: bash
              env:
                  ASC_KEY_PATH: ${{ steps.asc-key.outputs.key-path }}
              run: rm -f "$ASC_KEY_PATH"

    status:
        name: Store screenshots result
        needs: [validate-manifest, build-ios, build-android, capture-ios, capture-android, upload]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Report
              shell: bash
              env:
                  VALIDATE_RESULT: ${{ needs.validate-manifest.result }}
                  HAS_IOS: ${{ needs.validate-manifest.outputs.has-ios }}
                  HAS_ANDROID: ${{ needs.validate-manifest.outputs.has-android }}
                  BUILD_IOS_RESULT: ${{ needs.build-ios.result }}
                  BUILD_ANDROID_RESULT: ${{ needs.build-android.result }}
                  CAPTURE_IOS_RESULT: ${{ needs.capture-ios.result }}
                  CAPTURE_ANDROID_RESULT: ${{ needs.capture-android.result }}
                  UPLOAD_ENABLED: ${{ needs.validate-manifest.outputs.upload-screenshots }}
                  UPLOAD_RESULT: ${{ needs.upload.result }}
              run: |
                  fail() {
                    echo "$1"
                    if [ "$2" = 'cancelled' ]; then
                      echo "::notice::A cancelled job result often means the job hit its timeout-minutes - check the job's duration against build-timeout-minutes/capture-timeout-minutes (or their android-* siblings) before assuming external cancellation."
                    fi
                    exit 1
                  }
                  if [ "$VALIDATE_RESULT" != "success" ]; then
                    fail "capture-manifest/capture-scenes validation failed." "$VALIDATE_RESULT"
                  fi
                  # Honest-skip semantics: a platform's build/capture results
                  # must be success when the manifest has entries for it;
                  # 'skipped' is only acceptable for a platform with no
                  # entries at all.
                  ran_platforms=''
                  if [ "$HAS_IOS" = 'true' ]; then
                    if [ "$BUILD_IOS_RESULT" != "success" ]; then
                      fail "iOS build job did not succeed (result: $BUILD_IOS_RESULT) despite the manifest having iOS entries." "$BUILD_IOS_RESULT"
                    fi
                    if [ "$CAPTURE_IOS_RESULT" != "success" ]; then
                      fail "iOS capture job did not succeed (result: $CAPTURE_IOS_RESULT) despite the manifest having iOS entries." "$CAPTURE_IOS_RESULT"
                    fi
                    ran_platforms="$ran_platforms ios"
                  else
                    echo "iOS: no manifest entries - build-ios/capture-ios skipped."
                  fi
                  if [ "$HAS_ANDROID" = 'true' ]; then
                    if [ "$BUILD_ANDROID_RESULT" != "success" ]; then
                      fail "Android build job did not succeed (result: $BUILD_ANDROID_RESULT) despite the manifest having Android entries." "$BUILD_ANDROID_RESULT"
                    fi
                    if [ "$CAPTURE_ANDROID_RESULT" != "success" ]; then
                      fail "Android capture job did not succeed (result: $CAPTURE_ANDROID_RESULT) despite the manifest having Android entries." "$CAPTURE_ANDROID_RESULT"
                    fi
                    ran_platforms="$ran_platforms android"
                  else
                    echo "Android: no manifest entries - build-android/capture-android skipped."
                  fi
                  if [ "$UPLOAD_ENABLED" = "true" ] && [ "$UPLOAD_RESULT" != "success" ]; then
                    fail "Upload job failed." "$UPLOAD_RESULT"
                  fi
                  echo "Store screenshots completed successfully for platforms:$ran_platforms."
