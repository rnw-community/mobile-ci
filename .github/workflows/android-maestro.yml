name: android-maestro

on:
    workflow_call:
        inputs:
            control-runner-labels:
                description: >-
                    JSON array of runner labels for the lightweight control jobs
                    (detect, status, collect, validate-manifest, cancel-queued-runs)
                    that only run Node and the GitHub API and need no self-hosted
                    hardware. Override when the org has no GitHub-hosted runners,
                    for example an ephemeral RunsOn label set.
                required: false
                type: string
                default: '["ubuntu-latest"]'
            runs-on-cache-bypass:
                description: >-
                    Run a SHA-pinned runs-on/action before any artifact traffic when
                    the job lands on a RunsOn runner started with extras=s3-cache,
                    whose cache proxy takes over the Actions results URL and makes
                    actions/upload-artifact and download-artifact fail. A no-op on
                    every other runner. Off by default.
                required: false
                type: boolean
                default: false
            runner-labels:
                description: >-
                    JSON array of self-hosted runner labels for the build/test jobs.
                    The default is an x86_64 Linux KVM pool (4 vCPU / 8 GiB), the
                    host shape the default android-driver ('avd') needs: Google
                    ships an x86_64 Linux emulator and NDK, and both the Gradle
                    build and the emulator fit in 8 GiB with the emulator's RAM
                    bounded by the container's memory limit (see
                    emulator-ram-size). Override it to a linux-aarch64
                    binder/privileged-docker pool together with
                    android-driver: redroid.
                type: string
                required: false
                default: '["self-hosted","trf-linux-amd64-4x8"]'
            build-runner-labels:
                description: >-
                    JSON array of self-hosted runner labels for the build job only. Falls
                    back to runner-labels when empty; set this and test-runner-labels
                    together to split build/test across separate runner pools. Android
                    builds cross-compiling native code (NDK/cmake) on a linux-aarch64
                    self-hosted fleet need this overridden to a macOS or x86_64 pool —
                    Google does not publish linux-aarch64 NDK/cmake binaries. The
                    default runner-labels pool is x86_64 and needs no such override.
                type: string
                required: false
                default: ''
            test-runner-labels:
                description: >-
                    JSON array of self-hosted runner labels for the test job only. Falls
                    back to runner-labels when empty.
                type: string
                required: false
                default: ''
            targets:
                description: >-
                    JSON array of build targets: {name, appDir, appId, prebuildCommand}.
                    prebuildCommand may be an empty string. Optional per target:
                    flowsDir, tolerateTestFailures and buildStrategy, each defaulting to
                    the flows-dir, tolerate-test-failures and build-strategy input.
                type: string
                required: true
            flows-dir:
                description: >-
                    Directory (relative to repo root) whose top-level files are the
                    runnable Maestro flows by default. Subdirectories are not searched
                    unless flows-max-depth is raised; see flows-max-depth/flows-name-pattern.
                    The default of every target's flowsDir; may be empty when every
                    target names its own.
                type: string
                required: false
                default: ''
            flows-max-depth:
                description: >-
                    find -maxdepth under flows-dir. 0 means unbounded recursion. Default
                    1 (top-level only) keeps subflows invoked via runFlow, conventionally
                    living in subdirectories, out of the shard.
                type: string
                required: false
                default: '1'
            flows-name-pattern:
                description: >-
                    Space-separated find -name globs (OR'd together) selecting runnable
                    flows directly inside flows-dir. Keeps reusable subflows and
                    capture-only flows in subdirectories out of the shard by default.
                type: string
                required: false
                default: '*.flow.yaml'
            flows-exclude-pattern:
                description: >-
                    Optional find ! -name globs excluding matched flows by
                    basename: a comma- and/or newline-separated list of globs,
                    each emitted as its own find ! -name clause (surrounding
                    whitespace trimmed, empty entries ignored; a single glob
                    works as before, a glob containing a comma is not
                    supported).
                type: string
                required: false
                default: ''
            shard-manifest-dir:
                description: >-
                    Optional directory (relative to repo root) of hand-curated
                    shard-<index>.txt files (one flows-dir-relative flow path per line)
                    overriding the computed index-modulo split so a consumer's balanced
                    shard assignment survives. Unset (default) falls back to the
                    index-modulo split entirely.
                type: string
                required: false
                default: ''
            pre-run-flow:
                description: >-
                    Path to a single priming flow run once before each shard's flows,
                    excluded from sharding. Its failure fails that shard immediately.
                type: string
                required: false
                default: ''
            flow-recovery-flow:
                description: >-
                    Path to a single best-effort recovery flow run after a failed flow
                    attempt: before the same flow's next retry attempt, and before the
                    next flow starts, so a failure cannot strand the app in a state that
                    cascades into the flows after it. Not run after a passing attempt,
                    and not after a shard's last flow. Its own failure only logs a
                    warning and never fails the shard. Like pre-run-flow it is removed
                    from the discovered flow list, so it never also runs as a scenario of
                    its own. Leave empty to skip recovery. Passed to both
                    android-driver options.
                type: string
                required: false
                default: ''
            pre-test-command:
                description: >-
                    Optional consumer-owned shell command run once after the app is
                    installed on the device/container and before any flow (including
                    pre-run-flow) executes, e.g. seeding a fixture into the app's data
                    container. Runs with ANDROID_SERIAL, APP_ID, and APK_PATH in its
                    environment. Its failure fails that shard immediately. Passed to
                    both android-driver options.
                type: string
                required: false
                default: ''
            pre-flow-command:
                description: >-
                    Optional consumer-owned shell command run before every flow attempt,
                    each retry included, after pre-run-flow and the warm-up. It is never
                    run before pre-run-flow or flow-recovery-flow themselves. Runs with
                    FLOW_PATH, FLOW_NAME, APP_ID, ANDROID_SERIAL and MAESTRO_FLOW_ENV_FILE
                    in its environment. Unlike the best-effort flow-recovery-flow this is
                    a precondition: a non-zero exit fails that attempt without running the
                    flow, consuming one of its 1 + flow-retries attempts and triggering the
                    recovery flow as any other failed attempt would. Every KEY=VALUE line
                    the command appends to the file at MAESTRO_FLOW_ENV_FILE becomes an
                    extra -e KEY=VALUE argument for that one flow's `maestro test`,
                    validated exactly like maestro-env. Passed to both
                    android-driver options.
                type: string
                required: false
                default: ''
            maestro-env:
                description: >-
                    Newline-separated KEY=VALUE pairs, each passed as an additional
                    -e KEY=VALUE argument to every `maestro test` invocation (pre-run-flow
                    and shard flows alike). Rejects (fails closed) any line without '='
                    or whose name does not match ^[A-Za-z_][A-Za-z0-9_]*$. Passed to both
                    android-driver options.
                type: string
                required: false
                default: ''
            maestro-config:
                description: >-
                    Path to the consumer's Maestro workspace config (config.yaml),
                    passed as --config to every `maestro test` invocation. Maestro only
                    auto-discovers a workspace config.yaml when it is pointed at a
                    directory, and the actions below always pass individual flow files,
                    so without this input a workspace config is silently ignored.
                    Relative paths resolve against the job's working directory. Fails
                    closed when set to a path that is not a file. Its
                    includeTags/excludeTags are honoured when shards are planned
                    (see include-tags).
                type: string
                required: false
                default: ''
            include-tags:
                description: >-
                    Comma-separated Maestro tags: only flows whose config section's
                    `tags:` list holds any of them are run. Applied when shards are
                    planned, with Maestro's own semantics (exclude-tags wins), added
                    to maestro-config's includeTags, and also passed to `maestro
                    test`. An unparsable flow config section, or a selection left
                    with no flow, fails the test job.
                type: string
                required: false
                default: ''
            exclude-tags:
                description: >-
                    Comma-separated Maestro tags: flows whose `tags:` list holds any
                    of them are never run, even when include-tags selects them.
                    Added to maestro-config's excludeTags.
                type: string
                required: false
                default: ''
            junit-report:
                description: >-
                    When true, every flow's final attempt writes a JUnit report
                    (`maestro test --format junit`) to junit/ inside the shard's
                    existing Maestro artifact.
                type: boolean
                required: false
                default: true
            artifact-retention-days:
                description: >-
                    Retention in days of each shard's Maestro artifact (debug
                    output, final-state capture, JUnit reports).
                type: number
                required: false
                default: 7
            flow-retries:
                description: >-
                    Non-negative retry budget per flow; each flow gets up to
                    1 + flow-retries attempts.
                type: string
                required: false
                default: '0'
            infra-retries:
                description: >-
                    Per-flow retry budget, separate from flow-retries, spent
                    only on a failed attempt that hit ActivityManager's
                    startProcessLocked non-zero startSeq race (no app
                    process started). android-driver avd only.
                type: string
                required: false
                default: '1'
            settle-before-flow:
                description: >-
                    'true' force-stops the app and waits for its process to
                    be gone before every flow attempt, so a launchApp
                    clearState cannot race the process death pm clear
                    causes. App data is untouched. android-driver avd only.
                type: string
                required: false
                default: 'true'
            app-warm-seconds:
                description: >-
                    Seconds the app is left running during a one-off warm-up
                    (launch, settle, force-stop) performed after install and
                    before any flow runs, so first-launch cold-start cost is
                    not absorbed by the first flow's own timeout budget. Set
                    to '0' to disable warming. Passed to both android-driver
                    options.
                type: string
                required: false
                default: '20'
            shard-count:
                type: number
                required: false
                default: 2
            cmdline-tools-version:
                description: See build-android-app README — pin explicitly, do not trust upstream defaults.
                type: string
                required: false
                default: '12266719'
            gradle-task:
                description: See build-android-app README — gradlew task to build, e.g. :app:assembleRelease to scope to one module.
                type: string
                required: false
                default: assembleRelease
            gradle-args:
                description: See build-android-app README — extra whitespace-split arguments appended after gradle-task.
                type: string
                required: false
                default: ''
            turbo-version:
                description: >-
                    Exact turbo npm version for the detect job. Empty resolves the
                    repository's own turbo from its lockfile, else 2.10.8.
                type: string
                required: false
                default: ''
            target-packages:
                description: >-
                    Newline-separated package names gating this pipeline on pull_request
                    events. Empty derives them from the name in each targets[].appDir's
                    package.json.
                type: string
                required: false
                default: ''
            exempt-paths:
                description: >-
                    Newline- or comma-separated git pathspec globs, relative to the
                    repository root (e.g. docs/**, **/*.md). A pull request whose every
                    changed file matches one skips the run without turbo detection.
                type: string
                required: false
                default: ''
            trigger-paths:
                description: >-
                    Newline- or comma-separated git pathspec globs, relative to the
                    repository root (e.g. .github/workflows/e2e.yml). A pull request that
                    changes a matching file runs without turbo detection; ** runs every
                    pull request. Wins over exempt-paths.
                type: string
                required: false
                default: ''
            force-label:
                description: >-
                    Pull request label that runs the pipeline regardless of affected packages;
                    the status job then reports the run as forced. Add `labeled` to the caller's
                    pull_request trigger types so adding the label starts a run. Empty (default)
                    never forces.
                type: string
                required: false
                default: ''
            expo-fingerprint-version:
                type: string
                required: false
                default: '0.20.6'
            maestro-version:
                type: string
                required: false
                default: '2.8.0'
            android-driver:
                description: >-
                    'avd' (default) or 'redroid'. 'avd' boots Google's own emulator
                    and matches the default runner-labels, an x86_64 Linux pool with
                    /dev/kvm and no privileged-container or binder_linux support.
                    'redroid' runs Android as a privileged Docker container over the
                    host's binder_linux module and is the driver for a linux-aarch64
                    pool, where Google publishes no emulator/NDK/cmake at all; select
                    it together with runner-labels pointing at such a host, since it
                    cannot run on the default pool. 'device-cloud' boots nothing: it
                    submits the repacked or built .apk and flows-dir to
                    devicecloud.dev from a plain Linux runner
                    (device-cloud-runner-labels) and needs the device-cloud-api-key
                    secret. Device Cloud runs the flows in parallel itself, so the
                    test job submits once per target.
                type: string
                required: false
                default: avd
            android-abis:
                description: >-
                    Comma-separated ABIs the native build compiles, passed to Gradle
                    as -PreactNativeArchitectures. 'auto' (default) follows the
                    test device: emulator-arch (x86_64) for android-driver avd,
                    arm64-v8a for redroid; when gradle-args or build-env already
                    pins reactNativeArchitectures, auto leaves it to that pin.
                    Empty compiles the project's own reactNativeArchitectures
                    (every ABI in a stock project). Part of the native key, so
                    seed-native-cache.yml must resolve to the same ABIs.
                type: string
                required: false
                default: auto
            device-cloud-runner-labels:
                description: >-
                    JSON array of runner labels for the test job when the android-driver
                    is device-cloud. The job only uploads the app and flows to
                    Device Cloud and waits, so any Linux runner with Node will do -
                    no simulator, KVM or binder. Empty (default) falls back to
                    repack-runner-labels, the plain Linux pool the repack already uses.
                type: string
                required: false
                default: ''
            device-cloud-cli-version:
                description: Exact @devicecloud.dev/dcd npm version the device-cloud driver runs.
                type: string
                required: false
                default: '5.7.1'
            device-cloud-android-api-level:
                description: >-
                    Device Cloud Android API level, e.g. 34 (dcd --android-api-level).
                    Empty uses Device Cloud's default.
                type: string
                required: false
                default: ''
            device-cloud-android-device:
                description: >-
                    Device Cloud Android device model, e.g. pixel-7 (dcd
                    --android-device). Empty uses Device Cloud's default.
                type: string
                required: false
                default: ''
            emulator-api-level:
                type: string
                required: false
                default: '34'
            emulator-target:
                type: string
                required: false
                default: google_apis
            emulator-arch:
                type: string
                required: false
                default: x86_64
            emulator-profile:
                type: string
                required: false
                default: pixel_6
            emulator-ram-size:
                description: >-
                    Emulator RAM in MB. Empty (default) derives it from the test
                    runner's cgroup memory limit: 256 MB of guest RAM per GiB of
                    limit, clamped to 1536-4096, so the default runner-labels pool
                    (a memory-bounded 8 GiB container) gets 2048. With no memory
                    limit detected the hardware profile's own default applies. A
                    cgroup limit kills qemu instead of reporting an out-of-memory
                    condition, so an unbounded guest fails the job as a lost adb
                    connection ("0 devices connected") partway through a run whose
                    earlier flows passed; set a value only with headroom measured
                    on the pool the run lands on. Mirrors what redroid-memory does
                    for the redroid driver.
                type: string
                required: false
                default: ''
            emulator-heap-size:
                description: Android VM heap size in MB for the emulated device.
                type: string
                required: false
                default: ''
            emulator-cores:
                description: >-
                    Emulator CPU cores. Empty (default) derives half the test
                    runner's cgroup CPU quota, clamped to 2-4; with no quota
                    detected the profile default applies.
                type: string
                required: false
                default: ''
            emulator-slots-dir:
                description: >-
                    Host directory of fleet-provisioned slot-* files capping how
                    many emulators the test runner's host boots at once, across
                    every job and repository (avd driver only). Each shard holds an
                    exclusive flock on one slot from before the emulator boots
                    until it shuts down. Empty (default) takes no slot. Set it
                    only once the fleet bind-mounts the directory into every
                    runner container: a missing or empty directory fails the job.
                type: string
                required: false
                default: ''
            emulator-slot-timeout-minutes:
                description: >-
                    Minutes a shard waits for a free slot in emulator-slots-dir
                    before failing. The wait counts against test-timeout-minutes.
                type: string
                required: false
                default: '60'
            redroid-image:
                description: >-
                    Redroid image tag, used on a redroid-prewarm-manifest-path miss.
                    Verified against a 6.17 host kernel — older 13.x tags are known to
                    never finish boot on that kernel, and 14.x images hard-lock the
                    guest kernel version.
                type: string
                required: false
                default: redroid/redroid:15.0.0_64only-latest
            redroid-memory:
                type: string
                required: false
                default: 3g
            redroid-cpus:
                type: string
                required: false
                default: '2'
            redroid-prewarm-manifest-path:
                type: string
                required: false
                default: $HOME/.rnw-ci/android-emulator.json
            redroid-boot-timeout-seconds:
                type: string
                required: false
                default: '600'
            node-version:
                type: string
                required: false
                default: 22.x
            install-command:
                type: string
                required: false
                default: yarn install --immutable
            enable-corepack:
                type: boolean
                required: false
                default: true
            package-manager:
                description: >-
                    JS package manager driving pnpm provisioning and, in the jobs
                    that configure one, actions/setup-node's dependency cache.
                    Leave empty to auto-detect at the repository root, in order: an
                    explicit value here, then package.json's
                    devEngines.packageManager / packageManager field (needs jq on
                    the runner), then exactly one root lockfile (yarn.lock,
                    pnpm-lock.yaml, package-lock.json / npm-shrinkwrap.json). No
                    match, an ambiguous
                    match, or an unsupported value fails the job. install-command
                    must match the resolved manager (e.g. pnpm install
                    --frozen-lockfile). Resolving to pnpm additionally requires a
                    pnpm version declared in package.json (packageManager or
                    devEngines.packageManager) because pnpm/action-setup reads it
                    from there; the corepack step is then skipped.
                type: string
                required: false
                default: ''
            build-command:
                description: Optional workspace JS build command run at repo root before the native build.
                type: string
                required: false
                default: ''
            build-env:
                description: >-
                    Newline-separated KEY=VALUE pairs appended to $GITHUB_ENV at the
                    start of the build job. Rejects (fails closed) any line without
                    '=' or whose name does not match ^[A-Za-z_][A-Za-z0-9_]*$.
                type: string
                required: false
                default: ''
            build-strategy:
                description: >-
                    How this pull request gets the APK its Maestro shards install.
                    `auto` (the default) computes the native key, looks up the base
                    binary published for it, and repacks that base with this
                    commit's JavaScript; only a key with no published base, or an
                    unusable base, runs Gradle — and when it does on the default
                    branch, the base it builds is published for the next run.
                    `repack` refuses to run Gradle at all: a missing base fails the
                    build. `native` is the escape hatch and a regression — every
                    pull request then rebuilds the APK, and that run publishes no
                    base. See docs/repack.md.
                type: string
                required: false
                default: auto
            repack-runner-labels:
                description: >-
                    JSON array of self-hosted runner labels for the repack job. The
                    default is the 2 vCPU / 4 GiB x86_64 Linux pool without /dev/kvm
                    (trf-linux-amd64-2x4), so these jobs never queue on the scarce KVM
                    emulator lane (#169). Keep it an x86_64 pool: Google publishes
                    Android build-tools for x86_64 Linux only. Move it to the 4x8 pool
                    if bundling the app's JavaScript needs more than about 3 GiB.
                type: string
                required: false
                default: '["self-hosted","trf-linux-amd64-2x4"]'
            native-build-label:
                description: >-
                    Pull-request label forcing build-strategy: native for that one
                    pull request. Set together with build-strategy: repack it fails
                    closed rather than silently picking a winner.
                type: string
                required: false
                default: 'mobile: force native build'
            base-backend:
                description: >-
                    Where base binaries live: `ghcr` (default, an immutable OCI
                    artifact needing packages:write to publish and packages:read to
                    fetch) or `artifact` (workflow artifacts, default-branch runs
                    only, needing actions:read). See expo-base-binary.
                type: string
                required: false
                default: ghcr
            base-flavor:
                description: Flavor segment of the base binary's address.
                type: string
                required: false
                default: e2e
            fingerprint-config:
                description: >-
                    Path, relative to a target's appDir, of the @expo/fingerprint
                    config whose ignore list is the correctness boundary of every
                    repack. Its hash is part of the native key. See docs/repack.md.
                type: string
                required: false
                default: fingerprint.config.js
            fingerprint-env:
                description: >-
                    Newline-separated KEY=VALUE pairs exported while the native key
                    is computed, for an app.config that branches on env. Must be
                    byte-identical to what the warm-up passes, or the two never
                    agree on a key and every pull request rebuilds the APK.
                type: string
                required: false
                default: ''
            repack-env:
                description: >-
                    Newline-separated KEY=VALUE pairs exported for the re-bundle, so
                    the consumer's app.config writes this build's API URL, version
                    and build number into the repacked APK.
                type: string
                required: false
                default: ''
            expect-config:
                description: >-
                    Newline-separated <dotted.path>=<value> assertions the repacked
                    APK's embedded app.config must satisfy exactly. Every value
                    repack-env is expected to have rewritten belongs here: a config
                    rewrite nobody checked is a repack nobody can trust.
                type: string
                required: false
                default: ''
            repack-app-version:
                description: Pinned @expo/repack-app npm version.
                type: string
                required: false
                default: '0.7.2'
            repack-timeout-minutes:
                type: number
                required: false
                default: 30
            android-build-tools-dir:
                description: >-
                    Path to the Android SDK build-tools directory holding zipalign
                    and apksigner, used by the repack job. Leave empty to use the
                    android-build-tools-version directory the repack job installs
                    under the SDK.
                type: string
                required: false
                default: ''
            android-build-tools-version:
                description: >-
                    Android build-tools version the repack job installs via
                    android-actions/setup-android, for the zipalign and apksigner a
                    repacked APK is aligned and signed with. The Gradle build
                    installs whatever its compileSdkVersion resolves to; the repack
                    job never runs Gradle, so it asks for build-tools explicitly.
                type: string
                required: false
                default: '35.0.0'
            android-keystore-path:
                description: >-
                    Keystore, relative to a target's appDir, the repacked APK is
                    signed with. The default is the React Native debug keystore an
                    `expo prebuild` app ships and Gradle signs its release build
                    with - sign the repack with anything else and the emulator
                    refuses to install it over the base. These are the published
                    debug-keystore constants, not secrets; a release key belongs in
                    native-publish.yml, never here. Empty leaves @expo/repack-app's
                    own default in place.
                type: string
                required: false
                default: android/app/debug.keystore
            android-keystore-password:
                description: Password of android-keystore-path. Ignored when that is empty.
                type: string
                required: false
                default: android
            android-keystore-key-alias:
                description: Key alias inside android-keystore-path. Ignored when that is empty.
                type: string
                required: false
                default: androiddebugkey
            android-keystore-key-password:
                description: Key password inside android-keystore-path. Ignored when that is empty.
                type: string
                required: false
                default: android
            build-timeout-minutes:
                type: number
                required: false
                default: 60
            test-timeout-minutes:
                type: number
                required: false
                default: 75
            tolerate-test-failures:
                description: >-
                    true keeps the test job green when the Maestro run step fails, for a
                    time-boxed quarantine of a known-broken suite. The failure is still
                    reported as a ::warning:: on the job. Defaults to false; a target's
                    own tolerateTestFailures wins over it.
                type: boolean
                required: false
                default: false
            call-scope:
                description: >-
                    Names this call's artifacts, plans and concurrency group, so a caller
                    can run this workflow several times in one run, e.g. once per package
                    in a matrix, without the calls overwriting or cancelling each other.
                    Calls that share a run must each set a distinct, non-empty value.
                    Letters, digits, '.', '_' and single '-' between them. Empty (default)
                    keeps today's names.
                type: string
                required: false
                default: ''

        secrets:
            build-secrets-env:
                description: >-
                    Masked newline-separated KEY=VALUE entries (KEY<<DELIMITER for a
                    multi-line value) exported, after build-env, in every job that
                    installs, bundles or compiles the app: the plan/repack leg and
                    the native build. For what a real build needs but a log must
                    never show - a remote turbo cache token, a Maps API key compiled
                    into the base. Only a SHA-256 digest of the entries enters the
                    native key, so rotating one moves the key, and the warm-up must
                    be passed the same secret or the two never agree on a key.
                required: false
            maestro-secrets-env:
                description: >-
                    Masked newline-separated KEY=VALUE entries appended to
                    maestro-env (one line each, no multi-line values) and exported
                    to the test job's environment for pre-test-command and
                    pre-flow-command. Every value is scrubbed from the uploaded
                    Maestro artifacts. For test-user passwords and the credentials a
                    hook uses to prepare the backend under test.
                required: false
            device-cloud-api-key:
                description: >-
                    Device Cloud API key, required only when the android-driver is
                    device-cloud. Handed to the CLI through its environment, never
                    as an input or on a command line.
                required: false
        outputs:
            result:
                description: >-
                    The status job's verdict: passed, failed, or skipped when no
                    target package was affected (a skip is a green check, not a pass).
                value: ${{ jobs.status.outputs.result }}

concurrency:
    group: android-maestro-${{ github.workflow }}-${{ inputs.flows-dir }}-${{ inputs.call-scope }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    detect:
        name: Detect affected packages
        runs-on: ${{ fromJSON(inputs.control-runner-labels) }}
        outputs:
            affected: ${{ steps.affected.outputs.affected }}
            forced: ${{ steps.affected.outputs.forced }}
            shard-indices: ${{ steps.shard-indices.outputs.indices }}
            build-strategy: ${{ steps.build-strategy.outputs.strategy }}
            targets: ${{ steps.targets.outputs.targets }}
            artifact-scope: ${{ steps.targets.outputs.artifact-scope }}
            android-abis: ${{ steps.android-abis.outputs.abis }}
            android-abi-key: ${{ steps.android-abis.outputs.key-segment }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ inputs.node-version }}
            - uses: rnw-community/mobile-ci/actions/turbo-affected@v4.2.0 # v4.2.0
              id: affected
              with:
                  turbo-version: ${{ inputs.turbo-version }}
                  target-packages: ${{ inputs.target-packages }}
                  targets: ${{ inputs.targets }}
                  base-sha: ${{ github.event.pull_request.base.sha }}
                  always-affected: ${{ github.event_name != 'pull_request' }}
                  exempt-paths: ${{ inputs.exempt-paths }}
                  trigger-paths: ${{ inputs.trigger-paths }}
                  force-label: ${{ inputs.force-label }}

            # The test job's matrix.shard-index must exactly match
            # inputs.shard-count: fewer indices than shard-count silently
            # never runs the flows assigned to the missing indices (the
            # suite still reports success), and more indices than
            # shard-count fails run-maestro-android-redroid's own
            # [0, shard-count) bounds check. A hard-coded matrix can only
            # ever match one specific shard-count, so derive it here instead.
            - name: Compute shard indices
              id: shard-indices
              shell: bash
              env:
                  SHARD_COUNT: ${{ inputs.shard-count }}
                  TARGETS: ${{ inputs.targets }}
              run: |
                  set -euo pipefail
                  if [ "$SHARD_COUNT" -lt 1 ]; then
                    echo "::error::shard-count must be >= 1, got $SHARD_COUNT."
                    exit 1
                  fi
                  target_count=$(jq 'length' <<< "$TARGETS")
                  total_jobs=$(( target_count * SHARD_COUNT ))
                  if [ "$total_jobs" -gt 256 ]; then
                    echo "::error::targets ($target_count) x shard-count ($SHARD_COUNT) = $total_jobs test jobs, exceeding GitHub Actions' 256-job matrix limit."
                    exit 1
                  fi
                  indices=$(seq 0 $((SHARD_COUNT - 1)) | jq -R 'tonumber' | jq -sc .)
                  echo "indices=$indices" >> "$GITHUB_OUTPUT"

            - name: Resolve the Android ABIs
              id: android-abis
              shell: bash
              env:
                  ANDROID_ABIS: ${{ inputs.android-abis }}
                  ANDROID_DRIVER: ${{ inputs.android-driver }}
                  EMULATOR_ARCH: ${{ inputs.emulator-arch }}
                  GRADLE_ARGS: ${{ inputs.gradle-args }}
                  BUILD_ENV: ${{ inputs.build-env }}
              run: |
                  set -euo pipefail
                  fail() {
                    echo "::error::$1"
                    exit 1
                  }

                  pinned=''
                  pinned_by=''
                  pin() {
                    if [ -n "$pinned" ] && [ "$pinned" != "$1" ]; then
                      fail "reactNativeArchitectures is pinned to '$pinned' by $pinned_by and to '$1' by $2. Gradle would build one set of ABIs while the native key describes another; pin it once."
                    fi
                    pinned="$1"
                    pinned_by="$2"
                  }

                  normalized_gradle_args="${GRADLE_ARGS//$'\n'/ }"
                  normalized_gradle_args="${normalized_gradle_args//$'\r'/ }"
                  read -r -a gradle_args <<< "$normalized_gradle_args"
                  for arg in ${gradle_args[@]+"${gradle_args[@]}"}; do
                    case "$arg" in
                      -PreactNativeArchitectures=*) pin "${arg#*=}" gradle-args ;;
                    esac
                  done
                  while IFS= read -r line; do
                    case "$line" in
                      ORG_GRADLE_PROJECT_reactNativeArchitectures=*) pin "${line#*=}" build-env ;;
                    esac
                  done <<< "$BUILD_ENV"

                  case "$ANDROID_ABIS" in
                    auto)
                      if [ -n "$pinned" ]; then
                        abis=''
                        echo "android-abis is auto and $pinned_by already pins reactNativeArchitectures to '$pinned'; it is left to $pinned_by."
                      else
                        case "$ANDROID_DRIVER" in
                          avd) abis="$EMULATOR_ARCH" ;;
                          redroid) abis=arm64-v8a ;;
                          device-cloud) fail "android-abis is auto but android-driver is device-cloud, whose device architecture this workflow cannot see, so no ABI follows from it. Set android-abis explicitly to the ABIs Device Cloud's devices run (and pass seed-native-cache.yml the same value, or the warm-up publishes under another key)." ;;
                          *) fail "android-abis is auto but android-driver '$ANDROID_DRIVER' is neither 'avd' nor 'redroid', so no ABI follows from it. Set android-abis explicitly." ;;
                        esac
                      fi
                      ;;
                    '')
                      abis=''
                      ;;
                    *)
                      abis="$ANDROID_ABIS"
                      if [ -n "$pinned" ] && [ "$pinned" != "$abis" ]; then
                        fail "android-abis is '$abis' but $pinned_by pins reactNativeArchitectures to '$pinned'. Gradle would build one set of ABIs while the native key describes another; drop one of the two."
                      fi
                      ;;
                  esac

                  if [ -n "$abis" ]; then
                    IFS=, read -r -a abi_list <<< "$abis"
                    case "$abis" in
                      ,*|*,|*,,*) abi_list=('') ;;
                    esac
                    for abi in "${abi_list[@]}"; do
                      case "$abi" in
                        armeabi-v7a|arm64-v8a|x86|x86_64) ;;
                        *) fail "android-abis resolved to '$abis', which is not a comma-separated list of armeabi-v7a, arm64-v8a, x86 and x86_64 without spaces." ;;
                      esac
                    done
                  fi

                  built="${abis:-$pinned}"
                  key_segment=''
                  if [ -n "$built" ]; then
                    key_segment="-abi-$built"
                  fi
                  echo "Android ABIs: ${built:-every ABI the project declares}"
                  {
                    echo "abis=$abis"
                    echo "key-segment=$key_segment"
                  } >> "$GITHUB_OUTPUT"

            - name: Resolve the build strategy
              id: build-strategy
              shell: bash
              env:
                  REQUESTED_STRATEGY: ${{ inputs.build-strategy }}
                  NATIVE_BUILD_LABEL: ${{ inputs.native-build-label }}
                  PULL_REQUEST_LABELS: ${{ github.event_name == 'pull_request' && toJSON(github.event.pull_request.labels.*.name) || '[]' }}
              run: |
                  set -euo pipefail
                  case "$REQUESTED_STRATEGY" in
                    auto|repack|native) ;;
                    *)
                      echo "::error::build-strategy must be 'auto', 'repack' or 'native'; got '$REQUESTED_STRATEGY'."
                      exit 1
                      ;;
                  esac

                  strategy="$REQUESTED_STRATEGY"
                  labelled=false
                  if [ -n "$NATIVE_BUILD_LABEL" ]; then
                    labelled=$(jq -r --arg label "$NATIVE_BUILD_LABEL" 'map(select(. == $label)) | length > 0' <<< "$PULL_REQUEST_LABELS")
                  fi

                  if [ "$labelled" = 'true' ]; then
                    if [ "$REQUESTED_STRATEGY" = 'repack' ]; then
                      echo "::error::build-strategy is 'repack', which forbids compiling native code, but this pull request carries the '$NATIVE_BUILD_LABEL' label, which demands it. Remove one of the two rather than letting the workflow pick a winner."
                      exit 1
                    fi
                    strategy=native
                    echo "::notice::'$NATIVE_BUILD_LABEL' is set on this pull request, so native code is compiled instead of a published base being repacked. No base binary is published by this run."
                  fi

                  if [ "$strategy" = 'native' ]; then
                    echo "::warning::This run compiles native code for every target. That is the escape hatch, not the norm: it takes a full native build slot a repack would not have needed. See docs/repack.md."
                  fi

                  echo "strategy=$strategy" >> "$GITHUB_OUTPUT"
                  echo "Build strategy: $strategy (requested '$REQUESTED_STRATEGY')."

            - name: Resolve each target's flows, quarantine and build strategy
              id: targets
              shell: bash
              env:
                  TARGETS: ${{ inputs.targets }}
                  FLOWS_DIR: ${{ inputs.flows-dir }}
                  TOLERATE_TEST_FAILURES: ${{ inputs.tolerate-test-failures }}
                  REQUESTED_STRATEGY: ${{ inputs.build-strategy }}
                  NATIVE_BUILD_LABEL: ${{ inputs.native-build-label }}
                  PULL_REQUEST_LABELS: ${{ github.event_name == 'pull_request' && toJSON(github.event.pull_request.labels.*.name) || '[]' }}
                  CALL_SCOPE: ${{ inputs.call-scope }}
              run: |
                  set -euo pipefail
                  if [ -n "$CALL_SCOPE" ] && ! printf '%s\n' "$CALL_SCOPE" | grep -Eqx '[A-Za-z0-9._]+(-[A-Za-z0-9._]+)*'; then
                    echo "::error::call-scope '$CALL_SCOPE' must be letters, digits, '.' and '_', with single '-' only between them, so no two calls' artifact names can collide."
                    exit 1
                  fi
                  labelled=false
                  if [ -n "$NATIVE_BUILD_LABEL" ]; then
                    labelled=$(jq -r --arg label "$NATIVE_BUILD_LABEL" 'map(select(. == $label)) | length > 0' <<< "$PULL_REQUEST_LABELS")
                  fi
                  jq_error="$RUNNER_TEMP/resolve-targets.err"
                  if ! targets="$(jq -c --arg flows "$FLOWS_DIR" --argjson tolerate "$TOLERATE_TEST_FAILURES" \
                    --arg strategy "$REQUESTED_STRATEGY" --argjson labelled "$labelled" --arg label "$NATIVE_BUILD_LABEL" '
                    if type != "array" or length == 0 then error("targets must be a non-empty JSON array of objects") else . end
                    | map(
                        if type != "object" then error("every targets entry must be an object; got \(tojson)") else . end
                        | (if has("flowsDir") then . else .flowsDir = $flows end)
                        | if (.flowsDir | type) != "string" or .flowsDir == "" then error("target \(.name | tojson) has no flowsDir and the flows-dir input is empty") else . end
                        | (if has("tolerateTestFailures") then . else .tolerateTestFailures = $tolerate end)
                        | if (.tolerateTestFailures | type) != "boolean" then error("target \(.name | tojson) tolerateTestFailures must be true or false; got \(.tolerateTestFailures | tojson)") else . end
                        | (if has("buildStrategy") then . else .buildStrategy = $strategy end)
                        | if (.buildStrategy | IN("auto", "repack", "native") | not) then error("target \(.name | tojson) buildStrategy must be \"auto\", \"repack\" or \"native\"; got \(.buildStrategy | tojson)") else . end
                        | if $labelled and .buildStrategy == "repack" then error("target \(.name | tojson) has buildStrategy repack, which forbids compiling native code, but this pull request carries the \"\($label)\" label, which demands it. Remove one of the two rather than letting the workflow pick a winner.") else . end
                        | if $labelled then .buildStrategy = "native" else . end)' \
                    <<< "$TARGETS" 2> "$jq_error")"; then
                    echo "::error::$(sed -E 's/^jq: error \(at [^)]*\): //' "$jq_error")"
                    exit 1
                  fi
                  native="$(jq -r '[.[] | select(.buildStrategy == "native") | .name] | join(", ")' <<< "$targets")"
                  if [ -n "$native" ]; then
                    echo "::notice::Compiled natively, never repacked: ${native}."
                  fi
                  {
                    echo "targets=$targets"
                    echo "artifact-scope=${CALL_SCOPE:+-$CALL_SCOPE-}"
                  } >> "$GITHUB_OUTPUT"


    plan:
        name: Plan the build strategy
        needs: detect
        if: needs.detect.outputs.affected == 'true'
        permissions:
            contents: read
            packages: read
            actions: read
        uses: rnw-community/mobile-ci/.github/workflows/expo-base-plan.yml@v4.2.0 # v4.2.0
        with:
            control-runner-labels: ${{ inputs.control-runner-labels }}
            runs-on-cache-bypass: ${{ inputs.runs-on-cache-bypass }}
            platform: android
            targets: ${{ needs.detect.outputs.targets }}
            build-strategy: ${{ needs.detect.outputs.build-strategy }}
            runner-labels: ${{ inputs.repack-runner-labels }}
            timeout-minutes: ${{ inputs.repack-timeout-minutes }}
            app-artifact-prefix: android-e2e-app${{ needs.detect.outputs.artifact-scope }}
            plan-artifact-prefix: android-e2e-plan${{ needs.detect.outputs.artifact-scope }}
            toolchain: cmdline-${{ inputs.cmdline-tools-version }}-${{ inputs.gradle-task }}${{ inputs.gradle-args != '' && format('-{0}', inputs.gradle-args) || '' }}${{ needs.detect.outputs.android-abi-key }}
            base-backend: ${{ inputs.base-backend }}
            base-flavor: ${{ inputs.base-flavor }}
            fingerprint-config: ${{ inputs.fingerprint-config }}
            fingerprint-env: ${{ inputs.fingerprint-env }}
            expo-fingerprint-version: ${{ inputs.expo-fingerprint-version }}
            repack-env: ${{ inputs.repack-env }}
            expect-config: ${{ inputs.expect-config }}
            repack-app-version: ${{ inputs.repack-app-version }}
            cmdline-tools-version: ${{ inputs.cmdline-tools-version }}
            android-build-tools-dir: ${{ inputs.android-build-tools-dir }}
            android-build-tools-version: ${{ inputs.android-build-tools-version }}
            android-keystore-path: ${{ inputs.android-keystore-path }}
            android-keystore-password: ${{ inputs.android-keystore-password }}
            android-keystore-key-alias: ${{ inputs.android-keystore-key-alias }}
            android-keystore-key-password: ${{ inputs.android-keystore-key-password }}
            node-version: ${{ inputs.node-version }}
            install-command: ${{ inputs.install-command }}
            enable-corepack: ${{ inputs.enable-corepack }}
            package-manager: ${{ inputs.package-manager }}
            build-command: ${{ inputs.build-command }}
            build-env: ${{ inputs.build-env }}
        secrets:
            build-secrets-env: ${{ secrets.build-secrets-env }}

    build:
        name: Build (${{ matrix.target.name }})
        needs: [detect, plan]
        if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.native-targets != '[]' }}
        runs-on: ${{ fromJSON(inputs.build-runner-labels != '' && inputs.build-runner-labels || inputs.runner-labels) }}
        timeout-minutes: ${{ inputs.build-timeout-minutes }}
        permissions:
            contents: read
            packages: write
            actions: read
        concurrency:
            group: ${{ (github.ref_name == github.event.repository.default_branch && matrix.target.buildStrategy != 'native') && format('expo-base-publish-{0}-android-{1}-{2}', github.repository, inputs.base-flavor, matrix.target.nativeKey) || format('expo-base-build-{0}-{1}-android{2}-{3}', github.run_id, github.run_attempt, needs.detect.outputs.artifact-scope, matrix.target.name) }}
            cancel-in-progress: false
        strategy:
            fail-fast: false
            matrix:
                target: ${{ fromJSON(needs.plan.outputs.native-targets) }}
        env:
            APP_DIR: ${{ matrix.target.appDir }}

        steps:
            - name: Apply RunsOn cache bypass
              uses: rnw-community/mobile-ci/actions/runs-on-cache-bypass@v4.2.0 # v4.2.0
              with:
                  enabled: ${{ inputs.runs-on-cache-bypass }}
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - name: Apply build-env
              if: inputs.build-env != ''
              shell: bash
              env:
                  BUILD_ENV: ${{ inputs.build-env }}
              run: |
                  set -euo pipefail
                  while IFS= read -r line; do
                    [ -z "$line" ] && continue
                    case "$line" in
                      *=*) ;;
                      *)
                        echo "::error::build-env line '$line' is missing '='; expected KEY=VALUE."
                        exit 1
                        ;;
                    esac
                    name="${line%%=*}"
                    case "$name" in
                      ''|[!A-Za-z_]*)
                        echo "::error::build-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    case "$name" in
                      *[!A-Za-z0-9_]*)
                        echo "::error::build-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    echo "$line" >> "$GITHUB_ENV"
                  done <<< "$BUILD_ENV"

            - name: Apply build-secrets-env
              uses: rnw-community/mobile-ci/actions/apply-secret-env@v4.2.0 # v4.2.0
              with:
                  env: ${{ secrets.build-secrets-env }}
                  label: build-secrets-env

            - name: Resolve package manager
              id: package-manager
              shell: bash
              env:
                  PACKAGE_MANAGER: ${{ inputs.package-manager }}
                  LOCKFILE_REQUIRED: 'true'
              run: |
                  set -euo pipefail
                  pm=''
                  case "$PACKAGE_MANAGER" in
                    '') ;;
                    yarn|pnpm|npm) pm="$PACKAGE_MANAGER" ;;
                    *)
                      echo "::error::package-manager must be '' (auto-detect), yarn, pnpm or npm; got '$PACKAGE_MANAGER'."
                      exit 1
                      ;;
                  esac
                  declared=''
                  declared_version=''
                  if { [ -z "$pm" ] || [ "$pm" = pnpm ]; } && [ -f package.json ]; then
                    if command -v jq >/dev/null 2>&1; then
                      declared_spec="$(jq -r '
                        (try (.devEngines.packageManager) catch null) as $raw
                        | (if ($raw | type) == "array" then ($raw[0] // null) else $raw end) as $de
                        | (if ($de | type) == "object" then [($de.name // ""), ($de.version // "")] else ["", ""] end) as $dev
                        | (if ((.packageManager // "") | type) == "string" and (.packageManager // "") != ""
                           then (.packageManager | if test("@") then [split("@")[0], (split("@")[1] | split("+")[0])] else [., ""] end)
                           else ["", ""] end) as $spec
                        | (if $dev[0] != "" then $dev[0] else $spec[0] end) as $name
                        | [$name,
                           (if $dev[0] != "" and $dev[1] != "" then $dev[1]
                            elif $spec[0] == $name then $spec[1]
                            else "" end)]
                        | @tsv' package.json)"
                      declared="$(printf '%s\n' "$declared_spec" | cut -f1)"
                      declared_version="$(printf '%s\n' "$declared_spec" | cut -f2)"
                    else
                      echo "::warning::jq is not installed on this runner, so package.json's packageManager / devEngines.packageManager fields cannot be read; falling back to root lockfile detection. Install jq, or set the package-manager input explicitly."
                    fi
                  fi
                  if [ -z "$pm" ] && [ -n "$declared" ]; then
                    case "$declared" in
                      yarn|pnpm|npm) pm="$declared" ;;
                      *)
                        echo "::error::package.json declares package manager '$declared', which is not yarn, pnpm or npm; set the package-manager input explicitly."
                        exit 1
                        ;;
                    esac
                  fi
                  if [ -z "$pm" ]; then
                    lockfiles=''
                    lockfile_count=0
                    if [ -f yarn.lock ]; then pm=yarn; lockfiles="${lockfiles}yarn.lock "; lockfile_count=$((lockfile_count + 1)); fi
                    if [ -f pnpm-lock.yaml ]; then pm=pnpm; lockfiles="${lockfiles}pnpm-lock.yaml "; lockfile_count=$((lockfile_count + 1)); fi
                    if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
                      pm=npm
                      lockfile_count=$((lockfile_count + 1))
                      if [ -f package-lock.json ]; then lockfiles="${lockfiles}package-lock.json "; fi
                      if [ -f npm-shrinkwrap.json ]; then lockfiles="${lockfiles}npm-shrinkwrap.json "; fi
                    fi
                    if [ "$lockfile_count" -eq 0 ]; then
                      echo "::error::Cannot resolve the package manager: package.json declares none and there is no yarn.lock, pnpm-lock.yaml, package-lock.json or npm-shrinkwrap.json at the repository root. Set the package-manager input explicitly."
                      exit 1
                    fi
                    if [ "$lockfile_count" -gt 1 ]; then
                      echo "::error::Cannot resolve the package manager: multiple root lockfiles found (${lockfiles% }). Set the package-manager input explicitly."
                      exit 1
                    fi
                  fi
                  if [ "$pm" = pnpm ] && { [ "$declared" != pnpm ] || [ -z "$declared_version" ]; }; then
                    echo "::error::Resolved package manager is pnpm, but no pnpm version is readable from the repository-root package.json. pnpm/action-setup takes the version from 'packageManager: pnpm@<version>' or 'devEngines.packageManager: {name: pnpm, version: <range>}' - add one of those, and make sure jq is installed on this runner so the workflow can read it."
                    exit 1
                  fi
                  if [ -n "$LOCKFILE_REQUIRED" ]; then
                    case "$pm" in
                      yarn) wanted='yarn.lock' ;;
                      pnpm) wanted='pnpm-lock.yaml' ;;
                      *) wanted='package-lock.json npm-shrinkwrap.json' ;;
                    esac
                    found=''
                    for candidate in $wanted; do
                      if [ -f "$candidate" ]; then found="$candidate"; break; fi
                    done
                    if [ -z "$found" ]; then
                      echo "::error::Resolved package manager is $pm, but this job caches JS dependencies with actions/setup-node and the repository root has none of: $wanted. Commit the lockfile, or set the package-manager input to the manager whose lockfile this repository actually has."
                      exit 1
                    fi
                  fi
                  echo "Resolved package manager: $pm"
                  echo "pm=$pm" >> "$GITHUB_OUTPUT"

            - name: Setup pnpm
              if: steps.package-manager.outputs.pm == 'pnpm'
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ inputs.node-version }}

            - name: Enable corepack
              if: inputs.enable-corepack && steps.package-manager.outputs.pm != 'pnpm'
              shell: bash
              run: corepack enable

            - name: Restore package manager cache
              id: pm-cache
              uses: rnw-community/mobile-ci/actions/node-pm-cache@v4.2.0 # v4.2.0
              with:
                  package-manager: ${{ steps.package-manager.outputs.pm }}

            - name: Install dependencies
              shell: bash
              env:
                  INSTALL_COMMAND: ${{ inputs.install-command }}
              run: eval "$INSTALL_COMMAND"

            - name: Save package manager cache
              if: github.event_name != 'pull_request' && steps.pm-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              timeout-minutes: 10
              continue-on-error: true
              with:
                  path: ${{ steps.pm-cache.outputs.path }}
                  key: ${{ steps.pm-cache.outputs.cache-key }}

            - name: Build workspace JS dependencies
              if: inputs.build-command != ''
              shell: bash
              env:
                  BUILD_COMMAND: ${{ inputs.build-command }}
              run: eval "$BUILD_COMMAND"

            - name: Generate native project
              if: matrix.target.prebuildCommand != ''
              working-directory: ${{ matrix.target.appDir }}
              shell: bash
              env:
                  PREBUILD_COMMAND: ${{ matrix.target.prebuildCommand }}
              run: eval "$PREBUILD_COMMAND"

            - name: build-android-app
              id: build
              uses: rnw-community/mobile-ci/actions/build-android-app@v4.2.0 # v4.2.0
              with:
                  app-dir: ${{ matrix.target.appDir }}
                  cmdline-tools-version: ${{ inputs.cmdline-tools-version }}
                  gradle-task: ${{ inputs.gradle-task }}
                  gradle-args: ${{ inputs.gradle-args }}
                  android-abis: ${{ needs.detect.outputs.android-abis }}
                  android-sdk-cache-save: 'false'
                  output-dir: .ci-cache/android-native-app/${{ matrix.target.name }}
                  gradle-cache-key: gradle-${{ matrix.target.name }}-${{ runner.os }}-${{ hashFiles(format('{0}/android/gradle/wrapper/gradle-wrapper.properties', matrix.target.appDir), format('{0}/android/**/*.gradle*', matrix.target.appDir), format('{0}/android/gradle/*.versions.toml', matrix.target.appDir), 'yarn.lock', 'pnpm-lock.yaml', 'package-lock.json', 'npm-shrinkwrap.json') }}
                  gradle-cache-restore-keys: |
                      gradle-${{ matrix.target.name }}-${{ runner.os }}-

            - name: Upload the APK for the test jobs
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: android-e2e-app${{ needs.detect.outputs.artifact-scope }}-${{ matrix.target.name }}
                  path: .ci-cache/android-native-app/${{ matrix.target.name }}/app-release.apk
                  if-no-files-found: error
                  retention-days: 1

            - name: expo-base-binary (publish)
              if: github.ref_name == github.event.repository.default_branch && matrix.target.buildStrategy != 'native'
              uses: rnw-community/mobile-ci/actions/expo-base-binary@v4.2.0 # v4.2.0
              with:
                  mode: publish
                  platform: android
                  flavor: ${{ inputs.base-flavor }}
                  key: ${{ matrix.target.nativeKey }}
                  backend: ${{ inputs.base-backend }}
                  path: .ci-cache/android-native-app/${{ matrix.target.name }}/app-release.apk

            - name: Report that this key is now warm
              if: github.ref_name == github.event.repository.default_branch && matrix.target.buildStrategy != 'native'
              shell: bash
              env:
                  TARGET_NAME: ${{ matrix.target.name }}
                  NATIVE_KEY: ${{ matrix.target.nativeKey }}
              run: |
                  echo "### Android ${TARGET_NAME}: base binary published for native key ${NATIVE_KEY}" >> "$GITHUB_STEP_SUMMARY"
                  echo 'Pull requests on this native surface now repack instead of running Gradle.' >> "$GITHUB_STEP_SUMMARY"

            - name: Save the Android SDK
              if: github.event_name != 'pull_request' && steps.build.outcome == 'success' && steps.build.outputs.android-sdk-cache-hit != 'true'
              continue-on-error: true
              timeout-minutes: 10
              uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: ${{ steps.build.outputs.android-sdk-cache-paths }}
                  key: ${{ steps.build.outputs.android-sdk-cache-key }}

    test:
        name: Maestro shard ${{ matrix.shard-index }} (${{ matrix.target.name }})
        needs: [detect, plan, build]
        if: ${{ !cancelled() && needs.detect.outputs.affected == 'true' && needs.plan.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
        runs-on: ${{ fromJSON(inputs.android-driver == 'device-cloud' && (inputs.device-cloud-runner-labels != '' && inputs.device-cloud-runner-labels || inputs.repack-runner-labels) || (inputs.test-runner-labels != '' && inputs.test-runner-labels || inputs.runner-labels)) }}
        timeout-minutes: ${{ inputs.test-timeout-minutes }}
        strategy:
            fail-fast: false
            matrix:
                target: ${{ fromJSON(needs.detect.outputs.targets) }}
                shard-index: ${{ inputs.android-driver == 'device-cloud' && fromJSON('[0]') || fromJSON(needs.detect.outputs.shard-indices) }}

        steps:
            - name: Apply RunsOn cache bypass
              uses: rnw-community/mobile-ci/actions/runs-on-cache-bypass@v4.2.0 # v4.2.0
              with:
                  enabled: ${{ inputs.runs-on-cache-bypass }}
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
              with:
                  name: android-e2e-app${{ needs.detect.outputs.artifact-scope }}-${{ matrix.target.name }}
                  path: .ci-artifacts/android-e2e-app${{ needs.detect.outputs.artifact-scope }}-${{ matrix.target.name }}

            - name: Validate the test driver
              shell: bash
              env:
                  DRIVER: ${{ inputs.android-driver }}
                  DRIVER_INPUT: android-driver
                  LOCAL_DRIVERS: 'avd redroid'
                  HAS_DEVICE_CLOUD_API_KEY: ${{ secrets.device-cloud-api-key != '' }}
                  PRE_RUN_FLOW: ${{ inputs.pre-run-flow }}
                  FLOW_RECOVERY_FLOW: ${{ inputs.flow-recovery-flow }}
                  PRE_TEST_COMMAND: ${{ inputs.pre-test-command }}
                  PRE_FLOW_COMMAND: ${{ inputs.pre-flow-command }}
                  SHARD_COUNT: ${{ inputs.shard-count }}
                  SHARD_MANIFEST_DIR: ${{ inputs.shard-manifest-dir }}
              run: |
                  set -euo pipefail
                  known=0
                  for candidate in $LOCAL_DRIVERS device-cloud; do
                    if [ "$DRIVER" = "$candidate" ]; then
                      known=1
                    fi
                  done
                  if [ "$known" -ne 1 ]; then
                    echo "::error::Unsupported $DRIVER_INPUT '$DRIVER'; expected one of: $LOCAL_DRIVERS device-cloud. Every test step is gated on an exact match, so an unknown value would run zero flows and still pass."
                    exit 1
                  fi
                  [ "$DRIVER" = device-cloud ] || exit 0
                  if [ "$HAS_DEVICE_CLOUD_API_KEY" != true ]; then
                    echo "::error::$DRIVER_INPUT is device-cloud but the device-cloud-api-key secret is empty. Pass it in the calling job's secrets: block."
                    exit 1
                  fi
                  unsupported=''
                  [ -z "$PRE_RUN_FLOW" ] || unsupported="$unsupported pre-run-flow"
                  [ -z "$FLOW_RECOVERY_FLOW" ] || unsupported="$unsupported flow-recovery-flow"
                  [ -z "$PRE_TEST_COMMAND" ] || unsupported="$unsupported pre-test-command"
                  [ -z "$PRE_FLOW_COMMAND" ] || unsupported="$unsupported pre-flow-command"
                  if [ -n "$unsupported" ]; then
                    echo "::error::$DRIVER_INPUT device-cloud cannot honour:${unsupported}. Each runs against a device this runner boots, and Device Cloud runs the flows remotely, so it would silently never run. Unset it, or use a local driver."
                    exit 1
                  fi
                  if [ "$SHARD_COUNT" != 1 ] || [ -n "$SHARD_MANIFEST_DIR" ]; then
                    echo "::notice::Device Cloud runs the flows in parallel itself, so the device-cloud driver submits every selected flow once per target as shard 0; shard-count and shard-manifest-dir do not apply."
                  fi

            # The test steps below are gated on an exact driver match; an
            # unrecognized android-driver value would otherwise skip them all
            # silently and let this job (and the status job that gates on its
            # result) report success having run zero Maestro flows.
            - name: Validate android-driver against this runner
              shell: bash
              env:
                  ANDROID_DRIVER: ${{ inputs.android-driver }}
              run: |
                  case "$ANDROID_DRIVER" in
                    redroid|avd|device-cloud) ;;
                    *)
                      echo "::error::Unsupported android-driver '$ANDROID_DRIVER'; expected 'redroid', 'avd' or 'device-cloud'."
                      exit 1
                      ;;
                  esac
                  [ "$ANDROID_DRIVER" = avd ] || exit 0
                  [ "$(uname -s)" = Linux ] || exit 0
                  arch="$(uname -m)"
                  if [ "$arch" != x86_64 ]; then
                    echo "::error::android-driver 'avd' needs an x86_64 Linux runner; this one is '$arch'. Google publishes no linux-aarch64 Android emulator, so no tuning makes an AVD boot here. Either point runner-labels/test-runner-labels at an x86_64 Linux KVM host (this workflow's default), or pass android-driver: redroid for a binder_linux/privileged-docker pool."
                    exit 1
                  fi
                  if [ ! -e /dev/kvm ]; then
                    echo "::error::android-driver 'avd' needs /dev/kvm on the runner; it is absent here. Without it the emulator falls back to software rendering and times out instead of failing clearly. Expose /dev/kvm to this runner, or pass android-driver: redroid with runner-labels naming a Redroid-capable pool."
                    exit 1
                  fi

            - name: Apply maestro-secrets-env
              id: maestro-secrets
              uses: rnw-community/mobile-ci/actions/apply-secret-env@v4.2.0 # v4.2.0
              with:
                  env: ${{ secrets.maestro-secrets-env }}
                  label: maestro-secrets-env
                  allow-multiline: false
                  append-to: ${{ inputs.maestro-env }}

            - name: run-maestro-android-redroid
              id: run-maestro-android-redroid
              continue-on-error: ${{ matrix.target.tolerateTestFailures }}
              if: inputs.android-driver == 'redroid'
              uses: rnw-community/mobile-ci/actions/run-maestro-android-redroid@v4.2.0 # v4.2.0
              with:
                  image: ${{ inputs.redroid-image }}
                  container-name: redroid-e2e${{ needs.detect.outputs.artifact-scope }}-${{ strategy.job-index }}
                  apk-path: .ci-artifacts/android-e2e-app${{ needs.detect.outputs.artifact-scope }}-${{ matrix.target.name }}/app-release.apk
                  app-id: ${{ matrix.target.appId }}
                  flows-dir: ${{ matrix.target.flowsDir }}
                  flows-max-depth: ${{ inputs.flows-max-depth }}
                  flows-name-pattern: ${{ inputs.flows-name-pattern }}
                  flows-exclude-pattern: ${{ inputs.flows-exclude-pattern }}
                  shard-manifest-dir: ${{ inputs.shard-manifest-dir }}
                  shard-index: ${{ matrix.shard-index }}
                  shard-count: ${{ inputs.shard-count }}
                  pre-run-flow: ${{ inputs.pre-run-flow }}
                  flow-recovery-flow: ${{ inputs.flow-recovery-flow }}
                  pre-test-command: ${{ inputs.pre-test-command }}
                  pre-flow-command: ${{ inputs.pre-flow-command }}
                  app-warm-seconds: ${{ inputs.app-warm-seconds }}
                  maestro-env: ${{ steps.maestro-secrets.outputs.lines }}
                  redact-env-names: ${{ steps.maestro-secrets.outputs.names }}
                  maestro-config: ${{ inputs.maestro-config }}
                  include-tags: ${{ inputs.include-tags }}
                  exclude-tags: ${{ inputs.exclude-tags }}
                  junit-report: ${{ inputs.junit-report }}
                  flow-retries: ${{ inputs.flow-retries }}
                  maestro-version: ${{ inputs.maestro-version }}
                  memory: ${{ inputs.redroid-memory }}
                  cpus: ${{ inputs.redroid-cpus }}
                  prewarm-manifest-path: ${{ inputs.redroid-prewarm-manifest-path }}
                  boot-timeout-seconds: ${{ inputs.redroid-boot-timeout-seconds }}
                  artifacts-dir: ${{ github.workspace }}/artifacts/maestro-android-${{ matrix.target.name }}-${{ matrix.shard-index }}
                  artifact-name: maestro-android${{ needs.detect.outputs.artifact-scope }}-${{ matrix.target.name }}-shard-${{ matrix.shard-index }}
                  retention-days: ${{ inputs.artifact-retention-days }}

            - name: run-maestro-android
              id: run-maestro-android
              continue-on-error: ${{ matrix.target.tolerateTestFailures }}
              if: inputs.android-driver == 'avd'
              uses: rnw-community/mobile-ci/actions/run-maestro-android@v4.2.0 # v4.2.0
              with:
                  apk-path: .ci-artifacts/android-e2e-app${{ needs.detect.outputs.artifact-scope }}-${{ matrix.target.name }}/app-release.apk
                  app-id: ${{ matrix.target.appId }}
                  flows-dir: ${{ matrix.target.flowsDir }}
                  flows-max-depth: ${{ inputs.flows-max-depth }}
                  flows-name-pattern: ${{ inputs.flows-name-pattern }}
                  flows-exclude-pattern: ${{ inputs.flows-exclude-pattern }}
                  shard-manifest-dir: ${{ inputs.shard-manifest-dir }}
                  shard-index: ${{ matrix.shard-index }}
                  shard-count: ${{ inputs.shard-count }}
                  pre-run-flow: ${{ inputs.pre-run-flow }}
                  flow-recovery-flow: ${{ inputs.flow-recovery-flow }}
                  pre-test-command: ${{ inputs.pre-test-command }}
                  pre-flow-command: ${{ inputs.pre-flow-command }}
                  app-warm-seconds: ${{ inputs.app-warm-seconds }}
                  maestro-env: ${{ steps.maestro-secrets.outputs.lines }}
                  redact-env-names: ${{ steps.maestro-secrets.outputs.names }}
                  maestro-config: ${{ inputs.maestro-config }}
                  include-tags: ${{ inputs.include-tags }}
                  exclude-tags: ${{ inputs.exclude-tags }}
                  junit-report: ${{ inputs.junit-report }}
                  flow-retries: ${{ inputs.flow-retries }}
                  infra-retries: ${{ inputs.infra-retries }}
                  settle-before-flow: ${{ inputs.settle-before-flow }}
                  maestro-version: ${{ inputs.maestro-version }}
                  api-level: ${{ inputs.emulator-api-level }}
                  target: ${{ inputs.emulator-target }}
                  arch: ${{ inputs.emulator-arch }}
                  profile: ${{ inputs.emulator-profile }}
                  ram-size: ${{ inputs.emulator-ram-size }}
                  heap-size: ${{ inputs.emulator-heap-size }}
                  cores: ${{ inputs.emulator-cores }}
                  emulator-slots-dir: ${{ inputs.emulator-slots-dir }}
                  emulator-slot-timeout-minutes: ${{ inputs.emulator-slot-timeout-minutes }}
                  artifacts-dir: ${{ github.workspace }}/artifacts/maestro-android-${{ matrix.target.name }}-${{ matrix.shard-index }}
                  artifact-name: maestro-android${{ needs.detect.outputs.artifact-scope }}-${{ matrix.target.name }}-shard-${{ matrix.shard-index }}
                  retention-days: ${{ inputs.artifact-retention-days }}

            - name: run-maestro-device-cloud
              id: run-maestro-device-cloud
              continue-on-error: ${{ matrix.target.tolerateTestFailures }}
              if: inputs.android-driver == 'device-cloud'
              uses: rnw-community/mobile-ci/actions/run-maestro-device-cloud@v4.2.0 # v4.2.0
              with:
                  platform: android
                  app-path: .ci-artifacts/android-e2e-app${{ needs.detect.outputs.artifact-scope }}-${{ matrix.target.name }}/app-release.apk
                  api-key: ${{ secrets.device-cloud-api-key }}
                  cli-version: ${{ inputs.device-cloud-cli-version }}
                  node-version: ${{ inputs.node-version }}
                  flows-dir: ${{ matrix.target.flowsDir }}
                  flows-max-depth: ${{ inputs.flows-max-depth }}
                  flows-name-pattern: ${{ inputs.flows-name-pattern }}
                  flows-exclude-pattern: ${{ inputs.flows-exclude-pattern }}
                  include-tags: ${{ inputs.include-tags }}
                  exclude-tags: ${{ inputs.exclude-tags }}
                  maestro-config: ${{ inputs.maestro-config }}
                  maestro-env: ${{ steps.maestro-secrets.outputs.lines }}
                  maestro-version: ${{ inputs.maestro-version }}
                  retries: ${{ inputs.flow-retries }}
                  android-api-level: ${{ inputs.device-cloud-android-api-level }}
                  android-device: ${{ inputs.device-cloud-android-device }}
                  junit-report: ${{ inputs.junit-report }}
                  run-name: ${{ github.repository }}@${{ github.sha }} android ${{ matrix.target.name }}
                  artifacts-dir: ${{ github.workspace }}/artifacts/maestro-android-${{ matrix.target.name }}-${{ matrix.shard-index }}
                  artifact-name: maestro-android${{ needs.detect.outputs.artifact-scope }}-${{ matrix.target.name }}-shard-${{ matrix.shard-index }}
                  retention-days: ${{ inputs.artifact-retention-days }}
                  redact-env-names: ${{ steps.maestro-secrets.outputs.names }}

            - name: Report a tolerated Maestro failure
              if: steps.run-maestro-android-redroid.outcome == 'failure' || steps.run-maestro-android.outcome == 'failure' || steps.run-maestro-device-cloud.outcome == 'failure'
              shell: bash
              env:
                  TARGET_NAME: ${{ matrix.target.name }}
              run: echo "::warning::Maestro failed for target '${TARGET_NAME}' and tolerate-test-failures kept the job green; this failure is quarantined, not fixed."

    status:
        name: Android Maestro E2E result
        needs: [detect, plan, build, test]
        if: always()
        runs-on: ${{ fromJSON(inputs.control-runner-labels) }}
        outputs:
            result: ${{ steps.report.outputs.result }}
        steps:
            - name: Report
              id: report
              shell: bash
              env:
                  DETECT_RESULT: ${{ needs.detect.result }}
                  DETECT_AFFECTED: ${{ needs.detect.outputs.affected }}
                  DETECT_FORCED: ${{ needs.detect.outputs.forced }}
                  FORCE_LABEL: ${{ inputs.force-label }}
                  PLAN_RESULT: ${{ needs.plan.result }}
                  NATIVE_TARGETS: ${{ needs.plan.outputs.native-targets }}
                  BUILD_RESULT: ${{ needs.build.result }}
                  TEST_RESULT: ${{ needs.test.result }}
              run: |
                  result=failed
                  trap 'echo "result=$result" >> "$GITHUB_OUTPUT"' EXIT
                  summary() {
                    printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
                  }
                  cancelled_hint() {
                    if [ "$1" = 'cancelled' ]; then
                      echo "::notice::A cancelled job result often means the job hit its timeout-minutes - check the job's duration against build-timeout-minutes/test-timeout-minutes before assuming external cancellation."
                    fi
                  }
                  if [ "$DETECT_RESULT" != "success" ]; then
                    echo "Detection job did not succeed (result: $DETECT_RESULT)."
                    summary "### Android Maestro E2E: failed (detect job result: $DETECT_RESULT)"
                    cancelled_hint "$DETECT_RESULT"
                    exit 1
                  fi
                  if [ "$DETECT_AFFECTED" != "true" ]; then
                    result=skipped
                    echo "::notice::Android Maestro E2E skipped: target packages untouched, so every build/test leg was skipped and zero Maestro flows ran. This is not a pass."
                    summary "### Android Maestro E2E: skipped — target packages untouched, zero Maestro flows ran (not a pass)"
                    exit 0
                  fi
                  if [ "$PLAN_RESULT" != "success" ]; then
                    echo "Plan job did not succeed (result: $PLAN_RESULT)."
                    summary "### Android Maestro E2E: failed (plan job result: $PLAN_RESULT)"
                    cancelled_hint "$PLAN_RESULT"
                    exit 1
                  fi
                  if [ "$BUILD_RESULT" = 'skipped' ] && [ "$NATIVE_TARGETS" != '[]' ]; then
                    echo "The native build was skipped while ${NATIVE_TARGETS} still needed one; a skipped build is not a build."
                    summary "### Android Maestro E2E: failed (native build skipped with targets still needing one)"
                    exit 1
                  fi
                  if [ "$BUILD_RESULT" != "success" ] && [ "$BUILD_RESULT" != 'skipped' ]; then
                    echo "Build job did not succeed (result: $BUILD_RESULT)."
                    summary "### Android Maestro E2E: failed (build job result: $BUILD_RESULT)"
                    cancelled_hint "$BUILD_RESULT"
                    exit 1
                  fi
                  if [ "$TEST_RESULT" != "success" ]; then
                    echo "Maestro suite did not succeed (result: $TEST_RESULT)."
                    summary "### Android Maestro E2E: failed (test job result: $TEST_RESULT)"
                    cancelled_hint "$TEST_RESULT"
                    exit 1
                  fi
                  if [ "$DETECT_FORCED" = 'true' ]; then
                    result=passed
                    echo "Maestro suite passed (forced by the '${FORCE_LABEL}' label)."
                    summary "### Android Maestro E2E: passed (forced by the \`${FORCE_LABEL}\` label)"
                    exit 0
                  fi
                  result=passed
                  echo "Maestro suite passed."
                  summary "### Android Maestro E2E: passed"
