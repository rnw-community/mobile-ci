name: expo-base-plan

on:
    workflow_call:
        inputs:
            control-runner-labels:
                description: >-
                    JSON array of runner labels for the lightweight control jobs
                    (detect, status, collect, validate-manifest, cancel-queued-runs)
                    that only run Node and the GitHub API and need no self-hosted
                    hardware. Override when the org has no GitHub-hosted runners,
                    for example an ephemeral RunsOn label set.
                required: false
                type: string
                default: '["ubuntu-latest"]'
            runs-on-cache-bypass:
                description: >-
                    Run a SHA-pinned runs-on/action before any artifact traffic when
                    the job lands on a RunsOn runner started with extras=s3-cache,
                    whose cache proxy takes over the Actions results URL and makes
                    actions/upload-artifact and download-artifact fail. A no-op on
                    every other runner. Off by default.
                required: false
                type: boolean
                default: false
            platform:
                description: '`ios` or `android`.'
                type: string
                required: true
            targets:
                description: >-
                    JSON array of build targets. Each element is passed through to
                    the caller's native build job unchanged, with the native key
                    added as nativeKey. A target with "forceNative": true is handed
                    to the native build even when its base exists; only a caller
                    with repack false may set it.
                type: string
                required: true
            build-strategy:
                description: >-
                    `auto` (look up a base and repack it when one exists),
                    `repack` (refuse to hand any target to a native build), or
                    `native` (compute the key, look up nothing, hand every target
                    to the native build). Resolved by the caller, never here.
                type: string
                required: false
                default: auto
            repack:
                description: >-
                    Repack the base when one is found (the default). The warm-up
                    sets it false: it is looking for a key with no base, not
                    producing this commit's binary, and a repack nobody consumes
                    is a repack nobody checked.
                type: boolean
                required: false
                default: true
            runner-labels:
                description: >-
                    JSON array of self-hosted runner labels. A repack needs Node, a JDK
                    on android, and no simulator, no Xcode and no Mac slot. The default
                    is the 2 vCPU / 4 GiB x86_64 Linux pool without /dev/kvm
                    (trf-linux-amd64-2x4), so these jobs never queue on the scarce KVM
                    emulator lane (#169). Keep it an x86_64 pool: Google publishes
                    Android build-tools for x86_64 Linux only. Move it to the 4x8 pool
                    if bundling the app's JavaScript needs more than about 3 GiB.
                type: string
                required: false
                default: '["self-hosted","trf-linux-amd64-2x4"]'
            timeout-minutes:
                type: number
                required: false
                default: 30
            app-artifact-prefix:
                description: >-
                    Artifact-name prefix the caller's test/capture job already
                    downloads the app under; the repacked binary is uploaded as
                    `<prefix>-<target name>`.
                type: string
                required: true
            plan-artifact-prefix:
                description: Artifact-name prefix for this workflow's own per-target plan files.
                type: string
                required: true
            toolchain:
                description: >-
                    Pinned toolchain identity folded into the native key -
                    `xcode-<version>-<build>` on ios, `cmdline-<version>` on
                    android. A target's own workspace and scheme are appended to
                    it, so two targets that share an app directory and a
                    fingerprint but build different schemes never share a base.
                type: string
                required: false
                default: ''
            ios-simulator-archs:
                description: >-
                    `arm64` (default) or `x86_64`: the Simulator slice an ios base is
                    built for. Folded into the native key by expo-native-key so the
                    two never share a base. Ignored on android.
                type: string
                required: false
                default: arm64
            base-backend:
                type: string
                required: false
                default: ghcr
            base-flavor:
                type: string
                required: false
                default: e2e
            fingerprint-config:
                type: string
                required: false
                default: fingerprint.config.js
            fingerprint-env:
                type: string
                required: false
                default: ''
            expo-fingerprint-version:
                type: string
                required: false
                default: '0.20.6'
            repack-env:
                type: string
                required: false
                default: ''
            expect-config:
                type: string
                required: false
                default: ''
            repack-app-version:
                type: string
                required: false
                default: '0.7.2'
            cmdline-tools-version:
                description: Android cmdline-tools version the repack job installs. Ignored on ios.
                type: string
                required: false
                default: '12266719'
            android-build-tools-dir:
                type: string
                required: false
                default: ''
            android-build-tools-version:
                type: string
                required: false
                default: '35.0.0'
            android-keystore-path:
                description: Keystore, relative to a target's appDir, the repacked APK is signed with.
                type: string
                required: false
                default: android/app/debug.keystore
            android-keystore-password:
                type: string
                required: false
                default: android
            android-keystore-key-alias:
                type: string
                required: false
                default: androiddebugkey
            android-keystore-key-password:
                type: string
                required: false
                default: android
            node-version:
                type: string
                required: false
                default: 22.x
            install-command:
                type: string
                required: false
                default: yarn install --immutable
            enable-corepack:
                type: boolean
                required: false
                default: true
            package-manager:
                type: string
                required: false
                default: ''
            build-command:
                type: string
                required: false
                default: ''
            build-env:
                type: string
                required: false
                default: ''
        secrets:
            build-secrets-env:
                description: >-
                    Masked newline-separated KEY=VALUE entries (KEY<<DELIMITER for
                    a multi-line value) exported for the install, build-command,
                    fingerprint and repack steps. Only a SHA-256 digest of them
                    enters the native key, so the caller's warm-up must pass the
                    same secret or the two never agree on a key.
                required: false
        outputs:
            native-targets:
                description: >-
                    JSON array of the targets whose native key has no published
                    base, each carrying its nativeKey. `[]` means no expensive
                    runner has to be claimed at all.
                value: ${{ jobs.collect.outputs.targets }}

permissions:
    contents: read
    packages: read
    actions: read

jobs:
    plan:
        name: Plan (${{ matrix.target.name }})
        runs-on: ${{ fromJSON(inputs.runner-labels) }}
        timeout-minutes: ${{ inputs.timeout-minutes }}
        strategy:
            fail-fast: false
            matrix:
                target: ${{ fromJSON(inputs.targets) }}
        env:
            APP_DIR: ${{ matrix.target.appDir }}

        steps:
            - name: Apply RunsOn cache bypass
              uses: rnw-community/mobile-ci/actions/runs-on-cache-bypass@v4.1.0 # v4.1.0
              with:
                  enabled: ${{ inputs.runs-on-cache-bypass }}
            - name: Validate platform
              shell: bash
              env:
                  PLATFORM: ${{ inputs.platform }}
              run: |
                  set -euo pipefail
                  case "$PLATFORM" in
                    ios|android) ;;
                    *)
                      echo "::error::Unsupported platform '$PLATFORM'; expected 'ios' or 'android'."
                      exit 1
                      ;;
                  esac

            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - name: Apply build-env
              if: inputs.build-env != ''
              shell: bash
              env:
                  BUILD_ENV: ${{ inputs.build-env }}
              run: |
                  set -euo pipefail
                  while IFS= read -r line; do
                    [ -z "$line" ] && continue
                    case "$line" in
                      *=*) ;;
                      *)
                        echo "::error::build-env line '$line' is missing '='; expected KEY=VALUE."
                        exit 1
                        ;;
                    esac
                    name="${line%%=*}"
                    case "$name" in
                      ''|[!A-Za-z_]*)
                        echo "::error::build-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    case "$name" in
                      *[!A-Za-z0-9_]*)
                        echo "::error::build-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    echo "$line" >> "$GITHUB_ENV"
                  done <<< "$BUILD_ENV"

            - name: Apply build-secrets-env
              id: build-secrets
              uses: rnw-community/mobile-ci/actions/apply-secret-env@v4.1.0 # v4.1.0
              with:
                  env: ${{ secrets.build-secrets-env }}
                  label: build-secrets-env

            - name: Resolve package manager
              id: package-manager
              shell: bash
              env:
                  PACKAGE_MANAGER: ${{ inputs.package-manager }}
                  LOCKFILE_REQUIRED: 'true'
              run: |
                  set -euo pipefail
                  pm=''
                  case "$PACKAGE_MANAGER" in
                    '') ;;
                    yarn|pnpm|npm) pm="$PACKAGE_MANAGER" ;;
                    *)
                      echo "::error::package-manager must be '' (auto-detect), yarn, pnpm or npm; got '$PACKAGE_MANAGER'."
                      exit 1
                      ;;
                  esac
                  declared=''
                  declared_version=''
                  if { [ -z "$pm" ] || [ "$pm" = pnpm ]; } && [ -f package.json ]; then
                    if command -v jq >/dev/null 2>&1; then
                      declared_spec="$(jq -r '
                        (try (.devEngines.packageManager) catch null) as $raw
                        | (if ($raw | type) == "array" then ($raw[0] // null) else $raw end) as $de
                        | (if ($de | type) == "object" then [($de.name // ""), ($de.version // "")] else ["", ""] end) as $dev
                        | (if ((.packageManager // "") | type) == "string" and (.packageManager // "") != ""
                           then (.packageManager | if test("@") then [split("@")[0], (split("@")[1] | split("+")[0])] else [., ""] end)
                           else ["", ""] end) as $spec
                        | (if $dev[0] != "" then $dev[0] else $spec[0] end) as $name
                        | [$name,
                           (if $dev[0] != "" and $dev[1] != "" then $dev[1]
                            elif $spec[0] == $name then $spec[1]
                            else "" end)]
                        | @tsv' package.json)"
                      declared="$(printf '%s\n' "$declared_spec" | cut -f1)"
                      declared_version="$(printf '%s\n' "$declared_spec" | cut -f2)"
                    else
                      echo "::warning::jq is not installed on this runner, so package.json's packageManager / devEngines.packageManager fields cannot be read; falling back to root lockfile detection. Install jq, or set the package-manager input explicitly."
                    fi
                  fi
                  if [ -z "$pm" ] && [ -n "$declared" ]; then
                    case "$declared" in
                      yarn|pnpm|npm) pm="$declared" ;;
                      *)
                        echo "::error::package.json declares package manager '$declared', which is not yarn, pnpm or npm; set the package-manager input explicitly."
                        exit 1
                        ;;
                    esac
                  fi
                  if [ -z "$pm" ]; then
                    lockfiles=''
                    lockfile_count=0
                    if [ -f yarn.lock ]; then pm=yarn; lockfiles="${lockfiles}yarn.lock "; lockfile_count=$((lockfile_count + 1)); fi
                    if [ -f pnpm-lock.yaml ]; then pm=pnpm; lockfiles="${lockfiles}pnpm-lock.yaml "; lockfile_count=$((lockfile_count + 1)); fi
                    if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
                      pm=npm
                      lockfile_count=$((lockfile_count + 1))
                      if [ -f package-lock.json ]; then lockfiles="${lockfiles}package-lock.json "; fi
                      if [ -f npm-shrinkwrap.json ]; then lockfiles="${lockfiles}npm-shrinkwrap.json "; fi
                    fi
                    if [ "$lockfile_count" -eq 0 ]; then
                      echo "::error::Cannot resolve the package manager: package.json declares none and there is no yarn.lock, pnpm-lock.yaml, package-lock.json or npm-shrinkwrap.json at the repository root. Set the package-manager input explicitly."
                      exit 1
                    fi
                    if [ "$lockfile_count" -gt 1 ]; then
                      echo "::error::Cannot resolve the package manager: multiple root lockfiles found (${lockfiles% }). Set the package-manager input explicitly."
                      exit 1
                    fi
                  fi
                  if [ "$pm" = pnpm ] && { [ "$declared" != pnpm ] || [ -z "$declared_version" ]; }; then
                    echo "::error::Resolved package manager is pnpm, but no pnpm version is readable from the repository-root package.json. pnpm/action-setup takes the version from 'packageManager: pnpm@<version>' or 'devEngines.packageManager: {name: pnpm, version: <range>}' - add one of those, and make sure jq is installed on this runner so the workflow can read it."
                    exit 1
                  fi
                  if [ -n "$LOCKFILE_REQUIRED" ]; then
                    case "$pm" in
                      yarn) wanted='yarn.lock' ;;
                      pnpm) wanted='pnpm-lock.yaml' ;;
                      *) wanted='package-lock.json npm-shrinkwrap.json' ;;
                    esac
                    found=''
                    for candidate in $wanted; do
                      if [ -f "$candidate" ]; then found="$candidate"; break; fi
                    done
                    if [ -z "$found" ]; then
                      echo "::error::Resolved package manager is $pm, but this job caches JS dependencies with actions/setup-node and the repository root has none of: $wanted. Commit the lockfile, or set the package-manager input to the manager whose lockfile this repository actually has."
                      exit 1
                    fi
                  fi
                  echo "Resolved package manager: $pm"
                  echo "pm=$pm" >> "$GITHUB_OUTPUT"

            - name: Setup pnpm
              if: steps.package-manager.outputs.pm == 'pnpm'
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ inputs.node-version }}

            - name: Enable corepack
              if: inputs.enable-corepack && steps.package-manager.outputs.pm != 'pnpm'
              shell: bash
              run: corepack enable

            - name: Restore package manager cache
              id: pm-cache
              uses: rnw-community/mobile-ci/actions/node-pm-cache@v4.1.0 # v4.1.0
              with:
                  package-manager: ${{ steps.package-manager.outputs.pm }}

            - name: Install dependencies
              shell: bash
              env:
                  INSTALL_COMMAND: ${{ inputs.install-command }}
              run: eval "$INSTALL_COMMAND"

            - name: Save package manager cache
              if: github.event_name != 'pull_request' && steps.pm-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              timeout-minutes: 10
              continue-on-error: true
              with:
                  path: ${{ steps.pm-cache.outputs.path }}
                  key: ${{ steps.pm-cache.outputs.cache-key }}

            - name: Build workspace JS dependencies
              if: inputs.build-command != ''
              shell: bash
              env:
                  BUILD_COMMAND: ${{ inputs.build-command }}
              run: eval "$BUILD_COMMAND"

            - name: Generate native project
              if: matrix.target.prebuildCommand != ''
              working-directory: ${{ matrix.target.appDir }}
              shell: bash
              env:
                  PREBUILD_COMMAND: ${{ matrix.target.prebuildCommand }}
              run: eval "$PREBUILD_COMMAND"

            - name: expo-native-key
              id: native-key
              uses: rnw-community/mobile-ci/actions/expo-native-key@v4.0.0 # v4.0.0
              with:
                  platform: ${{ inputs.platform }}
                  working-directory: ${{ matrix.target.appDir }}
                  flavor: ${{ inputs.base-flavor }}
                  extra-env: ${{ inputs.fingerprint-env }}
                  toolchain: ${{ inputs.toolchain }}${{ matrix.target.workspace && format('-{0}', matrix.target.workspace) || '' }}${{ matrix.target.scheme && format('-{0}', matrix.target.scheme) || '' }}
                  fingerprint-config: ${{ inputs.fingerprint-config }}
                  fingerprint-version: ${{ inputs.expo-fingerprint-version }}
                  ios-simulator-archs: ${{ inputs.ios-simulator-archs }}
                  secrets-digest: ${{ steps.build-secrets.outputs.digest }}

            - name: expo-base-binary (fetch)
              id: base
              if: inputs.build-strategy != 'native'
              uses: rnw-community/mobile-ci/actions/expo-base-binary@v4.0.0 # v4.0.0
              with:
                  mode: fetch
                  platform: ${{ inputs.platform }}
                  flavor: ${{ inputs.base-flavor }}
                  key: ${{ steps.native-key.outputs.key }}
                  backend: ${{ inputs.base-backend }}
                  path: .ci-cache/e2e-base/${{ matrix.target.name }}

            - name: Refuse to compile native code under build-strategy repack
              if: inputs.build-strategy == 'repack' && steps.base.outputs.found != 'true'
              shell: bash
              env:
                  NATIVE_KEY: ${{ steps.native-key.outputs.key }}
                  REFERENCE: ${{ steps.base.outputs.reference }}
              run: |
                  set -euo pipefail
                  echo "::error::build-strategy is 'repack', which forbids compiling native code, but no base binary is published at $REFERENCE for native key $NATIVE_KEY. Warm this key up on the default branch (seed-native-cache.yml), or switch this call to build-strategy: auto so a native build produces and publishes one."
                  exit 1

            - name: Resolve the Android SDK cache
              id: sdk-cache
              if: inputs.repack && inputs.platform == 'android' && steps.base.outputs.found == 'true'
              shell: bash
              env:
                  APP_DIR: ''
                  CMDLINE_TOOLS_VERSION: ${{ inputs.cmdline-tools-version }}
                  SDK_PACKAGES: platform-tools build-tools;${{ inputs.android-build-tools-version }}
              run: |
                  set -euo pipefail

                  sha256_stdin() {
                    if command -v sha256sum >/dev/null 2>&1; then
                      sha256sum | cut -d' ' -f1
                    elif command -v shasum >/dev/null 2>&1; then
                      shasum -a 256 | cut -d' ' -f1
                    else
                      echo "::error::Neither sha256sum nor shasum is available, so the Android SDK cache key cannot be computed."
                      return 1
                    fi
                  }

                  tilde='~'
                  if [ -n "${ANDROID_SDK_ROOT:-}" ]; then
                    root="$ANDROID_SDK_ROOT"
                    path_root="$root"
                  else
                    root="$HOME/.android/sdk"
                    path_root="$tilde/.android/sdk"
                  fi

                  read -r -a packages <<< "${SDK_PACKAGES//$'\n'/ }"
                  manifest="$RUNNER_TEMP/android-sdk-manifest.$$"
                  {
                    printf 'cmdline-tools;%s\n' "$CMDLINE_TOOLS_VERSION"
                    if [ "${#packages[@]}" -gt 0 ]; then
                      printf '%s\n' "${packages[@]}" | LC_ALL=C sort -u
                    fi
                    if [ -n "$APP_DIR" ]; then
                      for file in android/build.gradle android/build.gradle.kts \
                                  android/settings.gradle android/settings.gradle.kts \
                                  android/gradle.properties android/gradle/libs.versions.toml \
                                  android/app/build.gradle android/app/build.gradle.kts; do
                        if [ -f "$APP_DIR/$file" ]; then
                          printf 'pin %s %s\n' "$file" "$(sha256_stdin < "$APP_DIR/$file")"
                        fi
                      done
                      for module_file in react-native/gradle/libs.versions.toml expo-modules-autolinking/package.json; do
                        digest=none
                        dir="$APP_DIR"
                        while :; do
                          if [ -f "$dir/node_modules/$module_file" ]; then
                            digest="$(sha256_stdin < "$dir/node_modules/$module_file")"
                            break
                          fi
                          case "$dir" in
                            .|/) break ;;
                          esac
                          dir="$(dirname "$dir")"
                        done
                        printf 'module %s %s\n' "$module_file" "$digest"
                      done
                    fi
                  } > "$manifest"

                  digest="$(sha256_stdin < "$manifest")"
                  rm -f "$manifest"
                  if [ -z "$digest" ]; then
                    echo "::error::The Android SDK package manifest hashed to nothing."
                    exit 1
                  fi
                  key="android-sdk-v1-${RUNNER_OS}-${RUNNER_ARCH}-cmdline-${CMDLINE_TOOLS_VERSION}-$(printf '%s' "$digest" | cut -c1-16)"

                  echo "Android SDK root: $root"
                  echo "Android SDK cache key: $key"
                  {
                    echo "root=$root"
                    echo "key=$key"
                    echo 'paths<<ANDROID_SDK_CACHE_PATHS_EOF'
                    for package_dir in cmdline-tools platform-tools build-tools platforms ndk cmake licenses; do
                      echo "$path_root/$package_dir"
                    done
                    echo 'ANDROID_SDK_CACHE_PATHS_EOF'
                  } >> "$GITHUB_OUTPUT"

            - name: Restore the Android SDK
              id: sdk-restore
              if: inputs.repack && inputs.platform == 'android' && steps.base.outputs.found == 'true'
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ steps.sdk-cache.outputs.paths }}
                  key: ${{ steps.sdk-cache.outputs.key }}

            - name: Use the restored Android SDK
              id: sdk-cached
              if: inputs.repack && inputs.platform == 'android' && steps.base.outputs.found == 'true' && steps.sdk-restore.outputs.cache-hit == 'true'
              shell: bash
              env:
                  SDK_ROOT: ${{ steps.sdk-cache.outputs.root }}
              run: |
                  set -euo pipefail
                  sdkmanager=''
                  for candidate in "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager; do
                    if [ -x "$candidate" ]; then
                      sdkmanager="$candidate"
                      break
                    fi
                  done
                  if [ -z "$sdkmanager" ] || [ ! -x "$SDK_ROOT/platform-tools/adb" ]; then
                    echo "::warning::The Android SDK restored into $SDK_ROOT has no sdkmanager or adb, so it is installed through android-actions/setup-android instead."
                    echo 'ready=false' >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  {
                    echo "ANDROID_HOME=$SDK_ROOT"
                    echo "ANDROID_SDK_ROOT=$SDK_ROOT"
                  } >> "$GITHUB_ENV"
                  {
                    dirname "$sdkmanager"
                    echo "$SDK_ROOT/platform-tools"
                  } >> "$GITHUB_PATH"
                  echo 'ready=true' >> "$GITHUB_OUTPUT"
                  echo "Using the Android SDK restored from the cache into $SDK_ROOT; sdkmanager is not run and nothing is downloaded."

            - name: Set up Android SDK for the repack
              if: inputs.repack && inputs.platform == 'android' && steps.base.outputs.found == 'true' && steps.sdk-cached.outputs.ready != 'true'
              uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
              env:
                  ANDROID_SDK_ROOT: ${{ steps.sdk-cache.outputs.root }}
              with:
                  cmdline-tools-version: ${{ inputs.cmdline-tools-version }}
                  packages: platform-tools build-tools;${{ inputs.android-build-tools-version }}

            - name: expo-repack
              if: inputs.repack && steps.base.outputs.found == 'true'
              uses: rnw-community/mobile-ci/actions/expo-repack@v4.0.0 # v4.0.0
              with:
                  platform: ${{ inputs.platform }}
                  base-path: ${{ steps.base.outputs.path }}
                  output-path: ${{ inputs.platform == 'ios' && format('.ci-artifacts/{0}-{1}/{0}-{1}.tar.gz', inputs.app-artifact-prefix, matrix.target.name) || format('.ci-artifacts/{0}-{1}/app-release.apk', inputs.app-artifact-prefix, matrix.target.name) }}
                  app-dir: ${{ matrix.target.appDir }}
                  app-id: ${{ matrix.target.appId }}
                  repack-env: ${{ inputs.repack-env }}
                  expect-config: ${{ inputs.expect-config }}
                  repack-version: ${{ inputs.repack-app-version }}
                  android-build-tools-dir: ${{ inputs.android-build-tools-dir }}
                  android-build-tools-version: ${{ inputs.android-build-tools-version }}
                  keystore-path: ${{ (inputs.platform == 'android' && inputs.android-keystore-path != '') && format('{0}/{1}', matrix.target.appDir, inputs.android-keystore-path) || '' }}
                  keystore-password: ${{ inputs.android-keystore-password }}
                  keystore-key-alias: ${{ inputs.android-keystore-key-alias }}
                  keystore-key-password: ${{ inputs.android-keystore-key-password }}

            - name: Upload the repacked app for the jobs that consume it
              if: inputs.repack && steps.base.outputs.found == 'true'
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: ${{ inputs.app-artifact-prefix }}-${{ matrix.target.name }}
                  path: .ci-artifacts/${{ inputs.app-artifact-prefix }}-${{ matrix.target.name }}/
                  if-no-files-found: error
                  retention-days: 1

            - name: Record this target's plan
              shell: bash
              env:
                  PLATFORM: ${{ inputs.platform }}
                  TARGET: ${{ toJSON(matrix.target) }}
                  NATIVE_KEY: ${{ steps.native-key.outputs.key }}
                  FINGERPRINT: ${{ steps.native-key.outputs.fingerprint }}
                  CONFIG_HASH: ${{ steps.native-key.outputs.config-hash }}
                  BASE_FOUND: ${{ steps.base.outputs.found }}
                  BASE_SOURCE: ${{ steps.base.outputs.source }}
                  BASE_REFERENCE: ${{ steps.base.outputs.reference }}
                  BUILD_STRATEGY: ${{ inputs.build-strategy }}
                  REPACKED: ${{ inputs.repack }}
              run: |
                  set -euo pipefail
                  mkdir -p .ci-artifacts/plan
                  target_name=$(jq -r '.name' <<< "$TARGET")
                  force_native=$(jq -r '.forceNative == true' <<< "$TARGET")
                  if [ "$force_native" = 'true' ] && [ "$REPACKED" = 'true' ]; then
                    echo "::error::Target ${target_name} sets forceNative, which only a caller that does not repack (repack: false) may ask for: a repacked target already has the binary its jobs consume."
                    exit 1
                  fi
                  needs_native=true
                  if [ "$BASE_FOUND" = 'true' ] && [ "$force_native" != 'true' ]; then
                    needs_native=false
                  fi
                  jq -n --argjson target "$TARGET" \
                        --arg key "$NATIVE_KEY" \
                        --arg fingerprint "$FINGERPRINT" \
                        --arg configHash "$CONFIG_HASH" \
                        --argjson needsNative "$needs_native" \
                     '$target + {nativeKey: $key, fingerprint: $fingerprint, configHash: $configHash, needsNative: $needsNative}' \
                     > .ci-artifacts/plan/plan.json
                  {
                    if [ "$needs_native" = 'false' ] && [ "$REPACKED" = 'true' ]; then
                      echo "### ${PLATFORM} ${target_name}: repacked, no native build slot taken"
                      echo "Base ${BASE_REFERENCE} (from ${BASE_SOURCE}) repacked with this commit's JavaScript."
                    elif [ "$needs_native" = 'false' ]; then
                      echo "### ${PLATFORM} ${target_name}: already warm"
                      echo "Base ${BASE_REFERENCE} (from ${BASE_SOURCE}) already covers native key ${NATIVE_KEY}."
                    elif [ "$BASE_FOUND" = 'true' ]; then
                      echo "### ${PLATFORM} ${target_name}: native build requested"
                      echo "Base ${BASE_REFERENCE} already covers native key ${NATIVE_KEY}, but the target sets forceNative."
                    else
                      echo "### ${PLATFORM} ${target_name}: native build needed"
                      echo "Native key ${NATIVE_KEY} has no published base (strategy: ${BUILD_STRATEGY})."
                    fi
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Upload this target's plan
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: ${{ inputs.plan-artifact-prefix }}-${{ matrix.target.name }}
                  path: .ci-artifacts/plan/plan.json
                  if-no-files-found: error
                  retention-days: 1

            - name: Save the Android SDK
              if: inputs.repack && inputs.platform == 'android' && steps.base.outputs.found == 'true' && github.event_name != 'pull_request' && steps.sdk-restore.outputs.cache-hit != 'true'
              continue-on-error: true
              timeout-minutes: 10
              uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: ${{ steps.sdk-cache.outputs.paths }}
                  key: ${{ steps.sdk-cache.outputs.key }}

    collect:
        name: Targets still needing a native build
        needs: plan
        if: ${{ !cancelled() && needs.plan.result == 'success' }}
        runs-on: ${{ fromJSON(inputs.control-runner-labels) }}
        outputs:
            targets: ${{ steps.collect.outputs.targets }}
        steps:
            - name: Apply RunsOn cache bypass
              uses: rnw-community/mobile-ci/actions/runs-on-cache-bypass@v4.1.0 # v4.1.0
              with:
                  enabled: ${{ inputs.runs-on-cache-bypass }}
            - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
              with:
                  pattern: ${{ inputs.plan-artifact-prefix }}-*
                  path: .ci-artifacts/plans

            - name: Collect the targets whose native key has no base
              id: collect
              shell: bash
              env:
                  TARGETS: ${{ inputs.targets }}
              run: |
                  set -euo pipefail
                  expected=$(jq 'length' <<< "$TARGETS")
                  mapfile -d '' -t plans < <(find .ci-artifacts/plans -name plan.json -print0 | LC_ALL=C sort -z)
                  if [ "${#plans[@]}" -ne "$expected" ]; then
                    echo "::error::Expected one plan per target ($expected), found ${#plans[@]}. A missing plan is not an empty set of native builds; it is a target whose strategy nobody decided."
                    exit 1
                  fi
                  echo "plans=$(jq -sc '.' "${plans[@]}")" >> "$GITHUB_OUTPUT"
                  targets=$(jq -sc 'map(select(.needsNative)) | map(del(.needsNative, .fingerprint, .configHash))' "${plans[@]}")
                  echo "targets=$targets" >> "$GITHUB_OUTPUT"
                  echo "Targets needing a native build: $(jq -r 'map(.name) | join(", ") | if . == "" then "(none)" else . end' <<< "$targets")"

            - name: assert-distinct-fingerprints
              uses: rnw-community/mobile-ci/actions/assert-distinct-fingerprints@v4.1.0 # v4.1.0
              with:
                  platform: ${{ inputs.platform }}
                  plans: ${{ steps.collect.outputs.plans }}
                  require-app-id: false
