name: native-publish

on:
    workflow_call:
        inputs:
            control-runner-labels:
                description: >-
                    JSON array of runner labels for the lightweight control jobs
                    (detect, status, collect, validate-manifest, cancel-queued-runs)
                    that only run Node and the GitHub API and need no self-hosted
                    hardware, plus this workflow's plan and record jobs (jq, gh,
                    and Node when fingerprinting). Override when the org has no GitHub-hosted runners,
                    for example an ephemeral RunsOn label set.
                required: false
                type: string
                default: '["ubuntu-latest"]'
            runs-on-cache-bypass:
                description: >-
                    Run a SHA-pinned runs-on/action before any artifact traffic when
                    the job lands on a RunsOn runner started with extras=s3-cache,
                    whose cache proxy takes over the Actions results URL and makes
                    actions/upload-artifact and download-artifact fail. A no-op on
                    every other runner. Off by default.
                required: false
                type: boolean
                default: false
            enable-ios:
                description: Run the ios-publish job.
                type: boolean
                required: false
                default: true
            enable-android:
                description: Run the android-lint-gate/android-publish jobs.
                type: boolean
                required: false
                default: false
            ios-runner-labels:
                description: JSON array of self-hosted runner labels for the iOS publish job.
                type: string
                required: false
                default: '["self-hosted","macOS","ARM64"]'
            android-runner-labels:
                description: >-
                    JSON array of self-hosted runner labels for the Android publish job.
                    The default is the x86_64 Linux pool (4 vCPU / 8 GiB): `eas build
                    --local` for Android needs Google's NDK, which ships for x86_64
                    Linux (and macOS) only, never linux-aarch64, and needs no Mac.
                    Proven on that pool by suuudokuuu's native-publish Android job.
                type: string
                required: false
                default: '["self-hosted","trf-linux-amd64-4x8"]'
            lint-runner-labels:
                description: JSON array of hosted runner labels for the android-lint-gate job.
                type: string
                required: false
                default: '["ubuntu-latest"]'
            app-dir:
                description: App directory containing app.json/eas.json (and android/ios once prebuilt).
                type: string
                required: true
            node-version:
                type: string
                required: false
                default: '22'
            install-command:
                type: string
                required: false
                default: yarn install --immutable
            enable-corepack:
                type: boolean
                required: false
                default: true
            package-manager:
                description: >-
                    JS package manager driving pnpm provisioning and, in the jobs
                    that configure one, actions/setup-node's dependency cache.
                    Leave empty to auto-detect at the repository root, in order: an
                    explicit value here, then package.json's
                    devEngines.packageManager / packageManager field (needs jq on
                    the runner), then exactly one root lockfile (yarn.lock,
                    pnpm-lock.yaml, package-lock.json / npm-shrinkwrap.json). No
                    match, an ambiguous
                    match, or an unsupported value fails the job. install-command
                    must match the resolved manager (e.g. pnpm install
                    --frozen-lockfile). Resolving to pnpm additionally requires a
                    pnpm version declared in package.json (packageManager or
                    devEngines.packageManager) because pnpm/action-setup reads it
                    from there; the corepack step is then skipped.
                type: string
                required: false
                default: ''
            build-command:
                description: Optional workspace JS build command run at repo root before publishing.
                type: string
                required: false
                default: ''
            eas-cli-version:
                type: string
                required: false
                default: '20.5.1'
            build-profile:
                description: EAS build profile (eas.json build.<profile>) used for both platforms.
                type: string
                required: false
                default: production
            submit-profile:
                description: EAS submit profile (eas.json submit.<profile>) used for both platforms.
                type: string
                required: false
                default: production
            targets:
                description: >-
                    Optional JSON array of publish targets, replacing enable-ios /
                    enable-android / build-profile / submit-profile when non-empty. Each
                    entry is {"platform": "ios"|"android", "name"?, "buildProfile"?,
                    "submitProfile"?}; name defaults to <buildProfile>-<platform>,
                    the profiles to build-profile / submit-profile. One publish job runs
                    per entry, e.g. one per brand x platform. Unknown keys, duplicate
                    names and an empty array fail the plan job.
                type: string
                required: false
                default: ''
            mode:
                description: >-
                    native (default) always builds and submits. auto compares every
                    target's @expo/fingerprint against the store build record of the
                    last release whose record shows every target shipped, and builds
                    only when one changed (decision=native) or no such record exists;
                    otherwise it builds nothing and outputs decision=ota for the
                    caller's OTA publish. ota-only never builds: it fails when there is
                    no baseline or a fingerprint changed. auto and ota-only need a
                    release tag (a tag-triggered run or release-tag) and write the
                    store build record after a successful submit.
                type: string
                required: false
                default: native
            release-tag:
                description: >-
                    Tag whose GitHub Release receives the store build record. Empty uses
                    the triggering tag when the run was triggered by one.
                type: string
                required: false
                default: ''
            write-store-record:
                description: >-
                    Write the store build record in mode native too, so a later auto run
                    has a baseline. Needs a release tag, like auto.
                type: boolean
                required: false
                default: false
            build-number:
                description: >-
                    Empty (default) exports nothing. auto exports STORE_BUILD_NUMBER as
                    the whole minutes since the Unix epoch at which the workflow run was
                    created (stable across re-runs; needs actions: read on private
                    repositories). A positive integer up to 2100000000 is exported as
                    is. app.config must read it into ios.buildNumber /
                    android.versionCode.
                type: string
                required: false
                default: ''
            marketing-version:
                description: >-
                    auto (default) exports STORE_MARKETING_VERSION from a release tag
                    shaped [<prefix>@][v]X[.Y[.Z]] and nothing otherwise; tag requires
                    such a tag; none exports nothing; any other value must itself be
                    X[.Y[.Z]] and is exported as is.
                type: string
                required: false
                default: auto
            fingerprint-version:
                description: Pinned @expo/fingerprint npm version used by mode auto / ota-only and the store build record.
                type: string
                required: false
                default: '0.20.6'
            plan-timeout-minutes:
                description: Timeout of the plan and record jobs, which run on control-runner-labels.
                type: number
                required: false
                default: 30
            ios-pre-submit-command:
                description: >-
                    Optional consumer-owned command (e.g. a fastlane lane) run in app-dir before
                    the iOS build. Its env is EXPO_TOKEN, the resolved eas.json build profile
                    env, publish-env, STORE_BUILD_NUMBER / STORE_MARKETING_VERSION when set,
                    EAS_EXTRA_ENV and EXPO_ASC_API_KEY_PATH (the written App Store Connect key).
                type: string
                required: false
                default: ''
            ios-post-submit-command:
                description: >-
                    Optional consumer-owned command (e.g. fastlane metadata/screenshots) run in
                    app-dir after `eas submit` succeeds. Same env as ios-pre-submit-command.
                type: string
                required: false
                default: ''
            android-pre-submit-command:
                description: >-
                    Optional consumer-owned command run in app-dir before the Android build. Its
                    env is the iOS hooks' minus the App Store Connect key, and not the Google
                    key, which is written only after the build.
                type: string
                required: false
                default: ''
            android-post-submit-command:
                description: >-
                    Optional consumer-owned command run in app-dir after `eas submit` succeeds.
                    Its env is the Android pre-submit hook's plus the written Google service
                    account key path as both GOOGLE_APPLICATION_CREDENTIALS and
                    GOOGLE_SERVICE_ACCOUNT_KEY_PATH.
                type: string
                required: false
                default: ''
            android-lint-gate:
                description: >-
                    Require the android-lint-gate job (Play policy manifest check + lintVitalRelease)
                    to pass before android-publish runs.
                type: boolean
                required: false
                default: true
            android-lint-gate-gradle-cache:
                description: >-
                    Restore and save the Gradle User Home (caches + wrapper) in the
                    android-lint-gate job via gradle/actions/setup-gradle with the
                    open-source `basic` cache provider, keyed on the generated Gradle
                    build files. Written only from default-branch runs; read-only
                    elsewhere. Set false to run lintVitalRelease without setup-gradle.
                type: boolean
                required: false
                default: true
            required-android-abi:
                description: >-
                    ABI that must be present in the built .aab (Google Play 64-bit requirement).
                    Empty string disables the check.
                type: string
                required: false
                default: arm64-v8a
            asc-key-path:
                description: >-
                    Optional path, relative to app-dir, the App Store Connect API key (.p8) is
                    written to and removed from — set this only when eas.json requires the key at
                    a specific app-dir-relative location; otherwise leave empty so the key is
                    written under $RUNNER_TEMP and never enters the eas build --local archive.
                type: string
                required: false
                default: ''
            google-key-path:
                description: >-
                    Optional path, relative to app-dir, the Google Play service account key
                    (.json) is written to and removed from — set this only when eas.json or
                    fastlane requires the key at a specific app-dir-relative location; otherwise
                    leave empty so the key is written under $RUNNER_TEMP and never enters the
                    eas build --local archive.
                type: string
                required: false
                default: ''
            build-timeout-minutes:
                type: number
                required: false
                default: 120
            lint-timeout-minutes:
                type: number
                required: false
                default: 30
            android-lint-gate-gradle-args:
                description: >-
                    Extra arguments appended after :app:lintVitalRelease in the
                    android-lint-gate job, e.g. -PreactNativeArchitectures=arm64-v8a.
                    Split on any whitespace — spaces, tabs, and newlines (a YAML
                    block-scalar value works) are all treated as separators — not
                    shell-quoted, so an argument containing a space cannot be
                    expressed as a single token.
                type: string
                required: false
                default: ''
            publish-env:
                description: >-
                    Newline-separated KEY=VALUE pairs of non-secret env appended to
                    $GITHUB_ENV at the start of ios-publish, android-lint-gate, and
                    android-publish, after the resolved eas.json build profile env
                    (so it overrides a profile variable outside eas build, with a
                    warning) and before eas build/submit (or, for
                    android-lint-gate, prebuild) and the pre/post-submit-command
                    hooks. Rejects (fails closed) any line without '=' or whose name
                    does not match ^[A-Za-z_][A-Za-z0-9_]*$. For secret values use
                    the EAS_EXTRA_ENV secret instead — inputs are not masked in logs.
                type: string
                required: false
                default: ''

        secrets:
            EXPO_TOKEN:
                description: Expo access token, required by ios-publish and android-publish.
                required: false
            ASC_API_KEY:
                description: App Store Connect API key contents (.p8), required by ios-publish.
                required: false
            ASC_KEY_ID:
                description: >-
                    App Store Connect API key ID matching ASC_API_KEY. Required alongside
                    ASC_API_KEY and ASC_ISSUER_ID for EAS to resolve the key
                    non-interactively; exported to the iOS build and submit steps as
                    EXPO_ASC_KEY_ID.
                required: false
            ASC_ISSUER_ID:
                description: >-
                    App Store Connect API key issuer ID matching ASC_API_KEY. Required
                    alongside ASC_API_KEY and ASC_KEY_ID for EAS to resolve the key
                    non-interactively; exported to the iOS build and submit steps as
                    EXPO_ASC_ISSUER_ID.
                required: false
            GOOGLE_SERVICE_ACCOUNT_JSON:
                description: Google Play service account key JSON contents, required by android-publish.
                required: false
            EAS_EXTRA_ENV:
                description: >-
                    Newline-separated KEY=VALUE pairs of secret env appended to
                    $GITHUB_ENV at the start of ios-publish, android-lint-gate, and
                    android-publish, with each value masked in logs before being
                    written. Use this for secrets eas build/submit, the
                    android-lint-gate prebuild, or a pre/post-submit-command hook
                    need on the environment, e.g. EXPO_APPLE_APP_SPECIFIC_PASSWORD.
                required: false
        outputs:
            decision:
                description: '`native` when this run builds and submits, `ota` when every target''s native runtime is unchanged since the baseline and nothing was built.'
                value: ${{ jobs.plan.outputs.decision }}
            changed-targets:
                description: Comma-separated targets whose fingerprint differs from the baseline (mode auto / ota-only).
                value: ${{ jobs.plan.outputs.changed-targets }}
            baseline-tag:
                description: Release tag of the store build record compared against, empty when none.
                value: ${{ jobs.plan.outputs.baseline-tag }}
            fingerprints:
                description: JSON object of target name to @expo/fingerprint hash, the runtime version an OTA must target. Empty in mode native without write-store-record.
                value: ${{ jobs.plan.outputs.fingerprints }}
            build-number:
                description: The exported STORE_BUILD_NUMBER, empty when build-number is empty.
                value: ${{ jobs.plan.outputs.build-number }}
            marketing-version:
                description: The exported STORE_MARKETING_VERSION, empty when none.
                value: ${{ jobs.plan.outputs.marketing-version }}

concurrency:
    group: native-publish-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

# No workflow-level permissions: a called workflow's job that declares more than
# its caller grants is a startup failure even when skipped, so plan and record
# inherit the caller's grant (actions: read for build-number auto, contents:
# write for the store build record) and every other job pins contents: read.

jobs:
    plan:
        name: Plan native publish
        runs-on: ${{ fromJSON(inputs.control-runner-labels) }}
        timeout-minutes: ${{ inputs.plan-timeout-minutes }}
        env:
            HAS_EAS_EXTRA_ENV: ${{ secrets.EAS_EXTRA_ENV != '' }}
        outputs:
            ios-targets: ${{ steps.targets.outputs.ios-targets }}
            android-targets: ${{ steps.targets.outputs.android-targets }}
            has-ios: ${{ steps.targets.outputs.has-ios }}
            has-android: ${{ steps.targets.outputs.has-android }}
            record: ${{ steps.targets.outputs.record }}
            release-tag: ${{ steps.targets.outputs.release-tag }}
            record-asset: ${{ steps.targets.outputs.record-asset }}
            build-number: ${{ steps.version.outputs.build-number }}
            marketing-version: ${{ steps.version.outputs.marketing-version }}
            fingerprints: ${{ steps.fingerprints.outputs.fingerprints }}
            baseline-tag: ${{ steps.baseline.outputs.baseline-tag }}
            decision: ${{ steps.decide.outputs.decision }}
            changed-targets: ${{ steps.decide.outputs.changed-targets }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - name: Apply EAS_EXTRA_ENV
              id: eas-extra-env
              if: env.HAS_EAS_EXTRA_ENV == 'true'
              uses: rnw-community/mobile-ci/actions/apply-secret-env@validate/v4.1 # validate/v4.1 fleet-validation pin
              with:
                  env: ${{ secrets.EAS_EXTRA_ENV }}
                  label: EAS_EXTRA_ENV

            - name: Resolve publish targets and their eas.json profile env
              id: targets
              shell: bash
              env:
                  APP_DIR: ${{ inputs.app-dir }}
                  TARGETS: ${{ inputs.targets }}
                  ENABLE_IOS: ${{ inputs.enable-ios }}
                  ENABLE_ANDROID: ${{ inputs.enable-android }}
                  BUILD_PROFILE: ${{ inputs.build-profile }}
                  SUBMIT_PROFILE: ${{ inputs.submit-profile }}
                  MODE: ${{ inputs.mode }}
                  WRITE_STORE_RECORD: ${{ inputs.write-store-record }}
                  RELEASE_TAG_INPUT: ${{ inputs.release-tag }}
                  REF_TYPE: ${{ github.ref_type }}
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  case "$MODE" in
                    native|auto|ota-only) ;;
                    *)
                      echo "::error::mode must be native, auto or ota-only; got '$MODE'."
                      exit 1
                      ;;
                  esac
                  if ! command -v jq >/dev/null 2>&1; then
                    echo "::error::The plan job needs jq to read eas.json; point control-runner-labels at a runner that has it."
                    exit 1
                  fi
                  eas_json="$APP_DIR/eas.json"
                  if [ ! -f "$eas_json" ]; then
                    echo "::error::No eas.json at '$eas_json'; the build profile env cannot be resolved."
                    exit 1
                  fi
                  if ! jq -e 'type == "object"' "$eas_json" >/dev/null 2>&1; then
                    echo "::error::'$eas_json' is not a JSON object."
                    exit 1
                  fi

                  jq_error="$RUNNER_TEMP/native-publish-plan.err"
                  report_jq_error() {
                    echo "::error::$(sed -E 's/^jq: error \(at [^)]*\): //' "$jq_error")"
                    exit 1
                  }

                  if [ -n "$TARGETS" ]; then
                    requested="$(printf '%s' "$TARGETS" | jq -c \
                      --arg build "$BUILD_PROFILE" --arg submit "$SUBMIT_PROFILE" '
                      if type != "array" then error("targets must be a JSON array of objects")
                      elif length == 0 then error("targets is an empty array; leave it empty instead to use enable-ios / enable-android")
                      else . end
                      | map(
                          if type != "object" then error("every targets entry must be an object; got \(tojson)") else . end
                          | ((keys - ["name", "platform", "buildProfile", "submitProfile"]) as $extra
                             | if ($extra | length) > 0 then error("targets entry \(tojson) has unknown key(s): \($extra | join(", "))") else . end)
                          | if (.platform == "ios" or .platform == "android") | not then error("targets entry \(tojson) needs platform ios or android") else . end
                          | .buildProfile = (.buildProfile // $build)
                          | .submitProfile = (.submitProfile // $submit)
                          | if ([.buildProfile, .submitProfile] | all(type == "string" and length > 0)) | not
                            then error("targets entry \(tojson) has a non-string or empty buildProfile / submitProfile") else . end
                          | .name = (.name // "\(.buildProfile)-\(.platform)")
                          | if (.name | type) != "string" or (.name | test("^[A-Za-z0-9._-]+$") | not)
                            then error("targets name \(.name | tojson) must match ^[A-Za-z0-9._-]+$") else . end
                          | .artifactSuffix = "-\(.name)")
                      | ([group_by(.name)[] | select(length > 1) | .[0].name]) as $dups
                      | if ($dups | length) > 0 then error("duplicate targets name(s): \($dups | join(", "))") else . end' 2> "$jq_error")" || report_jq_error
                  else
                    requested="$(jq -nc --arg build "$BUILD_PROFILE" --arg submit "$SUBMIT_PROFILE" \
                      --arg ios "$ENABLE_IOS" --arg android "$ENABLE_ANDROID" '
                      [ (if $ios == "true" then "ios" else empty end),
                        (if $android == "true" then "android" else empty end) ]
                      | map({name: ., platform: ., buildProfile: $build, submitProfile: $submit, artifactSuffix: ""})')"
                  fi

                  resolved="$(jq -c --argjson targets "$requested" '
                    def resolve($name; $seen):
                      if any($seen[]; . == $name) then
                        error("eas.json build profile \($seen[0] | tojson) extends itself: \(($seen + [$name]) | join(" -> "))")
                      elif ((.build // {}) | type) != "object" or ((.build // {}) | has($name) | not) then
                        error("eas.json has no build profile \($name | tojson)\(if ($seen | length) > 0 then " (extended by \($seen[-1] | tojson))" else "" end)")
                      else
                        .build[$name] as $profile
                        | if ($profile | type) != "object" then error("eas.json build profile \($name | tojson) is not an object") else . end
                        | ($profile.env // {}) as $env
                        | if ($env | type) != "object" then error("eas.json build profile \($name | tojson) env is not an object") else . end
                        | ($env | to_entries | map(select(.key | test("^[A-Za-z_][A-Za-z0-9_]*$") | not) | .key)) as $bad
                        | if ($bad | length) > 0 then error("eas.json build profile \($name | tojson) env name(s) \($bad | join(", ")) must match ^[A-Za-z_][A-Za-z0-9_]*$") else . end
                        | ($env | to_entries | map(select((.value | type) != "string" or (.value | test("[\r\n]"))) | .key)) as $bad_values
                        | if ($bad_values | length) > 0 then error("eas.json build profile \($name | tojson) env value(s) of \($bad_values | join(", ")) must be single-line strings") else . end
                        | if $profile.extends == null then {}
                          elif ($profile.extends | type) != "string" then error("eas.json build profile \($name | tojson) extends is not a string")
                          else resolve($profile.extends; $seen + [$name]) end
                        | . + $env
                      end;
                    . as $eas
                    | $targets
                    | map(.buildProfile as $profile
                          | . + {envLines: ($eas | resolve($profile; []) | to_entries | map("\(.key)=\(.value)") | join("\n"))})' "$eas_json" 2> "$jq_error")" || report_jq_error

                  count="$(jq 'length' <<< "$resolved")"
                  if [ "$count" -eq 0 ]; then
                    echo "::error::No publish target: enable-ios and enable-android are both false and targets is empty."
                    exit 1
                  fi

                  release_tag="$RELEASE_TAG_INPUT"
                  if [ -z "$release_tag" ] && [ "$REF_TYPE" = tag ]; then
                    release_tag="$REF_NAME"
                  fi
                  record=false
                  if [ "$MODE" != native ] || [ "$WRITE_STORE_RECORD" = true ]; then
                    record=true
                    if [ -z "$release_tag" ]; then
                      echo "::error::mode '$MODE'$([ "$WRITE_STORE_RECORD" = true ] && echo ' with write-store-record') needs a release tag to read and write the store build record: trigger the run from a tag or set release-tag. Without one a shipped build would go unrecorded and a later run would compare against a stale baseline."
                      exit 1
                    fi
                  fi
                  scope="$(printf '%s' "$APP_DIR" | sed -E 's#^\./##; s#/+$##; s#[^A-Za-z0-9._-]+#-#g; s#^-+##; s#-+$##')"
                  case "$scope" in
                    ''|.) scope=root ;;
                  esac

                  {
                    echo "ios-targets=$(jq -c 'map(select(.platform == "ios"))' <<< "$resolved")"
                    echo "android-targets=$(jq -c 'map(select(.platform == "android"))' <<< "$resolved")"
                    echo "has-ios=$(jq -r 'any(.[]; .platform == "ios")' <<< "$resolved")"
                    echo "has-android=$(jq -r 'any(.[]; .platform == "android")' <<< "$resolved")"
                    echo "targets=$resolved"
                    echo "record=$record"
                    echo "release-tag=$release_tag"
                    echo "record-asset=store-record-${scope}.json"
                  } >> "$GITHUB_OUTPUT"
                  jq -r '.[] | "Target \(.name): \(.platform), build profile \(.buildProfile), submit profile \(.submitProfile), \(if .envLines == "" then 0 else (.envLines | split("\n") | length) end) profile env variable(s)"' <<< "$resolved"

            - name: Resolve the store build number and marketing version
              id: version
              shell: bash
              env:
                  BUILD_NUMBER_INPUT: ${{ inputs.build-number }}
                  MARKETING_VERSION_INPUT: ${{ inputs.marketing-version }}
                  RELEASE_TAG: ${{ steps.targets.outputs.release-tag }}
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  RUN_ID: ${{ github.run_id }}
              run: |
                  set -euo pipefail
                  max_build_number=2100000000
                  build_number=''
                  case "$BUILD_NUMBER_INPUT" in
                    '') ;;
                    auto)
                      if ! created_at="$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}" --jq '.created_at')" || [ -z "$created_at" ]; then
                        echo "::error::build-number auto could not read run ${RUN_ID}'s created_at from the Actions API; grant the calling job 'actions: read'."
                        exit 1
                      fi
                      if ! epoch="$(date -u -d "$created_at" +%s 2>/dev/null)" \
                        && ! epoch="$(date -u -j -f '%Y-%m-%dT%H:%M:%SZ' "$created_at" +%s 2>/dev/null)"; then
                        echo "::error::Cannot parse the run's created_at '$created_at' as a UTC timestamp."
                        exit 1
                      fi
                      build_number=$((epoch / 60))
                      echo "Build number $build_number: minutes since the epoch at run creation ($created_at), shared by every attempt of run ${RUN_ID}."
                      ;;
                    *[!0-9]*|0*)
                      echo "::error::build-number must be empty, auto, or a positive integer without leading zeros; got '$BUILD_NUMBER_INPUT'."
                      exit 1
                      ;;
                    *)
                      if [ "${#BUILD_NUMBER_INPUT}" -gt 10 ]; then
                        echo "::error::build-number '$BUILD_NUMBER_INPUT' exceeds Android's versionCode limit of $max_build_number."
                        exit 1
                      fi
                      build_number="$BUILD_NUMBER_INPUT"
                      ;;
                  esac
                  if [ -n "$build_number" ] && { [ "$build_number" -lt 1 ] || [ "$build_number" -gt "$max_build_number" ]; }; then
                    echo "::error::Build number $build_number is outside 1..$max_build_number, the range Google Play accepts as versionCode."
                    exit 1
                  fi

                  version_pattern='^[0-9]+(\.[0-9]+){0,2}$'
                  tag_version=''
                  if [ -n "$RELEASE_TAG" ]; then
                    candidate="${RELEASE_TAG##*@}"
                    candidate="${candidate#v}"
                    if printf '%s' "$candidate" | grep -Eq "$version_pattern"; then
                      tag_version="$candidate"
                    fi
                  fi
                  marketing_version=''
                  case "$MARKETING_VERSION_INPUT" in
                    ''|none) ;;
                    auto)
                      marketing_version="$tag_version"
                      if [ -n "$RELEASE_TAG" ] && [ -z "$tag_version" ]; then
                        echo "::notice::Release tag '$RELEASE_TAG' is not shaped [<prefix>@][v]X[.Y[.Z]]; STORE_MARKETING_VERSION is not exported."
                      fi
                      ;;
                    tag)
                      if [ -z "$tag_version" ]; then
                        echo "::error::marketing-version tag needs a release tag shaped [<prefix>@][v]X[.Y[.Z]]; got '${RELEASE_TAG:-<none>}'."
                        exit 1
                      fi
                      marketing_version="$tag_version"
                      ;;
                    *)
                      if ! printf '%s' "$MARKETING_VERSION_INPUT" | grep -Eq "$version_pattern"; then
                        echo "::error::marketing-version must be auto, tag, none, or X[.Y[.Z]]; got '$MARKETING_VERSION_INPUT'."
                        exit 1
                      fi
                      marketing_version="$MARKETING_VERSION_INPUT"
                      ;;
                  esac
                  echo "build-number=$build_number" >> "$GITHUB_OUTPUT"
                  echo "marketing-version=$marketing_version" >> "$GITHUB_OUTPUT"
                  echo "STORE_BUILD_NUMBER=${build_number:-<not exported>} STORE_MARKETING_VERSION=${marketing_version:-<not exported>}"

            - name: Resolve package manager
              if: steps.targets.outputs.record == 'true'
              id: package-manager
              shell: bash
              env:
                  PACKAGE_MANAGER: ${{ inputs.package-manager }}
                  LOCKFILE_REQUIRED: ''
              run: |
                  set -euo pipefail
                  pm=''
                  case "$PACKAGE_MANAGER" in
                    '') ;;
                    yarn|pnpm|npm) pm="$PACKAGE_MANAGER" ;;
                    *)
                      echo "::error::package-manager must be '' (auto-detect), yarn, pnpm or npm; got '$PACKAGE_MANAGER'."
                      exit 1
                      ;;
                  esac
                  declared=''
                  declared_version=''
                  if { [ -z "$pm" ] || [ "$pm" = pnpm ]; } && [ -f package.json ]; then
                    if command -v jq >/dev/null 2>&1; then
                      declared_spec="$(jq -r '
                        (try (.devEngines.packageManager) catch null) as $raw
                        | (if ($raw | type) == "array" then ($raw[0] // null) else $raw end) as $de
                        | (if ($de | type) == "object" then [($de.name // ""), ($de.version // "")] else ["", ""] end) as $dev
                        | (if ((.packageManager // "") | type) == "string" and (.packageManager // "") != ""
                           then (.packageManager | if test("@") then [split("@")[0], (split("@")[1] | split("+")[0])] else [., ""] end)
                           else ["", ""] end) as $spec
                        | (if $dev[0] != "" then $dev[0] else $spec[0] end) as $name
                        | [$name,
                           (if $dev[0] != "" and $dev[1] != "" then $dev[1]
                            elif $spec[0] == $name then $spec[1]
                            else "" end)]
                        | @tsv' package.json)"
                      declared="$(printf '%s\n' "$declared_spec" | cut -f1)"
                      declared_version="$(printf '%s\n' "$declared_spec" | cut -f2)"
                    else
                      echo "::warning::jq is not installed on this runner, so package.json's packageManager / devEngines.packageManager fields cannot be read; falling back to root lockfile detection. Install jq, or set the package-manager input explicitly."
                    fi
                  fi
                  if [ -z "$pm" ] && [ -n "$declared" ]; then
                    case "$declared" in
                      yarn|pnpm|npm) pm="$declared" ;;
                      *)
                        echo "::error::package.json declares package manager '$declared', which is not yarn, pnpm or npm; set the package-manager input explicitly."
                        exit 1
                        ;;
                    esac
                  fi
                  if [ -z "$pm" ]; then
                    lockfiles=''
                    lockfile_count=0
                    if [ -f yarn.lock ]; then pm=yarn; lockfiles="${lockfiles}yarn.lock "; lockfile_count=$((lockfile_count + 1)); fi
                    if [ -f pnpm-lock.yaml ]; then pm=pnpm; lockfiles="${lockfiles}pnpm-lock.yaml "; lockfile_count=$((lockfile_count + 1)); fi
                    if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
                      pm=npm
                      lockfile_count=$((lockfile_count + 1))
                      if [ -f package-lock.json ]; then lockfiles="${lockfiles}package-lock.json "; fi
                      if [ -f npm-shrinkwrap.json ]; then lockfiles="${lockfiles}npm-shrinkwrap.json "; fi
                    fi
                    if [ "$lockfile_count" -eq 0 ]; then
                      echo "::error::Cannot resolve the package manager: package.json declares none and there is no yarn.lock, pnpm-lock.yaml, package-lock.json or npm-shrinkwrap.json at the repository root. Set the package-manager input explicitly."
                      exit 1
                    fi
                    if [ "$lockfile_count" -gt 1 ]; then
                      echo "::error::Cannot resolve the package manager: multiple root lockfiles found (${lockfiles% }). Set the package-manager input explicitly."
                      exit 1
                    fi
                  fi
                  if [ "$pm" = pnpm ] && { [ "$declared" != pnpm ] || [ -z "$declared_version" ]; }; then
                    echo "::error::Resolved package manager is pnpm, but no pnpm version is readable from the repository-root package.json. pnpm/action-setup takes the version from 'packageManager: pnpm@<version>' or 'devEngines.packageManager: {name: pnpm, version: <range>}' - add one of those, and make sure jq is installed on this runner so the workflow can read it."
                    exit 1
                  fi
                  if [ -n "$LOCKFILE_REQUIRED" ]; then
                    case "$pm" in
                      yarn) wanted='yarn.lock' ;;
                      pnpm) wanted='pnpm-lock.yaml' ;;
                      *) wanted='package-lock.json npm-shrinkwrap.json' ;;
                    esac
                    found=''
                    for candidate in $wanted; do
                      if [ -f "$candidate" ]; then found="$candidate"; break; fi
                    done
                    if [ -z "$found" ]; then
                      echo "::error::Resolved package manager is $pm, but this job caches JS dependencies with actions/setup-node and the repository root has none of: $wanted. Commit the lockfile, or set the package-manager input to the manager whose lockfile this repository actually has."
                      exit 1
                    fi
                  fi
                  echo "Resolved package manager: $pm"
                  echo "pm=$pm" >> "$GITHUB_OUTPUT"

            - name: Setup pnpm
              if: steps.targets.outputs.record == 'true' && steps.package-manager.outputs.pm == 'pnpm'
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node
              if: steps.targets.outputs.record == 'true'
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ inputs.node-version }}

            - name: Enable corepack
              if: steps.targets.outputs.record == 'true' && inputs.enable-corepack && steps.package-manager.outputs.pm != 'pnpm'
              shell: bash
              run: corepack enable

            - name: Install dependencies
              if: steps.targets.outputs.record == 'true'
              shell: bash
              env:
                  INSTALL_COMMAND: ${{ inputs.install-command }}
              run: eval "$INSTALL_COMMAND"

            - name: Build workspace JS dependencies
              if: steps.targets.outputs.record == 'true' && inputs.build-command != ''
              shell: bash
              env:
                  BUILD_COMMAND: ${{ inputs.build-command }}
              run: eval "$BUILD_COMMAND"

            - name: Fingerprint every target under its build env
              if: steps.targets.outputs.record == 'true'
              id: fingerprints
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  TARGETS: ${{ steps.targets.outputs.targets }}
                  PUBLISH_ENV: ${{ inputs.publish-env }}
                  STORE_BUILD_NUMBER_VALUE: ${{ steps.version.outputs.build-number }}
                  STORE_MARKETING_VERSION_VALUE: ${{ steps.version.outputs.marketing-version }}
                  FINGERPRINT_VERSION: ${{ inputs.fingerprint-version }}
                  EAS_EXTRA_ENV_NAMES: ${{ steps.eas-extra-env.outputs.names }}
              run: |
                  set -euo pipefail
                  excluded_env=()
                  for excluded_name in ${EAS_EXTRA_ENV_NAMES:-}; do
                    excluded_env+=(-u "$excluded_name")
                  done
                  publish_env=()
                  while IFS= read -r line; do
                    [ -n "$line" ] || continue
                    case "$line" in
                      *=*) ;;
                      *)
                        echo "::error::publish-env line '$line' is missing '='; expected KEY=VALUE."
                        exit 1
                        ;;
                    esac
                    name="${line%%=*}"
                    case "$name" in
                      ''|[!A-Za-z_]*|*[!A-Za-z0-9_]*)
                        echo "::error::publish-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    publish_env+=("$line")
                  done <<< "$PUBLISH_ENV"
                  store_env=()
                  [ -z "$STORE_BUILD_NUMBER_VALUE" ] || store_env+=("STORE_BUILD_NUMBER=$STORE_BUILD_NUMBER_VALUE")
                  [ -z "$STORE_MARKETING_VERSION_VALUE" ] || store_env+=("STORE_MARKETING_VERSION=$STORE_MARKETING_VERSION_VALUE")

                  fingerprints='{}'
                  count="$(jq 'length' <<< "$TARGETS")"
                  index=0
                  while [ "$index" -lt "$count" ]; do
                    target="$(jq -c ".[$index]" <<< "$TARGETS")"
                    index=$((index + 1))
                    name="$(jq -r '.name' <<< "$target")"
                    platform="$(jq -r '.platform' <<< "$target")"
                    build_profile="$(jq -r '.buildProfile' <<< "$target")"
                    target_env=("EAS_BUILD_PROFILE=$build_profile")
                    while IFS= read -r line; do
                      [ -n "$line" ] && target_env+=("$line")
                    done < <(jq -r '.envLines' <<< "$target")
                    out_file="$RUNNER_TEMP/native-publish-fingerprint-${name}.json"
                    error_file="$RUNNER_TEMP/native-publish-fingerprint-${name}.err"
                    generate() {
                      env ${excluded_env[@]+"${excluded_env[@]}"} "${target_env[@]}" ${publish_env[@]+"${publish_env[@]}"} ${store_env[@]+"${store_env[@]}"} \
                        npx --yes "$@" "@expo/fingerprint@${FINGERPRINT_VERSION}" fingerprint:generate --platform "$platform" > "$out_file" 2> "$error_file"
                    }
                    status=0
                    generate || status=$?
                    if [ "$status" -ne 0 ] || [ ! -s "$out_file" ]; then
                      echo "::warning::@expo/fingerprint produced ${status}/empty output for target $name; retrying with a fresh npm cache and --prefer-online."
                      status=0
                      npm_config_cache="$(mktemp -d)" generate --prefer-online || status=$?
                    fi
                    if [ "$status" -ne 0 ] || [ ! -s "$out_file" ]; then
                      cat "$error_file" >&2 || true
                      echo "::error::@expo/fingerprint failed for target $name (status $status); its native runtime cannot be compared."
                      exit 1
                    fi
                    hash="$(jq -r '.hash // ""' "$out_file")"
                    if [ -z "$hash" ]; then
                      echo "::error::@expo/fingerprint wrote no hash for target $name."
                      exit 1
                    fi
                    echo "Fingerprint $name ($platform): $hash"
                    fingerprints="$(jq -c --arg name "$name" --arg hash "$hash" '. + {($name): $hash}' <<< "$fingerprints")"
                  done
                  echo "fingerprints=$fingerprints" >> "$GITHUB_OUTPUT"

            - name: Resolve the store baseline
              if: inputs.mode != 'native'
              id: baseline
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  RELEASE_TAG: ${{ steps.targets.outputs.release-tag }}
                  RECORD_ASSET: ${{ steps.targets.outputs.record-asset }}
                  TARGETS: ${{ steps.targets.outputs.targets }}
              run: |
                  set -euo pipefail
                  listing="$RUNNER_TEMP/native-publish-releases.tsv"
                  if ! gh api --paginate --slurp "repos/${REPOSITORY}/releases?per_page=100" > "$listing.json" \
                    || ! jq -r 'add // [] | .[] | select(.draft | not) | .tag_name as $tag | .assets[] | [$tag, .name, (.id | tostring)] | @tsv' "$listing.json" > "$listing"; then
                    echo "::error::Cannot list the releases of ${REPOSITORY}, so the store baseline is unknown; refusing to decide between a native build and an OTA."
                    exit 1
                  fi
                  wanted="$(jq -c 'map({name, platform})' <<< "$TARGETS")"
                  records_dir="$RUNNER_TEMP/native-publish-records"
                  mkdir -p "$records_dir"
                  baseline_tag=''
                  baseline_file=''
                  baseline_at=''
                  while IFS="$(printf '\t')" read -r tag asset id; do
                    [ "$asset" = "$RECORD_ASSET" ] || continue
                    [ "$tag" != "$RELEASE_TAG" ] || continue
                    file="$records_dir/${id}.json"
                    if ! gh api -H 'Accept: application/octet-stream' "repos/${REPOSITORY}/releases/assets/${id}" > "$file"; then
                      echo "::error::Cannot download ${RECORD_ASSET} from release ${tag}; refusing to decide on a partial view of what shipped."
                      exit 1
                    fi
                    if ! jq -e '.schema == 1 and (.targets | type) == "object" and (.recordedAt | type) == "string"' "$file" >/dev/null 2>&1; then
                      echo "::error::${RECORD_ASSET} on release ${tag} is not a schema-1 store build record; fix or delete that asset."
                      exit 1
                    fi
                    if ! jq -e --argjson wanted "$wanted" \
                      '. as $record | all($wanted[]; ($record.targets[.name].platform // "") == .platform and (($record.targets[.name].fingerprint // "") | length) > 0)' \
                      "$file" >/dev/null; then
                      echo "Release ${tag}: record does not show every current target shipped; not a baseline."
                      continue
                    fi
                    recorded_at="$(jq -r '.recordedAt' "$file")"
                    if [ -z "$baseline_at" ] || [[ "$recorded_at" > "$baseline_at" ]]; then
                      baseline_tag="$tag"
                      baseline_file="$file"
                      baseline_at="$recorded_at"
                    fi
                  done < "$listing"
                  if [ -n "$baseline_tag" ]; then
                    echo "Store baseline: release ${baseline_tag}, recorded ${baseline_at}."
                  else
                    echo "No release carries a ${RECORD_ASSET} showing every current target shipped."
                  fi
                  echo "baseline-tag=$baseline_tag" >> "$GITHUB_OUTPUT"
                  echo "baseline-file=$baseline_file" >> "$GITHUB_OUTPUT"

            - name: Decide between a native build and an OTA
              id: decide
              shell: bash
              env:
                  MODE: ${{ inputs.mode }}
                  TARGETS: ${{ steps.targets.outputs.targets }}
                  FINGERPRINTS: ${{ steps.fingerprints.outputs.fingerprints }}
                  BASELINE_TAG: ${{ steps.baseline.outputs.baseline-tag }}
                  BASELINE_FILE: ${{ steps.baseline.outputs.baseline-file }}
              run: |
                  set -euo pipefail
                  if [ "$MODE" = native ]; then
                    echo "decision=native" >> "$GITHUB_OUTPUT"
                    echo "changed-targets=" >> "$GITHUB_OUTPUT"
                    echo "Mode native: building and submitting every target."
                    exit 0
                  fi
                  changed=()
                  rows=''
                  fingerprints="${FINGERPRINTS:-}"
                  [ -n "$fingerprints" ] || fingerprints='{}'
                  while IFS= read -r name; do
                    current="$(jq -r --arg name "$name" '.[$name] // ""' <<< "$fingerprints")"
                    if [ -z "$current" ]; then
                      echo "::error::No fingerprint was computed for target $name; refusing to decide."
                      exit 1
                    fi
                    shipped=''
                    if [ -n "$BASELINE_FILE" ]; then
                      shipped="$(jq -r --arg name "$name" '.targets[$name].fingerprint // ""' "$BASELINE_FILE")"
                    fi
                    if [ "$current" != "$shipped" ]; then
                      changed+=("$name")
                    fi
                    rows="${rows}| ${name} | \`${shipped:-none}\` | \`${current}\` |"$'\n'
                  done < <(jq -r '.[].name' <<< "$TARGETS")

                  changed_list="$(IFS=,; printf '%s' "${changed[*]:-}")"
                  if [ -z "$BASELINE_FILE" ]; then
                    if [ "$MODE" = ota-only ]; then
                      echo "::error::mode ota-only found no release whose store build record shows every target shipped, so there is no runtime an OTA is known to reach. Run once in mode native with write-store-record, or in mode auto, to record one."
                      exit 1
                    fi
                    decision=native
                    reason="no release records every target as shipped, so there is no baseline"
                  elif [ "${#changed[@]}" -gt 0 ]; then
                    if [ "$MODE" = ota-only ]; then
                      echo "::error::mode ota-only: the native runtime of ${changed_list} changed since release ${BASELINE_TAG}; an OTA would target a runtime no shipped binary has. A store build is required."
                      exit 1
                    fi
                    decision=native
                    reason="the native runtime of ${changed_list} changed since release ${BASELINE_TAG}"
                  else
                    decision=ota
                    reason="every target's native runtime matches release ${BASELINE_TAG}"
                  fi
                  echo "decision=$decision" >> "$GITHUB_OUTPUT"
                  echo "changed-targets=$changed_list" >> "$GITHUB_OUTPUT"
                  echo "Decision: $decision ($reason)."
                  {
                    echo "### Native publish decision: \`$decision\`"
                    echo
                    echo "$reason."
                    echo
                    echo "| Target | Shipped runtime | This release |"
                    echo "| --- | --- | --- |"
                    printf '%s' "$rows"
                  } >> "$GITHUB_STEP_SUMMARY"

    ios-publish:
        name: iOS build and publish (${{ matrix.target.name }})
        needs: [plan]
        if: needs.plan.outputs.decision == 'native' && needs.plan.outputs.has-ios == 'true'
        strategy:
            fail-fast: false
            matrix:
                target: ${{ fromJSON(needs.plan.outputs.ios-targets) }}
        permissions:
            contents: read
        runs-on: ${{ fromJSON(inputs.ios-runner-labels) }}
        timeout-minutes: ${{ inputs.build-timeout-minutes }}
        env:
            EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
            HAS_EAS_EXTRA_ENV: ${{ secrets.EAS_EXTRA_ENV != '' }}

        steps:
            - name: Apply RunsOn cache bypass
              uses: rnw-community/mobile-ci/actions/runs-on-cache-bypass@validate/v4.1 # validate/v4.1 fleet-validation pin
              with:
                  enabled: ${{ inputs.runs-on-cache-bypass }}
            - name: Validate required secrets
              shell: bash
              env:
                  ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
                  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
                  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
              run: |
                  set -euo pipefail
                  missing=()
                  [ -z "${EXPO_TOKEN:-}" ] && missing+=(EXPO_TOKEN)
                  [ -z "${ASC_API_KEY:-}" ] && missing+=(ASC_API_KEY)
                  [ -z "${ASC_KEY_ID:-}" ] && missing+=(ASC_KEY_ID)
                  [ -z "${ASC_ISSUER_ID:-}" ] && missing+=(ASC_ISSUER_ID)
                  if [ "${#missing[@]}" -gt 0 ]; then
                    echo "::error::ios-publish requires secrets: ${missing[*]}. ASC_KEY_ID and ASC_ISSUER_ID must accompany ASC_API_KEY, otherwise EAS cannot resolve the key non-interactively and falls back to an interactive prompt that cannot be answered in CI. Pass them via 'secrets: inherit' or an explicit secrets: block in the caller workflow."
                    exit 1
                  fi

            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - name: Apply eas.json build profile env
              shell: bash
              env:
                  PROFILE_ENV: ${{ matrix.target.envLines }}
                  BUILD_PROFILE: ${{ matrix.target.buildProfile }}
                  PUBLISH_ENV: ${{ inputs.publish-env }}
              run: |
                  set -euo pipefail
                  applied=0
                  while IFS= read -r line; do
                    [ -n "$line" ] || continue
                    name="${line%%=*}"
                    case "$line" in
                      *=*) ;;
                      *)
                        echo "::error::Resolved profile env line for '$name' is missing '='; the plan job emitted something this step cannot apply."
                        exit 1
                        ;;
                    esac
                    case "$name" in
                      ''|[!A-Za-z_]*|*[!A-Za-z0-9_]*)
                        echo "::error::Resolved profile env name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    while IFS= read -r override; do
                      case "$override" in
                        "$name="*)
                          if [ "$override" != "$line" ]; then
                            echo "::warning::publish-env sets $name to a different value than eas.json build profile '$BUILD_PROFILE'. Outside eas build (eas submit, hooks, prebuild) publish-env wins; inside eas build EAS applies the profile value, so the two can resolve different app configs."
                          fi
                          ;;
                      esac
                    done <<< "$PUBLISH_ENV"
                    echo "$line" >> "$GITHUB_ENV"
                    applied=$((applied + 1))
                  done <<< "$PROFILE_ENV"
                  echo "Applied $applied variable(s) from eas.json build profile '$BUILD_PROFILE' (extends resolved)."

            - name: Apply publish-env
              if: inputs.publish-env != ''
              shell: bash
              env:
                  PUBLISH_ENV: ${{ inputs.publish-env }}
              run: |
                  set -euo pipefail
                  while IFS= read -r line; do
                    [ -z "$line" ] && continue
                    case "$line" in
                      *=*) ;;
                      *)
                        echo "::error::publish-env line '$line' is missing '='; expected KEY=VALUE."
                        exit 1
                        ;;
                    esac
                    name="${line%%=*}"
                    case "$name" in
                      ''|[!A-Za-z_]*)
                        echo "::error::publish-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    case "$name" in
                      *[!A-Za-z0-9_]*)
                        echo "::error::publish-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    echo "$line" >> "$GITHUB_ENV"
                  done <<< "$PUBLISH_ENV"

            - name: Apply the store build number and marketing version
              if: needs.plan.outputs.build-number != '' || needs.plan.outputs.marketing-version != ''
              shell: bash
              env:
                  BUILD_NUMBER: ${{ needs.plan.outputs.build-number }}
                  MARKETING_VERSION: ${{ needs.plan.outputs.marketing-version }}
              run: |
                  set -euo pipefail
                  if [ -n "$BUILD_NUMBER" ]; then
                    echo "STORE_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
                  fi
                  if [ -n "$MARKETING_VERSION" ]; then
                    echo "STORE_MARKETING_VERSION=$MARKETING_VERSION" >> "$GITHUB_ENV"
                  fi

            - name: Apply EAS_EXTRA_ENV
              if: env.HAS_EAS_EXTRA_ENV == 'true'
              uses: rnw-community/mobile-ci/actions/apply-secret-env@validate/v4.1 # validate/v4.1 fleet-validation pin
              with:
                  env: ${{ secrets.EAS_EXTRA_ENV }}
                  label: EAS_EXTRA_ENV

            - name: Resolve package manager
              id: package-manager
              shell: bash
              env:
                  PACKAGE_MANAGER: ${{ inputs.package-manager }}
                  LOCKFILE_REQUIRED: ''
              run: |
                  set -euo pipefail
                  pm=''
                  case "$PACKAGE_MANAGER" in
                    '') ;;
                    yarn|pnpm|npm) pm="$PACKAGE_MANAGER" ;;
                    *)
                      echo "::error::package-manager must be '' (auto-detect), yarn, pnpm or npm; got '$PACKAGE_MANAGER'."
                      exit 1
                      ;;
                  esac
                  declared=''
                  declared_version=''
                  if { [ -z "$pm" ] || [ "$pm" = pnpm ]; } && [ -f package.json ]; then
                    if command -v jq >/dev/null 2>&1; then
                      declared_spec="$(jq -r '
                        (try (.devEngines.packageManager) catch null) as $raw
                        | (if ($raw | type) == "array" then ($raw[0] // null) else $raw end) as $de
                        | (if ($de | type) == "object" then [($de.name // ""), ($de.version // "")] else ["", ""] end) as $dev
                        | (if ((.packageManager // "") | type) == "string" and (.packageManager // "") != ""
                           then (.packageManager | if test("@") then [split("@")[0], (split("@")[1] | split("+")[0])] else [., ""] end)
                           else ["", ""] end) as $spec
                        | (if $dev[0] != "" then $dev[0] else $spec[0] end) as $name
                        | [$name,
                           (if $dev[0] != "" and $dev[1] != "" then $dev[1]
                            elif $spec[0] == $name then $spec[1]
                            else "" end)]
                        | @tsv' package.json)"
                      declared="$(printf '%s\n' "$declared_spec" | cut -f1)"
                      declared_version="$(printf '%s\n' "$declared_spec" | cut -f2)"
                    else
                      echo "::warning::jq is not installed on this runner, so package.json's packageManager / devEngines.packageManager fields cannot be read; falling back to root lockfile detection. Install jq, or set the package-manager input explicitly."
                    fi
                  fi
                  if [ -z "$pm" ] && [ -n "$declared" ]; then
                    case "$declared" in
                      yarn|pnpm|npm) pm="$declared" ;;
                      *)
                        echo "::error::package.json declares package manager '$declared', which is not yarn, pnpm or npm; set the package-manager input explicitly."
                        exit 1
                        ;;
                    esac
                  fi
                  if [ -z "$pm" ]; then
                    lockfiles=''
                    lockfile_count=0
                    if [ -f yarn.lock ]; then pm=yarn; lockfiles="${lockfiles}yarn.lock "; lockfile_count=$((lockfile_count + 1)); fi
                    if [ -f pnpm-lock.yaml ]; then pm=pnpm; lockfiles="${lockfiles}pnpm-lock.yaml "; lockfile_count=$((lockfile_count + 1)); fi
                    if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
                      pm=npm
                      lockfile_count=$((lockfile_count + 1))
                      if [ -f package-lock.json ]; then lockfiles="${lockfiles}package-lock.json "; fi
                      if [ -f npm-shrinkwrap.json ]; then lockfiles="${lockfiles}npm-shrinkwrap.json "; fi
                    fi
                    if [ "$lockfile_count" -eq 0 ]; then
                      echo "::error::Cannot resolve the package manager: package.json declares none and there is no yarn.lock, pnpm-lock.yaml, package-lock.json or npm-shrinkwrap.json at the repository root. Set the package-manager input explicitly."
                      exit 1
                    fi
                    if [ "$lockfile_count" -gt 1 ]; then
                      echo "::error::Cannot resolve the package manager: multiple root lockfiles found (${lockfiles% }). Set the package-manager input explicitly."
                      exit 1
                    fi
                  fi
                  if [ "$pm" = pnpm ] && { [ "$declared" != pnpm ] || [ -z "$declared_version" ]; }; then
                    echo "::error::Resolved package manager is pnpm, but no pnpm version is readable from the repository-root package.json. pnpm/action-setup takes the version from 'packageManager: pnpm@<version>' or 'devEngines.packageManager: {name: pnpm, version: <range>}' - add one of those, and make sure jq is installed on this runner so the workflow can read it."
                    exit 1
                  fi
                  if [ -n "$LOCKFILE_REQUIRED" ]; then
                    case "$pm" in
                      yarn) wanted='yarn.lock' ;;
                      pnpm) wanted='pnpm-lock.yaml' ;;
                      *) wanted='package-lock.json npm-shrinkwrap.json' ;;
                    esac
                    found=''
                    for candidate in $wanted; do
                      if [ -f "$candidate" ]; then found="$candidate"; break; fi
                    done
                    if [ -z "$found" ]; then
                      echo "::error::Resolved package manager is $pm, but this job caches JS dependencies with actions/setup-node and the repository root has none of: $wanted. Commit the lockfile, or set the package-manager input to the manager whose lockfile this repository actually has."
                      exit 1
                    fi
                  fi
                  echo "Resolved package manager: $pm"
                  echo "pm=$pm" >> "$GITHUB_OUTPUT"

            - name: Setup pnpm
              if: steps.package-manager.outputs.pm == 'pnpm'
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ inputs.node-version }}

            - name: Enable corepack
              if: inputs.enable-corepack && steps.package-manager.outputs.pm != 'pnpm'
              shell: bash
              run: corepack enable

            - name: Install dependencies
              shell: bash
              env:
                  INSTALL_COMMAND: ${{ inputs.install-command }}
              run: eval "$INSTALL_COMMAND"

            - name: Build workspace JS dependencies
              if: inputs.build-command != ''
              shell: bash
              env:
                  BUILD_COMMAND: ${{ inputs.build-command }}
              run: eval "$BUILD_COMMAND"

            - name: Write App Store Connect API key
              id: asc-key
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
                  ASC_KEY_PATH_INPUT: ${{ inputs.asc-key-path }}
              run: |
                  set -euo pipefail
                  if [ -n "$ASC_KEY_PATH_INPUT" ]; then
                    key_path="$ASC_KEY_PATH_INPUT"
                  else
                    key_path="$RUNNER_TEMP/ios-publish/asc-api-key.p8"
                  fi
                  mkdir -p "$(dirname "$key_path")"
                  printf '%s' "$ASC_API_KEY" > "$key_path"
                  chmod 600 "$key_path"
                  absolute_key_path="$(cd "$(dirname "$key_path")" && pwd)/$(basename "$key_path")"
                  echo "key-path=$absolute_key_path" >> "$GITHUB_OUTPUT"

            - name: Run iOS pre-submit command
              if: inputs.ios-pre-submit-command != ''
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  EXPO_ASC_API_KEY_PATH: ${{ steps.asc-key.outputs.key-path }}
                  IOS_PRE_SUBMIT_COMMAND: ${{ inputs.ios-pre-submit-command }}
              run: eval "$IOS_PRE_SUBMIT_COMMAND"

            - name: EAS build (iOS)
              id: build
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  EAS_CLI_VERSION: ${{ inputs.eas-cli-version }}
                  BUILD_PROFILE: ${{ matrix.target.buildProfile }}
                  EXPO_ASC_API_KEY_PATH: ${{ steps.asc-key.outputs.key-path }}
                  EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
                  EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
              run: |
                  set -euo pipefail
                  output_path="$RUNNER_TEMP/ios-publish/app.ipa"
                  mkdir -p "$(dirname "$output_path")"
                  npx --yes "eas-cli@${EAS_CLI_VERSION}" build \
                    --platform ios \
                    --profile "$BUILD_PROFILE" \
                    --local \
                    --non-interactive \
                    --output "$output_path" 2>&1 | LC_ALL=C sed -E 's#[A-Za-z0-9+/=]{128,}#[REDACTED encoded build payload]#g'
                  echo "artifact-path=$output_path" >> "$GITHUB_OUTPUT"

            - name: Upload iOS build artifact
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: ios-publish-build${{ matrix.target.artifactSuffix }}
                  path: ${{ steps.build.outputs.artifact-path }}
                  retention-days: 14

            - name: EAS submit (iOS)
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  EAS_CLI_VERSION: ${{ inputs.eas-cli-version }}
                  SUBMIT_PROFILE: ${{ matrix.target.submitProfile }}
                  ARTIFACT_PATH: ${{ steps.build.outputs.artifact-path }}
                  EXPO_ASC_API_KEY_PATH: ${{ steps.asc-key.outputs.key-path }}
                  EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
                  EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
              run: |
                  set -euo pipefail
                  npx --yes "eas-cli@${EAS_CLI_VERSION}" submit \
                    --platform ios \
                    --profile "$SUBMIT_PROFILE" \
                    --non-interactive \
                    --path "$ARTIFACT_PATH"

            - name: Record the submitted target
              if: needs.plan.outputs.record == 'true'
              shell: bash
              env:
                  TARGET_NAME: ${{ matrix.target.name }}
                  TARGET_PLATFORM: ${{ matrix.target.platform }}
                  BUILD_PROFILE: ${{ matrix.target.buildProfile }}
                  SUBMIT_PROFILE: ${{ matrix.target.submitProfile }}
                  FINGERPRINTS: ${{ needs.plan.outputs.fingerprints }}
              run: |
                  set -euo pipefail
                  fingerprint=''
                  if [ -n "$FINGERPRINTS" ]; then
                    fingerprint="$(jq -r --arg name "$TARGET_NAME" '.[$name] // ""' <<< "$FINGERPRINTS")"
                  fi
                  if [ -z "$fingerprint" ]; then
                    echo "::error::The plan job computed no fingerprint for target $TARGET_NAME, so its submitted build cannot be recorded."
                    exit 1
                  fi
                  marker_dir="$RUNNER_TEMP/store-submitted"
                  mkdir -p "$marker_dir"
                  jq -n --arg name "$TARGET_NAME" --arg platform "$TARGET_PLATFORM" \
                    --arg buildProfile "$BUILD_PROFILE" --arg submitProfile "$SUBMIT_PROFILE" \
                    --arg fingerprint "$fingerprint" \
                    '{name: $name, platform: $platform, buildProfile: $buildProfile, submitProfile: $submitProfile, fingerprint: $fingerprint}' \
                    > "$marker_dir/${TARGET_NAME}.json"

            - name: Upload the submitted-target marker
              if: needs.plan.outputs.record == 'true'
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: store-submitted-${{ matrix.target.name }}
                  path: ${{ runner.temp }}/store-submitted/${{ matrix.target.name }}.json
                  retention-days: 14
                  overwrite: true
                  if-no-files-found: error

            - name: Run iOS post-submit command
              if: inputs.ios-post-submit-command != ''
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  EXPO_ASC_API_KEY_PATH: ${{ steps.asc-key.outputs.key-path }}
                  IOS_POST_SUBMIT_COMMAND: ${{ inputs.ios-post-submit-command }}
              run: eval "$IOS_POST_SUBMIT_COMMAND"

            - name: Remove App Store Connect API key
              if: always()
              shell: bash
              env:
                  ASC_KEY_PATH: ${{ steps.asc-key.outputs.key-path }}
              run: |
                  if [ -n "${ASC_KEY_PATH:-}" ]; then
                    rm -f "$ASC_KEY_PATH"
                  fi

    android-lint-gate:
        name: Android release lint (Play policy gate, ${{ matrix.target.name }})
        needs: [plan]
        if: inputs.android-lint-gate && needs.plan.outputs.decision == 'native' && needs.plan.outputs.has-android == 'true'
        strategy:
            fail-fast: false
            matrix:
                target: ${{ fromJSON(needs.plan.outputs.android-targets) }}
        permissions:
            contents: read
        runs-on: ${{ fromJSON(inputs.lint-runner-labels) }}
        timeout-minutes: ${{ inputs.lint-timeout-minutes }}
        env:
            HAS_EAS_EXTRA_ENV: ${{ secrets.EAS_EXTRA_ENV != '' }}

        steps:
            - name: Apply RunsOn cache bypass
              uses: rnw-community/mobile-ci/actions/runs-on-cache-bypass@validate/v4.1 # validate/v4.1 fleet-validation pin
              with:
                  enabled: ${{ inputs.runs-on-cache-bypass }}
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - name: Apply eas.json build profile env
              shell: bash
              env:
                  PROFILE_ENV: ${{ matrix.target.envLines }}
                  BUILD_PROFILE: ${{ matrix.target.buildProfile }}
                  PUBLISH_ENV: ${{ inputs.publish-env }}
              run: |
                  set -euo pipefail
                  applied=0
                  while IFS= read -r line; do
                    [ -n "$line" ] || continue
                    name="${line%%=*}"
                    case "$line" in
                      *=*) ;;
                      *)
                        echo "::error::Resolved profile env line for '$name' is missing '='; the plan job emitted something this step cannot apply."
                        exit 1
                        ;;
                    esac
                    case "$name" in
                      ''|[!A-Za-z_]*|*[!A-Za-z0-9_]*)
                        echo "::error::Resolved profile env name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    while IFS= read -r override; do
                      case "$override" in
                        "$name="*)
                          if [ "$override" != "$line" ]; then
                            echo "::warning::publish-env sets $name to a different value than eas.json build profile '$BUILD_PROFILE'. Outside eas build (eas submit, hooks, prebuild) publish-env wins; inside eas build EAS applies the profile value, so the two can resolve different app configs."
                          fi
                          ;;
                      esac
                    done <<< "$PUBLISH_ENV"
                    echo "$line" >> "$GITHUB_ENV"
                    applied=$((applied + 1))
                  done <<< "$PROFILE_ENV"
                  echo "Applied $applied variable(s) from eas.json build profile '$BUILD_PROFILE' (extends resolved)."

            - name: Apply publish-env
              if: inputs.publish-env != ''
              shell: bash
              env:
                  PUBLISH_ENV: ${{ inputs.publish-env }}
              run: |
                  set -euo pipefail
                  while IFS= read -r line; do
                    [ -z "$line" ] && continue
                    case "$line" in
                      *=*) ;;
                      *)
                        echo "::error::publish-env line '$line' is missing '='; expected KEY=VALUE."
                        exit 1
                        ;;
                    esac
                    name="${line%%=*}"
                    case "$name" in
                      ''|[!A-Za-z_]*)
                        echo "::error::publish-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    case "$name" in
                      *[!A-Za-z0-9_]*)
                        echo "::error::publish-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    echo "$line" >> "$GITHUB_ENV"
                  done <<< "$PUBLISH_ENV"

            - name: Apply EAS_EXTRA_ENV
              if: env.HAS_EAS_EXTRA_ENV == 'true'
              uses: rnw-community/mobile-ci/actions/apply-secret-env@validate/v4.1 # validate/v4.1 fleet-validation pin
              with:
                  env: ${{ secrets.EAS_EXTRA_ENV }}
                  label: EAS_EXTRA_ENV

            - name: Resolve package manager
              id: package-manager
              shell: bash
              env:
                  PACKAGE_MANAGER: ${{ inputs.package-manager }}
                  LOCKFILE_REQUIRED: ''
              run: |
                  set -euo pipefail
                  pm=''
                  case "$PACKAGE_MANAGER" in
                    '') ;;
                    yarn|pnpm|npm) pm="$PACKAGE_MANAGER" ;;
                    *)
                      echo "::error::package-manager must be '' (auto-detect), yarn, pnpm or npm; got '$PACKAGE_MANAGER'."
                      exit 1
                      ;;
                  esac
                  declared=''
                  declared_version=''
                  if { [ -z "$pm" ] || [ "$pm" = pnpm ]; } && [ -f package.json ]; then
                    if command -v jq >/dev/null 2>&1; then
                      declared_spec="$(jq -r '
                        (try (.devEngines.packageManager) catch null) as $raw
                        | (if ($raw | type) == "array" then ($raw[0] // null) else $raw end) as $de
                        | (if ($de | type) == "object" then [($de.name // ""), ($de.version // "")] else ["", ""] end) as $dev
                        | (if ((.packageManager // "") | type) == "string" and (.packageManager // "") != ""
                           then (.packageManager | if test("@") then [split("@")[0], (split("@")[1] | split("+")[0])] else [., ""] end)
                           else ["", ""] end) as $spec
                        | (if $dev[0] != "" then $dev[0] else $spec[0] end) as $name
                        | [$name,
                           (if $dev[0] != "" and $dev[1] != "" then $dev[1]
                            elif $spec[0] == $name then $spec[1]
                            else "" end)]
                        | @tsv' package.json)"
                      declared="$(printf '%s\n' "$declared_spec" | cut -f1)"
                      declared_version="$(printf '%s\n' "$declared_spec" | cut -f2)"
                    else
                      echo "::warning::jq is not installed on this runner, so package.json's packageManager / devEngines.packageManager fields cannot be read; falling back to root lockfile detection. Install jq, or set the package-manager input explicitly."
                    fi
                  fi
                  if [ -z "$pm" ] && [ -n "$declared" ]; then
                    case "$declared" in
                      yarn|pnpm|npm) pm="$declared" ;;
                      *)
                        echo "::error::package.json declares package manager '$declared', which is not yarn, pnpm or npm; set the package-manager input explicitly."
                        exit 1
                        ;;
                    esac
                  fi
                  if [ -z "$pm" ]; then
                    lockfiles=''
                    lockfile_count=0
                    if [ -f yarn.lock ]; then pm=yarn; lockfiles="${lockfiles}yarn.lock "; lockfile_count=$((lockfile_count + 1)); fi
                    if [ -f pnpm-lock.yaml ]; then pm=pnpm; lockfiles="${lockfiles}pnpm-lock.yaml "; lockfile_count=$((lockfile_count + 1)); fi
                    if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
                      pm=npm
                      lockfile_count=$((lockfile_count + 1))
                      if [ -f package-lock.json ]; then lockfiles="${lockfiles}package-lock.json "; fi
                      if [ -f npm-shrinkwrap.json ]; then lockfiles="${lockfiles}npm-shrinkwrap.json "; fi
                    fi
                    if [ "$lockfile_count" -eq 0 ]; then
                      echo "::error::Cannot resolve the package manager: package.json declares none and there is no yarn.lock, pnpm-lock.yaml, package-lock.json or npm-shrinkwrap.json at the repository root. Set the package-manager input explicitly."
                      exit 1
                    fi
                    if [ "$lockfile_count" -gt 1 ]; then
                      echo "::error::Cannot resolve the package manager: multiple root lockfiles found (${lockfiles% }). Set the package-manager input explicitly."
                      exit 1
                    fi
                  fi
                  if [ "$pm" = pnpm ] && { [ "$declared" != pnpm ] || [ -z "$declared_version" ]; }; then
                    echo "::error::Resolved package manager is pnpm, but no pnpm version is readable from the repository-root package.json. pnpm/action-setup takes the version from 'packageManager: pnpm@<version>' or 'devEngines.packageManager: {name: pnpm, version: <range>}' - add one of those, and make sure jq is installed on this runner so the workflow can read it."
                    exit 1
                  fi
                  if [ -n "$LOCKFILE_REQUIRED" ]; then
                    case "$pm" in
                      yarn) wanted='yarn.lock' ;;
                      pnpm) wanted='pnpm-lock.yaml' ;;
                      *) wanted='package-lock.json npm-shrinkwrap.json' ;;
                    esac
                    found=''
                    for candidate in $wanted; do
                      if [ -f "$candidate" ]; then found="$candidate"; break; fi
                    done
                    if [ -z "$found" ]; then
                      echo "::error::Resolved package manager is $pm, but this job caches JS dependencies with actions/setup-node and the repository root has none of: $wanted. Commit the lockfile, or set the package-manager input to the manager whose lockfile this repository actually has."
                      exit 1
                    fi
                  fi
                  echo "Resolved package manager: $pm"
                  echo "pm=$pm" >> "$GITHUB_OUTPUT"

            - name: Setup pnpm
              if: steps.package-manager.outputs.pm == 'pnpm'
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ inputs.node-version }}

            - name: Enable corepack
              if: inputs.enable-corepack && steps.package-manager.outputs.pm != 'pnpm'
              shell: bash
              run: corepack enable

            - name: Install dependencies
              shell: bash
              env:
                  INSTALL_COMMAND: ${{ inputs.install-command }}
              run: eval "$INSTALL_COMMAND"

            - name: Build workspace JS dependencies
              if: inputs.build-command != ''
              shell: bash
              env:
                  BUILD_COMMAND: ${{ inputs.build-command }}
              run: eval "$BUILD_COMMAND"

            - name: Generate production Android project
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  EAS_BUILD_PROFILE: ${{ matrix.target.buildProfile }}
              run: npx --yes expo prebuild --platform android --no-install --clean

            - name: Restore Gradle User Home cache keyed on the generated build files
              if: inputs.android-lint-gate-gradle-cache
              uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
              with:
                  cache-provider: basic

            - name: Run gradlew :app:lintVitalRelease
              working-directory: ${{ inputs.app-dir }}/android
              shell: bash
              env:
                  GRADLE_ARGS: ${{ inputs.android-lint-gate-gradle-args }}
              run: |
                  set -euo pipefail
                  gradle_args=()
                  if [ -n "$GRADLE_ARGS" ]; then
                    normalized_gradle_args="${GRADLE_ARGS//$'\n'/ }"
                    normalized_gradle_args="${normalized_gradle_args//$'\r'/ }"
                    read -r -a gradle_args <<< "$normalized_gradle_args"
                  fi
                  ./gradlew :app:lintVitalRelease ${gradle_args[@]+"${gradle_args[@]}"}

            - name: Verify restricted permissions are absent (Google Play policy)
              working-directory: ${{ inputs.app-dir }}/android
              shell: bash
              env:
                  # Documented, greppable list of Android permissions restricted by Google
                  # Play policy for apps without an approved declaration/use case.
                  RESTRICTED_PERMISSIONS: |
                      android.permission.READ_MEDIA_IMAGES
                      android.permission.READ_MEDIA_VIDEO
                      android.permission.MANAGE_EXTERNAL_STORAGE
              run: |
                  set -euo pipefail
                  manifests=()
                  while IFS= read -r -d '' manifest; do
                    manifests+=("$manifest")
                  done < <(find app/build/intermediates -type f -name 'AndroidManifest.xml' -path '*release*' -print0)
                  if [ "${#manifests[@]}" -eq 0 ]; then
                    echo "::error::No merged release AndroidManifest.xml found under app/build/intermediates; cannot verify restricted permissions."
                    exit 1
                  fi
                  found=0
                  while IFS= read -r permission; do
                    [ -z "$permission" ] && continue
                    for manifest in "${manifests[@]}"; do
                      if grep -q "$permission" "$manifest"; then
                        echo "::error::Restricted permission '$permission' found in $manifest (Google Play policy)."
                        found=1
                      fi
                    done
                  done <<< "$RESTRICTED_PERMISSIONS"
                  if [ "$found" -ne 0 ]; then
                    exit 1
                  fi
                  echo "No restricted permissions found in the merged manifest(s)."

            - name: Upload lint-results reports from the failed gate
              if: failure()
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: android-lint-gate-reports${{ matrix.target.artifactSuffix }}-attempt-${{ github.run_attempt }}
                  path: |
                      ${{ inputs.app-dir }}/android/**/build/reports/lint-results-*.html
                      ${{ inputs.app-dir }}/android/**/build/reports/lint-results-*.xml
                  retention-days: 14
                  if-no-files-found: ignore

    android-publish:
        name: Android build and publish (${{ matrix.target.name }})
        needs: [plan, android-lint-gate]
        if: "!cancelled() && needs.plan.result == 'success' && needs.plan.outputs.decision == 'native' && needs.plan.outputs.has-android == 'true' && (needs.android-lint-gate.result == 'success' || needs.android-lint-gate.result == 'skipped')"
        strategy:
            fail-fast: false
            matrix:
                target: ${{ fromJSON(needs.plan.outputs.android-targets) }}
        permissions:
            contents: read
        runs-on: ${{ fromJSON(inputs.android-runner-labels) }}
        timeout-minutes: ${{ inputs.build-timeout-minutes }}
        env:
            EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
