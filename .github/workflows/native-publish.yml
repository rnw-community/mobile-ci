            - name: Apply RunsOn cache bypass
              uses: rnw-community/mobile-ci/actions/runs-on-cache-bypass@validate/v4.1 # validate/v4.1 fleet-validation pin
              with:
                  enabled: ${{ inputs.runs-on-cache-bypass }}
            - name: Validate required secrets
              shell: bash
              env:
                  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
              run: |
                  set -euo pipefail
                  missing=()
                  [ -z "${EXPO_TOKEN:-}" ] && missing+=(EXPO_TOKEN)
                  [ -z "${GOOGLE_SERVICE_ACCOUNT_JSON:-}" ] && missing+=(GOOGLE_SERVICE_ACCOUNT_JSON)
                  if [ "${#missing[@]}" -gt 0 ]; then
                    echo "::error::android-publish requires secrets: ${missing[*]}. Pass them via 'secrets: inherit' or an explicit secrets: block in the caller workflow."
                    exit 1
                  fi

            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - name: Apply eas.json build profile env
              shell: bash
              env:
                  PROFILE_ENV: ${{ matrix.target.envLines }}
                  BUILD_PROFILE: ${{ matrix.target.buildProfile }}
                  PUBLISH_ENV: ${{ inputs.publish-env }}
              run: |
                  set -euo pipefail
                  applied=0
                  while IFS= read -r line; do
                    [ -n "$line" ] || continue
                    name="${line%%=*}"
                    case "$line" in
                      *=*) ;;
                      *)
                        echo "::error::Resolved profile env line for '$name' is missing '='; the plan job emitted something this step cannot apply."
                        exit 1
                        ;;
                    esac
                    case "$name" in
                      ''|[!A-Za-z_]*|*[!A-Za-z0-9_]*)
                        echo "::error::Resolved profile env name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    while IFS= read -r override; do
                      case "$override" in
                        "$name="*)
                          if [ "$override" != "$line" ]; then
                            echo "::warning::publish-env sets $name to a different value than eas.json build profile '$BUILD_PROFILE'. Outside eas build (eas submit, hooks, prebuild) publish-env wins; inside eas build EAS applies the profile value, so the two can resolve different app configs."
                          fi
                          ;;
                      esac
                    done <<< "$PUBLISH_ENV"
                    echo "$line" >> "$GITHUB_ENV"
                    applied=$((applied + 1))
                  done <<< "$PROFILE_ENV"
                  echo "Applied $applied variable(s) from eas.json build profile '$BUILD_PROFILE' (extends resolved)."

            - name: Apply publish-env
              if: inputs.publish-env != ''
              shell: bash
              env:
                  PUBLISH_ENV: ${{ inputs.publish-env }}
              run: |
                  set -euo pipefail
                  while IFS= read -r line; do
                    [ -z "$line" ] && continue
                    case "$line" in
                      *=*) ;;
                      *)
                        echo "::error::publish-env line '$line' is missing '='; expected KEY=VALUE."
                        exit 1
                        ;;
                    esac
                    name="${line%%=*}"
                    case "$name" in
                      ''|[!A-Za-z_]*)
                        echo "::error::publish-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    case "$name" in
                      *[!A-Za-z0-9_]*)
                        echo "::error::publish-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    echo "$line" >> "$GITHUB_ENV"
                  done <<< "$PUBLISH_ENV"

            - name: Apply the store build number and marketing version
              if: needs.plan.outputs.build-number != '' || needs.plan.outputs.marketing-version != ''
              shell: bash
              env:
                  BUILD_NUMBER: ${{ needs.plan.outputs.build-number }}
                  MARKETING_VERSION: ${{ needs.plan.outputs.marketing-version }}
              run: |
                  set -euo pipefail
                  if [ -n "$BUILD_NUMBER" ]; then
                    echo "STORE_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
                  fi
                  if [ -n "$MARKETING_VERSION" ]; then
                    echo "STORE_MARKETING_VERSION=$MARKETING_VERSION" >> "$GITHUB_ENV"
                  fi

            - name: Apply EAS_EXTRA_ENV
              if: env.HAS_EAS_EXTRA_ENV == 'true'
              uses: rnw-community/mobile-ci/actions/apply-secret-env@validate/v4.1 # validate/v4.1 fleet-validation pin
              with:
                  env: ${{ secrets.EAS_EXTRA_ENV }}
                  label: EAS_EXTRA_ENV

            - name: Resolve package manager
              id: package-manager
              shell: bash
              env:
                  PACKAGE_MANAGER: ${{ inputs.package-manager }}
                  LOCKFILE_REQUIRED: ''
              run: |
                  set -euo pipefail
                  pm=''
                  case "$PACKAGE_MANAGER" in
                    '') ;;
                    yarn|pnpm|npm) pm="$PACKAGE_MANAGER" ;;
                    *)
                      echo "::error::package-manager must be '' (auto-detect), yarn, pnpm or npm; got '$PACKAGE_MANAGER'."
                      exit 1
                      ;;
                  esac
                  declared=''
                  declared_version=''
                  if { [ -z "$pm" ] || [ "$pm" = pnpm ]; } && [ -f package.json ]; then
                    if command -v jq >/dev/null 2>&1; then
                      declared_spec="$(jq -r '
                        (try (.devEngines.packageManager) catch null) as $raw
                        | (if ($raw | type) == "array" then ($raw[0] // null) else $raw end) as $de
                        | (if ($de | type) == "object" then [($de.name // ""), ($de.version // "")] else ["", ""] end) as $dev
                        | (if ((.packageManager // "") | type) == "string" and (.packageManager // "") != ""
                           then (.packageManager | if test("@") then [split("@")[0], (split("@")[1] | split("+")[0])] else [., ""] end)
                           else ["", ""] end) as $spec
                        | (if $dev[0] != "" then $dev[0] else $spec[0] end) as $name
                        | [$name,
                           (if $dev[0] != "" and $dev[1] != "" then $dev[1]
                            elif $spec[0] == $name then $spec[1]
                            else "" end)]
                        | @tsv' package.json)"
                      declared="$(printf '%s\n' "$declared_spec" | cut -f1)"
                      declared_version="$(printf '%s\n' "$declared_spec" | cut -f2)"
                    else
                      echo "::warning::jq is not installed on this runner, so package.json's packageManager / devEngines.packageManager fields cannot be read; falling back to root lockfile detection. Install jq, or set the package-manager input explicitly."
                    fi
                  fi
                  if [ -z "$pm" ] && [ -n "$declared" ]; then
                    case "$declared" in
                      yarn|pnpm|npm) pm="$declared" ;;
                      *)
                        echo "::error::package.json declares package manager '$declared', which is not yarn, pnpm or npm; set the package-manager input explicitly."
                        exit 1
                        ;;
                    esac
                  fi
                  if [ -z "$pm" ]; then
                    lockfiles=''
                    lockfile_count=0
                    if [ -f yarn.lock ]; then pm=yarn; lockfiles="${lockfiles}yarn.lock "; lockfile_count=$((lockfile_count + 1)); fi
                    if [ -f pnpm-lock.yaml ]; then pm=pnpm; lockfiles="${lockfiles}pnpm-lock.yaml "; lockfile_count=$((lockfile_count + 1)); fi
                    if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
                      pm=npm
                      lockfile_count=$((lockfile_count + 1))
                      if [ -f package-lock.json ]; then lockfiles="${lockfiles}package-lock.json "; fi
                      if [ -f npm-shrinkwrap.json ]; then lockfiles="${lockfiles}npm-shrinkwrap.json "; fi
                    fi
                    if [ "$lockfile_count" -eq 0 ]; then
                      echo "::error::Cannot resolve the package manager: package.json declares none and there is no yarn.lock, pnpm-lock.yaml, package-lock.json or npm-shrinkwrap.json at the repository root. Set the package-manager input explicitly."
                      exit 1
                    fi
                    if [ "$lockfile_count" -gt 1 ]; then
                      echo "::error::Cannot resolve the package manager: multiple root lockfiles found (${lockfiles% }). Set the package-manager input explicitly."
                      exit 1
                    fi
                  fi
                  if [ "$pm" = pnpm ] && { [ "$declared" != pnpm ] || [ -z "$declared_version" ]; }; then
                    echo "::error::Resolved package manager is pnpm, but no pnpm version is readable from the repository-root package.json. pnpm/action-setup takes the version from 'packageManager: pnpm@<version>' or 'devEngines.packageManager: {name: pnpm, version: <range>}' - add one of those, and make sure jq is installed on this runner so the workflow can read it."
                    exit 1
                  fi
                  if [ -n "$LOCKFILE_REQUIRED" ]; then
                    case "$pm" in
                      yarn) wanted='yarn.lock' ;;
                      pnpm) wanted='pnpm-lock.yaml' ;;
                      *) wanted='package-lock.json npm-shrinkwrap.json' ;;
                    esac
                    found=''
                    for candidate in $wanted; do
                      if [ -f "$candidate" ]; then found="$candidate"; break; fi
                    done
                    if [ -z "$found" ]; then
                      echo "::error::Resolved package manager is $pm, but this job caches JS dependencies with actions/setup-node and the repository root has none of: $wanted. Commit the lockfile, or set the package-manager input to the manager whose lockfile this repository actually has."
                      exit 1
                    fi
                  fi
                  echo "Resolved package manager: $pm"
                  echo "pm=$pm" >> "$GITHUB_OUTPUT"

            - name: Setup pnpm
              if: steps.package-manager.outputs.pm == 'pnpm'
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ inputs.node-version }}

            - name: Enable corepack
              if: inputs.enable-corepack && steps.package-manager.outputs.pm != 'pnpm'
              shell: bash
              run: corepack enable

            - name: Install dependencies
              shell: bash
              env:
                  INSTALL_COMMAND: ${{ inputs.install-command }}
              run: eval "$INSTALL_COMMAND"

            - name: Build workspace JS dependencies
              if: inputs.build-command != ''
              shell: bash
              env:
                  BUILD_COMMAND: ${{ inputs.build-command }}
              run: eval "$BUILD_COMMAND"

            - name: Run Android pre-submit command
              if: inputs.android-pre-submit-command != ''
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  ANDROID_PRE_SUBMIT_COMMAND: ${{ inputs.android-pre-submit-command }}
              run: eval "$ANDROID_PRE_SUBMIT_COMMAND"

            - name: Bound native compile parallelism to the container limits
              id: native-jobs
              shell: bash
              run: |
                  set -euo pipefail
                  cgroup_root="${CGROUP_ROOT:-/sys/fs/cgroup}"
                  v1_unbounded_bytes=1125899906842624
                  reserve_mib=4096
                  memory_bytes=''
                  cpu_quota=''
                  cpu_period=''

                  fail() {
                    echo "::error::$1"
                    exit 1
                  }

                  is_uint() {
                    case "$1" in
                      '' | *[!0-9]*) return 1 ;;
                    esac
                    return 0
                  }

                  if [ -f "$cgroup_root/cgroup.controllers" ]; then
                    if [ -f "$cgroup_root/memory.max" ]; then
                      value="$(cat "$cgroup_root/memory.max")"
                      if [ "$value" != max ]; then
                        is_uint "$value" || fail "Unparseable $cgroup_root/memory.max '$value'; expected a byte count or 'max'. Refusing to compile native code with a parallelism this step cannot bound."
                        memory_bytes="$value"
                      fi
                    fi
                    if [ -f "$cgroup_root/cpu.max" ]; then
                      read -r cpu_quota cpu_period < "$cgroup_root/cpu.max" || true
                      [ "$cpu_quota" = max ] && cpu_quota=''
                    fi
                  else
                    if [ -f "$cgroup_root/memory/memory.limit_in_bytes" ]; then
                      value="$(cat "$cgroup_root/memory/memory.limit_in_bytes")"
                      is_uint "$value" || fail "Unparseable $cgroup_root/memory/memory.limit_in_bytes '$value'; expected a byte count."
                      [ "$value" -lt "$v1_unbounded_bytes" ] && memory_bytes="$value"
                    fi
                    if [ -f "$cgroup_root/cpu/cpu.cfs_quota_us" ]; then
                      cpu_quota="$(cat "$cgroup_root/cpu/cpu.cfs_quota_us")"
                      cpu_period="$(cat "$cgroup_root/cpu/cpu.cfs_period_us" 2>/dev/null || true)"
                      [ "$cpu_quota" = -1 ] && cpu_quota=''
                    fi
                  fi
                  if [ -n "$cpu_quota" ] && { ! is_uint "$cpu_quota" || ! is_uint "$cpu_period" || [ "$cpu_period" -eq 0 ]; }; then
                    fail "Unparseable CPU quota '$cpu_quota' / period '$cpu_period' under $cgroup_root. Refusing to compile native code with a parallelism this step cannot bound."
                  fi

                  jobs=''
                  basis=''
                  if [ -n "$cpu_quota" ]; then
                    jobs=$(((cpu_quota + cpu_period - 1) / cpu_period))
                    basis="CPU quota $cpu_quota/$cpu_period"
                  fi
                  if [ -n "$memory_bytes" ]; then
                    memory_mib=$((memory_bytes / 1048576))
                    memory_jobs=$(((memory_mib - reserve_mib) / 1024))
                    [ "$memory_jobs" -lt 1 ] && memory_jobs=1
                    if [ -z "$jobs" ] || [ "$memory_jobs" -lt "$jobs" ]; then
                      jobs="$memory_jobs"
                    fi
                    basis="${basis:+$basis, }memory limit $memory_mib MiB less a $reserve_mib MiB reserve"
                  fi
                  if [ -n "${NATIVE_COMPILE_JOBS:-}" ]; then
                    if ! is_uint "$NATIVE_COMPILE_JOBS" || [ "$NATIVE_COMPILE_JOBS" -lt 1 ]; then
                      fail "native-compile-jobs '$NATIVE_COMPILE_JOBS' must be a positive integer, or empty to derive it from the runner's cgroup limits."
                    fi
                    jobs="$NATIVE_COMPILE_JOBS"
                    basis='native-compile-jobs input'
                  fi

                  echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
                  if [ -z "$jobs" ]; then
                    echo "No cgroup CPU or memory limit found; native compile parallelism is left to ninja."
                    exit 0
                  fi

                  slots_dir="$RUNNER_TEMP/mobile-ci-compile-slots"
                  launcher="$slots_dir/compile-slot.sh"
                  mkdir -p "$slots_dir"
                  cat > "$launcher" <<'COMPILE_SLOT'
                  #!/bin/sh
                  set -eu
                  slots="${MOBILE_CI_COMPILE_SLOTS:?MOBILE_CI_COMPILE_SLOTS is not set}"
                  dir="${MOBILE_CI_COMPILE_SLOTS_DIR:?MOBILE_CI_COMPILE_SLOTS_DIR is not set}"
                  try_slots() {
                    slot=0
                    while [ "$slot" -lt "$slots" ]; do
                      exec 9> "$dir/slot.$slot"
                      if flock -n 9; then
                        return 0
                      fi
                      exec 9>&-
                      slot=$((slot + 1))
                    done
                    return 1
                  }
                  if ! try_slots; then
                    exec 8> "$dir/gate"
                    flock 8
                    until try_slots; do
                      sleep 0.2
                    done
                    exec 8>&-
                  fi
                  exec "$@"
                  COMPILE_SLOT
                  chmod +x "$launcher"

                  chain_launcher() {
                    case "$1" in
                      "$launcher" | "$launcher;"*) printf '%s' "$1" ;;
                      '') printf '%s' "$launcher" ;;
                      *) printf '%s;%s' "$launcher" "$1" ;;
                    esac
                  }
                  {
                    echo "MOBILE_CI_COMPILE_SLOTS=$jobs"
                    echo "MOBILE_CI_COMPILE_SLOTS_DIR=$slots_dir"
                    echo "CMAKE_C_COMPILER_LAUNCHER=$(chain_launcher "${CMAKE_C_COMPILER_LAUNCHER:-}")"
                    echo "CMAKE_CXX_COMPILER_LAUNCHER=$(chain_launcher "${CMAKE_CXX_COMPILER_LAUNCHER:-}")"
                  } >> "$GITHUB_ENV"
                  echo "Native compile jobs: $jobs ($basis); every CMake configure in this job runs its compilers through $launcher."

            - name: EAS build (Android)
              id: build
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  EAS_CLI_VERSION: ${{ inputs.eas-cli-version }}
                  BUILD_PROFILE: ${{ matrix.target.buildProfile }}
              run: |
                  set -euo pipefail
                  output_path="$RUNNER_TEMP/android-publish/app.aab"
                  mkdir -p "$(dirname "$output_path")"
                  npx --yes "eas-cli@${EAS_CLI_VERSION}" build \
                    --platform android \
                    --profile "$BUILD_PROFILE" \
                    --local \
                    --non-interactive \
                    --output "$output_path" 2>&1 | LC_ALL=C sed -E 's#[A-Za-z0-9+/=]{128,}#[REDACTED encoded build payload]#g'
                  echo "artifact-path=$output_path" >> "$GITHUB_OUTPUT"

            - name: Verify required Android ABI present
              if: inputs.required-android-abi != ''
              shell: bash
              env:
                  ARTIFACT_PATH: ${{ steps.build.outputs.artifact-path }}
                  REQUIRED_ABI: ${{ inputs.required-android-abi }}
              run: |
                  set -euo pipefail
                  listing="$RUNNER_TEMP/aab-listing.txt"
                  unzip -l "$ARTIFACT_PATH" > "$listing"
                  if ! grep -qF "lib/${REQUIRED_ABI}/" "$listing"; then
                    echo "::error::Required ABI '${REQUIRED_ABI}' not found in $ARTIFACT_PATH (Google Play 64-bit requirement)."
                    exit 1
                  fi
                  echo "ABI '${REQUIRED_ABI}' present."

            - name: Upload Android build artifact
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: android-publish-build${{ matrix.target.artifactSuffix }}
                  path: ${{ steps.build.outputs.artifact-path }}
                  retention-days: 14

            - name: Write Google service account key
              id: google-key
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
                  GOOGLE_KEY_PATH_INPUT: ${{ inputs.google-key-path }}
              run: |
                  set -euo pipefail
                  if [ -n "$GOOGLE_KEY_PATH_INPUT" ]; then
                    key_path="$GOOGLE_KEY_PATH_INPUT"
                  else
                    key_path="$RUNNER_TEMP/android-publish/google-service-account.json"
                  fi
                  mkdir -p "$(dirname "$key_path")"
                  printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$key_path"
                  chmod 600 "$key_path"
                  absolute_key_path="$(cd "$(dirname "$key_path")" && pwd)/$(basename "$key_path")"
                  echo "key-path=$absolute_key_path" >> "$GITHUB_OUTPUT"

            - name: EAS submit (Android)
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  EAS_CLI_VERSION: ${{ inputs.eas-cli-version }}
                  SUBMIT_PROFILE: ${{ matrix.target.submitProfile }}
                  ARTIFACT_PATH: ${{ steps.build.outputs.artifact-path }}
                  # Exposed for eas.json submit profiles / fastlane hooks that read a service
                  # account key from disk; the exact eas.json wiring is consumer-owned.
                  GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.google-key.outputs.key-path }}
              run: |
                  set -euo pipefail
                  npx --yes "eas-cli@${EAS_CLI_VERSION}" submit \
                    --platform android \
                    --profile "$SUBMIT_PROFILE" \
                    --non-interactive \
                    --path "$ARTIFACT_PATH"

            - name: Record the submitted target
              if: needs.plan.outputs.record == 'true'
              shell: bash
              env:
                  TARGET_NAME: ${{ matrix.target.name }}
                  TARGET_PLATFORM: ${{ matrix.target.platform }}
                  BUILD_PROFILE: ${{ matrix.target.buildProfile }}
                  SUBMIT_PROFILE: ${{ matrix.target.submitProfile }}
                  FINGERPRINTS: ${{ needs.plan.outputs.fingerprints }}
              run: |
                  set -euo pipefail
                  fingerprint=''
                  if [ -n "$FINGERPRINTS" ]; then
                    fingerprint="$(jq -r --arg name "$TARGET_NAME" '.[$name] // ""' <<< "$FINGERPRINTS")"
                  fi
                  if [ -z "$fingerprint" ]; then
                    echo "::error::The plan job computed no fingerprint for target $TARGET_NAME, so its submitted build cannot be recorded."
                    exit 1
                  fi
                  marker_dir="$RUNNER_TEMP/store-submitted"
                  mkdir -p "$marker_dir"
                  jq -n --arg name "$TARGET_NAME" --arg platform "$TARGET_PLATFORM" \
                    --arg buildProfile "$BUILD_PROFILE" --arg submitProfile "$SUBMIT_PROFILE" \
                    --arg fingerprint "$fingerprint" \
                    '{name: $name, platform: $platform, buildProfile: $buildProfile, submitProfile: $submitProfile, fingerprint: $fingerprint}' \
                    > "$marker_dir/${TARGET_NAME}.json"

            - name: Upload the submitted-target marker
              if: needs.plan.outputs.record == 'true'
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: store-submitted-${{ matrix.target.name }}
                  path: ${{ runner.temp }}/store-submitted/${{ matrix.target.name }}.json
                  retention-days: 14
                  overwrite: true
                  if-no-files-found: error

            - name: Run Android post-submit command
              if: inputs.android-post-submit-command != ''
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.google-key.outputs.key-path }}
                  GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ${{ steps.google-key.outputs.key-path }}
                  ANDROID_POST_SUBMIT_COMMAND: ${{ inputs.android-post-submit-command }}
              run: eval "$ANDROID_POST_SUBMIT_COMMAND"

            - name: Remove Google service account key
              if: always()
              shell: bash
              env:
                  KEY_PATH: ${{ steps.google-key.outputs.key-path }}
              run: |
                  set -euo pipefail
                  if [ -n "${KEY_PATH:-}" ]; then
                    rm -f "$KEY_PATH"
                  fi

    record:
        name: Write the store build record
        needs: [plan, ios-publish, android-publish]
        if: always() && needs.plan.result == 'success' && needs.plan.outputs.record == 'true' && needs.plan.outputs.decision == 'native'
        runs-on: ${{ fromJSON(inputs.control-runner-labels) }}
        timeout-minutes: ${{ inputs.plan-timeout-minutes }}
        steps:
            - name: Apply RunsOn cache bypass
              uses: rnw-community/mobile-ci/actions/runs-on-cache-bypass@validate/v4.1 # validate/v4.1 fleet-validation pin
              with:
                  enabled: ${{ inputs.runs-on-cache-bypass }}
            - name: Download the submitted-target markers
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
              with:
                  pattern: store-submitted-*
                  merge-multiple: true
                  path: ${{ runner.temp }}/store-submitted

            - name: Write the store build record to the release
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  RELEASE_TAG: ${{ needs.plan.outputs.release-tag }}
                  RECORD_ASSET: ${{ needs.plan.outputs.record-asset }}
                  MARKER_DIR: ${{ runner.temp }}/store-submitted
                  COMMIT: ${{ github.sha }}
                  RUN_ID: ${{ github.run_id }}
                  RUN_ATTEMPT: ${{ github.run_attempt }}
                  BUILD_NUMBER: ${{ needs.plan.outputs.build-number }}
                  MARKETING_VERSION: ${{ needs.plan.outputs.marketing-version }}
              run: |
                  set -euo pipefail
                  markers=()
                  if [ -d "$MARKER_DIR" ]; then
                    while IFS= read -r -d '' marker; do
                      markers+=("$marker")
                    done < <(find "$MARKER_DIR" -maxdepth 1 -type f -name '*.json' -print0 | LC_ALL=C sort -z)
                  fi
                  if [ "${#markers[@]}" -eq 0 ]; then
                    echo "::warning::No target reported a successful submit, so release ${RELEASE_TAG} gets no store build record."
                    exit 0
                  fi
                  record_dir="$RUNNER_TEMP/native-publish-record"
                  mkdir -p "$record_dir"
                  record="$record_dir/$RECORD_ASSET"

                  previous='{}'
                  if gh release download "$RELEASE_TAG" --repo "$REPOSITORY" --pattern "$RECORD_ASSET" --dir "$record_dir/previous" >/dev/null 2>&1 \
                    && [ -f "$record_dir/previous/$RECORD_ASSET" ]; then
                    previous="$(jq -c --arg commit "$COMMIT" 'if .schema == 1 and .commit == $commit and (.targets | type) == "object" then .targets else {} end' "$record_dir/previous/$RECORD_ASSET" 2>/dev/null || echo '{}')"
                  fi

                  if ! jq -s \
                    --argjson previous "$previous" \
                    --arg tag "$RELEASE_TAG" --arg commit "$COMMIT" \
                    --arg runId "$RUN_ID" --arg runAttempt "$RUN_ATTEMPT" \
                    --arg recordedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                    --arg buildNumber "$BUILD_NUMBER" --arg marketingVersion "$MARKETING_VERSION" '
                    if all(.[]; (.name | type) == "string" and (.platform | type) == "string" and ((.fingerprint // "") | length) > 0) | not
                    then error("a submitted-target marker is missing its name, platform or fingerprint") else . end
                    | {schema: 1, tag: $tag, commit: $commit, runId: $runId, runAttempt: $runAttempt,
                       recordedAt: $recordedAt, buildNumber: $buildNumber, marketingVersion: $marketingVersion,
                       targets: ($previous + (map({(.name): (del(.name))}) | add))}' \
                    "${markers[@]}" > "$record"; then
                    echo "::error::Cannot compose the store build record from the submitted-target markers; nothing is recorded."
                    exit 1
                  fi

                  if ! gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
                    if ! gh release create "$RELEASE_TAG" --repo "$REPOSITORY" --verify-tag --title "$RELEASE_TAG" \
                      --notes "Store build record written by native-publish." >/dev/null; then
                      echo "::error::Cannot create a release for tag ${RELEASE_TAG}; grant the calling job 'contents: write', and make sure the tag exists."
                      exit 1
                    fi
                  fi
                  if ! gh release upload "$RELEASE_TAG" "$record" --repo "$REPOSITORY" --clobber; then
                    echo "::error::Cannot upload ${RECORD_ASSET} to release ${RELEASE_TAG}. Grant the calling job 'contents: write'; an immutable published release accepts no new assets, so run native-publish before publishing that release."
                    exit 1
                  fi
                  echo "Recorded $(jq -r '.targets | keys | join(", ")' "$record") as shipped on release ${RELEASE_TAG}."

    status:
        name: Native publish result
        needs: [plan, ios-publish, android-lint-gate, android-publish, record]
        if: always()
        runs-on: ${{ fromJSON(inputs.control-runner-labels) }}
        permissions:
            contents: read
        steps:
            - name: Report
              shell: bash
              env:
                  PLAN_RESULT: ${{ needs.plan.result }}
                  DECISION: ${{ needs.plan.outputs.decision }}
                  HAS_IOS: ${{ needs.plan.outputs.has-ios }}
                  HAS_ANDROID: ${{ needs.plan.outputs.has-android }}
                  RECORD: ${{ needs.plan.outputs.record }}
                  LINT_GATE: ${{ inputs.android-lint-gate }}
                  IOS_RESULT: ${{ needs.ios-publish.result }}
                  LINT_RESULT: ${{ needs.android-lint-gate.result }}
                  ANDROID_RESULT: ${{ needs.android-publish.result }}
                  RECORD_RESULT: ${{ needs.record.result }}
              run: |
                  set -euo pipefail
                  if [ "$PLAN_RESULT" != success ]; then
                    echo "Plan failed or did not run."
                    exit 1
                  fi
                  if [ "$DECISION" = ota ]; then
                    echo "Every target's native runtime is unchanged since the last store build; nothing was built. Publish an OTA update."
                    exit 0
                  fi
                  if [ "$DECISION" != native ]; then
                    echo "Plan produced no decision ('$DECISION')."
                    exit 1
                  fi
                  failed=0

                  if [ "$HAS_IOS" = "true" ] && [ "$IOS_RESULT" != "success" ]; then
                    echo "iOS publish failed or did not run."
                    failed=1
                  fi

                  if [ "$HAS_ANDROID" = "true" ]; then
                    if [ "$LINT_GATE" = "true" ] && [ "$LINT_RESULT" != "success" ]; then
                      echo "Android lint gate failed."
                      failed=1
                    fi
                    if [ "$ANDROID_RESULT" != "success" ]; then
                      echo "Android publish failed or did not run."
                      failed=1
                    fi
                  fi

                  if [ "$RECORD" = "true" ] && [ "$RECORD_RESULT" != "success" ]; then
                    echo "The store build record was not written."
                    failed=1
                  fi

                  if [ "$failed" -ne 0 ]; then
                    exit 1
                  fi
                  echo "Native publish completed successfully for every target."
