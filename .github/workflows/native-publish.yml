name: native-publish

on:
    workflow_call:
        inputs:
            enable-ios:
                description: Run the ios-publish job.
                type: boolean
                required: false
                default: true
            enable-android:
                description: Run the android-lint-gate/android-publish jobs.
                type: boolean
                required: false
                default: false
            ios-runner-labels:
                description: JSON array of self-hosted runner labels for the iOS publish job.
                type: string
                required: false
                default: '["self-hosted","macOS","ARM64"]'
            android-runner-labels:
                description: >-
                    JSON array of self-hosted runner labels for the Android publish job.
                    Defaults to macOS because Google's Android NDK build tooling used by EAS
                    local builds is x86_64-only on Linux.
                type: string
                required: false
                default: '["self-hosted","macOS","ARM64"]'
            lint-runner-labels:
                description: JSON array of hosted runner labels for the android-lint-gate job.
                type: string
                required: false
                default: '["ubuntu-latest"]'
            app-dir:
                description: App directory containing app.json/eas.json (and android/ios once prebuilt).
                type: string
                required: true
            node-version:
                type: string
                required: false
                default: '22'
            install-command:
                type: string
                required: false
                default: yarn install --immutable
            enable-corepack:
                type: boolean
                required: false
                default: true
            package-manager:
                description: >-
                    JS package manager driving pnpm provisioning and, in the jobs
                    that configure one, actions/setup-node's dependency cache.
                    Leave empty to auto-detect at the repository root, in order: an
                    explicit value here, then package.json's
                    devEngines.packageManager / packageManager field (needs jq on
                    the runner), then exactly one root lockfile (yarn.lock,
                    pnpm-lock.yaml, package-lock.json / npm-shrinkwrap.json). No
                    match, an ambiguous
                    match, or an unsupported value fails the job. install-command
                    must match the resolved manager (e.g. pnpm install
                    --frozen-lockfile). Resolving to pnpm additionally requires a
                    pnpm version declared in package.json (packageManager or
                    devEngines.packageManager) because pnpm/action-setup reads it
                    from there; the corepack step is then skipped.
                type: string
                required: false
                default: ''
            build-command:
                description: Optional workspace JS build command run at repo root before publishing.
                type: string
                required: false
                default: ''
            eas-cli-version:
                type: string
                required: false
                default: '20.5.1'
            build-profile:
                description: EAS build profile (eas.json build.<profile>) used for both platforms.
                type: string
                required: false
                default: production
            submit-profile:
                description: EAS submit profile (eas.json submit.<profile>) used for both platforms.
                type: string
                required: false
                default: production
            ios-pre-submit-command:
                description: >-
                    Optional consumer-owned command (e.g. a fastlane lane) run in app-dir before
                    the iOS build, with the job's env (including EXPO_TOKEN).
                type: string
                required: false
                default: ''
            ios-post-submit-command:
                description: >-
                    Optional consumer-owned command (e.g. fastlane metadata/screenshots) run in
                    app-dir after `eas submit` succeeds.
                type: string
                required: false
                default: ''
            android-pre-submit-command:
                description: Optional consumer-owned command run in app-dir before the Android build.
                type: string
                required: false
                default: ''
            android-post-submit-command:
                description: Optional consumer-owned command run in app-dir after `eas submit` succeeds.
                type: string
                required: false
                default: ''
            android-lint-gate:
                description: >-
                    Require the android-lint-gate job (Play policy manifest check + lintVitalRelease)
                    to pass before android-publish runs.
                type: boolean
                required: false
                default: true
            required-android-abi:
                description: >-
                    ABI that must be present in the built .aab (Google Play 64-bit requirement).
                    Empty string disables the check.
                type: string
                required: false
                default: arm64-v8a
            asc-key-path:
                description: >-
                    Optional path, relative to app-dir, the App Store Connect API key (.p8) is
                    written to and removed from — set this only when eas.json requires the key at
                    a specific app-dir-relative location; otherwise leave empty so the key is
                    written under $RUNNER_TEMP and never enters the eas build --local archive.
                type: string
                required: false
                default: ''
            google-key-path:
                description: >-
                    Optional path, relative to app-dir, the Google Play service account key
                    (.json) is written to and removed from — set this only when eas.json or
                    fastlane requires the key at a specific app-dir-relative location; otherwise
                    leave empty so the key is written under $RUNNER_TEMP and never enters the
                    eas build --local archive.
                type: string
                required: false
                default: ''
            build-timeout-minutes:
                type: number
                required: false
                default: 120
            lint-timeout-minutes:
                type: number
                required: false
                default: 30
            android-lint-gate-gradle-args:
                description: >-
                    Extra arguments appended after :app:lintVitalRelease in the
                    android-lint-gate job, e.g. -PreactNativeArchitectures=arm64-v8a.
                    Split on any whitespace — spaces, tabs, and newlines (a YAML
                    block-scalar value works) are all treated as separators — not
                    shell-quoted, so an argument containing a space cannot be
                    expressed as a single token.
                type: string
                required: false
                default: ''
            publish-env:
                description: >-
                    Newline-separated KEY=VALUE pairs of non-secret env appended to
                    $GITHUB_ENV at the start of ios-publish, android-lint-gate, and
                    android-publish, before eas build/submit (or, for
                    android-lint-gate, prebuild) and the pre/post-submit-command
                    hooks. Rejects (fails closed) any line without '=' or whose name
                    does not match ^[A-Za-z_][A-Za-z0-9_]*$. For secret values use
                    the EAS_EXTRA_ENV secret instead — inputs are not masked in logs.
                type: string
                required: false
                default: ''

        secrets:
            EXPO_TOKEN:
                description: Expo access token, required by ios-publish and android-publish.
                required: false
            ASC_API_KEY:
                description: App Store Connect API key contents (.p8), required by ios-publish.
                required: false
            ASC_KEY_ID:
                description: >-
                    App Store Connect API key ID matching ASC_API_KEY. Required alongside
                    ASC_API_KEY and ASC_ISSUER_ID for EAS to resolve the key
                    non-interactively; exported to the iOS build and submit steps as
                    EXPO_ASC_KEY_ID.
                required: false
            ASC_ISSUER_ID:
                description: >-
                    App Store Connect API key issuer ID matching ASC_API_KEY. Required
                    alongside ASC_API_KEY and ASC_KEY_ID for EAS to resolve the key
                    non-interactively; exported to the iOS build and submit steps as
                    EXPO_ASC_ISSUER_ID.
                required: false
            GOOGLE_SERVICE_ACCOUNT_JSON:
                description: Google Play service account key JSON contents, required by android-publish.
                required: false
            EAS_EXTRA_ENV:
                description: >-
                    Newline-separated KEY=VALUE pairs of secret env appended to
                    $GITHUB_ENV at the start of ios-publish, android-lint-gate, and
                    android-publish, with each value masked in logs before being
                    written. Use this for secrets eas build/submit, the
                    android-lint-gate prebuild, or a pre/post-submit-command hook
                    need on the environment, e.g. EXPO_APPLE_APP_SPECIFIC_PASSWORD.
                required: false

concurrency:
    group: native-publish-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    ios-publish:
        name: iOS build and publish
        if: inputs.enable-ios
        runs-on: ${{ fromJSON(inputs.ios-runner-labels) }}
        timeout-minutes: ${{ inputs.build-timeout-minutes }}
        env:
            EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
            HAS_EAS_EXTRA_ENV: ${{ secrets.EAS_EXTRA_ENV != '' }}

        steps:
            - name: Validate required secrets
              shell: bash
              env:
                  ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
                  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
                  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
              run: |
                  set -euo pipefail
                  missing=()
                  [ -z "${EXPO_TOKEN:-}" ] && missing+=(EXPO_TOKEN)
                  [ -z "${ASC_API_KEY:-}" ] && missing+=(ASC_API_KEY)
                  [ -z "${ASC_KEY_ID:-}" ] && missing+=(ASC_KEY_ID)
                  [ -z "${ASC_ISSUER_ID:-}" ] && missing+=(ASC_ISSUER_ID)
                  if [ "${#missing[@]}" -gt 0 ]; then
                    echo "::error::ios-publish requires secrets: ${missing[*]}. ASC_KEY_ID and ASC_ISSUER_ID must accompany ASC_API_KEY, otherwise EAS cannot resolve the key non-interactively and falls back to an interactive prompt that cannot be answered in CI. Pass them via 'secrets: inherit' or an explicit secrets: block in the caller workflow."
                    exit 1
                  fi

            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - name: Apply publish-env
              if: inputs.publish-env != ''
              shell: bash
              env:
                  PUBLISH_ENV: ${{ inputs.publish-env }}
              run: |
                  set -euo pipefail
                  while IFS= read -r line; do
                    [ -z "$line" ] && continue
                    case "$line" in
                      *=*) ;;
                      *)
                        echo "::error::publish-env line '$line' is missing '='; expected KEY=VALUE."
                        exit 1
                        ;;
                    esac
                    name="${line%%=*}"
                    case "$name" in
                      ''|[!A-Za-z_]*)
                        echo "::error::publish-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    case "$name" in
                      *[!A-Za-z0-9_]*)
                        echo "::error::publish-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    echo "$line" >> "$GITHUB_ENV"
                  done <<< "$PUBLISH_ENV"

            - name: Apply EAS_EXTRA_ENV
              if: env.HAS_EAS_EXTRA_ENV == 'true'
              shell: bash
              env:
                  EAS_EXTRA_ENV: ${{ secrets.EAS_EXTRA_ENV }}
              run: |
                  set -euo pipefail
                  while IFS= read -r line; do
                    [ -z "$line" ] && continue
                    case "$line" in
                      *=*) ;;
                      *)
                        echo "::error::EAS_EXTRA_ENV has a line missing '='; expected KEY=VALUE."
                        exit 1
                        ;;
                    esac
                    name="${line%%=*}"
                    value="${line#*=}"
                    case "$name" in
                      ''|[!A-Za-z_]*)
                        echo "::error::EAS_EXTRA_ENV has a variable name that must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    case "$name" in
                      *[!A-Za-z0-9_]*)
                        echo "::error::EAS_EXTRA_ENV has a variable name that must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    if [ -n "$value" ]; then
                      echo "::add-mask::$value"
                    fi
                    echo "$name=$value" >> "$GITHUB_ENV"
                  done <<< "$EAS_EXTRA_ENV"

            - name: Resolve package manager
              id: package-manager
              shell: bash
              env:
                  PACKAGE_MANAGER: ${{ inputs.package-manager }}
                  LOCKFILE_REQUIRED: ''
              run: |
                  set -euo pipefail
                  pm=''
                  case "$PACKAGE_MANAGER" in
                    '') ;;
                    yarn|pnpm|npm) pm="$PACKAGE_MANAGER" ;;
                    *)
                      echo "::error::package-manager must be '' (auto-detect), yarn, pnpm or npm; got '$PACKAGE_MANAGER'."
                      exit 1
                      ;;
                  esac
                  declared=''
                  declared_version=''
                  if { [ -z "$pm" ] || [ "$pm" = pnpm ]; } && [ -f package.json ]; then
                    if command -v jq >/dev/null 2>&1; then
                      declared_spec="$(jq -r '
                        (try (.devEngines.packageManager) catch null) as $raw
                        | (if ($raw | type) == "array" then ($raw[0] // null) else $raw end) as $de
                        | (if ($de | type) == "object" then [($de.name // ""), ($de.version // "")] else ["", ""] end) as $dev
                        | (if ((.packageManager // "") | type) == "string" and (.packageManager // "") != ""
                           then (.packageManager | if test("@") then [split("@")[0], (split("@")[1] | split("+")[0])] else [., ""] end)
                           else ["", ""] end) as $spec
                        | (if $dev[0] != "" then $dev[0] else $spec[0] end) as $name
                        | [$name,
                           (if $dev[0] != "" and $dev[1] != "" then $dev[1]
                            elif $spec[0] == $name then $spec[1]
                            else "" end)]
                        | @tsv' package.json)"
                      declared="$(printf '%s\n' "$declared_spec" | cut -f1)"
                      declared_version="$(printf '%s\n' "$declared_spec" | cut -f2)"
                    else
                      echo "::warning::jq is not installed on this runner, so package.json's packageManager / devEngines.packageManager fields cannot be read; falling back to root lockfile detection. Install jq, or set the package-manager input explicitly."
                    fi
                  fi
                  if [ -z "$pm" ] && [ -n "$declared" ]; then
                    case "$declared" in
                      yarn|pnpm|npm) pm="$declared" ;;
                      *)
                        echo "::error::package.json declares package manager '$declared', which is not yarn, pnpm or npm; set the package-manager input explicitly."
                        exit 1
                        ;;
                    esac
                  fi
                  if [ -z "$pm" ]; then
                    lockfiles=''
                    lockfile_count=0
                    if [ -f yarn.lock ]; then pm=yarn; lockfiles="${lockfiles}yarn.lock "; lockfile_count=$((lockfile_count + 1)); fi
                    if [ -f pnpm-lock.yaml ]; then pm=pnpm; lockfiles="${lockfiles}pnpm-lock.yaml "; lockfile_count=$((lockfile_count + 1)); fi
                    if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
                      pm=npm
                      lockfile_count=$((lockfile_count + 1))
                      if [ -f package-lock.json ]; then lockfiles="${lockfiles}package-lock.json "; fi
                      if [ -f npm-shrinkwrap.json ]; then lockfiles="${lockfiles}npm-shrinkwrap.json "; fi
                    fi
                    if [ "$lockfile_count" -eq 0 ]; then
                      echo "::error::Cannot resolve the package manager: package.json declares none and there is no yarn.lock, pnpm-lock.yaml, package-lock.json or npm-shrinkwrap.json at the repository root. Set the package-manager input explicitly."
                      exit 1
                    fi
                    if [ "$lockfile_count" -gt 1 ]; then
                      echo "::error::Cannot resolve the package manager: multiple root lockfiles found (${lockfiles% }). Set the package-manager input explicitly."
                      exit 1
                    fi
                  fi
                  if [ "$pm" = pnpm ] && { [ "$declared" != pnpm ] || [ -z "$declared_version" ]; }; then
                    echo "::error::Resolved package manager is pnpm, but no pnpm version is readable from the repository-root package.json. pnpm/action-setup takes the version from 'packageManager: pnpm@<version>' or 'devEngines.packageManager: {name: pnpm, version: <range>}' - add one of those, and make sure jq is installed on this runner so the workflow can read it."
                    exit 1
                  fi
                  if [ -n "$LOCKFILE_REQUIRED" ]; then
                    case "$pm" in
                      yarn) wanted='yarn.lock' ;;
                      pnpm) wanted='pnpm-lock.yaml' ;;
                      *) wanted='package-lock.json npm-shrinkwrap.json' ;;
                    esac
                    found=''
                    for candidate in $wanted; do
                      if [ -f "$candidate" ]; then found="$candidate"; break; fi
                    done
                    if [ -z "$found" ]; then
                      echo "::error::Resolved package manager is $pm, but this job caches JS dependencies with actions/setup-node and the repository root has none of: $wanted. Commit the lockfile, or set the package-manager input to the manager whose lockfile this repository actually has."
                      exit 1
                    fi
                  fi
                  echo "Resolved package manager: $pm"
                  echo "pm=$pm" >> "$GITHUB_OUTPUT"

            - name: Setup pnpm
              if: steps.package-manager.outputs.pm == 'pnpm'
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - name: Setup Node
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ inputs.node-version }}

            - name: Enable corepack
              if: inputs.enable-corepack && steps.package-manager.outputs.pm != 'pnpm'
              shell: bash
              run: corepack enable

            - name: Install dependencies
              shell: bash
              env:
                  INSTALL_COMMAND: ${{ inputs.install-command }}
              run: eval "$INSTALL_COMMAND"

            - name: Build workspace JS dependencies
              if: inputs.build-command != ''
              shell: bash
              env:
                  BUILD_COMMAND: ${{ inputs.build-command }}
              run: eval "$BUILD_COMMAND"

            - name: Run iOS pre-submit command
              if: inputs.ios-pre-submit-command != ''
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  IOS_PRE_SUBMIT_COMMAND: ${{ inputs.ios-pre-submit-command }}
              run: eval "$IOS_PRE_SUBMIT_COMMAND"

            - name: Write App Store Connect API key
              id: asc-key
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
                  ASC_KEY_PATH_INPUT: ${{ inputs.asc-key-path }}
              run: |
                  set -euo pipefail
                  if [ -n "$ASC_KEY_PATH_INPUT" ]; then
                    key_path="$ASC_KEY_PATH_INPUT"
                  else
                    key_path="$RUNNER_TEMP/ios-publish/asc-api-key.p8"
                  fi
                  mkdir -p "$(dirname "$key_path")"
                  printf '%s' "$ASC_API_KEY" > "$key_path"
                  chmod 600 "$key_path"
                  absolute_key_path="$(cd "$(dirname "$key_path")" && pwd)/$(basename "$key_path")"
                  echo "key-path=$absolute_key_path" >> "$GITHUB_OUTPUT"

            - name: EAS build (iOS)
              id: build
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  EAS_CLI_VERSION: ${{ inputs.eas-cli-version }}
                  BUILD_PROFILE: ${{ inputs.build-profile }}
                  EXPO_ASC_API_KEY_PATH: ${{ steps.asc-key.outputs.key-path }}
                  EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
                  EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
              run: |
                  set -euo pipefail
                  output_path="$RUNNER_TEMP/ios-publish/app.ipa"
                  mkdir -p "$(dirname "$output_path")"
                  npx --yes "eas-cli@${EAS_CLI_VERSION}" build \
                    --platform ios \
                    --profile "$BUILD_PROFILE" \
                    --local \
                    --non-interactive \
                    --output "$output_path"
                  echo "artifact-path=$output_path" >> "$GITHUB_OUTPUT"

            - name: Upload iOS build artifact
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: ios-publish-build
                  path: ${{ steps.build.outputs.artifact-path }}
                  retention-days: 14

            - name: EAS submit (iOS)
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  EAS_CLI_VERSION: ${{ inputs.eas-cli-version }}
                  SUBMIT_PROFILE: ${{ inputs.submit-profile }}
                  ARTIFACT_PATH: ${{ steps.build.outputs.artifact-path }}
                  EXPO_ASC_API_KEY_PATH: ${{ steps.asc-key.outputs.key-path }}
                  EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
                  EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
              run: |
                  set -euo pipefail
                  npx --yes "eas-cli@${EAS_CLI_VERSION}" submit \
                    --platform ios \
                    --profile "$SUBMIT_PROFILE" \
                    --non-interactive \
                    --path "$ARTIFACT_PATH"

            - name: Run iOS post-submit command
              if: inputs.ios-post-submit-command != ''
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  IOS_POST_SUBMIT_COMMAND: ${{ inputs.ios-post-submit-command }}
              run: eval "$IOS_POST_SUBMIT_COMMAND"

            - name: Remove App Store Connect API key
              if: always()
              shell: bash
              env:
                  ASC_KEY_PATH: ${{ steps.asc-key.outputs.key-path }}
              run: |
                  if [ -n "${ASC_KEY_PATH:-}" ]; then
                    rm -f "$ASC_KEY_PATH"
                  fi

    android-lint-gate:
        name: Android release lint (Play policy gate)
        if: inputs.enable-android && inputs.android-lint-gate
        runs-on: ${{ fromJSON(inputs.lint-runner-labels) }}
        timeout-minutes: ${{ inputs.lint-timeout-minutes }}
        env:
            HAS_EAS_EXTRA_ENV: ${{ secrets.EAS_EXTRA_ENV != '' }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - name: Apply publish-env
              if: inputs.publish-env != ''
              shell: bash
              env:
                  PUBLISH_ENV: ${{ inputs.publish-env }}
              run: |
                  set -euo pipefail
                  while IFS= read -r line; do
                    [ -z "$line" ] && continue
                    case "$line" in
                      *=*) ;;
                      *)
                        echo "::error::publish-env line '$line' is missing '='; expected KEY=VALUE."
                        exit 1
                        ;;
                    esac
                    name="${line%%=*}"
                    case "$name" in
                      ''|[!A-Za-z_]*)
                        echo "::error::publish-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    case "$name" in
                      *[!A-Za-z0-9_]*)
                        echo "::error::publish-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    echo "$line" >> "$GITHUB_ENV"
                  done <<< "$PUBLISH_ENV"

            - name: Apply EAS_EXTRA_ENV
              if: env.HAS_EAS_EXTRA_ENV == 'true'
              shell: bash
              env:
                  EAS_EXTRA_ENV: ${{ secrets.EAS_EXTRA_ENV }}
              run: |
                  set -euo pipefail
                  while IFS= read -r line; do
                    [ -z "$line" ] && continue
                    case "$line" in
                      *=*) ;;
                      *)
                        echo "::error::EAS_EXTRA_ENV has a line missing '='; expected KEY=VALUE."
                        exit 1
                        ;;
                    esac
                    name="${line%%=*}"
                    value="${line#*=}"
                    case "$name" in
                      ''|[!A-Za-z_]*)
                        echo "::error::EAS_EXTRA_ENV has a variable name that must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    case "$name" in
                      *[!A-Za-z0-9_]*)
                        echo "::error::EAS_EXTRA_ENV has a variable name that must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    if [ -n "$value" ]; then
                      echo "::add-mask::$value"
                    fi
                    echo "$name=$value" >> "$GITHUB_ENV"
                  done <<< "$EAS_EXTRA_ENV"

            - name: Resolve package manager
              id: package-manager
              shell: bash
              env:
                  PACKAGE_MANAGER: ${{ inputs.package-manager }}
                  LOCKFILE_REQUIRED: ''
              run: |
                  set -euo pipefail
                  pm=''
                  case "$PACKAGE_MANAGER" in
                    '') ;;
                    yarn|pnpm|npm) pm="$PACKAGE_MANAGER" ;;
                    *)
                      echo "::error::package-manager must be '' (auto-detect), yarn, pnpm or npm; got '$PACKAGE_MANAGER'."
                      exit 1
                      ;;
                  esac
                  declared=''
                  declared_version=''
                  if { [ -z "$pm" ] || [ "$pm" = pnpm ]; } && [ -f package.json ]; then
                    if command -v jq >/dev/null 2>&1; then
                      declared_spec="$(jq -r '
                        (try (.devEngines.packageManager) catch null) as $raw
                        | (if ($raw | type) == "array" then ($raw[0] // null) else $raw end) as $de
                        | (if ($de | type) == "object" then [($de.name // ""), ($de.version // "")] else ["", ""] end) as $dev
                        | (if ((.packageManager // "") | type) == "string" and (.packageManager // "") != ""
                           then (.packageManager | if test("@") then [split("@")[0], (split("@")[1] | split("+")[0])] else [., ""] end)
                           else ["", ""] end) as $spec
                        | (if $dev[0] != "" then $dev[0] else $spec[0] end) as $name
                        | [$name,
                           (if $dev[0] != "" and $dev[1] != "" then $dev[1]
                            elif $spec[0] == $name then $spec[1]
                            else "" end)]
                        | @tsv' package.json)"
                      declared="$(printf '%s\n' "$declared_spec" | cut -f1)"
                      declared_version="$(printf '%s\n' "$declared_spec" | cut -f2)"
                    else
                      echo "::warning::jq is not installed on this runner, so package.json's packageManager / devEngines.packageManager fields cannot be read; falling back to root lockfile detection. Install jq, or set the package-manager input explicitly."
                    fi
                  fi
                  if [ -z "$pm" ] && [ -n "$declared" ]; then
                    case "$declared" in
                      yarn|pnpm|npm) pm="$declared" ;;
                      *)
                        echo "::error::package.json declares package manager '$declared', which is not yarn, pnpm or npm; set the package-manager input explicitly."
                        exit 1
                        ;;
                    esac
                  fi
                  if [ -z "$pm" ]; then
                    lockfiles=''
                    lockfile_count=0
                    if [ -f yarn.lock ]; then pm=yarn; lockfiles="${lockfiles}yarn.lock "; lockfile_count=$((lockfile_count + 1)); fi
                    if [ -f pnpm-lock.yaml ]; then pm=pnpm; lockfiles="${lockfiles}pnpm-lock.yaml "; lockfile_count=$((lockfile_count + 1)); fi
                    if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
                      pm=npm
                      lockfile_count=$((lockfile_count + 1))
                      if [ -f package-lock.json ]; then lockfiles="${lockfiles}package-lock.json "; fi
                      if [ -f npm-shrinkwrap.json ]; then lockfiles="${lockfiles}npm-shrinkwrap.json "; fi
                    fi
                    if [ "$lockfile_count" -eq 0 ]; then
                      echo "::error::Cannot resolve the package manager: package.json declares none and there is no yarn.lock, pnpm-lock.yaml, package-lock.json or npm-shrinkwrap.json at the repository root. Set the package-manager input explicitly."
                      exit 1
                    fi
                    if [ "$lockfile_count" -gt 1 ]; then
                      echo "::error::Cannot resolve the package manager: multiple root lockfiles found (${lockfiles% }). Set the package-manager input explicitly."
                      exit 1
                    fi
                  fi
                  if [ "$pm" = pnpm ] && { [ "$declared" != pnpm ] || [ -z "$declared_version" ]; }; then
                    echo "::error::Resolved package manager is pnpm, but no pnpm version is readable from the repository-root package.json. pnpm/action-setup takes the version from 'packageManager: pnpm@<version>' or 'devEngines.packageManager: {name: pnpm, version: <range>}' - add one of those, and make sure jq is installed on this runner so the workflow can read it."
                    exit 1
                  fi
                  if [ -n "$LOCKFILE_REQUIRED" ]; then
                    case "$pm" in
                      yarn) wanted='yarn.lock' ;;
                      pnpm) wanted='pnpm-lock.yaml' ;;
                      *) wanted='package-lock.json npm-shrinkwrap.json' ;;
                    esac
                    found=''
                    for candidate in $wanted; do
                      if [ -f "$candidate" ]; then found="$candidate"; break; fi
                    done
                    if [ -z "$found" ]; then
                      echo "::error::Resolved package manager is $pm, but this job caches JS dependencies with actions/setup-node and the repository root has none of: $wanted. Commit the lockfile, or set the package-manager input to the manager whose lockfile this repository actually has."
                      exit 1
                    fi
                  fi
                  echo "Resolved package manager: $pm"
                  echo "pm=$pm" >> "$GITHUB_OUTPUT"

            - name: Setup pnpm
              if: steps.package-manager.outputs.pm == 'pnpm'
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - name: Setup Node
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ inputs.node-version }}

            - name: Enable corepack
              if: inputs.enable-corepack && steps.package-manager.outputs.pm != 'pnpm'
              shell: bash
              run: corepack enable

            - name: Install dependencies
              shell: bash
              env:
                  INSTALL_COMMAND: ${{ inputs.install-command }}
              run: eval "$INSTALL_COMMAND"

            - name: Build workspace JS dependencies
              if: inputs.build-command != ''
              shell: bash
              env:
                  BUILD_COMMAND: ${{ inputs.build-command }}
              run: eval "$BUILD_COMMAND"

            - name: Generate production Android project
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  EAS_BUILD_PROFILE: ${{ inputs.build-profile }}
              run: npx --yes expo prebuild --platform android --no-install --clean

            - name: Run gradlew :app:lintVitalRelease
              working-directory: ${{ inputs.app-dir }}/android
              shell: bash
              env:
                  GRADLE_ARGS: ${{ inputs.android-lint-gate-gradle-args }}
              run: |
                  set -euo pipefail
                  gradle_args=()
                  if [ -n "$GRADLE_ARGS" ]; then
                    normalized_gradle_args="${GRADLE_ARGS//$'\n'/ }"
                    normalized_gradle_args="${normalized_gradle_args//$'\r'/ }"
                    read -r -a gradle_args <<< "$normalized_gradle_args"
                  fi
                  ./gradlew :app:lintVitalRelease ${gradle_args[@]+"${gradle_args[@]}"}

            - name: Verify restricted permissions are absent (Google Play policy)
              working-directory: ${{ inputs.app-dir }}/android
              shell: bash
              env:
                  # Documented, greppable list of Android permissions restricted by Google
                  # Play policy for apps without an approved declaration/use case.
                  RESTRICTED_PERMISSIONS: |
                      android.permission.READ_MEDIA_IMAGES
                      android.permission.READ_MEDIA_VIDEO
                      android.permission.MANAGE_EXTERNAL_STORAGE
              run: |
                  set -euo pipefail
                  manifests=()
                  while IFS= read -r -d '' manifest; do
                    manifests+=("$manifest")
                  done < <(find app/build/intermediates -type f -name 'AndroidManifest.xml' -path '*release*' -print0)
                  if [ "${#manifests[@]}" -eq 0 ]; then
                    echo "::error::No merged release AndroidManifest.xml found under app/build/intermediates; cannot verify restricted permissions."
                    exit 1
                  fi
                  found=0
                  while IFS= read -r permission; do
                    [ -z "$permission" ] && continue
                    for manifest in "${manifests[@]}"; do
                      if grep -q "$permission" "$manifest"; then
                        echo "::error::Restricted permission '$permission' found in $manifest (Google Play policy)."
                        found=1
                      fi
                    done
                  done <<< "$RESTRICTED_PERMISSIONS"
                  if [ "$found" -ne 0 ]; then
                    exit 1
                  fi
                  echo "No restricted permissions found in the merged manifest(s)."

    android-publish:
        name: Android build and publish
        needs: [android-lint-gate]
        if: "!cancelled() && inputs.enable-android && (needs.android-lint-gate.result == 'success' || needs.android-lint-gate.result == 'skipped')"
        runs-on: ${{ fromJSON(inputs.android-runner-labels) }}
        timeout-minutes: ${{ inputs.build-timeout-minutes }}
        env:
            EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
            HAS_EAS_EXTRA_ENV: ${{ secrets.EAS_EXTRA_ENV != '' }}

        steps:
            - name: Validate required secrets
              shell: bash
              env:
                  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
              run: |
                  set -euo pipefail
                  missing=()
                  [ -z "${EXPO_TOKEN:-}" ] && missing+=(EXPO_TOKEN)
                  [ -z "${GOOGLE_SERVICE_ACCOUNT_JSON:-}" ] && missing+=(GOOGLE_SERVICE_ACCOUNT_JSON)
                  if [ "${#missing[@]}" -gt 0 ]; then
                    echo "::error::android-publish requires secrets: ${missing[*]}. Pass them via 'secrets: inherit' or an explicit secrets: block in the caller workflow."
                    exit 1
                  fi

            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - name: Apply publish-env
              if: inputs.publish-env != ''
              shell: bash
              env:
                  PUBLISH_ENV: ${{ inputs.publish-env }}
              run: |
                  set -euo pipefail
                  while IFS= read -r line; do
                    [ -z "$line" ] && continue
                    case "$line" in
                      *=*) ;;
                      *)
                        echo "::error::publish-env line '$line' is missing '='; expected KEY=VALUE."
                        exit 1
                        ;;
                    esac
                    name="${line%%=*}"
                    case "$name" in
                      ''|[!A-Za-z_]*)
                        echo "::error::publish-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    case "$name" in
                      *[!A-Za-z0-9_]*)
                        echo "::error::publish-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    echo "$line" >> "$GITHUB_ENV"
                  done <<< "$PUBLISH_ENV"

            - name: Apply EAS_EXTRA_ENV
              if: env.HAS_EAS_EXTRA_ENV == 'true'
              shell: bash
              env:
                  EAS_EXTRA_ENV: ${{ secrets.EAS_EXTRA_ENV }}
              run: |
                  set -euo pipefail
                  while IFS= read -r line; do
                    [ -z "$line" ] && continue
                    case "$line" in
                      *=*) ;;
                      *)
                        echo "::error::EAS_EXTRA_ENV has a line missing '='; expected KEY=VALUE."
                        exit 1
                        ;;
                    esac
                    name="${line%%=*}"
                    value="${line#*=}"
                    case "$name" in
                      ''|[!A-Za-z_]*)
                        echo "::error::EAS_EXTRA_ENV has a variable name that must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    case "$name" in
                      *[!A-Za-z0-9_]*)
                        echo "::error::EAS_EXTRA_ENV has a variable name that must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    if [ -n "$value" ]; then
                      echo "::add-mask::$value"
                    fi
                    echo "$name=$value" >> "$GITHUB_ENV"
                  done <<< "$EAS_EXTRA_ENV"

            - name: Resolve package manager
              id: package-manager
              shell: bash
              env:
                  PACKAGE_MANAGER: ${{ inputs.package-manager }}
                  LOCKFILE_REQUIRED: ''
              run: |
                  set -euo pipefail
                  pm=''
                  case "$PACKAGE_MANAGER" in
                    '') ;;
                    yarn|pnpm|npm) pm="$PACKAGE_MANAGER" ;;
                    *)
                      echo "::error::package-manager must be '' (auto-detect), yarn, pnpm or npm; got '$PACKAGE_MANAGER'."
                      exit 1
                      ;;
                  esac
                  declared=''
                  declared_version=''
                  if { [ -z "$pm" ] || [ "$pm" = pnpm ]; } && [ -f package.json ]; then
                    if command -v jq >/dev/null 2>&1; then
                      declared_spec="$(jq -r '
                        (try (.devEngines.packageManager) catch null) as $raw
                        | (if ($raw | type) == "array" then ($raw[0] // null) else $raw end) as $de
                        | (if ($de | type) == "object" then [($de.name // ""), ($de.version // "")] else ["", ""] end) as $dev
                        | (if ((.packageManager // "") | type) == "string" and (.packageManager // "") != ""
                           then (.packageManager | if test("@") then [split("@")[0], (split("@")[1] | split("+")[0])] else [., ""] end)
                           else ["", ""] end) as $spec
                        | (if $dev[0] != "" then $dev[0] else $spec[0] end) as $name
                        | [$name,
                           (if $dev[0] != "" and $dev[1] != "" then $dev[1]
                            elif $spec[0] == $name then $spec[1]
                            else "" end)]
                        | @tsv' package.json)"
                      declared="$(printf '%s\n' "$declared_spec" | cut -f1)"
                      declared_version="$(printf '%s\n' "$declared_spec" | cut -f2)"
                    else
                      echo "::warning::jq is not installed on this runner, so package.json's packageManager / devEngines.packageManager fields cannot be read; falling back to root lockfile detection. Install jq, or set the package-manager input explicitly."
                    fi
                  fi
                  if [ -z "$pm" ] && [ -n "$declared" ]; then
                    case "$declared" in
                      yarn|pnpm|npm) pm="$declared" ;;
                      *)
                        echo "::error::package.json declares package manager '$declared', which is not yarn, pnpm or npm; set the package-manager input explicitly."
                        exit 1
                        ;;
                    esac
                  fi
                  if [ -z "$pm" ]; then
                    lockfiles=''
                    lockfile_count=0
                    if [ -f yarn.lock ]; then pm=yarn; lockfiles="${lockfiles}yarn.lock "; lockfile_count=$((lockfile_count + 1)); fi
                    if [ -f pnpm-lock.yaml ]; then pm=pnpm; lockfiles="${lockfiles}pnpm-lock.yaml "; lockfile_count=$((lockfile_count + 1)); fi
                    if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
                      pm=npm
                      lockfile_count=$((lockfile_count + 1))
                      if [ -f package-lock.json ]; then lockfiles="${lockfiles}package-lock.json "; fi
                      if [ -f npm-shrinkwrap.json ]; then lockfiles="${lockfiles}npm-shrinkwrap.json "; fi
                    fi
                    if [ "$lockfile_count" -eq 0 ]; then
                      echo "::error::Cannot resolve the package manager: package.json declares none and there is no yarn.lock, pnpm-lock.yaml, package-lock.json or npm-shrinkwrap.json at the repository root. Set the package-manager input explicitly."
                      exit 1
                    fi
                    if [ "$lockfile_count" -gt 1 ]; then
                      echo "::error::Cannot resolve the package manager: multiple root lockfiles found (${lockfiles% }). Set the package-manager input explicitly."
                      exit 1
                    fi
                  fi
                  if [ "$pm" = pnpm ] && { [ "$declared" != pnpm ] || [ -z "$declared_version" ]; }; then
                    echo "::error::Resolved package manager is pnpm, but no pnpm version is readable from the repository-root package.json. pnpm/action-setup takes the version from 'packageManager: pnpm@<version>' or 'devEngines.packageManager: {name: pnpm, version: <range>}' - add one of those, and make sure jq is installed on this runner so the workflow can read it."
                    exit 1
                  fi
                  if [ -n "$LOCKFILE_REQUIRED" ]; then
                    case "$pm" in
                      yarn) wanted='yarn.lock' ;;
                      pnpm) wanted='pnpm-lock.yaml' ;;
                      *) wanted='package-lock.json npm-shrinkwrap.json' ;;
                    esac
                    found=''
                    for candidate in $wanted; do
                      if [ -f "$candidate" ]; then found="$candidate"; break; fi
                    done
                    if [ -z "$found" ]; then
                      echo "::error::Resolved package manager is $pm, but this job caches JS dependencies with actions/setup-node and the repository root has none of: $wanted. Commit the lockfile, or set the package-manager input to the manager whose lockfile this repository actually has."
                      exit 1
                    fi
                  fi
                  echo "Resolved package manager: $pm"
                  echo "pm=$pm" >> "$GITHUB_OUTPUT"

            - name: Setup pnpm
              if: steps.package-manager.outputs.pm == 'pnpm'
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - name: Setup Node
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ inputs.node-version }}

            - name: Enable corepack
              if: inputs.enable-corepack && steps.package-manager.outputs.pm != 'pnpm'
              shell: bash
              run: corepack enable

            - name: Install dependencies
              shell: bash
              env:
                  INSTALL_COMMAND: ${{ inputs.install-command }}
              run: eval "$INSTALL_COMMAND"

            - name: Build workspace JS dependencies
              if: inputs.build-command != ''
              shell: bash
              env:
                  BUILD_COMMAND: ${{ inputs.build-command }}
              run: eval "$BUILD_COMMAND"

            - name: Run Android pre-submit command
              if: inputs.android-pre-submit-command != ''
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  ANDROID_PRE_SUBMIT_COMMAND: ${{ inputs.android-pre-submit-command }}
              run: eval "$ANDROID_PRE_SUBMIT_COMMAND"

            - name: EAS build (Android)
              id: build
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  EAS_CLI_VERSION: ${{ inputs.eas-cli-version }}
                  BUILD_PROFILE: ${{ inputs.build-profile }}
              run: |
                  set -euo pipefail
                  output_path="$RUNNER_TEMP/android-publish/app.aab"
                  mkdir -p "$(dirname "$output_path")"
                  npx --yes "eas-cli@${EAS_CLI_VERSION}" build \
                    --platform android \
                    --profile "$BUILD_PROFILE" \
                    --local \
                    --non-interactive \
                    --output "$output_path"
                  echo "artifact-path=$output_path" >> "$GITHUB_OUTPUT"

            - name: Verify required Android ABI present
              if: inputs.required-android-abi != ''
              shell: bash
              env:
                  ARTIFACT_PATH: ${{ steps.build.outputs.artifact-path }}
                  REQUIRED_ABI: ${{ inputs.required-android-abi }}
              run: |
                  set -euo pipefail
                  listing="$RUNNER_TEMP/aab-listing.txt"
                  unzip -l "$ARTIFACT_PATH" > "$listing"
                  if ! grep -qF "lib/${REQUIRED_ABI}/" "$listing"; then
                    echo "::error::Required ABI '${REQUIRED_ABI}' not found in $ARTIFACT_PATH (Google Play 64-bit requirement)."
                    exit 1
                  fi
                  echo "ABI '${REQUIRED_ABI}' present."

            - name: Upload Android build artifact
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: android-publish-build
                  path: ${{ steps.build.outputs.artifact-path }}
                  retention-days: 14

            - name: Write Google service account key
              id: google-key
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
                  GOOGLE_KEY_PATH_INPUT: ${{ inputs.google-key-path }}
              run: |
                  set -euo pipefail
                  if [ -n "$GOOGLE_KEY_PATH_INPUT" ]; then
                    key_path="$GOOGLE_KEY_PATH_INPUT"
                  else
                    key_path="$RUNNER_TEMP/android-publish/google-service-account.json"
                  fi
                  mkdir -p "$(dirname "$key_path")"
                  printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$key_path"
                  chmod 600 "$key_path"
                  absolute_key_path="$(cd "$(dirname "$key_path")" && pwd)/$(basename "$key_path")"
                  echo "key-path=$absolute_key_path" >> "$GITHUB_OUTPUT"

            - name: EAS submit (Android)
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  EAS_CLI_VERSION: ${{ inputs.eas-cli-version }}
                  SUBMIT_PROFILE: ${{ inputs.submit-profile }}
                  ARTIFACT_PATH: ${{ steps.build.outputs.artifact-path }}
                  # Exposed for eas.json submit profiles / fastlane hooks that read a service
                  # account key from disk; the exact eas.json wiring is consumer-owned.
                  GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.google-key.outputs.key-path }}
              run: |
                  set -euo pipefail
                  npx --yes "eas-cli@${EAS_CLI_VERSION}" submit \
                    --platform android \
                    --profile "$SUBMIT_PROFILE" \
                    --non-interactive \
                    --path "$ARTIFACT_PATH"

            - name: Run Android post-submit command
              if: inputs.android-post-submit-command != ''
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  ANDROID_POST_SUBMIT_COMMAND: ${{ inputs.android-post-submit-command }}
              run: eval "$ANDROID_POST_SUBMIT_COMMAND"

            - name: Remove Google service account key
              if: always()
              shell: bash
              env:
                  KEY_PATH: ${{ steps.google-key.outputs.key-path }}
              run: |
                  set -euo pipefail
                  if [ -n "${KEY_PATH:-}" ]; then
                    rm -f "$KEY_PATH"
                  fi

    status:
        name: Native publish result
        needs: [ios-publish, android-lint-gate, android-publish]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Report
              shell: bash
              env:
                  ENABLE_IOS: ${{ inputs.enable-ios }}
                  ENABLE_ANDROID: ${{ inputs.enable-android }}
                  LINT_GATE: ${{ inputs.android-lint-gate }}
                  IOS_RESULT: ${{ needs.ios-publish.result }}
                  LINT_RESULT: ${{ needs.android-lint-gate.result }}
                  ANDROID_RESULT: ${{ needs.android-publish.result }}
              run: |
                  set -euo pipefail
                  failed=0

                  if [ "$ENABLE_IOS" = "true" ] && [ "$IOS_RESULT" != "success" ]; then
                    echo "iOS publish failed or did not run."
                    failed=1
                  fi

                  if [ "$ENABLE_ANDROID" = "true" ]; then
                    if [ "$LINT_GATE" = "true" ] && [ "$LINT_RESULT" != "success" ]; then
                      echo "Android lint gate failed."
                      failed=1
                    fi
                    if [ "$ANDROID_RESULT" != "success" ]; then
                      echo "Android publish failed or did not run."
                      failed=1
                    fi
                  fi

                  if [ "$failed" -ne 0 ]; then
                    exit 1
                  fi
                  echo "Native publish completed successfully for enabled platforms."
