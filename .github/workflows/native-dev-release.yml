name: native-dev-release

on:
    workflow_call:
        inputs:
            control-runner-labels:
                description: >-
                    JSON array of runner labels for the lightweight control jobs
                    (detect, status, collect, validate-manifest, cancel-queued-runs)
                    that only run Node and the GitHub API and need no self-hosted
                    hardware. Override when the org has no GitHub-hosted runners,
                    for example an ephemeral RunsOn label set.
                required: false
                type: string
                default: '["ubuntu-latest"]'
            runs-on-cache-bypass:
                description: >-
                    Run a SHA-pinned runs-on/action before any artifact traffic when
                    the job lands on a RunsOn runner started with extras=s3-cache,
                    whose cache proxy takes over the Actions results URL and makes
                    actions/upload-artifact and download-artifact fail. A no-op on
                    every other runner. Off by default.
                required: false
                type: boolean
                default: false
            enable-ios:
                description: Run the ios-dev-release job.
                type: boolean
                required: false
                default: true
            enable-android:
                description: Run the android-dev-release job.
                type: boolean
                required: false
                default: false
            ios-runner-labels:
                description: JSON array of self-hosted runner labels for the iOS dev-release job.
                type: string
                required: false
                default: '["self-hosted","macOS","ARM64"]'
            android-runner-labels:
                description: >-
                    JSON array of self-hosted runner labels for the Android dev-release job.
                    The default is the x86_64 Linux pool (4 vCPU / 8 GiB): `eas build
                    --local` for Android needs Google's NDK, which ships for x86_64
                    Linux (and macOS) only, never linux-aarch64, and needs no Mac.
                    Proven on that pool by suuudokuuu's native-publish Android job.
                type: string
                required: false
                default: '["self-hosted","trf-linux-amd64-4x8"]'
            app-dir:
                description: App directory containing app.json/eas.json.
                type: string
                required: true
            node-version:
                type: string
                required: false
                default: '22'
            install-command:
                type: string
                required: false
                default: yarn install --immutable
            enable-corepack:
                type: boolean
                required: false
                default: true
            package-manager:
                description: >-
                    JS package manager driving pnpm provisioning and, in the jobs
                    that configure one, actions/setup-node's dependency cache.
                    Leave empty to auto-detect at the repository root, in order: an
                    explicit value here, then package.json's
                    devEngines.packageManager / packageManager field (needs jq on
                    the runner), then exactly one root lockfile (yarn.lock,
                    pnpm-lock.yaml, package-lock.json / npm-shrinkwrap.json). No
                    match, an ambiguous
                    match, or an unsupported value fails the job. install-command
                    must match the resolved manager (e.g. pnpm install
                    --frozen-lockfile). Resolving to pnpm additionally requires a
                    pnpm version declared in package.json (packageManager or
                    devEngines.packageManager) because pnpm/action-setup reads it
                    from there; the corepack step is then skipped.
                type: string
                required: false
                default: ''
            build-command:
                description: Optional workspace JS build command run at repo root before the dev build.
                type: string
                required: false
                default: ''
            eas-cli-version:
                type: string
                required: false
                default: '20.5.1'
            android-artifact-extension:
                description: >-
                    Artifact container EAS produces for the Android dev build, inferred by
                    eas-cli from the --output extension: apk or aab. Defaults to apk because
                    a dev release is an internal-distribution build that testers sideload;
                    an aab cannot be installed on a device. Fails closed on any other value.
                type: string
                required: false
                default: apk
            build-profile:
                description: EAS build profile (eas.json build.<profile>) used for both platforms.
                type: string
                required: false
                default: development
            distribution:
                description: >-
                    Where testers get the build. github-release (default) attaches it
                    to a pruned GitHub Release. eas uploads it to EAS internal
                    distribution (eas upload) and outputs the build's EAS install
                    page, which a private repository's testers can open without
                    GitHub access; it needs an apk on Android. Fails closed on any
                    other value.
                type: string
                required: false
                default: github-release
            build-location:
                description: >-
                    local (default) runs eas build --local on the runner. cloud runs
                    the build on EAS servers (eas build --json --wait) and needs
                    distribution eas, a build profile with distribution internal,
                    and no post-build command or embedded build number check, since
                    the binary never reaches the runner. publish-env, EAS_EXTRA_ENV
                    and DEVELOPMENT_BUILD_NUMBER do not reach the EAS builder; put
                    build-time values in the profile env or EAS environment
                    variables. Fails closed on any other value.
                type: string
                required: false
                default: local
            ios-pre-build-command:
                description: >-
                    Optional consumer-owned command (e.g. patching eas.json or asserting a
                    computed build number) run in app-dir before the iOS EAS build. Its env is
                    EXPO_TOKEN, DEVELOPMENT_BUILD_NUMBER (<run_number>.<run_attempt>),
                    publish-env, EAS_EXTRA_ENV and EXPO_ASC_API_KEY_PATH (empty unless the
                    ASC_API_KEY secret is set) — not eas.json profile env, which EAS applies
                    only inside eas build.
                type: string
                required: false
                default: ''
            android-pre-build-command:
                description: >-
                    Optional consumer-owned command run in app-dir before the Android EAS
                    build. Its env is EXPO_TOKEN, DEVELOPMENT_BUILD_NUMBER
                    (<run_number>.<run_attempt>), publish-env and EAS_EXTRA_ENV — not eas.json
                    profile env, which EAS applies only inside eas build.
                type: string
                required: false
                default: ''
            ios-verify-embedded-build-number:
                description: >-
                    Fail the iOS job, before any release is created, when the built .ipa's
                    CFBundleVersion differs from DEVELOPMENT_BUILD_NUMBER
                    (<run_number>.<run_attempt>). Off by default because it only holds when
                    the app wires that variable into its build number, e.g. app.config.js
                    ios.buildNumber: process.env.DEVELOPMENT_BUILD_NUMBER with eas.json
                    cli.appVersionSource: local. There is no Android equivalent: versionCode
                    is an integer and can never equal <run_number>.<run_attempt>.
                type: boolean
                required: false
                default: false
            ios-post-build-command:
                description: >-
                    Optional consumer-owned command run in app-dir after the iOS EAS build and
                    its embedded build number read-back, before the build is published (GitHub
                    Release or eas upload); a non-zero exit stops publication. Runs with the job's env plus
                    ARTIFACT_PATH (the built .ipa), EMBEDDED_BUILD_NUMBER (CFBundleVersion) and
                    EMBEDDED_VERSION (CFBundleShortVersionString).
                type: string
                required: false
                default: ''
            android-post-build-command:
                description: >-
                    Optional consumer-owned command run in app-dir after the Android EAS build
                    and its embedded build number read-back, before the build is published
                    (GitHub Release or eas upload); a non-zero exit stops publication. Runs with the job's env plus
                    ARTIFACT_PATH (the built .apk/.aab), EMBEDDED_BUILD_NUMBER (versionCode)
                    and EMBEDDED_VERSION (versionName), both empty when the host has no tool
                    to read them.
                type: string
                required: false
                default: ''
            tag-prefix:
                description: >-
                    Release tag prefix. Tags are created as <tag-prefix>-ios-<run_number> and
                    <tag-prefix>-android-<run_number> (<tag-prefix>-<call-scope>-<platform>-<run_number>
                    with call-scope).
                type: string
                required: false
                default: dev
            call-scope:
                description: >-
                    Names this call's build artifacts, release tags (and so what it
                    prunes), pull request comment sections and concurrency group, so a
                    caller can run this workflow several times in one run, e.g. once per
                    brand in a matrix, without the calls colliding, pruning or queueing
                    behind each other. Calls that share a run must each set a distinct,
                    non-empty value; a second call publishing the same release tag in
                    the same run attempt fails. Letters, digits, '.', '_' and single '-'
                    between them. Empty (default) keeps today's names.
                type: string
                required: false
                default: ''
            keep-releases:
                description: Number of newest published releases (per platform tag) to keep; older ones are pruned.
                type: string
                required: false
                default: '5'
            pr-comment:
                description: >-
                    On a pull_request event, write each platform's development build (install link,
                    runtime fingerprint, or the failure) into the pull request's sticky preview comment.
                    The calling job must then also grant pull-requests: write.
                type: boolean
                required: false
                default: false
            asc-key-path:
                description: >-
                    Optional path, relative to app-dir, the App Store Connect API key (.p8) is
                    written to and removed from. Only used when the ASC_API_KEY secret is set; set
                    this only when eas.json requires the key at a specific app-dir-relative
                    location, otherwise leave empty so the key is written under $RUNNER_TEMP and
                    never enters the eas build --local archive.
                type: string
                required: false
                default: ''
            build-timeout-minutes:
                type: number
                required: false
                default: 120
            publish-env:
                description: >-
                    Newline-separated KEY=VALUE pairs of non-secret env appended to
                    $GITHUB_ENV at the start of ios-dev-release and android-dev-release,
                    before eas build. Rejects (fails closed) any line without '=' or
                    whose name does not match ^[A-Za-z_][A-Za-z0-9_]*$. For secret
                    values use the EAS_EXTRA_ENV secret instead — inputs are not masked
                    in logs.
                type: string
                required: false
                default: ''

        secrets:
            EXPO_TOKEN:
                description: Expo access token, required by both dev-release jobs.
                required: false
            ASC_API_KEY:
                description: >-
                    Optional App Store Connect API key contents (.p8), used by ios-dev-release
                    when the development profile needs automatic device/credential management.
                required: false
            ASC_KEY_ID:
                description: >-
                    App Store Connect API key ID matching ASC_API_KEY. Required alongside
                    ASC_API_KEY and ASC_ISSUER_ID for EAS to resolve the key non-interactively;
                    exported to the build step as EXPO_ASC_KEY_ID.
                required: false
            ASC_ISSUER_ID:
                description: >-
                    App Store Connect API key issuer ID matching ASC_API_KEY. Required alongside
                    ASC_API_KEY and ASC_KEY_ID for EAS to resolve the key non-interactively;
                    exported to the build step as EXPO_ASC_ISSUER_ID.
                required: false
            EAS_EXTRA_ENV:
                description: >-
                    Newline-separated KEY=VALUE pairs of secret env appended to
                    $GITHUB_ENV at the start of ios-dev-release and android-dev-release,
                    with each value masked in logs before being written. Use this for
                    secrets eas build needs on the environment, e.g.
                    EXPO_APPLE_APP_SPECIFIC_PASSWORD.
                required: false
        outputs:
            ios-install-url:
                description: EAS install page of the iOS build (distribution eas), empty otherwise.
                value: ${{ jobs.ios-dev-release.outputs.install-url }}
            ios-build-id:
                description: EAS build id of the iOS build (distribution eas), empty otherwise.
                value: ${{ jobs.ios-dev-release.outputs.build-id }}
            ios-release-url:
                description: GitHub Release of the iOS build (distribution github-release), empty otherwise.
                value: ${{ jobs.ios-dev-release.outputs.release-url }}
            ios-fingerprint:
                description: Runtime fingerprint of the iOS build.
                value: ${{ jobs.ios-dev-release.outputs.fingerprint }}
            android-install-url:
                description: EAS install page of the Android build (distribution eas), empty otherwise.
                value: ${{ jobs.android-dev-release.outputs.install-url }}
            android-build-id:
                description: EAS build id of the Android build (distribution eas), empty otherwise.
                value: ${{ jobs.android-dev-release.outputs.build-id }}
            android-release-url:
                description: GitHub Release of the Android build (distribution github-release), empty otherwise.
                value: ${{ jobs.android-dev-release.outputs.release-url }}
            android-fingerprint:
                description: Runtime fingerprint of the Android build.
                value: ${{ jobs.android-dev-release.outputs.fingerprint }}

concurrency:
    group: native-dev-release-${{ github.workflow }}-${{ github.ref }}-${{ inputs.call-scope }}
    cancel-in-progress: false

jobs:
    ios-dev-release:
        name: iOS development build and release
        if: inputs.enable-ios
        runs-on: ${{ fromJSON(inputs.ios-runner-labels) }}
        timeout-minutes: ${{ inputs.build-timeout-minutes }}
        permissions:
            contents: write
        outputs:
            tag: ${{ steps.release.outputs.tag }}
            fingerprint: ${{ steps.fingerprint.outputs.ios-runtime-version }}
            asset-name: ${{ steps.meta.outputs.asset-name }}
            install-url: ${{ steps.eas.outputs.install-url }}
            build-id: ${{ steps.eas.outputs.build-id }}
            release-url: ${{ steps.publish.outcome == 'success' && format('{0}/{1}/releases/tag/{2}', github.server_url, github.repository, steps.release.outputs.tag) || '' }}
        env:
            EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
            HAS_ASC_KEY: ${{ secrets.ASC_API_KEY != '' }}
            HAS_EAS_EXTRA_ENV: ${{ secrets.EAS_EXTRA_ENV != '' }}

        steps:
            - name: Apply RunsOn cache bypass
              uses: rnw-community/mobile-ci/actions/runs-on-cache-bypass@v4.3.1 # v4.3.1
              with:
                  enabled: ${{ inputs.runs-on-cache-bypass }}
            - name: Validate required secrets
              shell: bash
              run: |
                  set -euo pipefail
                  if [ -z "${EXPO_TOKEN:-}" ]; then
                    echo "::error::ios-dev-release requires the EXPO_TOKEN secret. Pass it via 'secrets: inherit' or an explicit secrets: block in the caller workflow."
                    exit 1
                  fi

            - name: Validate distribution and build location
              shell: bash
              env:
                  DISTRIBUTION: ${{ inputs.distribution }}
                  BUILD_LOCATION: ${{ inputs.build-location }}
                  POST_BUILD_COMMAND: ${{ inputs.ios-post-build-command }}
                  VERIFY_EMBEDDED_BUILD_NUMBER: ${{ inputs.ios-verify-embedded-build-number }}
                  ARTIFACT_EXTENSION: ipa
              run: |
                  set -euo pipefail
                  case "$DISTRIBUTION" in
                    github-release|eas) ;;
                    *)
                      echo "::error::distribution must be github-release or eas; got '$DISTRIBUTION'."
                      exit 1
                      ;;
                  esac
                  case "$BUILD_LOCATION" in
                    local|cloud) ;;
                    *)
                      echo "::error::build-location must be local or cloud; got '$BUILD_LOCATION'."
                      exit 1
                      ;;
                  esac
                  if [ "$BUILD_LOCATION" = local ] && [ "$DISTRIBUTION" = eas ] && [ "$ARTIFACT_EXTENSION" = aab ]; then
                    echo "::error::distribution eas hands testers an install link, and an .aab cannot be installed on a device; set android-artifact-extension to apk."
                    exit 1
                  fi
                  if [ "$BUILD_LOCATION" = cloud ]; then
                    if [ "$DISTRIBUTION" != eas ]; then
                      echo "::error::build-location cloud leaves the binary on EAS servers, so only EAS can distribute it; set distribution: eas."
                      exit 1
                    fi
                    if [ -n "$POST_BUILD_COMMAND" ]; then
                      echo "::error::A post-build command inspects the local binary, which a cloud build never downloads; remove it or set build-location: local."
                      exit 1
                    fi
                    if [ "$VERIFY_EMBEDDED_BUILD_NUMBER" = true ]; then
                      echo "::error::ios-verify-embedded-build-number reads the local .ipa, which a cloud build never downloads; turn it off or set build-location: local."
                      exit 1
                    fi
                  fi

            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - name: Apply publish-env
              if: inputs.publish-env != ''
              shell: bash
              env:
                  PUBLISH_ENV: ${{ inputs.publish-env }}
              run: |
                  set -euo pipefail
                  while IFS= read -r line; do
                    [ -z "$line" ] && continue
                    case "$line" in
                      *=*) ;;
                      *)
                        echo "::error::publish-env line '$line' is missing '='; expected KEY=VALUE."
                        exit 1
                        ;;
                    esac
                    name="${line%%=*}"
                    case "$name" in
                      ''|[!A-Za-z_]*)
                        echo "::error::publish-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    case "$name" in
                      *[!A-Za-z0-9_]*)
                        echo "::error::publish-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    echo "$line" >> "$GITHUB_ENV"
                  done <<< "$PUBLISH_ENV"

            - name: Apply EAS_EXTRA_ENV
              if: env.HAS_EAS_EXTRA_ENV == 'true'
              uses: rnw-community/mobile-ci/actions/apply-secret-env@v4.3.1 # v4.3.1
              with:
                  env: ${{ secrets.EAS_EXTRA_ENV }}
                  label: EAS_EXTRA_ENV

            - name: Resolve package manager
              id: package-manager
              shell: bash
              env:
                  PACKAGE_MANAGER: ${{ inputs.package-manager }}
                  LOCKFILE_REQUIRED: ''
              run: |
                  set -euo pipefail
                  pm=''
                  case "$PACKAGE_MANAGER" in
                    '') ;;
                    yarn|pnpm|npm) pm="$PACKAGE_MANAGER" ;;
                    *)
                      echo "::error::package-manager must be '' (auto-detect), yarn, pnpm or npm; got '$PACKAGE_MANAGER'."
                      exit 1
                      ;;
                  esac
                  declared=''
                  declared_version=''
                  if { [ -z "$pm" ] || [ "$pm" = pnpm ]; } && [ -f package.json ]; then
                    if command -v jq >/dev/null 2>&1; then
                      declared_spec="$(jq -r '
                        (try (.devEngines.packageManager) catch null) as $raw
                        | (if ($raw | type) == "array" then ($raw[0] // null) else $raw end) as $de
                        | (if ($de | type) == "object" then [($de.name // ""), ($de.version // "")] else ["", ""] end) as $dev
                        | (if ((.packageManager // "") | type) == "string" and (.packageManager // "") != ""
                           then (.packageManager | if test("@") then [split("@")[0], (split("@")[1] | split("+")[0])] else [., ""] end)
                           else ["", ""] end) as $spec
                        | (if $dev[0] != "" then $dev[0] else $spec[0] end) as $name
                        | [$name,
                           (if $dev[0] != "" and $dev[1] != "" then $dev[1]
                            elif $spec[0] == $name then $spec[1]
                            else "" end)]
                        | @tsv' package.json)"
                      declared="$(printf '%s\n' "$declared_spec" | cut -f1)"
                      declared_version="$(printf '%s\n' "$declared_spec" | cut -f2)"
                    else
                      echo "::warning::jq is not installed on this runner, so package.json's packageManager / devEngines.packageManager fields cannot be read; falling back to root lockfile detection. Install jq, or set the package-manager input explicitly."
                    fi
                  fi
                  if [ -z "$pm" ] && [ -n "$declared" ]; then
                    case "$declared" in
                      yarn|pnpm|npm) pm="$declared" ;;
                      *)
                        echo "::error::package.json declares package manager '$declared', which is not yarn, pnpm or npm; set the package-manager input explicitly."
                        exit 1
                        ;;
                    esac
                  fi
                  if [ -z "$pm" ]; then
                    lockfiles=''
                    lockfile_count=0
                    if [ -f yarn.lock ]; then pm=yarn; lockfiles="${lockfiles}yarn.lock "; lockfile_count=$((lockfile_count + 1)); fi
                    if [ -f pnpm-lock.yaml ]; then pm=pnpm; lockfiles="${lockfiles}pnpm-lock.yaml "; lockfile_count=$((lockfile_count + 1)); fi
                    if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
                      pm=npm
                      lockfile_count=$((lockfile_count + 1))
                      if [ -f package-lock.json ]; then lockfiles="${lockfiles}package-lock.json "; fi
                      if [ -f npm-shrinkwrap.json ]; then lockfiles="${lockfiles}npm-shrinkwrap.json "; fi
                    fi
                    if [ "$lockfile_count" -eq 0 ]; then
                      echo "::error::Cannot resolve the package manager: package.json declares none and there is no yarn.lock, pnpm-lock.yaml, package-lock.json or npm-shrinkwrap.json at the repository root. Set the package-manager input explicitly."
                      exit 1
                    fi
                    if [ "$lockfile_count" -gt 1 ]; then
                      echo "::error::Cannot resolve the package manager: multiple root lockfiles found (${lockfiles% }). Set the package-manager input explicitly."
                      exit 1
                    fi
                  fi
                  if [ "$pm" = pnpm ] && { [ "$declared" != pnpm ] || [ -z "$declared_version" ]; }; then
                    echo "::error::Resolved package manager is pnpm, but no pnpm version is readable from the repository-root package.json. pnpm/action-setup takes the version from 'packageManager: pnpm@<version>' or 'devEngines.packageManager: {name: pnpm, version: <range>}' - add one of those, and make sure jq is installed on this runner so the workflow can read it."
                    exit 1
                  fi
                  if [ -n "$LOCKFILE_REQUIRED" ]; then
                    case "$pm" in
                      yarn) wanted='yarn.lock' ;;
                      pnpm) wanted='pnpm-lock.yaml' ;;
                      *) wanted='package-lock.json npm-shrinkwrap.json' ;;
                    esac
                    found=''
                    for candidate in $wanted; do
                      if [ -f "$candidate" ]; then found="$candidate"; break; fi
                    done
                    if [ -z "$found" ]; then
                      echo "::error::Resolved package manager is $pm, but this job caches JS dependencies with actions/setup-node and the repository root has none of: $wanted. Commit the lockfile, or set the package-manager input to the manager whose lockfile this repository actually has."
                      exit 1
                    fi
                  fi
                  echo "Resolved package manager: $pm"
                  echo "pm=$pm" >> "$GITHUB_OUTPUT"

            - name: Setup pnpm
              if: steps.package-manager.outputs.pm == 'pnpm'
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ inputs.node-version }}

            - name: Enable corepack
              if: inputs.enable-corepack && steps.package-manager.outputs.pm != 'pnpm'
              shell: bash
              run: corepack enable

            - name: Install dependencies
              shell: bash
              env:
                  INSTALL_COMMAND: ${{ inputs.install-command }}
              run: eval "$INSTALL_COMMAND"

            - name: Build workspace JS dependencies
              if: inputs.build-command != ''
              shell: bash
              env:
                  BUILD_COMMAND: ${{ inputs.build-command }}
              run: eval "$BUILD_COMMAND"

            - name: Compute the runtime version
              id: fingerprint
              uses: rnw-community/mobile-ci/actions/ota-runtime-version@v4.3.1 # v4.3.1
              with:
                  app-dir: ${{ inputs.app-dir }}
                  platform: ios
                  eas-profile: ${{ inputs.build-profile }}

            - name: Compute deterministic build number
              shell: bash
              env:
                  RUN_NUMBER: ${{ github.run_number }}
                  RUN_ATTEMPT: ${{ github.run_attempt }}
              run: echo "DEVELOPMENT_BUILD_NUMBER=${RUN_NUMBER}.${RUN_ATTEMPT}" >> "$GITHUB_ENV"

            - name: Compute release tag
              id: tag
              shell: bash
              env:
                  TAG_PREFIX: ${{ inputs.tag-prefix }}
                  RUN_NUMBER: ${{ github.run_number }}
                  CALL_SCOPE: ${{ inputs.call-scope }}
              run: |
                  set -euo pipefail
                  if [ -n "$CALL_SCOPE" ] && ! [[ "$CALL_SCOPE" =~ ^[A-Za-z0-9._]+(-[A-Za-z0-9._]+)*$ ]]; then
                    echo "::error::call-scope '$CALL_SCOPE' must be letters, digits, '.' and '_', with single '-' only between them, so no two calls' artifacts or release tags can collide."
                    exit 1
                  fi
                  prefix="${TAG_PREFIX}${CALL_SCOPE:+-$CALL_SCOPE}-ios-"
                  {
                    echo "tag=${prefix}${RUN_NUMBER}"
                    echo "prefix=$prefix"
                    echo "artifact=ios-dev-build${CALL_SCOPE:+-$CALL_SCOPE}"
                  } >> "$GITHUB_OUTPUT"

            - name: Write App Store Connect API key
              if: env.HAS_ASC_KEY == 'true'
              id: asc-key
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
                  ASC_KEY_PATH_INPUT: ${{ inputs.asc-key-path }}
              run: |
                  set -euo pipefail
                  if [ -n "$ASC_KEY_PATH_INPUT" ]; then
                    key_path="$ASC_KEY_PATH_INPUT"
                  else
                    key_path="$RUNNER_TEMP/ios-dev-release/asc-api-key.p8"
                  fi
                  mkdir -p "$(dirname "$key_path")"
                  printf '%s' "$ASC_API_KEY" > "$key_path"
                  chmod 600 "$key_path"
                  absolute_key_path="$(cd "$(dirname "$key_path")" && pwd)/$(basename "$key_path")"
                  echo "key-path=$absolute_key_path" >> "$GITHUB_OUTPUT"

            - name: Run iOS pre-build command
              if: inputs.ios-pre-build-command != ''
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  EXPO_ASC_API_KEY_PATH: ${{ steps.asc-key.outputs.key-path }}
                  IOS_PRE_BUILD_COMMAND: ${{ inputs.ios-pre-build-command }}
              run: eval "$IOS_PRE_BUILD_COMMAND"

            - name: EAS build (iOS, development)
              id: build
              if: inputs.build-location == 'local'
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  EAS_CLI_VERSION: ${{ inputs.eas-cli-version }}
                  BUILD_PROFILE: ${{ inputs.build-profile }}
                  EXPO_ASC_API_KEY_PATH: ${{ steps.asc-key.outputs.key-path }}
                  EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
                  EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
              run: |
                  set -euo pipefail
                  output_path="$RUNNER_TEMP/ios-dev-release/app.ipa"
                  mkdir -p "$(dirname "$output_path")"
                  npx --yes "eas-cli@${EAS_CLI_VERSION}" build \
                    --platform ios \
                    --profile "$BUILD_PROFILE" \
                    --local \
                    --non-interactive \
                    --output "$output_path" 2>&1 | LC_ALL=C sed -E 's#[A-Za-z0-9+/=]{128,}#[REDACTED encoded build payload]#g'
                  test -f "$output_path"
                  echo "artifact-path=$output_path" >> "$GITHUB_OUTPUT"

            - name: EAS cloud build (iOS, development)
              id: cloud-build
              if: inputs.build-location == 'cloud'
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  EAS_CLI_VERSION: ${{ inputs.eas-cli-version }}
                  BUILD_PROFILE: ${{ inputs.build-profile }}
                  PLATFORM: ios
                  EXPO_ASC_API_KEY_PATH: ${{ steps.asc-key.outputs.key-path }}
                  EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
                  EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
              run: |
                  set -euo pipefail
                  build_json="$RUNNER_TEMP/${PLATFORM}-dev-release/eas-build.json"
                  mkdir -p "$(dirname "$build_json")"
                  status=0
                  npx --yes "eas-cli@${EAS_CLI_VERSION}" build \
                    --platform "$PLATFORM" \
                    --profile "$BUILD_PROFILE" \
                    --non-interactive \
                    --json \
                    --wait > "$build_json" || status=$?
                  if [ "$status" -ne 0 ]; then
                    cat "$build_json" >&2 || true
                    echo "::error::The EAS cloud build failed (eas build exited $status)."
                    exit "$status"
                  fi
                  echo "build-json=$build_json" >> "$GITHUB_OUTPUT"

            - name: Remove App Store Connect API key
              if: always()
              shell: bash
              env:
                  ASC_KEY_PATH: ${{ steps.asc-key.outputs.key-path }}
              run: |
                  if [ -n "${ASC_KEY_PATH:-}" ]; then
                    rm -f "$ASC_KEY_PATH"
                  fi

            - name: Read embedded build number
              id: embedded
              if: inputs.build-location == 'local'
              shell: bash
              env:
                  ARTIFACT_PATH: ${{ steps.build.outputs.artifact-path }}
                  VERIFY_EMBEDDED_BUILD_NUMBER: ${{ inputs.ios-verify-embedded-build-number }}
              run: |
                  set -euo pipefail
                  if ! entries="$(unzip -Z1 "$ARTIFACT_PATH")"; then
                    echo "::error::Cannot list the entries of '$ARTIFACT_PATH'; the EAS build did not produce a readable .ipa."
                    exit 1
                  fi
                  info_plist_entry="$(printf '%s\n' "$entries" | grep -E '^Payload/[^/]+\.app/Info\.plist$' || true)"
                  case "$info_plist_entry" in
                    ''|*$'\n'*)
                      echo "::error::Expected exactly one Payload/<name>.app/Info.plist in '$ARTIFACT_PATH', found: ${info_plist_entry:-none}."
                      exit 1
                      ;;
                  esac
                  plist_dir="$RUNNER_TEMP/ios-dev-release/embedded"
                  mkdir -p "$plist_dir"
                  plist="$plist_dir/Info.plist"
                  unzip -p "$ARTIFACT_PATH" "$info_plist_entry" > "$plist"
                  read_plist_value() {
                    local value
                    if value="$(plutil -extract "$1" raw -o - "$plist" 2>/dev/null)"; then
                      printf '%s' "$value"
                      return 0
                    fi
                    if [ -x /usr/libexec/PlistBuddy ] && value="$(/usr/libexec/PlistBuddy -c "Print :$1" "$plist" 2>/dev/null)"; then
                      printf '%s' "$value"
                      return 0
                    fi
                    return 1
                  }
                  if ! build_number="$(read_plist_value CFBundleVersion)" || [ -z "$build_number" ]; then
                    echo "::error::Cannot read CFBundleVersion from $info_plist_entry in '$ARTIFACT_PATH'; an .ipa without a readable build number is a broken artifact."
                    exit 1
                  fi
                  version="$(read_plist_value CFBundleShortVersionString || true)"
                  case "$build_number$version" in
                    *$'\n'*)
                      echo "::error::CFBundleVersion or CFBundleShortVersionString in '$ARTIFACT_PATH' spans more than one line; refusing to publish it as metadata."
                      exit 1
                      ;;
                  esac
                  echo "The .ipa embeds CFBundleVersion '$build_number' and CFBundleShortVersionString '${version}'."
                  if [ "$VERIFY_EMBEDDED_BUILD_NUMBER" = true ] && [ "$build_number" != "${DEVELOPMENT_BUILD_NUMBER:-}" ]; then
                    echo "::error::The built .ipa embeds CFBundleVersion '$build_number', but this run's DEVELOPMENT_BUILD_NUMBER is '${DEVELOPMENT_BUILD_NUMBER:-}' and ios-verify-embedded-build-number is on. Wire the variable into the build number - app.config.js ios.buildNumber: process.env.DEVELOPMENT_BUILD_NUMBER, with eas.json cli.appVersionSource: local so EAS does not replace it - or turn the check off."
                    exit 1
                  fi
                  echo "embedded-build-number=$build_number" >> "$GITHUB_OUTPUT"
                  echo "embedded-version=$version" >> "$GITHUB_OUTPUT"

            - name: Run iOS post-build command
              if: inputs.ios-post-build-command != ''
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  IOS_POST_BUILD_COMMAND: ${{ inputs.ios-post-build-command }}
                  ARTIFACT_PATH: ${{ steps.build.outputs.artifact-path }}
                  EMBEDDED_BUILD_NUMBER: ${{ steps.embedded.outputs.embedded-build-number }}
                  EMBEDDED_VERSION: ${{ steps.embedded.outputs.embedded-version }}
              run: eval "$IOS_POST_BUILD_COMMAND"

            - name: Upload iOS dev build artifact
              if: inputs.build-location == 'local'
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: ${{ steps.tag.outputs.artifact }}
                  path: ${{ steps.build.outputs.artifact-path }}
                  retention-days: 30

            - name: Distribute through EAS
              id: eas
              if: inputs.distribution == 'eas'
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  EAS_CLI_VERSION: ${{ inputs.eas-cli-version }}
                  PLATFORM: ios
                  BUILD_LOCATION: ${{ inputs.build-location }}
                  ARTIFACT_PATH: ${{ steps.build.outputs.artifact-path }}
                  BUILD_JSON: ${{ steps.cloud-build.outputs.build-json }}
              run: |
                  set -euo pipefail
                  work_dir="$RUNNER_TEMP/${PLATFORM}-dev-release"
                  mkdir -p "$work_dir"
                  jq_error="$work_dir/eas-distribution.err"
                  if [ "$BUILD_LOCATION" = local ]; then
                    upload_json="$work_dir/eas-upload.json"
                    npx --yes "eas-cli@${EAS_CLI_VERSION}" upload \
                      --platform "$PLATFORM" \
                      --build-path "$ARTIFACT_PATH" \
                      --non-interactive \
                      --json > "$upload_json"
                    if ! install_url="$(jq -er '.url | strings' "$upload_json" 2> "$jq_error")"; then
                      echo "::error::eas upload exited 0 but printed no build URL: $(head -c 2000 "$upload_json")"
                      exit 1
                    fi
                  else
                    if ! install_url="$(jq -er --arg platform "$PLATFORM" '
                      if type != "array" or length != 1 then error("expected exactly one build from eas build --json, got \(tojson)") else .[0] end
                      | if .status != "FINISHED" then error("EAS build \(.id) ended with status \(.status), not FINISHED") else . end
                      | if .distribution != "INTERNAL" then error("EAS build \(.id) has distribution \(.distribution); testers can install only a build profile with distribution internal") else . end
                      | if ((.artifacts.buildUrl // "") | length) == 0 then error("EAS build \(.id) has no artifacts.buildUrl") else . end
                      | if $platform == "android" and (.artifacts.buildUrl | test("\\.aab($|[?#])")) then error("EAS build \(.id) produced an .aab, which no device can install; set android.buildType apk in the build profile") else . end
                      | "https://expo.dev/accounts/\(.project.ownerAccount.name // error("EAS build \(.id) names no project owner"))/projects/\(.project.slug)/builds/\(.id)"' \
                      "$BUILD_JSON" 2> "$jq_error")"; then
                      echo "::error::$(sed -E 's/^jq: error \(at [^)]*\): //' "$jq_error")"
                      exit 1
                    fi
                  fi
                  build_page_re='^https://expo\.dev/accounts/[^/[:space:]]+/projects/[^/[:space:]]+/builds/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
                  if ! [[ "$install_url" =~ $build_page_re ]]; then
                    echo "::error::'$install_url' is not an EAS build page; refusing to hand testers a link nothing proves installs this build."
                    exit 1
                  fi
                  build_id="${install_url##*/builds/}"
                  echo "EAS internal distribution build $build_id: $install_url"
                  {
                    echo "install-url=$install_url"
                    echo "build-id=$build_id"
                  } >> "$GITHUB_OUTPUT"
                  echo "### iOS development build: [install from EAS]($install_url) (build \`$build_id\`)" >> "$GITHUB_STEP_SUMMARY"

            - name: Compute build metadata
              id: meta
              if: inputs.distribution == 'github-release'
              shell: bash
              working-directory: ${{ inputs.app-dir }}
              env:
                  ARTIFACT_PATH: ${{ steps.build.outputs.artifact-path }}
                  PLATFORM: ios
                  BUILD_NUMBER: ${{ env.DEVELOPMENT_BUILD_NUMBER }}
                  COMMIT_SHA: ${{ github.sha }}
                  BRANCH_NAME: ${{ github.ref_name }}
                  WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  TAG_NAME: ${{ steps.tag.outputs.tag }}
                  EMBEDDED_BUILD_NUMBER: ${{ steps.embedded.outputs.embedded-build-number }}
                  EMBEDDED_VERSION: ${{ steps.embedded.outputs.embedded-version }}
                  FINGERPRINT: ${{ steps.fingerprint.outputs.ios-runtime-version }}
              run: |
                  set -euo pipefail
                  asset_name="$(basename "$ARTIFACT_PATH")"
                  artifact_dir="$(dirname "$ARTIFACT_PATH")"
                  sums_path="$artifact_dir/SHA256SUMS"
                  meta_path="$artifact_dir/build-meta.json"
                  (cd "$artifact_dir" && shasum -a 256 "$asset_name") > "$sums_path"
                  sha256="$(awk '{print $1}' "$sums_path")"
                  version=""
                  if [ -f app.json ]; then
                    version="$(jq -r '.expo.version // empty' app.json)"
                  fi
                  built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  jq -n \
                    --arg platform "$PLATFORM" \
                    --arg version "$version" \
                    --arg buildNumber "$BUILD_NUMBER" \
                    --arg commitSha "$COMMIT_SHA" \
                    --arg branch "$BRANCH_NAME" \
                    --arg builtAt "$built_at" \
                    --arg workflowUrl "$WORKFLOW_URL" \
                    --arg tagName "$TAG_NAME" \
                    --arg assetName "$asset_name" \
                    --arg sha256 "$sha256" \
                    --arg embeddedBuildNumber "${EMBEDDED_BUILD_NUMBER:-}" \
                    --arg embeddedVersion "${EMBEDDED_VERSION:-}" \
                    --arg fingerprint "${FINGERPRINT:-}" \
                    '{platform: $platform}
                     + (if $version == "" then {} else {version: $version} end)
                     + {buildNumber: $buildNumber}
                     + (if $embeddedBuildNumber == "" then {} else {embeddedBuildNumber: $embeddedBuildNumber} end)
                     + (if $embeddedVersion == "" then {} else {embeddedVersion: $embeddedVersion} end)
                     + (if $fingerprint == "" then {} else {fingerprint: $fingerprint} end)
                     + {commitSha: $commitSha, branch: $branch, builtAt: $builtAt, workflowUrl: $workflowUrl, tagName: $tagName, assetName: $assetName, sha256: $sha256}' \
                    > "$meta_path"
                  {
                    echo "meta-path=$meta_path"
                    echo "asset-name=$asset_name"
                    echo "sums-path=$sums_path"
                  } >> "$GITHUB_OUTPUT"

            - name: Create GitHub Release (draft)
              id: release
              if: inputs.distribution == 'github-release'
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ steps.tag.outputs.tag }}
                  ARTIFACT_PATH: ${{ steps.build.outputs.artifact-path }}
                  META_PATH: ${{ steps.meta.outputs.meta-path }}
                  SUMS_PATH: ${{ steps.meta.outputs.sums-path }}
                  BUILD_NUMBER: ${{ env.DEVELOPMENT_BUILD_NUMBER }}
                  FINGERPRINT: ${{ steps.fingerprint.outputs.ios-runtime-version }}
              run: |
                  set -euo pipefail
                  notes="Automated development build. Build number: ${BUILD_NUMBER}."
                  if [ -n "${FINGERPRINT:-}" ]; then
                    notes="${notes}

                  Runtime fingerprint: \`${FINGERPRINT}\`
                  <!-- mobile-ci:fingerprint:${FINGERPRINT} -->"
                  fi
                  if existing_notes="$(gh release view "$TAG" --json body --jq .body 2>/dev/null)"; then
                    case "$existing_notes" in
                      *"Build number: ${BUILD_NUMBER}."*)
                        echo "::error::Release $TAG already holds build ${BUILD_NUMBER}, published by another call of native-dev-release in this run attempt. Give each call in one run a distinct call-scope."
                        exit 1
                        ;;
                    esac
                    echo "Updating existing release $TAG in place (job re-run)."
                    gh release edit "$TAG" \
                      --draft \
                      --title "iOS dev build ${TAG}" \
                      --notes "$notes"
                    gh release upload "$TAG" "$ARTIFACT_PATH" "$META_PATH" "$SUMS_PATH" --clobber
                  else
                    gh release create "$TAG" \
                      --draft \
                      --title "iOS dev build ${TAG}" \
                      --notes "$notes" \
                      "$ARTIFACT_PATH" "$META_PATH" "$SUMS_PATH"
                  fi
                  echo "tag=$TAG" >> "$GITHUB_OUTPUT"

            - name: Publish GitHub Release
              id: publish
              if: inputs.distribution == 'github-release'
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ steps.release.outputs.tag }}
              run: gh release edit "$TAG" --draft=false

            - name: Prune old iOS dev releases
              if: inputs.distribution == 'github-release'
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  TAG_PREFIX: ${{ steps.tag.outputs.prefix }}
                  KEEP_RELEASES: ${{ inputs.keep-releases }}
                  CURRENT_TAG: ${{ steps.release.outputs.tag }}
              run: |
                  set -euo pipefail
                  case "$KEEP_RELEASES" in
                    ''|*[!0-9]*|0[0-9]*)
                      echo "::error::keep-releases '$KEEP_RELEASES' must be a non-negative integer without leading zeros."
                      exit 1
                      ;;
                  esac
                  if ! published="$(gh api "repos/$REPOSITORY/releases" --paginate --jq '.[] | select(.draft == false) | [.created_at, .tag_name] | @tsv')"; then
                    echo "::error::Failed to list existing releases via 'gh api' while pruning old dev releases."
                    exit 1
                  fi
                  release_tags="$(printf '%s\n' "$published" \
                    | awk -F '\t' -v prefix="$TAG_PREFIX" -v current="$CURRENT_TAG" 'NF == 2 && index($2, prefix) == 1 && substr($2, length(prefix) + 1) ~ /^[0-9]+$/ && $2 != current' \
                    | sort -r -t "$(printf '\t')" -k1,1 \
                    | cut -f2)"
                  tags=()
                  while IFS= read -r tag; do
                    [ -n "$tag" ] || continue
                    tags+=("$tag")
                  done <<< "$release_tags"
                  total=${#tags[@]}
                  if [ "$total" -le "$KEEP_RELEASES" ]; then
                    echo "Nothing to prune ($total published release(s), keeping $KEEP_RELEASES)."
                    exit 0
                  fi
                  for ((i = KEEP_RELEASES; i < total; i++)); do
                    tag="${tags[$i]}"
                    echo "Pruning release $tag"
                    gh release delete "$tag" --yes --cleanup-tag
                  done

    android-dev-release:
        name: Android development build and release
        if: inputs.enable-android
        runs-on: ${{ fromJSON(inputs.android-runner-labels) }}
        timeout-minutes: ${{ inputs.build-timeout-minutes }}
        permissions:
            contents: write
        outputs:
            tag: ${{ steps.release.outputs.tag }}
            fingerprint: ${{ steps.fingerprint.outputs.android-runtime-version }}
            asset-name: ${{ steps.meta.outputs.asset-name }}
            install-url: ${{ steps.eas.outputs.install-url }}
            build-id: ${{ steps.eas.outputs.build-id }}
            release-url: ${{ steps.publish.outcome == 'success' && format('{0}/{1}/releases/tag/{2}', github.server_url, github.repository, steps.release.outputs.tag) || '' }}
        env:
            EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
            HAS_EAS_EXTRA_ENV: ${{ secrets.EAS_EXTRA_ENV != '' }}

        steps:
            - name: Apply RunsOn cache bypass
              uses: rnw-community/mobile-ci/actions/runs-on-cache-bypass@v4.3.1 # v4.3.1
              with:
                  enabled: ${{ inputs.runs-on-cache-bypass }}
            - name: Validate required secrets
              shell: bash
              run: |
                  set -euo pipefail
                  if [ -z "${EXPO_TOKEN:-}" ]; then
                    echo "::error::android-dev-release requires the EXPO_TOKEN secret. Pass it via 'secrets: inherit' or an explicit secrets: block in the caller workflow."
                    exit 1
                  fi

            - name: Validate distribution and build location
              shell: bash
              env:
                  DISTRIBUTION: ${{ inputs.distribution }}
                  BUILD_LOCATION: ${{ inputs.build-location }}
                  POST_BUILD_COMMAND: ${{ inputs.android-post-build-command }}
                  VERIFY_EMBEDDED_BUILD_NUMBER: 'false'
                  ARTIFACT_EXTENSION: ${{ inputs.android-artifact-extension }}
              run: |
                  set -euo pipefail
                  case "$DISTRIBUTION" in
                    github-release|eas) ;;
                    *)
                      echo "::error::distribution must be github-release or eas; got '$DISTRIBUTION'."
                      exit 1
                      ;;
                  esac
                  case "$BUILD_LOCATION" in
                    local|cloud) ;;
                    *)
                      echo "::error::build-location must be local or cloud; got '$BUILD_LOCATION'."
                      exit 1
                      ;;
                  esac
                  if [ "$BUILD_LOCATION" = local ] && [ "$DISTRIBUTION" = eas ] && [ "$ARTIFACT_EXTENSION" = aab ]; then
                    echo "::error::distribution eas hands testers an install link, and an .aab cannot be installed on a device; set android-artifact-extension to apk."
                    exit 1
                  fi
                  if [ "$BUILD_LOCATION" = cloud ]; then
                    if [ "$DISTRIBUTION" != eas ]; then
                      echo "::error::build-location cloud leaves the binary on EAS servers, so only EAS can distribute it; set distribution: eas."
                      exit 1
                    fi
                    if [ -n "$POST_BUILD_COMMAND" ]; then
                      echo "::error::A post-build command inspects the local binary, which a cloud build never downloads; remove it or set build-location: local."
                      exit 1
                    fi
                    if [ "$VERIFY_EMBEDDED_BUILD_NUMBER" = true ]; then
                      echo "::error::ios-verify-embedded-build-number reads the local .ipa, which a cloud build never downloads; turn it off or set build-location: local."
                      exit 1
                    fi
                  fi

            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - name: Apply publish-env
              if: inputs.publish-env != ''
              shell: bash
              env:
                  PUBLISH_ENV: ${{ inputs.publish-env }}
              run: |
                  set -euo pipefail
                  while IFS= read -r line; do
                    [ -z "$line" ] && continue
                    case "$line" in
                      *=*) ;;
                      *)
                        echo "::error::publish-env line '$line' is missing '='; expected KEY=VALUE."
                        exit 1
                        ;;
                    esac
                    name="${line%%=*}"
                    case "$name" in
                      ''|[!A-Za-z_]*)
                        echo "::error::publish-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    case "$name" in
                      *[!A-Za-z0-9_]*)
                        echo "::error::publish-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                        exit 1
                        ;;
                    esac
                    echo "$line" >> "$GITHUB_ENV"
                  done <<< "$PUBLISH_ENV"

            - name: Apply EAS_EXTRA_ENV
              if: env.HAS_EAS_EXTRA_ENV == 'true'
              uses: rnw-community/mobile-ci/actions/apply-secret-env@v4.3.1 # v4.3.1
              with:
                  env: ${{ secrets.EAS_EXTRA_ENV }}
                  label: EAS_EXTRA_ENV

            - name: Resolve package manager
              id: package-manager
              shell: bash
              env:
                  PACKAGE_MANAGER: ${{ inputs.package-manager }}
                  LOCKFILE_REQUIRED: ''
              run: |
                  set -euo pipefail
                  pm=''
                  case "$PACKAGE_MANAGER" in
                    '') ;;
                    yarn|pnpm|npm) pm="$PACKAGE_MANAGER" ;;
                    *)
                      echo "::error::package-manager must be '' (auto-detect), yarn, pnpm or npm; got '$PACKAGE_MANAGER'."
                      exit 1
                      ;;
                  esac
                  declared=''
                  declared_version=''
                  if { [ -z "$pm" ] || [ "$pm" = pnpm ]; } && [ -f package.json ]; then
                    if command -v jq >/dev/null 2>&1; then
                      declared_spec="$(jq -r '
                        (try (.devEngines.packageManager) catch null) as $raw
                        | (if ($raw | type) == "array" then ($raw[0] // null) else $raw end) as $de
                        | (if ($de | type) == "object" then [($de.name // ""), ($de.version // "")] else ["", ""] end) as $dev
                        | (if ((.packageManager // "") | type) == "string" and (.packageManager // "") != ""
                           then (.packageManager | if test("@") then [split("@")[0], (split("@")[1] | split("+")[0])] else [., ""] end)
                           else ["", ""] end) as $spec
                        | (if $dev[0] != "" then $dev[0] else $spec[0] end) as $name
                        | [$name,
                           (if $dev[0] != "" and $dev[1] != "" then $dev[1]
                            elif $spec[0] == $name then $spec[1]
                            else "" end)]
                        | @tsv' package.json)"
                      declared="$(printf '%s\n' "$declared_spec" | cut -f1)"
                      declared_version="$(printf '%s\n' "$declared_spec" | cut -f2)"
                    else
                      echo "::warning::jq is not installed on this runner, so package.json's packageManager / devEngines.packageManager fields cannot be read; falling back to root lockfile detection. Install jq, or set the package-manager input explicitly."
                    fi
                  fi
                  if [ -z "$pm" ] && [ -n "$declared" ]; then
                    case "$declared" in
                      yarn|pnpm|npm) pm="$declared" ;;
                      *)
                        echo "::error::package.json declares package manager '$declared', which is not yarn, pnpm or npm; set the package-manager input explicitly."
                        exit 1
                        ;;
                    esac
                  fi
                  if [ -z "$pm" ]; then
                    lockfiles=''
                    lockfile_count=0
                    if [ -f yarn.lock ]; then pm=yarn; lockfiles="${lockfiles}yarn.lock "; lockfile_count=$((lockfile_count + 1)); fi
                    if [ -f pnpm-lock.yaml ]; then pm=pnpm; lockfiles="${lockfiles}pnpm-lock.yaml "; lockfile_count=$((lockfile_count + 1)); fi
                    if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
                      pm=npm
                      lockfile_count=$((lockfile_count + 1))
                      if [ -f package-lock.json ]; then lockfiles="${lockfiles}package-lock.json "; fi
                      if [ -f npm-shrinkwrap.json ]; then lockfiles="${lockfiles}npm-shrinkwrap.json "; fi
                    fi
                    if [ "$lockfile_count" -eq 0 ]; then
                      echo "::error::Cannot resolve the package manager: package.json declares none and there is no yarn.lock, pnpm-lock.yaml, package-lock.json or npm-shrinkwrap.json at the repository root. Set the package-manager input explicitly."
                      exit 1
                    fi
                    if [ "$lockfile_count" -gt 1 ]; then
                      echo "::error::Cannot resolve the package manager: multiple root lockfiles found (${lockfiles% }). Set the package-manager input explicitly."
                      exit 1
                    fi
                  fi
                  if [ "$pm" = pnpm ] && { [ "$declared" != pnpm ] || [ -z "$declared_version" ]; }; then
                    echo "::error::Resolved package manager is pnpm, but no pnpm version is readable from the repository-root package.json. pnpm/action-setup takes the version from 'packageManager: pnpm@<version>' or 'devEngines.packageManager: {name: pnpm, version: <range>}' - add one of those, and make sure jq is installed on this runner so the workflow can read it."
                    exit 1
                  fi
                  if [ -n "$LOCKFILE_REQUIRED" ]; then
                    case "$pm" in
                      yarn) wanted='yarn.lock' ;;
                      pnpm) wanted='pnpm-lock.yaml' ;;
                      *) wanted='package-lock.json npm-shrinkwrap.json' ;;
                    esac
                    found=''
                    for candidate in $wanted; do
                      if [ -f "$candidate" ]; then found="$candidate"; break; fi
                    done
                    if [ -z "$found" ]; then
                      echo "::error::Resolved package manager is $pm, but this job caches JS dependencies with actions/setup-node and the repository root has none of: $wanted. Commit the lockfile, or set the package-manager input to the manager whose lockfile this repository actually has."
                      exit 1
                    fi
                  fi
                  echo "Resolved package manager: $pm"
                  echo "pm=$pm" >> "$GITHUB_OUTPUT"

            - name: Setup pnpm
              if: steps.package-manager.outputs.pm == 'pnpm'
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ inputs.node-version }}

            - name: Enable corepack
              if: inputs.enable-corepack && steps.package-manager.outputs.pm != 'pnpm'
              shell: bash
              run: corepack enable

            - name: Install dependencies
              shell: bash
              env:
                  INSTALL_COMMAND: ${{ inputs.install-command }}
              run: eval "$INSTALL_COMMAND"

            - name: Build workspace JS dependencies
              if: inputs.build-command != ''
              shell: bash
              env:
                  BUILD_COMMAND: ${{ inputs.build-command }}
              run: eval "$BUILD_COMMAND"

            - name: Compute the runtime version
              id: fingerprint
              uses: rnw-community/mobile-ci/actions/ota-runtime-version@v4.3.1 # v4.3.1
              with:
                  app-dir: ${{ inputs.app-dir }}
                  platform: android
                  eas-profile: ${{ inputs.build-profile }}

            - name: Compute deterministic build number
              shell: bash
              env:
                  RUN_NUMBER: ${{ github.run_number }}
                  RUN_ATTEMPT: ${{ github.run_attempt }}
              run: echo "DEVELOPMENT_BUILD_NUMBER=${RUN_NUMBER}.${RUN_ATTEMPT}" >> "$GITHUB_ENV"

            - name: Compute release tag
              id: tag
              shell: bash
              env:
                  TAG_PREFIX: ${{ inputs.tag-prefix }}
                  RUN_NUMBER: ${{ github.run_number }}
                  CALL_SCOPE: ${{ inputs.call-scope }}
              run: |
                  set -euo pipefail
                  if [ -n "$CALL_SCOPE" ] && ! [[ "$CALL_SCOPE" =~ ^[A-Za-z0-9._]+(-[A-Za-z0-9._]+)*$ ]]; then
                    echo "::error::call-scope '$CALL_SCOPE' must be letters, digits, '.' and '_', with single '-' only between them, so no two calls' artifacts or release tags can collide."
                    exit 1
                  fi
                  prefix="${TAG_PREFIX}${CALL_SCOPE:+-$CALL_SCOPE}-android-"
                  {
                    echo "tag=${prefix}${RUN_NUMBER}"
                    echo "prefix=$prefix"
                    echo "artifact=android-dev-build${CALL_SCOPE:+-$CALL_SCOPE}"
                  } >> "$GITHUB_OUTPUT"

            - name: Run Android pre-build command
              if: inputs.android-pre-build-command != ''
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  ANDROID_PRE_BUILD_COMMAND: ${{ inputs.android-pre-build-command }}
              run: eval "$ANDROID_PRE_BUILD_COMMAND"

            - name: Fit the native build into the container limits
              id: native-jobs
              if: inputs.build-location == 'local'
              shell: bash
              run: |
                  set -euo pipefail
                  cgroup_root="${CGROUP_ROOT:-/sys/fs/cgroup}"
                  v1_unbounded_bytes=1125899906842624
                  reserve_mib=5120
                  per_job_mib="${NATIVE_COMPILE_MEMORY_PER_JOB:-3584}"
                  memory_bytes=''
                  cpu_quota=''
                  cpu_period=''

                  fail() {
                    echo "::error::$1"
                    exit 1
                  }

                  is_uint() {
                    case "$1" in
                      '' | *[!0-9]*) return 1 ;;
                    esac
                    return 0
                  }

                  if [ -f "$cgroup_root/cgroup.controllers" ]; then
                    if [ -f "$cgroup_root/memory.max" ]; then
                      value="$(cat "$cgroup_root/memory.max")"
                      if [ "$value" != max ]; then
                        is_uint "$value" || fail "Unparseable $cgroup_root/memory.max '$value'; expected a byte count or 'max'. Refusing to compile native code with a parallelism this step cannot bound."
                        memory_bytes="$value"
                      fi
                    fi
                    if [ -f "$cgroup_root/cpu.max" ]; then
                      read -r cpu_quota cpu_period < "$cgroup_root/cpu.max" || true
                      [ "$cpu_quota" = max ] && cpu_quota=''
                    fi
                  else
                    if [ -f "$cgroup_root/memory/memory.limit_in_bytes" ]; then
                      value="$(cat "$cgroup_root/memory/memory.limit_in_bytes")"
                      is_uint "$value" || fail "Unparseable $cgroup_root/memory/memory.limit_in_bytes '$value'; expected a byte count."
                      [ "$value" -lt "$v1_unbounded_bytes" ] && memory_bytes="$value"
                    fi
                    if [ -f "$cgroup_root/cpu/cpu.cfs_quota_us" ]; then
                      cpu_quota="$(cat "$cgroup_root/cpu/cpu.cfs_quota_us")"
                      cpu_period="$(cat "$cgroup_root/cpu/cpu.cfs_period_us" 2>/dev/null || true)"
                      [ "$cpu_quota" = -1 ] && cpu_quota=''
                    fi
                  fi
                  if ! is_uint "$per_job_mib" || [ "$per_job_mib" -lt 1 ]; then
                    fail "native-compile-memory-per-job '$per_job_mib' must be a positive number of MiB."
                  fi
                  if [ -n "$cpu_quota" ] && { ! is_uint "$cpu_quota" || ! is_uint "$cpu_period" || [ "$cpu_period" -eq 0 ]; }; then
                    fail "Unparseable CPU quota '$cpu_quota' / period '$cpu_period' under $cgroup_root. Refusing to compile native code with a parallelism this step cannot bound."
                  fi

                  jobs=''
                  basis=''
                  if [ -n "$cpu_quota" ]; then
                    jobs=$(((cpu_quota + cpu_period - 1) / cpu_period))
                    basis="CPU quota $cpu_quota/$cpu_period"
                  fi
                  if [ -n "$memory_bytes" ]; then
                    memory_mib=$((memory_bytes / 1048576))
                    memory_jobs=$(((memory_mib - reserve_mib) / per_job_mib))
                    [ "$memory_jobs" -lt 1 ] && memory_jobs=1
                    if [ -z "$jobs" ] || [ "$memory_jobs" -lt "$jobs" ]; then
                      jobs="$memory_jobs"
                    fi
                    basis="${basis:+$basis, }memory limit $memory_mib MiB less a $reserve_mib MiB JVM reserve, $per_job_mib MiB per job"
                  fi
                  if [ -n "${NATIVE_COMPILE_JOBS:-}" ]; then
                    if ! is_uint "$NATIVE_COMPILE_JOBS" || [ "$NATIVE_COMPILE_JOBS" -lt 1 ]; then
                      fail "native-compile-jobs '$NATIVE_COMPILE_JOBS' must be a positive integer, or empty to derive it from the runner's cgroup limits."
                    fi
                    jobs="$NATIVE_COMPILE_JOBS"
                    basis='native-compile-jobs input'
                  fi

                  echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
                  if [ -z "$jobs" ]; then
                    echo "No cgroup CPU or memory limit found; native compile parallelism is left to ninja."
                    exit 0
                  fi

                  slots_dir="$RUNNER_TEMP/mobile-ci-compile-slots"
                  launcher="$slots_dir/compile-slot.sh"
                  mkdir -p "$slots_dir"
                  cat > "$launcher" <<'COMPILE_SLOT'
                  #!/bin/sh
                  set -eu
                  slots="${MOBILE_CI_COMPILE_SLOTS:?MOBILE_CI_COMPILE_SLOTS is not set}"
                  dir="${MOBILE_CI_COMPILE_SLOTS_DIR:?MOBILE_CI_COMPILE_SLOTS_DIR is not set}"
                  try_slots() {
                    slot=0
                    while [ "$slot" -lt "$slots" ]; do
                      exec 9> "$dir/slot.$slot"
                      if flock -n 9; then
                        return 0
                      fi
                      exec 9>&-
                      slot=$((slot + 1))
                    done
                    return 1
                  }
                  if ! try_slots; then
                    exec 8> "$dir/gate"
                    flock 8
                    until try_slots; do
                      sleep 0.2
                    done
                    exec 8>&-
                  fi
                  status=0
                  "$@" 9>&- || status=$?
                  exit "$status"
                  COMPILE_SLOT
                  chmod +x "$launcher"

                  jvm_heap_return='-XX:G1PeriodicGCInterval=10000 -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=30'
                  kotlin_daemon_cap='-Dkotlin.daemon.jvm.options=-Xmx1536m'
                  chain_launcher() {
                    case "$1" in
                      "$launcher" | "$launcher;"*) printf '%s' "$1" ;;
                      '') printf '%s' "$launcher" ;;
                      *) printf '%s;%s' "$launcher" "$1" ;;
                    esac
                  }
                  {
                    echo "MOBILE_CI_COMPILE_SLOTS=$jobs"
                    echo "MOBILE_CI_COMPILE_SLOTS_DIR=$slots_dir"
                    echo "CMAKE_C_COMPILER_LAUNCHER=$(chain_launcher "${CMAKE_C_COMPILER_LAUNCHER:-}")"
                    echo "CMAKE_CXX_COMPILER_LAUNCHER=$(chain_launcher "${CMAKE_CXX_COMPILER_LAUNCHER:-}")"
                    case " ${JAVA_TOOL_OPTIONS:-} " in
                      *" $jvm_heap_return "*) ;;
                      *) echo "JAVA_TOOL_OPTIONS=${JAVA_TOOL_OPTIONS:+$JAVA_TOOL_OPTIONS }$jvm_heap_return" ;;
                    esac
                    case "${GRADLE_OPTS:-}" in
                      *kotlin.daemon.jvm.options=* | *kotlin.daemon.jvmargs=*) ;;
                      *) echo "GRADLE_OPTS=${GRADLE_OPTS:+$GRADLE_OPTS }$kotlin_daemon_cap" ;;
                    esac
                  } >> "$GITHUB_ENV"
                  echo "Native compile jobs: $jobs ($basis); every CMake configure in this job runs its compilers through $launcher, and idle JVMs return unused heap ($jvm_heap_return), and Kotlin daemons the project gives no JVM options of its own are capped at $kotlin_daemon_cap."

            - name: EAS build (Android, development)
              id: build
              if: inputs.build-location == 'local'
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  EAS_CLI_VERSION: ${{ inputs.eas-cli-version }}
                  BUILD_PROFILE: ${{ inputs.build-profile }}
                  ANDROID_ARTIFACT_EXTENSION: ${{ inputs.android-artifact-extension }}
              run: |
                  set -euo pipefail
                  case "$ANDROID_ARTIFACT_EXTENSION" in
                    apk|aab) ;;
                    *)
                      echo "::error::android-artifact-extension '$ANDROID_ARTIFACT_EXTENSION' must be 'apk' or 'aab'."
                      exit 1
                      ;;
                  esac
                  output_path="$RUNNER_TEMP/android-dev-release/app.$ANDROID_ARTIFACT_EXTENSION"
                  mkdir -p "$(dirname "$output_path")"
                  npx --yes "eas-cli@${EAS_CLI_VERSION}" build \
                    --platform android \
                    --profile "$BUILD_PROFILE" \
                    --local \
                    --non-interactive \
                    --output "$output_path" 2>&1 | LC_ALL=C sed -E 's#[A-Za-z0-9+/=]{128,}#[REDACTED encoded build payload]#g'
                  test -f "$output_path"
                  echo "artifact-path=$output_path" >> "$GITHUB_OUTPUT"

            - name: EAS cloud build (Android, development)
              id: cloud-build
              if: inputs.build-location == 'cloud'
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  EAS_CLI_VERSION: ${{ inputs.eas-cli-version }}
                  BUILD_PROFILE: ${{ inputs.build-profile }}
                  PLATFORM: android
              run: |
                  set -euo pipefail
                  build_json="$RUNNER_TEMP/${PLATFORM}-dev-release/eas-build.json"
                  mkdir -p "$(dirname "$build_json")"
                  status=0
                  npx --yes "eas-cli@${EAS_CLI_VERSION}" build \
                    --platform "$PLATFORM" \
                    --profile "$BUILD_PROFILE" \
                    --non-interactive \
                    --json \
                    --wait > "$build_json" || status=$?
                  if [ "$status" -ne 0 ]; then
                    cat "$build_json" >&2 || true
                    echo "::error::The EAS cloud build failed (eas build exited $status)."
                    exit "$status"
                  fi
                  echo "build-json=$build_json" >> "$GITHUB_OUTPUT"

            - name: Read embedded build number
              id: embedded
              if: inputs.build-location == 'local'
              shell: bash
              env:
                  ARTIFACT_PATH: ${{ steps.build.outputs.artifact-path }}
              run: |
                  set -euo pipefail
                  build_number=''
                  version=''
                  read_tool=''
                  case "$ARTIFACT_PATH" in
                    *.apk)
                      aapt2_bin=''
                      if command -v aapt2 >/dev/null 2>&1; then
                        aapt2_bin="$(command -v aapt2)"
                      else
                        for sdk in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}"; do
                          [ -n "$sdk" ] || continue
                          newest_build_tools="$(for candidate in "$sdk"/build-tools/*/aapt2; do
                            if [ -x "$candidate" ]; then basename "$(dirname "$candidate")"; fi
                          done | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)"
                          if [ -n "$newest_build_tools" ]; then aapt2_bin="$sdk/build-tools/$newest_build_tools/aapt2"; fi
                          if [ -n "$aapt2_bin" ]; then break; fi
                        done
                      fi
                      if [ -z "$aapt2_bin" ]; then
                        echo "::warning::No aapt2 on PATH or under \$ANDROID_HOME / \$ANDROID_SDK_ROOT build-tools, so the versionCode and versionName '$ARTIFACT_PATH' embeds cannot be read; build-meta.json omits embeddedBuildNumber and embeddedVersion."
                      else
                        if ! badging="$("$aapt2_bin" dump badging "$ARTIFACT_PATH")"; then
                          echo "::error::'$aapt2_bin dump badging' cannot read '$ARTIFACT_PATH'; the EAS build did not produce a readable .apk."
                          exit 1
                        fi
                        read_tool="$aapt2_bin dump badging"
                        package_line="$(printf '%s\n' "$badging" | sed -n '/^package:/{p;q;}')"
                        build_number="$(printf '%s\n' "$package_line" | sed -n "s/.* versionCode='\([^']*\)'.*/\1/p")"
                        version="$(printf '%s\n' "$package_line" | sed -n "s/.* versionName='\([^']*\)'.*/\1/p")"
                      fi
                      ;;
                    *.aab)
                      if command -v bundletool >/dev/null 2>&1; then
                        read_tool='bundletool dump manifest'
                        if ! build_number="$(bundletool dump manifest --bundle "$ARTIFACT_PATH" --xpath /manifest/@android:versionCode)" \
                          || ! version="$(bundletool dump manifest --bundle "$ARTIFACT_PATH" --xpath /manifest/@android:versionName)"; then
                          echo "::error::'bundletool dump manifest' cannot read '$ARTIFACT_PATH'; the EAS build did not produce a readable .aab."
                          exit 1
                        fi
                        build_number="$(printf '%s' "$build_number" | tr -d '\r\n')"
                        version="$(printf '%s' "$version" | tr -d '\r\n')"
                      else
                        echo "::warning::No bundletool on PATH, so the versionCode and versionName '$ARTIFACT_PATH' embeds cannot be read; build-meta.json omits embeddedBuildNumber and embeddedVersion."
                      fi
                      ;;
                    *)
                      echo "::error::Cannot read the build number '$ARTIFACT_PATH' embeds: expected an .apk or .aab."
                      exit 1
                      ;;
                  esac
                  if [ -n "$read_tool" ]; then
                    case "$build_number" in
                      ''|*[!0-9]*)
                        echo "::error::'$read_tool' read no integer versionCode from '$ARTIFACT_PATH' (got '$build_number'); refusing to publish a build whose embedded build number cannot be read."
                        exit 1
                        ;;
                    esac
                    echo "The build embeds versionCode '$build_number' and versionName '$version'."
                  fi
                  echo "embedded-build-number=$build_number" >> "$GITHUB_OUTPUT"
                  echo "embedded-version=$version" >> "$GITHUB_OUTPUT"

            - name: Run Android post-build command
              if: inputs.android-post-build-command != ''
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  ANDROID_POST_BUILD_COMMAND: ${{ inputs.android-post-build-command }}
                  ARTIFACT_PATH: ${{ steps.build.outputs.artifact-path }}
                  EMBEDDED_BUILD_NUMBER: ${{ steps.embedded.outputs.embedded-build-number }}
                  EMBEDDED_VERSION: ${{ steps.embedded.outputs.embedded-version }}
              run: eval "$ANDROID_POST_BUILD_COMMAND"

            - name: Upload Android dev build artifact
              if: inputs.build-location == 'local'
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: ${{ steps.tag.outputs.artifact }}
                  path: ${{ steps.build.outputs.artifact-path }}
                  retention-days: 30

            - name: Distribute through EAS
              id: eas
              if: inputs.distribution == 'eas'
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  EAS_CLI_VERSION: ${{ inputs.eas-cli-version }}
                  PLATFORM: android
                  BUILD_LOCATION: ${{ inputs.build-location }}
                  ARTIFACT_PATH: ${{ steps.build.outputs.artifact-path }}
                  BUILD_JSON: ${{ steps.cloud-build.outputs.build-json }}
              run: |
                  set -euo pipefail
                  work_dir="$RUNNER_TEMP/${PLATFORM}-dev-release"
                  mkdir -p "$work_dir"
                  jq_error="$work_dir/eas-distribution.err"
                  if [ "$BUILD_LOCATION" = local ]; then
                    upload_json="$work_dir/eas-upload.json"
                    npx --yes "eas-cli@${EAS_CLI_VERSION}" upload \
                      --platform "$PLATFORM" \
                      --build-path "$ARTIFACT_PATH" \
                      --non-interactive \
                      --json > "$upload_json"
                    if ! install_url="$(jq -er '.url | strings' "$upload_json" 2> "$jq_error")"; then
                      echo "::error::eas upload exited 0 but printed no build URL: $(head -c 2000 "$upload_json")"
                      exit 1
                    fi
                  else
                    if ! install_url="$(jq -er --arg platform "$PLATFORM" '
                      if type != "array" or length != 1 then error("expected exactly one build from eas build --json, got \(tojson)") else .[0] end
                      | if .status != "FINISHED" then error("EAS build \(.id) ended with status \(.status), not FINISHED") else . end
                      | if .distribution != "INTERNAL" then error("EAS build \(.id) has distribution \(.distribution); testers can install only a build profile with distribution internal") else . end
                      | if ((.artifacts.buildUrl // "") | length) == 0 then error("EAS build \(.id) has no artifacts.buildUrl") else . end
                      | if $platform == "android" and (.artifacts.buildUrl | test("\\.aab($|[?#])")) then error("EAS build \(.id) produced an .aab, which no device can install; set android.buildType apk in the build profile") else . end
                      | "https://expo.dev/accounts/\(.project.ownerAccount.name // error("EAS build \(.id) names no project owner"))/projects/\(.project.slug)/builds/\(.id)"' \
                      "$BUILD_JSON" 2> "$jq_error")"; then
                      echo "::error::$(sed -E 's/^jq: error \(at [^)]*\): //' "$jq_error")"
                      exit 1
                    fi
                  fi
                  build_page_re='^https://expo\.dev/accounts/[^/[:space:]]+/projects/[^/[:space:]]+/builds/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
                  if ! [[ "$install_url" =~ $build_page_re ]]; then
                    echo "::error::'$install_url' is not an EAS build page; refusing to hand testers a link nothing proves installs this build."
                    exit 1
                  fi
                  build_id="${install_url##*/builds/}"
                  echo "EAS internal distribution build $build_id: $install_url"
                  {
                    echo "install-url=$install_url"
                    echo "build-id=$build_id"
                  } >> "$GITHUB_OUTPUT"
                  echo "### Android development build: [install from EAS]($install_url) (build \`$build_id\`)" >> "$GITHUB_STEP_SUMMARY"

            - name: Compute build metadata
              id: meta
              if: inputs.distribution == 'github-release'
              shell: bash
              working-directory: ${{ inputs.app-dir }}
              env:
                  ARTIFACT_PATH: ${{ steps.build.outputs.artifact-path }}
                  PLATFORM: android
                  BUILD_NUMBER: ${{ env.DEVELOPMENT_BUILD_NUMBER }}
                  COMMIT_SHA: ${{ github.sha }}
                  BRANCH_NAME: ${{ github.ref_name }}
                  WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  TAG_NAME: ${{ steps.tag.outputs.tag }}
                  EMBEDDED_BUILD_NUMBER: ${{ steps.embedded.outputs.embedded-build-number }}
                  EMBEDDED_VERSION: ${{ steps.embedded.outputs.embedded-version }}
                  FINGERPRINT: ${{ steps.fingerprint.outputs.android-runtime-version }}
              run: |
                  set -euo pipefail
                  asset_name="$(basename "$ARTIFACT_PATH")"
                  artifact_dir="$(dirname "$ARTIFACT_PATH")"
                  sums_path="$artifact_dir/SHA256SUMS"
                  meta_path="$artifact_dir/build-meta.json"
                  (cd "$artifact_dir" && shasum -a 256 "$asset_name") > "$sums_path"
                  sha256="$(awk '{print $1}' "$sums_path")"
                  version=""
                  if [ -f app.json ]; then
                    version="$(jq -r '.expo.version // empty' app.json)"
                  fi
                  built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  jq -n \
                    --arg platform "$PLATFORM" \
                    --arg version "$version" \
                    --arg buildNumber "$BUILD_NUMBER" \
                    --arg commitSha "$COMMIT_SHA" \
                    --arg branch "$BRANCH_NAME" \
                    --arg builtAt "$built_at" \
                    --arg workflowUrl "$WORKFLOW_URL" \
                    --arg tagName "$TAG_NAME" \
                    --arg assetName "$asset_name" \
                    --arg sha256 "$sha256" \
                    --arg embeddedBuildNumber "${EMBEDDED_BUILD_NUMBER:-}" \
                    --arg embeddedVersion "${EMBEDDED_VERSION:-}" \
                    --arg fingerprint "${FINGERPRINT:-}" \
                    '{platform: $platform}
                     + (if $version == "" then {} else {version: $version} end)
                     + {buildNumber: $buildNumber}
                     + (if $embeddedBuildNumber == "" then {} else {embeddedBuildNumber: $embeddedBuildNumber} end)
                     + (if $embeddedVersion == "" then {} else {embeddedVersion: $embeddedVersion} end)
                     + (if $fingerprint == "" then {} else {fingerprint: $fingerprint} end)
                     + {commitSha: $commitSha, branch: $branch, builtAt: $builtAt, workflowUrl: $workflowUrl, tagName: $tagName, assetName: $assetName, sha256: $sha256}' \
                    > "$meta_path"
                  {
                    echo "meta-path=$meta_path"
                    echo "asset-name=$asset_name"
                    echo "sums-path=$sums_path"
                  } >> "$GITHUB_OUTPUT"

            - name: Create GitHub Release (draft)
              id: release
              if: inputs.distribution == 'github-release'
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ steps.tag.outputs.tag }}
                  ARTIFACT_PATH: ${{ steps.build.outputs.artifact-path }}
                  META_PATH: ${{ steps.meta.outputs.meta-path }}
                  SUMS_PATH: ${{ steps.meta.outputs.sums-path }}
                  BUILD_NUMBER: ${{ env.DEVELOPMENT_BUILD_NUMBER }}
                  FINGERPRINT: ${{ steps.fingerprint.outputs.android-runtime-version }}
              run: |
                  set -euo pipefail
                  notes="Automated development build. Build number: ${BUILD_NUMBER}."
                  if [ -n "${FINGERPRINT:-}" ]; then
                    notes="${notes}

                  Runtime fingerprint: \`${FINGERPRINT}\`
                  <!-- mobile-ci:fingerprint:${FINGERPRINT} -->"
                  fi
                  if existing_notes="$(gh release view "$TAG" --json body --jq .body 2>/dev/null)"; then
                    case "$existing_notes" in
                      *"Build number: ${BUILD_NUMBER}."*)
                        echo "::error::Release $TAG already holds build ${BUILD_NUMBER}, published by another call of native-dev-release in this run attempt. Give each call in one run a distinct call-scope."
                        exit 1
                        ;;
                    esac
                    echo "Updating existing release $TAG in place (job re-run)."
                    gh release edit "$TAG" \
                      --draft \
                      --title "Android dev build ${TAG}" \
                      --notes "$notes"
                    gh release upload "$TAG" "$ARTIFACT_PATH" "$META_PATH" "$SUMS_PATH" --clobber
                  else
                    gh release create "$TAG" \
                      --draft \
                      --title "Android dev build ${TAG}" \
                      --notes "$notes" \
                      "$ARTIFACT_PATH" "$META_PATH" "$SUMS_PATH"
                  fi
                  echo "tag=$TAG" >> "$GITHUB_OUTPUT"

            - name: Publish GitHub Release
              id: publish
              if: inputs.distribution == 'github-release'
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ steps.release.outputs.tag }}
              run: gh release edit "$TAG" --draft=false

            - name: Prune old Android dev releases
              if: inputs.distribution == 'github-release'
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  TAG_PREFIX: ${{ steps.tag.outputs.prefix }}
                  KEEP_RELEASES: ${{ inputs.keep-releases }}
                  CURRENT_TAG: ${{ steps.release.outputs.tag }}
              run: |
                  set -euo pipefail
                  case "$KEEP_RELEASES" in
                    ''|*[!0-9]*|0[0-9]*)
                      echo "::error::keep-releases '$KEEP_RELEASES' must be a non-negative integer without leading zeros."
                      exit 1
                      ;;
                  esac
                  if ! published="$(gh api "repos/$REPOSITORY/releases" --paginate --jq '.[] | select(.draft == false) | [.created_at, .tag_name] | @tsv')"; then
                    echo "::error::Failed to list existing releases via 'gh api' while pruning old dev releases."
                    exit 1
                  fi
                  release_tags="$(printf '%s\n' "$published" \
                    | awk -F '\t' -v prefix="$TAG_PREFIX" -v current="$CURRENT_TAG" 'NF == 2 && index($2, prefix) == 1 && substr($2, length(prefix) + 1) ~ /^[0-9]+$/ && $2 != current' \
                    | sort -r -t "$(printf '\t')" -k1,1 \
                    | cut -f2)"
                  tags=()
                  while IFS= read -r tag; do
                    [ -n "$tag" ] || continue
                    tags+=("$tag")
                  done <<< "$release_tags"
                  total=${#tags[@]}
                  if [ "$total" -le "$KEEP_RELEASES" ]; then
                    echo "Nothing to prune ($total published release(s), keeping $KEEP_RELEASES)."
                    exit 0
                  fi
                  for ((i = KEEP_RELEASES; i < total; i++)); do
                    tag="${tags[$i]}"
                    echo "Pruning release $tag"
                    gh release delete "$tag" --yes --cleanup-tag
                  done

    pr-comment:
        name: Update the pull request's preview comment
        needs: [ios-dev-release, android-dev-release]
        if: >-
            !cancelled() && inputs.pr-comment && github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ${{ fromJSON(inputs.control-runner-labels) }}
        timeout-minutes: 10
        steps:
            - name: Render development build comment sections
              shell: bash
              env:
                  SECTIONS_DIR: ${{ runner.temp }}/preview-comment-sections
                  CALL_SCOPE: ${{ inputs.call-scope }}
                  SERVER_URL: ${{ github.server_url }}
                  REPOSITORY: ${{ github.repository }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  ENABLE_IOS: ${{ inputs.enable-ios }}
                  IOS_RESULT: ${{ needs.ios-dev-release.result }}
                  IOS_TAG: ${{ needs.ios-dev-release.outputs.tag }}
                  IOS_ASSET: ${{ needs.ios-dev-release.outputs.asset-name }}
                  IOS_FINGERPRINT: ${{ needs.ios-dev-release.outputs.fingerprint }}
                  IOS_INSTALL_URL: ${{ needs.ios-dev-release.outputs.install-url }}
                  ENABLE_ANDROID: ${{ inputs.enable-android }}
                  ANDROID_RESULT: ${{ needs.android-dev-release.result }}
                  ANDROID_TAG: ${{ needs.android-dev-release.outputs.tag }}
                  ANDROID_ASSET: ${{ needs.android-dev-release.outputs.asset-name }}
                  ANDROID_FINGERPRINT: ${{ needs.android-dev-release.outputs.fingerprint }}
                  ANDROID_INSTALL_URL: ${{ needs.android-dev-release.outputs.install-url }}
              run: |
                  set -euo pipefail
                  rm -rf "$SECTIONS_DIR"
                  mkdir -p "$SECTIONS_DIR"
                  render() {
                    local platform="$1" label="$2" enabled="$3" result="$4" tag="$5" asset="$6" fingerprint="$7" install_url="$8"
                    [ "$enabled" = 'true' ] || return 0
                    {
                      echo "### ${label}${CALL_SCOPE:+ ($CALL_SCOPE)}: development build"
                      echo
                      if [ "$result" = 'success' ] && [ -n "$install_url" ]; then
                        echo "Commit \`${HEAD_SHA:0:7}\`, runtime fingerprint \`${fingerprint:-unknown}\`."
                        echo
                        echo "[Install from EAS](${install_url})."
                      elif [ "$result" = 'success' ] && [ -n "$tag" ] && [ -n "$asset" ]; then
                        echo "Commit \`${HEAD_SHA:0:7}\`, runtime fingerprint \`${fingerprint:-unknown}\`."
                        echo
                        echo "[${tag}](${SERVER_URL}/${REPOSITORY}/releases/tag/${tag}): install [\`${asset}\`](${SERVER_URL}/${REPOSITORY}/releases/download/${tag}/${asset})."
                      else
                        echo "The ${label} development build of commit \`${HEAD_SHA:0:7}\` did not publish (result: ${result}); see [the run](${RUN_URL})."
                      fi
                    } > "$SECTIONS_DIR/${platform}-dev-build${CALL_SCOPE:+-$CALL_SCOPE}.md"
                  }
                  render ios iOS "$ENABLE_IOS" "$IOS_RESULT" "$IOS_TAG" "$IOS_ASSET" "$IOS_FINGERPRINT" "$IOS_INSTALL_URL"
                  render android Android "$ENABLE_ANDROID" "$ANDROID_RESULT" "$ANDROID_TAG" "$ANDROID_ASSET" "$ANDROID_FINGERPRINT" "$ANDROID_INSTALL_URL"

            - name: Update the sticky preview comment
              if: inputs.enable-ios || inputs.enable-android
              uses: rnw-community/mobile-ci/actions/pr-preview-comment@v4.3.1 # v4.3.1
              with:
                  pr-number: ${{ github.event.pull_request.number }}
                  sections-dir: ${{ runner.temp }}/preview-comment-sections

    status:
        name: Native dev release result
        needs: [ios-dev-release, android-dev-release]
        if: always()
        runs-on: ${{ fromJSON(inputs.control-runner-labels) }}
        permissions: {}
        steps:
            - name: Report
              shell: bash
              env:
                  ENABLE_IOS: ${{ inputs.enable-ios }}
                  ENABLE_ANDROID: ${{ inputs.enable-android }}
                  IOS_RESULT: ${{ needs.ios-dev-release.result }}
                  ANDROID_RESULT: ${{ needs.android-dev-release.result }}
              run: |
                  set -euo pipefail
                  failed=0

                  if [ "$ENABLE_IOS" = "true" ] && [ "$IOS_RESULT" != "success" ]; then
                    echo "iOS dev release failed or did not run."
                    failed=1
                  fi
                  if [ "$ENABLE_ANDROID" = "true" ] && [ "$ANDROID_RESULT" != "success" ]; then
                    echo "Android dev release failed or did not run."
                    failed=1
                  fi

                  if [ "$failed" -ne 0 ]; then
                    exit 1
                  fi
                  echo "Native dev release completed successfully for enabled platforms."
