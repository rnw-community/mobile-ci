name: native-dev-release

on:
    workflow_call:
        inputs:
            enable-ios:
                description: Run the ios-dev-release job.
                type: boolean
                required: false
                default: true
            enable-android:
                description: Run the android-dev-release job.
                type: boolean
                required: false
                default: false
            ios-runner-labels:
                description: JSON array of self-hosted runner labels for the iOS dev-release job.
                type: string
                required: false
                default: '["self-hosted","macOS","ARM64"]'
            android-runner-labels:
                description: >-
                    JSON array of self-hosted runner labels for the Android dev-release job.
                    Defaults to macOS because Google's Android NDK build tooling used by EAS
                    local builds is x86_64-only on Linux.
                type: string
                required: false
                default: '["self-hosted","macOS","ARM64"]'
            app-dir:
                description: App directory containing app.json/eas.json.
                type: string
                required: true
            node-version:
                type: string
                required: false
                default: '22'
            install-command:
                type: string
                required: false
                default: yarn install --immutable
            enable-corepack:
                type: boolean
                required: false
                default: true
            build-command:
                description: Optional workspace JS build command run at repo root before the dev build.
                type: string
                required: false
                default: ''
            eas-cli-version:
                type: string
                required: false
                default: '20.5.1'
            build-profile:
                description: EAS build profile (eas.json build.<profile>) used for both platforms.
                type: string
                required: false
                default: development
            tag-prefix:
                description: >-
                    Release tag prefix. Tags are created as <tag-prefix>-ios-<run_number> and
                    <tag-prefix>-android-<run_number>.
                type: string
                required: false
                default: dev
            keep-releases:
                description: Number of newest published releases (per platform tag) to keep; older ones are pruned.
                type: string
                required: false
                default: '5'
            asc-key-path:
                description: >-
                    Path, relative to app-dir, the optional App Store Connect API key (.p8) is
                    written to and removed from. Only used when the ASC_API_KEY secret is set.
                type: string
                required: false
                default: ./asc-api-key.p8
            build-timeout-minutes:
                type: number
                required: false
                default: 120

        secrets:
            EXPO_TOKEN:
                description: Expo access token, required by both dev-release jobs.
                required: false
            ASC_API_KEY:
                description: >-
                    Optional App Store Connect API key contents (.p8), used by ios-dev-release
                    when the development profile needs automatic device/credential management.
                required: false

concurrency:
    group: native-dev-release-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    ios-dev-release:
        name: iOS development build and release
        if: inputs.enable-ios
        runs-on: ${{ fromJSON(inputs.ios-runner-labels) }}
        timeout-minutes: ${{ inputs.build-timeout-minutes }}
        permissions:
            contents: write
        env:
            EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
            HAS_ASC_KEY: ${{ secrets.ASC_API_KEY != '' }}

        steps:
            - name: Validate required secrets
              shell: bash
              run: |
                  set -euo pipefail
                  if [ -z "${EXPO_TOKEN:-}" ]; then
                    echo "::error::ios-dev-release requires the EXPO_TOKEN secret. Pass it via 'secrets: inherit' or an explicit secrets: block in the caller workflow."
                    exit 1
                  fi

            - name: Checkout repository
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
              with:
                  node-version: ${{ inputs.node-version }}

            - name: Enable corepack
              if: inputs.enable-corepack
              shell: bash
              run: corepack enable

            - name: Install dependencies
              shell: bash
              run: ${{ inputs.install-command }}

            - name: Build workspace JS dependencies
              if: inputs.build-command != ''
              shell: bash
              run: ${{ inputs.build-command }}

            - name: Compute deterministic build number
              shell: bash
              env:
                  RUN_NUMBER: ${{ github.run_number }}
                  RUN_ATTEMPT: ${{ github.run_attempt }}
              run: echo "DEVELOPMENT_BUILD_NUMBER=${RUN_NUMBER}.${RUN_ATTEMPT}" >> "$GITHUB_ENV"

            - name: Write App Store Connect API key
              if: env.HAS_ASC_KEY == 'true'
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
                  ASC_KEY_PATH: ${{ inputs.asc-key-path }}
              run: |
                  set -euo pipefail
                  printf '%s' "$ASC_API_KEY" > "$ASC_KEY_PATH"
                  chmod 600 "$ASC_KEY_PATH"

            - name: EAS build (iOS, development)
              id: build
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  EAS_CLI_VERSION: ${{ inputs.eas-cli-version }}
                  BUILD_PROFILE: ${{ inputs.build-profile }}
              run: |
                  set -euo pipefail
                  before_listing="$RUNNER_TEMP/ios-dev-release-before.txt"
                  find . -maxdepth 1 -type f \( -name '*.ipa' -o -name '*.tar.gz' \) > "$before_listing"
                  npx --yes "eas-cli@${EAS_CLI_VERSION}" build \
                    --platform ios \
                    --profile "$BUILD_PROFILE" \
                    --local \
                    --non-interactive
                  artifact=$(find . -maxdepth 1 -type f \( -name '*.ipa' -o -name '*.tar.gz' \) | grep -vFxf "$before_listing" | head -n1)
                  if [ -z "$artifact" ]; then
                    echo "::error::Could not locate the EAS local build artifact (.ipa or .tar.gz) after build."
                    exit 1
                  fi
                  echo "artifact-path=$(pwd)/${artifact#./}" >> "$GITHUB_OUTPUT"

            - name: Remove App Store Connect API key
              if: always()
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  ASC_KEY_PATH: ${{ inputs.asc-key-path }}
              run: rm -f "$ASC_KEY_PATH"

            - name: Upload iOS dev build artifact
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: ios-dev-build
                  path: ${{ steps.build.outputs.artifact-path }}
                  retention-days: 30

            - name: Create GitHub Release (draft)
              id: release
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ inputs.tag-prefix }}-ios-${{ github.run_number }}
                  ARTIFACT_PATH: ${{ steps.build.outputs.artifact-path }}
                  BUILD_NUMBER: ${{ env.DEVELOPMENT_BUILD_NUMBER }}
              run: |
                  set -euo pipefail
                  gh release create "$TAG" \
                    --draft \
                    --title "iOS dev build ${TAG}" \
                    --notes "Automated development build. Build number: ${BUILD_NUMBER}." \
                    "$ARTIFACT_PATH"
                  echo "tag=$TAG" >> "$GITHUB_OUTPUT"

            - name: Publish GitHub Release
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ steps.release.outputs.tag }}
              run: |
                  set -euo pipefail
                  release_id=$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" --jq .id)
                  gh api --method PATCH "repos/${{ github.repository }}/releases/${release_id}" -f draft=false

            - name: Prune old iOS dev releases
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG_PREFIX: ${{ inputs.tag-prefix }}-ios-
                  KEEP_RELEASES: ${{ inputs.keep-releases }}
              run: |
                  set -euo pipefail
                  mapfile -t tags < <(gh api "repos/${{ github.repository }}/releases" --paginate | \
                    jq -r --arg prefix "$TAG_PREFIX" \
                      '[.[] | select(.draft == false) | select(.tag_name | startswith($prefix))] | sort_by(.created_at) | reverse | .[].tag_name')
                  total=${#tags[@]}
                  if [ "$total" -le "$KEEP_RELEASES" ]; then
                    echo "Nothing to prune ($total published release(s), keeping $KEEP_RELEASES)."
                    exit 0
                  fi
                  for ((i = KEEP_RELEASES; i < total; i++)); do
                    tag="${tags[$i]}"
                    echo "Pruning release $tag"
                    gh release delete "$tag" --yes --cleanup-tag
                  done

    android-dev-release:
        name: Android development build and release
        if: inputs.enable-android
        runs-on: ${{ fromJSON(inputs.android-runner-labels) }}
        timeout-minutes: ${{ inputs.build-timeout-minutes }}
        permissions:
            contents: write
        env:
            EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

        steps:
            - name: Validate required secrets
              shell: bash
              run: |
                  set -euo pipefail
                  if [ -z "${EXPO_TOKEN:-}" ]; then
                    echo "::error::android-dev-release requires the EXPO_TOKEN secret. Pass it via 'secrets: inherit' or an explicit secrets: block in the caller workflow."
                    exit 1
                  fi

            - name: Checkout repository
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
              with:
                  node-version: ${{ inputs.node-version }}

            - name: Enable corepack
              if: inputs.enable-corepack
              shell: bash
              run: corepack enable

            - name: Install dependencies
              shell: bash
              run: ${{ inputs.install-command }}

            - name: Build workspace JS dependencies
              if: inputs.build-command != ''
              shell: bash
              run: ${{ inputs.build-command }}

            - name: Compute deterministic build number
              shell: bash
              env:
                  RUN_NUMBER: ${{ github.run_number }}
                  RUN_ATTEMPT: ${{ github.run_attempt }}
              run: echo "DEVELOPMENT_BUILD_NUMBER=${RUN_NUMBER}.${RUN_ATTEMPT}" >> "$GITHUB_ENV"

            - name: EAS build (Android, development)
              id: build
              working-directory: ${{ inputs.app-dir }}
              shell: bash
              env:
                  EAS_CLI_VERSION: ${{ inputs.eas-cli-version }}
                  BUILD_PROFILE: ${{ inputs.build-profile }}
              run: |
                  set -euo pipefail
                  before_listing="$RUNNER_TEMP/android-dev-release-before.txt"
                  find . -maxdepth 1 -type f \( -name '*.apk' -o -name '*.aab' \) > "$before_listing"
                  npx --yes "eas-cli@${EAS_CLI_VERSION}" build \
                    --platform android \
                    --profile "$BUILD_PROFILE" \
                    --local \
                    --non-interactive
                  artifact=$(find . -maxdepth 1 -type f \( -name '*.apk' -o -name '*.aab' \) | grep -vFxf "$before_listing" | head -n1)
                  if [ -z "$artifact" ]; then
                    echo "::error::Could not locate the EAS local build artifact (.apk or .aab) after build."
                    exit 1
                  fi
                  echo "artifact-path=$(pwd)/${artifact#./}" >> "$GITHUB_OUTPUT"

            - name: Upload Android dev build artifact
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: android-dev-build
                  path: ${{ steps.build.outputs.artifact-path }}
                  retention-days: 30

            - name: Create GitHub Release (draft)
              id: release
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ inputs.tag-prefix }}-android-${{ github.run_number }}
                  ARTIFACT_PATH: ${{ steps.build.outputs.artifact-path }}
                  BUILD_NUMBER: ${{ env.DEVELOPMENT_BUILD_NUMBER }}
              run: |
                  set -euo pipefail
                  gh release create "$TAG" \
                    --draft \
                    --title "Android dev build ${TAG}" \
                    --notes "Automated development build. Build number: ${BUILD_NUMBER}." \
                    "$ARTIFACT_PATH"
                  echo "tag=$TAG" >> "$GITHUB_OUTPUT"

            - name: Publish GitHub Release
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ steps.release.outputs.tag }}
              run: |
                  set -euo pipefail
                  release_id=$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" --jq .id)
                  gh api --method PATCH "repos/${{ github.repository }}/releases/${release_id}" -f draft=false

            - name: Prune old Android dev releases
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG_PREFIX: ${{ inputs.tag-prefix }}-android-
                  KEEP_RELEASES: ${{ inputs.keep-releases }}
              run: |
                  set -euo pipefail
                  mapfile -t tags < <(gh api "repos/${{ github.repository }}/releases" --paginate | \
                    jq -r --arg prefix "$TAG_PREFIX" \
                      '[.[] | select(.draft == false) | select(.tag_name | startswith($prefix))] | sort_by(.created_at) | reverse | .[].tag_name')
                  total=${#tags[@]}
                  if [ "$total" -le "$KEEP_RELEASES" ]; then
                    echo "Nothing to prune ($total published release(s), keeping $KEEP_RELEASES)."
                    exit 0
                  fi
                  for ((i = KEEP_RELEASES; i < total; i++)); do
                    tag="${tags[$i]}"
                    echo "Pruning release $tag"
                    gh release delete "$tag" --yes --cleanup-tag
                  done

    status:
        name: Native dev release result
        needs: [ios-dev-release, android-dev-release]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Report
              shell: bash
              run: |
                  set -euo pipefail
                  failed=0

                  if [ "${{ inputs.enable-ios }}" = "true" ] && [ "${{ needs.ios-dev-release.result }}" != "success" ]; then
                    echo "iOS dev release failed or did not run."
                    failed=1
                  fi
                  if [ "${{ inputs.enable-android }}" = "true" ] && [ "${{ needs.android-dev-release.result }}" != "success" ]; then
                    echo "Android dev release failed or did not run."
                    failed=1
                  fi

                  if [ "$failed" -ne 0 ]; then
                    exit 1
                  fi
                  echo "Native dev release completed successfully for enabled platforms."
