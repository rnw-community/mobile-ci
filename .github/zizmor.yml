# zizmor audit configuration.
#
# Every ignore below is scoped to a specific rule + file, not a blanket
# suppression, and documents why the finding does not apply here. Re-run
# `uvx zizmor --config .github/zizmor.yml .github/workflows actions` after
# touching any of these files to confirm the remaining finding set is still
# limited to what is listed here.

rules:
  # This repo's reusable workflows and composite actions call its OWN
  # composite actions via the full `rnw-community/mobile-ci/actions/<name>
  # @vX.Y.Z` form (a relative `./actions/<name>` reference only resolves
  # against the caller's checkout, not this repo — see
  # CONTRIBUTING.md#self-references). Self-references intentionally pin to
  # the current release tag (e.g. `@v1.3.1`) rather than a commit SHA: the
  # tag is created from the very commit the self-reference update is part
  # of, so SHA-pinning would be chicken-and-egg, and RELEASE.md forbids ever
  # moving a release tag once cut, making the tag effectively as immutable
  # as a SHA for this in-repo, single-release-procedure use. zizmor's
  # `unpinned-uses` rule still treats a tag ref as unpinned under its
  # blanket hash-pin policy, hence the `ref-pin` policy below. See
  # RELEASE.md#self-references for the update-on-every-release procedure.
  #
  # A per-owner/subpath policy rather than a file ignore: zizmor matches
  # local-path ignores by basename only, so ignoring the action.yml that now
  # carries an action->action self-reference would have exempted EVERY
  # composite action in this monorepo from hash-pinning. Scoping the
  # exemption to this repo's own `uses:` prefix keeps every third-party
  # `uses:` in every workflow and action under the blanket hash-pin policy —
  # including the six workflow files that previously needed a whole-file
  # `unpinned-uses` ignore for their self-references.
  unpinned-uses:
    config:
      policies:
        rnw-community/mobile-ci/*: ref-pin

  # Each finding here is this action's OWN script exporting its OWN
  # resolved, action-internal value (a resolved Xcode DEVELOPER_DIR, a Maestro
  # install path, a ccache directory) to $GITHUB_ENV/$GITHUB_PATH — not
  # attacker-controlled content. This is the same idiom
  # actions/setup-node and actions/setup-java use internally; zizmor itself
  # marks every one of these "audit confidence: Low".
  #
  # zizmor's local-path ignore matching is by file basename, not full
  # relative path — every composite action in this monorepo is named
  # action.yml, so this entry is necessarily repo-wide rather than scoped to
  # the five action.yml files that currently trigger it (run-maestro-ios,
  # run-maestro-android, run-maestro-android-redroid, setup-ccache-ios,
  # setup-xcode-pinned). Re-run the command above after adding a new
  # composite action to confirm it does not silently pick up a genuine
  # github-env finding under this same ignore.
  github-env:
    ignore:
      - action.yml
