name: github-release-publish
description: >-
  Publishes a directory to a GitHub Release under a stable tag, flattening
  nested paths to `__`-joined asset names so every file gets an immutable
  download URL. This is the same channel the native development .ipa/.apk uses.
  The release is updated in place: assets are uploaded with `--clobber` and
  manifest files last, and with clean enabled assets absent from the new upload
  are removed only after the manifest switch. Releases sharing a tag prefix are
  pruned to keep the release list small. Fails closed on a missing source
  directory or a flattened-name collision.
inputs:
  source-dir:
    description: Directory whose files are uploaded as release assets.
    required: true
  tag:
    description: Release tag to publish under, e.g. ota-pr-42.
    required: true
  token:
    description: Token with contents:write on the repository.
    required: true
  title:
    description: Release title; defaults to the tag.
    required: false
    default: ''
  prune-prefix:
    description: Delete older releases whose tag starts with this prefix, keeping the most recent prune-keep. Empty disables pruning.
    required: false
    default: ''
  prune-keep:
    description: Number of prefix-matching releases to keep, including the current one.
    required: false
    default: '5'
  clean:
    description: >-
      Delete release assets that are not part of this upload, after the new
      manifest is live. Defaults to false so concurrent publishes for the same
      tag cannot delete each other's assets; enable it when publishes for a tag
      are serialized (expo-ota-preview does, via its concurrency group).
    required: false
    default: 'false'
  prune-grace-minutes:
    description: >-
      Never delete a release updated within this many minutes, so a concurrently
      published preview is not pruned by another run sharing the prune prefix.
    required: false
    default: '10'
  dry-run:
    description: Stage and validate assets without creating, uploading, or pruning.
    required: false
    default: 'false'
outputs:
  tag:
    description: The release tag published under.
    value: ${{ steps.publish.outputs.tag }}
  base-url:
    description: URL prefix for this release's assets, https://github.com/<repo>/releases/download/<tag>.
    value: ${{ steps.publish.outputs.base-url }}
  uploaded:
    description: Number of assets staged for upload.
    value: ${{ steps.publish.outputs.uploaded }}
runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        SOURCE_DIR: ${{ inputs.source-dir }}
        RELEASE_TAG: ${{ inputs.tag }}
        PRUNE_PREFIX: ${{ inputs.prune-prefix }}
        PRUNE_KEEP: ${{ inputs.prune-keep }}
        PRUNE_GRACE_MINUTES: ${{ inputs.prune-grace-minutes }}
      run: |
        set -euo pipefail
        if [ ! -d "$SOURCE_DIR" ]; then
          echo "::error::source-dir '$SOURCE_DIR' does not exist or is not a directory."
          exit 1
        fi
        case "$RELEASE_TAG" in
          ''|*/*)
            echo "::error::tag must be a non-empty release tag without '/'; got '$RELEASE_TAG'."
            exit 1
            ;;
        esac
        case "$PRUNE_PREFIX" in
          ''|*[!A-Za-z0-9._-]*)
            echo "::error::prune-prefix must be empty or only [A-Za-z0-9._-]; got '$PRUNE_PREFIX'."
            exit 1
            ;;
        esac
        case "$PRUNE_KEEP" in
          ''|*[!0-9]*)
            echo "::error::prune-keep must be a non-negative integer; got '$PRUNE_KEEP'."
            exit 1
            ;;
        esac
        case "$PRUNE_GRACE_MINUTES" in
          ''|*[!0-9]*)
            echo "::error::prune-grace-minutes must be a non-negative integer; got '$PRUNE_GRACE_MINUTES'."
            exit 1
            ;;
        esac
        for tool in node gh; do
          if ! command -v "$tool" >/dev/null 2>&1; then
            echo "::error::$tool is required but was not found on PATH."
            exit 1
          fi
        done

    - name: Stage and publish release
      id: publish
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        SOURCE_DIR: ${{ inputs.source-dir }}
        RELEASE_TAG: ${{ inputs.tag }}
        RELEASE_TITLE: ${{ inputs.title }}
        PRUNE_PREFIX: ${{ inputs.prune-prefix }}
        PRUNE_KEEP: ${{ inputs.prune-keep }}
        PRUNE_GRACE_MINUTES: ${{ inputs.prune-grace-minutes }}
        CLEAN: ${{ inputs.clean }}
        DRY_RUN: ${{ inputs.dry-run }}
        REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        source_dir="$(cd "$SOURCE_DIR" && pwd)"
        work="$RUNNER_TEMP/github-release-publish-$$"
        staging="$work/staging"
        assets_file="$work/assets.txt"
        manifests_file="$work/manifests.txt"
        rm -rf "$work"
        mkdir -p "$staging"
        : > "$assets_file"
        : > "$manifests_file"
        uploaded=0
        while IFS= read -r -d '' file; do
          relative="${file#"$source_dir"/}"
          asset_name="${relative//\//__}"
          case "$asset_name" in
            *$'\n'*|*$'\r'*)
              echo "::error::source file '$relative' contains a newline or carriage return, which cannot be a release asset name."
              exit 1
              ;;
          esac
          if [ -e "$staging/$asset_name" ]; then
            echo "::error::Flattened asset name collision at '$asset_name' (from '$relative'). Rename the source files."
            exit 1
          fi
          cp "$file" "$staging/$asset_name"
          if [ "${file##*/}" = 'manifest.json' ]; then
            printf '%s\0' "$asset_name" >> "$manifests_file"
          else
            printf '%s\0' "$asset_name" >> "$assets_file"
          fi
          uploaded=$((uploaded + 1))
        done < <(find "$source_dir" -type f -print0)
        if [ "$uploaded" -eq 0 ]; then
          echo "::error::source-dir '$SOURCE_DIR' contains no files."
          exit 1
        fi
        upload_assets() {
          [ -s "$assets_file" ] || return 0
          local filtered="$work/assets-to-upload.txt"
          : > "$filtered"
          while IFS= read -r -d '' name; do
            if ! printf '%s\n' "$existing_assets" | grep -qxF "$name"; then
              printf '%s\0' "$name" >> "$filtered"
            fi
          done < "$assets_file"
          [ -s "$filtered" ] || return 0
          while IFS= read -r -d '' name; do printf '%s\0' "$staging/$name"; done < "$filtered" | xargs -0 gh release upload "$RELEASE_TAG"
        }
        upload_manifests() {
          [ -s "$manifests_file" ] || return 0
          while IFS= read -r -d '' name; do printf '%s\0' "$staging/$name"; done < "$manifests_file" | xargs -0 gh release upload "$RELEASE_TAG" --clobber
        }
        base_url="https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}"
        if [ "$DRY_RUN" != 'true' ]; then
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            title="${RELEASE_TITLE:-$RELEASE_TAG}"
            if ! gh release create "$RELEASE_TAG" --title "$title" --notes "Expo OTA preview ${RELEASE_TAG}"; then
              if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                echo "::error::Failed to create release '$RELEASE_TAG' and it does not exist."
                exit 1
              fi
              echo "::warning::Release '$RELEASE_TAG' was created concurrently; continuing."
            fi
          fi
          existing_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          upload_assets
          upload_manifests
          if [ "$CLEAN" = 'true' ]; then
            current_assets="$(cat "$assets_file" "$manifests_file" | tr '\0' '\n' | sort)"
            while IFS= read -r existing; do
              [ -n "$existing" ] || continue
              if ! printf '%s\n' "$current_assets" | grep -qxF "$existing"; then
                gh release delete-asset "$RELEASE_TAG" "$existing" --yes
              fi
            done <<< "$existing_assets"
          fi
          if [ -n "$PRUNE_PREFIX" ]; then
            releases_json="$(gh api "repos/${REPOSITORY}/releases?per_page=100")"
            stale_releases="$(printf '%s' "$releases_json" | node -e '
              const fs = require("fs");
              const prefix = process.argv[1];
              const keep = Number.parseInt(process.argv[2], 10);
              const graceMinutes = Number.parseInt(process.argv[3], 10);
              const cutoff = Date.now() - graceMinutes * 60000;
              const releases = JSON.parse(fs.readFileSync(0, "utf8"));
              process.stdout.write(
                releases
                  .filter(release => release.tag_name.startsWith(prefix))
                  .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at))
                  .slice(keep)
                  .filter(release => new Date(release.updated_at).getTime() < cutoff)
                  .map(release => release.tag_name)
                  .join("\n"),
              );
            ' "$PRUNE_PREFIX" "$PRUNE_KEEP" "$PRUNE_GRACE_MINUTES")"
            while IFS= read -r stale; do
              [ -n "$stale" ] || continue
              [ "$stale" = "$RELEASE_TAG" ] && continue
              gh release delete "$stale" --yes --cleanup-tag
            done <<< "$stale_releases"
          fi
        fi
        {
          echo "tag=$RELEASE_TAG"
          echo "base-url=$base_url"
          echo "uploaded=$uploaded"
        } >> "$GITHUB_OUTPUT"
        echo "Staged $uploaded asset(s) for '$RELEASE_TAG' at $base_url (dry-run=$DRY_RUN)"
