name: github-release-publish
description: >-
  Publishes a directory to a GitHub Release under a tag, flattening nested paths
  to `__`-joined asset names so every file gets an immutable download URL. This
  is the same channel the native development .ipa/.apk uses. The release is
  created as a draft with all assets, and is only flipped to published once
  every expected asset is confirmed uploaded, which is required on
  repositories with immutable releases (a published release cannot accept new
  or replacement assets) and on repositories that restrict tag creation/re-
  creation (a deleted tag cannot be recreated, so publishes must use a fresh
  tag). An existing tag is reconciled rather than skipped: missing or
  partially-uploaded assets are (re)uploaded and the release is published only
  once complete, so a run cancelled mid-upload never leaves a published-but-
  incomplete release, and the next run for the same tag can resume it. Zero-
  byte files are skipped because GitHub Releases cannot store them. Releases
  sharing a tag prefix are pruned to keep the release list small. Fails closed
  on a missing source directory or a flattened-name collision.
inputs:
  source-dir:
    description: Directory whose files are uploaded as release assets.
    required: true
  tag:
    description: >-
      Release tag to publish under, e.g. ota-pr-42. Use a fresh tag per publish
      when the repository restricts tag creation, since a deleted tag cannot be
      recreated; an existing tag's release is reconciled (missing or partial
      assets are (re)uploaded) rather than skipped.
    required: true
  token:
    description: Token with contents:write on the repository.
    required: true
  title:
    description: Release title; defaults to the tag.
    required: false
    default: ''
  prune-prefix:
    description: Delete older releases whose tag starts with this prefix, keeping the most recent prune-keep. Empty disables pruning.
    required: false
    default: ''
  prune-keep:
    description: Number of prefix-matching releases to keep, including the current one.
    required: false
    default: '5'
  clean:
    description: >-
      Retained for compatibility and has no effect: an existing tag's release
      is reconciled against exactly the staged assets, so stale partial
      uploads never persist.
    required: false
    default: 'false'
  prune-grace-minutes:
    description: >-
      Never delete a release updated within this many minutes, so a concurrently
      published preview is not pruned by another run sharing the prune prefix.
    required: false
    default: '10'
  dry-run:
    description: Stage and validate assets without creating, uploading, or pruning.
    required: false
    default: 'false'
outputs:
  tag:
    description: The release tag published under.
    value: ${{ steps.publish.outputs.tag }}
  base-url:
    description: URL prefix for this release's assets, https://github.com/<repo>/releases/download/<tag>.
    value: ${{ steps.publish.outputs.base-url }}
  uploaded:
    description: Number of assets staged for upload.
    value: ${{ steps.publish.outputs.uploaded }}
runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        SOURCE_DIR: ${{ inputs.source-dir }}
        RELEASE_TAG: ${{ inputs.tag }}
        PRUNE_PREFIX: ${{ inputs.prune-prefix }}
        PRUNE_KEEP: ${{ inputs.prune-keep }}
        PRUNE_GRACE_MINUTES: ${{ inputs.prune-grace-minutes }}
      run: |
        set -euo pipefail
        if [ ! -d "$SOURCE_DIR" ]; then
          echo "::error::source-dir '$SOURCE_DIR' does not exist or is not a directory."
          exit 1
        fi
        case "$RELEASE_TAG" in
          ''|*/*)
            echo "::error::tag must be a non-empty release tag without '/'; got '$RELEASE_TAG'."
            exit 1
            ;;
        esac
        case "$PRUNE_PREFIX" in
          ''|*[!A-Za-z0-9._-]*)
            echo "::error::prune-prefix must be empty or only [A-Za-z0-9._-]; got '$PRUNE_PREFIX'."
            exit 1
            ;;
        esac
        case "$PRUNE_KEEP" in
          ''|*[!0-9]*)
            echo "::error::prune-keep must be a non-negative integer; got '$PRUNE_KEEP'."
            exit 1
            ;;
        esac
        case "$PRUNE_GRACE_MINUTES" in
          ''|*[!0-9]*)
            echo "::error::prune-grace-minutes must be a non-negative integer; got '$PRUNE_GRACE_MINUTES'."
            exit 1
            ;;
        esac
        for tool in node gh; do
          if ! command -v "$tool" >/dev/null 2>&1; then
            echo "::error::$tool is required but was not found on PATH."
            exit 1
          fi
        done

    - name: Stage and publish release
      id: publish
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        SOURCE_DIR: ${{ inputs.source-dir }}
        RELEASE_TAG: ${{ inputs.tag }}
        RELEASE_TITLE: ${{ inputs.title }}
        PRUNE_PREFIX: ${{ inputs.prune-prefix }}
        PRUNE_KEEP: ${{ inputs.prune-keep }}
        PRUNE_GRACE_MINUTES: ${{ inputs.prune-grace-minutes }}
        DRY_RUN: ${{ inputs.dry-run }}
        REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        source_dir="$(cd "$SOURCE_DIR" && pwd)"
        work="$RUNNER_TEMP/github-release-publish-$$"
        staging="$work/staging"
        assets_file="$work/assets.txt"
        manifests_file="$work/manifests.txt"
        rm -rf "$work"
        mkdir -p "$staging"
        : > "$assets_file"
        : > "$manifests_file"
        uploaded=0
        while IFS= read -r -d '' file; do
          relative="${file#"$source_dir"/}"
          if [ ! -s "$file" ]; then
            echo "::notice::Skipping empty file '$relative'; GitHub Releases cannot store 0-byte assets."
            continue
          fi
          asset_name="${relative//\//__}"
          case "$asset_name" in
            .*) asset_name="_${asset_name}" ;;
          esac
          case "$asset_name" in
            *$'\n'*|*$'\r'*|*'#'*)
              echo "::error::source file '$relative' contains a newline, carriage return, or '#', which cannot be a release asset name."
              exit 1
              ;;
          esac
          if [ -e "$staging/$asset_name" ]; then
            echo "::error::Flattened asset name collision at '$asset_name' (from '$relative'). Rename the source files."
            exit 1
          fi
          cp "$file" "$staging/$asset_name"
          if [ "${file##*/}" = 'manifest.json' ]; then
            printf '%s\0' "$asset_name" >> "$manifests_file"
          else
            printf '%s\0' "$asset_name" >> "$assets_file"
          fi
          uploaded=$((uploaded + 1))
        done < <(find "$source_dir" -type f -print0)
        if [ "$uploaded" -eq 0 ]; then
          echo "::error::source-dir '$SOURCE_DIR' contains no files."
          exit 1
        fi
        base_url="https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}"
        if [ "$DRY_RUN" != 'true' ]; then
          release_paths=()
          while IFS= read -r -d '' name; do release_paths+=("$staging/$name"); done < "$assets_file"
          while IFS= read -r -d '' name; do release_paths+=("$staging/$name"); done < "$manifests_file"
          if [ "${#release_paths[@]}" -eq 0 ]; then
            echo "::error::No assets staged to publish for '$RELEASE_TAG'."
            exit 1
          fi
          title="${RELEASE_TITLE:-$RELEASE_TAG}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release '$RELEASE_TAG' already exists; reconciling its assets before reporting success."
          else
            echo "Creating draft release '$RELEASE_TAG' with ${#release_paths[@]} asset(s)."
            create_output=''
            if ! create_output="$(gh release create "$RELEASE_TAG" --draft --title "$title" --notes "Expo OTA preview ${RELEASE_TAG}" "${release_paths[@]}" 2>&1)"; then
              if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                echo "::error::Failed to create release '$RELEASE_TAG' with ${#release_paths[@]} asset(s): ${create_output}"
                exit 1
              fi
              echo "::warning::Release '$RELEASE_TAG' exists after a failed create; reconciling its assets: ${create_output}"
            fi
          fi

          # A prior run may have been cancelled between creating the draft
          # and flipping it to published, or between attaching some assets
          # and attaching the rest, leaving a draft or (per gh's own
          # internal draft-upload-publish sequence racing a SIGKILL) even a
          # published release short of assets. Reconcile by state rather
          # than short-circuiting on "tag exists": delete+re-upload any
          # asset stuck mid-upload, then upload whatever is missing outright.
          # This step never runs against a published release directly -
          # uploads only ever target the pre-publish draft state, so
          # immutable-release repositories never see a mutation attempt on
          # a published release.
          existing_assets_uploaded="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | select(.state == "uploaded") | .name' | sort)"
          existing_assets_partial="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | select(.state != "uploaded") | .name')"
          existing_release_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
          reconcile_output=''
          reconcile_failed=0
          if ! reconcile_output="$({
            while IFS= read -r partial_name; do
              [ -n "$partial_name" ] || continue
              echo "Asset '$partial_name' on release '$RELEASE_TAG' is stuck in a non-uploaded state; deleting it for re-upload."
              gh release delete-asset "$RELEASE_TAG" "$partial_name" --yes
            done <<< "$existing_assets_partial"

            missing_paths=()
            while IFS= read -r -d '' expected; do
              if ! printf '%s\n' "$existing_assets_uploaded" | grep -qxF "$expected"; then
                missing_paths+=("$staging/$expected")
              fi
            done < <(cat "$assets_file" "$manifests_file")
            if [ "${#missing_paths[@]}" -gt 0 ]; then
              echo "Uploading ${#missing_paths[@]} missing/re-uploaded asset(s) to release '$RELEASE_TAG'."
              gh release upload "$RELEASE_TAG" "${missing_paths[@]}"
            fi
          } 2>&1)"; then
            reconcile_failed=1
          fi
          printf '%s\n' "$reconcile_output"
          if [ "$reconcile_failed" -ne 0 ]; then
            if [ "$existing_release_draft" = 'false' ]; then
              echo "::error::Release '$RELEASE_TAG' is already published and incomplete, and its assets could not be reconciled (likely an immutable-release repository rejecting the mutation): ${reconcile_output}. Delete the release/tag and re-run to publish a clean one."
            else
              echo "::error::Failed to reconcile assets on release '$RELEASE_TAG': ${reconcile_output}"
            fi
            exit 1
          fi

          release_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | select(.state == "uploaded") | .name' | sort)"
          missing_assets=''
          while IFS= read -r -d '' expected; do
            if ! printf '%s\n' "$release_assets" | grep -qxF "$expected"; then
              missing_assets="${missing_assets} ${expected}"
            fi
          done < <(cat "$assets_file" "$manifests_file")
          if [ -n "$missing_assets" ]; then
            echo "::error::Release '$RELEASE_TAG' is still missing asset(s) after reconciliation (missing=${missing_assets# }); leaving it unpublished so the next run can resume."
            exit 1
          fi

          # Only flip to published once every expected asset is confirmed
          # uploaded, so a cancellation anywhere above this line never
          # leaves a published-but-incomplete release for the next run to
          # inherit.
          release_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
          if [ "$release_draft" = 'true' ]; then
            gh release edit "$RELEASE_TAG" --draft=false
            release_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
          fi
          if [ "$release_draft" != 'false' ]; then
            echo "::error::Release '$RELEASE_TAG' could not be published (draft=$release_draft); refusing to report success."
            exit 1
          fi
          echo "::notice::Release '$RELEASE_TAG' is published with all ${#release_paths[@]} asset(s)."
          if [ -n "$PRUNE_PREFIX" ]; then
            if ! prune_output="$({
              if ! releases_json="$(gh api --paginate --jq '.[] | {tagName: .tag_name, updatedAt: .updated_at}' "repos/${REPOSITORY}/releases")"; then
                echo "Failed to list releases for pruning."
                exit 1
              fi
              grace_cutoff_epoch="$(node -e 'process.stdout.write(String(Math.floor((Date.now() - Number(process.argv[1]) * 60000) / 1000)))' "$PRUNE_GRACE_MINUTES")"
              if ! stale_releases="$(printf '%s' "$releases_json" | node -e '
                const fs = require("fs");
                const prefix = process.argv[1];
                const keep = Number.parseInt(process.argv[2], 10);
                const graceMinutes = Number.parseInt(process.argv[3], 10);
                const cutoff = Date.now() - graceMinutes * 60000;
                const releases = fs
                  .readFileSync(0, "utf8")
                  .split("\n")
                  .filter(Boolean)
                  .map(line => JSON.parse(line));
                process.stdout.write(
                  releases
                    .filter(release => release.tagName.startsWith(prefix))
                    .sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt))
                    .slice(keep)
                    .filter(release => new Date(release.updatedAt).getTime() < cutoff)
                    .map(release => release.tagName)
                    .join("\n"),
                );
              ' "$PRUNE_PREFIX" "$PRUNE_KEEP" "$PRUNE_GRACE_MINUTES")"; then
                echo "Failed to compute stale releases."
                exit 1
              fi
              prune_failed=0
              while IFS= read -r stale; do
                [ -n "$stale" ] || continue
                [ "$stale" = "$RELEASE_TAG" ] && continue
                stale_updated="$(gh api "repos/${REPOSITORY}/releases/tags/${stale}" --jq '.updated_at' 2>/dev/null || true)"
                if [ -z "$stale_updated" ]; then
                  echo "Could not re-read release '$stale'; skipping deletion."
                  prune_failed=1
                  continue
                fi
                stale_epoch="$(node -e 'process.stdout.write(String(Math.floor(new Date(process.argv[1]).getTime() / 1000)))' "$stale_updated")"
                if [ "$stale_epoch" -ge "$grace_cutoff_epoch" ]; then
                  echo "Skipping '$stale': updated within the prune grace window."
                  continue
                fi
                if gh release delete "$stale" --yes --cleanup-tag || gh release delete "$stale" --yes; then
                  echo "Pruned '$stale'."
                else
                  echo "Could not prune release '$stale'; leaving it."
                  prune_failed=1
                fi
              done <<< "$stale_releases"
              if [ "$prune_failed" -ne 0 ]; then
                exit 1
              fi
            } 2>&1)"; then
              echo "::warning::Release pruning failed; stale previews will be retried on the next publish: ${prune_output}"
            else
              printf '%s\n' "$prune_output"
              echo "::notice::Release pruning complete."
            fi
          fi
        fi
        echo "::notice::Publish step complete for '$RELEASE_TAG'."
        {
          echo "tag=$RELEASE_TAG"
          echo "base-url=$base_url"
          echo "uploaded=$uploaded"
        } >> "$GITHUB_OUTPUT"
        echo "Staged $uploaded asset(s) for '$RELEASE_TAG' at $base_url (dry-run=$DRY_RUN)"
