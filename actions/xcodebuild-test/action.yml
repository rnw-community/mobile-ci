name: xcodebuild-test
description: >-
  Compiles a scheme's tests once with `build-for-testing`, then runs them with
  `test-without-building` against an already-booted simulator, optionally
  sharded across jobs, uploading the .xcresult bundle and publishing a
  pass/fail step summary. Zero tests executed fails the job.
inputs:
  mode:
    description: >-
      `build` compiles the tests and stops. `test` runs an already-compiled
      test bundle. `build-and-test` (default) does both in one job. Split the
      two so N shard jobs share one compile through a restored DerivedData
      cache.
    required: false
    default: build-and-test
  project:
    description: Path to the .xcodeproj. Exactly one of project/workspace is required.
    required: false
    default: ''
  workspace:
    description: Path to the .xcworkspace. Exactly one of project/workspace is required.
    required: false
    default: ''
  scheme:
    description: Scheme to build and test.
    required: true
  configuration:
    description: Build configuration.
    required: false
    default: Debug
  sdk:
    description: SDK passed to xcodebuild.
    required: false
    default: iphonesimulator
  destination-id:
    description: >-
      UDID of an already-booted simulator, e.g. simulator-lease's udid output,
      used as `platform=iOS Simulator,id=<udid>`. Required unless mode is
      `build`, which targets `generic/platform=iOS Simulator` when it is empty.
    required: false
    default: ''
  test-plan:
    description: Optional test plan name passed as -testPlan.
    required: false
    default: ''
  only-testing:
    description: >-
      Optional newline- or space-separated test identifiers (target,
      target/Class, target/Class/method). When set, this is the list that gets
      sharded instead of the test targets discovered from the .xctestrun.
    required: false
    default: ''
  shard-index:
    description: Zero-based index of this shard.
    required: false
    default: '0'
  shard-count:
    description: Total number of shards. 1 disables sharding entirely.
    required: false
    default: '1'
  result-bundle-path:
    description: Path of the .xcresult bundle produced by the test run.
    required: false
    default: build/TestResults.xcresult
  xcodebuild-args:
    description: >-
      Extra xcodebuild arguments, e.g. xcode-cache's xcodebuild-args output.
      Shell-word-split, so no argument may contain whitespace.
    required: false
    default: ''
  working-directory:
    description: Directory the project/workspace and result bundle resolve against.
    required: false
    default: .
  parallel-testing:
    description: >-
      Value for -parallel-testing-enabled. 'NO' (the default) runs every test
      on the destination simulator itself. 'YES' makes Xcode boot
      `Clone 1 of <destination>` and run the tests there, so the job pays a
      second simulator's memory; it is refused unless
      parallel-testing-worker-count says how many workers that buys.
    required: false
    default: 'NO'
  parallel-testing-worker-count:
    description: >-
      Value for -parallel-testing-worker-count, applied to the test run only.
      Each worker is a clone of the leased simulator, so N workers cost N times
      its memory, and a clone boots stock unless slim-workers slims it. Empty
      lets Xcode choose, which is why parallel-testing 'YES' requires it.
    required: false
    default: ''
  slim-workers:
    description: >-
      Whether to run `simslim watch --profile <slim-profile>` for the length of
      the test run, so every parallel-testing worker clone is slimmed no-reboot
      as it boots instead of running stock. `auto` (the default) does so when
      parallel-testing is 'YES' and slim-profile is set, and only warns if the
      watch fails to start or dies early, because stock workers still run the
      tests correctly. `true` requires both and fails the job if the watch
      fails or slims no clone in a green run. `false` never watches.
    required: false
    default: auto
  slim-profile:
    description: >-
      simslim profile the worker clones are slimmed with; pass the lease's own
      (simulator-lease slim-profile), since the watch also re-applies it to the
      already-slim lease. `bundled` resolves to this release's
      `profiles/ci.json`, any other value is a path relative to the
      repository root. Empty (the default) leaves the workers stock.
    required: false
    default: ''
  simslim-version:
    description: >-
      Pinned simslim CLI version (plain X.Y.Z), installed only when the watch
      runs. Same contract and default as simulator-lease's input: a `simslim`
      already on PATH reporting exactly this version is reused, otherwise the
      `simslim-v<version>-macos-arm64.tar.gz` release asset is downloaded,
      checked against simslim-sha256 and extracted into a job-private directory.
    required: false
    default: '0.12.2'
  simslim-sha256:
    description: >-
      SHA-256 digest of the `simslim-v<simslim-version>-macos-arm64.tar.gz`
      release asset. Empty refuses to download. Bump it together with
      simslim-version.
    required: false
    default: 'b47302da6fb83b8b4c21f4fdd61507469770c07b0ff07fd1f48207bda4270887'
  screen-capture:
    description: >-
      Screen-capture format for the UI tests, written into the generated
      `.xctestrun` before the run: `screenshots` (the default) or
      `screenRecording`. Xcode 26 records a *video* of every UI test, which
      costs `VTEncoderXPCService` roughly 1 GB of RSS and a full core — on a
      4 CPU / 7 GiB CI guest whose free memory never left ~50 MB that is the
      single largest consumer in the run (measured in #147). Screenshots keep
      the same failure evidence for a fraction of it. Applied by rewriting
      every `PreferredScreenCaptureFormat` in the `.xctestrun`, so it needs
      `-derivedDataPath` in xcodebuild-args to find it; without one the
      scheme's own setting is left alone and a warning is logged.
    required: false
    default: screenshots
  artifact-name:
    description: Name of the uploaded .xcresult artifact.
    required: false
    default: ''
  retention-days:
    description: Retention for the uploaded .xcresult artifact.
    required: false
    default: '7'
outputs:
  result-bundle-path:
    description: Path of the .xcresult bundle.
    value: ${{ steps.test.outputs.result-bundle-path }}
  tests-total:
    description: Total number of tests the run executed.
    value: ${{ steps.summary.outputs.tests-total }}
  tests-failed:
    description: Number of failed tests.
    value: ${{ steps.summary.outputs.tests-failed }}
  slimmed-workers:
    description: >-
      Number of parallel-testing worker clones simslim watch slimmed, empty
      when no watch ran.
    value: ${{ steps.stop-watch.outputs.slimmed-workers }}
runs:
  using: composite
  steps:
    - name: Compose the xcodebuild arguments
      id: compose
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        PROJECT: ${{ inputs.project }}
        WORKSPACE: ${{ inputs.workspace }}
        SCHEME: ${{ inputs.scheme }}
        CONFIGURATION: ${{ inputs.configuration }}
        SDK: ${{ inputs.sdk }}
        DESTINATION_ID: ${{ inputs.destination-id }}
        TEST_PLAN: ${{ inputs.test-plan }}
        XCODEBUILD_ARGS: ${{ inputs.xcodebuild-args }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        cd "$WORKING_DIRECTORY"
        if [ -n "$PROJECT" ] && [ -n "$WORKSPACE" ]; then
          echo '::error::Set exactly one of project/workspace, not both.'
          exit 1
        fi
        if [ -z "$PROJECT" ] && [ -z "$WORKSPACE" ]; then
          echo '::error::Set exactly one of project/workspace.'
          exit 1
        fi
        case "$MODE" in
          build|test|build-and-test) ;;
          *) echo "::error::mode must be 'build', 'test' or 'build-and-test' (got '$MODE')."; exit 1 ;;
        esac
        if [ -n "$DESTINATION_ID" ]; then
          if ! printf '%s' "$DESTINATION_ID" | grep -qE '^[0-9A-Fa-f]{8}(-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}$'; then
            echo "::error::destination-id must be a simulator UDID (got '$DESTINATION_ID')."
            exit 1
          fi
          destination="platform=iOS Simulator,id=$DESTINATION_ID"
        elif [ "$MODE" = 'build' ]; then
          destination='generic/platform=iOS Simulator'
        else
          echo "::error::destination-id is required for mode '$MODE'; only mode 'build' can target a generic simulator."
          exit 1
        fi

        args=()
        if [ -n "$PROJECT" ]; then
          test -e "$PROJECT" || { echo "::error::No project at '$PROJECT'."; exit 1; }
          args+=(-project "$PROJECT")
          container="$PROJECT"
        else
          test -e "$WORKSPACE" || { echo "::error::No workspace at '$WORKSPACE'."; exit 1; }
          args+=(-workspace "$WORKSPACE")
          container="$WORKSPACE"
        fi
        args+=(-scheme "$SCHEME" -configuration "$CONFIGURATION" -sdk "$SDK")
        args+=(-destination "$destination")
        args+=(-skipMacroValidation -skipPackagePluginValidation)
        if [ -n "$TEST_PLAN" ]; then
          args+=(-testPlan "$TEST_PLAN")
        fi

        resolved_lockfile=''
        for candidate in \
          'Package.resolved' \
          "$container/project.xcworkspace/xcshareddata/swiftpm/Package.resolved" \
          "$container/xcshareddata/swiftpm/Package.resolved"; do
          if [ -f "$candidate" ]; then
            resolved_lockfile="$candidate"
            break
          fi
        done
        if [ -n "$resolved_lockfile" ]; then
          echo "Package.resolved found at '$resolved_lockfile'; disabling automatic package resolution."
          args+=(-disableAutomaticPackageResolution)
        else
          echo '::notice::No Package.resolved found; leaving automatic package resolution enabled.'
        fi

        # shellcheck disable=SC2086
        for word in $XCODEBUILD_ARGS; do
          args+=("$word")
        done

        {
          printf 'common-args<<XCODEBUILD_ARGS_EOF\n'
          printf '%s\n' "${args[@]}"
          printf 'XCODEBUILD_ARGS_EOF\n'
        } >> "$GITHUB_OUTPUT"

    - name: Build the scheme for testing
      if: inputs.mode != 'test'
      shell: bash
      env:
        COMMON_ARGS: ${{ steps.compose.outputs.common-args }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        cd "$WORKING_DIRECTORY"
        args=()
        while IFS= read -r argument; do
          [ -n "$argument" ] || continue
          args+=("$argument")
        done <<< "$COMMON_ARGS"
        printf 'xcodebuild'
        printf ' %q' "${args[@]}" build-for-testing
        printf '\n'
        xcodebuild "${args[@]}" build-for-testing

    - name: Locate the .xctestrun and set its screen-capture format
      id: xctestrun
      shell: bash
      env:
        SCREEN_CAPTURE: ${{ inputs.screen-capture }}
        SCHEME: ${{ inputs.scheme }}
        XCODEBUILD_ARGS: ${{ inputs.xcodebuild-args }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        cd "$WORKING_DIRECTORY"
        case "$SCREEN_CAPTURE" in
          screenshots|screenRecording) ;;
          *) echo "::error::screen-capture must be 'screenshots' or 'screenRecording' (got '$SCREEN_CAPTURE')."; exit 1 ;;
        esac

        # One step decides which .xctestrun describes this run, and both the
        # screen-capture rewrite below and the sharding step read the answer
        # from here. When the answer is unusable the *reason* travels with it,
        # so sharding can still fail closed with the message it always had
        # while a capture rewrite only warns: sharding cannot proceed without
        # the file, capture can.
        derived_data=''
        previous=''
        # shellcheck disable=SC2086
        for word in $XCODEBUILD_ARGS; do
          if [ "$previous" = '-derivedDataPath' ]; then
            derived_data="$word"
            break
          fi
          previous="$word"
        done

        xctestruns=()
        problem=''
        if [ -z "$derived_data" ]; then
          problem='Sharding needs -derivedDataPath in xcodebuild-args (xcode-cache supplies it) so the .xctestrun can be found; pass only-testing instead if you do not cache DerivedData.'
        else
          while IFS= read -r candidate; do
            [ -n "$candidate" ] || continue
            xctestruns+=("$candidate")
          done < <(find "$derived_data/Build/Products" -maxdepth 1 -type f \
            \( -name "${SCHEME}_*.xctestrun" -o -name "${SCHEME}.xctestrun" \) 2>/dev/null | LC_ALL=C sort)
          if [ "${#xctestruns[@]}" -eq 0 ]; then
            problem="No .xctestrun for scheme '$SCHEME' under '$derived_data/Build/Products' after build-for-testing; cannot discover tests to shard. A DerivedData cache shared by several schemes only carries the one its build job compiled. Found: $({ find "$derived_data/Build/Products" -maxdepth 1 -type f -name '*.xctestrun' 2>/dev/null || true; } | tr '\n' ' ')"
          elif [ "${#xctestruns[@]}" -gt 1 ]; then
            problem="Several .xctestrun bundles match scheme '$SCHEME', so which one describes this run is a guess: $(printf '%s ' "${xctestruns[@]}"). Pass only-testing explicitly, or give this scheme its own derived-data-dir."
          fi
        fi

        resolved=''
        if [ "${#xctestruns[@]}" -eq 1 ]; then
          resolved="${xctestruns[0]}"
        fi
        {
          printf 'path=%s\n' "$resolved"
          printf 'problem<<XCTESTRUN_PROBLEM_EOF\n%s\nXCTESTRUN_PROBLEM_EOF\n' "$problem"
        } >> "$GITHUB_OUTPUT"

        if [ "${#xctestruns[@]}" -eq 0 ]; then
          echo "::warning::Screen capture left at the scheme's own setting: ${problem}"
          exit 0
        fi

        # A missing python3 is the same class of event as an unreachable
        # .xctestrun: this action's contract is to run the tests, and the
        # capture format is an optimisation on top of that. Warn and leave the
        # scheme's own setting rather than failing a run that would otherwise
        # have passed — but never pretend the rewrite happened.
        if ! command -v python3 >/dev/null 2>&1; then
          echo "::warning::'python3' is not on PATH, so the .xctestrun's screen-capture format is left at the scheme's own setting; this run pays Xcode's UI-test video. Install the Xcode Command Line Tools on this runner (see docs/self-hosted-runners.md)."
          exit 0
        fi
        for xctestrun in "${xctestruns[@]}"; do
          counts="$(XCTESTRUN_PATH="$xctestrun" SCREEN_CAPTURE="$SCREEN_CAPTURE" python3 - <<'PYTHON'
        import os
        import plistlib

        path = os.environ['XCTESTRUN_PATH']
        wanted = os.environ['SCREEN_CAPTURE']
        KEY = 'PreferredScreenCaptureFormat'

        with open(path, 'rb') as handle:
            raw = handle.read()
        plist = plistlib.loads(raw)
        # Round-tripping through JSON would lose <data>/<date>; keep the file in the
        # format xcodebuild wrote it in.
        fmt = plistlib.FMT_BINARY if raw[:8] == b'bplist00' else plistlib.FMT_XML

        found = 0
        changed = 0


        def walk(node):
            global found, changed
            if isinstance(node, dict):
                for key, value in node.items():
                    if key == KEY:
                        found += 1
                        if value != wanted:
                            node[key] = wanted
                            changed += 1
                    else:
                        walk(value)
            elif isinstance(node, list):
                for item in node:
                    walk(item)


        walk(plist)
        if changed:
            with open(path, 'wb') as handle:
                plistlib.dump(plist, handle, fmt=fmt)
        print(f'{found} {changed}')
        PYTHON
        )"
          read -r found changed <<< "$counts"
          if [ "$found" -eq 0 ]; then
            echo "::warning::'$xctestrun' declares no PreferredScreenCaptureFormat; this Xcode records no UI-test video, so there is nothing to switch to '$SCREEN_CAPTURE'."
          else
            echo "Screen capture in '$xctestrun': ${changed} of ${found} PreferredScreenCaptureFormat entries set to '$SCREEN_CAPTURE'."
          fi
        done

    - name: Resolve this shard's test identifiers
      if: inputs.mode != 'build'
      id: shard
      shell: bash
      env:
        ONLY_TESTING: ${{ inputs.only-testing }}
        SCHEME: ${{ inputs.scheme }}
        DESTINATION_ID: ${{ inputs.destination-id }}
        SHARD_INDEX: ${{ inputs.shard-index }}
        SHARD_COUNT: ${{ inputs.shard-count }}
        XCTESTRUN: ${{ steps.xctestrun.outputs.path }}
        XCTESTRUN_PROBLEM: ${{ steps.xctestrun.outputs.problem }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        cd "$WORKING_DIRECTORY"
        for value in "$SHARD_INDEX" "$SHARD_COUNT"; do
          if ! printf '%s' "$value" | grep -qE '^[0-9]+$'; then
            echo "::error::shard-index and shard-count must be non-negative integers (got '$SHARD_INDEX'/'$SHARD_COUNT')."
            exit 1
          fi
        done
        if [ "$SHARD_COUNT" -lt 1 ]; then
          echo "::error::shard-count must be at least 1 (got '$SHARD_COUNT')."
          exit 1
        fi
        if [ "$SHARD_INDEX" -ge "$SHARD_COUNT" ]; then
          echo "::error::shard-index '$SHARD_INDEX' is out of range for shard-count '$SHARD_COUNT'."
          exit 1
        fi

        candidates=()
        while IFS= read -r identifier; do
          [ -n "$identifier" ] || continue
          candidates+=("$identifier")
        done <<< "$(printf '%s\n' "$ONLY_TESTING" | tr '[:blank:]' '\n')"

        if [ "${#candidates[@]}" -eq 0 ]; then
          if [ "$SHARD_COUNT" -eq 1 ]; then
            echo 'Not sharded and no only-testing list; the whole scheme is tested.'
            printf 'only-testing<<ONLY_TESTING_EOF\nONLY_TESTING_EOF\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          command -v jq >/dev/null 2>&1 || { echo "::error::'jq' is required to enumerate the tests to shard but is not on PATH."; exit 1; }
          # The .xctestrun was already resolved once, by the screen-capture
          # step; sharding is the caller that cannot continue without it.
          if [ -z "$XCTESTRUN" ]; then
            echo "::error::${XCTESTRUN_PROBLEM}"
            exit 1
          fi
          xctestrun="$XCTESTRUN"

          enumeration="${RUNNER_TEMP}/xcodebuild-test-enumeration-$$.json"
          rm -f "$enumeration"
          echo "Enumerating the individual tests declared by $xctestrun"
          if xcodebuild test-without-building \
              -xctestrun "$xctestrun" \
              -destination "platform=iOS Simulator,id=$DESTINATION_ID" \
              -enumerate-tests \
              -test-enumeration-style flat \
              -test-enumeration-format json \
              -test-enumeration-output-path "$enumeration" > /dev/null; then
            while IFS= read -r identifier; do
              [ -n "$identifier" ] || continue
              candidates+=("$identifier")
            done < <(jq -r '[.. | objects | .enabledTests? // empty | .[]? | .identifier? // empty] | unique | .[]' "$enumeration")
          else
            echo '::warning::xcodebuild -enumerate-tests failed; falling back to sharding by whole test target, which is coarser and fails when there are fewer targets than shards.'
          fi
          rm -f "$enumeration"

          if [ "${#candidates[@]}" -eq 0 ]; then
            echo "Falling back to the test targets declared by $xctestrun"
            while IFS= read -r target; do
              [ -n "$target" ] || continue
              candidates+=("$target")
            done < <(
              plutil -convert json -o - "$xctestrun" \
                | jq -r '[.TestConfigurations[]?.TestTargets[]?.BlueprintName] | unique | .[]'
            )
          fi
          if [ "${#candidates[@]}" -eq 0 ]; then
            echo "::error::Neither test enumeration nor '$xctestrun' yielded a single test identifier; there is nothing to shard."
            exit 1
          fi
        fi

        selected=()
        index=0
        for identifier in "${candidates[@]}"; do
          if [ "$((index % 10#$SHARD_COUNT))" -eq "$((10#$SHARD_INDEX))" ]; then
            selected+=("$identifier")
          fi
          index=$((index + 1))
        done
        if [ "${#selected[@]}" -eq 0 ]; then
          echo "::error::Shard ${SHARD_INDEX}/${SHARD_COUNT} selected none of the ${#candidates[@]} test identifier(s); reduce shard-count so every shard has work instead of shipping a green empty run."
          exit 1
        fi
        echo "Shard ${SHARD_INDEX}/${SHARD_COUNT} runs ${#selected[@]} of ${#candidates[@]} test identifier(s):"
        printf '  %s\n' "${selected[@]}"
        {
          printf 'only-testing<<ONLY_TESTING_EOF\n'
          printf '%s\n' "${selected[@]}"
          printf 'ONLY_TESTING_EOF\n'
        } >> "$GITHUB_OUTPUT"

    - name: Decide whether to slim the parallel-testing workers
      if: inputs.mode != 'build'
      id: slim-workers
      shell: bash
      env:
        SLIM_WORKERS: ${{ inputs.slim-workers }}
        PARALLEL_TESTING: ${{ inputs.parallel-testing }}
        SLIM_PROFILE: ${{ inputs.slim-profile }}
      run: |
        set -euo pipefail
        case "$SLIM_WORKERS" in
          auto|true|false) ;;
          *) echo "::error::slim-workers must be 'auto', 'true' or 'false' (got '$SLIM_WORKERS')."; exit 1 ;;
        esac
        if [ "$SLIM_WORKERS" = 'true' ] && [ "$PARALLEL_TESTING" != 'YES' ]; then
          echo "::error::slim-workers 'true' asks for the parallel-testing worker clones to be slimmed, but parallel-testing is '$PARALLEL_TESTING', so Xcode boots no worker clones. Set parallel-testing to 'YES', or slim-workers to 'auto'."
          exit 1
        fi
        if [ "$SLIM_WORKERS" = 'true' ] && [ -z "$SLIM_PROFILE" ]; then
          echo "::error::slim-workers 'true' needs a slim-profile to slim the worker clones with; pass the lease's own (simulator-lease defaults to 'bundled')."
          exit 1
        fi
        if [ "$SLIM_WORKERS" = 'false' ] || [ "$PARALLEL_TESTING" != 'YES' ]; then
          echo 'enabled=false' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ -z "$SLIM_PROFILE" ]; then
          echo "::notice::parallel-testing is 'YES' but slim-profile is empty, so every worker clone boots stock (simslim keeps disable overrides keyed by UDID and a clone gets a new one). Pass the lease's slim-profile to slim them as they boot."
          echo 'enabled=false' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ "$SLIM_PROFILE" = 'bundled' ]; then
          SLIM_PROFILE="$(cd "$GITHUB_ACTION_PATH/../.." 2>/dev/null && pwd)/profiles/ci.json"
          echo "slim-profile 'bundled' resolved to this release's shipped profile '$SLIM_PROFILE'."
        else
          case "$SLIM_PROFILE" in
            /*) ;;
            *) SLIM_PROFILE="$GITHUB_WORKSPACE/$SLIM_PROFILE" ;;
          esac
        fi
        if [ ! -f "$SLIM_PROFILE" ]; then
          echo "::error::slim-profile '$SLIM_PROFILE' does not exist ('bundled' resolves to this release's profiles/ci.json, any other value against the repository root)."
          exit 1
        fi
        {
          echo 'enabled=true'
          echo "profile=$SLIM_PROFILE"
        } >> "$GITHUB_OUTPUT"

    - name: Install simslim
      if: steps.slim-workers.outputs.enabled == 'true'
      shell: bash
      env:
        SIMSLIM_VERSION: ${{ inputs.simslim-version }}
        SIMSLIM_SHA256: ${{ inputs.simslim-sha256 }}
      run: |
        set -euo pipefail
        if ! printf '%s' "$SIMSLIM_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "::error::simslim-version '$SIMSLIM_VERSION' must be a plain X.Y.Z version (digits and dots only) to be used safely in a local path and release URL."
          exit 1
        fi
        if [ -n "$SIMSLIM_SHA256" ] && ! printf '%s' "$SIMSLIM_SHA256" | grep -qE '^[0-9a-f]{64}$'; then
          echo "::error::simslim-sha256 '$SIMSLIM_SHA256' must be empty or a 64-character lowercase hex SHA-256 digest."
          exit 1
        fi
        expected_version_line="simslim $SIMSLIM_VERSION"
        existing_bin="$(command -v simslim || true)"
        if [ -n "$existing_bin" ] && [ "$("$existing_bin" version 2>/dev/null | tail -n 1 | tr -d '\r' || true)" = "$expected_version_line" ]; then
          echo "Using existing simslim $SIMSLIM_VERSION already on PATH: $existing_bin"
          exit 0
        fi
        if [ -z "$SIMSLIM_SHA256" ]; then
          echo "::error::No simslim $SIMSLIM_VERSION on PATH and simslim-sha256 is empty, so the release asset cannot be integrity-checked; refusing to download. Preinstall simslim $SIMSLIM_VERSION on the host or set simslim-sha256 to the asset's digest."
          exit 1
        fi
        host_arch="$(uname -m)"
        if [ "$host_arch" != "arm64" ]; then
          echo "::error::MobAI-App/simslim only publishes macos-arm64 release binaries and this host reports '$host_arch'; preinstall simslim $SIMSLIM_VERSION on PATH (e.g. 'go install github.com/mobai-app/simslim/cmd/simslim@v$SIMSLIM_VERSION') instead."
          exit 1
        fi

        sha256_of() {
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$1" | awk '{print $1}'
          else
            shasum -a 256 "$1" | awk '{print $1}'
          fi
        }

        asset_name="simslim-v${SIMSLIM_VERSION}-macos-arm64.tar.gz"
        pinned_root="$HOME/.simslim-pinned"
        pinned_tarball="$pinned_root/$asset_name"
        lock_dir="$pinned_root/.lock-$SIMSLIM_VERSION"
        mkdir -p "$pinned_root"

        cached_tarball_verified() {
          [ -f "$pinned_tarball" ] && [ "$(sha256_of "$pinned_tarball")" = "$SIMSLIM_SHA256" ]
        }

        if ! cached_tarball_verified; then
          lock_acquired=''
          lock_deadline=$((SECONDS + 300))
          lock_is_stale() {
            lock_pid="$(cat "$lock_dir/pid" 2>/dev/null || true)"
            if [ -n "$lock_pid" ]; then
              if kill -0 "$lock_pid" 2>/dev/null; then
                [ -n "$(find "$lock_dir" -maxdepth 0 -mmin +60 2>/dev/null)" ]
                return
              fi
              return 0
            else
              [ -n "$(find "$lock_dir" -maxdepth 0 -mmin +1 2>/dev/null)" ]
            fi
          }
          while :; do
            if mkdir "$lock_dir" 2>/dev/null; then
              echo "$$" > "$lock_dir/pid"
              lock_acquired=1
              break
            fi
            if cached_tarball_verified; then
              break
            fi
            if lock_is_stale; then
              echo "::warning::Removing stale simslim download lock '$lock_dir' left behind by a terminated job."
              rm -rf "$lock_dir"
              continue
            fi
            if [ "$SECONDS" -ge "$lock_deadline" ]; then
              echo "::error::Timed out waiting for the simslim download lock '$lock_dir'; a concurrent download on this host may be stuck."
              exit 1
            fi
            sleep 2
          done

          if [ -n "$lock_acquired" ]; then
            cleanup() {
              [ -n "${scratch_dir:-}" ] && rm -rf "$scratch_dir"
              rm -rf "$lock_dir"
            }
            trap cleanup EXIT

            if ! cached_tarball_verified; then
              download_url="https://github.com/MobAI-App/simslim/releases/download/v${SIMSLIM_VERSION}/${asset_name}"
              scratch_dir="$(mktemp -d "$pinned_root/.download-XXXXXX")"
              tarball_path="$scratch_dir/$asset_name"
              curl_exit=0
              http_status="$(curl -sSL --retry 3 --retry-connrefused --max-time 300 -w '%{http_code}' -o "$tarball_path" "$download_url")" || curl_exit=$?
              if [ "$curl_exit" -ne 0 ] || [ "$http_status" != "200" ]; then
                echo "::error::Download of simslim-version '$SIMSLIM_VERSION' from '$download_url' failed (curl exit $curl_exit, HTTP status '$http_status'). Confirm a 'v$SIMSLIM_VERSION' release publishing a $asset_name asset exists at https://github.com/MobAI-App/simslim/releases."
                exit 1
              fi
              actual_sha="$(sha256_of "$tarball_path")"
              if [ "$actual_sha" != "$SIMSLIM_SHA256" ]; then
                echo "::error::SHA-256 mismatch for $asset_name: expected $SIMSLIM_SHA256 (simslim-sha256), got $actual_sha. Refusing to install. If simslim-version was bumped, update simslim-sha256 to the new asset's digest."
                exit 1
              fi
              mv -f "$tarball_path" "$pinned_tarball"
              echo "Downloaded and verified $asset_name against simslim-sha256 $SIMSLIM_SHA256."
            fi
            trap - EXIT
            cleanup
          fi
        fi

        job_dir="$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/simslim-${SIMSLIM_VERSION}-XXXXXX")"
        if ! cached_tarball_verified; then
          echo "::error::Cached $pinned_tarball no longer matches simslim-sha256 $SIMSLIM_SHA256; refusing to extract from it. Delete it and re-run."
          exit 1
        fi
        tar -xzf "$pinned_tarball" -C "$job_dir"
        job_bin="$job_dir/simslim"
        if [ ! -f "$job_bin" ]; then
          echo "::error::$asset_name did not contain a top-level 'simslim' binary; refusing to install."
          exit 1
        fi
        chmod +x "$job_bin"
        if [ "$("$job_bin" version 2>/dev/null | tail -n 1 | tr -d '\r' || true)" != "$expected_version_line" ]; then
          echo "::error::Extracted simslim at '$job_bin' reports '$("$job_bin" version 2>&1 | tail -n 1 || true)', not '$expected_version_line'; refusing to run an unexpected binary."
          exit 1
        fi
        echo "$job_dir" >> "$GITHUB_PATH"
        echo "Installed simslim $SIMSLIM_VERSION for this job at $job_bin (extracted from the digest-verified $pinned_tarball)."

    - name: Start simslim watch for the parallel-testing workers
      if: steps.slim-workers.outputs.enabled == 'true'
      id: watch
      shell: bash
      env:
        SLIM_WORKERS: ${{ inputs.slim-workers }}
        SLIM_PROFILE: ${{ steps.slim-workers.outputs.profile }}
      run: |
        set -euo pipefail
        not_started() {
          echo 'started=false' >> "$GITHUB_OUTPUT"
          if [ "$SLIM_WORKERS" = 'true' ]; then
            echo "::error::$1 slim-workers is 'true', so a run on stock worker clones is refused."
            exit 1
          fi
          echo "::warning::$1 The parallel-testing worker clones run stock: the tests are unaffected, but every clone costs a full stock simulator's memory. Set slim-workers to 'true' to make this fail the job."
          exit 0
        }
        state_dir="$(mktemp -d "${RUNNER_TEMP}/xcodebuild-test-simslim-watch-XXXXXX")"
        log="$state_dir/watch.log"
        echo "state-dir=$state_dir" >> "$GITHUB_OUTPUT"
        if ! command -v simslim >/dev/null 2>&1; then
          not_started "'simslim' is not on PATH after the install step, so no watch could start."
        fi
        nohup simslim watch --profile "$SLIM_PROFILE" > "$log" 2>&1 < /dev/null &
        pid=$!
        echo "$pid" > "$state_dir/watch.pid"
        ready=''
        for _ in $(seq 1 20); do
          if grep -q 'Watching device sets' "$log" 2>/dev/null; then
            ready=1
            break
          fi
          kill -0 "$pid" 2>/dev/null || break
          sleep 0.5
        done
        if ! kill -0 "$pid" 2>/dev/null; then
          watch_status=0
          wait "$pid" || watch_status=$?
          not_started "'simslim watch --profile $SLIM_PROFILE' exited with status $watch_status before the test run started: $(tail -n 5 "$log" | tr '\n' ' ')"
        fi
        if [ -z "$ready" ]; then
          echo "::notice::simslim watch (pid $pid) is running but has not printed its banner yet; the stop step reports what it slimmed."
        fi
        echo 'started=true' >> "$GITHUB_OUTPUT"
        echo "simslim watch (pid $pid) slims every simulator that boots in the default and testing (~/Library/Developer/XCTestDevices) device sets with '$SLIM_PROFILE'; log at $log."

    - name: Run the tests without rebuilding
      if: inputs.mode != 'build'
      id: test
      shell: bash
      env:
        COMMON_ARGS: ${{ steps.compose.outputs.common-args }}
        SELECTED_TESTS: ${{ steps.shard.outputs.only-testing }}
        RESULT_BUNDLE_PATH: ${{ inputs.result-bundle-path }}
        PARALLEL_TESTING: ${{ inputs.parallel-testing }}
        PARALLEL_TESTING_WORKER_COUNT: ${{ inputs.parallel-testing-worker-count }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        cd "$WORKING_DIRECTORY"
        if [ -n "$PARALLEL_TESTING_WORKER_COUNT" ] \
          && ! printf '%s' "$PARALLEL_TESTING_WORKER_COUNT" | grep -qE '^[1-9][0-9]*$'; then
          echo "::error::parallel-testing-worker-count '$PARALLEL_TESTING_WORKER_COUNT' must be a positive integer."
          exit 1
        fi
        case "$PARALLEL_TESTING" in
          NO)
            if [ -n "$PARALLEL_TESTING_WORKER_COUNT" ]; then
              echo "::error::parallel-testing-worker-count '$PARALLEL_TESTING_WORKER_COUNT' is ignored by xcodebuild while -parallel-testing-enabled is 'NO'; set parallel-testing to 'YES' if you mean to buy that many simulator clones, or drop the worker count."
              exit 1
            fi
            ;;
          YES)
            if [ -z "$PARALLEL_TESTING_WORKER_COUNT" ]; then
              echo "::error::parallel-testing 'YES' without parallel-testing-worker-count makes Xcode boot 'Clone 1 of <destination>' and run every test on that clone, doubling simulator memory on a 7 GiB VM - the configuration measured at 2 shards x ~30 min with 4 timeouts against 71 tests in 20m18s on one simulator. 'YES' only makes sense with an explicit parallel-testing-worker-count on a 6x12 runner profile; leave it at 'NO' on a 4x7 one."
              exit 1
            fi
            ;;
          *)
            echo "::error::parallel-testing must be 'YES' or 'NO' (got '$PARALLEL_TESTING')."
            exit 1
            ;;
        esac
        args=()
        while IFS= read -r argument; do
          [ -n "$argument" ] || continue
          args+=("$argument")
        done <<< "$COMMON_ARGS"
        while IFS= read -r identifier; do
          [ -n "$identifier" ] || continue
          args+=("-only-testing:$identifier")
        done <<< "$SELECTED_TESTS"
        PWD_PHYSICAL="$(pwd -P)"
        nearest_existing_ancestor() {
          local probe="$1" parent
          while [ ! -e "$probe" ]; do
            parent="$(dirname "$probe")"
            [ "$parent" = "$probe" ] && break
            probe="$parent"
          done
          (cd "$probe" 2>/dev/null && pwd -P)
        }
        assert_removable_child() {
          local label="$1"
          local candidate="$2"
          case "$candidate" in
            ''|.|..) echo "::error::${label} '$candidate' must be a path inside working-directory, not the directory itself."; return 1 ;;
            /*) echo "::error::${label} '$candidate' is absolute; only a path inside working-directory may be removed by this action."; return 1 ;;
          esac
          case "/$candidate/" in
            */../*|*/./*) echo "::error::${label} '$candidate' must not contain '.' or '..' segments."; return 1 ;;
          esac
          local parent
          parent="$(dirname "$candidate")"
          local real_root ancestor
          real_root="$PWD_PHYSICAL"
          ancestor="$(nearest_existing_ancestor "$parent")"
          case "${ancestor:-/}/" in
            "$real_root"/) ;;
            "$real_root"/*) ;;
            *)
              echo "::error::The nearest existing ancestor of ${label} '$candidate' is '${ancestor:-<unresolvable>}', outside working-directory '$real_root' — a symlink is redirecting it. Refusing to create or remove anything there."
              return 1
              ;;
          esac
          mkdir -p "$parent"
          local real_parent
          real_parent="$(cd "$parent" && pwd -P)"
          if [ "$real_parent" != "$real_root" ]; then
            case "$real_parent/" in
              "$real_root"/*) : ;;
              *) echo "::error::${label} '$candidate' resolves to '$real_parent', outside working-directory '$real_root' — an intermediate symlink would make this action remove data it does not own."; return 1 ;;
            esac
          fi
          return 0
        }
        assert_removable_child 'result-bundle-path' "$RESULT_BUNDLE_PATH"
        rm -rf "$RESULT_BUNDLE_PATH"
        echo "result-bundle-path=$RESULT_BUNDLE_PATH" >> "$GITHUB_OUTPUT"
        args+=(-parallel-testing-enabled "$PARALLEL_TESTING" -resultBundlePath "$RESULT_BUNDLE_PATH")
        if [ -n "$PARALLEL_TESTING_WORKER_COUNT" ]; then
          args+=(-parallel-testing-worker-count "$PARALLEL_TESTING_WORKER_COUNT")
        fi
        printf 'xcodebuild'
        printf ' %q' "${args[@]}" test-without-building
        printf '\n'
        xcodebuild "${args[@]}" test-without-building

    - name: Stop simslim watch and report the slimmed workers
      if: always() && steps.watch.outputs.state-dir != ''
      id: stop-watch
      shell: bash
      env:
        STATE_DIR: ${{ steps.watch.outputs.state-dir }}
        STARTED: ${{ steps.watch.outputs.started }}
        SLIM_WORKERS: ${{ inputs.slim-workers }}
        DESTINATION_ID: ${{ inputs.destination-id }}
        TEST_OUTCOME: ${{ steps.test.outcome }}
      run: |
        set -euo pipefail
        log="$STATE_DIR/watch.log"
        pid="$(cat "$STATE_DIR/watch.pid" 2>/dev/null || true)"
        is_our_watch() {
          case "$(ps -o command= -p "$1" 2>/dev/null || true)" in
            *simslim*watch*) return 0 ;;
          esac
          return 1
        }
        exited_early=''
        if printf '%s' "$pid" | grep -qE '^[1-9][0-9]*$' && is_our_watch "$pid"; then
          kill -INT "$pid" 2>/dev/null || true
          for _ in $(seq 1 60); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 0.5
          done
          if kill -0 "$pid" 2>/dev/null && is_our_watch "$pid"; then
            echo "::warning::simslim watch (pid $pid) was still running 30s after SIGINT; killing it."
            kill -KILL "$pid" 2>/dev/null || true
          fi
        else
          exited_early=1
        fi
        if [ "$STARTED" != 'true' ]; then
          echo 'simslim watch never started; the start step already reported why.'
          exit 0
        fi

        echo '::group::simslim watch log'
        cat "$log" 2>/dev/null || true
        echo '::endgroup::'
        lease="$(printf '%s' "$DESTINATION_ID" | tr '[:lower:]' '[:upper:]')"
        udids_after() {
          { grep -E "^watch: $1 [0-9A-Fa-f-]{36}( |\$)" "$log" 2>/dev/null || true; } \
            | awk '{print toupper($3)}' | { grep -vxF "${lease:-none}" || true; } | LC_ALL=C sort -u
        }
        slimmed="$(udids_after slimmed)"
        attempted="$(udids_after slimming)"
        never_slimmed="$(LC_ALL=C comm -23 <(printf '%s\n' "$attempted" | sed '/^$/d') <(printf '%s\n' "$slimmed" | sed '/^$/d'))"
        slimmed_count="$(printf '%s\n' "$slimmed" | sed '/^$/d' | wc -l | tr -d ' ')"
        never_count="$(printf '%s\n' "$never_slimmed" | sed '/^$/d' | wc -l | tr -d ' ')"
        clone_list="$(printf '%s\n' "$slimmed" | sed '/^$/d; s/.*/`&`/' | paste -s -d ' ' -)"
        echo "slimmed-workers=$slimmed_count" >> "$GITHUB_OUTPUT"
        {
          echo '### simslim watch — parallel-testing workers'
          echo
          echo "Worker clones slimmed: ${slimmed_count}${clone_list:+ (${clone_list})}"
          echo
          echo "Worker clones seen booting but never slimmed (ran stock): $never_count"
          echo
          echo '<details><summary>simslim watch log (last 100 lines)</summary>'
          echo
          echo '```text'
          tail -n 100 "$log" 2>/dev/null || true
          echo '```'
          echo
          echo '</details>'
        } >> "$GITHUB_STEP_SUMMARY"

        failed=''
        report() {
          if [ "$SLIM_WORKERS" = 'true' ]; then
            echo "::error::$1"
            failed=1
          else
            echo "::warning::$1 The tests are unaffected; set slim-workers to 'true' to make this fail the job."
          fi
        }
        if [ -n "$exited_early" ]; then
          report "simslim watch (pid ${pid:-unknown}) exited before the test run ended, so any worker clone that booted after that ran stock."
        fi
        if [ "$slimmed_count" -eq 0 ]; then
          if [ "$TEST_OUTCOME" = 'success' ]; then
            report 'simslim watch slimmed no worker clone during a green parallel-testing run, so every worker ran stock.'
          else
            echo "::warning::simslim watch slimmed no worker clone during this ${TEST_OUTCOME:-unknown} test run, so every worker ran stock; check whether that caused the failures."
          fi
        fi
        if [ "$never_count" -gt 0 ]; then
          echo "::warning::${never_count} worker clone(s) booted but simslim watch never finished slimming them: $(printf '%s\n' "$never_slimmed" | paste -s -d ' ' -)"
        fi
        [ -z "$failed" ] || exit 1
        echo "simslim watch slimmed ${slimmed_count} worker clone(s)."

    - name: Publish the xcodebuild test summary
      id: summary
      if: always() && steps.test.outputs.result-bundle-path != ''
      shell: bash
      env:
        RESULT_BUNDLE_PATH: ${{ steps.test.outputs.result-bundle-path }}
        SCHEME: ${{ inputs.scheme }}
        SHARD_INDEX: ${{ inputs.shard-index }}
        SHARD_COUNT: ${{ inputs.shard-count }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        cd "$WORKING_DIRECTORY"
        command -v jq >/dev/null 2>&1 || { echo "::error::'jq' is required to read the .xcresult summary but is not on PATH."; exit 1; }
        if [ ! -e "$RESULT_BUNDLE_PATH" ]; then
          echo "::error::No result bundle at '$RESULT_BUNDLE_PATH'; xcodebuild produced no test evidence, which is never a pass."
          exit 1
        fi
        summary_json="${RUNNER_TEMP}/xcresult-summary-$$.json"
        if ! xcrun xcresulttool get test-results summary --path "$RESULT_BUNDLE_PATH" --format json > "$summary_json"; then
          echo "::error::'xcrun xcresulttool get test-results summary' failed for '$RESULT_BUNDLE_PATH'; the run cannot be verified and is not treated as a pass."
          exit 1
        fi
        total=$(jq -r '.totalTestCount // 0' "$summary_json")
        passed=$(jq -r '.passedTests // 0' "$summary_json")
        failed=$(jq -r '.failedTests // 0' "$summary_json")
        skipped=$(jq -r '.skippedTests // 0' "$summary_json")
        expected_failures=$(jq -r '.expectedFailures // 0' "$summary_json")
        {
          echo "tests-total=$total"
          echo "tests-failed=$failed"
        } >> "$GITHUB_OUTPUT"
        shard_label=''
        if [ "$SHARD_COUNT" != '1' ]; then
          shard_label=" — shard ${SHARD_INDEX}/${SHARD_COUNT}"
        fi
        {
          echo "### xcodebuild test — \`${SCHEME}\`${shard_label}"
          echo
          echo '| Total | Passed | Failed | Skipped | Expected failures |'
          echo '| ----- | ------ | ------ | ------- | ----------------- |'
          echo "| $total | $passed | $failed | $skipped | $expected_failures |"
        } >> "$GITHUB_STEP_SUMMARY"
        rm -f "$summary_json"
        if [ "$total" -eq 0 ]; then
          echo '::error::The result bundle reports zero executed tests. A test run that ran nothing is a configuration failure, not a pass.'
          exit 1
        fi
        echo "Executed $total test(s): $passed passed, $failed failed, $skipped skipped."

    - name: Upload the xcresult bundle
      if: always() && steps.test.outputs.result-bundle-path != ''
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
          name: ${{ inputs.artifact-name != '' && inputs.artifact-name || format('xcresult-{0}-{1}', inputs.scheme, inputs.shard-index) }}
          path: ${{ inputs.working-directory }}/${{ steps.test.outputs.result-bundle-path }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: ${{ inputs.retention-days }}
