name: native-fingerprint
description: >-
  Computes a tokenless native-surface fingerprint with @expo/fingerprint (no
  EAS account, no EXPO_TOKEN) for use as a native app cache key.
inputs:
  platform:
    description: Target platform passed to `fingerprint:generate --platform`.
    required: true
  working-directory:
    description: Directory containing the app whose native surface is fingerprinted.
    required: false
    default: '.'
  fingerprint-version:
    description: Pinned @expo/fingerprint npm version.
    required: false
    default: '0.20.6'
  extra-env:
    description: >-
      Newline-separated KEY=VALUE pairs exported for the fingerprint
      evaluation only, so an app.config.js that branches on env (brand,
      flavor) is fingerprinted under the same env every consumer of the key
      uses. Rejects (fails closed) any line without '=' or whose name does
      not match ^[A-Za-z_][A-Za-z0-9_]*$.
    required: false
    default: ''
outputs:
  hash:
    description: The computed native fingerprint hash.
    value: ${{ steps.fingerprint.outputs.hash }}
  file:
    description: Path to the raw @expo/fingerprint JSON, consumable by `fingerprint:diff`.
    value: ${{ steps.fingerprint.outputs.file }}
runs:
  using: composite
  steps:
    - name: Generate native fingerprint
      id: fingerprint
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FINGERPRINT_VERSION: ${{ inputs.fingerprint-version }}
        FINGERPRINT_PLATFORM: ${{ inputs.platform }}
        FINGERPRINT_EXTRA_ENV: ${{ inputs.extra-env }}
      run: |
        set -euo pipefail
        extra_env=()
        while IFS= read -r line; do
          [ -n "$line" ] || continue
          case "$line" in
            *=*) ;;
            *)
              echo "::error::extra-env line '$line' is missing '='; expected KEY=VALUE."
              exit 1
              ;;
          esac
          name="${line%%=*}"
          case "$name" in
            ''|[!A-Za-z_]*|*[!A-Za-z0-9_]*)
              echo "::error::extra-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
              exit 1
              ;;
            FINGERPRINT_PLATFORM|FINGERPRINT_VERSION|FINGERPRINT_EXTRA_ENV)
              echo "::error::extra-env may not set '$name'; it is this step's own control variable, and overwriting it would fingerprint something other than what the inputs asked for."
              exit 1
              ;;
          esac
          extra_env+=("$line")
        done <<< "$FINGERPRINT_EXTRA_ENV"
        run_token="$$-${RANDOM}"
        out_file="$RUNNER_TEMP/native-fingerprint-${FINGERPRINT_PLATFORM}-${run_token}.json"
        error_file="$RUNNER_TEMP/native-fingerprint-${FINGERPRINT_PLATFORM}-${run_token}.err"
        # npx has been observed exiting 0 with empty stdout on self-hosted Linux
        # containers, which used to surface later as a bare "Unexpected end of
        # JSON input". Fail closed on empty output, always surface stderr, and
        # give the generate one retry that bypasses any local/cached resolution
        # with a fresh npm cache and --prefer-online.
        generate() {
          env ${extra_env[@]+"${extra_env[@]}"} \
            npx --yes "$@" "@expo/fingerprint@${FINGERPRINT_VERSION}" fingerprint:generate --platform "$FINGERPRINT_PLATFORM" > "$out_file" 2> "$error_file"
        }
        report_stderr() {
          if [ -s "$error_file" ]; then
            echo "::group::@expo/fingerprint stderr"
            cat "$error_file"
            echo "::endgroup::"
          fi
        }
        status=0
        generate || status=$?
        report_stderr
        if [ "$status" -ne 0 ] || [ ! -s "$out_file" ]; then
          echo "::warning::@expo/fingerprint produced ${status}/empty output; retrying with a fresh npm cache and --prefer-online."
          status=0
          npm_config_cache="$(mktemp -d)" generate --prefer-online || status=$?
          report_stderr
        fi
        if [ "$status" -ne 0 ]; then
          echo "::error::@expo/fingerprint exited with status $status."
          exit "$status"
        fi
        if [ ! -s "$out_file" ]; then
          echo "::error::@expo/fingerprint exited 0 but wrote no output."
          exit 1
        fi
        hash=$(node -e "process.stdout.write(require('$out_file').hash)")
        test -n "$hash"
        echo "hash=$hash" >> "$GITHUB_OUTPUT"
        echo "file=$out_file" >> "$GITHUB_OUTPUT"
        echo "Native fingerprint ($FINGERPRINT_PLATFORM): $hash"
