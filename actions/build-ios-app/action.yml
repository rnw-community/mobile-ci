name: build-ios-app
description: >-
  Builds a Release, ad-hoc-signed (entitlements preserved) iOS Simulator .app
  with an embedded jsbundle via xcodebuild, restoring/saving a CocoaPods
  cache around `pod install`.
inputs:
  app-dir:
    description: App directory containing the ios/ folder.
    required: true
  workspace:
    description: Xcode workspace file name (e.g. MyApp.xcworkspace).
    required: true
  scheme:
    description: Xcode scheme name to build.
    required: true
  derived-data-dir:
    description: DerivedData directory used for the build.
    required: true
  output-dir:
    description: Directory the packaged .app is copied into as Base.app.
    required: true
  pods-cache-key:
    description: Exact cache key for the CocoaPods cache.
    required: true
  pods-cache-restore-keys:
    description: Newline-separated fallback prefixes for the CocoaPods cache.
    required: false
    default: ''
  configuration:
    description: xcodebuild configuration.
    required: false
    default: Release
  archs:
    description: xcodebuild ARCHS value.
    required: false
    default: arm64
  excluded-archs:
    description: xcodebuild EXCLUDED_ARCHS value.
    required: false
    default: x86_64
  rct-use-prebuilt-rncore:
    description: >-
      Exports RCT_USE_PREBUILT_RNCORE=1 for `pod install` and the build step
      when `true`. Any other value exports nothing at all: React Native's
      CocoaPods scripts test for the variable's presence, so exporting it
      empty reads as enabled.
    required: false
    default: 'false'
  rct-use-rn-dep:
    description: >-
      Exports RCT_USE_RN_DEP=1 for `pod install` and the build step when
      `true`. Any other value exports nothing at all, for the same
      presence-not-value reason as rct-use-prebuilt-rncore.
    required: false
    default: 'false'
  expo-use-precompiled-modules:
    description: >-
      Exports EXPO_USE_PRECOMPILED_MODULES=1 for `pod install` and the build
      step when `true`. Any other value exports nothing at all, for the same
      presence-not-value reason as rct-use-prebuilt-rncore.
    required: false
    default: 'false'
outputs:
  app-path:
    description: Path to the packaged .app (<output-dir>/Base.app).
    value: ${{ steps.package.outputs.app-path }}
runs:
  using: composite
  steps:
    - name: Restore CocoaPods cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
          path: |
              ~/Library/Caches/CocoaPods
              ~/.cocoapods
          key: ${{ inputs.pods-cache-key }}
          restore-keys: ${{ inputs.pods-cache-restore-keys }}

    - name: Install CocoaPods dependencies
      shell: bash
      working-directory: ${{ inputs.app-dir }}/ios
      env:
        RCT_USE_PREBUILT_RNCORE_ENABLED: ${{ inputs.rct-use-prebuilt-rncore }}
        RCT_USE_RN_DEP_ENABLED: ${{ inputs.rct-use-rn-dep }}
        EXPO_USE_PRECOMPILED_MODULES_ENABLED: ${{ inputs.expo-use-precompiled-modules }}
      run: |
        set -euo pipefail
        if [ "$RCT_USE_PREBUILT_RNCORE_ENABLED" = 'true' ]; then
          export RCT_USE_PREBUILT_RNCORE=1
        fi
        if [ "$RCT_USE_RN_DEP_ENABLED" = 'true' ]; then
          export RCT_USE_RN_DEP=1
        fi
        if [ "$EXPO_USE_PRECOMPILED_MODULES_ENABLED" = 'true' ]; then
          export EXPO_USE_PRECOMPILED_MODULES=1
        fi
        pod install --repo-update

    - name: Save CocoaPods cache
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
          path: |
              ~/Library/Caches/CocoaPods
              ~/.cocoapods
          key: ${{ inputs.pods-cache-key }}

    - name: Build app (${{ inputs.configuration }})
      shell: bash
      working-directory: ${{ inputs.app-dir }}/ios
      env:
        DERIVED_DATA_DIR: ${{ inputs.derived-data-dir }}
        WORKSPACE: ${{ inputs.workspace }}
        SCHEME: ${{ inputs.scheme }}
        CONFIGURATION: ${{ inputs.configuration }}
        ARCHS: ${{ inputs.archs }}
        EXCLUDED_ARCHS: ${{ inputs.excluded-archs }}
        RCT_USE_PREBUILT_RNCORE_ENABLED: ${{ inputs.rct-use-prebuilt-rncore }}
        RCT_USE_RN_DEP_ENABLED: ${{ inputs.rct-use-rn-dep }}
        EXPO_USE_PRECOMPILED_MODULES_ENABLED: ${{ inputs.expo-use-precompiled-modules }}
      run: |
        set -euo pipefail
        if [ "$RCT_USE_PREBUILT_RNCORE_ENABLED" = 'true' ]; then
          export RCT_USE_PREBUILT_RNCORE=1
        fi
        if [ "$RCT_USE_RN_DEP_ENABLED" = 'true' ]; then
          export RCT_USE_RN_DEP=1
        fi
        if [ "$EXPO_USE_PRECOMPILED_MODULES_ENABLED" = 'true' ]; then
          export EXPO_USE_PRECOMPILED_MODULES=1
        fi
        mkdir -p "$DERIVED_DATA_DIR"
        build_start=$(date +%s)
        xcodebuild build \
          -workspace "$WORKSPACE" \
          -scheme "$SCHEME" \
          -sdk iphonesimulator \
          -configuration "$CONFIGURATION" \
          -derivedDataPath "$DERIVED_DATA_DIR" \
          -destination 'generic/platform=iOS Simulator' \
          CODE_SIGN_IDENTITY=- \
          AD_HOC_CODE_SIGNING_ALLOWED=YES \
          PROVISIONING_PROFILE_SPECIFIER= \
          ONLY_ACTIVE_ARCH=YES \
          ARCHS="$ARCHS" \
          EXCLUDED_ARCHS="$EXCLUDED_ARCHS"
        build_end=$(date +%s)
        {
          echo "### iOS build: ${SCHEME} (cold — native build ran)"
          echo "Duration: $((build_end - build_start))s"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Package native app
      id: package
      shell: bash
      env:
        DERIVED_DATA_DIR: ${{ inputs.derived-data-dir }}
        SCHEME: ${{ inputs.scheme }}
        CONFIGURATION: ${{ inputs.configuration }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        set -euo pipefail
        app_path="$DERIVED_DATA_DIR/Build/Products/${CONFIGURATION}-iphonesimulator/${SCHEME}.app"
        test -d "$app_path"
        test -f "$app_path/main.jsbundle"
        mkdir -p "$OUTPUT_DIR"
        ditto "$app_path" "$OUTPUT_DIR/Base.app"
        echo "app-path=$OUTPUT_DIR/Base.app" >> "$GITHUB_OUTPUT"
