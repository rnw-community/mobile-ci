name: run-maestro-ios
description: >-
  Boots an iOS Simulator, installs a packaged .app, runs a Maestro flow shard,
  and always captures final-state artifacts on failure.
inputs:
  app-path:
    description: Path to a packaged .app to install (directory, not archive).
    required: true
  app-id:
    description: Bundle identifier passed to Maestro as APP_ID.
    required: true
  flows-dir:
    description: >-
      Directory whose top-level files are the runnable Maestro flows.
      Subdirectories are deliberately not searched; see flows-name-pattern.
    required: true
  flows-name-pattern:
    description: >-
      find -name pattern selecting runnable flows directly inside flows-dir.
      Defaults to the widespread *.flow.yaml convention, which keeps reusable
      subflows and capture-only flows in subdirectories out of the shard.
    required: false
    default: '*.flow.yaml'
  shard-index:
    description: Zero-based shard index this job runs.
    required: true
  shard-count:
    description: Total number of shards flows are distributed across.
    required: true
  pre-run-flow:
    description: >-
      Path to a single priming flow run once before this shard's flows,
      excluded from sharding. Its failure fails the step immediately without
      running the shard. Leave empty to skip priming.
    required: false
    default: ''
  flow-retries:
    description: >-
      Non-negative retry budget per flow. Each flow gets up to
      1 + flow-retries attempts; a flow that eventually passes counts as
      passed. The step fails if any flow exhausts its attempts.
    required: false
    default: '0'
  maestro-version:
    description: Pinned Maestro CLI version.
    required: false
    default: '2.8.0'
  artifacts-dir:
    description: Directory Maestro debug output and final-state capture is written to.
    required: true
  artifact-name:
    description: Uploaded artifact name.
    required: true
  retention-days:
    description: Uploaded artifact retention in days.
    required: false
    default: '7'
runs:
  using: composite
  steps:
    - name: Configure Maestro debug output directory
      shell: bash
      env:
        MAESTRO_DEBUG_OUTPUT_DIRECTORY: ${{ inputs.artifacts-dir }}
      run: |
          mkdir -p "$MAESTRO_DEBUG_OUTPUT_DIRECTORY"
          echo "MAESTRO_DEBUG_OUTPUT_DIRECTORY=$MAESTRO_DEBUG_OUTPUT_DIRECTORY" >> "$GITHUB_ENV"

    - name: Boot iOS Simulator
      shell: bash
      run: |
          set -euo pipefail
          device_line=$(xcrun simctl list devices available | grep -E '^\s+iPhone.*\(' | tail -1)
          test -n "$device_line"
          device_udid=$(grep -oE '[0-9A-Fa-f]{8}(-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}' <<< "$device_line")
          test -n "$device_udid"
          echo "Booting simulator: $device_line"
          xcrun simctl boot "$device_udid" || true
          xcrun simctl bootstatus "$device_udid" -b
          echo "SIMULATOR_UDID=$device_udid" >> "$GITHUB_ENV"

    - name: Install app on simulator
      shell: bash
      env:
        APP_PATH: ${{ inputs.app-path }}
      run: |
          set -euo pipefail
          test -d "$APP_PATH"
          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"

    - name: Install Maestro
      shell: bash
      env:
        MAESTRO_VERSION: ${{ inputs.maestro-version }}
      run: |
          maestro_bin="$HOME/.maestro/bin/maestro"
          if [ ! -x "$maestro_bin" ] || [ "$("$maestro_bin" --version 2>/dev/null | tail -n 1 | tr -d '\r' || true)" != "$MAESTRO_VERSION" ]; then
            curl -fsSL https://get.maestro.mobile.dev | env MAESTRO_VERSION="$MAESTRO_VERSION" bash
          fi
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

    - name: Run Maestro shard
      shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
        FLOWS_DIR: ${{ inputs.flows-dir }}
        FLOWS_NAME_PATTERN: ${{ inputs.flows-name-pattern }}
        SHARD_INDEX: ${{ inputs.shard-index }}
        SHARD_COUNT: ${{ inputs.shard-count }}
        PRE_RUN_FLOW: ${{ inputs.pre-run-flow }}
        FLOW_RETRIES: ${{ inputs.flow-retries }}
      run: |
          set -euo pipefail
          case "$SHARD_COUNT" in
            ''|*[!0-9]*)
              echo "::error::shard-count '$SHARD_COUNT' must be a non-negative integer."
              exit 1
              ;;
          esac
          if [ "$SHARD_COUNT" -lt 1 ]; then
            echo "::error::shard-count must be >= 1, got $SHARD_COUNT."
            exit 1
          fi
          case "$SHARD_INDEX" in
            ''|*[!0-9]*)
              echo "::error::shard-index '$SHARD_INDEX' must be a non-negative integer."
              exit 1
              ;;
          esac
          if [ "$SHARD_INDEX" -ge "$SHARD_COUNT" ]; then
            echo "::error::shard-index $SHARD_INDEX is out of range [0, $SHARD_COUNT)."
            exit 1
          fi
          case "$FLOW_RETRIES" in
            ''|*[!0-9]*)
              echo "::error::flow-retries '$FLOW_RETRIES' must be a non-negative integer."
              exit 1
              ;;
          esac
          max_attempts=$((1 + FLOW_RETRIES))

          if [ -n "$PRE_RUN_FLOW" ]; then
            test -f "$PRE_RUN_FLOW" || { echo "::error::pre-run-flow '$PRE_RUN_FLOW' is not a file."; exit 1; }
          fi

          summary_rows=()

          run_flow_with_retries() {
            local flow="$1" label="$2" attempts=0 status=failed start end duration
            start=$(date +%s)
            while [ "$attempts" -lt "$max_attempts" ]; do
              attempts=$((attempts + 1))
              if maestro test -e "APP_ID=$APP_ID" "$flow"; then
                status=passed
                break
              fi
            done
            end=$(date +%s)
            duration=$((end - start))
            summary_rows+=("| $label | ${duration}s | $status | $attempts |")
            [ "$status" = "passed" ]
          }

          write_summary() {
            {
              echo "### Maestro flow timing (shard $SHARD_INDEX)"
              echo "| Flow | Duration | Status | Attempts |"
              echo "| --- | --- | --- | --- |"
              printf '%s\n' "${summary_rows[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          flows=()
          # Only top-level files matching flows-name-pattern are runnable
          # scenarios. Recursing over every flow file sweeps in reusable
          # subflows and capture-only flows conventionally kept in
          # subdirectories of the flows dir; those expect a caller to pass
          # env or leave the app mid-journey, so running them standalone fails.
          while IFS= read -r flow; do
            flows+=("$flow")
          done < <(find "$FLOWS_DIR" -maxdepth 1 -type f -name "$FLOWS_NAME_PATTERN" | sort)
          if [ "${#flows[@]}" -eq 0 ]; then
            echo "::error::No flows matching '$FLOWS_NAME_PATTERN' found directly inside flows-dir '$FLOWS_DIR'."
            exit 1
          fi
          selected=()
          for index in "${!flows[@]}"; do
            if (( index % SHARD_COUNT == SHARD_INDEX )); then
              selected+=("${flows[$index]}")
            fi
          done

          if [ -n "$PRE_RUN_FLOW" ]; then
            if ! run_flow_with_retries "$PRE_RUN_FLOW" "$(basename "$PRE_RUN_FLOW") (priming)"; then
              write_summary
              echo "::error::Priming flow '$PRE_RUN_FLOW' failed; aborting shard $SHARD_INDEX."
              exit 1
            fi
          fi

          if [ "${#selected[@]}" -eq 0 ]; then
            echo "Shard $SHARD_INDEX has no flows; nothing to run."
            if [ "${#summary_rows[@]}" -gt 0 ]; then
              write_summary
            fi
            exit 0
          fi
          printf 'Shard %s flows:\n%s\n' "$SHARD_INDEX" "${selected[*]}"

          overall_status=0
          for flow in "${selected[@]}"; do
            if ! run_flow_with_retries "$flow" "$(basename "$flow")"; then
              overall_status=1
            fi
          done

          write_summary
          exit "$overall_status"

    - name: Capture final simulator state
      if: always()
      shell: bash
      run: |
          mkdir -p "$MAESTRO_DEBUG_OUTPUT_DIRECTORY"
          xcrun simctl io "$SIMULATOR_UDID" screenshot "$MAESTRO_DEBUG_OUTPUT_DIRECTORY/final-screen.png" || true

    - name: Shutdown simulator
      if: always()
      shell: bash
      run: xcrun simctl shutdown "$SIMULATOR_UDID" || true

    - name: Upload Maestro artifacts
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifacts-dir }}/**
          if-no-files-found: warn
          retention-days: ${{ inputs.retention-days }}
