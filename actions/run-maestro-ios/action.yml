name: run-maestro-ios
description: >-
  Boots an iOS Simulator, installs a packaged .app, runs a Maestro flow shard,
  and always captures final-state artifacts on failure.
inputs:
  app-path:
    description: Path to a packaged .app to install (directory, not archive).
    required: true
  app-id:
    description: Bundle identifier passed to Maestro as APP_ID.
    required: true
  flows-dir:
    description: >-
      Directory whose top-level files are the runnable Maestro flows by
      default. Subdirectories are not searched unless flows-max-depth is
      raised; see flows-max-depth/flows-name-pattern.
    required: true
  flows-max-depth:
    description: >-
      find -maxdepth under flows-dir. Default 1 (top-level only): subflows are
      invoked by parent flows via runFlow, not run directly, and conventionally
      live in subdirectories. Set to 0 for unbounded recursion.
    required: false
    default: '1'
  flows-name-pattern:
    description: >-
      Space-separated find -name globs (OR'd together) selecting runnable
      flows under flows-dir. Defaults to the widespread *.flow.yaml
      convention, which keeps reusable subflows and capture-only flows in
      subdirectories out of the shard.
    required: false
    default: '*.flow.yaml'
  flows-exclude-pattern:
    description: Optional find ! -name glob excluding matched flows by basename.
    required: false
    default: ''
  shard-manifest-dir:
    description: >-
      Optional directory of hand-curated shard-<index>.txt files (one
      flows-dir-relative flow path per line) overriding the computed
      index-modulo split so a consumer's balanced shard assignment survives.
      Unset (default) falls back to the index-modulo split entirely. Once
      set, every shard-index this job can run must have its own
      shard-<index>.txt — a partial manifest fails closed rather than
      silently mixing curated and modulo-selected flows for the shards it
      omits.
    required: false
    default: ''
  shard-index:
    description: Zero-based shard index this job runs.
    required: true
  shard-count:
    description: Total number of shards flows are distributed across.
    required: true
  pre-run-flow:
    description: >-
      Path to a single priming flow run once before this shard's flows,
      excluded from sharding. Its failure fails the step immediately without
      running the shard. Leave empty to skip priming.
    required: false
    default: ''
  flow-recovery-flow:
    description: >-
      Path to a single best-effort recovery flow run after a failed flow
      attempt: before the same flow's next retry attempt, and before the
      next flow starts, so a failure cannot strand the app in a state that
      cascades into the flows after it. Not run after a passing attempt,
      and not after the shard's last flow. Its own failure only logs a
      warning and never fails the shard. Like pre-run-flow it is removed
      from the discovered flow list, so it never also runs as a scenario
      of its own. Leave empty to skip recovery.
    required: false
    default: ''
  pre-test-command:
    description: >-
      Optional consumer-owned shell command run once after the app is
      installed on the simulator and before any flow (including
      pre-run-flow) executes, e.g. seeding a fixture into the app's data
      container. Runs with SIMULATOR_UDID, APP_ID, and APP_PATH in its
      environment. Its failure fails the step immediately. Leave empty to
      skip.
    required: false
    default: ''
  app-warm-seconds:
    description: >-
      Seconds the app is left running during a one-off warm-up performed
      after install and before any flow (including pre-run-flow) runs. The
      app is launched, left to settle this long, then terminated, so
      first-launch cold-start cost (JS bundle load, cache priming) is not
      absorbed by the first flow's own timeout budget. Set to '0' to
      disable warming.
    required: false
    default: '20'
  maestro-env:
    description: >-
      Newline-separated KEY=VALUE pairs, each passed as an additional
      -e KEY=VALUE argument to every `maestro test` invocation (pre-run-flow
      and shard flows alike). Rejects (fails closed) any line without '=' or
      whose name does not match ^[A-Za-z_][A-Za-z0-9_]*$.
    required: false
    default: ''
  maestro-config:
    description: >-
      Path to the consumer's Maestro workspace config (config.yaml), passed
      as --config to every `maestro test` invocation. Maestro only
      auto-discovers a workspace config.yaml when it is pointed at a
      directory, and this action always passes individual flow files, so
      without this input a workspace config is silently ignored. Relative
      paths resolve against the job's working directory. Fails closed when
      set to a path that is not a file. Leave empty to pass no --config.
    required: false
    default: ''
  flow-retries:
    description: >-
      Non-negative retry budget per flow. Each flow gets up to
      1 + flow-retries attempts; a flow that eventually passes counts as
      passed. The step fails if any flow exhausts its attempts.
    required: false
    default: '0'
  maestro-version:
    description: >-
      Pinned Maestro CLI version. Installed by downloading the matching
      cli-<version> release directly from
      https://github.com/mobile-dev-inc/Maestro/releases to
      $HOME/.maestro-pinned/<version>, immune to a pre-existing
      Homebrew-managed maestro on the host. An existing maestro already on
      PATH is reused only when its version exactly matches.
    required: false
    default: '2.8.0'
  simulator-device:
    description: >-
      Exact simulator device name to boot, e.g. 'iPhone 17 Pro', matched
      against `xcrun simctl list devices available` with no fuzzy matching —
      fails closed, listing the available devices, when no exact match
      exists. Leave empty (default) to keep the previous behavior of
      booting the last available iPhone-family device by list order, a
      heuristic that silently changes which device a flow runs against
      whenever the runner pool's provisioned device set changes. Pinning
      requires the device set to be provisioned identically across every
      host in the pool.
    required: false
    default: ''
  artifacts-dir:
    description: Directory Maestro debug output and final-state capture is written to.
    required: true
  artifact-name:
    description: Uploaded artifact name.
    required: true
  retention-days:
    description: Uploaded artifact retention in days.
    required: false
    default: '7'
runs:
  using: composite
  steps:
    - name: Configure Maestro debug output directory
      shell: bash
      env:
        MAESTRO_DEBUG_OUTPUT_DIRECTORY: ${{ inputs.artifacts-dir }}
      run: |
          mkdir -p "$MAESTRO_DEBUG_OUTPUT_DIRECTORY"
          echo "MAESTRO_DEBUG_OUTPUT_DIRECTORY=$MAESTRO_DEBUG_OUTPUT_DIRECTORY" >> "$GITHUB_ENV"

    - name: Boot iOS Simulator
      shell: bash
      env:
        SIMULATOR_DEVICE: ${{ inputs.simulator-device }}
      run: |
          set -euo pipefail
          available_devices=$(xcrun simctl list devices available)
          device_name_of() {
            printf '%s\n' "$1" \
              | sed -E 's/^[[:space:]]+//' \
              | sed -E 's/[[:space:]]+$//' \
              | sed -E 's/ \([0-9A-Fa-f]{8}(-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}\) \([A-Za-z ]+\)$//'
          }
          if [ -n "$SIMULATOR_DEVICE" ]; then
            device_line=''
            while IFS= read -r line; do
              udid=$(grep -oE '[0-9A-Fa-f]{8}(-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}' <<< "$line" || true)
              [ -n "$udid" ] || continue
              if [ "$(device_name_of "$line")" = "$SIMULATOR_DEVICE" ]; then
                device_line="$line"
                break
              fi
            done <<< "$available_devices"
            if [ -z "$device_line" ]; then
              echo "::error::simulator-device '$SIMULATOR_DEVICE' has no exact match among available simulators. Available devices:"
              echo "$available_devices"
              exit 1
            fi
          else
            device_line=$(grep -E '^\s+iPhone.*\(' <<< "$available_devices" | tail -1)
            test -n "$device_line"
            echo "::notice::No simulator-device pinned; booted '$(device_name_of "$device_line")' via the last-available heuristic. Pin simulator-device to stop this choice from silently changing when the runner pool's device set changes."
          fi
          device_udid=$(grep -oE '[0-9A-Fa-f]{8}(-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}' <<< "$device_line")
          test -n "$device_udid"
          command -v perl >/dev/null 2>&1 || { echo "::error::'perl' is required to bound 'xcrun simctl bootstatus' with a timeout but is not on PATH (macOS ships it by default; something removed it from this runner)."; exit 1; }
          echo "Booting simulator: $device_line"
          xcrun simctl boot "$device_udid" || true
          bootstatus_timeout_seconds=300
          if perl -e 'alarm shift; exec @ARGV' "$bootstatus_timeout_seconds" xcrun simctl bootstatus "$device_udid" -b; then
            :
          else
            bootstatus_exit=$?
            if [ "$bootstatus_exit" -eq 142 ]; then
              echo "::error::xcrun simctl bootstatus timed out after ${bootstatus_timeout_seconds}s waiting for simulator '$device_udid' to report booted; treating it as wedged."
            else
              echo "::error::xcrun simctl bootstatus failed for simulator '$device_udid' (exit $bootstatus_exit)."
            fi
            exit 1
          fi
          echo "SIMULATOR_UDID=$device_udid" >> "$GITHUB_ENV"

    - name: Install app on simulator
      shell: bash
      env:
        APP_PATH: ${{ inputs.app-path }}
      run: |
          set -euo pipefail
          test -d "$APP_PATH"
          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"

    - name: Warm app before first flow
      if: inputs.app-warm-seconds != '0'
      shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
        APP_WARM_SECONDS: ${{ inputs.app-warm-seconds }}
      run: |
          set -euo pipefail
          case "$APP_WARM_SECONDS" in
            ''|*[!0-9]*|0[0-9]*)
              echo "::error::app-warm-seconds '$APP_WARM_SECONDS' must be a non-negative integer without leading zeros."
              exit 1
              ;;
          esac
          echo "Warming '$APP_ID': launch, settle ${APP_WARM_SECONDS}s, terminate."
          xcrun simctl launch "$SIMULATOR_UDID" "$APP_ID"
          sleep "$APP_WARM_SECONDS"
          if ! xcrun simctl terminate "$SIMULATOR_UDID" "$APP_ID"; then
            if xcrun simctl spawn "$SIMULATOR_UDID" launchctl list 2>/dev/null | grep -qF "UIKitApplication:${APP_ID}["; then
              echo "::error::simctl terminate failed for '$APP_ID' and the app is still running; the first flow would not start from a terminated app."
              exit 1
            fi
            echo "::warning::simctl terminate failed for '$APP_ID'; the app had already exited on its own during the warm-up settle."
          fi

    - name: Run pre-test command
      if: inputs.pre-test-command != ''
      shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
        APP_PATH: ${{ inputs.app-path }}
        PRE_TEST_COMMAND: ${{ inputs.pre-test-command }}
      run: eval "$PRE_TEST_COMMAND"

    - name: Install Maestro
      shell: bash
      env:
        MAESTRO_VERSION: ${{ inputs.maestro-version }}
      run: |
          set -euo pipefail
          if ! printf '%s' "$MAESTRO_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::maestro-version '$MAESTRO_VERSION' must be a plain X.Y.Z version (digits and dots only) to be used safely in a local path and release URL."
            exit 1
          fi
          existing_bin="$(command -v maestro || true)"
          existing_version=''
          if [ -n "$existing_bin" ]; then
            existing_version="$("$existing_bin" --version 2>/dev/null | tail -n 1 | tr -d '\r' || true)"
          fi
          if [ -n "$existing_bin" ] && [ "$existing_version" = "$MAESTRO_VERSION" ]; then
            echo "Using existing maestro $MAESTRO_VERSION already on PATH: $existing_bin"
            exit 0
          fi
          command -v unzip >/dev/null 2>&1 || { echo "::error::'unzip' is required to install the pinned Maestro release but is not on PATH."; exit 1; }

          pinned_root="$HOME/.maestro-pinned"
          pinned_dir="$pinned_root/$MAESTRO_VERSION"
          pinned_bin="$pinned_dir/maestro/bin/maestro"
          lock_dir="$pinned_root/.lock-$MAESTRO_VERSION"
          mkdir -p "$pinned_root"

          version_matches() {
            [ -x "$pinned_bin" ] && [ "$("$pinned_bin" --version 2>/dev/null | tail -n 1 | tr -d '\r' || true)" = "$MAESTRO_VERSION" ]
          }

          if ! version_matches; then
            # Concurrent shards on the same self-hosted host share $HOME (this repo's
            # own actions already note this for debug-output scratch dirs), so two
            # jobs installing the same not-yet-cached MAESTRO_VERSION could otherwise
            # race rm -rf/unzip against each other or against a sibling's in-flight
            # `maestro` invocation. A per-version mkdir-as-mutex lock serializes that;
            # a losing waiter re-checks version_matches so it can skip straight past
            # once the winner finishes instead of installing a second time.
            lock_acquired=''
            lock_deadline=$((SECONDS + 300))
            while :; do
              if mkdir "$lock_dir" 2>/dev/null; then
                lock_acquired=1
                break
              fi
              if version_matches; then
                break
              fi
              if [ "$SECONDS" -ge "$lock_deadline" ]; then
                echo "::error::Timed out waiting for the Maestro install lock '$lock_dir'; a concurrent install on this host may be stuck."
                exit 1
              fi
              sleep 2
            done

            if [ -n "$lock_acquired" ]; then
              cleanup() {
                [ -n "${scratch_dir:-}" ] && rm -rf "$scratch_dir"
                [ -n "${staging_dir:-}" ] && rm -rf "$staging_dir"
                rmdir "$lock_dir" 2>/dev/null || true
              }
              trap cleanup EXIT

              if ! version_matches; then
                download_url="https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
                checksum_url="https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/checksums_sha256.txt"
                scratch_dir="$(mktemp -d)"
                zip_path="$scratch_dir/maestro.zip"

                http_status="$(curl -sSL --retry 3 --retry-connrefused --max-time 300 -w '%{http_code}' -o "$zip_path" "$download_url")"
                curl_exit=$?
                if [ "$curl_exit" -ne 0 ] || [ "$http_status" != "200" ]; then
                  echo "::error::Download of maestro-version '$MAESTRO_VERSION' from '$download_url' failed (curl exit $curl_exit, HTTP status '$http_status'). Confirm a 'cli-$MAESTRO_VERSION' release publishing a maestro.zip asset exists at https://github.com/mobile-dev-inc/Maestro/releases."
                  exit 1
                fi

                checksum_status="$(curl -sSL --retry 3 --retry-connrefused --max-time 60 -w '%{http_code}' -o "$scratch_dir/checksums_sha256.txt" "$checksum_url")"
                checksum_curl_exit=$?
                if [ "$checksum_curl_exit" -eq 0 ] && [ "$checksum_status" = "200" ]; then
                  expected_sha="$(awk '$2 == "maestro.zip" { print $1 }' "$scratch_dir/checksums_sha256.txt")"
                  if [ -z "$expected_sha" ]; then
                    echo "::error::checksums_sha256.txt for cli-$MAESTRO_VERSION has no maestro.zip entry; refusing to install an unverifiable download."
                    exit 1
                  fi
                  if command -v sha256sum >/dev/null 2>&1; then
                    actual_sha="$(sha256sum "$zip_path" | awk '{print $1}')"
                  else
                    actual_sha="$(shasum -a 256 "$zip_path" | awk '{print $1}')"
                  fi
                  if [ "$actual_sha" != "$expected_sha" ]; then
                    echo "::error::maestro.zip checksum mismatch for cli-$MAESTRO_VERSION: expected $expected_sha, got $actual_sha."
                    exit 1
                  fi
                elif [ "$checksum_status" = "404" ]; then
                  echo "::warning::mobile-dev-inc/Maestro cli-$MAESTRO_VERSION did not publish checksums_sha256.txt (404); proceeding on the TLS-verified download from the official GitHub release only."
                else
                  echo "::error::Failed to retrieve checksums_sha256.txt for cli-$MAESTRO_VERSION from '$checksum_url' (curl exit $checksum_curl_exit, HTTP status '$checksum_status'). Refusing to install an unverifiable download."
                  exit 1
                fi

                staging_dir="$(mktemp -d "$pinned_root/.staging-XXXXXX")"
                unzip -q "$zip_path" -d "$staging_dir"
                chmod +x "$staging_dir/maestro/bin/maestro" 2>/dev/null || true
                staged_version="$("$staging_dir/maestro/bin/maestro" --version 2>/dev/null | tail -n 1 | tr -d '\r' || true)"
                if [ "$staged_version" != "$MAESTRO_VERSION" ]; then
                  echo "::error::Extracted maestro from cli-$MAESTRO_VERSION's maestro.zip reports version '$staged_version', not the pinned $MAESTRO_VERSION; the release archive layout may have changed."
                  exit 1
                fi
                rm -rf "$pinned_dir"
                mkdir -p "$pinned_dir"
                mv "$staging_dir/maestro" "$pinned_dir/maestro"
              fi
            fi
          fi

          if [ ! -x "$pinned_bin" ]; then
            echo "::error::Expected a maestro binary at '$pinned_bin' after installing cli-$MAESTRO_VERSION; the install may have failed or been interrupted."
            exit 1
          fi
          resolved_version="$("$pinned_bin" --version 2>/dev/null | tail -n 1 | tr -d '\r' || true)"
          if [ "$resolved_version" != "$MAESTRO_VERSION" ]; then
            echo "::error::maestro at '$pinned_bin' reports version '$resolved_version', not the pinned $MAESTRO_VERSION."
            exit 1
          fi
          echo "$pinned_dir/maestro/bin" >> "$GITHUB_PATH"
          echo "Installed and using maestro $MAESTRO_VERSION at $pinned_bin"

    - name: Run Maestro shard
      id: run-shard
      shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
        FLOWS_DIR: ${{ inputs.flows-dir }}
        FLOWS_MAX_DEPTH: ${{ inputs.flows-max-depth }}
        FLOWS_NAME_PATTERN: ${{ inputs.flows-name-pattern }}
        FLOWS_EXCLUDE_PATTERN: ${{ inputs.flows-exclude-pattern }}
        SHARD_MANIFEST_DIR: ${{ inputs.shard-manifest-dir }}
        SHARD_INDEX: ${{ inputs.shard-index }}
        SHARD_COUNT: ${{ inputs.shard-count }}
        PRE_RUN_FLOW: ${{ inputs.pre-run-flow }}
        FLOW_RECOVERY_FLOW: ${{ inputs.flow-recovery-flow }}
        FLOW_RETRIES: ${{ inputs.flow-retries }}
        MAESTRO_ENV: ${{ inputs.maestro-env }}
        MAESTRO_CONFIG: ${{ inputs.maestro-config }}
      run: |
          set -euo pipefail
          # A shard-private scratch directory passed to every `maestro test`
          # invocation's --debug-output below, rather than relying on
          # Maestro's shared, unscoped ~/.maestro/tests default: two shards
          # (this repo's own concurrent matrix cells, or a different
          # workflow entirely) can share one self-hosted runner's $HOME, and
          # a directory selected by "created since a timestamp marker" can't
          # tell this shard's debug output apart from a sibling's landing in
          # the same window. A path derived from shard-index/run-id/attempt
          # can never collide with another shard's.
          maestro_debug_scratch_dir="$RUNNER_TEMP/maestro-debug-${SHARD_INDEX}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$maestro_debug_scratch_dir"
          echo "MAESTRO_DEBUG_SCRATCH_DIR=$maestro_debug_scratch_dir" >> "$GITHUB_ENV"
          case "$SHARD_COUNT" in
            ''|*[!0-9]*|0[0-9]*)
              echo "::error::shard-count '$SHARD_COUNT' must be a non-negative integer without leading zeros."
              exit 1
              ;;
          esac
          if [ "$SHARD_COUNT" -lt 1 ]; then
            echo "::error::shard-count must be >= 1, got $SHARD_COUNT."
            exit 1
          fi
          case "$SHARD_INDEX" in
            ''|*[!0-9]*|0[0-9]*)
              echo "::error::shard-index '$SHARD_INDEX' must be a non-negative integer without leading zeros."
              exit 1
              ;;
          esac
          if [ "$SHARD_INDEX" -ge "$SHARD_COUNT" ]; then
            echo "::error::shard-index $SHARD_INDEX is out of range [0, $SHARD_COUNT)."
            exit 1
          fi
          case "$FLOW_RETRIES" in
            ''|*[!0-9]*|0[0-9]*)
              echo "::error::flow-retries '$FLOW_RETRIES' must be a non-negative integer without leading zeros."
              exit 1
              ;;
          esac
          max_attempts=$((1 + FLOW_RETRIES))
          case "$FLOWS_MAX_DEPTH" in
            ''|*[!0-9]*|0[0-9]*)
              echo "::error::flows-max-depth '$FLOWS_MAX_DEPTH' must be a non-negative integer without leading zeros."
              exit 1
              ;;
          esac

          if [ -n "$PRE_RUN_FLOW" ]; then
            test -f "$PRE_RUN_FLOW" || { echo "::error::pre-run-flow '$PRE_RUN_FLOW' is not a file."; exit 1; }
          fi

          if [ -n "$FLOW_RECOVERY_FLOW" ]; then
            test -f "$FLOW_RECOVERY_FLOW" || { echo "::error::flow-recovery-flow '$FLOW_RECOVERY_FLOW' is not a file."; exit 1; }
          fi

          maestro_config_args=()
          if [ -n "$MAESTRO_CONFIG" ]; then
            test -f "$MAESTRO_CONFIG" || { echo "::error::maestro-config '$MAESTRO_CONFIG' is not a file."; exit 1; }
            case "$MAESTRO_CONFIG" in
              /*) ;;
              *) MAESTRO_CONFIG="$PWD/$MAESTRO_CONFIG" ;;
            esac
            maestro_config_args=(--config "$MAESTRO_CONFIG")
          fi

          maestro_env_args=()
          if [ -n "$MAESTRO_ENV" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              case "$line" in
                *=*) ;;
                *)
                  echo "::error::maestro-env line '$line' is missing '='; expected KEY=VALUE."
                  exit 1
                  ;;
              esac
              name="${line%%=*}"
              case "$name" in
                ''|[!A-Za-z_]*)
                  echo "::error::maestro-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                  exit 1
                  ;;
              esac
              case "$name" in
                *[!A-Za-z0-9_]*)
                  echo "::error::maestro-env variable name '$name' must match ^[A-Za-z_][A-Za-z0-9_]*\$."
                  exit 1
                  ;;
              esac
              maestro_env_args+=(-e "$line")
            done <<< "$MAESTRO_ENV"
          fi

          summary_rows=()
          recovery_runs=0
          recovery_failures=0

          run_flow_recovery() {
            local after="$1"
            [ -n "$FLOW_RECOVERY_FLOW" ] || return 0
            recovery_runs=$((recovery_runs + 1))
            echo "Running recovery flow '$FLOW_RECOVERY_FLOW' after the failed attempt of '$after'."
            if ! maestro test -e "APP_ID=$APP_ID" --debug-output "$maestro_debug_scratch_dir" ${maestro_env_args[@]+"${maestro_env_args[@]}"} ${maestro_config_args[@]+"${maestro_config_args[@]}"} "$FLOW_RECOVERY_FLOW"; then
              recovery_failures=$((recovery_failures + 1))
              echo "::warning::Recovery flow '$FLOW_RECOVERY_FLOW' failed after '$after'; continuing anyway because recovery is best-effort."
            fi
          }

          run_flow_with_retries() {
            local flow="$1" label="$2" recover_after_last_attempt="$3" attempts=0 status=failed start end duration
            local recovery_seconds=0 recovery_start
            start=$(date +%s)
            while [ "$attempts" -lt "$max_attempts" ]; do
              attempts=$((attempts + 1))
              if maestro test -e "APP_ID=$APP_ID" --debug-output "$maestro_debug_scratch_dir" ${maestro_env_args[@]+"${maestro_env_args[@]}"} ${maestro_config_args[@]+"${maestro_config_args[@]}"} "$flow"; then
                status=passed
                break
              fi
              if [ "$attempts" -lt "$max_attempts" ] || [ "$recover_after_last_attempt" = '1' ]; then
                recovery_start=$(date +%s)
                run_flow_recovery "$label"
                recovery_seconds=$((recovery_seconds + $(date +%s) - recovery_start))
              fi
            done
            end=$(date +%s)
            duration=$((end - start - recovery_seconds))
            summary_rows+=("| $label | ${duration}s | $status | $attempts |")
            [ "$status" = "passed" ]
          }

          write_summary() {
            {
              echo "### Maestro flow timing (shard $SHARD_INDEX)"
              echo "| Flow | Duration | Status | Attempts |"
              echo "| --- | --- | --- | --- |"
              printf '%s\n' "${summary_rows[@]:-}"
              if [ -n "$FLOW_RECOVERY_FLOW" ]; then
                echo ""
                echo "Recovery flow \`$(basename "$FLOW_RECOVERY_FLOW")\` ran $recovery_runs time(s) after a failed attempt, $recovery_failures of which failed and were tolerated. Its duration is excluded from the rows above."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # Only files matching flows-name-pattern within flows-max-depth are
          # runnable scenarios. The default (max-depth 1) keeps reusable
          # subflows and capture-only flows conventionally kept in
          # subdirectories of the flows dir out of the shard; those expect a
          # caller to pass env or leave the app mid-journey, so running them
          # standalone fails.
          find_cmd=(find "$FLOWS_DIR")
          if [ "$FLOWS_MAX_DEPTH" != '0' ]; then
            find_cmd+=(-maxdepth "$FLOWS_MAX_DEPTH")
          fi
          find_cmd+=(-type f)
          IFS=' ' read -r -a name_patterns <<< "$FLOWS_NAME_PATTERN"
          name_args=('(')
          for i in "${!name_patterns[@]}"; do
            if [ "$i" -gt 0 ]; then
              name_args+=(-o)
            fi
            name_args+=(-name "${name_patterns[$i]}")
          done
          name_args+=(')')
          find_cmd+=("${name_args[@]}")
          if [ -n "$FLOWS_EXCLUDE_PATTERN" ]; then
            find_cmd+=(! -name "$FLOWS_EXCLUDE_PATTERN")
          fi
          flows=()
          while IFS= read -r flow; do
            flows+=("$flow")
          done < <("${find_cmd[@]}" | sort)
          if [ "${#flows[@]}" -eq 0 ]; then
            echo "::error::No flows matching '$FLOWS_NAME_PATTERN' found under flows-dir '$FLOWS_DIR' (flows-max-depth=$FLOWS_MAX_DEPTH)."
            exit 1
          fi
          printf 'Resolved flow list (%s total):\n%s\n' "${#flows[@]}" "${flows[*]}"

          # pre-run-flow (run once as priming below) and flow-recovery-flow (run on
          # demand after a failed attempt) are not runnable scenarios. Whenever
          # discovery above also finds either of them - a top-level match, or a match
          # at any depth once flows-max-depth is raised - this filter is what stops
          # the manifest or modulo split from selecting it and running it a second
          # time as a scenario of its own. Compare with -ef (same-inode test) since
          # the input and the discovered flow's path string may differ in form
          # (relative vs "./"-prefixed, etc.) while resolving to the same file; -ef
          # is POSIX-available in bash's test on both macOS and Linux, unlike
          # GNU-only realpath -m.
          if [ -n "$PRE_RUN_FLOW" ] || [ -n "$FLOW_RECOVERY_FLOW" ]; then
            remaining_flows=()
            for flow in "${flows[@]}"; do
              if [ -n "$PRE_RUN_FLOW" ] && [ "$flow" -ef "$PRE_RUN_FLOW" ]; then
                continue
              fi
              if [ -n "$FLOW_RECOVERY_FLOW" ] && [ "$flow" -ef "$FLOW_RECOVERY_FLOW" ]; then
                continue
              fi
              remaining_flows+=("$flow")
            done
            flows=(${remaining_flows[@]+"${remaining_flows[@]}"})
          fi

          selected=()
          if [ -n "$SHARD_MANIFEST_DIR" ]; then
            manifest_file="$SHARD_MANIFEST_DIR/shard-$SHARD_INDEX.txt"
            if [ ! -f "$manifest_file" ]; then
              echo "::error::shard-manifest-dir '$SHARD_MANIFEST_DIR' is set but '$manifest_file' is missing for shard-index $SHARD_INDEX."
              exit 1
            fi
            while IFS= read -r rel || [ -n "$rel" ]; do
              rel="${rel%$'\r'}"
              rel="${rel#./}"
              [ -n "$rel" ] || continue
              flow_path="$FLOWS_DIR/$rel"
              match=0
              for candidate in ${flows[@]+"${flows[@]}"}; do
                if [ "$candidate" = "$flow_path" ]; then
                  match=1
                  break
                fi
              done
              if [ "$match" -ne 1 ]; then
                echo "::error::shard-manifest entry '$rel' (resolved '$flow_path') is not among the flows discovered under '$FLOWS_DIR' (flows-max-depth=$FLOWS_MAX_DEPTH, flows-name-pattern='$FLOWS_NAME_PATTERN'); refusing an entry that bypasses discovery."
                exit 1
              fi
              selected+=("$flow_path")
            done < "$manifest_file"
          else
            for index in "${!flows[@]}"; do
              if (( index % SHARD_COUNT == SHARD_INDEX )); then
                selected+=("${flows[$index]}")
              fi
            done
          fi

          if [ -n "$PRE_RUN_FLOW" ]; then
            if ! run_flow_with_retries "$PRE_RUN_FLOW" "$(basename "$PRE_RUN_FLOW") (priming)" 0; then
              write_summary
              echo "::error::Priming flow '$PRE_RUN_FLOW' failed; aborting shard $SHARD_INDEX."
              exit 1
            fi
          fi

          if [ "${#selected[@]}" -eq 0 ]; then
            echo "Shard $SHARD_INDEX has no flows; nothing to run."
            write_summary
            exit 0
          fi
          printf 'Shard %s flows:\n%s\n' "$SHARD_INDEX" "${selected[*]}"

          overall_status=0
          last_flow_index=$(( ${#selected[@]} - 1 ))
          for flow_index in "${!selected[@]}"; do
            flow="${selected[$flow_index]}"
            recover_after_last_attempt=1
            if [ "$flow_index" -eq "$last_flow_index" ]; then
              recover_after_last_attempt=0
            fi
            if ! run_flow_with_retries "$flow" "$(basename "$flow")" "$recover_after_last_attempt"; then
              overall_status=1
            fi
          done

          write_summary
          exit "$overall_status"

    - name: Capture final simulator state
      if: always()
      shell: bash
      env:
        SHARD_OUTCOME: ${{ steps.run-shard.outcome }}
      run: |
          mkdir -p "$MAESTRO_DEBUG_OUTPUT_DIRECTORY"
          if command -v perl >/dev/null 2>&1; then
            perl -e 'alarm shift; exec @ARGV' 30 xcrun simctl io "$SIMULATOR_UDID" screenshot "$MAESTRO_DEBUG_OUTPUT_DIRECTORY/final-screen.png" || echo "::warning::xcrun simctl io screenshot timed out or failed for simulator '$SIMULATOR_UDID'; continuing without it."
          else
            echo "::warning::'perl' is not on PATH; skipping the bounded final-screen screenshot capture."
          fi
          if [ "$SHARD_OUTCOME" = "failure" ] && [ -n "${MAESTRO_DEBUG_SCRATCH_DIR:-}" ] && [ -d "$MAESTRO_DEBUG_SCRATCH_DIR" ] && [ -n "$(ls -A "$MAESTRO_DEBUG_SCRATCH_DIR" 2>/dev/null)" ]; then
            debug_size_kb=$(du -sck "$MAESTRO_DEBUG_SCRATCH_DIR" 2>/dev/null | tail -1 | awk '{print $1}')
            max_debug_kb=$((200 * 1024))
            if [ "${debug_size_kb:-0}" -gt "$max_debug_kb" ]; then
              echo "::warning::Maestro debug output for this shard is ${debug_size_kb}KB, exceeding the 200MB cap; skipping copy into artifacts."
            else
              mkdir -p "$MAESTRO_DEBUG_OUTPUT_DIRECTORY/maestro-debug"
              cp -R "$MAESTRO_DEBUG_SCRATCH_DIR/." "$MAESTRO_DEBUG_OUTPUT_DIRECTORY/maestro-debug/"
              for hidden_entry in "$MAESTRO_DEBUG_OUTPUT_DIRECTORY/maestro-debug"/.[!.]* "$MAESTRO_DEBUG_OUTPUT_DIRECTORY/maestro-debug"/..?*; do
                [ -e "$hidden_entry" ] || continue
                hidden_base=$(basename "$hidden_entry")
                visible_entry="$MAESTRO_DEBUG_OUTPUT_DIRECTORY/maestro-debug/dot-${hidden_base#.}"
                rm -rf "$visible_entry"
                mv "$hidden_entry" "$visible_entry"
              done
            fi
          fi
          if [ -n "${MAESTRO_DEBUG_SCRATCH_DIR:-}" ]; then
            rm -rf "$MAESTRO_DEBUG_SCRATCH_DIR" || true
          fi

    - name: Shutdown simulator
      if: always()
      shell: bash
      run: |
          if command -v perl >/dev/null 2>&1; then
            perl -e 'alarm shift; exec @ARGV' 30 xcrun simctl shutdown "$SIMULATOR_UDID" || echo "::warning::xcrun simctl shutdown timed out or failed for simulator '$SIMULATOR_UDID'."
          else
            echo "::warning::'perl' is not on PATH; skipping the bounded simulator shutdown."
          fi

    - name: Upload Maestro artifacts
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifacts-dir }}/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: ${{ inputs.retention-days }}
