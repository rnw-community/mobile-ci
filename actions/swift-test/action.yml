name: swift-test
description: >-
  Runs a Swift Package's test suite with `swift test --parallel`, caching the
  package's `.build` directory on the same toolchain+fingerprint key scheme
  xcode-cache uses, and publishes a pass/fail step summary.
inputs:
  package-path:
    description: Directory holding Package.swift.
    required: false
    default: .
  extra-args:
    description: Additional arguments appended to `swift test --parallel`.
    required: false
    default: ''
  toolchain:
    description: >-
      Cache-key segment identifying the toolchain, e.g. setup-xcode-pinned's
      toolchain-key output (xcode-26.4.1-17E202).
    required: true
  cache:
    description: Restore and save the package's `.build` directory.
    required: false
    default: 'true'
  backend:
    description: '`github` (actions/cache) or `local` (a directory under local-dir).'
    required: false
    default: github
  local-dir:
    description: Directory holding the cache entries when backend is `local`.
    required: false
    default: ''
  fingerprint-paths:
    description: >-
      Newline- or space-separated globs, resolved against package-path, whose
      contents are hashed into the `.build` cache key.
    required: false
    default: |
      Package.swift
      Package.resolved
  key-prefix:
    description: Cache-key namespace, bumped to invalidate every entry at once.
    required: false
    default: swift-build-v1
outputs:
  cache-hit:
    description: '`true` when an exact-key `.build` cache entry was restored.'
    value: ${{ steps.restore.outputs.cache-hit || steps.local-restore.outputs.cache-hit }}
  cache-key:
    description: The computed `.build` cache key.
    value: ${{ steps.key.outputs.key }}
runs:
  using: composite
  steps:
    - name: Compute Swift build cache key
      if: inputs.cache == 'true'
      id: key
      shell: bash
      env:
        BACKEND: ${{ inputs.backend }}
        LOCAL_DIR: ${{ inputs.local-dir }}
        PACKAGE_PATH: ${{ inputs.package-path }}
        TOOLCHAIN: ${{ inputs.toolchain }}
        FINGERPRINT_PATHS: ${{ inputs.fingerprint-paths }}
        KEY_PREFIX: ${{ inputs.key-prefix }}
      run: |
        set -euo pipefail
        case "$BACKEND" in
          github) ;;
          local)
            if [ -z "$LOCAL_DIR" ]; then
              echo "::error::backend 'local' requires local-dir."
              exit 1
            fi
            ;;
          *) echo "::error::backend must be 'github' or 'local' (got '$BACKEND')."; exit 1 ;;
        esac
        cd "$PACKAGE_PATH"
        test -f Package.swift || { echo "::error::No Package.swift under '$PACKAGE_PATH'."; exit 1; }
        matched="${RUNNER_TEMP}/swift-test-fingerprint-$$.list"
        : > "$matched"
        while IFS= read -r pattern; do
          case "$pattern" in
            '') continue ;;
            '**/'*)
              name="${pattern#\*\*/}"
              case "$name" in
                */*) echo "::error::fingerprint-paths pattern '$pattern' puts a path separator after '**/'; only a bare filename glob is supported there."; exit 1 ;;
              esac
              find . -type f -name "$name" -print \
                | { grep -Ev '^\./(\.git|\.build)/' || true; } >> "$matched"
              ;;
            *'*'*|*'?'*|*'['*)
              # shellcheck disable=SC2086
              for candidate in $pattern; do
                [ -f "$candidate" ] && printf '%s\n' "$candidate" >> "$matched"
              done
              ;;
            *)
              [ -f "$pattern" ] && printf '%s\n' "$pattern" >> "$matched"
              ;;
          esac
        done < <(printf '%s\n' "$FINGERPRINT_PATHS" | tr '[:blank:]' '\n')
        count=$(LC_ALL=C sort -u "$matched" | grep -c . || true)
        if [ "$count" -eq 0 ]; then
          echo "::error::fingerprint-paths matched no files under '$PACKAGE_PATH'; a cache key over an empty fingerprint would collide across unrelated packages."
          rm -f "$matched"
          exit 1
        fi
        fingerprint=$(
          LC_ALL=C sort -u "$matched" \
            | tr '\n' '\0' \
            | xargs -0 shasum -a 256 \
            | shasum -a 256 \
            | cut -c1-40
        )
        rm -f "$matched"
        test -n "$fingerprint"
        echo "Fingerprinted ${count} file(s) into $fingerprint"
        echo "key=${KEY_PREFIX}-${RUNNER_OS}-${TOOLCHAIN}-${fingerprint}" >> "$GITHUB_OUTPUT"

    - name: Restore .build from GitHub
      if: inputs.cache == 'true' && inputs.backend == 'github'
      id: restore
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
          path: ${{ inputs.package-path }}/.build
          key: ${{ steps.key.outputs.key }}

    - name: Restore .build from the local directory
      if: inputs.cache == 'true' && inputs.backend == 'local'
      id: local-restore
      shell: bash
      env:
        LOCAL_DIR: ${{ inputs.local-dir }}
        CACHE_KEY: ${{ steps.key.outputs.key }}
        PACKAGE_PATH: ${{ inputs.package-path }}
      run: |
        set -euo pipefail
        command -v rsync >/dev/null 2>&1 || { echo "::error::'rsync' is required by the local cache backend but is not on PATH."; exit 1; }
        cd "$PACKAGE_PATH"
        entry="$LOCAL_DIR/$CACHE_KEY"
        if [ ! -f "$entry/.complete" ]; then
          echo "cache-hit=false" >> "$GITHUB_OUTPUT"
          echo "Local cache miss for $CACHE_KEY"
          exit 0
        fi
        mkdir -p .build
        rsync -a --delete "$entry/build/" .build/
        echo "cache-hit=true" >> "$GITHUB_OUTPUT"
        echo "Local cache hit for $CACHE_KEY"

    - name: Run swift test
      id: test
      shell: bash
      env:
        PACKAGE_PATH: ${{ inputs.package-path }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
      run: |
        set -euo pipefail
        cd "$PACKAGE_PATH"
        swift --version
        log="${RUNNER_TEMP}/swift-test-$$.log"
        status=0
        # shellcheck disable=SC2086
        swift test --parallel $EXTRA_ARGS 2>&1 | tee "$log" || status="${PIPESTATUS[0]}"
        echo "log=$log" >> "$GITHUB_OUTPUT"
        echo "status=$status" >> "$GITHUB_OUTPUT"
        exit "$status"

    - name: Publish the swift test summary
      if: always() && steps.test.outputs.log != ''
      shell: bash
      env:
        PACKAGE_PATH: ${{ inputs.package-path }}
        TEST_LOG: ${{ steps.test.outputs.log }}
        TEST_STATUS: ${{ steps.test.outputs.status }}
      run: |
        set -euo pipefail
        if [ "${TEST_STATUS:-1}" = '0' ]; then
          verdict='passed'
        else
          verdict='failed'
        fi
        {
          echo "### swift test — \`$PACKAGE_PATH\` ($verdict)"
          echo
          echo '```text'
          grep -E '^(Test Suite .* (passed|failed)|Executed [0-9]+ test|.*Test run with [0-9]+ test)' "$TEST_LOG" | tail -40 || true
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        rm -f "$TEST_LOG"

    - name: Save .build to GitHub
      if: inputs.cache == 'true' && inputs.backend == 'github' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
          path: ${{ inputs.package-path }}/.build
          key: ${{ steps.key.outputs.key }}

    - name: Save .build to the local directory
      if: inputs.cache == 'true' && inputs.backend == 'local' && steps.local-restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        LOCAL_DIR: ${{ inputs.local-dir }}
        CACHE_KEY: ${{ steps.key.outputs.key }}
        PACKAGE_PATH: ${{ inputs.package-path }}
      run: |
        set -euo pipefail
        command -v rsync >/dev/null 2>&1 || { echo "::error::'rsync' is required by the local cache backend but is not on PATH."; exit 1; }
        cd "$PACKAGE_PATH"
        test -d .build || { echo "::warning::No .build directory to save."; exit 0; }
        mkdir -p "$LOCAL_DIR"
        entry="$LOCAL_DIR/$CACHE_KEY"
        staging="$LOCAL_DIR/.staging-$$-${GITHUB_RUN_ID:-0}-${GITHUB_RUN_ATTEMPT:-0}"
        superseded="$LOCAL_DIR/.superseded-$$-${GITHUB_RUN_ID:-0}-${GITHUB_RUN_ATTEMPT:-0}"
        rm -rf "$staging" "$superseded"
        mkdir -p "$staging/build"
        rsync -a .build/ "$staging/build/"
        date -u '+%Y-%m-%dT%H:%M:%SZ' > "$staging/.complete"
        if [ -e "$entry" ]; then
          mv "$entry" "$superseded"
        fi
        mv "$staging" "$entry"
        rm -rf "$superseded"
        echo "Saved the local cache entry $CACHE_KEY"
