name: turbo-affected
description: >-
  Detects whether any of a set of target packages is affected relative to a
  base SHA, using a pinned `turbo` version. Fails closed: a detection failure
  is never reported as an unaffected/skip result.
inputs:
  turbo-version:
    description: >-
      Exact turbo npm version invoked via `npx turbo@<version>`. Empty resolves the
      repository's own turbo: node_modules/turbo, then pnpm-lock.yaml, package-lock.json,
      npm-shrinkwrap.json, yarn.lock, bun.lock, then an exact root package.json version,
      else 2.10.8 with a notice.
    required: false
    default: ''
  target-packages:
    description: >-
      Newline-separated package names; affected if any of these is in the affected set.
      Empty derives them from the `name` in each `targets[].appDir`'s package.json.
    required: false
    default: ''
  targets:
    description: >-
      JSON array of build targets, each with an `appDir` relative to the working directory.
      Read only when `target-packages` is empty.
    required: false
    default: ''
  base-sha:
    description: Base SHA for the affected computation (maps to TURBO_SCM_BASE). Empty means "always affected".
    required: false
    default: ''
  exempt-paths:
    description: >-
      Newline- or comma-separated git pathspec globs relative to the repository root
      (e.g. `docs/**`, `**/*.md`). When every file changed since `base-sha` matches one,
      reports unaffected without running turbo.
    required: false
    default: ''
  trigger-paths:
    description: >-
      Newline- or comma-separated git pathspec globs relative to the repository root
      (e.g. `.github/workflows/e2e.yml`, `**`). When any file changed since `base-sha`
      matches one, reports affected without running turbo. Wins over `exempt-paths`.
    required: false
    default: ''
  always-affected:
    description: When `true`, skips the turbo computation and reports affected unconditionally (e.g. non-PR events).
    required: false
    default: 'false'
  force-label:
    description: >-
      Pull request label that forces the pipeline: when the triggering pull request carries it,
      reports affected and forced without running detection. Empty (default) never forces.
    required: false
    default: ''
outputs:
  affected:
    description: '`true` or `false` — whether any target package is affected.'
    value: ${{ steps.detect.outputs.affected }}
  turbo-version:
    description: The turbo version detection ran; empty when turbo did not run.
    value: ${{ steps.detect.outputs.turbo-version }}
  forced:
    description: '`true` when `force-label` is on the pull request and forced `affected=true`, else `false`.'
    value: ${{ steps.detect.outputs.forced }}
runs:
  using: composite
  steps:
    - name: Compute affected packages
      id: detect
      shell: bash
      env:
        TURBO_VERSION: ${{ inputs.turbo-version }}
        TARGET_PACKAGES: ${{ inputs.target-packages }}
        TARGETS: ${{ inputs.targets }}
        TURBO_SCM_BASE: ${{ inputs.base-sha }}
        ALWAYS_AFFECTED: ${{ inputs.always-affected }}
        EXEMPT_PATHS: ${{ inputs.exempt-paths }}
        TRIGGER_PATHS: ${{ inputs.trigger-paths }}
        FORCE_LABEL: ${{ inputs.force-label }}
      run: |
        set -euo pipefail
        if [ -n "$FORCE_LABEL" ]; then
          labelled=$(node -e '
            const { readFileSync } = require("node:fs");
            let event;
            try {
              event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
            } catch (error) {
              process.stderr.write(`::error::force-label is set but the event payload cannot be read: ${error.message}\n`);
              process.exit(1);
            }
            const labels = (event.pull_request?.labels ?? []).map(label => label?.name);
            process.stdout.write(String(labels.includes(process.env.FORCE_LABEL)));
          ')
          if [ "$labelled" = 'true' ]; then
            echo 'affected=true' >> "$GITHUB_OUTPUT"
            echo 'forced=true' >> "$GITHUB_OUTPUT"
            echo "::notice::The pull request carries the '${FORCE_LABEL}' label: reporting affected (forced) without detection."
            exit 0
          fi
        fi
        echo 'forced=false' >> "$GITHUB_OUTPUT"
        if [ "$ALWAYS_AFFECTED" = 'true' ]; then
          echo 'affected=true' >> "$GITHUB_OUTPUT"
          echo 'always-affected input set: skipping turbo detection.'
          exit 0
        fi
        if [ -z "$(printf '%s' "$TARGET_PACKAGES" | tr -d '[:space:]')" ]; then
          TARGET_PACKAGES=$(node -e '
            const { readFileSync } = require("node:fs");
            const path = require("node:path");
            const fail = message => {
              process.stderr.write(`::error::${message}\n`);
              process.exit(1);
            };
            let targets;
            try {
              targets = JSON.parse(process.env.TARGETS || "[]");
            } catch (error) {
              fail(`targets is not valid JSON: ${error.message}`);
            }
            if (!Array.isArray(targets) || targets.length === 0) {
              fail("target-packages is empty and targets names no appDir to derive it from.");
            }
            const names = targets.map((target, index) => {
              const appDir = target?.appDir;
              if (typeof appDir !== "string" || appDir.trim() === "") {
                fail(`targets[${index}] has no appDir to derive a target package from.`);
              }
              if (path.resolve(appDir) === process.cwd()) {
                fail(`targets[${index}].appDir is the repository root, which turbo never reports as affected; set target-packages.`);
              }
              const manifest = path.join(appDir, "package.json");
              let name;
              try {
                name = JSON.parse(readFileSync(manifest, "utf8")).name;
              } catch (error) {
                fail(`Cannot read ${manifest}: ${error.message}`);
              }
              if (typeof name !== "string" || name.trim() === "") {
                fail(`${manifest} has no name to use as a target package.`);
              }
              return name;
            });
            process.stdout.write([...new Set(names)].join("\n"));
          ')
          printf 'target-packages derived from targets[].appDir:\n%s\n' "$TARGET_PACKAGES"
        fi
        if [ -z "$TURBO_SCM_BASE" ]; then
          echo 'affected=true' >> "$GITHUB_OUTPUT"
          echo 'No base SHA: reporting affected without turbo detection.'
          exit 0
        fi
        glob_list() {
          printf '%s\n' "$1" | tr ',' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | sed '/^$/d'
        }
        if glob_list "$TRIGGER_PATHS" | grep -qxF '**'; then
          echo 'affected=true' >> "$GITHUB_OUTPUT"
          echo 'trigger-paths includes **: reporting affected without turbo detection.'
          echo 'affected=true'
          exit 0
        fi
        if [ -n "$(glob_list "$TRIGGER_PATHS")" ]; then
          set --
          while IFS= read -r glob; do
            set -- "$@" ":(top,glob)$glob"
          done <<TRIGGER_GLOBS
        $(glob_list "$TRIGGER_PATHS")
        TRIGGER_GLOBS
          diff_error=$(mktemp)
          if ! triggered=$(git diff --no-renames --name-only "${TURBO_SCM_BASE}...HEAD" -- "$@" 2> "$diff_error"); then
            echo 'affected=true' >> "$GITHUB_OUTPUT"
            echo "::warning::Cannot diff ${TURBO_SCM_BASE}...HEAD to apply trigger-paths; reporting affected without turbo detection. $(tr '\n' ' ' < "$diff_error")"
            echo 'affected=true'
            exit 0
          fi
          if [ -n "$triggered" ]; then
            echo 'affected=true' >> "$GITHUB_OUTPUT"
            printf 'Changed files matching trigger-paths: reporting affected without turbo detection.\n%s\n' "$(printf '%s\n' "$triggered" | sed 's/^/  /')"
            echo 'affected=true'
            exit 0
          fi
          echo 'No changed file matches trigger-paths.'
        fi
        if [ -n "$(glob_list "$EXEMPT_PATHS")" ]; then
          set --
          exempt_globs=''
          while IFS= read -r glob; do
            set -- "$@" ":(top,exclude,glob)$glob"
            exempt_globs="${exempt_globs}  ${glob}
        "
          done <<EXEMPT_GLOBS
        $(glob_list "$EXEMPT_PATHS")
        EXEMPT_GLOBS
          diff_error=$(mktemp)
          if changed=$(git diff --no-renames --name-only "${TURBO_SCM_BASE}...HEAD" 2> "$diff_error") \
            && remaining=$(git diff --no-renames --name-only "${TURBO_SCM_BASE}...HEAD" -- ':/' "$@" 2>> "$diff_error"); then
            if [ -n "$changed" ] && [ -z "$remaining" ]; then
              echo 'affected=false' >> "$GITHUB_OUTPUT"
              printf 'Every changed file matches exempt-paths: reporting unaffected without turbo detection.\nChanged files:\n%s\nExempt globs:\n%s' "$(printf '%s\n' "$changed" | sed 's/^/  /')" "$exempt_globs"
              echo 'affected=false'
              exit 0
            fi
            if [ -z "$changed" ]; then
              echo "No files changed since ${TURBO_SCM_BASE}: exempt-paths does not apply."
            else
              printf 'Files outside exempt-paths:\n%s\n' "$(printf '%s\n' "$remaining" | sed 's/^/  /')"
            fi
          else
            echo "::warning::Cannot diff ${TURBO_SCM_BASE}...HEAD to apply exempt-paths; running turbo detection. $(tr '\n' ' ' < "$diff_error")"
          fi
        fi
        TURBO_VERSION=$(node -e '
          const { existsSync, readFileSync } = require("node:fs");
          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$/;
          const fail = message => {
            process.stderr.write(`::error::${message}\n`);
            process.exit(1);
          };
          const read = file => (existsSync(file) ? readFileSync(file, "utf8") : null);
          const unquote = value => value.trim().replace(/^[\x27"]|[\x27"]$/g, "");
          const json = (file, text) => {
            try {
              return JSON.parse(text);
            } catch (error) {
              fail(`Cannot parse ${file} to resolve the turbo version: ${error.message}`);
            }
          };
          const installed = text => [json("node_modules/turbo/package.json", text).version];
          const pnpmLock = text => {
            const lines = text.split(/\r?\n/);
            let from = 0;
            let base = 0;
            const importers = lines.indexOf("importers:");
            if (importers >= 0) {
              const root = lines.findIndex((line, index) => index > importers && /^  (\.|[\x27"]\.[\x27"]):\s*$/.test(line));
              from = root < 0 ? lines.length : root + 1;
              base = 4;
            }
            const versions = [];
            const packageKeys = () => lines
              .map(line => line.match(/^  [\x27"]?\/?turbo[@/]([^\s:\x27"(]+)/))
              .filter(Boolean)
              .map(match => match[1]);
            let section = "";
            for (let index = from; index < lines.length; index += 1) {
              const line = lines[index];
              if (line.trim() === "") continue;
              const indent = line.length - line.trimStart().length;
              if (indent < base) break;
              if (indent === base) {
                section = line.trim();
                continue;
              }
              if (indent !== base + 2 || !/^(dependencies|devDependencies|optionalDependencies):$/.test(section)) continue;
              const entry = line.trim().match(/^[\x27"]?turbo[\x27"]?:\s*(.*)$/);
              if (!entry) continue;
              if (entry[1] !== "") {
                versions.push(unquote(entry[1]));
                continue;
              }
              for (let child = index + 1; child < lines.length; child += 1) {
                const nested = lines[child];
                if (nested.length - nested.trimStart().length <= base + 2) break;
                const version = nested.trim().match(/^version:\s*(.+)$/);
                if (version) versions.push(unquote(version[1]));
              }
            }
            return versions.length > 0 ? versions.map(version => version.replace(/\(.*$/, "")) : packageKeys();
          };
          const npmLock = file => text => {
            const lock = json(file, text);
            return [lock.packages?.["node_modules/turbo"]?.version ?? lock.dependencies?.turbo?.version].filter(Boolean);
          };
          const yarnLock = text => {
            const versions = [];
            let inTurbo = false;
            for (const line of text.split(/\r?\n/)) {
              if (/^\S.*:$/.test(line) && !line.startsWith("#")) {
                inTurbo = line.slice(0, -1).split(/,\s*/).some(entry => unquote(entry).startsWith("turbo@"));
                continue;
              }
              const version = inTurbo && line.match(/^\s+version:?\s+(.+)$/);
              if (version) versions.push(unquote(version[1]));
            }
            return versions;
          };
          const bunLock = text => {
            let lock;
            try {
              lock = JSON.parse(text.replace(/,(\s*[}\]])/g, "$1"));
            } catch {
              return [];
            }
            const entry = lock.packages?.turbo?.[0];
            return typeof entry === "string" && entry.startsWith("turbo@") ? [entry.slice("turbo@".length)] : [];
          };
          const manifest = text => {
            const root = json("package.json", text);
            const range = root.devDependencies?.turbo ?? root.dependencies?.turbo;
            return typeof range === "string" && semver.test(range) ? [range] : [];
          };
          const explicit = process.env.TURBO_VERSION.trim();
          let resolved;
          let source;
          if (explicit !== "") {
            resolved = explicit;
            source = "turbo-version input";
          } else {
            const sources = [
              ["node_modules/turbo/package.json", installed],
              ["pnpm-lock.yaml", pnpmLock],
              ["package-lock.json", npmLock("package-lock.json")],
              ["npm-shrinkwrap.json", npmLock("npm-shrinkwrap.json")],
              ["yarn.lock", yarnLock],
              ["bun.lock", bunLock],
              ["package.json", manifest],
            ];
            for (const [file, parse] of sources) {
              const text = read(file);
              if (text === null) continue;
              const versions = [...new Set(parse(text))];
              if (versions.length === 1) {
                resolved = versions[0];
                source = file;
                break;
              }
              if (versions.length > 1) {
                process.stderr.write(`::notice::${file} locks several turbo versions (${versions.join(", ")}); trying the next source.\n`);
              }
            }
            if (resolved === undefined) {
              resolved = "2.10.8";
              source = "fallback";
              process.stderr.write(`::notice::No installed, locked or exact turbo version found; using turbo@${resolved}. Set turbo-version to pin one.\n`);
            }
          }
          if (typeof resolved !== "string" || !semver.test(resolved)) {
            fail(`turbo version ${JSON.stringify(resolved)} from ${source} is not an exact semver version.`);
          }
          process.stderr.write(`Using turbo@${resolved} (from ${source}).\n`);
          process.stdout.write(resolved);
        ')
        echo "turbo-version=${TURBO_VERSION}" >> "$GITHUB_OUTPUT"
        listing=$(mktemp -d)
        turbo_ls() {
          listing_name=$1
          shift
          turbo_status=0
          npx -y "turbo@${TURBO_VERSION}" ls "$@" --output=json > "$listing/$listing_name.json" 2> "$listing/$listing_name.err" || turbo_status=$?
          cat "$listing/$listing_name.err" >&2
          if [ "$turbo_status" -ne 0 ]; then
            echo "turbo exit status ${turbo_status}" >> "$listing/$listing_name.err"
            echo "$turbo_status" > "$listing/$listing_name.status"
          fi
        }
        turbo_ls workspace
        turbo_ls affected --affected
        affected=$(LISTING="$listing" TURBO_VERSION="$TURBO_VERSION" TARGET_PACKAGES="$TARGET_PACKAGES" node -e '
          const { existsSync, readFileSync } = require("node:fs");
          const file = name => `${process.env.LISTING}/${name}`;
          const names = listing => {
            const command = `turbo@${process.env.TURBO_VERSION} ls ${listing === "affected" ? "--affected " : ""}--output=json`;
            const stderr = readFileSync(file(`${listing}.err`), "utf8").trim();
            const report = problem => {
              const detail = `${command} ${problem}; turbo stderr follows.\n${stderr}`;
              process.stderr.write(`::error::${detail.replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A")}\n`);
              process.exit(1);
            };
            if (existsSync(file(`${listing}.status`))) report("failed");
            let parsed;
            try {
              parsed = JSON.parse(readFileSync(file(`${listing}.json`), "utf8"));
            } catch (error) {
              report(`printed no JSON (${error.message})`);
            }
            return (parsed.packages?.items ?? []).map(item => item.name);
          };
          const workspace = names("workspace");
          const changed = names("affected");
          const targets = process.env.TARGET_PACKAGES.split("\n").map(name => name.trim()).filter(Boolean);
          const unknown = targets.filter(name => !workspace.includes(name));
          if (unknown.length > 0) {
            process.stderr.write(`::error::Target packages not in the turbo workspace, so never reported as affected: ${unknown.join(", ")}\n`);
            process.exit(1);
          }
          process.stdout.write(String(changed.some(name => targets.includes(name))));
        ')
        echo "affected=${affected}" >> "$GITHUB_OUTPUT"
        echo "affected=${affected}"
