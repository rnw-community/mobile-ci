name: run-maestro-android
description: >-
  Boots a headless Android emulator, installs a packaged .apk, runs a Maestro
  flow shard, and always captures final-state artifacts.
inputs:
  apk-path:
    description: Path to the packaged .apk to install.
    required: true
  app-id:
    description: Application ID passed to Maestro as APP_ID.
    required: true
  flows-dir:
    description: >-
      Directory whose top-level files are the runnable Maestro flows by
      default. Subdirectories are not searched unless flows-max-depth is
      raised; see flows-max-depth/flows-name-pattern.
    required: true
  flows-max-depth:
    description: >-
      find -maxdepth under flows-dir. Default 1 (top-level only): subflows are
      invoked by parent flows via runFlow, not run directly, and conventionally
      live in subdirectories. Set to 0 for unbounded recursion.
    required: false
    default: '1'
  flows-name-pattern:
    description: >-
      Space-separated find -name globs (OR'd together) selecting runnable
      flows under flows-dir. Defaults to the widespread *.flow.yaml
      convention, which keeps reusable subflows and capture-only flows in
      subdirectories out of the shard.
    required: false
    default: '*.flow.yaml'
  flows-exclude-pattern:
    description: Optional find ! -name glob excluding matched flows by basename.
    required: false
    default: ''
  shard-manifest-dir:
    description: >-
      Optional directory of hand-curated shard-<index>.txt files (one
      flows-dir-relative flow path per line) overriding the computed
      index-modulo split so a consumer's balanced shard assignment survives.
      Unset (default) falls back to the index-modulo split entirely. Once
      set, every shard-index this job can run must have its own
      shard-<index>.txt — a partial manifest fails closed rather than
      silently mixing curated and modulo-selected flows for the shards it
      omits.
    required: false
    default: ''
  shard-index:
    description: Zero-based shard index this job runs.
    required: true
  shard-count:
    description: Total number of shards flows are distributed across.
    required: true
  pre-run-flow:
    description: >-
      Path to a single priming flow run once before this shard's flows,
      excluded from sharding. Its failure fails the step immediately without
      running the shard. Leave empty to skip priming.
    required: false
    default: ''
  flow-recovery-flow:
    description: >-
      Path to a single best-effort recovery flow run after a failed flow
      attempt: before the same flow's next retry attempt, and before the
      next flow starts, so a failure cannot strand the app in a state that
      cascades into the flows after it. Not run after a passing attempt,
      and not after the shard's last flow. Its own failure only logs a
      warning and never fails the shard. Like pre-run-flow it is removed
      from the discovered flow list, so it never also runs as a scenario
      of its own. Leave empty to skip recovery.
    required: false
    default: ''
  pre-test-command:
    description: >-
      Optional consumer-owned shell command run once after the app is
      installed on the emulator and before any flow (including
      pre-run-flow) executes, e.g. seeding a fixture into the app's data
      container. Runs with ANDROID_SERIAL, APP_ID, and APK_PATH in its
      environment. Its failure fails the step immediately. Leave empty to
      skip.
    required: false
    default: ''
  app-warm-seconds:
    description: >-
      Seconds the app is left running during a one-off warm-up performed
      after install and before any flow (including pre-run-flow) runs. The
      app is launched, left to settle this long, then force-stopped, so
      first-launch cold-start cost (JS bundle load, cache priming) is not
      absorbed by the first flow's own timeout budget. Set to '0' to
      disable warming.
    required: false
    default: '20'
  maestro-env:
    description: >-
      Newline-separated KEY=VALUE pairs, each passed as an additional
      -e KEY=VALUE argument to every `maestro test` invocation (pre-run-flow
      and shard flows alike). Rejects (fails closed) any line without '=' or
      whose name does not match ^[A-Za-z_][A-Za-z0-9_]*$.
    required: false
    default: ''
  flow-retries:
    description: >-
      Non-negative retry budget per flow. Each flow gets up to
      1 + flow-retries attempts; a flow that eventually passes counts as
      passed. The step fails if any flow exhausts its attempts.
    required: false
    default: '0'
  maestro-version:
    description: >-
      Pinned Maestro CLI version. Installed by downloading the matching
      cli-<version> release directly from
      https://github.com/mobile-dev-inc/Maestro/releases to
      $HOME/.maestro-pinned/<version>, immune to a pre-existing
      Homebrew-managed maestro on the host. An existing maestro already on
      PATH is reused only when its version exactly matches.
    required: false
    default: '2.8.0'
  api-level:
    description: Android emulator API level.
    required: false
    default: '34'
  target:
    description: Android emulator system image target.
    required: false
    default: google_apis
  arch:
    description: Android emulator system image architecture.
    required: false
    default: x86_64
  profile:
    description: Android emulator hardware profile.
    required: false
    default: pixel_6
  artifacts-dir:
    description: Directory final-state capture (screenshot, logcat) is written to.
    required: true
  artifact-name:
    description: Uploaded artifact name.
    required: true
  retention-days:
    description: Uploaded artifact retention in days.
    required: false
    default: '7'
runs:
  using: composite
  steps:
    - name: Install Maestro
      shell: bash
      env:
        MAESTRO_VERSION: ${{ inputs.maestro-version }}
      run: |
          set -euo pipefail
          if ! printf '%s' "$MAESTRO_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::maestro-version '$MAESTRO_VERSION' must be a plain X.Y.Z version (digits and dots only) to be used safely in a local path and release URL."
            exit 1
          fi
          existing_bin="$(command -v maestro || true)"
          existing_version=''
          if [ -n "$existing_bin" ]; then
            existing_version="$("$existing_bin" --version 2>/dev/null | tail -n 1 | tr -d '\r' || true)"
          fi
          if [ -n "$existing_bin" ] && [ "$existing_version" = "$MAESTRO_VERSION" ]; then
            echo "Using existing maestro $MAESTRO_VERSION already on PATH: $existing_bin"
            exit 0
          fi
          command -v unzip >/dev/null 2>&1 || { echo "::error::'unzip' is required to install the pinned Maestro release but is not on PATH."; exit 1; }

          pinned_root="$HOME/.maestro-pinned"
          pinned_dir="$pinned_root/$MAESTRO_VERSION"
          pinned_bin="$pinned_dir/maestro/bin/maestro"
          lock_dir="$pinned_root/.lock-$MAESTRO_VERSION"
          mkdir -p "$pinned_root"

          version_matches() {
            [ -x "$pinned_bin" ] && [ "$("$pinned_bin" --version 2>/dev/null | tail -n 1 | tr -d '\r' || true)" = "$MAESTRO_VERSION" ]
          }

          if ! version_matches; then
            # Concurrent shards on the same self-hosted host share $HOME (this repo's
            # own actions already note this for debug-output scratch dirs), so two
            # jobs installing the same not-yet-cached MAESTRO_VERSION could otherwise
            # race rm -rf/unzip against each other or against a sibling's in-flight
            # `maestro` invocation. A per-version mkdir-as-mutex lock serializes that;
            # a losing waiter re-checks version_matches so it can skip straight past
            # once the winner finishes instead of installing a second time.
            lock_acquired=''
            lock_deadline=$((SECONDS + 300))
            while :; do
              if mkdir "$lock_dir" 2>/dev/null; then
                lock_acquired=1
                break
              fi
              if version_matches; then
                break
              fi
              if [ "$SECONDS" -ge "$lock_deadline" ]; then
                echo "::error::Timed out waiting for the Maestro install lock '$lock_dir'; a concurrent install on this host may be stuck."
                exit 1
              fi
              sleep 2
            done

            if [ -n "$lock_acquired" ]; then
              cleanup() {
                [ -n "${scratch_dir:-}" ] && rm -rf "$scratch_dir"
                [ -n "${staging_dir:-}" ] && rm -rf "$staging_dir"
                rmdir "$lock_dir" 2>/dev/null || true
              }
              trap cleanup EXIT

              if ! version_matches; then
                download_url="https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
                checksum_url="https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/checksums_sha256.txt"
                scratch_dir="$(mktemp -d)"
                zip_path="$scratch_dir/maestro.zip"

                http_status="$(curl -sSL --retry 3 --retry-connrefused --max-time 300 -w '%{http_code}' -o "$zip_path" "$download_url")"
                curl_exit=$?
                if [ "$curl_exit" -ne 0 ] || [ "$http_status" != "200" ]; then
                  echo "::error::Download of maestro-version '$MAESTRO_VERSION' from '$download_url' failed (curl exit $curl_exit, HTTP status '$http_status'). Confirm a 'cli-$MAESTRO_VERSION' release publishing a maestro.zip asset exists at https://github.com/mobile-dev-inc/Maestro/releases."
                  exit 1
                fi

                checksum_status="$(curl -sSL --retry 3 --retry-connrefused --max-time 60 -w '%{http_code}' -o "$scratch_dir/checksums_sha256.txt" "$checksum_url")"
                checksum_curl_exit=$?
                if [ "$checksum_curl_exit" -eq 0 ] && [ "$checksum_status" = "200" ]; then
                  expected_sha="$(awk '$2 == "maestro.zip" { print $1 }' "$scratch_dir/checksums_sha256.txt")"
                  if [ -z "$expected_sha" ]; then
                    echo "::error::checksums_sha256.txt for cli-$MAESTRO_VERSION has no maestro.zip entry; refusing to install an unverifiable download."
                    exit 1
                  fi
                  if command -v sha256sum >/dev/null 2>&1; then
                    actual_sha="$(sha256sum "$zip_path" | awk '{print $1}')"
                  else
                    actual_sha="$(shasum -a 256 "$zip_path" | awk '{print $1}')"
                  fi
                  if [ "$actual_sha" != "$expected_sha" ]; then
                    echo "::error::maestro.zip checksum mismatch for cli-$MAESTRO_VERSION: expected $expected_sha, got $actual_sha."
                    exit 1
                  fi
                elif [ "$checksum_status" = "404" ]; then
                  echo "::warning::mobile-dev-inc/Maestro cli-$MAESTRO_VERSION did not publish checksums_sha256.txt (404); proceeding on the TLS-verified download from the official GitHub release only."
                else
                  echo "::error::Failed to retrieve checksums_sha256.txt for cli-$MAESTRO_VERSION from '$checksum_url' (curl exit $checksum_curl_exit, HTTP status '$checksum_status'). Refusing to install an unverifiable download."
                  exit 1
                fi

                staging_dir="$(mktemp -d "$pinned_root/.staging-XXXXXX")"
                unzip -q "$zip_path" -d "$staging_dir"
                chmod +x "$staging_dir/maestro/bin/maestro" 2>/dev/null || true
                staged_version="$("$staging_dir/maestro/bin/maestro" --version 2>/dev/null | tail -n 1 | tr -d '\r' || true)"
                if [ "$staged_version" != "$MAESTRO_VERSION" ]; then
                  echo "::error::Extracted maestro from cli-$MAESTRO_VERSION's maestro.zip reports version '$staged_version', not the pinned $MAESTRO_VERSION; the release archive layout may have changed."
                  exit 1
                fi
                rm -rf "$pinned_dir"
                mkdir -p "$pinned_dir"
                mv "$staging_dir/maestro" "$pinned_dir/maestro"
              fi
            fi
          fi

          if [ ! -x "$pinned_bin" ]; then
            echo "::error::Expected a maestro binary at '$pinned_bin' after installing cli-$MAESTRO_VERSION; the install may have failed or been interrupted."
            exit 1
          fi
          resolved_version="$("$pinned_bin" --version 2>/dev/null | tail -n 1 | tr -d '\r' || true)"
          if [ "$resolved_version" != "$MAESTRO_VERSION" ]; then
            echo "::error::maestro at '$pinned_bin' reports version '$resolved_version', not the pinned $MAESTRO_VERSION."
            exit 1
          fi
          echo "$pinned_dir/maestro/bin" >> "$GITHUB_PATH"
          echo "Installed and using maestro $MAESTRO_VERSION at $pinned_bin"

    - name: Verify diagnostic tooling
      shell: bash
      run: command -v timeout >/dev/null 2>&1 || { echo "::error::'timeout' (GNU coreutils) is required to bound the adb diagnostic and teardown calls below but is not on PATH."; exit 1; }

    - name: Boot emulator, install app, and run Maestro shard
      id: run-shard
      uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
      env:
          APK_PATH: ${{ inputs.apk-path }}
          APP_ID: ${{ inputs.app-id }}
          FLOWS_DIR: ${{ inputs.flows-dir }}
          FLOWS_MAX_DEPTH: ${{ inputs.flows-max-depth }}
          FLOWS_NAME_PATTERN: ${{ inputs.flows-name-pattern }}
          FLOWS_EXCLUDE_PATTERN: ${{ inputs.flows-exclude-pattern }}
          SHARD_MANIFEST_DIR: ${{ inputs.shard-manifest-dir }}
          SHARD_INDEX: ${{ inputs.shard-index }}
          SHARD_COUNT: ${{ inputs.shard-count }}
          PRE_RUN_FLOW: ${{ inputs.pre-run-flow }}
          FLOW_RECOVERY_FLOW: ${{ inputs.flow-recovery-flow }}
          PRE_TEST_COMMAND: ${{ inputs.pre-test-command }}
          APP_WARM_SECONDS: ${{ inputs.app-warm-seconds }}
          MAESTRO_ENV: ${{ inputs.maestro-env }}
          FLOW_RETRIES: ${{ inputs.flow-retries }}
      with:
          api-level: ${{ inputs.api-level }}
          target: ${{ inputs.target }}
          arch: ${{ inputs.arch }}
          profile: ${{ inputs.profile }}
          disable-animations: true
          disable-spellchecker: true
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash "$GITHUB_ACTION_PATH/scripts/run-shard.sh"

    - name: Capture final device state
      if: always()
      shell: bash
      env:
        OUT_DIR: ${{ inputs.artifacts-dir }}
        SHARD_OUTCOME: ${{ steps.run-shard.outcome }}
      run: |
          mkdir -p "$OUT_DIR"
          timeout 30 adb exec-out screencap -p > "$OUT_DIR/final-screen.png" || true
          timeout 30 adb logcat -d > "$OUT_DIR/logcat-full.txt" 2>&1 || true
          timeout 30 adb logcat -d -b crash > "$OUT_DIR/logcat-crash.txt" 2>&1 || true
          if [ "$SHARD_OUTCOME" = "failure" ] && [ -n "${MAESTRO_DEBUG_SCRATCH_DIR:-}" ] && [ -d "$MAESTRO_DEBUG_SCRATCH_DIR" ] && [ -n "$(ls -A "$MAESTRO_DEBUG_SCRATCH_DIR" 2>/dev/null)" ]; then
            debug_size_kb=$(du -sck "$MAESTRO_DEBUG_SCRATCH_DIR" 2>/dev/null | tail -1 | awk '{print $1}')
            max_debug_kb=$((200 * 1024))
            if [ "${debug_size_kb:-0}" -gt "$max_debug_kb" ]; then
              echo "::warning::Maestro debug output for this shard is ${debug_size_kb}KB, exceeding the 200MB cap; skipping copy into artifacts."
            else
              mkdir -p "$OUT_DIR/maestro-debug"
              cp -R "$MAESTRO_DEBUG_SCRATCH_DIR/." "$OUT_DIR/maestro-debug/"
            fi
          fi
          if [ -n "${MAESTRO_DEBUG_SCRATCH_DIR:-}" ]; then
            rm -rf "$MAESTRO_DEBUG_SCRATCH_DIR" || true
          fi

    - name: Shutdown emulator
      if: always()
      shell: bash
      run: timeout 30 adb emu kill || true

    - name: Upload Maestro artifacts
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifacts-dir }}/**
          if-no-files-found: warn
          retention-days: ${{ inputs.retention-days }}
