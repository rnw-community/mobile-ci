name: capture-screenshots-android
description: >-
  Drives an already-booted Android device (Redroid container, AVD, or
  physical) over adb to capture one screenshot per locale x appearance x
  scene from a JSON scene manifest into a fixed
  raw/android/<device-slug>/<locale>/<appearance>/<scene>.png layout for
  store screenshot pipelines. Scene-manifest-driven (direct mode) only;
  device sizing is emulated via wm size / wm density.
inputs:
  android-serial:
    description: >-
      adb serial of an already-booted device this action drives. This action
      never manages the device lifecycle itself - pair it with
      redroid-container (mode start / mode teardown), android-emulator (mode
      start / mode stop) or your own bring-up. The device must run API 33+ (cmd locale set-app-locales);
      older API levels fail closed.
    required: true
  apk-path:
    description: Path to the packaged .apk to install.
    required: true
  app-id:
    description: Application ID the scenes are captured from.
    required: true
  scenes:
    description: >-
      JSON array of scene objects, each {"name", "deepLink", optional
      "settleSeconds", "platforms", "locales", "appearances"}. name must
      match ^[A-Za-z0-9_-]+$ and be unique. Scenes whose platforms filter excludes
      'android' are skipped; at least one scene must apply to android.
    required: true
  device-name:
    description: >-
      Free-form device label matching ^[A-Za-z0-9 ._-]+$, used only to
      derive the raw/android/<device-slug> output path segment (lowercased,
      every run of non-alphanumeric characters collapsed to a single
      hyphen). It selects nothing - the device is whatever android-serial points at.
    required: true
  width:
    description: Emulated display width in px, applied via `wm size <width>x<height>` before install.
    required: true
  height:
    description: Emulated display height in px, applied via `wm size <width>x<height>` before install.
    required: true
  density:
    description: Emulated display density in dpi, applied via `wm density` before install.
    required: true
  locales:
    description: >-
      Space- or comma-separated list of locale identifiers, e.g. 'en,de'.
      Each is applied per-app via `cmd locale set-app-locales` (fails
      closed), which is why API 33+ is required.
    required: true
  appearances:
    description: Space- or comma-separated list of 'light' and/or 'dark', applied via `cmd uimode night`.
    required: true
  seed-command:
    description: >-
      Optional consumer-owned shell command run once per
      locale x appearance x scene cell, from the repo root, with the app
      installed and force-stopped, before the scene's launch. Runs with
      SCENE, LOCALE, APPEARANCE, APP_ID, PLATFORM=android, DEVICE_SLUG,
      ANDROID_SERIAL, and APK_PATH in its environment. Its failure marks
      that cell failed (no capture, no retry) and the step fails at the end.
    required: false
    default: ''
  settle-seconds:
    description: >-
      Seconds (integer 0-120) to wait between a deep-link launch and its
      screenshot; a scene's own settleSeconds overrides it.
    required: false
    default: '3'
  status-bar-override:
    description: >-
      When 'true', verifies SystemUI demo mode and reapplies it per capture
      cell after appearance changes and seeding: clock 9:41,
      full wifi, no mobile data type, battery 100 unplugged, notifications
      hidden. Fails closed if demo mode is unavailable, does not become
      active within 10 seconds, or any settings command or broadcast fails.
    required: false
    default: 'true'
  output-dir:
    description: >-
      Root output directory. Screenshots are written to
      <output-dir>/raw/android/<device-slug>/<locale>/<appearance>/<scene>.png.
    required: true
outputs:
  device-slug:
    description: Slugified device-name, used as the raw/android/<device-slug> path segment.
    value: ${{ steps.device-slug.outputs.slug }}
  raw-dir:
    description: This run's output root - output-dir/raw/android/<device-slug>.
    value: ${{ inputs.output-dir }}/raw/android/${{ steps.device-slug.outputs.slug }}
runs:
  using: composite
  steps:
    - name: Configure screenshot output directory
      shell: bash
      env:
        OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          echo "OUTPUT_DIR=$OUTPUT_DIR" >> "$GITHUB_ENV"

    - name: Compute device slug
      id: device-slug
      shell: bash
      env:
        DEVICE_NAME: ${{ inputs.device-name }}
      run: |
          set -euo pipefail
          test -n "$DEVICE_NAME" || { echo "::error::device-name is required; it derives the raw/android/<device-slug> output path segment."; exit 1; }
          case "$DEVICE_NAME" in
            *[!A-Za-z0-9\ ._-]*)
              echo "::error::device-name '$DEVICE_NAME' must match ^[A-Za-z0-9 ._-]+\$."
              exit 1
              ;;
          esac
          slug=$(printf '%s' "$DEVICE_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          test -n "$slug" || { echo "::error::device-name '$DEVICE_NAME' slugified to an empty string."; exit 1; }
          rm -rf "$OUTPUT_DIR/raw/android/$slug"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

    - name: Validate scene manifest
      id: scenes
      shell: bash
      env:
        SCENES_JSON: ${{ inputs.scenes }}
        SETTLE_SECONDS: ${{ inputs.settle-seconds }}
      run: |
          set -euo pipefail
          case "$SETTLE_SECONDS" in
            ''|*[!0-9]*)
              echo "::error::settle-seconds '$SETTLE_SECONDS' must be a non-negative integer."
              exit 1
              ;;
          esac
          if [ "$SETTLE_SECONDS" -gt 120 ]; then
            echo "::error::settle-seconds '$SETTLE_SECONDS' must be at most 120."
            exit 1
          fi
          if [ -z "$SCENES_JSON" ]; then
            echo "::error::scenes is required."
            exit 1
          fi
          if ! jq empty <<< "$SCENES_JSON" 2>/dev/null; then
            echo "::error::scenes is not valid JSON."
            exit 1
          fi
          if [ "$(jq 'type' <<< "$SCENES_JSON")" != '"array"' ]; then
            echo "::error::scenes must be a JSON array."
            exit 1
          fi
          if [ "$(jq 'length' <<< "$SCENES_JSON")" -lt 1 ]; then
            echo "::error::scenes must have at least one entry."
            exit 1
          fi
          non_objects=$(jq -c '[.[] | select(type != "object")]' <<< "$SCENES_JSON")
          if [ "$non_objects" != '[]' ]; then
            echo "::error::scenes has non-object entries: $non_objects"
            exit 1
          fi
          invalid=$(jq -c '
              [.[] | select(
                  ((.name // "") | (type != "string") or (test("^[A-Za-z0-9_-]+$") | not)) or
                  ((.deepLink // "") | (type != "string") or . == "") or
                  (has("settleSeconds") and ((.settleSeconds | type) != "number" or (.settleSeconds | floor) != .settleSeconds or .settleSeconds < 0 or .settleSeconds > 120)) or
                  (has("platforms") and ((.platforms | type) != "array" or (.platforms | length) == 0 or any(.platforms[]; . != "ios" and . != "android"))) or
                  (has("locales") and ((.locales | type) != "array" or (.locales | length) == 0 or any(.locales[]; (type != "string") or (test("^[A-Za-z0-9_-]+$") | not)))) or
                  (has("appearances") and ((.appearances | type) != "array" or (.appearances | length) == 0 or any(.appearances[]; . != "light" and . != "dark")))
              )]
          ' <<< "$SCENES_JSON")
          if [ "$invalid" != '[]' ]; then
            echo "::error::scenes has invalid entries (each needs a unique 'name' matching ^[A-Za-z0-9_-]+\$, a non-empty 'deepLink', optional integer 'settleSeconds' 0-120, optional non-empty 'platforms' subset of [\"ios\",\"android\"], optional non-empty 'locales' of ^[A-Za-z0-9_-]+\$ strings, optional non-empty 'appearances' subset of [\"light\",\"dark\"]): $invalid"
            exit 1
          fi
          duplicate_names=$(jq -r '[.[].name] | group_by(.) | map(select(length > 1)[0]) | join(", ")' <<< "$SCENES_JSON")
          if [ -n "$duplicate_names" ]; then
            echo "::error::scenes has duplicate scene names ($duplicate_names); each name is an output path segment and must be unique."
            exit 1
          fi
          selected=$(jq -c '[.[] | select(if has("platforms") then (.platforms | index("android")) != null else true end)]' <<< "$SCENES_JSON")
          if [ "$(jq 'length' <<< "$selected")" -lt 1 ]; then
            echo "::error::no scene in scenes applies to platform 'android' - every scene's platforms filter excludes it."
            exit 1
          fi

    - name: Prepare device (API guard, wm size/density)
      shell: bash
      env:
        ANDROID_SERIAL: ${{ inputs.android-serial }}
        DISPLAY_WIDTH: ${{ inputs.width }}
        DISPLAY_HEIGHT: ${{ inputs.height }}
        DISPLAY_DENSITY: ${{ inputs.density }}
      run: |
          set -euo pipefail
          command -v adb >/dev/null 2>&1 || { echo "::error::'adb' is required but is not on PATH."; exit 1; }
          test -n "$ANDROID_SERIAL" || { echo "::error::android-serial is required; this action drives an already-booted device and never boots one itself."; exit 1; }
          for dim in "$DISPLAY_WIDTH" "$DISPLAY_HEIGHT" "$DISPLAY_DENSITY"; do
            case "$dim" in
              ''|*[!0-9]*|0*)
                echo "::error::width/height/density must each be a positive integer without leading zeros; got width='$DISPLAY_WIDTH' height='$DISPLAY_HEIGHT' density='$DISPLAY_DENSITY'."
                exit 1
                ;;
            esac
          done
          sdk=$(adb -s "$ANDROID_SERIAL" shell getprop ro.build.version.sdk </dev/null | tr -d '[:space:]')
          case "$sdk" in
            ''|*[!0-9]*)
              echo "::error::Could not read ro.build.version.sdk from '$ANDROID_SERIAL' (got '$sdk'); is the device booted and adb-reachable?"
              exit 1
              ;;
          esac
          if [ "$sdk" -lt 33 ]; then
            echo "::error::Device '$ANDROID_SERIAL' runs API level $sdk, but per-app locales ('cmd locale set-app-locales') require API 33+. Use a newer image."
            exit 1
          fi
          adb -s "$ANDROID_SERIAL" shell wm size "${DISPLAY_WIDTH}x${DISPLAY_HEIGHT}"
          adb -s "$ANDROID_SERIAL" shell wm density "$DISPLAY_DENSITY"

    - name: Install APK
      shell: bash
      env:
        ANDROID_SERIAL: ${{ inputs.android-serial }}
        APK_PATH: ${{ inputs.apk-path }}
      run: |
          set -euo pipefail
          test -f "$APK_PATH" || { echo "::error::apk-path '$APK_PATH' is not a file."; exit 1; }
          adb -s "$ANDROID_SERIAL" install -r "$APK_PATH"

    - name: Run screenshot capture matrix
      shell: bash
      env:
        ANDROID_SERIAL: ${{ inputs.android-serial }}
        APK_PATH: ${{ inputs.apk-path }}
        APP_ID: ${{ inputs.app-id }}
        SCENES_JSON: ${{ inputs.scenes }}
        CAPTURE_LOCALES: ${{ inputs.locales }}
        CAPTURE_APPEARANCES: ${{ inputs.appearances }}
        SEED_COMMAND: ${{ inputs.seed-command }}
        SETTLE_SECONDS: ${{ inputs.settle-seconds }}
        DEVICE_SLUG: ${{ steps.device-slug.outputs.slug }}
        STATUS_BAR_OVERRIDE: ${{ inputs.status-bar-override }}
      run: |
          set -euo pipefail
          case "$STATUS_BAR_OVERRIDE" in
            true|false) ;;
            *) echo "::error::status-bar-override must be 'true' or 'false'."; exit 1 ;;
          esac

          locales_list=$(printf '%s' "$CAPTURE_LOCALES" | tr ',\n\t' '   ')
          appearances_list=$(printf '%s' "$CAPTURE_APPEARANCES" | tr ',\n\t' '   ')
          IFS=' ' read -r -a locales_arr <<< "$locales_list"
          IFS=' ' read -r -a appearances_arr <<< "$appearances_list"
          if [ "${#locales_arr[@]}" -eq 0 ]; then
            echo "::error::locales resolved to an empty list."
            exit 1
          fi
          if [ "${#appearances_arr[@]}" -eq 0 ]; then
            echo "::error::appearances resolved to an empty list."
            exit 1
          fi
          # locale becomes a raw output path segment below - reject anything
          # that could traverse out of that layout instead of writing
          # wherever it resolves to.
          for locale in "${locales_arr[@]}"; do
            case "$locale" in
              *[!A-Za-z0-9_-]*|'')
                echo "::error::locale '$locale' must be a non-empty path-safe segment matching ^[A-Za-z0-9_-]+\$."
                exit 1
                ;;
            esac
          done

          scene_count_total=$(jq 'length' <<< "$SCENES_JSON")
          sel_names=()
          sel_deeplinks=()
          sel_settles=()
          sel_locale_filters=()
          sel_appearance_filters=()
          i=0
          while [ "$i" -lt "$scene_count_total" ]; do
            scene=$(jq -c ".[$i]" <<< "$SCENES_JSON")
            if [ "$(jq -r 'if has("platforms") then ((.platforms | index("android")) != null) else true end' <<< "$scene")" = 'true' ]; then
              sel_names+=("$(jq -r '.name' <<< "$scene")")
              sel_deeplinks+=("$(jq -r '.deepLink // ""' <<< "$scene")")
              sel_settles+=("$(jq -r 'if has("settleSeconds") then .settleSeconds else -1 end' <<< "$scene")")
              sel_locale_filters+=("$(jq -r '(.locales // []) | join(",")' <<< "$scene")")
              sel_appearance_filters+=("$(jq -r '(.appearances // []) | join(",")' <<< "$scene")")
            fi
            i=$((i + 1))
          done
          if [ "${#sel_names[@]}" -eq 0 ]; then
            echo "::error::no scene in scenes applies to platform 'android'."
            exit 1
          fi
          printf 'Selected android scene list (%s total): %s\n' "${#sel_names[@]}" "${sel_names[*]}"

          in_filter() {
            case ",$2," in
              ,,) return 0 ;;
              *",$1,"*) return 0 ;;
              *) return 1 ;;
            esac
          }

          apply_status_bar() {
            [ "$STATUS_BAR_OVERRIDE" = true ] || return 0
            adb -s "$ANDROID_SERIAL" shell settings put global sysui_demo_allowed 1 || return 1
            adb -s "$ANDROID_SERIAL" shell settings put global sysui_tuner_demo_on 1 || return 1
            local state attempt=0
            while [ "$attempt" -lt 10 ]; do
              state=$(adb -s "$ANDROID_SERIAL" shell dumpsys activity service com.android.systemui/.SystemUIService DemoModeController) || return 1
              if grep -q 'isDemoModeAllowed=true' <<EOF && grep -q 'isInDemoMode=true' <<EOF; then
          $state
          EOF
          $state
          EOF
                demo -e command clock -e hhmm 0941 || return 1
                demo -e command network -e wifi show -e level 4 -e fully true || return 1
                demo -e command network -e mobile show -e datatype none -e level 4 || return 1
                demo -e command battery -e level 100 -e plugged false || return 1
                demo -e command notifications -e visible false || return 1
                return 0
              fi
              attempt=$((attempt + 1))
              sleep 1
            done
            echo "::error::SystemUI did not enter demo mode within 10 seconds; refusing an unchecked status bar. Set status-bar-override: 'false' for devices without demo support."
            printf '%s\n' "$state"
            return 1
          }
          demo() {
            adb -s "$ANDROID_SERIAL" shell am broadcast -a com.android.systemui.demo "$@" >/dev/null
          }

          capture_deeplink_cell() {
            local deep_link="$1" settle="$2" final_path="$3" launch_output
            if ! launch_output=$(adb -s "$ANDROID_SERIAL" shell am start -W -a android.intent.action.VIEW -d "$deep_link" "$APP_ID" 2>&1); then
              printf '%s\n' "$launch_output"
              echo "'am start' failed for deep link '$deep_link'."
              return 1
            fi
            printf '%s\n' "$launch_output"
            if grep -qE '^(Error|Exception|java\.lang\.)' <<EOF; then
          $launch_output
          EOF
              echo "Deep-link launch for '$deep_link' reported an error."
              return 1
            fi
            sleep "$settle"
            if ! adb -s "$ANDROID_SERIAL" exec-out screencap -p > "$final_path"; then
              echo "'screencap' failed for '$final_path'."
              return 1
            fi
            if [ ! -s "$final_path" ]; then
              echo "'screencap' produced an empty file at '$final_path'."
              return 1
            fi
          }

          summary_rows=()
          overall_status=0
          max_attempts=2

          for locale in "${locales_arr[@]}"; do
            if ! adb -s "$ANDROID_SERIAL" shell cmd locale set-app-locales "$APP_ID" --user 0 --locales "$locale"; then
              echo "::error::'cmd locale set-app-locales' failed for app '$APP_ID', locale '$locale'."
              exit 1
            fi
            for appearance in "${appearances_arr[@]}"; do
              case "$appearance" in
                light) night_mode=no ;;
                dark) night_mode=yes ;;
                *)
                  echo "::error::appearance '$appearance' must be 'light' or 'dark'."
                  exit 1
                  ;;
              esac
              if ! adb -s "$ANDROID_SERIAL" shell cmd uimode night "$night_mode"; then
                echo "::error::'cmd uimode night $night_mode' failed."
                exit 1
              fi
              for idx in "${!sel_names[@]}"; do
                scene_name="${sel_names[$idx]}"
                deep_link="${sel_deeplinks[$idx]}"
                scene_settle="${sel_settles[$idx]}"
                in_filter "$locale" "${sel_locale_filters[$idx]}" || continue
                in_filter "$appearance" "${sel_appearance_filters[$idx]}" || continue
                settle="$SETTLE_SECONDS"
                if [ "$scene_settle" -ge 0 ]; then
                  settle="$scene_settle"
                fi
                final_path="$OUTPUT_DIR/raw/android/$DEVICE_SLUG/$locale/$appearance/${scene_name}.png"
                mkdir -p "$(dirname "$final_path")"
                start=$(date +%s)
                attempts=0
                status=failed
                adb -s "$ANDROID_SERIAL" shell am force-stop "$APP_ID"
                if [ -n "$SEED_COMMAND" ]; then
                  if ! (
                    export SCENE="$scene_name" LOCALE="$locale" APPEARANCE="$appearance" PLATFORM=android
                    eval "$SEED_COMMAND"
                  ); then
                    echo "::error::seed-command failed for scene '$scene_name' (locale=$locale, appearance=$appearance); marking the cell failed without capture."
                    status=seed-failed
                  fi
                fi
                if [ "$status" != 'seed-failed' ]; then
                  while [ "$attempts" -lt "$max_attempts" ]; do
                    attempts=$((attempts + 1))
                    if [ "$attempts" -gt 1 ]; then
                      adb -s "$ANDROID_SERIAL" shell am force-stop "$APP_ID" || true
                    fi
                    if ! apply_status_bar; then
                      echo "::error::Could not apply the demo status bar for '$scene_name' ($locale/$appearance)."
                      exit 1
                    fi
                    if capture_deeplink_cell "$deep_link" "$settle" "$final_path"; then
                      status=passed
                      break
                    fi
                  done
                fi
                end=$(date +%s)
                duration=$((end - start))
                if [ "$status" != 'passed' ]; then
                  overall_status=1
                fi
                summary_rows+=("| $locale | $appearance | $scene_name | ${duration}s | $status | $attempts |")
              done
            done
          done

          {
            echo "### Screenshot capture timing (android/$DEVICE_SLUG)"
            echo "| Locale | Appearance | Scene | Duration | Status | Attempts |"
            echo "| --- | --- | --- | --- | --- | --- |"
            printf '%s\n' "${summary_rows[@]:-}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${#summary_rows[@]}" -eq 0 ]; then
            echo "::error::zero capture cells ran: the per-scene locales/appearances filters excluded every selected scene from the global locale/appearance matrix."
            exit 1
          fi
          exit "$overall_status"
