# Public Expo app: a tester-army e2e suite on every pull request, iOS and
# Android, on devices leased from a simlock farm instead of Maestro on local
# simulators and emulators. Copy to .github/workflows/e2e.yml in the app
# repository, in place of e2e.yml.
#
# The plan, build and repack legs are e2e.yml's. The suite lives in its own
# project, e2e/ (package.json, lockfile, e2e.config.ts, tests), whose config
# leases devices with @mobile-ci/e2e-simlock; each workflow installs that
# package from its own tag. See docs/workflows/ios-maestro.md#e2e-suite-on-simlock.
name: E2E

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

permissions: {}

jobs:
    ios:
        permissions:
            contents: read
            packages: write
            actions: read
        uses: rnw-community/mobile-ci/.github/workflows/ios-maestro.yml@v4.8.0 # v4.8.0
        with:
            targets: >-
                [{"name":"app","appDir":"apps/mobile","workspace":"MyApp.xcworkspace","scheme":"MyApp","appId":"com.example.myapp","prebuildCommand":"npx expo prebuild -p ios"}]
            install-command: pnpm install --frozen-lockfile
            fingerprint-config: fingerprint.config.js
            test-framework: e2e
            e2e-dir: e2e
            e2e-workers: '4'
            # The farm's public HTTPS address: a LAN address reaches only the
            # runners on that LAN.
            simlock-url: https://simlock.vitaliiyehorov.dev
        secrets:
            simlock-token: ${{ secrets.SIMLOCK_TOKEN }}

    android:
        permissions:
            contents: read
            packages: write
            actions: read
        uses: rnw-community/mobile-ci/.github/workflows/android-maestro.yml@v4.8.0 # v4.8.0
        with:
            targets: >-
                [{"name":"app","appDir":"apps/mobile","appId":"com.example.myapp","prebuildCommand":"npx expo prebuild -p android"}]
            install-command: pnpm install --frozen-lockfile
            fingerprint-config: fingerprint.config.js
            test-framework: e2e
            e2e-dir: e2e
            e2e-workers: '2'
            simlock-url: https://simlock.vitaliiyehorov.dev
            # The farm's emulators are arm64-v8a; warm-up.yml must pass the same.
            android-abis: arm64-v8a
        secrets:
            simlock-token: ${{ secrets.SIMLOCK_TOKEN }}
