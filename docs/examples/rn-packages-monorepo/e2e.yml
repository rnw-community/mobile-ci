# Monorepo of React Native packages, each with a bare and an Expo example app
# and its own Maestro suite. Copy to .github/workflows/e2e.yml.
#
# One reusable-workflow call per platform covers every package: each targets[]
# entry names its own flowsDir, and optionally tolerateTestFailures and
# buildStrategy; whatever an entry leaves out comes from the call's input.
#
# - Bare (non-Expo) apps set buildStrategy: native. The repack path needs an
#   Expo app, so a bare target is always compiled, and never publishes a base.
# - Quarantine: tolerateTestFailures keeps one target's Maestro failure from
#   failing the job and reports it as a warning instead; every other target
#   still gates the pull request. Time-box it: link the issue and drop the
#   field when it is fixed.
# - Gating: the call runs when turbo reports any target's package affected
#   (target-packages defaults to the name in each target's package.json), and
#   then runs every target. To skip unaffected packages instead, call the
#   workflow once per package in a matrix with call-scope: <package>, so the
#   calls' artifacts and concurrency groups stay apart.
# - Android emulators: every Android target shard boots its own emulator. To
#   cap how many run on one host at once, across calls and repositories, set
#   emulator-slots-dir once the fleet provisions slot files.
name: E2E

on:
    pull_request:
    push:
        branches: [main]
    schedule:
        - cron: '17 3 * * *'
    workflow_dispatch:

permissions: {}

jobs:
    ios:
        permissions:
            contents: read
            packages: write
            actions: read
        uses: rnw-community/mobile-ci/.github/workflows/ios-maestro.yml@v4.4.2 # v4.4.2
        with:
            targets: >-
                [
                  {"name":"payments-bare","appDir":"packages/react-native-payments-example/apps/bare","workspace":"Example.xcworkspace","scheme":"Example","appId":"com.example.payments","prebuildCommand":"","flowsDir":"packages/react-native-payments-example/e2e/flows","buildStrategy":"native"},
                  {"name":"payments-expo","appDir":"packages/react-native-payments-example/apps/expo","workspace":"Example.xcworkspace","scheme":"Example","appId":"com.example.payments","prebuildCommand":"npx expo prebuild -p ios","flowsDir":"packages/react-native-payments-example/e2e/flows"},
                  {"name":"collapsible-header-expo","appDir":"packages/react-native-collapsible-header-example/apps/expo","workspace":"Example.xcworkspace","scheme":"Example","appId":"com.example.collapsibleheader","prebuildCommand":"npx expo prebuild -p ios","flowsDir":"packages/react-native-collapsible-header-example/e2e/flows"},
                  {"name":"screen-chrome-expo","appDir":"packages/react-native-screen-chrome-example/apps/expo","workspace":"Example.xcworkspace","scheme":"Example","appId":"com.example.screenchrome","prebuildCommand":"npx expo prebuild -p ios","flowsDir":"packages/react-native-screen-chrome-example/e2e/flows","tolerateTestFailures":true}
                ]
            install-command: pnpm install --frozen-lockfile
            build-command: pnpm build --filter='./packages/*'
            exempt-paths: |
                **/*.md
                docs/**

    android:
        permissions:
            contents: read
            packages: write
            actions: read
        uses: rnw-community/mobile-ci/.github/workflows/android-maestro.yml@v4.4.2 # v4.4.2
        with:
            targets: >-
                [
                  {"name":"payments-bare","appDir":"packages/react-native-payments-example/apps/bare","appId":"com.example.payments","prebuildCommand":"","flowsDir":"packages/react-native-payments-example/e2e/flows","buildStrategy":"native"},
                  {"name":"payments-expo","appDir":"packages/react-native-payments-example/apps/expo","appId":"com.example.payments","prebuildCommand":"npx expo prebuild -p android","flowsDir":"packages/react-native-payments-example/e2e/flows"},
                  {"name":"collapsible-header-expo","appDir":"packages/react-native-collapsible-header-example/apps/expo","appId":"com.example.collapsibleheader","prebuildCommand":"npx expo prebuild -p android","flowsDir":"packages/react-native-collapsible-header-example/e2e/flows"},
                  {"name":"screen-chrome-expo","appDir":"packages/react-native-screen-chrome-example/apps/expo","appId":"com.example.screenchrome","prebuildCommand":"npx expo prebuild -p android","flowsDir":"packages/react-native-screen-chrome-example/e2e/flows","tolerateTestFailures":true}
                ]
            install-command: pnpm install --frozen-lockfile
            build-command: pnpm build --filter='./packages/*'
            exempt-paths: |
                **/*.md
                docs/**
