# Monorepo of React Native packages, each with a bare and an Expo example app
# and its own e2e suite. Copy to .github/workflows/e2e.yml.
#
# One reusable-workflow call per platform covers every package: each targets[]
# entry optionally names tolerateTestFailures and buildStrategy; whatever an entry leaves out comes from the call's input.
#
# - Bare (non-Expo) apps set buildStrategy: native. The repack path needs an
#   Expo app, so a bare target is always compiled, and never publishes a base.
# - Quarantine: tolerateTestFailures keeps one target's suite failure from
#   failing the job and reports it as a warning instead; every other target
#   still gates the pull request. Time-box it: link the issue and drop the
#   field when it is fixed.
# - Gating: the call runs when turbo reports any target's package affected
#   (target-packages defaults to the name in each target's package.json), and
#   then runs every target. To skip unaffected packages instead, call the
#   workflow once per package in a matrix with call-scope: <package>, so the
#   calls' artifacts and concurrency groups stay apart.
name: E2E

on:
    pull_request:
    push:
        branches: [main]
    schedule:
        - cron: '17 3 * * *'
    workflow_dispatch:

permissions: {}

jobs:
    ios:
        permissions:
            contents: read
            packages: write
            actions: read
        uses: rnw-community/mobile-ci/.github/workflows/ios-e2e.yml@v5.0.0 # v5.0.0
        with:
            e2e-dir: e2e
            simlock-url: https://simlock.example.com
            targets: >-
                [
                  {"name":"payments-bare","appDir":"packages/react-native-payments-example/apps/bare","workspace":"Example.xcworkspace","scheme":"Example","appId":"com.example.payments","prebuildCommand":"","buildStrategy":"native"},
                  {"name":"payments-expo","appDir":"packages/react-native-payments-example/apps/expo","workspace":"Example.xcworkspace","scheme":"Example","appId":"com.example.payments","prebuildCommand":"npx expo prebuild -p ios"},
                  {"name":"collapsible-header-expo","appDir":"packages/react-native-collapsible-header-example/apps/expo","workspace":"Example.xcworkspace","scheme":"Example","appId":"com.example.collapsibleheader","prebuildCommand":"npx expo prebuild -p ios"},
                  {"name":"screen-chrome-expo","appDir":"packages/react-native-screen-chrome-example/apps/expo","workspace":"Example.xcworkspace","scheme":"Example","appId":"com.example.screenchrome","prebuildCommand":"npx expo prebuild -p ios","tolerateTestFailures":true}
                ]
            install-command: pnpm install --frozen-lockfile
            build-command: pnpm build --filter='./packages/*'
            exempt-paths: |
                **/*.md
                docs/**
        secrets:
            simlock-token: ${{ secrets.SIMLOCK_TOKEN }}

    android:
        permissions:
            contents: read
            packages: write
            actions: read
        uses: rnw-community/mobile-ci/.github/workflows/android-e2e.yml@v5.0.0 # v5.0.0
        with:
            e2e-dir: e2e
            simlock-url: https://simlock.example.com
            targets: >-
                [
                  {"name":"payments-bare","appDir":"packages/react-native-payments-example/apps/bare","appId":"com.example.payments","prebuildCommand":"","buildStrategy":"native"},
                  {"name":"payments-expo","appDir":"packages/react-native-payments-example/apps/expo","appId":"com.example.payments","prebuildCommand":"npx expo prebuild -p android"},
                  {"name":"collapsible-header-expo","appDir":"packages/react-native-collapsible-header-example/apps/expo","appId":"com.example.collapsibleheader","prebuildCommand":"npx expo prebuild -p android"},
                  {"name":"screen-chrome-expo","appDir":"packages/react-native-screen-chrome-example/apps/expo","appId":"com.example.screenchrome","prebuildCommand":"npx expo prebuild -p android","tolerateTestFailures":true}
                ]
            install-command: pnpm install --frozen-lockfile
            build-command: pnpm build --filter='./packages/*'
            exempt-paths: |
                **/*.md
                docs/**
        secrets:
            simlock-token: ${{ secrets.SIMLOCK_TOKEN }}
